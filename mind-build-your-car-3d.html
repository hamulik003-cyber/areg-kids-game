<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Կառուցիր քո մեքենան 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#183c56;color:white}#app{height:100dvh;max-width:750px;margin:auto;display:flex;flex-direction:column;gap:7px;padding:8px}#hud{display:flex;justify-content:space-between;align-items:center;gap:7px;font-weight:900}#hud span{background:linear-gradient(#fff2d1,#d6a36e);border:3px solid #b47c47;border-radius:13px;color:#724422;padding:9px}#hud b{text-align:center;font-size:14px}#view{position:relative;flex:1;min-height:230px;border:5px solid #c9965e;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#a6d5e1,#4e8ea5 60%,#244e6b)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#tip{position:absolute;left:8px;right:8px;top:9px;text-align:center;font-size:13px;font-weight:850;text-shadow:0 2px 5px #0008;pointer-events:none}#parts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}button{font:800 12px system-ui;cursor:pointer}#parts button,#actions button{background:linear-gradient(#fff2d0,#d7a36d);color:#714320;border:3px solid #ffe3b2;border-bottom:5px solid #9f6838;border-radius:14px;padding:8px 2px;min-height:53px}#parts button.active{background:linear-gradient(#e4ffe0,#85d88b);border-color:#e4ffd0;color:#236237}#actions{display:flex;gap:6px}#actions button{flex:1;min-height:44px}#actions #drive{background:linear-gradient(#bbff99,#3cbb5e);color:#185d32;border-color:#d7ffc3}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#102a43d1;padding:20px}#overlay.show{display:flex}.modal{text-align:center;max-width:350px;background:linear-gradient(#fff2d3,#e0ad75);border:7px solid #a66d3d;border-radius:24px;padding:25px;color:#71431f}.award{font-size:72px}.modal h2{margin:10px 0 20px}#next{font-size:17px;border:3px solid #d6ffbc;border-radius:14px;background:linear-gradient(#bdff9c,#41bb5d);color:#185b31;padding:12px 25px}@media(max-height:670px){#app{gap:4px}#parts button{min-height:40px;padding:4px 2px}#actions button{min-height:34px;padding:4px}}</style></head><body><div id="app"><div id="hud"><span id="phase">Փուլ 1 / 5</span><b>Կառուցիր քո մեքենան 3D</b><span id="count">0 / 5</span></div><div id="view"><div id="tip">Ընտրիր մասը, ապա սեղմիր մեքենայի լուսավորված տեղը</div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="message">Մեքենան պատրաստ է</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="parts"><button data-part="body">🚙 Թափք</button><button data-part="roof">🚘 Տանիք</button><button data-part="front">⚙️ Առջևի</button><button data-part="back">⚙️ Հետևի</button><button data-part="lights">💡 Լույսեր</button></div><div id="actions"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="drive">▶ Վարել</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeafaff,0x325c74,2.5));const light=new THREE.DirectionalLight(0xffe5b5,3.4);light.position.set(-5,8,7);scene.add(light);const rim=new THREE.DirectionalLight(0x9deaff,1.5);rim.position.set(4,4,-6);scene.add(rim);
const root=new THREE.Group();scene.add(root);const palette=[0xf07176,0x56bcd6,0xf2bc5e,0x92d4a2,0xab95e8],paint=new THREE.MeshStandardMaterial({color:palette[0],metalness:.3,roughness:.29}),glass=new THREE.MeshStandardMaterial({color:0x8ad9e6,metalness:.25,roughness:.19}),rubber=new THREE.MeshStandardMaterial({color:0x2b3643,roughness:.78}),metal=new THREE.MeshStandardMaterial({color:0xd8e3e5,metalness:.72,roughness:.24}),lightMat=new THREE.MeshStandardMaterial({color:0xffe8aa,emissive:0xffc565,emissiveIntensity:.7}),roadMat=new THREE.MeshStandardMaterial({color:0x586a79,roughness:.88}),ghostMat=new THREE.MeshStandardMaterial({color:0xfbe7b7,transparent:true,opacity:.27,emissive:0x6d5521,emissiveIntensity:.15});
function box(parent,w,h,d,material,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);parent.add(m);return m}
const road=box(root,14,.14,5,roadMat,0,-1.63,0);for(let x=-6;x<7;x+=2.3)box(root,1.25,.02,.08,metal,x,-1.54,1.6);
const car=new THREE.Group();root.add(car);car.position.y=-.08;const partsOrder=['body','roof','front','back','lights'],sockets={},installed={},history=[];let stage=0,selected='body',driving=false,driveTime=0,won=false;
const spots={body:[0,-.35,0],roof:[-.25,.45,0],front:[1.28,-.97,0],back:[-1.35,-.97,0],lights:[1.7,-.4,0]};
function wheel(x){const g=new THREE.Group();g.position.set(x,-.94,0);for(const z of [-.87,.87]){const tire=new THREE.Mesh(new THREE.CylinderGeometry(.53,.53,.25,28),rubber);tire.rotation.x=Math.PI/2;tire.position.z=z;g.add(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.26,24),metal);hub.rotation.x=Math.PI/2;hub.position.z=z;g.add(hub)}return g}
function makePart(name){const g=new THREE.Group();if(name==='body'){box(g,3.9,.85,1.65,paint,0,0,0);box(g,4,.18,1.72,metal,0,-.44,0)}else if(name==='roof'){box(g,2.05,.84,1.45,paint,-.3,.1,0);box(g,1.83,.55,.035,glass,-.29,.1,.745);box(g,1.83,.55,.035,glass,-.29,.1,-.745)}else if(name==='front'||name==='back'){g.add(wheel(0))}else{for(const z of [-.57,.57]){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.18,18,14),lightMat);lamp.position.set(0,0,z);g.add(lamp)}}return g}
for(const name of partsOrder){const s=new THREE.Mesh(new THREE.SphereGeometry(.27,20,14),ghostMat.clone());s.position.set(...spots[name]);s.userData.part=name;car.add(s);sockets[name]=s}
function choose(name){selected=name;document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('active',b.dataset.part===name));$('#tip').textContent='Սեղմիր մեքենայի լուսավորված տեղը՝ «'+({body:'Թափք',roof:'Տանիք',front:'Առջևի անիվներ',back:'Հետևի անիվներ',lights:'Լույսեր'})[name]+'» տեղադրելու համար'}
function reset(){for(const p of Object.values(installed))car.remove(p);for(const k of Object.keys(installed))delete installed[k];history.length=0;driving=false;driveTime=0;won=false;car.position.set(0,-.08,0);car.rotation.set(0,0,0);paint.color.setHex(palette[stage]);for(const s of Object.values(sockets))s.visible=true;$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#count').textContent='0 / 5';choose('body')}
function put(name){if(driving||won||installed[name])return;const p=makePart(name);p.position.set(...spots[name]);car.add(p);installed[name]=p;history.push(name);sockets[name].visible=false;$('#count').textContent=history.length+' / 5';const next=partsOrder.find(n=>!installed[n]);if(next)choose(next);else $('#tip').textContent='Մեքենան պատրաստ է․ սեղմիր «Վարել»'}
document.querySelectorAll('#parts button').forEach(b=>b.onclick=()=>choose(b.dataset.part));
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(driving||won)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(Object.values(sockets).filter(s=>s.visible),false)[0];if(hit){if(hit.object.userData.part===selected)put(selected);else $('#tip').textContent='Ընտրիր համապատասխան լուսավորված տեղը'}});
$('#undo').onclick=()=>{if(driving||!history.length)return;const name=history.pop();car.remove(installed[name]);delete installed[name];sockets[name].visible=true;$('#count').textContent=history.length+' / 5';choose(name)};$('#hint').onclick=()=>{const s=sockets[selected];if(!s.visible)return;s.scale.setScalar(1.7);setTimeout(()=>s.scale.setScalar(1),750)};$('#reset').onclick=reset;$('#next').onclick=()=>{stage=(stage+1)%5;reset()};$('#drive').onclick=()=>{if(driving||won)return;if(history.length!==5){$('#tip').textContent='Նախ հավաքիր մեքենայի բոլոր 5 մասերը';return}driving=true;driveTime=0;$('#tip').textContent='Քո մեքենան շարժվում է ճանապարհով'};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const tan=Math.tan(THREE.MathUtils.degToRad(17.5));camera.position.set(6,4.6,Math.max(11,6/(tan*Math.min(1,camera.aspect))));camera.lookAt(0,-.1,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let last=0;function tick(now){requestAnimationFrame(tick);const dt=Math.min(.045,(now-last||16)/1000);last=now;if(driving){driveTime+=dt;car.position.x=Math.sin(driveTime*1.6)*1.7;car.position.y=-.08+Math.abs(Math.sin(driveTime*8))*.04;car.rotation.y=Math.sin(driveTime*1.4)*.16;if(driveTime>4){driving=false;won=true;$('#award').textContent=stage===4?'🏆':'⭐';$('#message').textContent=stage===4?'Բոլոր մեքենաները կառուցված են':'Քո մեքենան պատրաստ է ճանապարհին';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')}}renderer.render(scene,camera)}reset();requestAnimationFrame(tick);
</script></body></html>
