<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#dcb68b"><title>AREG • Գտիր ճիշտ ձևը · 6 փուլ</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#653c25}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#e9c9a2}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #347cc0}#app{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);gap:10px;max-width:650px;margin:auto;background:radial-gradient(ellipse at 50% 25%,#fff1d8,#e5bf92 65%,#ba865b);box-shadow:0 0 60px #70402455}
header{display:grid;grid-template-columns:55px 1fr 83px;gap:9px;height:64px}.wood{border:2px solid #b57d4b;border-bottom:5px solid #995c32;border-radius:17px;background:linear-gradient(165deg,#ffecbe 0%,#f1c88c 56%,#d59a61 100%);box-shadow:inset 0 2px #fff9,0 3px 7px #78472433;color:#70411f;font-weight:850}.wood:active{transform:translateY(2px);border-bottom-width:3px}.back{font-size:28px}.brand{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(15px,4.4vw,22px);line-height:1.18}.brand small{font-size:10px;letter-spacing:1.4px;color:#996c43}.stars{font-size:19px}
.status{display:flex;justify-content:center;gap:12px}.chip{background:#fff5de;border:2px solid #dfb682;border-radius:50px;padding:8px 16px;font-size:14px;font-weight:850;box-shadow:0 3px 7px #7b4b2920}
.scene-wrap{position:relative;flex:1;min-height:300px;max-height:650px;border:5px solid #cf9c68;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#fff6df 5%,#eacda8 60%,#d4aa80);box-shadow:inset 0 2px 13px #84582b3d,0 6px 12px #794b2e30;isolation:isolate}
.nursery{position:absolute;inset:0;pointer-events:none;opacity:.8;background:radial-gradient(ellipse 42% 11% at 52% 91%,#b89371 0%,#e6cba9 67%,transparent 69%),linear-gradient(0deg,#d3aa7d 0 22%,transparent 22%),radial-gradient(ellipse 15% 32% at 93% 58%,#e2b588 10%,transparent 70%),radial-gradient(ellipse 14% 28% at 7% 53%,#d5ac82 10%,transparent 75%)}.nursery:before{content:"";position:absolute;left:6%;top:14%;width:12%;height:34%;border-radius:40px 40px 12px 12px;background:#d1a67b55;filter:blur(8px)}.nursery:after{content:"";position:absolute;right:8%;top:17%;width:17%;height:28%;border-radius:60px;background:#c8a57f44;filter:blur(10px)}
#view{position:absolute;inset:0;touch-action:none;z-index:2}#view canvas{display:block;width:100%;height:100%;touch-action:none}
#tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis;z-index:4;font-size:11px;font-weight:750;color:#805637;background:#fff4dfd9;padding:7px 11px;border-radius:30px;pointer-events:none}
#message{position:absolute;bottom:11px;left:9%;right:9%;z-index:4;text-align:center;font-size:12px;font-weight:850;color:#7a4a29;text-shadow:0 1px #fff;background:#fff0d9dc;border-radius:15px;padding:6px 8px;pointer-events:none}
#help{position:absolute;right:10px;top:48px;z-index:5;border-radius:30px;padding:8px 12px;font-size:12px}
.tray{border:5px solid #aa7546;border-radius:23px;padding:8px 8px 10px;background:linear-gradient(145deg,#bd8656,#a46d42 70%,#8b542e);box-shadow:inset 0 2px #eac394,0 5px 7px #764c2b4c}.traytitle{text-align:center;color:#ffedc9;font-size:13px;font-weight:850;margin-bottom:8px;text-shadow:0 1px #6a3a1c}
#pieces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.piece{height:clamp(76px,19vw,102px);display:grid;place-items:center;border:2px solid #ffe0ae;border-bottom:4px solid #b77c4a;border-radius:14px;background:linear-gradient(150deg,#ffedc9,#eec18d);box-shadow:0 2px 5px #60381944;touch-action:none;user-select:none;position:relative}.piece svg{width:78%;height:78%;filter:drop-shadow(1px 4px 2px #3d2b2b4f);pointer-events:none}.piece.selected{outline:3px solid #ffd948;transform:translateY(-3px)}.piece.used{opacity:.28;pointer-events:none}.ghost{position:fixed;z-index:1000;width:75px;height:75px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 6px #0005)}.ghost svg{width:100%;height:100%}
.controls{display:flex;gap:8px;justify-content:center}.controls button{padding:10px 15px;font-size:13px}.controls button:disabled{opacity:.45}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#3b251cc7;z-index:100;padding:20px}.overlay.show{display:flex}.modal{max-width:370px;width:100%;background:linear-gradient(#fff0ce,#e8b67b);border:7px solid #ad7549;border-radius:28px;padding:25px 17px;text-align:center;box-shadow:0 12px 35px #2a150d66}.modal h2{margin:10px 0}.modal p{line-height:1.6}.modal button{padding:12px 24px}
@media(min-height:780px){.scene-wrap{min-height:390px}}@media(max-height:680px){header{height:51px}.scene-wrap{min-height:245px}.traytitle{margin-bottom:4px}.piece{height:66px}.controls button{padding:6px 12px}}@media(min-width:600px){.scene-wrap{min-height:550px}}

/* v2: larger tray shapes, visual-only guidance and animated stage celebrations */
.scene-wrap{min-height:320px}#tip{display:none}#message:empty{display:none}#message{font-size:29px;bottom:14px;left:38%;right:38%;background:transparent;text-shadow:0 2px 3px #fff,0 4px 8px #51371c66}
#feedback{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.7);font-size:66px;z-index:6;opacity:0;pointer-events:none;text-shadow:0 4px 10px #0005}
#feedback.ok{animation:feedback-pop .8s ease-out forwards}#feedback.wrong{animation:feedback-shake .72s ease-out forwards}
@keyframes feedback-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.24)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1.05)}}
@keyframes feedback-shake{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%,40%,65%{opacity:1}25%{transform:translate(calc(-50% - 13px),-50%) scale(1.15)}42%{transform:translate(calc(-50% + 13px),-50%) scale(1.15)}58%{transform:translate(calc(-50% - 7px),-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.piece.wrong{animation:piece-error .5s ease-in-out;border-color:#e95448;box-shadow:0 0 12px #f43c39bb;background:#ffb4a1}
@keyframes piece-error{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.overlay{background:#3b251cc4}.modal{position:relative;overflow:hidden;isolation:isolate;padding:29px 18px 24px}.modal h2,.modal p,.modal button,.modal .award,.modal .bonus{position:relative;z-index:2}.modal h2{font-size:clamp(23px,6vw,30px)}.modal p{font-weight:750;font-size:15px}.modal .award{font-size:68px;filter:drop-shadow(0 5px 4px #6b482855);animation:award-bounce 1s ease-out both}.modal .continue{min-width:190px;font-size:18px;margin-top:8px}
@keyframes award-bounce{0%{transform:translateY(-28px) scale(.5);opacity:0}60%{transform:translateY(5px) scale(1.18);opacity:1}100%{transform:translateY(0) scale(1)}}
.celebrate{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.spark{position:absolute;left:var(--x);top:-25px;font-size:var(--size);opacity:0;animation:spark-fall var(--dur) ease-in var(--delay) infinite;filter:drop-shadow(0 2px 2px #99652255)}
@keyframes spark-fall{0%{opacity:0;transform:translate3d(0,-20px,0) rotate(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate3d(var(--drift),420px,0) rotate(220deg)}}
.bonus{display:none;justify-content:center;gap:7px;margin:9px 0 13px}.bonus.show{display:flex}.bonus span{font-size:30px;animation:star-rise .8s ease-out both;animation-delay:calc(var(--i)*.12s)}@keyframes star-rise{0%{transform:translateY(28px) scale(.25);opacity:0}65%{transform:translateY(-6px) scale(1.2);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.flying-star{position:fixed;z-index:150;font-size:30px;pointer-events:none;filter:drop-shadow(0 3px 4px #0004);transition:transform .8s cubic-bezier(.3,.1,.6,1),opacity .8s ease}
@media(prefers-reduced-motion:reduce){.spark{animation-duration:5s}.award{animation:none}}
</style></head>
<body><main id="app"><header><button class="wood back" id="back" aria-label="Հետ">←</button><div class="wood brand"><small>AREG · ՄՏՔԻ ԽԱՂԵՐ</small>Գտիր ճիշտ ձևը</div><button class="wood stars" id="stars">⭐ 0</button></header><div class="status"><span class="chip" id="level">Փուլ 1 / 4</span><span class="chip" id="score">✓ 0 / 6</span></div><div class="scene-wrap"><div class="nursery"></div><div id="view"></div><button class="wood" id="help">💡 Հուշում</button><div id="message" aria-live="polite"></div><div id="feedback" aria-hidden="true"></div></div><div class="tray"><div id="pieces"></div></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="celebrate" id="celebrate" aria-hidden="true"></div><div class="award" id="award" aria-hidden="true">⭐</div><h2 id="congrats">Ապրե՜ս, շատ լավ էր։</h2><p id="congratsText">Հրաշալի՜ կատարեցիր առաջադրանքը։</p><div class="bonus" id="bonus" aria-hidden="true"></div><button class="wood continue" id="continue">Շարունակել ✨</button></div></div><script type="module" src="./mind-shapes-deluxe-v2.js?v=20261013c"></script></body></html>
