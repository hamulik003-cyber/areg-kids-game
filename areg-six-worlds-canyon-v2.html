for(const b of document.querySelectorAll('[data-dir]')){const key=b.dataset.dir==='-1'?'left':'right';b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys[key]=false)}
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#action').addEventListener('pointerdown',e=>{e.preventDefault();interact()});start.addEventListener('click',()=>{if(!finished&&resume())return;reset()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.key==='e')interact()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});addEventListener('blur',()=>{keys.left=keys.right=false});
