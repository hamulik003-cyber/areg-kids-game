<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AREG · Մոլորակներ համեմատություն</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#020714;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 10px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:920px;margin:auto}
h1{font-size:22px;margin:4px 0 5px}.sub{color:#a8b9d8;font-size:12px;line-height:1.45;margin-bottom:10px}
.head{position:sticky;top:max(5px,env(safe-area-inset-top));z-index:9;display:grid;grid-template-columns:74px 1fr 1fr;gap:7px;background:#020714e8;backdrop-filter:blur(12px);padding:7px 0 9px}
.head div{font-size:11px;font-weight:900;text-align:center;padding:8px 5px;border-radius:11px;background:#0c1832;border:1px solid #2b4f83}
.head .left{border-color:#2c9a84}.head .right{border-color:#6758cb}
.row{display:grid;grid-template-columns:74px 1fr 1fr;gap:7px;align-items:stretch;margin:0 0 8px}
.meta{background:#09142a;border:1px solid #263f68;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.num{font-size:10px;color:#7f97bd;font-weight:800}.name{font-size:12px;font-weight:950;line-height:1.16;margin-top:3px;word-break:break-word}.status{font-size:9px;color:#8498b9;line-height:1.2;margin-top:4px}
.cell{border-radius:14px;overflow:hidden;background:#07142f;min-height:122px;position:relative;border:1px solid #294a77}
.cell.ref{border-color:#277e70}.cell.game{border-color:#554da9}
.cell img{display:block;width:100%;height:100%;min-height:122px;object-fit:cover}
.cell.game img{object-fit:contain;background:#07142f}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#9fb3d5;font-size:10px;text-align:center;padding:10px;background:#07142f}
.ok .loading{display:none}
.err{color:#ff9caa}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 10px;padding:9px 11px;border-radius:12px;background:#08162e;border:1px solid #274a77;font-size:11px}
#progress{font-weight:900}.reload{appearance:none;border:1px solid #42689b;background:#10284f;color:#fff;border-radius:10px;padding:7px 10px;font-weight:850;font-size:11px}
@media(min-width:720px){.head,.row{grid-template-columns:150px 1fr 1fr}.name{font-size:15px}.status{font-size:11px}.cell{min-height:190px}.cell img{min-height:190px}}
</style>
</head>
<body><div class="wrap">
<h1>Մոլորակներ բաժին ↔ Տիեզերական որոնում</h1>
<div class="sub">Բոլոր 30 օբյեկտները՝ իրար կողք։ Ձախում հենց «Մոլորակներ» բաժնի reference նկարն է, աջում՝ <b>ներկա խաղի իրական 3D object-ը</b> նույն geometry/texture/ring logic-ով։</div>
<div class="bar"><span id="progress">Պատրաստում եմ 0/30…</span><button class="reload" onclick="location.reload()">Թարմացնել</button></div>
<div class="head"><div># / անուն</div><div class="left">Մոլորակներ բաժին</div><div class="right">Տիեզերական որոնում</div></div>
<div id="rows"></div>
</div>
<script type="module">
const ITEMS=[
['sun','01-sun.jpg','Արև','Աստղ'],['mercury','02-mercury.jpg','Մերկուրի','Քարային մոլորակ'],
['venus','03-venus.jpg','Վեներա','Քարային մոլորակ'],['earth','04-earth.jpg','Երկիր','Բնակելի մոլորակ'],
['moon','05-moon.jpg','Լուսին','Բնական արբանյակ'],['mars','06-mars.jpg','Մարս','Քարային մոլորակ'],
['jupiter','07-jupiter.jpg','Յուպիտեր','Գազային հսկա'],['saturn','08-saturn.jpg','Սատուրն','Գազային հսկա'],
['uranus','09-uranus.jpg','Ուրան','Սառցային հսկա'],['neptune','10-neptune.jpg','Նեպտուն','Սառցային հսկա'],
['phobos','11-phobos.jpg','Ֆոբոս','Բնական արբանյակ'],['deimos','12-deimos.jpg','Դեյմոս','Բնական արբանյակ'],
['io','13-io.jpg','Իո','Բնական արբանյակ'],['europa','14-europa.jpg','Եվրոպա','Բնական արբանյակ'],
['ganymede','15-ganymede.jpg','Գանիմեդ','Բնական արբանյակ'],['callisto','16-callisto.jpg','Կալիստո','Բնական արբանյակ'],
['titan','17-titan.jpg','Տիտան','Բնական արբանյակ'],['enceladus','18-enceladus.jpg','Էնցելադուս','Բնական արբանյակ'],
['titania','19-titania.jpg','Տիտանիա','Բնական արբանյակ'],['oberon','20-oberon.jpg','Օբերոն','Բնական արբանյակ'],
['triton','21-triton.jpg','Տրիտոն','Բնական արբանյակ'],['charon','22-charon.jpg','Խարոն','Բնական արբանյակ'],
['pluto','23-pluto.jpg','Պլուտոն','Գաճաճ մոլորակ'],['ceres','24-ceres.jpg','Ցերերա','Գաճաճ մոլորակ'],
['haumea','25-haumea.jpg','Հաումեա','Գաճաճ մոլորակ'],['makemake','26-makemake.jpg','Մակեմակե','Գաճաճ մոլորակ'],
['eris','27-eris.jpg','Էրիս','Գաճաճ մոլորակ'],['solar-system','28-solar-system.jpg','Արեգակնային համակարգ','Մոլորակային համակարգ'],
['milky-way','29-milky-way.jpg','Ծիր Կաթին','Գալակտիկա'],['black-hole','30-black-hole.jpg','Սև խոռոչ','Տիեզերական օբյեկտ']
];
const rows=document.getElementById('rows'),progress=document.getElementById('progress');
ITEMS.forEach(([id,img,name,status],i)=>{
 const r=document.createElement('div');r.className='row';r.id='row-'+id;
 r.innerHTML='<div class="meta"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="name">'+name+'</span><span class="status">'+status+'</span></div>'+
 '<div class="cell ref"><img src="./'+img+'?v=compare195" alt="'+name+' reference"></div>'+
 '<div class="cell game"><div class="loading">3D snapshot…</div><img id="game-'+id+'" alt="'+name+' current 3D"></div>';
 rows.appendChild(r);
});
try{
 await import('./space-3d-games.js?v=210compare');
 let done=0;
 for(const [id,img,name,status] of ITEMS){
   const cell=document.getElementById('row-'+id).querySelector('.game');
   try{
     const data=await window.AregSpace3D.comparisonSnapshot({id,name,status},{width:420,height:300});
     document.getElementById('game-'+id).src=data;
     cell.classList.add('ok');
   }catch(e){
     cell.querySelector('.loading').innerHTML='<span class="err">Չստացվեց render անել</span>';
   }
   done++;progress.textContent='Պատրաստ է '+done+'/30';
   await new Promise(r=>setTimeout(r,20));
 }
}catch(e){
 progress.innerHTML='<span class="err">3D module-ը չբացվեց</span>';
}
</script>
</body></html>
