<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Բառերի մենամարտ — փորձնական</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5e6c9;background:#101d30}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 10%,#28415b,#101d30 75%);display:flex;justify-content:center}main{width:min(100%,440px);padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:13px}h1{text-align:center;font-size:23px;letter-spacing:.3px;margin:2px 0;color:#f5d59d}.wood{border:4px solid #9d7044;box-shadow:inset 0 0 0 2px #dfb878,0 8px 25px #0007;border-radius:22px;background:linear-gradient(130deg,#624025,#865933 50%,#53351f);padding:13px}.score{display:flex;align-items:center;justify-content:space-between;text-align:center}.score strong{font-size:27px}.score small{display:block;font-size:11px;color:#e5c99d}.clock{font-variant-numeric:tabular-nums;font-size:27px;color:#fff}.panel{background:#172a40;border:1px solid #b68b54;border-radius:15px;padding:12px}.words{display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:12px}.words strong{display:block;margin-bottom:6px;color:#e6bf7e}.words span{display:block;min-height:25px;color:#d8e2ec}.entry{height:48px;text-align:center;font-size:25px;letter-spacing:2px;font-weight:700}.wheel{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:0 auto;touch-action:none;border-radius:50%;border:5px solid #b38a56;background:radial-gradient(circle,#263e55,#12263a);box-shadow:inset 0 0 18px #0008,0 6px 25px #0007}.tile{position:absolute;display:grid;place-items:center;width:55px;height:55px;border-radius:50%;border:2px solid #efc88e;background:linear-gradient(140deg,#c18d51,#754522);font-size:25px;font-weight:750;color:#fff3d7;box-shadow:0 4px 7px #0008;transform:translate(-50%,-50%);user-select:none}.tile.active{background:linear-gradient(140deg,#66b6b4,#277a83);box-shadow:0 0 0 3px #c4f4ea}.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:flex;gap:9px}.controls button,button.primary{flex:1;border:1px solid #e7c58a;background:linear-gradient(#a77845,#78502d);border-radius:12px;color:#fff5e5;padding:13px;font-size:15px;font-weight:700}button:disabled{opacity:.45}.note{font-size:12px;line-height:1.5;color:#c9c8bf;text-align:center}.status{text-align:center;min-height:20px;font-size:13px}.definition{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:20px;z-index:5}.definition.show{display:flex}.definition article{width:min(100%,360px);background:#192d42;border:2px solid #c9a16a;border-radius:18px;padding:20px}.definition h2{margin-top:0}.wordbutton{border:0;background:none;color:#f4e3c7;text-decoration:underline;font-size:13px;margin:3px}.footer{margin-top:auto}
</style></head><body><main><h1>⚔ Բառերի մենամարտ</h1><div class="wood score"><div><small>ԴՈՒ</small><strong id="me">0</strong></div><div><small>ԺԱՄԱՆԱԿ</small><strong class="clock" id="clock">01:30</strong></div><div><small>ՄՐՑԱԿԻՑ</small><strong id="opponent">0</strong></div></div><div class="panel words"><div><strong>ԻՄ ԲԱՌԵՐԸ</strong><span id="mine">Դեռ բառ չկա</span></div><div><strong>ՄՐՑԱԿԻՑԸ 🔒</strong><span id="theirs">0 բառ · 0 միավոր</span></div></div><div class="panel entry" id="entry">Ընտրիր տառերը</div><div class="wheel" id="wheel"><svg id="lines" viewBox="0 0 300 300"><polyline id="path" fill="none" stroke="#8be6e0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="controls"><button id="clear">Մաքրել</button><button id="send">Հաստատել</button><button id="start">Սկսել</button></div><div class="status" id="status" aria-live="polite">Սեղմիր «Սկսել»՝ 90 վայրկյանանոց փորձարկման համար</div><div class="note footer">Սա մեկուսացված AREG TEST նախատիպ է։ Բառարանի փոքր փորձնական ցանկը լիարժեք ստուգված բառարան չէ։ Առցանց մրցակից դեռ միացված չէ։</div></main><div class="definition" id="modal"><article><h2 id="term"></h2><p id="meaning"></p><button class="primary" id="close">Փակել</button></article></div><script>
(()=>{'use strict';const letters=['Ա','Ր','Ե','Վ','Ն','Տ','Ս'];const lex=new Map([['ՍԱՐ','Բարձրադիր բնական ցամաքային գոյացություն։'],['ՏԱՐ','«Տանել» բայի հրամայական ձև։'],['ՎԱՐ','Ներքևի կողմը, ցած։'],['ԱՐԵՎ','Երկրին լույս և ջերմություն տվող աստղ՝ Արեգակը։'],['ՎԱՐՏ','Տղամարդու կամ կնոջ հագուստի ներքևի մասի տեսակ։']]);const pts=n=>({3:10,4:20,5:35,6:50,7:70}[n]||0);const $=id=>document.getElementById(id);let chosen=[],seen=new Set(),seconds=90,run=false,timer=null,score=0;const wheel=$('wheel');function draw(){wheel.querySelectorAll('.tile').forEach(x=>x.remove());letters.forEach((l,i)=>{const a=2*Math.PI*i/7-Math.PI/2;const x=150+105*Math.cos(a),y=150+105*Math.sin(a);const el=document.createElement('div');el.className='tile'+(chosen.includes(i)?' active':'');el.style.left=(x/300*100)+'%';el.style.top=(y/300*100)+'%';el.textContent=l;el.dataset.i=i;wheel.appendChild(el)});$('path').setAttribute('points',chosen.map(i=>{const a=2*Math.PI*i/7-Math.PI/2;return (150+105*Math.cos(a))+','+(150+105*Math.sin(a))}).join(' '));$('entry').textContent=chosen.length?chosen.map(i=>letters[i]).join(''):'Ընտրիր տառերը'}function add(i){if(!run||chosen.includes(i))return;chosen.push(i);draw()}let dragging=false;wheel.addEventListener('pointerdown',e=>{if(!run)return;dragging=true;wheel.setPointerCapture(e.pointerId);pick(e)});wheel.addEventListener('pointermove',e=>{if(dragging)pick(e)});wheel.addEventListener('pointerup',()=>{dragging=false});wheel.addEventListener('pointercancel',()=>{dragging=false});function pick(e){const r=wheel.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*300;letters.forEach((_,i)=>{const a=2*Math.PI*i/7-Math.PI/2,dx=x-(150+105*Math.cos(a)),dy=y-(150+105*Math.sin(a));if(dx*dx+dy*dy<32*32)add(i)})}function msg(s){$('status').textContent=s}function submit(){if(!run)return;const w=chosen.map(i=>letters[i]).join('');chosen=[];draw();if(w.length<3){msg('Բառը պետք է ունենա առնվազն 3 տառ');return}if(seen.has(w)){msg('Այս բառը արդեն օգտագործել ես');return}if(!lex.has(w)){msg('Այս բառը փորձնական ցանկում չկա (ոչ վերջնական մերժում)');return}seen.add(w);score+=pts(w.length);$('me').textContent=score;$('mine').innerHTML='';for(const v of seen){const b=document.createElement('button');b.className='wordbutton';b.textContent=v;b.onclick=()=>{$('term').textContent=v;$('meaning').textContent=lex.get(v);$('modal').classList.add('show')};$('mine').appendChild(b)}msg('Ընդունված՝ '+w+' · +'+pts(w.length)+' միավոր')}function tick(){seconds--;$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timer);run=false;msg('Ժամանակն ավարտվեց։ Հավաքեցիր '+score+' միավոր։')}}$('start').onclick=()=>{clearInterval(timer);seconds=90;run=true;score=0;seen.clear();chosen=[];$('me').textContent='0';$('mine').textContent='Դեռ բառ չկա';$('clock').textContent='01:30';draw();msg('Մենամարտը սկսված է');timer=setInterval(tick,1000)};$('clear').onclick=()=>{chosen=[];draw()};$('send').onclick=submit;$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};draw()})();
</script></body></html>
