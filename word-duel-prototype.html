<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Բառերի մենամարտ — փորձնական</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5e6c9;background:transparent}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center}main{width:min(100%,440px);height:100%;min-height:0;padding:9px 11px 12px;display:flex;flex-direction:column;gap:9px;border:12px solid #bd874d;border-radius:30px;background:radial-gradient(ellipse at 50% 15%,#294158,#101d30 75%) padding-box;box-shadow:inset 0 0 0 3px #e2bc82,inset 0 0 0 6px #674022;overflow:hidden}h1{text-align:center;font-size:clamp(17px,4.6vw,23px);margin:0;color:#f5d59d;line-height:1.1}.score{display:flex;align-items:center;justify-content:space-between;text-align:center;border:3px solid #b98b55;box-shadow:inset 0 0 0 2px #e5c08b;border-radius:16px;background:linear-gradient(130deg,#624025,#865933 50%,#53351f);padding:8px 13px}.score strong{display:block;font-size:clamp(20px,5.3vw,26px);font-variant-numeric:tabular-nums}.score small{display:block;font-size:10px;color:#e5c99d}.board{flex:1;min-height:0;border:11px solid #b9874c;border-radius:19px;box-shadow:inset 0 0 0 3px #75502d,0 4px 9px #0007;background:radial-gradient(ellipse at 50% 40%,#23504a,#092c2d 85%);padding:12px 10px;overflow:hidden;display:flex;flex-direction:column;gap:9px;align-items:flex-start}.board-title{color:#e6c997;font-size:12px;letter-spacing:.4px;margin-bottom:3px}.wordrow{display:flex;gap:4px;align-items:center}.cell{width:clamp(29px,8.8vw,40px);height:clamp(32px,9.2vw,43px);display:grid;place-items:center;border-radius:8px;background:linear-gradient(#fffdf0,#e6dfc9);border:1px solid #b9a886;box-shadow:0 3px 1px #8c765b;color:#294038;font-weight:850;font-size:clamp(18px,5.5vw,25px)}.wordrow.solved .cell{background:linear-gradient(#f9e7b9,#dcb87c)}.entry{height:37px;flex-shrink:0;text-align:center;font-size:24px;font-weight:800;color:#ffe6b5;letter-spacing:1px}.wheel{position:relative;width:min(84vw,310px,100%,calc(100dvh - 270px));aspect-ratio:1;flex-shrink:1;margin:0 auto;touch-action:none;border-radius:50%;border:5px solid #b38a56;background:radial-gradient(circle,#263e55,#12263a);box-shadow:inset 0 0 18px #0008,0 6px 20px #0007}.tile{position:absolute;display:grid;place-items:center;width:clamp(56px,17vw,72px);height:clamp(56px,17vw,72px);border-radius:50%;border:2px solid #efc88e;background:linear-gradient(140deg,#c18d51,#754522);font-size:clamp(26px,7vw,33px);font-weight:800;color:#fff3d7;box-shadow:0 4px 7px #0008;transform:translate(-50%,-50%);user-select:none}.tile.active{background:linear-gradient(140deg,#66b6b4,#277a83);box-shadow:0 0 0 3px #c4f4ea}.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shuffle-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;display:grid;place-items:center;border-radius:50%;border:3px solid #eac387;background:linear-gradient(145deg,#c48d4d,#76502b);color:#fff3d8;font-size:37px;font-weight:700;box-shadow:0 3px 9px #0008;z-index:3;touch-action:manipulation;cursor:pointer}.shuffle-center:active{transform:translate(-50%,-50%) scale(.94)}.controls{display:flex;gap:9px;flex-shrink:0}.controls button{flex:1;border:1px solid #e7c58a;background:linear-gradient(#a77845,#78502d);border-radius:12px;color:#fff5e5;padding:11px 8px;font-size:15px;font-weight:700}.status{text-align:center;font-size:12px;min-height:0;flex-shrink:0}.status:empty{display:none}.definition{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:20px;z-index:5}.definition.show{display:flex}.definition article{width:min(100%,360px);background:#192d42;border:2px solid #c9a16a;border-radius:18px;padding:20px}.definition button{padding:12px;border-radius:10px}.hint{font-size:11px;color:#c7b99e;text-align:center;flex-shrink:0}@media(max-height:690px){main{gap:5px;padding-top:5px}.score{padding:5px 10px}.board{min-height:100px;padding:8px}.wheel{width:min(76vw,270px,calc(100dvh - 260px))}.entry{height:29px}.hint{display:none}}
/* iPhone one-screen layout: remove three crossed-out text rows, give their space to the board */
.board-title,.entry,.status{display:none!important}
.board{flex:1 1 auto;min-height:0}
.wheel{flex:0 0 auto;max-width:100%;margin:0 auto}
@media(max-height:690px){.wheel{width:min(76vw,270px,calc(100dvh - 260px))}}

/* Twelve-slot preview: six word rows per column, without changing the three playable words. */
#rows{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-flow:column;column-gap:clamp(6px,2vw,12px);row-gap:3px;align-items:center}
.board{padding:8px 7px;gap:0}
.wordrow{min-width:0;max-width:100%;gap:2px;margin:0!important;white-space:nowrap}
.wordrow .cell{flex:0 1 auto;width:clamp(12px,3.5vw,19px);height:clamp(21px,3.7vh,34px);border-radius:5px;font-size:clamp(12px,3.3vw,17px);box-shadow:0 2px 1px #8c765b}
.wordrow.preview .cell{opacity:.68}
@media(max-height:690px){.board{padding:5px}.wordrow .cell{height:clamp(18px,3.3vh,29px)}}
</style></head><body><main><h1>⚔ Բառերի մենամարտ</h1><div class="score"><div><small>ԴՈՒ</small><strong id="me">0</strong></div><div><small>ԺԱՄԱՆԱԿ</small><strong id="clock">01:30</strong></div><div><small>ՓՈՒԼ</small><strong>1</strong></div></div><section class="board" aria-label="Բառերի գրատախտակ"><div class="board-title">ԳՏԻՐ ԲՈԼՈՐ ԲԱՌԵՐԸ · <span id="progress">0/3</span></div><div id="rows"></div></section><div class="entry" id="entry">Միացրու տառերը</div><div class="wheel" id="wheel"><svg viewBox="0 0 300 300"><polyline id="path" fill="none" stroke="#8be6e0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line id="tail" stroke="#8be6e0" stroke-width="6" stroke-linecap="round" opacity="0"/></svg><button class="shuffle-center" id="shuffle" type="button" aria-label="Խառնել տառերը">⟳</button></div><div class="status" id="status" aria-live="polite"></div><button id="start" hidden type="button">Սկսել</button></main><div class="definition" id="modal"><article><h2 id="term"></h2><p id="meaning"></p><button id="close">Փակել</button></article></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let letters=['Վ','Ա','Ր','Դ'];const words=[{w:'ՎԱՐ',meaning:'Ցած, դեպի ներքև։'},{w:'ԴԱՐ',meaning:'Հարյուր տարվա ժամանակաշրջան։'},{w:'ՎԱՐԴ',meaning:'Գեղեցիկ, հաճախ բուրավետ ծաղիկ։'}].sort((a,b)=>a.w.length-b.w.length||a.w.localeCompare(b.w,'hy'));const pts=n=>({3:10,4:20}[n]||0);let chosen=[],found=new Set(),score=0,seconds=90,run=false,timer=null,dragging=false,pointerPoint=null;const wheel=$('wheel');const positions=()=>letters.map((_,i)=>{const a=2*Math.PI*i/letters.length-Math.PI/2;return{x:150+104*Math.cos(a),y:150+104*Math.sin(a)}});function board(){const rows=$('rows');rows.replaceChildren();for(const item of words){const row=document.createElement('div');row.className='wordrow'+(found.has(item.w)?' solved':'');row.style.marginBottom='9px';for(const l of item.w){const cell=document.createElement('div');cell.className='cell';cell.textContent=found.has(item.w)?l:'';row.append(cell)}if(found.has(item.w)){row.title='Սեղմիր բառի բացատրության համար';row.addEventListener('click',()=>{$('term').textContent=item.w;$('meaning').textContent=item.meaning;$('modal').classList.add('show')})}rows.append(row)}for(let i=words.length;i<12;i++){const row=document.createElement('div');row.className='wordrow preview';row.setAttribute('aria-label','Ապագա բառի տեղ');for(let j=0;j<4;j++){const cell=document.createElement('div');cell.className='cell';row.append(cell)}rows.append(row)}$('progress').textContent=found.size+'/'+words.length}function tail(){const line=$('tail');if(!pointerPoint||!chosen.length){line.setAttribute('opacity','0');return}const p=positions()[chosen.at(-1)];line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',pointerPoint.x);line.setAttribute('y2',pointerPoint.y);line.setAttribute('opacity','1')}function draw(){wheel.querySelectorAll('.tile').forEach(el=>el.remove());const pos=positions();letters.forEach((l,i)=>{const el=document.createElement('div');el.className='tile'+(chosen.includes(i)?' active':'');el.style.left=pos[i].x/3+'%';el.style.top=pos[i].y/3+'%';el.textContent=l;wheel.append(el)});$('path').setAttribute('points',chosen.map(i=>pos[i].x+','+pos[i].y).join(' '));tail();$('entry').textContent=chosen.length?chosen.map(i=>letters[i]).join(''):'Միացրու տառերը'}function add(i){if(!run)return;if(chosen.length>1&&chosen.at(-2)===i){chosen.pop();draw();return}if(chosen.includes(i))return;chosen.push(i);draw()}function pick(e){const r=wheel.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*300;pointerPoint={x,y};positions().forEach((p,i)=>{if((p.x-x)**2+(p.y-y)**2<35**2)add(i)});tail()}function submit(){const w=chosen.map(i=>letters[i]).join('');chosen=[];pointerPoint=null;draw();if(w.length<3)return;const item=words.find(o=>o.w===w);if(!item){$('status').textContent='Այս բառը փորձնական ցանկում չկա';return}if(found.has(w)){$('status').textContent='Այս բառը արդեն գտնված է';return}found.add(w);score+=pts(w.length);$('me').textContent=score;board();$('status').textContent='Գտար «'+w+'» · +'+pts(w.length)+' միավոր';if(found.size===words.length){run=false;clearInterval(timer);$('status').textContent='Ապրե՛ս։ Գտար բոլոր '+words.length+' բառերը։'}}$('shuffle').addEventListener('pointerdown',e=>e.stopPropagation());wheel.addEventListener('pointerdown',e=>{if(!run)return;dragging=true;wheel.setPointerCapture(e.pointerId);pick(e)});wheel.addEventListener('pointermove',e=>{if(dragging)pick(e)});wheel.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;pointerPoint=null;tail();submit()});wheel.addEventListener('pointercancel',()=>{dragging=false;chosen=[];pointerPoint=null;draw()});function tick(){seconds--; $('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timer);run=false;$('status').textContent='Ժամանակն ավարտվեց · '+found.size+'/'+words.length+' բառ'}}$('start').onclick=()=>{clearInterval(timer);found.clear();chosen=[];score=0;seconds=90;run=true;$('me').textContent='0';$('clock').textContent='01:30';board();draw();$('status').textContent='Փնտրիր 3 բառը';timer=setInterval(tick,1000)};$('shuffle').onclick=()=>{if(dragging)return;for(let i=letters.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}chosen=[];draw()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};board();draw();$('start').click()})();
</script></body></html>
