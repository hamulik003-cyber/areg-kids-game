<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Որտե՞ղ թաքնվեց — բաժակներ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif;color:#70401f}body{background:linear-gradient(180deg,#83d1fc 0%,#ddf7ff 55%,#a4d779 55%,#75bb68 100%)}button{font:inherit}.head{position:absolute;z-index:12;top:calc(env(safe-area-inset-top,0px) + 12px);left:9px;right:9px;display:grid;grid-template-columns:46px 1fr 62px;gap:7px}.wood{border:3px solid #ad6a35;border-radius:14px;min-height:46px;display:grid;place-items:center;background:linear-gradient(#fff0bf,#efb76f);box-shadow:0 5px #89502a,inset 0 2px #fff8dd;font-weight:900}.wood a{text-decoration:none;color:inherit;font-size:28px}.title{font-size:clamp(15px,4.3vw,22px)}.scene{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 75px) 7px calc(env(safe-area-inset-bottom,0px) + 10px);border:5px solid #bb8043;border-radius:24px;background:radial-gradient(ellipse at 65% 35%,#f3fbff 0%,#b5eaff 50%,#75c4ef 100%);box-shadow:0 10px 20px #5b714e70;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:8px}.scene:before{content:"";position:absolute;inset:54% 0 0;background:linear-gradient(#a9db81,#6fb36b)}.status{position:relative;z-index:6;min-height:58px;width:100%;max-width:480px;background:#fff0cbe8;border:3px solid #e9b774;border-radius:16px;display:grid;place-items:center;text-align:center;font-size:clamp(14px,4.4vw,20px);font-weight:900;padding:7px 5px;box-shadow:0 5px 10px #80613e44}.status small{font-size:11px;color:#9a673c}.shelf{position:relative;z-index:3;width:min(95%,430px);height:86px;flex-shrink:0;margin-top:8px;display:flex;align-items:flex-start;justify-content:space-around;padding:0 10px}.shelf:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:16px;border-radius:8px;background:linear-gradient(#f9d89d,#b77c43);border:3px solid #915c33;box-shadow:0 6px #80502b}.trophy{height:66px;width:18%;display:grid;place-items:center;position:relative;z-index:4}.trophy .mini{font-size:clamp(26px,7vw,43px);filter:drop-shadow(0 4px 2px #754b3766);animation:land .55s cubic-bezier(.2,1.5,.5,1) both}@keyframes land{from{transform:translateY(-32px) scale(.65);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.arena{position:relative;z-index:2;flex:1;width:min(100%,490px);min-height:220px;perspective:700px}.table{position:absolute;left:2%;right:2%;top:72%;height:18%;background:linear-gradient(#f7d49c,#bd814b);border:6px solid #9b663b;border-radius:50%;box-shadow:0 17px 0 #a2693e,0 23px 16px #47634277;transform:rotateX(48deg)}.cup{position:absolute;left:calc(50% - 15%);top:10%;width:30%;height:67%;transform:translate3d(0,-15%,0);will-change:transform;z-index:5;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}.cupShape{position:absolute;bottom:3%;left:12%;width:76%;height:74%;filter:drop-shadow(0 9px 5px #69462e70);transform:rotateX(-4deg);transform-origin:bottom}.cupBody{position:absolute;inset:0;background:linear-gradient(100deg,var(--light) 0%,var(--base) 32%,var(--base) 61%,var(--dark) 100%);clip-path:polygon(21% 0%,79% 0%,100% 100%,0% 100%);border-radius:10px 10px 17px 17px}.cupBody:before{content:"";position:absolute;left:20%;top:12%;width:15%;height:69%;border-radius:50%;background:#ffffff77;transform:rotate(-9deg);filter:blur(3px)}.rimTop{position:absolute;left:16%;top:-4%;width:68%;height:14%;border-radius:50%;background:linear-gradient(#fff7d4,var(--light));border:3px solid #fff6cf;box-shadow:0 2px #ffffff88}.rimBottom{position:absolute;bottom:-2%;left:0;width:100%;height:13%;border-radius:50%;background:linear-gradient(var(--light),var(--dark));border:4px solid #fff4bd;box-shadow:0 4px #7e513d55}.mark{position:absolute;top:37%;left:29%;font-size:clamp(21px,6vw,38px);font-weight:900;color:#fff9dd;text-shadow:0 3px #7b473777}.object{position:absolute;z-index:4;top:61%;left:50%;transform:translate(-50%,-50%);font-size:clamp(38px,13vw,75px);filter:drop-shadow(0 6px 4px #77533477);opacity:0;pointer-events:none}.object.show{opacity:1}.object.zoom{transition:transform 1.15s cubic-bezier(.25,.75,.25,1),top 1.15s ease,left 1.15s ease,opacity .45s;transform:translate(-50%,-50%) scale(2.1) rotateY(360deg);top:43%;left:50%;z-index:10}.object.toShelf{transition:transform .9s ease,top .9s ease,left .9s ease,opacity .3s;transform:translate(-50%,-50%) scale(.55) rotateY(360deg);top:3%;left:var(--shelf-x)}.feedback{position:relative;z-index:5;min-height:22px;font-size:13px;font-weight:900;text-align:center;color:#fffef0;text-shadow:0 2px 4px #684426}.controls{position:relative;z-index:6;display:flex;gap:9px;width:min(96%,420px);justify-content:center}.btn{border:3px solid #e7ffd3;border-radius:14px;background:linear-gradient(#79df84,#2d9c53);color:white;font-size:17px;font-weight:900;padding:10px 18px;box-shadow:0 5px #2b7541;min-width:150px}.btn.secondary{background:linear-gradient(#ffca7e,#e98e3e);box-shadow:0 5px #ad5d2b;min-width:0}.btn:disabled{opacity:.5}.progress{position:relative;z-index:4;text-align:center;color:#fffdf1;text-shadow:0 2px 4px #684426;font-weight:900;font-size:13px;margin-top:4px}.modal{position:absolute;inset:0;z-index:20;background:#1f304788;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.popup{width:min(100%,360px);border:6px solid #c58a4b;border-radius:27px;background:linear-gradient(#fff5d5,#f4c98b);box-shadow:0 20px 50px #1f253b80;text-align:center;padding:26px 15px}.popup .cupIcon{font-size:65px}.popup h2{font-size:25px;margin:7px 0 19px}.popup .btn{width:100%}@media(max-height:700px){.scene{padding:5px}.status{min-height:42px;padding:4px}.shelf{height:64px;margin-top:1px}.trophy{height:47px}.trophy .mini{font-size:29px}.arena{min-height:160px}.cup{top:4%;height:75%}.controls .btn{padding:6px}.progress{margin:0}}
</style></head><body><header class="head"><div class="wood"><a href="index.html" aria-label="Հետ">←</a></div><div class="wood title">Որտե՞ղ թաքնվեց</div><div class="wood">⭐ <span id="stars">0</span></div></header><main class="scene"><div class="status"><div><span id="message">Ուշադիր նայիր առարկային։</span><small id="sub">Բաժակները կիջնեն ու կթաքցնեն այն։</small></div></div><div class="shelf" id="shelf"></div><div class="arena" id="arena"><div class="table"></div><div class="object show" id="object">🍎</div></div><div class="feedback" id="feedback">Պատրաստվիր հիշել։</div><div class="controls"><button class="btn" id="start">▶ Սկսել</button><button class="btn secondary" id="reset">↻</button></div><div class="progress">Առարկա <span id="count">1</span>/5 · Փուլ <span id="stage">1</span></div><div class="modal" id="modal"><div class="popup"><div class="cupIcon">🏆</div><h2>Ապրե՜ս, գտար բոլորին։</h2><button class="btn" id="continue">Շարունակել</button></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena'),object=$('object'),icons=['🍎','🧸','🚗','🦋','⭐','🍓','🐰','🚀','🐢','🎈','🍊','🐻','🚂','🐸','🌼'];let stage=1,number=0,stars=0,mode='idle',order=[0,1,2],target=1,cups=[],active=[],sequence=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const colors=[['#ff9fb7','#fa4f84','#c93464'],['#9be8ff','#3caff2','#267cbe'],['#ffe89c','#ffbd37','#cf8525']];const x=slot=>(slot-1)*arena.clientWidth*.33;const pos=(slot,y=0)=>'translate3d('+x(slot)+'px,'+y+'px,0)';function info(a,b){$('message').textContent=a;$('sub').textContent=b||''}function waitAnim(el,frames,options){const anim=el.animate(frames,{...options,fill:'forwards'});return anim.finished.then(()=>{el.style.transform=frames[frames.length-1].transform;anim.cancel()}).catch(()=>{})}function createCups(){cups.forEach(c=>c.remove());cups=[];order=[0,1,2];colors.forEach((c,i)=>{const cup=document.createElement('div');cup.className='cup';cup.style.setProperty('--light',c[0]);cup.style.setProperty('--base',c[1]);cup.style.setProperty('--dark',c[2]);cup.innerHTML='<div class="cupShape"><div class="cupBody"></div><div class="rimTop"></div><div class="mark">✦</div><div class="rimBottom"></div></div>';cup.style.transform=pos(i,-arena.clientHeight*.57);cup.addEventListener('click',()=>choose(i));arena.append(cup);cups.push(cup)})}function setObject(icon){object.className='object show';object.style.cssText='';object.textContent=icon}async function dropCups(token){await Promise.all(cups.map((cup,i)=>waitAnim(cup,[{transform:pos(i,-arena.clientHeight*.57)},{transform:pos(i,0)}],{duration:950+i*90,easing:'cubic-bezier(.25,.8,.25,1)'})));if(token!==sequence)return;object.classList.remove('show')}async function shuffle(token){for(let k=0;k<5;k++){if(token!==sequence)return;let a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;const ca=cups[order[a]],cb=cups[order[b]];const dur=820;await Promise.all([waitAnim(ca,[{transform:pos(a,0)},{transform:pos(b,-16)}],{duration:dur,easing:'ease-in-out'}),waitAnim(cb,[{transform:pos(b,0)},{transform:pos(a,16)}],{duration:dur,easing:'ease-in-out'})]);[order[a],order[b]]=[order[b],order[a]];await sleep(180)}}async function startRound(){if(mode==='intro'||mode==='shuffle'||mode==='answer'||mode==='final')return;const token=++sequence;mode='intro';$('start').disabled=true;$('start').textContent='Հետևիր բաժակներին';$('count').textContent=number+1;setObject(icons[((stage-1)*5+number)%icons.length]);createCups();target=Math.floor(Math.random()*3);info('Հիշիր՝ որտե՞ղ է առարկան։','Երեք բաժակները կիջնեն սեղանին։');$('feedback').textContent='Նայիր առարկային։';await sleep(1100);if(token!==sequence)return;await dropCups(token);if(token!==sequence)return;mode='shuffle';info('Բաժակները խառնվում են։','Հետևիր այն բաժակին, որը ծածկեց առարկան։');$('feedback').textContent='Խառնում՝ 5 անգամ';await shuffle(token);if(token!==sequence)return;mode='guess';info('Ո՞ր բաժակի տակ է առարկան։','Հպվիր ճիշտ բաժակին։');$('feedback').textContent='Ընտրիր բաժակը։'}async function choose(i){if(mode!=='guess')return;const token=sequence;const slot=order.indexOf(i);mode='answer';await waitAnim(cups[i],[{transform:pos(slot,0)},{transform:pos(slot,-arena.clientHeight*.46)}],{duration:850,easing:'cubic-bezier(.2,.8,.25,1)'});if(token!==sequence)return;if(i!==target){$('feedback').textContent='Փորձիր մեկ անգամ էլ։';info('Այստեղ չէ։','Հիշիր՝ որ բաժակը ծածկեց առարկան։');await sleep(450);await waitAnim(cups[i],[{transform:pos(slot,-arena.clientHeight*.46)},{transform:pos(slot,0)}],{duration:650,easing:'ease-in-out'});mode='guess';return}object.classList.add('show');$('feedback').textContent='Ապրե՜ս, գտար։';info('Ճի՜շտ է։','Առարկան գալիս է մոտիկից բարևելու։');await sleep(180);object.classList.add('zoom');await sleep(1320);if(token!==sequence)return;const shelfX=(10+number*20)+'%';object.style.setProperty('--shelf-x',shelfX);object.classList.remove('zoom');object.classList.add('toShelf');await sleep(950);if(token!==sequence)return;const mini=document.createElement('div');mini.className='trophy';mini.innerHTML='<span class="mini">'+object.textContent+'</span>';$('shelf').append(mini);object.className='object';number++;$('count').textContent=Math.min(number+1,5);if(number<5){mode='ready';$('start').disabled=false;$('start').textContent='▶ Հաջորդ առարկան';info('Առարկան հավաքվեց վերևում։','Շարունակենք հաջորդով։')}else await finale(token)}async function finale(token){mode='final';info('Հավաքեցինք բոլոր հինգ առարկաները։','Նրանք միասին պտտվում են։');$('feedback').textContent='🌟 Հրաշալի՜';const minis=[...$('shelf').querySelectorAll('.mini')];await Promise.all(minis.map((el,i)=>{const rect=el.getBoundingClientRect(),parent=arena.getBoundingClientRect();const dx=parent.left+parent.width/2-(rect.left+rect.width/2),dy=parent.top+parent.height*.42-(rect.top+rect.height/2);return el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(1.8) rotateY(360deg)',opacity:1,offset:.73},{transform:'translate('+dx+'px,'+(dy-35)+'px) scale(1.4) rotateY(360deg)',opacity:0}],{duration:1850+i*95,easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{})}));if(token!==sequence)return;$('shelf').innerHTML='';stars+=5;$('stars').textContent=stars;$('modal').classList.add('show');$('start').disabled=false}function reset(){sequence++;mode='idle';number=0;stars=0;stage=1;order=[0,1,2];$('stars').textContent=0;$('stage').textContent=1;$('count').textContent=1;$('shelf').innerHTML='';$('modal').classList.remove('show');createCups();setObject(icons[0]);$('start').disabled=false;$('start').textContent='▶ Սկսել';info('Ուշադիր նայիր առարկային։','Բաժակները կիջնեն ու կթաքցնեն այն։');$('feedback').textContent='Պատրաստվիր հիշել։'}$('start').onclick=startRound;$('reset').onclick=reset;$('continue').onclick=()=>{stage++;number=0;mode='ready';$('stage').textContent=stage;$('count').textContent=1;$('modal').classList.remove('show');$('shelf').innerHTML='';$('start').textContent='▶ Սկսել';$('start').disabled=false;info('Նոր փուլ։','Հինգ նոր առարկա կթաքնվի բաժակների տակ։');setObject(icons[((stage-1)*5)%icons.length]);createCups()};window.addEventListener('resize',()=>{if(mode==='idle'||mode==='ready'){cups.forEach((c,i)=>c.style.transform=pos(i,-arena.clientHeight*.57))}});reset()})();
</script></body></html>
