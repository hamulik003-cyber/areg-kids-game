<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Կախարդական կողպեքներ 3D</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}body{background:radial-gradient(#688d9d,#193650 75%)}#app{height:100dvh;max-width:650px;margin:auto;padding:9px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}#info{display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:900}.chip{background:linear-gradient(#fff0ce,#cb965c);color:#734625;border:3px solid #a16c40;border-radius:15px;padding:9px 12px;box-shadow:inset 0 2px #fff8,0 4px 10px #0004}#instruction{flex:1;text-align:center;font-size:13px}#scene{flex:1;min-height:240px;position:relative;overflow:hidden;border:5px solid #c89a62;border-radius:26px;background:radial-gradient(ellipse at 48% 32%,#7ea7ae,#385e7a 65%,#182d48);box-shadow:inset 0 5px 25px #091c3788,0 5px 14px #0006}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}#guide{position:absolute;left:10px;right:10px;top:12px;text-align:center;font-weight:850;font-size:13px;text-shadow:0 2px 5px #0008;pointer-events:none}#controls{display:flex;gap:8px}button{font:inherit;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}#controls button{flex:1;border:3px solid #ffe4b6;border-bottom:5px solid #93603b;border-radius:14px;padding:11px 5px;background:linear-gradient(#ffefce,#d3a06c);color:#734525}#controls #unlock{background:linear-gradient(#b5fb93,#35ba5b);border-color:#caffac;border-bottom-color:#187a3a;color:#15592f}#feedback{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:70px;opacity:0;pointer-events:none;transition:opacity .2s}#feedback.show{opacity:1}#overlay{position:absolute;inset:0;background:#0d253dca;z-index:5;display:none;align-items:center;justify-content:center;padding:20px}#overlay.show{display:flex}.modal{background:linear-gradient(#fff0cc,#e2b37b);color:#714425;border:7px solid #a36c3c;border-radius:28px;padding:25px 15px;text-align:center;width:100%;max-width:350px;box-shadow:0 15px 35px #0008}.award{font-size:78px}.modal h2{margin:8px 0 18px}#next{background:linear-gradient(#b9ff92,#3abd5c);border:3px solid #ceffae;border-bottom:5px solid #167839;border-radius:15px;color:#165c30;padding:12px 25px;font-size:18px}@media(max-height:650px){#app{gap:5px}.chip{padding:6px}#controls button{padding:7px 4px}}
</style></head><body><div id="app"><div id="info"><div class="chip" id="phase">Փուլ 1 / 5</div><div id="instruction">Պտտիր օղակները՝ նշանները վերևում հավասարեցնելու համար</div><div class="chip" id="moves">0 պտույտ</div></div><div id="scene"><div id="guide">Սեղմիր օղակին՝ մեկ քայլ պտտելու համար</div><div id="feedback"></div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="result">Կողպեքը բացվեց</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="controls"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="unlock">🔓 Բացել</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#scene'),palette=[0xf9bc60,0x73d5ee,0xf185aa,0x9e8bfa],steps=8,counts=[2,2,3,3,4];
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f7ff,0x254264,2.5));const key=new THREE.DirectionalLight(0xffe7bc,3.5);key.position.set(-5,7,8);scene.add(key);const rim=new THREE.DirectionalLight(0x88dcff,2.1);rim.position.set(5,3,-5);scene.add(rim);
const root=new THREE.Group();scene.add(root);const gold=new THREE.MeshStandardMaterial({color:0xe8b66e,metalness:.7,roughness:.25}),wood=new THREE.MeshStandardMaterial({color:0x956443,roughness:.64}),dark=new THREE.MeshStandardMaterial({color:0x214c61,metalness:.4,roughness:.38});
const plate=new THREE.Mesh(new THREE.CylinderGeometry(4.55,4.7,.55,80),wood);plate.rotation.x=Math.PI/2;plate.position.z=-.47;root.add(plate);const border=new THREE.Mesh(new THREE.TorusGeometry(4.43,.13,12,80),gold);border.position.z=-.11;root.add(border);
const back=new THREE.Mesh(new THREE.CircleGeometry(4.13,80),dark);back.position.z=-.13;root.add(back);
for(let i=0;i<12;i++){const a=i*Math.PI/6;const m=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),gold);m.position.set(Math.cos(a)*4.26,Math.sin(a)*4.26,.03);root.add(m)}
const centerGroup=new THREE.Group();centerGroup.position.z=.52;root.add(centerGroup);const crystalMat=new THREE.MeshPhysicalMaterial({color:0x7fe6ff,metalness:.1,roughness:.08,clearcoat:1,transmission:.18,emissive:0x0a4767,emissiveIntensity:.6});
const crystal=new THREE.Mesh(new THREE.IcosahedronGeometry(.67,1),crystalMat);centerGroup.add(crystal);const halo=new THREE.Mesh(new THREE.TorusGeometry(.91,.08,12,48),gold);centerGroup.add(halo);
const arrow=new THREE.Mesh(new THREE.ConeGeometry(.24,.48,3),new THREE.MeshBasicMaterial({color:0xeaffc5}));arrow.position.set(0,4.0,.3);arrow.rotation.z=Math.PI;root.add(arrow);
let stage=0,rings=[],history=[],turns=0,animating=false,unlocked=false,feedbackTimer;
function ringMesh(radius,color){const group=new THREE.Group(),material=new THREE.MeshStandardMaterial({color,metalness:.45,roughness:.27});const torus=new THREE.Mesh(new THREE.TorusGeometry(radius,.23,14,96),material);group.add(torus);for(let i=0;i<8;i++){const a=i*Math.PI/4;const marker=new THREE.Mesh(new THREE.OctahedronGeometry(i===0?.24:.11,0),i===0?gold:material);marker.position.set(Math.cos(a)*radius,Math.sin(a)*radius,.21);group.add(marker)}return group}
function build(){rings.forEach(r=>{root.remove(r.group);r.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material!==gold)o.material.dispose()})});rings=[];history=[];turns=0;animating=false;unlocked=false;crystal.scale.setScalar(1);crystalMat.emissive.setHex(0x0a4767);$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#moves').textContent='0 պտույտ';$('#guide').textContent='Սեղմիր օղակին՝ մեկ քայլ պտտելու համար';const n=counts[stage];for(let i=0;i<n;i++){const radius=3.38-i*.75,group=ringMesh(radius,palette[i]);group.position.z=.14+i*.08;root.add(group);const position=(stage*3+i*2+2)%8;group.rotation.z=position*Math.PI/4;rings.push({radius,group,position,target:0,rotationTarget:group.rotation.z})}resize()}
function rotate(i,delta=1,record=true){if(animating||unlocked)return;const r=rings[i];if(record)history.push({i,delta});r.position=(r.position+delta+steps)%steps;r.rotationTarget+=delta*Math.PI/4;turns+=Math.abs(delta);$('#moves').textContent=turns+' պտույտ'}
function solved(){return rings.every(r=>r.position===0)}
function flash(s,good){const f=$('#feedback');f.textContent=s;f.style.color=good?'#80ff9f':'#ff7777';f.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>f.classList.remove('show'),650)}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(unlocked||$('#overlay').classList.contains('show'))return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(rings.map(r=>r.group),true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&o.parent!==root)o=o.parent;const i=rings.findIndex(r=>r.group===o);if(i>=0)rotate(i)});
$('#undo').onclick=()=>{if(unlocked||!history.length)return;const h=history.pop();rotate(h.i,-h.delta,false);turns=Math.max(0,turns-2);$('#moves').textContent=turns+' պտույտ'};$('#hint').onclick=()=>{if(unlocked)return;const i=rings.findIndex(r=>r.position!==0);if(i<0)return;const r=rings[i];const prev=r.group.scale.x;r.group.scale.setScalar(1.09);setTimeout(()=>r.group.scale.setScalar(prev),900);flash('💡',true)};$('#reset').onclick=build;$('#next').onclick=()=>{stage=(stage+1)%5;build()};
$('#unlock').onclick=()=>{if(unlocked)return;if(!solved()){flash('✕',false);$('#guide').textContent='Հավասարեցրու բոլոր ոսկեգույն նշանները վերևում';return}unlocked=true;crystalMat.emissive.setHex(0x27c5ec);flash('✓',true);setTimeout(()=>{$('#award').textContent=stage===4?'🏆':'⭐';$('#result').textContent=stage===4?'Բոլոր կախարդական կողպեքները բացված են':'Կողպեքը բացվեց';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')},1300)};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const fov=THREE.MathUtils.degToRad(37);const d=Math.max(13.2,4.95/(Math.tan(fov/2)*Math.min(1,w/h)));camera.position.set(0,0,d);camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let prev=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(40,t-prev||16);prev=t;rings.forEach(r=>{r.group.rotation.z+=(r.rotationTarget-r.group.rotation.z)*Math.min(.24,dt*.015)});crystal.rotation.y+=dt*(unlocked?.003:.00045);crystal.rotation.z+=dt*.00035;if(unlocked)crystal.scale.setScalar(1+.06*Math.sin(t*.008));renderer.render(scene,camera)}build();requestAnimationFrame(tick);
</script></body></html>
