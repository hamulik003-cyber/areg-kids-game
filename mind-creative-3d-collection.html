<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG 3D ստեղծագործական լաբորատորիա</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#58391d;background:#284d63}#app{max-width:760px;height:100dvh;margin:auto;display:flex;flex-direction:column;gap:7px;padding:8px 8px max(8px,env(safe-area-inset-bottom))}#nav{display:flex;align-items:center;gap:7px}button,select{border:3px solid #fff0cf;border-bottom:5px solid #a7723e;border-radius:13px;background:linear-gradient(#ffe8ba,#d9a06a);color:#633d20;font-weight:900;font-size:13px;min-height:43px;padding:6px}#nav button{min-width:44px}#title{flex:1;text-align:center;border:3px solid #fbe0b5;border-radius:14px;background:linear-gradient(#ffe7b9,#d4a06a);padding:10px 4px;font-weight:900;font-size:14px}#counter{font-weight:900;color:white;min-width:34px;text-align:center}#scene{flex:1;min-height:170px;position:relative;overflow:hidden;border:5px solid #b88047;border-radius:22px;background:radial-gradient(ellipse at 50% 10%,#ccecf2,#76b4bd 68%,#407d9a)}#scene canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:absolute;top:8px;left:8px;right:8px;text-align:center;color:white;font-size:12px;font-weight:900;text-shadow:0 2px 5px #244b68;pointer-events:none}#options{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}#options button{min-height:54px;font-size:12px}#options button.active{background:linear-gradient(#e2ffd1,#77d083);color:#265d39}#actions{display:flex;gap:5px}#actions button{flex:1}#actions #action{background:linear-gradient(#c6ffad,#55bd66);color:#285b30}#overlay{position:absolute;inset:0;background:#163c52dc;display:none;place-items:center;padding:20px}#overlay.show{display:grid}#modal{border:6px solid #ab7949;border-radius:24px;background:linear-gradient(#fff2d6,#e0b178);padding:20px;text-align:center;max-width:330px}#modal h3{margin:8px 0 16px}@media(max-height:650px){#app{gap:4px}#options button{min-height:38px;padding:3px}button{min-height:36px;padding:3px}}</style></head><body><div id="app"><div id="nav"><button id="prev">◀</button><div id="title">Ստեղծագործական 3D խաղեր</div><button id="nextGame">▶</button><div id="counter">1/8</div></div><div id="scene"><div id="tip">Ընտրիր դետալը և մատով տեղադրիր 3D դաշտում</div><div id="overlay"><div id="modal"><div style="font-size:62px">🏆</div><h3>Քո ստեղծագործությունը պատրաստ է</h3><button id="continue">Հաջորդ խաղը ▶</button></div></div></div><div id="options"></div><div id="actions"><button id="undo">↶ Հետ</button><button id="turn">⟳ Պտտել</button><button id="action">▶ Փորձարկել</button><button id="clear">✕ Մաքրել</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),names=["Կախարդական կավագործ 3D","Խելացի գյուտարար 3D","Կախարդական կղզի 3D","Հրաշք կենդանի 3D","Գնդակների ուղի 3D","Կախարդական այգեպան 3D","Երաժշտական լաբորատորիա 3D","Երազանքների ամրոց 3D"],choices=[['🐻 Արջուկ','🐰 Նապաստակ','🐱 Կատու','🌈 Գույն'],['⚙️ Անիվ','🪶 Թև','🌀 Շարժիչ','🔩 Պտուտակ'],['🏡 Տնակ','🌳 Ծառ','🌉 Կամուրջ','💧 Լիճ'],['👀 Աչքեր','👂 Ականջներ','🪽 Թևեր','🐾 Ոտքեր'],['🛤️ Ուղի','🔵 Գնդակ','🌀 Պտույտ','🌉 Կամուրջ'],['🌸 Ծաղիկ','🌻 Արևածաղիկ','🌳 Ծառ','💧 Ջուր'],['🔔 Զանգակ','🥁 Թմբուկ','🎹 Քսիլոֆոն','⚙️ Անիվ'],['🏰 Աշտարակ','🧱 Պատ','🚪 Դարպաս','🌉 Կամուրջ']];
const host=$('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,80),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf5fcff,0x4b6c6b,2.6));const sun=new THREE.DirectionalLight(0xffe6b3,3.2);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);const palette=[0xffb567,0x7dc2db,0xb8a0e9,0x8fd29a,0xf17d9a,0xf4d56c];const material=(color,roughness=.58)=>new THREE.MeshStandardMaterial({color,roughness,metalness:.08});const mats=palette.map(c=>material(c)),wood=material(0xc79564),groundMat=material(0x8cbb94),dark=material(0x47556c),glass=material(0x9ddce7,.2),white=material(0xf7f0df),gold=material(0xf2bf64,.3);let game=0,selected=0,placed=[],motion=0,playing=false,spin=0,dragX=null;const root=new THREE.Group();scene.add(root);const base=new THREE.Group();root.add(base);
function mesh(parent,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cube(p,w,h,d,m,x=0,y=0,z=0){return mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z)}
function sphere(p,r,m,x=0,y=0,z=0){return mesh(p,new THREE.SphereGeometry(r,24,16),m,x,y,z)}
function cylinder(p,r1,r2,h,m,x=0,y=0,z=0){return mesh(p,new THREE.CylinderGeometry(r1,r2,h,24),m,x,y,z)}
function torus(p,r,m,x=0,y=0,z=0){const a=mesh(p,new THREE.TorusGeometry(r,.1,10,24),m,x,y,z);a.rotation.y=Math.PI/2;return a}
function item(type,x,z,i){const g=new THREE.Group();g.position.set(x,0,z);root.add(g);const m=mats[(i+placed.length+game)%mats.length];if(game===0){sphere(g,.47,m,0,.7,0);sphere(g,.31,white,0,.83,.37);for(const a of [-.29,.29])sphere(g,.15,m,a,1.08,0);for(const a of [-.15,.15])sphere(g,.065,dark,a,.85,.65);sphere(g,.09,dark,0,.67,.67);if(type===3)sphere(g,.2,m,0,1.45,0)}
else if(game===1){cube(g,.9,.28,.8,wood,0,.4,0);if(type===0){torus(g,.46,dark,0,.78,0)}if(type===1){const w=cube(g,1.4,.12,.4,m,0,.83,0);w.rotation.z=.4}if(type===2){cylinder(g,.4,.4,.6,m,0,.9,0);sphere(g,.23,gold,0,1.28,0)}if(type===3){cylinder(g,.16,.16,.9,dark,0,.9,0)}}
else if(game===2){if(type===0){cube(g,1.1,.8,1,wood,0,.5,0);const roof=mesh(g,new THREE.ConeGeometry(.86,.7,4),m,0,1.23,0);roof.rotation.y=Math.PI/4;cube(g,.25,.5,.05,dark,0,.38,.53)}if(type===1){cylinder(g,.14,.19,1.3,wood,0,.8,0);sphere(g,.66,groundMat,0,1.65,0)}if(type===2){cube(g,1.7,.2,.7,wood,0,.55,0);for(const a of [-.65,.65])cube(g,.13,.7,.7,wood,a,.2,0)}if(type===3){const lake=cylinder(g,.85,.85,.06,glass,0,.13,0);lake.scale.z=.7}}
else if(game===3){if(type===0){for(const a of [-.25,.25])sphere(g,.2,white,a,.9,.45);for(const a of [-.25,.25])sphere(g,.1,dark,a,.92,.62)}if(type===1){for(const a of [-.42,.42]){const ear=sphere(g,.24,m,a,1.35,0);ear.scale.y=1.8}}if(type===2){for(const a of [-.7,.7]){const wing=sphere(g,.4,m,a,.75,0);wing.scale.set(1.4,.25,.8)}}if(type===3){for(const a of [-.45,.45])cylinder(g,.17,.17,.65,m,a,.35,0)}}
else if(game===4){if(type===0){const ramp=cube(g,1.5,.15,.65,wood,0,.45,0);ramp.rotation.z=.3}if(type===1)sphere(g,.31,m,0,.6,0);if(type===2){const ring=torus(g,.5,gold,0,.7,0);ring.rotation.z=Math.PI/2}if(type===3){cube(g,1.5,.17,.8,wood,0,.65,0);for(const a of [-.6,.6])cube(g,.12,.7,.7,wood,a,.27,0)}}
else if(game===5){if(type===0||type===1){cylinder(g,.1,.12,.9,groundMat,0,.62,0);for(let a=0;a<6;a++){const angle=a*Math.PI/3;sphere(g,.24,m,Math.cos(angle)*.3,1.18+Math.sin(angle)*.3,0)}sphere(g,.19,gold,0,1.18,.08)}if(type===2){cylinder(g,.16,.22,1.2,wood,0,.75,0);sphere(g,.6,groundMat,0,1.58,0)}if(type===3){const w=cylinder(g,.5,.35,.15,glass,0,.2,0);w.scale.z=.6}}
else if(game===6){if(type===0){cylinder(g,.25,.37,.55,gold,0,.7,0);sphere(g,.09,dark,0,.35,0)}if(type===1){cylinder(g,.46,.46,.62,m,0,.52,0);cylinder(g,.46,.46,.08,white,0,.86,0)}if(type===2){cube(g,1.2,.25,.6,wood,0,.5,0);for(let j=0;j<5;j++)cube(g,.16,.07,.45,mats[j],-.4+j*.2,.67,0)}if(type===3){torus(g,.43,dark,0,.8,0)}}
else{if(type===0){cylinder(g,.45,.55,1.8,wood,0,1.02,0);cylinder(g,.57,.57,.25,m,0,2,0);const roof=mesh(g,new THREE.ConeGeometry(.68,.8,5),m,0,2.5,0)}if(type===1)cube(g,1.4,.95,.35,wood,0,.58,0);if(type===2){cube(g,1.25,1.35,.32,wood,0,.78,0);cube(g,.5,.8,.04,dark,0,.4,.2)}if(type===3){cube(g,1.7,.22,.6,wood,0,.8,0);for(const a of [-.7,.7])cube(g,.15,.85,.5,wood,a,.42,0)}}return g}
function makeBase(){base.clear();if(game===2){cylinder(base,4.5,3.6,.65,groundMat,0,-.45,0);cylinder(base,4.65,4.65,.24,wood,0,-.83,0)}else if(game===0){cylinder(base,3.4,3.4,.35,wood,0,-.3,0);cylinder(base,3.1,3.1,.1,white,0,-.06,0)}else{cube(base,9,.35,7,game===5?groundMat:wood,0,-.38,0);cube(base,8.7,.09,6.7,game===5?groundMat:white,0,-.16,0)}if(game===3){sphere(base,.82,mats[2],0,.9,0);sphere(base,.62,mats[2],0,1.86,0);sphere(base,.18,white,0,1.68,.58)}}
function reset(){for(const p of placed)root.remove(p);placed=[];motion=0;playing=false;spin=0;root.rotation.y=0;makeBase();$('#overlay').classList.remove('show');$('#tip').textContent='Ընտրիր դետալը և մատով տեղադրիր 3D դաշտում'}
function switchGame(n){game=(n+8)%8;selected=0;$('#title').textContent=names[game];$('#counter').textContent=(game+1)+'/8';$('#options').innerHTML='';choices[game].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>select(i);$('#options').append(b)});reset();select(0)}
function select(i){selected=i;Array.from($('#options').children).forEach((b,j)=>b.classList.toggle('active',i===j))}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),point=new THREE.Vector3();renderer.domElement.addEventListener('pointerdown',e=>{dragX=e.clientX});renderer.domElement.addEventListener('pointerup',e=>{if(dragX===null)return;const delta=e.clientX-dragX;dragX=null;if(Math.abs(delta)>22){root.rotation.y+=delta*.007;return}const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);if(ray.ray.intersectPlane(plane,point)){const x=THREE.MathUtils.clamp(point.x,-3.4,3.4),z=THREE.MathUtils.clamp(point.z,-2.7,2.7);placed.push(item(selected,x,z,selected));$('#tip').textContent='Ապրես։ Ավելացրու նոր դետալ կամ փորձարկիր'}});
$('#undo').onclick=()=>{const p=placed.pop();if(p)root.remove(p)};$('#clear').onclick=reset;$('#turn').onclick=()=>root.rotation.y+=Math.PI/4;$('#action').onclick=()=>{if(!placed.length){$('#tip').textContent='Նախ ավելացրու առնվազն մեկ դետալ';return}playing=true;motion=0;$('#tip').textContent='Քո ստեղծագործությունն աշխատում է'};$('#prev').onclick=()=>switchGame(game-1);$('#nextGame').onclick=()=>switchGame(game+1);$('#continue').onclick=()=>switchGame(game+1);
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(7.7,9.4,Math.max(12,8/Math.max(.45,camera.aspect)));camera.lookAt(0,.35,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let last=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last||16)/1000);last=t;if(playing){motion+=dt;for(let i=0;i<placed.length;i++){const p=placed[i];p.rotation.y+=dt*(game===1||game===6?2:.65);p.position.y=Math.sin(motion*2+i)*.09}if(motion>3){playing=false;$('#overlay').classList.add('show')}}renderer.render(scene,camera)}switchGame(0);requestAnimationFrame(tick);
</script></body></html>
