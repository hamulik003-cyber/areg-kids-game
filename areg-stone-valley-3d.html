<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Արեգ․ Քարե հովիտ — 3D</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;touch-action:none;background:#1c3544;font-family:system-ui}#view{position:absolute;inset:0}#hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 8px #14222a}#name{position:absolute;top:12px;left:12px;background:#142b35aa;padding:9px 12px;border-radius:12px;font-size:13px}#hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;background:#162c36a9;padding:7px 11px;border-radius:9px}#left,#right,#jump,#action{position:absolute;bottom:18px;width:70px;height:70px;border:2px solid #ffffff88;border-radius:22px;background:#193d4eb8;color:white;font-size:30px;pointer-events:auto;touch-action:none}#left{left:14px}#right{left:92px}#jump{right:14px;background:#b96c35db}#action{right:95px;background:#52785add}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#132532b9;color:white;text-align:center;z-index:10}#overlay article{background:#294b59;padding:25px;border:2px solid #e7c58e;border-radius:20px}#overlay button{padding:13px 20px;border:0;border-radius:12px;background:#edce8e;font-weight:900}#error{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#fff;padding:28px;background:#223a45}</style></head><body><div id="view"></div><div id="hud"><div id="name">ԱՐԵԳ · ՔԱՐԵ ՀՈՎԻՏ <small>3D ENGINE</small><div id="score">✦ 0 / 5</div></div><div id="hint">Գտիր երեք բյուրեղը և բացիր կամուրջը</div><button id="left">◀</button><button id="right">▶</button><button id="action">✦</button><button id="jump">↑</button></div><div id="overlay"><article><h2>Ապրե՛ս, Արեգ 🌟</h2><p>Դու անցար քարե հովիտը։</p><button onclick="location.reload()">Նորից խաղալ</button></article></div><div id="error">3D շարժիչը չբեռնվեց։ Ստուգիր ինտերնետ կապը և կրկին բացիր AREG TEST-ը։</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(()=>{'use strict';if(!window.THREE){document.querySelector('#error').style.display='grid';return}
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x9eb7bb);scene.fog=new T.FogExp2(0xb9b5a2,.012);
const camera=new T.PerspectiveCamera(44,1,.1,550),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.querySelector('#view').appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xe4f4ff,0x76523d,2));const sun=new T.DirectionalLight(0xffd7a0,3);sun.position.set(-18,38,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:0}),sand=mat(0xb89c77),rock=mat(0x85715e),rock2=mat(0xb5a083),dark=mat(0x4a514a),grass=mat(0x657d55),gold=mat(0xffe3a0,.3),wood=mat(0x735342),crystalMat=new T.MeshStandardMaterial({color:0x80efff,emissive:0x25a5c4,emissiveIntensity:.8,metalness:.22,roughness:.18});
const box=(w,h,d,m,x,y,z=0,cast=true)=>{const a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.castShadow=cast;a.receiveShadow=true;scene.add(a);return a};
const sphere=(r,m,x,y,z)=>{const a=new T.Mesh(new T.IcosahedronGeometry(r,1),m);a.position.set(x,y,z);a.castShadow=true;scene.add(a);return a};
const landSegments=[[0,19],[23,41],[46,65],[70,93]];for(const [a,b] of landSegments){box(b-a,2,14,sand,(a+b)/2,-1,0);box(b-a,.24,14,grass,(a+b)/2,.03,0,false)}
const platforms=[{x:12,y:2.3,w:4},{x:28,y:3.2,w:5},{x:36,y:5.3,w:4},{x:54,y:2.5,w:5},{x:62,y:4.5,w:4}];for(const p of platforms){box(p.w,.65,3,rock2,p.x,p.y-.32,0);box(p.w,.16,3,grass,p.x,p.y+.04,0)}
// Actual 3D cliffs, vegetation, ruins, bridges and cast shadows, independent from old Canvas artwork.
for(let i=0;i<70;i++){const x=i*1.9-15,z=-15-(i%4)*4,h=4+((i*13)%17);const mesh=new T.Mesh(new T.ConeGeometry(2.8+(i%3),h,5),i%2?rock:rock2);mesh.position.set(x,h*.33,z);mesh.rotation.y=i*2.13;scene.add(mesh)}
for(let i=0;i<65;i++){const x=(i*17.3)%108-7,z=-5-(i%5)*2;const height=1+(i%4)*.6;const trunk=box(.22,height,.22,wood,x,height/2,z);trunk.castShadow=false;sphere(.75,grass,x,height+.2,z)}
for(let i=0;i<18;i++){const x=2+i*5.2,z=4+(i%3)*1.4;sphere(.4+(i%3)*.18,i%2?rock:rock2,x,.35,z)}
for(const x of [22,45,69]){box(.9,5,1.3,rock,x,2.5,-4);box(.9,5,1.3,rock,x+4,2.5,-4);box(5.2,.8,1.3,rock2,x+2,5.3,-4)}
const hero=new T.Group();scene.add(hero);const heroSprite=new T.TextureLoader().load('./a_high_resolution_cutout_png_style_illustration_on.png');heroSprite.colorSpace=T.SRGBColorSpace;const heroPlane=new T.Mesh(new T.PlaneGeometry(2.1,3),new T.MeshBasicMaterial({map:heroSprite,transparent:true,alphaTest:.08,side:T.DoubleSide,depthWrite:false}));heroPlane.position.y=1.48;hero.add(heroPlane);const shadow=new T.Mesh(new T.CircleGeometry(.85,24),new T.MeshBasicMaterial({color:0x172b2b,transparent:true,opacity:.25,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.07;hero.add(shadow);
const gems=[{x:12,y:4.4},{x:36,y:7.4},{x:62,y:6.7},{x:79,y:2.5},{x:88,y:2.5}].map((p,i)=>{const a=new T.Mesh(new T.OctahedronGeometry(.65),crystalMat);a.position.set(p.x,p.y,0);scene.add(a);return{...p,mesh:a,taken:false}});
const gate=box(2,6,2,rock2,73,3,-2);const door=box(.45,4,1.6,dark,73,2,0);const bridge=[];for(let i=0;i<6;i++){const m=box(.9,.35,3,wood,65.7+i*.75,-3,0);bridge.push(m)}
const guardian=new T.Group();scene.add(guardian);guardian.position.set(53,0,0);const torso=box(1.5,2,1.1,dark,0,0,-30);guardian.add(torso);torso.position.set(0,1.6,0);const head=new T.Mesh(new T.DodecahedronGeometry(.8),rock);head.position.y=3;guardian.add(head);const eyeMat=new T.MeshBasicMaterial({color:0x80ffff});for(const xx of [-.3,.3]){const eye=new T.Mesh(new T.SphereGeometry(.12,8,8),eyeMat);eye.position.set(xx,3.1,.67);guardian.add(eye)}
let x=2,y=0,vy=0,axis=0,jump=false,score=0,opened=false,finished=false,clock=0,invuln=0;const keys={};function onGround(px,py){for(const [a,b] of landSegments)if(px>a+.5&&px<b-.5&&py<=.15)return 0;for(const p of platforms)if(px>p.x-p.w/2+.2&&px<p.x+p.w/2-.2&&py>=p.y-.4&&py<=p.y+.35)return p.y;return null}
function bind(id,v){const b=document.querySelector(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(v==='jump')jump=true;else if(v==='action')activate();else axis=v});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(typeof v==='number'&&axis===v)axis=0})}bind('#left',-1);bind('#right',1);bind('#jump','jump');bind('#action','action');
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp')jump=true;if(e.key==='e')activate()});addEventListener('keyup',e=>{keys[e.key]=false});
function activate(){if(x>69&&x<76&&score>=3){opened=true;door.visible=false;bridge.forEach(m=>m.position.y=-.25);document.querySelector('#hint').textContent='Կամուրջը բացվեց։ Շարունակիր ճանապարհը։'}}
const clock3=new T.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock3.getDelta(),.04);clock+=dt;if(finished)return;let direction=axis||(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);const oldX=x,oldY=y;x+=direction*6.8*dt;if(!opened&&oldX<72&&x>=72)x=71.1;if(!opened&&oldX>74&&x<=74)x=74.9;
const footing=onGround(oldX,oldY);if(jump&&footing!==null&&Math.abs(y-footing)<.12){vy=10.2;jump=false}else if(jump)jump=false;
vy-=25*dt;let ny=y+vy*dt;const floor=onGround(x,ny);if(vy<=0&&floor!==null&&oldY>=floor-.12&&ny<=floor){ny=floor;vy=0}y=ny;if(y< -12){x=Math.max(2,x-7);y=3;vy=0}
hero.position.set(x,y,0);heroPlane.scale.x=direction<0?-1:1;heroPlane.rotation.z=direction?Math.sin(clock*17)*.035:0;shadow.material.opacity=Math.max(.04,.25-y*.03);
for(const gem of gems){if(gem.taken)continue;gem.mesh.rotation.y+=dt;gem.mesh.position.y=gem.y+Math.sin(clock*2+gem.x)*.2;if(Math.abs(x-gem.x)<1.1&&Math.abs(y+1.5-gem.y)<1.8){gem.taken=true;scene.remove(gem.mesh);score++;document.querySelector('#score').textContent='✦ '+score+' / 5';if(score>=3)document.querySelector('#hint').textContent='Դարպասի մոտ սեղմիր ✦'}}
guardian.position.x=53+Math.sin(clock*.8)*2;guardian.rotation.y=Math.sin(clock)*.3;if(invuln>0)invuln-=dt;if(Math.abs(x-guardian.position.x)<1.3&&y<3.5&&invuln<=0){x=Math.max(47,x-5);y=2;vy=0;invuln=2}
if(x>91){finished=true;document.querySelector('#overlay').style.display='grid'}
camera.position.lerp(new T.Vector3(x+3,8,29),.055);camera.lookAt(x+3,3,0);sun.position.x=x-18;renderer.render(scene,camera)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();frame();
})();
</script></body></html>
