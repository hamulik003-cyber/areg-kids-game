<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ժամանակի կախարդը</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif;color:#54301a}body{background:linear-gradient(#67c4ff,#c9f3ff 50%,#7cd58c 50%,#42a869)}.head{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:10px;right:10px;display:grid;grid-template-columns:46px 1fr 58px;gap:8px;z-index:5}.wood{background:linear-gradient(#fff1c7,#f3bd76);border:3px solid #a96a36;box-shadow:0 5px 0 #89502b,inset 0 2px #fff8e8;border-radius:14px;min-height:45px;display:grid;place-items:center;font-weight:900;text-align:center}.wood a{color:inherit;text-decoration:none}.title{font-size:clamp(15px,4.3vw,22px)}.screen{position:absolute;top:calc(env(safe-area-inset-top,0px) + 77px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:9px;right:9px;display:flex;flex-direction:column;gap:9px;max-width:560px;margin:auto}.scene{flex:1;min-height:0;border:5px solid #b9773d;border-radius:23px;overflow:hidden;background:linear-gradient(#83cfff 0%,#d7f5ff 60%,#a4dc73 60%,#66b95c 100%);box-shadow:0 10px 18px #5d4a3060;position:relative}.scene svg{width:100%;height:100%;display:block}.panel{background:linear-gradient(#ffeac2,#e9ae67);border:4px solid #a76937;border-radius:20px;padding:12px;box-shadow:0 7px 0 #80502d}.caption{text-align:center;font-size:15px;font-weight:900;margin:0 0 9px}.controls{display:flex;gap:8px;align-items:center}.controls button{border:0;border-radius:12px;background:linear-gradient(#8bdcff,#3d96db);color:white;font-size:20px;font-weight:900;padding:9px 12px;box-shadow:0 4px 0 #2766a0;min-width:56px}.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #2766a0}input[type=range]{flex:1;min-width:0;accent-color:#e67b2b;height:40px;touch-action:none}.row{display:flex;gap:8px;justify-content:center;margin-top:10px}.row button{border:3px solid #fff1bd;border-radius:12px;background:linear-gradient(#72d875,#278f49);color:#fff;font-size:15px;font-weight:900;padding:9px 13px;flex:1;box-shadow:0 4px 0 #277140}.row button.alt{background:linear-gradient(#ffbd71,#e47b32);box-shadow:0 4px 0 #b75a27}.message{position:absolute;top:10px;left:10px;right:10px;text-align:center;background:#fff1c9e9;border:2px solid #efba70;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:900;z-index:2}.badge{font-size:12px;text-align:center;margin-top:6px;font-weight:800;color:#754527}@media(max-height:650px){.panel{padding:7px}.caption{margin-bottom:2px}.row{margin-top:3px}.screen{gap:5px}}</style></head><body><header class="head"><div class="wood"><a href="index.html">←</a></div><div class="wood title">Ժամանակի կախարդը</div><div class="wood">⭐ <span id="stars">0</span></div></header><main class="screen"><section class="scene"><div class="message" id="message">⏳ Ժամանակը հետ տուր, բացիր կամուրջը։</div><svg viewBox="0 0 390 460" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="ball" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbc0"/><stop offset=".42" stop-color="#ffba24"/><stop offset="1" stop-color="#e66c16"/></linearGradient><linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8d68c"/><stop offset="1" stop-color="#ab6736"/></linearGradient></defs><circle cx="323" cy="92" r="42" fill="#ffe8a0" opacity=".85"/><path d="M0 304 Q65 277 127 303 L127 460 H0Z" fill="#68bd55"/><path d="M262 305 Q320 280 390 298 L390 460 H262Z" fill="#68bd55"/><path d="M126 307 L126 460 H262 V307" fill="#67b5e2"/><path d="M130 340 Q160 330 195 342 T260 342 M130 390 Q165 380 195 390 T260 390" stroke="#d2f5ff" stroke-width="5" fill="none"/><path d="M0 297 H127 M262 297 H390" stroke="#e6c086" stroke-width="20"/><g id="bridgeGroup"><rect x="123" y="284" width="143" height="22" rx="6" fill="url(#bridge)" stroke="#825029" stroke-width="4"/><path d="M144 288 V304 M170 288 V304 M196 288 V304 M222 288 V304 M247 288 V304" stroke="#935b32" stroke-width="3"/></g><g id="ballGroup"><ellipse id="shadow" cx="65" cy="297" rx="19" ry="5" fill="#2c683b55"/><circle id="sphere" cx="65" cy="268" r="24" fill="url(#ball)" stroke="#d77717" stroke-width="3"/><circle id="shine" cx="57" cy="259" r="8" fill="#fff9d5" opacity=".85"/><circle id="eye1" cx="59" cy="271" r="2.6" fill="#5a3827"/><circle id="eye2" cx="71" cy="271" r="2.6" fill="#5a3827"/><path id="smile" d="M60 279 Q65 284 70 279" stroke="#754326" stroke-width="2" fill="none"/></g><g id="goal"><path d="M348 291 V208" stroke="#77512e" stroke-width="7"/><path d="M351 211 L390 225 L351 241Z" fill="#f4535e"/><circle cx="348" cy="293" r="8" fill="#a26c36"/></g><g id="sparkles" opacity="0"><text x="300" y="170" font-size="42">🌟</text><text x="341" y="139" font-size="24">✨</text></g></svg></section><section class="panel"><p class="caption" id="caption">Քաշիր ժամացույցը՝ ժամանակը կառավարելու համար</p><div class="controls"><button id="rew" aria-label="Հետ">⏪</button><input id="timeline" type="range" min="0" max="100" step="1" value="0" aria-label="Ժամանակ"/><button id="fwd" aria-label="Առաջ">⏩</button></div><div class="row"><button class="alt" id="switch">🌉 Կամուրջը՝ բաց</button><button id="play">▶ Շարժվել</button><button class="alt" id="reset">↻</button></div><div class="badge" id="badge">Փուլ 1/3 • Փորձիր հասնել դրոշակին</div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let level=1,stars=0,t=0,bridgeOpen=true,playing=false,timer=null,won=false;const timeline=$('timeline');function stop(){playing=false;clearInterval(timer);timer=null;$('play').textContent='▶ Շարժվել'}function draw(){const x=65+t*2.85;const falling=!bridgeOpen&&x>119&&x<272;const y=falling?268+Math.min(160,(x-119)*2.3):268;['sphere','shine','eye1','eye2','smile','shadow'].forEach(id=>{const el=$(id);el.setAttribute('transform','translate('+(x-65)+','+(id==='shadow'?0:y-268)+')')});$('bridgeGroup').setAttribute('opacity',bridgeOpen?'1':'.08');$('sparkles').setAttribute('opacity',won?'1':'0');timeline.value=t;if(falling&&playing){stop();$('message').textContent='Օ՜հ։ Հետ տուր ժամանակը և բացիր կամուրջը։'}if(t>=100&&!won){won=true;stop();stars+=1;$('stars').textContent=stars;$('message').textContent='🏆 Ապրե՜ս։ Հասար նպատակին։';$('caption').textContent='Հաղթանակ։ Կարող ես շարունակել։';$('play').textContent='Հաջորդ փուլ ▶'}}function setTime(v){t=Math.max(0,Math.min(100,Number(v)));if(t<100)won=false;draw()}timeline.addEventListener('input',()=>{stop();setTime(timeline.value);$('message').textContent='⏳ Դու կառավարում ես ժամանակը։'});$('rew').onclick=()=>{stop();setTime(t-15)};$('fwd').onclick=()=>{stop();setTime(t+15)};$('switch').onclick=()=>{bridgeOpen=!bridgeOpen;$('switch').textContent='🌉 Կամուրջը՝ '+(bridgeOpen?'բաց':'փակ');$('message').textContent=bridgeOpen?'Կամուրջը բաց է։ Փորձիր շարժվել։':'Կամուրջը փակ է։ Կկարողանա՞ս ժամանակը հետ տալ։';draw()};$('play').onclick=()=>{if(won){level=level%3+1;won=false;t=0;bridgeOpen=level===1;$('switch').textContent='🌉 Կամուրջը՝ '+(bridgeOpen?'բաց':'փակ');$('badge').textContent='Փուլ '+level+'/3 • Հասցրու գնդակը դրոշակին';$('message').textContent=level===1?'Բացիր ճանապարհը։':'Ժամանակը հետ տուր, հետո բացիր կամուրջը։';$('caption').textContent='Քաշիր ժամացույցը՝ ժամանակը կառավարելու համար';draw();return}if(playing){stop();return}playing=true;$('play').textContent='⏸ Դադար';timer=setInterval(()=>{if(!playing)return;setTime(t+1)},75)};$('reset').onclick=()=>{stop();won=false;t=0;bridgeOpen=true;$('switch').textContent='🌉 Կամուրջը՝ բաց';$('message').textContent='Նորից փորձիր։';draw()};draw()})();</script></body></html>
