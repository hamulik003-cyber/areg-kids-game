<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Փոքրիկ շինարար 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}body{background:#24445a;color:#fff}#game{height:100dvh;display:flex;flex-direction:column;padding:8px 10px max(8px,env(safe-area-inset-bottom));gap:8px;max-width:760px;margin:auto}#info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:850;font-size:14px}#info span{background:#f4d5a2;color:#704722;border:3px solid #c48e55;border-radius:12px;padding:7px 9px}#info b{text-align:center}#scene{flex:1;position:relative;min-height:180px;border:5px solid #c08b55;border-radius:23px;overflow:hidden;background:linear-gradient(#9fd9f1,#e2eecb)}canvas{width:100%;height:100%;display:block;touch-action:none}#tip{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-size:13px;font-weight:800;text-shadow:0 2px 5px #123a58;pointer-events:none}#tools,#controls{display:flex;gap:6px}button{font:800 13px system-ui;border:3px solid #f5d6a6;border-bottom:5px solid #9d673b;border-radius:13px;background:linear-gradient(#fff1cb,#dda96c);color:#70431f;padding:10px 6px;min-width:0}#tools button{flex:1}button.active{background:linear-gradient(#dbffc1,#74c96e);border-color:#e8ffd0;color:#285d30}#controls button{flex:1}#controls #go{background:linear-gradient(#bdff99,#48bc62);color:#215a33}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#102d45d9}#overlay.show{display:grid}#panel{border:6px solid #a87545;border-radius:24px;background:linear-gradient(#fff1d1,#e6b87c);padding:22px;text-align:center;color:#704321}#panel strong{display:block;font-size:60px}#panel h2{font-size:19px}#next{background:linear-gradient(#c7ff9f,#49c16b)}@media(max-height:670px){#game{gap:4px}button{padding:5px 3px}#info span{padding:4px}}
</style></head><body><div id="game"><div id="info"><span id="phase">Փուլ 1 / 5</span><b>Փոքրիկ շինարար 3D</b><span id="progress">0 / 3</span></div><div id="scene"><div id="tip">Ընտրիր մեքենան և կառավարիր շինհրապարակը</div><div id="overlay"><div id="panel"><strong id="award">⭐</strong><h2 id="result">Շինարարությունն ավարտված է</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="tools"><button data-tool="excavator" class="active">🚜 Էքսկավատոր</button><button data-tool="truck">🚚 Բեռնատար</button><button data-tool="crane">🏗️ Կռունկ</button></div><div id="controls"><button id="left">◀ Ձախ</button><button id="go">⬆ Գործել</button><button id="right">Աջ ▶</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf6fcff,0x617458,2.6));const sun=new THREE.DirectionalLight(0xffe8b4,3.4);sun.position.set(-7,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;sun.shadow.normalBias=.035;sun.shadow.bias=-.0001;scene.add(sun);const fill=new THREE.DirectionalLight(0x9ed7ff,1.3);fill.position.set(6,4,-5);scene.add(fill);
const mat=(c,metalness=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness});const yellow=mat(0xf4b640,.16),orange=mat(0xe77e43,.13),blue=mat(0x66b6d3,.15),dark=mat(0x334556),steel=mat(0xc9d7d8,.65),glass=mat(0x8ce3f2,.18),earth=mat(0xa9825b),grass=mat(0x8fc47b),concrete=mat(0xb5b9b5),wood=mat(0xb17a48);
function rounded(w,h,d){const radius=Math.min(w,h,d)*.13,shape=new THREE.Shape(),x=-w/2,y=-h/2,r=radius;shape.moveTo(x+r,y);shape.lineTo(x+w-r,y);shape.quadraticCurveTo(x+w,y,x+w,y+r);shape.lineTo(x+w,y+h-r);shape.quadraticCurveTo(x+w,y+h,x+w-r,y+h);shape.lineTo(x+r,y+h);shape.quadraticCurveTo(x,y+h,x,y+h-r);shape.lineTo(x,y+r);shape.quadraticCurveTo(x,y,x+r,y);const g=new THREE.ExtrudeGeometry(shape,{depth:Math.max(.01,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r*.55,bevelSegments:3,curveSegments:5});g.translate(0,0,-(d-2*r)/2);return g}function box(p,w,h,d,m,x=0,y=0,z=0){const a=new THREE.Mesh(rounded(w,h,d),m);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;p.add(a);return a}function cyl(p,r,h,m,x=0,y=0,z=0,segments=18){const a=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),m);a.position.set(x,y,z);a.castShadow=true;p.add(a);return a}function wheel(p,x,z){const w=cyl(p,.38,.24,dark,x,.37,z);w.rotation.x=Math.PI/2;const hub=cyl(p,.19,.26,steel,x,.37,z);hub.rotation.x=Math.PI/2;const ring=new THREE.Mesh(new THREE.TorusGeometry(.27,.045,8,22),yellow);ring.position.set(x,.37,z+(z>0?.14:-.14));p.add(ring)}
const world=new THREE.Group();scene.add(world);box(world,18,.3,13,grass,0,-.22,0);box(world,17,.05,3,earth,0,-.04,3.5);box(world,5,.08,3.2,concrete,3,-.04,-2.7);const pit=box(world,3.3,.07,3,earth,-4.2,-.02,-2.4);const pile=new THREE.Mesh(new THREE.ConeGeometry(1.1,.9,12),earth);pile.position.set(-4.3,.4,-2.5);pile.castShadow=true;world.add(pile);
const excavator=new THREE.Group();world.add(excavator);excavator.position.set(-4,0,1.3);box(excavator,2.1,.52,1.25,yellow);box(excavator,1.1,.9,1.05,yellow,-.35,.75,0);box(excavator,.75,.55,.07,glass,-.35,.84,.57);for(const x of [-.65,.65])for(const z of [-.58,.58])wheel(excavator,x,z);
const armPivot=new THREE.Group();armPivot.position.set(.55,.77,0);excavator.add(armPivot);const boom=box(armPivot,1.9,.22,.28,yellow,.83,.56,0);boom.rotation.z=.52;const bucket=box(armPivot,.75,.48,.83,steel,1.85,.94,0);bucket.rotation.z=-.32;for(let z of [-.28,0,.28]){const tooth=box(armPivot,.26,.12,.13,steel,2.19,.64,z);tooth.rotation.z=-.32}const hydraulic=box(armPivot,.1,1.08,.11,steel,.88,.22,.23);hydraulic.rotation.z=-.55;
const truck=new THREE.Group();world.add(truck);truck.position.set(0,0,3.1);box(truck,2.4,.4,1.2,orange);box(truck,.88,.95,1.2,orange,.8,.65,0);box(truck,.55,.48,.05,glass,.87,.76,.63);const bed=box(truck,1.3,.34,1.22,wood,-.58,.62,0);for(const x of [-.78,.72])for(const z of [-.55,.55])wheel(truck,x,z);
const crane=new THREE.Group();world.add(crane);crane.position.set(3.1,0,-2.5);box(crane,1.8,.3,1.8,yellow,0,.12,0);const tower=box(crane,.4,4.6,.4,yellow,0,2.35,0);for(let y=.5;y<4.5;y+=.75){const cross=box(crane,.48,.075,.52,steel,0,y,0);cross.rotation.y=.78}const pivot=new THREE.Group();pivot.position.y=4.6;crane.add(pivot);box(pivot,5,.25,.4,yellow,-.5,0,0);box(pivot,1,.55,.8,orange,1.2,-.36,0);const cable=box(pivot,.045,2.1,.045,steel,-2.3,-1.1,0);const hook=cyl(pivot,.2,.26,steel,-2.3,-2.2,0);
const stack=new THREE.Group();world.add(stack);stack.position.set(3,0,-2.65);const blocks=[];for(let i=0;i<5;i++){const b=box(stack,1.2,.56,1,mat([0xefa477,0x87c4d6,0xd9bb7d,0x9ad29b,0xb6a1dc][i]),0,.3+i*.57,0);b.visible=false;blocks.push(b)}
const cargo=[];for(let i=0;i<5;i++){const c=box(world,.65,.5,.65,mat([0xdfa76a,0x92d3ae,0x91bfe1,0xe8bc75,0xc6a0dd][i]),-3.8+(i%2)*.8,.3,-2.5+Math.floor(i/2)*.8);cargo.push(c)}
let phase=0,tool='excavator',done=0,need=3,acting=false,anim=0,won=false,step=0,vehicleX=0;const counts=[3,3,4,4,5];
function select(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('#tip').textContent=t==='excavator'?'Էքսկավատորով հող հավաքիր՝ «Գործել»':t==='truck'?'Բեռնատարով բեռը տեղափոխիր՝ «Գործել»':'Կռունկով բլոկները տեղադրիր՝ «Գործել»'}
function reset(){done=0;need=counts[phase];acting=false;won=false;anim=0;step=0;vehicleX=0;excavator.position.x=-4;truck.position.x=0;crane.rotation.y=0;armPivot.rotation.z=0;bed.rotation.z=0;for(const b of blocks)b.visible=false;for(const c of cargo)c.visible=true;$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(phase+1)+' / 5';$('#progress').textContent='0 / '+need;select('excavator')}
function act(){if(acting||won)return;acting=true;anim=0;step=0;$('#tip').textContent='Շինարարական աշխատանքը ընթացքի մեջ է…'}
function completeAction(){acting=false;done++;$('#progress').textContent=done+' / '+need;const idx=done-1;if(tool==='excavator'&&cargo[idx])cargo[idx].visible=false;if(tool==='crane'&&blocks[idx])blocks[idx].visible=true;if(done>=need){won=true;$('#award').textContent=phase===4?'🏆':'⭐';$('#result').textContent=phase===4?'Մեծ շինարարությունն ավարտված է':'Առաջադրանքը կատարված է';$('#next').textContent=phase===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')}else $('#tip').textContent='Ապրես։ Կատարիր հաջորդ գործողությունը'}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(!acting&&!won)select(b.dataset.tool)});$('#go').onclick=act;$('#reset').onclick=reset;$('#next').onclick=()=>{phase=(phase+1)%5;reset()};
$('#left').onclick=()=>{if(acting||won)return;if(tool==='excavator')excavator.position.x=Math.max(-5.5,excavator.position.x-.35);if(tool==='truck')truck.position.x=Math.max(-4,truck.position.x-.35);if(tool==='crane')pivot.rotation.y+=.15};$('#right').onclick=()=>{if(acting||won)return;if(tool==='excavator')excavator.position.x=Math.min(-2.5,excavator.position.x+.35);if(tool==='truck')truck.position.x=Math.min(4,truck.position.x+.35);if(tool==='crane')pivot.rotation.y-=.15};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const f=Math.tan(THREE.MathUtils.degToRad(21));camera.position.set(10,11,Math.max(13,7.8/(f*Math.min(1,camera.aspect))));camera.lookAt(0,.7,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let last=0;function tick(now){requestAnimationFrame(tick);const dt=Math.min(.04,(now-last||16)/1000);last=now;if(acting){anim+=dt;if(tool==='excavator'){armPivot.rotation.z=Math.sin(anim*3)*.4;bucket.rotation.z=-.3+Math.sin(anim*3)*.3}else if(tool==='truck'){truck.position.x=Math.sin(anim*1.5)*2.3;bed.rotation.z=Math.max(0,Math.sin(anim*2))*.32}else{pivot.rotation.y=Math.sin(anim*1.3)*.5;cable.scale.y=.85+.14*Math.sin(anim*2)}if(anim>2.2){armPivot.rotation.z=0;bed.rotation.z=0;completeAction()}}renderer.render(scene,camera)}reset();requestAnimationFrame(tick);
</script></body></html>
