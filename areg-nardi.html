<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Նարդի — դատարկ շրջանակ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center}.wood{position:relative;width:100%;height:100%;border:12px solid #945121;border-radius:34px;background:radial-gradient(ellipse at 45% 30%,#244751 0%,#142e38 68%,#10252d 100%) padding-box;box-shadow:inset 0 0 0 3px #dfa65e,inset 0 0 0 7px #653716,inset 0 0 20px #0005,0 4px 9px #0007;overflow:hidden}.wood:before{content:"";position:absolute;inset:-9px;border:5px solid transparent;border-radius:28px;box-shadow:inset 0 0 0 2px #b97c3d;pointer-events:none}.wood:after{content:"";position:absolute;inset:4px;border:1px solid #c58c4c;border-radius:20px;pointer-events:none}@media(max-width:390px){.wood{border-width:10px;border-radius:29px}}</style></head><body><main class="wood" aria-label="Դատարկ մուգ խաղադաշտ փայտե շրջանակով"></main></body></html>
