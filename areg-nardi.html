<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AREG Նարդի</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#f9e6bd}body{background:radial-gradient(ellipse at 50% 0,#557b85 0,#172b32 65%,#0c191d);display:flex;justify-content:center}.game{width:min(100%,520px);height:100dvh;display:flex;flex-direction:column;gap:8px;padding:env(safe-area-inset-top) 8px max(8px,env(safe-area-inset-bottom));min-height:0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head button{width:42px}.brand{flex:1;text-align:center;border:3px ridge #e4ae59;background:linear-gradient(125deg,#79401e,#b57434,#67341a);border-radius:18px;padding:5px;box-shadow:0 3px 8px #0008}.brand small{display:block;font-size:11px;letter-spacing:2px}.brand strong{font-family:Georgia,serif;font-size:26px;color:#ffdd93;text-shadow:0 2px 2px #3a190b}button{border:2px solid #edbb65;background:linear-gradient(#b67a3a,#6a3419);color:#fff0c8;border-radius:13px;font-size:14px;font-weight:750;min-height:40px;cursor:pointer}button:disabled{opacity:.45}.tabs,.modes{display:flex;gap:7px}.tabs button,.modes button{flex:1;font-size:13px}.active{background:linear-gradient(#ffe19b,#b77527)!important;color:#45250e!important}.board-wrap{min-height:0;flex:1;display:flex;align-items:stretch}.board{width:100%;height:100%;position:relative;border:11px ridge #9c5d2c;border-radius:16px;background:linear-gradient(110deg,#b8773b,#d6a267 35%,#b5793c 80%);box-shadow:inset 0 0 0 3px #6d3d1b,0 4px 12px #0009;overflow:hidden;touch-action:manipulation}.field{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(6,1fr) 12px repeat(6,1fr);grid-template-rows:1fr 1fr;gap:0;background:linear-gradient(90deg,#b27b42,#e1b47a 50%,#b27b42)}.bar{grid-column:7;grid-row:1/3;background:linear-gradient(90deg,#63351a,#c58a49,#63351a);z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#ffe4a5;font-size:17px}.point{position:relative;min-width:0;min-height:0;display:flex;align-items:center;flex-direction:column;cursor:pointer}.point.bottom{justify-content:flex-end;flex-direction:column-reverse}.triangle{position:absolute;top:0;left:0;width:100%;height:79%;clip-path:polygon(0 0,100% 0,50% 100%);background:#63351f}.point.bottom .triangle{top:auto;bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.point.light .triangle{background:#f4d59b}.point.selected{background:#ffe06b44}.point.legal{background:#60e5a04a}.checker{width:min(92%,36px);aspect-ratio:1;border-radius:50%;z-index:2;flex:0 0 auto;border:2px solid #ad8a59;background:radial-gradient(circle at 35% 28%,#fffdf1,#e9d8ae 65%,#bda57c);box-shadow:0 2px 3px #0007;margin:1px 0;display:grid;place-items:center;color:#684f31;font-size:10px}.checker.black{border-color:#9b7956;background:radial-gradient(circle at 35% 25%,#68615a,#1d1b1b 70%);color:#e5d2ae}.checker b{font-size:11px}.field .point:nth-child(n){z-index:2}.status{text-align:center;font-size:13px;min-height:20px;color:#ffe4ac}.dice{display:flex;justify-content:center;align-items:center;gap:9px;min-height:45px}.die{width:41px;height:41px;background:linear-gradient(#fffef2,#e4cda1);border:2px solid #bb965c;color:#3e281a;border-radius:9px;display:grid;place-items:center;font-size:27px;box-shadow:0 2px 5px #0008}.actions{display:flex;gap:7px}.actions button{flex:1}.foot{display:flex;gap:7px}.foot button{flex:1;font-size:12px}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.overlay[hidden]{display:none}.dialog{width:min(100%,380px);background:linear-gradient(#8c5029,#482715);border:4px ridge #e0a65c;border-radius:18px;padding:20px;display:grid;gap:12px;text-align:center}.dialog h2{margin:0;color:#ffdf97}.dialog p{margin:0;line-height:1.5;font-size:14px}.dialog button{padding:9px}.tiny{font-size:11px;opacity:.8;text-align:center}@media(max-height:680px){.game{gap:4px}.brand strong{font-size:20px}.brand{padding:2px}.head button{min-height:35px}.tabs button,.modes button{min-height:34px}.dice{min-height:34px}.die{height:32px;width:32px;font-size:23px}.actions button,.foot button{min-height:32px}.tiny{display:none}.board{border-width:8px}.field{inset:7px}}
</style></head><body><div class="game"><div class="head"><button id="back" aria-label="Վերադառնալ">←</button><div class="brand"><small>AREG</small><strong>Նարդի</strong></div><button id="settings" aria-label="Կանոններ">⚙</button></div><div class="tabs"><button id="long" class="active">Երկար նարդի</button><button id="short">Կարճ նարդի</button></div><div class="modes"><button id="bot" class="active">🤖 Համակարգիչ</button><button id="local">👥 Երկուսով</button><button id="online">🌐 Առցանց</button></div><div class="status" id="status"></div><div class="board-wrap"><div class="board"><div class="field" id="field"><div class="bar">✦<span>✦</span>✦</div></div></div></div><div class="dice"><span class="die" id="d1">⚀</span><span class="die" id="d2">⚀</span></div><div class="actions"><button id="roll">🎲 Նետել զառերը</button><button id="undo">↶ Հետարկել</button><button id="end">✓ Ավարտել</button></div><div class="foot"><button id="new">Նոր խաղ</button><button id="rules">Կանոններ</button></div><div class="tiny">Փորձնական տարբերակ · քայլերի կանոնների լրացուցիչ ստուգում է պահանջվում</div></div><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="close">Փակել</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),field=$('field');let type='long',mode='bot',turn=0,board=[],bar=[0,0],off=[0,0],dice=[],rolled=false,selected=-1,history=[],busy=false;const pips=['⚀','⚁','⚂','⚃','⚄','⚅'];const col=p=>p===0?'white':'black';function show(title,msg){$('dialogTitle').textContent=title;$('dialogText').textContent=msg;$('overlay').hidden=false}function reset(){board=Array.from({length:24},()=>({owner:-1,n:0}));bar=[0,0];off=[0,0];turn=0;dice=[];rolled=false;selected=-1;history=[];busy=false;if(type==='long'){put(0,0,15);put(12,1,15)}else{[[0,2],[11,5],[16,3],[18,5]].forEach(([i,n])=>put(i,0,n));[[23,2],[12,5],[7,3],[5,5]].forEach(([i,n])=>put(i,1,n))}render()}function put(i,p,n){board[i]={owner:p,n}}function dir(p){return type==='long'?1:(p===0?1:-1)}function home(p){return type==='long'?(p===0?[18,23]:[6,11]):(p===0?[18,23]:[0,5])}function distance(i,p){return p===0?24-i:i+1}function canBear(p){if(bar[p])return false;return board.every((s,i)=>s.owner!==p||(type==='long'?(p===0?i>=18:i>=6&&i<=11):(i>=home(p)[0]&&i<=home(p)[1])))}function dest(i,d,p){return i+d*dir(p)}function legalFor(i,p=turn){if(board[i]?.owner!==p||!board[i].n)return[];if(type==='short'&&bar[p])return[];return dice.map(d=>{const j=dest(i,d,p);if(j<0||j>=24){if(!canBear(p))return null;const exact=distance(i,p)===d;const farther=board.some((s,k)=>s.owner===p&&(p===0?k<i:k>i));return exact||(!farther&&d>distance(i,p))?{i,j:-1,d}:null}const s=board[j];if(s.owner===p||s.owner<0)return{i,j,d};if(type==='short'&&s.n===1)return{i,j,d};return null}).filter(Boolean)}function legalBar(p=turn){if(type!=='short'||!bar[p])return[];return dice.map(d=>{const j=p===0?d-1:24-d,s=board[j];return s.owner===p||s.owner<0||s.n===1?{i:-2,j,d}:null})}function allMoves(p=turn){return bar[p]?legalBar(p):board.flatMap((s,i)=>s.owner===p?legalFor(i,p):[])}function render(){field.querySelectorAll('.point').forEach(e=>e.remove());const choices=selected===-2?legalBar():selected>=0?legalFor(selected):[];for(let i=0;i<24;i++){const s=board[i],e=document.createElement('div');e.className='point '+(i>=12?'bottom ':'')+(i%2?'light ':'')+(selected===i?'selected ':'')+(choices.some(m=>m.j===i)?'legal':'');e.style.gridColumn=String(i<12?(i<6?6-i:19-i):(i<18?i-11:i-10));e.style.gridRow=String(i<12?1:2);const tri=document.createElement('div');tri.className='triangle';e.append(tri);if(s.n){const count=Math.min(s.n,6);for(let k=0;k<count;k++){const disc=document.createElement('div');disc.className='checker '+(s.owner===1?'black':'');if(k===count-1&&s.n>6){const n=document.createElement('b');n.textContent=s.n;disc.append(n)}e.append(disc)}}e.onclick=()=>tap(i);field.append(e)}$('status').textContent=(turn===0?'Փղոսկրի':'Սև')+' խաղաքարերի հերթն է'+(dice.length?' · մնացել է '+dice.join(', '):'')+(bar[turn]?' · կենտրոնում՝ '+bar[turn]:'')+(off[0]||off[1]?' · դուրս՝ '+off[0]+' / '+off[1]:'');$('roll').disabled=rolled||busy;$('undo').disabled=!history.length||busy;$('end').disabled=!rolled||busy;$('d1').textContent=pips[(dice[0]||1)-1];$('d2').textContent=pips[(dice[1]||1)-1];$('long').classList.toggle('active',type==='long');$('short').classList.toggle('active',type==='short');$('bot').classList.toggle('active',mode==='bot');$('local').classList.toggle('active',mode==='local')}function tap(i){if(busy||!rolled||(mode==='bot'&&turn===1))return;if(selected===-2||selected>=0){const m=(selected===-2?legalBar():legalFor(selected)).find(m=>m.j===i);if(m){move(m);return}}if(board[i].owner===turn&&board[i].n&&!bar[turn])selected=i;else selected=-1;render()}function snapshot(){return{board:board.map(s=>({...s})),bar:[...bar],off:[...off],dice:[...dice],turn,rolled}}function restore(s){board=s.board;bar=s.bar;off=s.off;dice=s.dice;turn=s.turn;rolled=s.rolled;selected=-1;render()}function move(m){history.push(snapshot());if(m.i===-2)bar[turn]--;else{board[m.i].n--;if(!board[m.i].n)board[m.i].owner=-1}if(m.j===-1)off[turn]++;else{const s=board[m.j];if(s.owner>=0&&s.owner!==turn){bar[1-turn]++;s.n=0}if(!s.n)s.owner=turn;s.n++}dice.splice(dice.indexOf(m.d),1);selected=-1;render();if(off[turn]===15){busy=true;show('Հաղթանակ',turn===0?'Փղոսկրի խաղաքարերը հաղթեցին։':'Սև խաղաքարերը հաղթեցին։');return}if(!dice.length||!allMoves().length){setTimeout(()=>{if(!busy)finishTurn()},350)}}function finishTurn(){if(!rolled)return;history=[];selected=-1;dice=[];rolled=false;turn=1-turn;render();if(mode==='bot'&&turn===1)setTimeout(botPlay,500)}function roll(){if(rolled||busy)return;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);dice=a===b?[a,a,a,a]:[a,b];rolled=true;history=[];render();if(!allMoves().length){setTimeout(finishTurn,650);return}if(mode==='bot'&&turn===1)setTimeout(botPlay,450)}function botPlay(){if(mode!=='bot'||turn!==1||busy)return;if(!rolled){roll();return}const moves=allMoves();if(!moves.length){finishTurn();return}const scored=moves.map(m=>({m,score:(m.j===-1?100:0)+(m.j>=0&&board[m.j].owner===0?30:0)+Math.random()*8})).sort((a,b)=>b.score-a.score);move(scored[0].m);if(turn===1&&rolled&&!busy)setTimeout(botPlay,400)}$('roll').onclick=roll;$('undo').onclick=()=>{const s=history.pop();if(s)restore(s)};$('end').onclick=()=>{if(!rolled)return;if(allMoves().length&&dice.length){show('Չավարտված քայլեր','Դեռ կան թույլատրելի քայլեր։ Նախ կատարիր դրանք։');return}finishTurn()};$('new').onclick=reset;$('long').onclick=()=>{type='long';reset()};$('short').onclick=()=>{type='short';reset()};$('bot').onclick=()=>{mode='bot';reset()};$('local').onclick=()=>{mode='local';reset()};$('online').onclick=()=>show('Առցանց խաղ','Առցանց երկու հեռախոսով խաղը դեռ միացված չէ։ Անհրաժեշտ է սերվերային սենյակների և քայլերի համաժամացման համակարգ։');$('settings').onclick=$('rules').onclick=()=>show('Խաղի կանոններ','Երկար նարդիում խաղաքարերը շարժվում են նույն ուղղությամբ, և հակառակորդի զբաղեցրած դաշտ մտնել չի կարելի։ Կարճ նարդիում շարժվում են հակառակ ուղղություններով, և միայնակ խաղաքարը կարելի է խփել։ Սա փորձնական տարբերակ է. կանոնների բոլոր բացառությունները դեռ ստուգված չեն։');$('close').onclick=()=>$('overlay').hidden=true;$('back').onclick=()=>{try{window.parent.postMessage({type:'areg-close-activity'},'*')}catch(e){}show('Վերադառնալ','Օգտագործիր խաղի հիմնական վերադարձի կոճակը։')};reset()})();
</script></body></html>
