<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Նարդի — դատարկ շրջանակ</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}img{pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center}.wood{position:relative;width:100%;height:100%;border:12px solid #945121;border-radius:34px;background:radial-gradient(ellipse at 45% 30%,#244751 0%,#142e38 68%,#10252d 100%) padding-box;box-shadow:inset 0 0 0 3px #dfa65e,inset 0 0 0 7px #653716,inset 0 0 20px #0005,0 4px 9px #0007;overflow:hidden}.wood:before{content:"";position:absolute;inset:-9px;border:5px solid transparent;border-radius:28px;box-shadow:inset 0 0 0 2px #b97c3d;pointer-events:none}.wood:after{content:"";position:absolute;inset:4px;border:1px solid #c58c4c;border-radius:20px;pointer-events:none}@media(max-width:390px){.wood{border-width:10px;border-radius:29px}} .board-stage{position:absolute;left:50%;top:64%;width:calc(126.57% - 25.32px);aspect-ratio:1448/1086;transform:translate(-50%,-50%);pointer-events:none}.board-image{display:block;width:100%;height:100%;object-fit:contain}.scoreboard{position:absolute;left:50%;top:25%;width:min(72%,360px);height:auto;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none}.piece{position:absolute;width:2.45%;height:auto;aspect-ratio:711/722;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 1px #0008)}.piece-count{position:absolute;z-index:40;transform:translate(-50%,-50%);min-width:19px;height:19px;border-radius:12px;background:#ead9b2;color:#2e2015;border:1px solid #654321;box-shadow:0 1px 3px #0009;font:bold 12px/17px system-ui;text-align:center;pointer-events:none}@media(max-height:650px){.board-stage{top:67%}.scoreboard{top:21%;width:60%}} </style></head><body><main class="wood" aria-label="Նարդու նոր խաղադաշտ"><img class="scoreboard" src="./04_scoreboard.png" alt="Հաշվետախտակ"><div class="board-stage" id="boardStage"><img class="board-image" src="./nardi_board_24_clean.png" alt="24 դաշտանոց հայկական նարդու խաղատախտակ"></div></main><script>
/* 15 separate, non-overlapping pieces along each marked outer point.
   Coordinates are percentages of the board image, not the viewport. */
(()=>{
  ['contextmenu','selectstart','dragstart'].forEach(name=>
    document.addEventListener(name,event=>event.preventDefault()));
  const stage=document.getElementById('boardStage');
  const positions=[
    {file:'03_ivory_piece.png',x:10.2,firstY:84,step:-3.5},
    {file:'02_black_piece.png',x:89.8,firstY:16,step:4.25}
  ];
  for(const position of positions){
    const fragment=document.createDocumentFragment();
    for(let i=0;i<15;i++){
      const img=document.createElement('img');
      img.className='piece';
      img.src='./'+position.file;
      img.alt='';
      img.draggable=false;
      img.style.left=position.x+'%';
      img.style.top=(position.firstY+i*position.step)+'%';
      fragment.appendChild(img);
    }
    stage.appendChild(fragment);
  }
})();
</script></body></html>
