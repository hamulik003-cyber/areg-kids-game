<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Նարդի — դատարկ շրջանակ</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}img{pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center}.wood{position:relative;width:100%;height:100%;border:12px solid #945121;border-radius:34px;background:radial-gradient(ellipse at 45% 30%,#244751 0%,#142e38 68%,#10252d 100%) padding-box;box-shadow:inset 0 0 0 3px #dfa65e,inset 0 0 0 7px #653716,inset 0 0 20px #0005,0 4px 9px #0007;overflow:hidden}.wood:before{content:"";position:absolute;inset:-9px;border:5px solid transparent;border-radius:28px;box-shadow:inset 0 0 0 2px #b97c3d;pointer-events:none}.wood:after{content:"";position:absolute;inset:4px;border:1px solid #c58c4c;border-radius:20px;pointer-events:none}@media(max-width:390px){.wood{border-width:10px;border-radius:29px}} .board-stage{position:absolute;left:50%;top:64%;width:calc(126.57% - 25.32px);aspect-ratio:1448/1086;transform:translate(-50%,-50%);pointer-events:none}.board-image{display:block;width:100%;height:100%;object-fit:contain}.scoreboard{position:absolute;left:50%;top:25%;width:min(72%,360px);height:auto;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none}.piece{position:absolute;width:5%;height:auto;aspect-ratio:711/722;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 1px #0008)}.piece-count{position:absolute;z-index:40;transform:translate(-50%,-50%);min-width:19px;height:19px;border-radius:12px;background:#ead9b2;color:#2e2015;border:1px solid #654321;box-shadow:0 1px 3px #0009;font:bold 12px/17px system-ui;text-align:center;pointer-events:none}@media(max-height:650px){.board-stage{top:67%}.scoreboard{top:21%;width:60%}} </style></head><body><main class="wood" aria-label="Նարդու նոր խաղադաշտ"><img class="scoreboard" src="./04_scoreboard.png" alt="Հաշվետախտակ"><div class="board-stage" id="boardStage"><img class="board-image" src="./nardi_board_24_clean.png" alt="24 դաշտանոց հայկական նարդու խաղատախտակ"></div></main><script>
/* Board coordinate system, based on the visible 24-point artwork.
   A long-nardi starting point holds 15 pieces. Show the top five in a
   conventional overlapping stack, with a 15 counter for the actual quantity.
   The other ten remain individual model pieces, not stretched into a tower. */
(()=>{
  for(const eventName of ['contextmenu','selectstart','dragstart']){
    document.addEventListener(eventName,e=>e.preventDefault());
  }
  const stage=document.getElementById('boardStage');
  const PIECES_PER_PLAYER=15;
  const VISIBLE_PER_STACK=5;
  const POINTS={
    ivory:{file:'03_ivory_piece.png',x:20,y:84,direction:-1},
    black:{file:'02_black_piece.png',x:80,y:16,direction:1}
  };
  function renderStack(config){
    const stack=document.createDocumentFragment();
    const spacing=4.1;
    for(let i=0;i<VISIBLE_PER_STACK;i++){
      const piece=document.createElement('img');
      piece.className='piece';
      piece.src='./'+config.file;
      piece.alt='';
      piece.draggable=false;
      piece.style.left=config.x+'%';
      piece.style.top=(config.y+config.direction*i*spacing)+'%';
      piece.style.zIndex=String(10+i);
      stack.appendChild(piece);
    }
    const count=document.createElement('span');
    count.className='piece-count';
    count.textContent=String(PIECES_PER_PLAYER);
    count.setAttribute('aria-label',PIECES_PER_PLAYER+' խաղաքար');
    count.style.left=config.x+'%';
    count.style.top=(config.y+config.direction*VISIBLE_PER_STACK*spacing)+'%';
    stack.appendChild(count);
    stage.appendChild(stack);
  }
  Object.values(POINTS).forEach(renderStack);
})();
</script></body></html>
