toy.position.x=c.position.x;toy.visible=true;ui('Ապրե՜ս, ճիշտ գտար։','Խաղալիքը մոտենում է ու պտտվում։');const original={x:toy.position.x,y:toy.position.y,z:toy.position.z};await Promise.all([tween(toy.position,{x:0,y:2.05,z:4.0},1180,0,out),tween(toy.scale,{x:1.9,y:1.9,z:1.9},1180,0,out),tween(toy.rotation,{y:Math.PI*2},2200,0,ease)]);if(token!==generation)return;await pause(200);const shelfX=(count-2)*1.38;await Promise.all([tween(toy.position,{x:shelfX,y:5.13,z:-.73},1150,0,ease),tween(toy.scale,{x:.65,y:.65,z:.65},1150,0,ease),tween(toy.rotation,{y:Math.PI*4},1150,0,ease)]);if(token!==generation)return;toy.userData.collected=true;collected.push(toy);toy=null;count++;ui('Հավաքեցինք խաղալիքը։','Պատրաստվիր հաջորդին։');if(count===5){await finale(token)}else{mode='ready';$('start').textContent='▶ Հաջորդ խաղալիքը';disable(false)}}
let collected=[];async function finale(token){mode='final';ui('Հինգ խաղալիքներն արդեն հավաքված են։','Միասին կատարում են վերջին պտույտը։');await pause(650);if(token!==generation)return;await Promise.all(collected.map((g,i)=>Promise.all([tween(g.position,{x:(i-2)*.7,y:2.65,z:3.2},1150,i*75,out),tween(g.scale,{x:1.2,y:1.2,z:1.2},1150,i*75,out)])));await Promise.all(collected.map((g,i)=>Promise.all([tween(g.rotation,{y:g.rotation.y+Math.PI*2},1600,i*70,ease),tween(g.position,{y:3.1},1600,i*70,ease)])));await Promise.all(collected.map((g,i)=>tween(g.scale,{x:0,y:0,z:0},600,i*65,ease)));if(token!==generation)return;collected.forEach(g=>scene.remove(g));collected=[];stars+=5;ui('Հաղթե՜ցիր։','Հինգ խաղալիք՝ մեկ ամբողջական փուլ։');$('modal').classList.add('open');mode='finished'}
const ray=new T.Raycaster(),pointer=new T.Vector2();renderer.domElement.addEventListener('pointerup',ev=>{if(mode!=='guess')return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((ev.clientX-rect.left)/rect.width*2-1,-(ev.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(cups,true);if(!hits.length)return;let node=hits[0].object;while(node.parent&&!cups.includes(node))node=node.parent;const i=cups.indexOf(node);if(i>=0)choose(i)});
function clear(){generation++;tweens.splice(0).forEach(t=>t.resolve());collected.forEach(g=>scene.remove(g));collected=[];if(toy){scene.remove(toy);toy=null}count=0;stage=1;stars=0;mode='idle';cups.forEach((c,i)=>{c.position.set(xs[i],highY,0);c.rotation.set(0,0,0)});$('modal').classList.remove('open');$('start').textContent='▶ Սկսել';disable(false);ui('Հիշիր՝ ո՞ր բաժակի տակ է խաղալիքը։','Սեղմիր «Սկսել»։');target=1;placeToy()}$('start').onclick=newRound;$('reset').onclick=clear;$('continue').onclick=()=>{stage++;count=0;mode='ready';$('modal').classList.remove('open');$('start').textContent='▶ Սկսել';disable(false);cups.forEach((c,i)=>c.position.set(xs[i],highY,0));target=1;placeToy();ui('Նոր փուլ է սկսվում։','Կհավաքենք ևս հինգ խաղալիք։')};function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w/h<.65?43:37;camera.position.set(0,w/h<.65?6.5:5.8,w/h<.65?16.3:13.8);camera.lookAt(0,2.15,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();clear()})();
