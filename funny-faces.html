<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#9bdaf8;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;text-align:center;background:#fff9e9ee;border:3px solid #c88a48;border-radius:18px;padding:7px 12px;font-weight:800;color:#82441c;font-size:clamp(12px,3.5vw,17px);pointer-events:none}#reset{position:absolute;bottom:12px;right:12px;border:3px solid #fff;border-radius:20px;background:linear-gradient(#ffde61,#ff9942);color:#713b18;padding:10px 13px;font-weight:900;font-size:17px}</style></head><body><canvas id="scene"></canvas><div id="hint">Քաշի՛ր քիթը, սեղմի՛ր այտերը 😜</div><button id="reset">↻ Նորից</button><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),g=canvas.getContext('2d'),hint=document.getElementById('hint');let W=0,H=0,D=1,t=0,last=0,gesture=null,eyeScale=1,noseStretch=0,cheek=0,mouthOpen=0,wobble=0,blink=0,particles=[],surprise=0;let audio;function beep(f=350,d=.15){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.55,audio.currentTime+d);v.gain.setValueAtTime(.14,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;g.setTransform(D,0,0,D,0,0)}function reset(){eyeScale=1;noseStretch=0;cheek=0;mouthOpen=0;wobble=0;surprise=0;hint.textContent='Քաշի՛ր քիթը, սեղմի՛ր այտերը 😜'}
function round(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function oval(x,y,rx,ry,fill){g.fillStyle=fill;g.beginPath();g.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);g.fill()}function scene(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#72c6fb');sky.addColorStop(1,'#ffe6aa');g.fillStyle=sky;g.fillRect(0,0,W,H);for(let i=0;i<7;i++){let x=(i*137+35)%Math.max(1,W),y=H*(.12+.09*(i%3));oval(x,y,34,13,'#ffffff99');oval(x+20,y-6,26,15,'#ffffff99')}oval(W*.5,H*1.06,W*.78,H*.28,'#a1dc83');let S=Math.min(W*.8,H*.53,360),cx=W/2,cy=H*.46;g.save();g.translate(cx,cy);g.rotate(Math.sin(t*10)*wobble*.06);g.shadowColor='#654c4870';g.shadowBlur=25;g.shadowOffsetY=13;oval(0,0,S*.48*(1+cheek*.09),S*.47,'#f6b64b');g.shadowColor='transparent';oval(-S*.33,-S*.23,S*.14,S*.19,'#f6b64b');oval(S*.33,-S*.23,S*.14,S*.19,'#f6b64b');oval(-S*.33,-S*.23,S*.07,S*.11,'#ffcda0');oval(S*.33,-S*.23,S*.07,S*.11,'#ffcda0');oval(-S*.22,S*.12,S*.13+cheek*S*.025,S*.09,'#f98c87');oval(S*.22,S*.12,S*.13+cheek*S*.025,S*.09,'#f98c87');for(let k of [-1,1]){oval(k*S*.19,-S*.1,S*.115*eyeScale,S*.15*eyeScale*(1-blink*.94),'#fffef4');oval(k*S*.19,-S*.085,S*.046,S*.075*(1-blink*.9),'#30334e');oval(k*S*.175-S*.018,-S*.12,S*.019,S*.026,'#fff')}g.strokeStyle='#9c5c32';g.lineWidth=S*.017;g.lineCap='round';for(let k of [-1,1]){g.beginPath();g.arc(k*S*.19,-S*.27,S*.09,Math.PI*1.12,Math.PI*1.86);g.stroke()}let n=S*.09+noseStretch*S*.32;oval(0,S*.055+noseStretch*S*.15,S*.09,n,'#f38e61');oval(-S*.03,S*.025+noseStretch*S*.14,S*.025,S*.03,'#ffd0a0');g.fillStyle='#773d47';g.beginPath();g.ellipse(0,S*.28,S*.16+mouthOpen*S*.02,S*.04+mouthOpen*S*.14,0,0,Math.PI*2);g.fill();if(mouthOpen>.1){oval(0,S*.32+mouthOpen*S*.04,S*.1,S*.02,'#ff8d9d')}g.restore();round(W*.08,H*.78,W*.84,Math.min(66,H*.11),22,'#fff8e4d9');g.fillStyle='#85552c';g.textAlign='center';g.font='900 '+Math.min(17,W*.041)+'px system-ui';g.fillText('👃 քիթ   👀 աչքեր   😊 այտեր   👄 բերան',W/2,H*.78+Math.min(38,H*.065));for(let p of particles){oval(p.x,p.y,p.r,p.r,p.color)}}function action(x,y){let S=Math.min(W*.8,H*.53,360),cx=W/2,cy=H*.46,dx=(x-cx)/S,dy=(y-cy)/S;if(Math.abs(dx)<.17&&dy>-.11&&dy<.32)return 'nose';if(Math.abs(dx)>.1&&Math.abs(dx)<.43&&dy>-.03&&dy<.29)return 'cheek';if(Math.abs(dx)>.08&&Math.abs(dx)<.35&&dy>-.32&&dy<.02)return 'eye';if(Math.abs(dx)<.23&&dy>.2&&dy<.44)return 'mouth';return 'head'}
function down(e){let a=action(e.clientX,e.clientY);gesture={a,y:e.clientY,x:e.clientX};canvas.setPointerCapture(e.pointerId);beep(a==='nose'?270:420,.08);if(a==='eye'){eyeScale=eyeScale===1?1.55:1;hint.textContent='Վա՜յ, ինչ մեծ աչքեր են 😂'}if(a==='cheek'){cheek=cheek===0?1.7:0;mouthOpen=.55;wobble=1;hint.textContent='Պուֆֆ՜, այտերը փքվեցին 🤣'}if(a==='mouth'){mouthOpen=mouthOpen>.6?0:1;hint.textContent='Աաա՜, ինչ մեծ բերան է 😆'}if(a==='head'){wobble=1;blink=.9;hint.textContent='Հի՜ հի՜, խուտուտ է 😄'}}
function move(e){if(!gesture)return;if(gesture.a==='nose'){noseStretch=Math.min(1,Math.max(0,(e.clientY-gesture.y)/Math.max(75,H*.2)));mouthOpen=noseStretch*.6;wobble=.5;hint.textContent='Ափչի՜, քիթս երկարեց 🤧'}else if(gesture.a==='cheek'){cheek=Math.min(2,Math.abs(e.clientX-gesture.x)/60+.5)}else if(gesture.a==='head'){wobble=1}}
function up(){if(!gesture)return;let a=gesture.a;gesture=null;if(a==='nose'&&noseStretch>.3){beep(620,.27);blink=1;wobble=1;for(let i=0;i<24;i++)particles.push({x:W/2+(Math.random()-.5)*80,y:H*.5,r:3+Math.random()*5,color:['#fff','#9be5ff','#ffe96e'][i%3],vx:(Math.random()-.5)*220,vy:-60-Math.random()*120,life:1});hint.textContent='ԱՓՉԻ՜ 🤧😂'} }
function frame(ms){let dt=Math.min((ms-last)/1000||.016,.04);last=ms;t+=dt;wobble=Math.max(0,wobble-dt*1.4);blink=Math.max(0,blink-dt*3);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);scene();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);document.getElementById('reset').addEventListener('click',reset);addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
