<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#9bdaf8;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;text-align:center;background:#fff9e9ee;border:3px solid #c88a48;border-radius:18px;padding:7px 12px;font-weight:800;color:#82441c;font-size:clamp(12px,3.5vw,17px);pointer-events:none}#reset{position:absolute;bottom:12px;right:12px;border:3px solid #fff;border-radius:20px;background:linear-gradient(#ffde61,#ff9942);color:#713b18;padding:10px 13px;font-weight:900;font-size:17px}</style></head><body><canvas id="scene"></canvas><div id="hint">Խուտուտ տուր ու լսի՛ր ծիծաղը 😜</div><button id="reset">↻ Նորից</button><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),g=canvas.getContext('2d'),hint=document.getElementById('hint');let W=0,H=0,D=1,t=0,last=0,gesture=null,eyeScale=1,noseStretch=0,cheek=0,mouthOpen=0,wobble=0,blink=0,particles=[],surprise=0;let laughUntil=0,laughStart=0,smile=0,smileTarget=0,eyeShown=1,noseShown=0,cheekShown=0,mouthShown=0,headBob=0,blinkClock=0;let squash=0,squashShown=0,earPull=0,earShown=0,tongue=0,tongueShown=0,faceStretch=0,stretchShown=0,shake=0;
function comicSound(kind='boing'){
 try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const at=audio.currentTime+.01,o=audio.createOscillator(),gain=audio.createGain();o.type=kind==='buzz'?'sawtooth':'sine';let f=kind==='buzz'?110:kind==='pop'?620:210;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(kind==='buzz'?55:kind==='pop'?170:570,at+.25);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.13,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.28);o.connect(gain);gain.connect(audio.destination);o.start(at);o.stop(at+.3)}catch(e){}
}
let audio;
function laugh(kind='giggle'){
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    audio.resume();
    const now=audio.currentTime+.015,count=kind==='big'?7:kind==='sneeze'?3:5;
    for(let i=0;i<count;i++){
      const at=now+i*(kind==='big'?.135:.115),dur=kind==='sneeze'?.11:.085,base=(kind==='sneeze'?175:kind==='big'?195:255)+Math.sin(i*1.8)*25;
      const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();
      osc.type='sawtooth';osc.frequency.setValueAtTime(base,at);
      osc.frequency.exponentialRampToValueAtTime(base*(i%2?.86:1.2),at+dur);
      filter.type='bandpass';filter.frequency.setValueAtTime(i%2?850:1180,at);filter.Q.value=.85;
      gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.055,at+.018);
      gain.gain.exponentialRampToValueAtTime(.0001,at+dur);
      osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);
      osc.start(at);osc.stop(at+dur+.01);
    }
    laughStart=t;laughUntil=t+count*.135+.15;smileTarget=1;wobble=1;
  }catch(e){}
}
function beep(f=350,d=.15){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.55,audio.currentTime+d);v.gain.setValueAtTime(.14,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;g.setTransform(D,0,0,D,0,0)}function reset(){eyeScale=1;noseStretch=0;cheek=0;mouthOpen=0;wobble=0;surprise=0;smile=0;smileTarget=0;eyeShown=1;noseShown=0;cheekShown=0;mouthShown=0;squash=0;earPull=0;tongue=0;faceStretch=0;hint.textContent='Քաշի՛ր քիթը, սեղմի՛ր այտերը 😜'}
function round(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function oval(x,y,rx,ry,fill){g.fillStyle=fill;g.beginPath();g.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);g.fill()}function scene(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#72c6fb');sky.addColorStop(1,'#ffe6aa');g.fillStyle=sky;g.fillRect(0,0,W,H);for(let i=0;i<7;i++){let x=(i*137+35)%Math.max(1,W),y=H*(.12+.09*(i%3));oval(x,y,34,13,'#ffffff99');oval(x+20,y-6,26,15,'#ffffff99')}oval(W*.5,H*1.06,W*.78,H*.28,'#a1dc83');let S=Math.min(W*.8,H*.53,360),cx=W/2,cy=H*.46;g.save();g.translate(cx,cy);g.scale(1+squashShown*.35-stretchShown*.12,1-squashShown*.23+stretchShown*.48);g.translate(0,Math.sin(t*17)*headBob*S*.025);g.rotate(Math.sin(t*12)*wobble*.075+Math.sin(t*27)*shake*.10);g.shadowColor='#654c4870';g.shadowBlur=25;g.shadowOffsetY=13;let skin=g.createRadialGradient(-S*.17,-S*.22,S*.03,0,0,S*.6);skin.addColorStop(0,'#ffe49b');skin.addColorStop(.55,'#f8ba5c');skin.addColorStop(1,'#d98438');oval(0,0,S*.48*(1+cheekShown*.09),S*.47,skin);g.shadowColor='transparent';oval(-S*(.33+earShown*.15),-S*.23,S*.14+earShown*S*.12,S*.19+earShown*S*.06,'#f6b64b');oval(S*(.33+earShown*.15),-S*.23,S*.14+earShown*S*.12,S*.19+earShown*S*.06,'#f6b64b');oval(-S*(.33+earShown*.15),-S*.23,S*.07+earShown*S*.08,S*.11,'#ffcda0');oval(S*(.33+earShown*.15),-S*.23,S*.07+earShown*S*.08,S*.11,'#ffcda0');oval(-S*.22,S*.12,S*.13+cheekShown*S*.025,S*.09,'#f98c87');oval(S*.22,S*.12,S*.13+cheekShown*S*.025,S*.09,'#f98c87');for(let k of [-1,1]){oval(k*S*.19,-S*.1,S*.115*eyeShown,S*.15*eyeShown*(1-blink*.94),'#fffef4');oval(k*S*.19,-S*.085,S*.046,S*.075*(1-blink*.9),'#30334e');oval(k*S*.175-S*.018,-S*.12,S*.019,S*.026,'#fff')}g.strokeStyle='#9c5c32';g.lineWidth=S*.017;g.lineCap='round';for(let k of [-1,1]){g.beginPath();g.arc(k*S*.19,-S*.27,S*.09,Math.PI*1.12,Math.PI*1.86);g.stroke()}let n=S*.09+noseShown*S*.32;oval(0,S*.055+noseShown*S*.15,S*.09,n,'#f38e61');oval(-S*.03,S*.025+noseShown*S*.14,S*.025,S*.03,'#ffd0a0');g.fillStyle='#773d47';g.beginPath();g.ellipse(0,S*.28,S*.16+mouthShown*S*.02+smile*S*.025,S*.04+mouthShown*S*.14+smile*S*.045,0,0,Math.PI*2);g.fill();if(mouthShown>.1){oval(0,S*.32+mouthShown*S*.04,S*.1,S*.02,'#ff8d9d')}if(tongueShown>.03){g.save();g.translate(0,S*.32);g.rotate(Math.sin(t*15)*.13);round(-S*.08,0,S*.16,S*(.1+.35*tongueShown),S*.07,'#fa6e9c');g.strokeStyle='#d83e73';g.lineWidth=2;g.beginPath();g.moveTo(0,S*.1);g.lineTo(0,S*(.08+.22*tongueShown));g.stroke();g.restore()}g.restore();round(W*.08,H*.78,W*.84,Math.min(66,H*.11),22,'#fff8e4d9');g.fillStyle='#85552c';g.textAlign='center';g.font='900 '+Math.min(17,W*.041)+'px system-ui';g.fillText('👃 քիթ  👀 աչք  👂 ականջ  👄 լեզու',W/2,H*.78+Math.min(38,H*.065));for(let p of particles){oval(p.x,p.y,p.r,p.r,p.color)}}function action(x,y){let S=Math.min(W*.8,H*.53,360),cx=W/2,cy=H*.46,dx=(x-cx)/S,dy=(y-cy)/S;if(Math.abs(dx)>.34&&Math.abs(dx)<.6&&dy>-.45&&dy<-.02)return 'ear';if(Math.abs(dx)<.17&&dy>-.11&&dy<.23)return 'nose';if(Math.abs(dx)>.1&&Math.abs(dx)<.43&&dy>-.03&&dy<.29)return 'cheek';if(Math.abs(dx)>.08&&Math.abs(dx)<.35&&dy>-.32&&dy<.02)return 'eye';if(Math.abs(dx)<.23&&dy>.2&&dy<.44)return 'mouth';return 'head'}
function down(e){let a=action(e.clientX,e.clientY);gesture={a,y:e.clientY,x:e.clientX};canvas.setPointerCapture(e.pointerId);beep(a==='nose'?270:420,.06);if(a==='eye'){eyeScale=eyeScale===1?2.15:1;comicSound('pop');hint.textContent='Վա՜յ, ինչ մեծ աչքեր են 😂';laugh('giggle')}if(a==='cheek'){cheek=cheek===0?2.8:0;squash=cheek>0?1:0;comicSound('buzz');mouthOpen=.55;wobble=1;hint.textContent='Պուֆֆ՜, այտերը փքվեցին 🤣';laugh('big')}if(a==='mouth'){mouthOpen=mouthOpen>.6?0:1.5;tongue=tongue>0?0:1;comicSound('boing');hint.textContent='Աաա՜, ինչ մեծ բերան է 😆';laugh('big')}if(a==='ear'){earPull=1;comicSound('boing');hint.textContent='Ականջներս ձգվեցին՜ 🤪';laugh('giggle')}if(a==='head'){wobble=1;blink=.9;faceStretch=faceStretch?0:1;comicSound('boing');hint.textContent='Հի՜ հի՜, խուտուտ է 😄';laugh('giggle')}}
function move(e){if(!gesture)return;if(gesture.a==='nose'){noseStretch=Math.min(1,Math.max(0,(e.clientY-gesture.y)/Math.max(75,H*.2)));mouthOpen=noseStretch*.6;wobble=.5;hint.textContent='Ափչի՜, քիթս երկարեց 🤧'}else if(gesture.a==='cheek'){cheek=Math.min(2,Math.abs(e.clientX-gesture.x)/60+.5)}else if(gesture.a==='ear'){earPull=Math.min(2,Math.max(.3,Math.abs(e.clientX-gesture.x)/65));wobble=.5}else if(gesture.a==='head'){wobble=1;faceStretch=Math.min(1.5,Math.abs(e.clientY-gesture.y)/80+.3);hint.textContent='Դեմքս ռետինից է՜ 😂'}}
function up(){if(!gesture)return;let a=gesture.a;gesture=null;if(a==='head'||a==='ear'){shake=1;comicSound('boing')}if(a==='cheek'){shake=.7}if(a==='nose'&&noseStretch>.3){laugh('sneeze');blink=1;wobble=1;for(let i=0;i<24;i++)particles.push({x:W/2+(Math.random()-.5)*80,y:H*.5,r:3+Math.random()*5,color:['#fff','#9be5ff','#ffe96e'][i%3],vx:(Math.random()-.5)*220,vy:-60-Math.random()*120,life:1});hint.textContent='ԱՓՉԻ՜ 🤧😂'} }
function frame(ms){let dt=Math.min((ms-last)/1000||.016,.04);last=ms;t+=dt;const smooth=(a,b,k)=>a+(b-a)*(1-Math.exp(-k*dt));eyeShown=smooth(eyeShown,eyeScale,10);noseShown=smooth(noseShown,noseStretch,9);cheekShown=smooth(cheekShown,cheek,9);mouthShown=smooth(mouthShown,mouthOpen,11);squashShown=smooth(squashShown,squash,12);earShown=smooth(earShown,earPull,11);tongueShown=smooth(tongueShown,tongue,11);stretchShown=smooth(stretchShown,faceStretch,10);shake=Math.max(0,shake-dt*1.7);smileTarget=t<laughUntil?1:0;smile=smooth(smile,smileTarget,8);headBob=smooth(headBob,t<laughUntil?1:0,9);blinkClock+=dt;if(blinkClock>3.2){blink=1;blinkClock=0}wobble=Math.max(0,wobble-dt*1.4);blink=Math.max(0,blink-dt*3);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);scene();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);document.getElementById('reset').addEventListener('click',reset);addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
