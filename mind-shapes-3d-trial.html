<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b203c"><title>AREG · Գտիր ճիշտ ձևը · 3D փորձարկում</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b203c;font-family:system-ui,-apple-system,sans-serif;color:#63371f;overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}.screen{width:100%;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 16px);background:radial-gradient(circle at 70% 17%,#126f93 0,transparent 29%),linear-gradient(160deg,#06132b,#163957)}.top{display:grid;grid-template-columns:56px 1fr 82px;gap:8px;max-width:800px;margin:auto auto 12px}.wood{border:3px solid #f9cf91;border-radius:20px;background:linear-gradient(#f8d09a,#e4a85f);box-shadow:inset 0 3px #fff8,0 7px #88512c;color:#64371f;font-weight:900}.back{font-size:31px}.name{padding:7px 2px;text-align:center;font-size:clamp(15px,4.3vw,23px);line-height:1.18}.name small{display:block;font-size:11px;color:#a06b42}.star{text-align:center;padding:15px 2px;font-size:20px}.field{max-width:800px;margin:auto;min-height:calc(100dvh - 136px);border:7px solid #efbd76;border-radius:34px;background:linear-gradient(#fff5df,#ffe4b9);box-shadow:inset 0 0 0 5px #fff9e9,0 10px #633f30;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}.status{display:flex;width:100%;justify-content:space-around;align-items:center;gap:8px}.chip{border-radius:30px;border:3px solid #f6d9ad;background:#fff8e9;box-shadow:0 4px 9px #ac7a4b35;padding:7px 12px;font-weight:900;font-size:14px}.hint{text-align:center;font-size:13px;font-weight:750;min-height:35px;color:#8b5c3a}.view{position:relative;flex:1;min-height:280px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px;touch-action:pan-y}.cube-wrap{position:relative;width:min(51vw,260px);height:min(51vw,260px);min-width:188px;min-height:188px;transform-style:preserve-3d;touch-action:none;filter:drop-shadow(0 22px 14px #69452d55)}.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-15deg) rotateY(0deg);transition:transform .65s cubic-bezier(.22,.75,.2,1)}.face{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:21px;background:repeating-linear-gradient(6deg,#b77d47 0px,#d39a5c 10px,#d9a469 18px,#ad7341 27px,#c18b50 37px);border:8px solid #86502c;border-radius:13px;box-shadow:inset 0 0 0 3px #f2c08b,inset 0 0 20px #5c2d1388,0 0 1px #38200e;backface-visibility:hidden}.face[data-side="0"]{transform:translateZ(var(--depth))}.face[data-side="1"]{transform:rotateY(90deg) translateZ(var(--depth))}.face[data-side="2"]{transform:rotateY(180deg) translateZ(var(--depth))}.face[data-side="3"]{transform:rotateY(270deg) translateZ(var(--depth))}.hole{border:3px solid #7b4c2e;border-radius:15px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 45% 38%,#704224,#4b2819);box-shadow:inset 3px 6px 8px #251308aa,0 2px #f9d1a4;position:relative}.hole svg{width:88%;height:88%;filter:drop-shadow(0 1px 1px #150c08)}.hole.filled{background:#c88c54;animation:flash .45s}.hole.filled svg{filter:drop-shadow(0 4px 3px #4b2b25aa)}.hole.active{outline:3px solid #e7c94e}.turn{display:flex;justify-content:center;gap:20px;margin-top:10px}.turn button{font-size:24px;min-width:66px;padding:6px}.tray{width:100%;padding:12px 6px 10px;border:5px solid #b67e48;border-radius:25px;background:linear-gradient(160deg,#f5d09c,#d99c5f);box-shadow:inset 0 3px #fff6,0 6px #95623b}.traytitle{text-align:center;font-size:13px;font-weight:900;margin-bottom:10px}.pieces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.piece{height:clamp(64px,18vw,96px);display:flex;justify-content:center;align-items:center;border:2px solid #f9dcaf;border-radius:18px;background:linear-gradient(#fff2d6,#ebbd84);box-shadow:0 4px 0 #bd8554;touch-action:none;cursor:grab}.piece svg{width:75%;height:75%;pointer-events:none;filter:drop-shadow(1px 5px 2px #3d251c66)}.piece.used{opacity:.2;pointer-events:none}.piece.selected{outline:4px solid #e6a83d}.footer{display:flex;gap:12px;justify-content:center;padding:7px}.footer button{padding:8px 15px}.next:disabled{opacity:.42}.msg{text-align:center;font-weight:900;font-size:14px;min-height:22px}.ghost{position:fixed;pointer-events:none;z-index:1000;width:80px;height:80px;opacity:.92;transform:translate(-50%,-50%)}.ghost svg{width:100%;height:100%;filter:drop-shadow(0 7px 4px #0006)}.overlay{position:fixed;inset:0;background:#07182ac9;display:none;align-items:center;justify-content:center;padding:25px;z-index:20}.overlay.show{display:flex}.modal{padding:28px 22px;text-align:center;border-radius:28px;background:linear-gradient(#ffe4b4,#eab272);border:7px solid #b87943;box-shadow:0 15px 0 #714323;max-width:360px;width:100%}.modal h2{margin:6px 0 10px}.modal button{padding:13px 22px}@keyframes flash{50%{box-shadow:0 0 0 7px #f9d95e,inset 0 0 14px #fff}}
@media(min-width:600px){.field{min-height:780px}.cube-wrap{width:270px;height:270px}.view{min-height:350px}}@media(max-height:720px){.view{min-height:225px}.cube-wrap{width:190px;height:190px}.field{gap:3px}.hint{min-height:20px}.pieces{gap:5px}}
</style></head><body><main class="screen"><header class="top"><button class="wood back" id="back" aria-label="Հետ">←</button><div class="wood name"><small>Մտքի խաղեր</small>Գտիր ճիշտ ձևը</div><div class="wood star" id="stars">⭐ 0</div></header><section class="field"><div class="status"><span class="chip" id="stage">Փուլ 1 / 4</span><span class="chip" id="progress">✓ 0 / 4</span></div><div class="hint">Պտտիր խորանարդը և ձևը գցիր ճիշտ անցքի մեջ</div><div class="view" id="view"><div class="cube-wrap" id="cubeWrap"><div class="cube" id="cube"></div></div><div class="turn"><button class="wood" id="left" aria-label="Պտտել ձախ">↶</button><button class="wood" id="right" aria-label="Պտտել աջ">↷</button></div></div><div class="tray"><div class="traytitle">Քաշիր գունավոր ձևերը դեպի խորանարդը</div><div class="pieces" id="pieces"></div></div><div class="msg" id="message">Պտտիր խորանարդը՝ տեսնելու մյուս կողմերը</div><div class="footer"><button class="wood" id="reset">↻ Նորից</button><button class="wood next" id="next" disabled>Հաջորդ փուլ →</button></div></section></main><div class="overlay" id="overlay"><div class="modal"><div style="font-size:58px">🏆</div><h2>Ապրե՜ս</h2><p>Դու լրացրեցիր բոլոր չորս կողմերը։</p><button class="wood" id="again">Խաղալ նորից</button></div></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const colors=[['#ff7772','#d64242'],['#66b5ff','#287ac8'],['#76d98b','#399a52'],['#ffcf59','#d99724'],['#bd95fa','#8159d1'],['#ff9bd0','#d15a95'],['#73e1df','#279a9c'],['#ffae68','#d27333']];const shapes=[['circle','<circle cx="50" cy="50" r="35"/>'],['square','<rect x="17" y="17" width="66" height="66" rx="8"/>'],['triangle','<path d="M50 12L91 85H9Z"/>'],['star','<path d="M50 8L62 35 92 38 70 59 76 89 50 74 24 89 30 59 8 38 38 35Z"/>'],['heart','<path d="M50 87L14 53C-6 27 24 4 50 29 76 4 106 27 86 53Z"/>'],['diamond','<path d="M50 7L92 50 50 93 8 50Z"/>'],['pentagon','<path d="M50 8L92 39 76 88H24L8 39Z"/>'],['hexagon','<path d="M28 10H72L94 50 72 90H28L6 50Z"/>'],['oval','<ellipse cx="50" cy="50" rx="29" ry="42"/>'],['cross','<path d="M36 10H64V36H90V64H64V90H36V64H10V36H36Z"/>'],['trapezoid','<path d="M28 15H72L94 85H6Z"/>'],['semicircle','<path d="M12 79V49A38 38 0 0 1 88 49V79Z"/>'],['arrow','<path d="M50 6L94 51H69V92H31V51H6Z"/>'],['octagon','<path d="M30 8H70L92 30V70L70 92H30L8 70V30Z"/>'],['crescent','<path d="M63 8A43 43 0 1 0 91 79 37 37 0 0 1 63 8Z"/>'],['parallelogram','<path d="M30 14H94L70 86H6Z"/>']];let stage=0,side=0,done=new Set(),selected=null,drag=null,stars=0,ctx=null;const slots=[0,1,2,3];function svg(i,dim=false){const c=colors[i%colors.length],a=dim?'#2d180f':c[0],b=dim?'#4a2a1a':c[1];return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="p'+i+(dim?'d':'c')+'" x1="0" x2="1" y1="0" y2="1"><stop stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><g fill="url(#p'+i+(dim?'d':'c')+')" stroke="'+(dim?'#704326':'#fff3cc')+'" stroke-width="2.7">'+shapes[i][1]+'</g>'+(dim?'':'<path d="M29 31Q44 19 58 24" fill="none" stroke="#fff8" stroke-width="4" stroke-linecap="round"/>')+'</svg>'}function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(v=>v.x)}function tone(ok){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==='suspended')ctx.resume();let now=ctx.currentTime+.02;const notes=ok?[[659.25,0,.16,.064],[783.99,.08,.17,.06],[987.77,.165,.23,.054]]:[[329.63,0,.17,.054],[246.94,.1,.24,.05]];notes.forEach(([f,t,d,v])=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(f,now+t);if(!ok)o.frequency.exponentialRampToValueAtTime(f*.93,now+t+d);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(v,now+t+.016);g.gain.exponentialRampToValueAtTime(.0001,now+t+d);o.connect(g);g.connect(ctx.destination);o.start(now+t);o.stop(now+t+d+.025)})}catch(e){}}function rotate(n){side=(side+n+4)%4;$('#cube').style.transform='rotateX(-15deg) rotateY('+(-90*side)+'deg)';$('#message').textContent='Կողմ '+(side+1)+' / 4';}function render(){done=new Set();selected=null;side=stage;$('#stage').textContent='Փուլ '+(stage+1)+' / 4';$('#progress').textContent='✓ 0 / 4';$('#next').disabled=true;$('#next').textContent=stage===3?'Ավարտել ★':'Հաջորդ փուլ →';$('#overlay').classList.remove('show');const cube=$('#cube');cube.innerHTML='';const wrap=$('#cubeWrap');const size=wrap.getBoundingClientRect().width;wrap.style.setProperty('--depth',(size/2)+'px');for(let s=0;s<4;s++){let face=document.createElement('div');face.className='face';face.dataset.side=s;for(let j=0;j<4;j++){let h=document.createElement('div');h.className='hole';h.dataset.shape=s*4+j;h.dataset.side=s;h.innerHTML=svg(s*4+j,true);h.addEventListener('click',()=>{if(selected!==null)place(selected,h)});face.append(h)}cube.append(face)}cube.style.transform='rotateX(-15deg) rotateY('+(-90*stage)+'deg)';const tray=$('#pieces');tray.innerHTML='';shuffle(slots.map(x=>stage*4+x)).forEach(i=>{let p=document.createElement('div');p.className='piece';p.dataset.shape=i;p.innerHTML=svg(i);p.setAttribute('role','button');p.setAttribute('aria-label',shapes[i][0]);p.addEventListener('pointerdown',ev=>{if(done.has(i))return;ev.preventDefault();selected=i;document.querySelectorAll('.piece').forEach(x=>x.classList.toggle('selected',x===p));drag={i,x:ev.clientX,y:ev.clientY,ghost:null};p.setPointerCapture(ev.pointerId)});p.addEventListener('pointermove',ev=>{if(!drag||drag.i!==i)return;if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>7){if(!drag.ghost){let g=document.createElement('div');g.className='ghost';g.innerHTML=svg(i);document.body.append(g);drag.ghost=g}drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px'}});p.addEventListener('pointerup',ev=>{if(!drag)return;const moved=!!drag.ghost;if(drag.ghost)drag.ghost.remove();drag=null;const el=document.elementFromPoint(ev.clientX,ev.clientY),h=el?.closest('.hole');if(moved&&h)place(i,h);else $('#message').textContent='Ընտրիր համապատասխան անցքը'});p.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null});tray.append(p)});$('#message').textContent='Պտտիր խորանարդը՝ տեսնելու մյուս կողմերը';}function place(i,h){if(done.has(i))return;const target=Number(h.dataset.shape),s=Number(h.dataset.side);if(s!==side||s!==stage||i!==target){tone(false);$('#message').textContent='Փորձիր մեկ ուրիշ անցք';h.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:320});return}done.add(i);selected=null;h.classList.add('filled');h.innerHTML=svg(i);document.querySelector('.piece[data-shape="'+i+'"]')?.classList.add('used');tone(true);$('#progress').textContent='✓ '+done.size+' / 4';$('#message').textContent='Ապրե՜ս, ճիշտ է։';if(done.size===4){$('#next').disabled=false;$('#message').textContent='Հրաշալի՜, անցնենք հաջորդ փուլին';stars++;$('#stars').textContent='⭐ '+stars;if(stage===3)setTimeout(()=>$('#overlay').classList.add('show'),750)}}$('#left').onclick=()=>rotate(-1);$('#right').onclick=()=>rotate(1);let x0=null;$('#cubeWrap').addEventListener('pointerdown',e=>{x0=e.clientX});$('#cubeWrap').addEventListener('pointerup',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>24)rotate(e.clientX<x0?1:-1);x0=null});$('#reset').onclick=()=>render();$('#next').onclick=()=>{if(done.size!==4)return;if(stage===3){$('#overlay').classList.add('show')}else{stage++;render()}};$('#again').onclick=()=>{stage=0;stars=0;$('#stars').textContent='⭐ 0';render()};$('#back').onclick=()=>{if(history.length>1)history.back();else location.href='./'};render();window.addEventListener('resize',()=>{const w=$('#cubeWrap');w.style.setProperty('--depth',(w.getBoundingClientRect().width/2)+'px')});})();
</script></body></html>
