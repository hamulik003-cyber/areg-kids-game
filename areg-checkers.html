<style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#3e6c75,#112b3a 80%);color:#fff5dd;font-family:system-ui,sans-serif;text-align:center}.wrap{max-width:540px;height:100dvh;height:100svh;margin:auto;padding:8px 12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}h1{margin:0;font-size:clamp(22px,4vh,32px);color:#ffd996;text-shadow:0 3px 2px #4b2711}.subtitle{opacity:.85;font-size:clamp(10px,1.5vh,13px);margin:0}.panel{flex-shrink:0;background:#ffffff16;border:1px solid #ffffff30;border-radius:22px;padding:clamp(6px,1vh,12px);margin:4px 0;box-shadow:0 12px 24px #0003}button,input,select{font:inherit;-webkit-touch-callout:none}button{border:0;border-radius:15px;padding:clamp(6px,1vh,11px) 12px;background:linear-gradient(#ffe6ae,#cf9955);color:#41260d;font-weight:800;box-shadow:0 4px 0 #825527;cursor:pointer}button:disabled{opacity:.45}button:active{transform:translateY(2px)}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:5px 0}select,input{border-radius:10px;padding:10px;max-width:100%;background:#fff7e5;color:#312a1d;border:0}#board{width:min(calc(100vw - 62px),470px,calc(100svh - 345px));height:auto;aspect-ratio:1/1;margin:16px auto;flex-shrink:0;touch-action:none;border:0;border-radius:2px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));grid-auto-flow:row;box-shadow:0 0 0 2px #6e3c20,0 0 0 11px #c88a4c,0 0 0 14px #f5c17a,0 0 0 17px #79451f,0 19px 30px 17px #0007;overflow:hidden;transform:none} .sq{appearance:none;-webkit-appearance:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;display:flex;align-items:center;justify-content:center;padding:0!important;border:0;border-radius:0;box-shadow:none;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden}.light{background:#f0d3a4}.dark{background:#81563c}.sq.hint-piece .piece{background-image:radial-gradient(ellipse at 34% 18%,#e5fff0 0%,#82eab2 21%,#3dbd83 49%,#14764d 80%,#0b4e38 100%);border-color:#adf5ca9c;animation:jadeHint 2.8s ease-in-out infinite}@keyframes jadeHint{0%,100%{filter:brightness(1) saturate(1.05);box-shadow:inset 0 3px 3px #eafff1aa,inset 0 -8px 6px #06492b99,0 3px 4px #0009,0 0 5px 1px #72dca45c}50%{filter:brightness(1.17) saturate(1.12);box-shadow:inset 0 3px 3px #eafff1bb,inset 0 -8px 6px #06492b99,0 3px 4px #0009,0 0 11px 3px #72dca48a}}.sq.selected{box-shadow:inset 0 0 0 4px #ffe671}.sq.route:after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#63ff70;box-shadow:0 0 0 2px #205c36,0 0 9px #5aff6c;pointer-events:none}.sq.target:after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#b1ff85b8}.sq>.piece{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%);margin:0!important}.piece{pointer-events:none;user-select:none;-webkit-user-select:none;width:78%;height:78%;aspect-ratio:1;min-width:0;min-height:0;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 3px 2px #ffffffa8,inset 0 -8px 6px #0009,inset 0 0 0 3px #ffffff22,0 2px 0 #171a20,0 6px 3px #0008,0 9px 9px #0006;border:3px solid #ffffff50;transition:transform .2s;background-clip:padding-box;flex-shrink:0}.piece.red{background:radial-gradient(ellipse at 33% 17%,#ffd2c2 0%,#ed746a 17%,#bb342d 49%,#79211f 78%,#481416 100%)}.piece.black{background:radial-gradient(ellipse at 33% 17%,#c7d0db 0%,#758294 17%,#354255 49%,#1c2533 78%,#0b111c 100%)} .piece.king:before{content:"♛";font-size:clamp(21px,5.6vw,34px);color:#ffe39a;text-shadow:0 1px 2px #000}.sq:active .piece{filter:brightness(1.08)}.piece.travel{position:fixed!important;margin:0!important;z-index:9999;pointer-events:none;transition:none!important;will-change:transform}#status{font-weight:800;min-height:26px;padding:2px}.muted{font-size:12px;opacity:.8}#online{display:none}#online.active{display:block}#invite{overflow-wrap:anywhere;font-size:12px}#notice{min-height:24px;color:#ffe09b}.fuk-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:750}.fuk-switch input{position:absolute;opacity:0;width:1px;height:1px}.fuk-track{width:52px;height:31px;border-radius:20px;background:#899198;position:relative;transition:background .2s;box-shadow:inset 0 1px 3px #0005}.fuk-track:after{content:"";position:absolute;width:25px;height:25px;top:3px;left:3px;background:white;border-radius:50%;box-shadow:0 2px 4px #0005;transition:transform .2s}.fuk-switch input:checked+.fuk-track{background:#34c759}.fuk-switch input:checked+.fuk-track:after{transform:translateX(21px)}.fuk-switch input:disabled+.fuk-track{opacity:.7;cursor:not-allowed}.fuk-switch input:focus-visible+.fuk-track{outline:3px solid #ffe18c}#hint{font-size:12px;color:#aaff9a;min-height:0;font-weight:750}.mode-overlay{position:fixed;inset:0;z-index:1000;background:rgba(30,20,11,.34);-webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);display:flex;align-items:center;justify-content:center;padding:22px}.mode-overlay.hidden{display:none}.mode-card{width:min(100%,440px);padding:24px 20px;border-radius:30px;background:linear-gradient(160deg,#f8dba5 0%,#eab979 52%,#c88c4b 100%);border:3px solid #ffe3ac;box-shadow:inset 0 2px 2px #fff8,0 8px 0 #8d542a,0 22px 55px #0008;text-align:center}.mode-card h2{font-size:clamp(20px,5vw,28px);margin:4px 0 22px;color:#643716;text-shadow:0 1px 0 #fff5}.mode-choice{display:block;width:100%;min-height:76px;margin:13px 0;padding:15px 12px;background:linear-gradient(180deg,#ffe4ae,#d79c5b);color:#603516;font-size:clamp(15px,4vw,20px);font-weight:850;border:2px solid #fff0c4;border-radius:22px;box-shadow:0 6px 0 #a16b39,0 9px 15px #0003}.mode-choice:active{transform:translateY(3px)}@media(prefers-reduced-mo <div class="wrap"><h1>Շաշկի</h1><div class="panel"><div id="difficulty">Բարդություն՝ <select id="level"><option value="1">Հեշտ</option><option value="3" selected>Միջին</option><option value="5">Դժվար</option></select></div><div class="row" style="align-items:center;font-size:13px"><label class="fuk-switch" for="fuk">Ֆուկ <input id="fuk" type="checkbox"><span class="fuk-track" aria-hidden="true"></span></label></div><div id="online"><div class="row"><button id="host">Ստեղծել սենյակ</button><input id="code" placeholder="6 նիշանոց կոդ" maxlength="6"><button id="join">Միանալ</button></div><div id="invite"></div></div><div id="notice"></div></div><div id="status"></div><div id="hint" aria-live="polite"></div><div id="board" aria-label="Շաշկու խաղատախտակ"></div><div class="row"><button id="reset">Նոր խաղ</button></div><p class="muted">Կանոններ՝ 8×8, սովորական խաղաքարերը հարվածում են երկու ուղղությամբ, դամկան շարժվում է անկյունագծով։</p></div><div id="modeOverlay" class="mode-overlay"><div class="mode-card"><h2>Ընտրի՛ր խաղի ձևը</h2><button id="cpu" class="mode-choice">🤖 Խաղալ համակարգչի դեմ</button><button id="net" class="mode-choice">🌐 Երկու հեռախոսով՝ առցանց</button></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);let board=[],turn=1,selected=-1,forced=-1,mode='cpu',mySide=1,peer=null,conn=null,room='',busy=false,ended=false,penalty=[],penaltySide=0,hint='',hintPieces=[],started=false;const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]],at=(r,c)=>r*8+c,inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;function start(){board=Array(64).fill(0);for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)board[at(r,c)]=r<3?-1:r>4?1:0;turn=1;selected=-1;forced=-1;ended=false;busy=false;penalty=[];penaltySide=0;hint='';hintPieces=[];started=false;$('#fuk').disabled=false;render()}function rawMoves(b,side,only=-1){let all=[];for(let i=0;i<64;i++){let p=b[i];if(Math.sign(p)!==side||(only>=0&&i!==only))continue;let r=i>>3,c=i%8;for(let [dr,dc] of dirs){if(Math.abs(p)===2){let rr=r+dr,cc=c+dc,enemy=-1;while(inside(rr,cc)){let j=at(rr,cc);if(b[j]){if(enemy>=0||Math.sign(b[j])===side)break;enemy=j}else all.push({from:i,to:j,cap:enemy});rr+=dr;cc+=dc}}else{let rr=r+dr,cc=c+dc,rr2=r+2*dr,cc2=c+2*dc;if(dr===-side&&inside(rr,cc)&&!b[at(rr,cc)])all.push({from:i,to:at(rr,cc),cap:-1});if(inside(rr2,cc2)&&Math.sign(b[at(rr,cc)])===-side&&!b[at(rr2,cc2)])all.push({from:i,to:at(rr2,cc2),cap:at(rr,cc)})}}}return all}
function maxCaptures(b,side,only=-1){const caps=rawMoves(b,side,only).filter(m=>m.cap>=0);if(!caps.length)return [];let scored=caps.map(m=>({m,n:1+maxCount(apply(b,m),side,m.to)}));let max=Math.max(...scored.map(x=>x.n));return scored.filter(x=>x.n===max).map(x=>x.m)}
function maxCount(b,side,only){const caps=rawMoves(b,side,only).filter(m=>m.cap>=0);if(!caps.length)return 0;return Math.max(...caps.map(m=>1+maxCount(apply(b,m),side,m.to)))}
function moves(b,side,only=-1){let caps=maxCaptures(b,side,only);if(only>=0)return caps;let ordinary=rawMoves(b,side).filter(m=>m.cap<0);return $('#fuk').checked?caps.concat(ordinary):caps.length?caps:ordinary}
function routeSquares(b,side,from){const result=new Set();function walk(state,pos,depth){if(depth>12)return;for(const m of rawMoves(state,side,pos).filter(x=>x.cap>=0)){result.add(m.to);walk(apply(state,m),m.to,depth+1)}}walk(b,from,0);return result}
function apply(b,m){let a=b.slice(),p=a[m.from];a[m.from]=0;a[m.to]=p;if(m.cap>=0)a[m.cap]=0;let r=m.to>>3;if(Math.abs(p)===1&&((p===1&&r===0)||(p===-1&&r===7)))a[m.to]=p*2;return a}function options(){return moves(board,turn,forced)}function lockRules(){if(!started){started=true;$('#fuk').disabled=true}}function render(){let legal=options(),t=$('#board'),routes=selected>=0?routeSquares(board,turn,selected):new Set();for(let i=0;i<64;i++){let r=i>>3,c=i%8;let s=t.children[i]||document.createElement('button');s.replaceChildren();s.className='sq '+((r+c)%2?'dark':'light')+(selected===i?' selected':'')+(selected>=0&&legal.some(m=>m.from===selected&&m.to===i)?' target':'')+(routes.has(i)?' route':'')+(hintPieces.includes(i)?' hint-piece':'');s.setAttribute('aria-label','Վանդակ '+(r+1)+' '+(c+1));let p=board[i];if(p){let el=document.createElement('span');el.className='piece '+(p>0?'red':'black')+(Math.abs(p)===2?' king':'');s.append(el)}s.onclick=()=>tap(i);if(!s.isConnected)t.append(s)}let winner=ended?(turn===1?'Սևերը հաղթեցին':'Կարմիրները հաղթեցին'):'';$('#status').textContent=winner||((turn===1?'🔴 Կարմիրների':'⚫ Սևերի')+' հերթն է'+(forced>=0?' · շարունակիր հարվածը':penalty.length?' · ֆուկ՝ սեղմիր հարվածը բաց թողած քարին կամ խաղա':' '));$('#hint').textContent=$('#fuk').checked?'':hint;$('#notice').textContent=mode==='online'?(conn?.open?'Միացված է • դու '+(mySide===1?'կարմիրներն':'սևերն'):'Սպասում ենք առցանց կապին…'):''}function tap(i){if(ended||busy||(mode==='online'&&(!conn?.open||turn!==mySide))||(mode==='cpu'&&turn!==1))return;
if(penalty.length&&turn!==penaltySide){if(penalty.includes(i)&&board[i]&&Math.sign(board[i])===penaltySide){board[i]=0;penalty=[];penaltySide=0;if(mode==='online'&&conn?.open)conn.send({type:'fuk',i});render();return}penalty=[];penaltySide=0}
let legal=options();if(board[i]&&Math.sign(board[i])===turn&&legal.some(m=>m.from===i)){selected=i;hint='';hintPieces=[];render();return}
let m=legal.find(m=>m.from===selected&&m.to===i);if(!m){if(!$('#fuk').checked&&forced<0){const must=maxCaptures(board,turn);if(must.length){hint='⚠️ Պարտադիր հարված կա';hintPieces=[...new Set(must.map(x=>x.from))];selected=-1;render()}}return}
hint='';hintPieces=[];play(m,true)}
function play(m,send){if(!options().some(x=>x.from===m.from&&x.to===m.to&&x.cap===m.cap))return;const missed=($('#fuk').checked?'on':'off')==='on'&&forced<0&&m.cap<0&&maxCaptures(board,turn).length>0;const missedSide=turn;const missedPieces=missed?[...new Set(maxCaptures(board,turn).map(x=>x.from))]:[];lockRules();const src=$('#board').children[m.from]?.querySelector('.piece');const origin=src?.getBoundingClientRect();const kind=src?.className||'';board=apply(board,m);if(missed){penalty=missedPieces;penaltySide=missedSide}else{penalty=[];penaltySide=0}selected=-1;let chain=m.cap>=0?maxCaptures(board,turn,m.to):[];if(chain.length){forced=m.to}else{forced=-1;turn=-turn}if(send&&mode==='online'&&conn?.open)conn.send({type:'move',m});if(!options().length){ended=true}render();if(origin&&kind){const dest=$('#board').children[m.to]?.querySelector('.piece');const target=dest?.getBoundingClientRect();if(target){const ghost=document.createElement('span');ghost.className=kind+' travel';ghost.style.cssText='left:'+origin.left+'px;top:'+origin.top+'px;width:'+origin.width+'px;height:'+origin.height+'px';document.body.append(ghost);dest.style.visibility='hidden';const dx=target.left-origin.left,dy=target.top-origin.top;const anim=ghost.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d('+dx+'px,'+dy+'px,0)'}],{duration:260,easing:'cubic-bezier(.22,.75,.28,1)'});anim.onfinish=()=>{ghost.remove();dest.style.visibility=''};anim.oncancel=()=>{ghost.remove();dest.style.visibility=''};}}if(!ended&&mode==='cpu'&&turn===-1){busy=true;setTimeout(()=>{busy=false;cpuMove()},350)}}function evaluate(b){let score=0;for(let i=0;i<64;i++)if(b[i])score+=Math.sign(b[i])*(Math.abs(b[i])===2?175:100)+Math.sign(b[i])*(b[i]>0?(7-(i>>3)):(i>>3))*3;return score}function search(b,side,depth,alpha,beta,chain=-1){let mm=moves(b,side,chain);if(!mm.length)return {score:side===-1?99999:-99999};if(depth<=0)return {score:evaluate(b)};let best=side===-1?Infinity:-Infinity,bm=null;for(let m of mm){let next=apply(b,m),extra=m.cap>=0?moves(next,side,m.to).filter(x=>x.cap>=0):[],result=extra.length?search(next,side,depth-1,alpha,beta,m.to):search(next,-side,depth-1,alpha,beta);let score=result.score;if((side===-1&&score<best)||(side===1&&score>best)){best=score;bm=m}if(side===-1)beta=Math.min(beta,best);else alpha=Math.max(alpha,best);if(beta<=alpha)break}return {score:best,m:bm}}function cpuMove(){if(mode!=='cpu'||ended||turn!==-1)return;if(penalty.length&&penaltySide===1){const victim=penalty.find(i=>board[i]>0);if(victim!==undefined)board[victim]=0;penalty=[];penaltySide=0;render()}let level=Number($('#level').value),mm=options();let m=level===1?mm[Math.floor(Math.random()*mm.length)]:search(board,-1,level,-Infinity,Infinity,forced).m;if(m)play(m,false)}function clearPeer(){try{conn?.close();peer?.destroy()}catch{}conn=null;peer=null}function setMode(next){$('#modeOverlay').classList.add('hidden');clearPeer();mode=next;$('#online').classList.toggle('active',next==='online');$('#difficulty').style.display=next==='cpu'?'block':'none';start()}$('#cpu').onclick=()=>setMode('cpu');$('#net').onclick=()=>setMode('online');$('#fuk').onchange=()=>{if(started){$('#fuk').checked=!$('#fuk').checked;return}if(mode==='online'&&conn?.open)conn.send({type:'fuk-setting',value:$('#fuk').checked?'on':'off'});start()};$('#reset').onclick=()=>{if(mode==='online'&&conn?.open){if(mySide!==1)return;conn.send({type:'reset'})}start();$('#modeOverlay').classList.remove('hidden')};function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();let s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';s.onload=resolve;s.onerror=()=>reject(Error('Առցանց գրադարանը չի բեռնվել'));document.head.append(s)})}function attach(c){conn=c;c.on('open',()=>{start();render()});c.on('data',d=>{if(d?.type==='move'&&turn!==mySide&&d.m&&Number.isInteger(d.m.from)&&Number.isInteger(d.m.to)&&Number.isInteger(d.m.cap))play(d.m,false);if(d?.type==='fuk'&&penalty.includes(d.i)&&turn===mySide){board[d.i]=0;penalty=[];penaltySide=0;render()}if(d?.type==='fuk-setting'&&['on','off'].includes(d.value)){$('#fuk').checked=d.value==='on';start()}if(d?.type==='reset')start()});c.on('close',()=>{$('#notice').textContent='Կապն ընդհատվել է'});c.on('error',e=>{$('#notice').textContent='Կապի սխալ՝ '+e.type})}async function connect(host){clearPeer();room=host?Math.random().toString(36).slice(2,8).toUpperCase():$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(room)){alert('Մուտքագրիր 6 նիշանոց կոդ');return}mySide=host?1:-1;$('#notice').textContent='Միանում ենք…';try{await loadPeer();peer=new Peer('areg-checkers-'+room+(host?'-h':'-g'),{debug:0});peer.on('error',e=>{$('#notice').textContent='Միացման սխալ՝ '+e.type});peer.on('open',()=>{if(!host)attach(peer.connect('areg-checkers-'+room+'-h',{reliable:true}));else{$('#invite').textContent='Սենյակ՝ '+room+' · Հղում՝ '+location.origin+location.pathname+'?room='+room}});if(host)peer.on('connection',c=>{if(conn?.open){c.close();return}attach(c)})}catch(e){$('#notice').textContent=e.message}}$('#host').onclick=()=>connect(true);$('#join').onclick=()=>connect(false);let query=new URLSearchParams(location.search).get('room');if(query){setMode('online');$('#code').value=query}document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('pointerdown',e=>{if(e.target.closest('#board'))e.preventDefault()},{passive:false});document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('touchmove',e=>{if(e.target.closest('#board'))e.preventDefault()},{passive:false});start()})();
</script></html>
