<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152c">
<title>AREG — թարմացնել խաղը</title>
<style>
*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;
background:radial-gradient(circle at 50% 20%,#203d76,#07152c 70%);
color:white;font-family:system-ui,Arial,sans-serif;padding:24px;text-align:center}
article{max-width:420px;width:100%;padding:28px 22px;border-radius:24px;
border:1px solid #91b3e8;background:#11244b}
h1{font-size:23px;margin:8px 0 14px}p{font-size:16px;line-height:1.6}
button{padding:14px 20px;min-height:50px;border:0;border-radius:16px;
background:#40d77f;color:#07351d;font-size:17px;font-weight:850;cursor:pointer}
small{display:block;margin-top:12px;color:#d0dffa}
</style>
</head>
<body><article>
<div aria-hidden="true" style="font-size:40px">✨</div>
<h1>AREG խաղի թարմացում</h1>
<p id="status" role="status">Ստուգում ենք V275 տարբերակը…</p>
<button id="retry" hidden type="button">Կրկնել թարմացումը</button>
<small>Խաղի աստղերն ու կարգավորումները պահպանվում են։</small>
</article>
<script>
(()=>{
const status=document.getElementById('status');
const retry=document.getElementById('retry');
let working=false;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function updateGame(){
  if(working)return;
  working=true;retry.hidden=true;
  status.textContent='Նորացնում ենք խաղի պահված տարբերակը…';
  try{
    if(!('serviceWorker' in navigator)){
      status.textContent='Բացվում է թարմացված խաղը։';
      location.replace('./index.html?v=281');
      return;
    }
    const registration=await navigator.serviceWorker.register(
      './service-worker.js?v=281',{updateViaCache:'none'});
    await registration.update();
    // This dedicated /refresh.html path was not cached by the previous
    // service worker. Wait for v274 to truly activate before returning to
    // the cache-first PWA home screen, otherwise old index.html may reappear.
    const deadline=Date.now()+14000;
    while(Date.now()<deadline){
      const active=registration.active;
      if(active&&active.state==='activated'&&active.scriptURL.includes('v=281')){
        status.textContent='Թարմացումն ավարտված է։ Բացվում է խաղը։';
        location.replace('./index.html?v=281');
        return;
      }
      await sleep(150);
    }
    throw Error('V272 service worker activation not confirmed');
  }catch(error){
    status.textContent='Չհաջողվեց հաստատել թարմացումը։ Ստուգեք կապը և սեղմեք «Կրկնել»։';
    retry.hidden=false;working=false;
    console.warn('AREG refresh:',error);
  }
}
retry.addEventListener('click',updateGame);
updateGame();
})();
</script>
</body></html>
