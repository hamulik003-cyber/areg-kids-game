<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Մատով նկարչություն · AREG</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;color:#52371e}body{background:linear-gradient(155deg,#c9e9f5,#e7f6ed 60%,#f8e9c8)}#theme{position:fixed;inset:0;z-index:-1;background:linear-gradient(155deg,#c9e9f5,#e7f6ed 60%,#f8e9c8);background-size:cover;background-position:center}
.shell{height:100dvh;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.header{display:flex;align-items:center;gap:8px;min-height:48px}.wood{border:3px solid #966338;border-radius:15px;background:linear-gradient(160deg,#f4d18e,#d69b56 52%,#bd8042);box-shadow:0 4px 0 #81512d,0 8px 16px #57361e30,inset 0 2px 0 #fff6c1;color:#523116;font-weight:900;text-shadow:0 1px #fff1c7}.back{width:48px;height:45px;font-size:31px;line-height:1}.title{flex:1;text-align:center;font-size:clamp(16px,4vw,22px);padding:10px 3px}.step{padding:12px 10px;min-width:64px;text-align:center;font-size:16px}.hint{text-align:center;font-weight:800;font-size:clamp(14px,3.5vw,19px);color:#5a402b;text-shadow:0 1px #fff;min-height:26px}
.paper{position:relative;flex:1;min-height:0;max-width:640px;width:100%;margin:0 auto;border:8px solid #e2b873;border-radius:25px;background:#fffef6;box-shadow:0 8px 0 #a46c3a,0 16px 28px #5d422d35,inset 0 0 0 3px #fff4d8;overflow:hidden;touch-action:none}.paper svg{width:100%;height:100%;display:block;touch-action:none}#art{position:relative;z-index:3;pointer-events:none}.paper::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 22px #d7a96027}
#outline{fill:none;stroke:#64513e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 11}#trace{fill:none;stroke:#5b4433;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}#paint{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.marker{position:absolute;z-index:5;width:34px;height:108px;pointer-events:none;transform:translate(-14px,-88px) rotate(25deg);filter:drop-shadow(3px 6px 3px #0004);opacity:0;transition:opacity .15s}.marker svg{width:100%;height:100%}.marker.show{opacity:1}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;max-width:640px;width:100%;margin:auto auto 0}.swatch{height:44px;width:44px;border:4px solid #fff6dd;border-radius:50%;box-shadow:0 4px 0 #a77b49,0 6px 12px #5d422d30;touch-action:manipulation}.swatch.selected{outline:3px solid #ffcf55;outline-offset:2px;transform:translateY(-3px)}.action{font-size:17px;padding:11px 17px;touch-action:manipulation}.action:disabled{opacity:.45}.progress{width:min(280px,65%);height:11px;background:#e4d8bf;border-radius:30px;margin:2px auto 0;overflow:hidden;box-shadow:inset 0 2px 3px #0002}.bar{width:0;height:100%;background:linear-gradient(90deg,#f5c25e,#73c990);border-radius:30px;transition:width .3s}
.overlay{position:absolute;inset:0;background:#fff9e6dd;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center}.overlay.visible{display:flex;animation:pop .35s both}.overlay strong{font-size:30px;color:#795126}.overlay .star{font-size:76px;animation:float 1.5s ease-in-out infinite alternate}.overlay button{font-size:23px;padding:14px 27px}.spark{position:absolute;pointer-events:none;font-size:22px;animation:spark .9s ease-out forwards}
@keyframes float{to{transform:translateY(-9px) rotate(8deg)}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}
@media(max-height:650px){.shell{gap:4px}.header{min-height:39px}.back{height:39px}.title,.step{padding:6px}.swatch{width:37px;height:37px}.hint{min-height:20px;font-size:14px}}
</style></head><body><div id="theme"></div><div class="shell"><div class="header"><button class="wood back" id="back" aria-label="Հետ">‹</button><div class="wood title">Մատով նկարչություն</div><div class="wood step" id="step">1 / 5</div></div><div class="hint" id="hint">Հպի՛ր նկարին, որ գծվի ✨</div><div class="paper" id="paper"><svg id="art" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet" aria-label="Նկարի ուրվագիծ"><path id="outline"/><path id="trace"/></svg><canvas id="paint"></canvas><div class="marker" id="marker" aria-hidden="true"><svg viewBox="0 0 34 108"><path d="M9 90L17 105 25 90Z" fill="#e9bc85" stroke="#67492b" stroke-width="2"/><path d="M14 99L17 105 20 99Z" fill="#433e36"/><rect x="8" y="9" width="18" height="82" rx="4" fill="#e8514e" stroke="#fff0cf" stroke-width="2"/><path d="M12 17V79" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><rect x="8" y="2" width="18" height="14" rx="5" fill="#734d41"/><rect x="10" y="6" width="14" height="6" rx="2" fill="#b9a2a0"/></svg></div><div class="overlay" id="overlay"><div class="star">🌟</div><strong>Ապրե՛ս, նկարիչ</strong><button class="wood" id="next">Հաջորդ նկարը ➜</button></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="controls" id="controls"></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),paper=$('paper'),canvas=$('paint'),ctx=canvas.getContext('2d'),art=$('art'),outline=$('outline'),trace=$('trace'),marker=$('marker'),controls=$('controls'),hint=$('hint'),bar=$('bar'),overlay=$('overlay');
const drawings=[
 {name:'Ծաղիկ',d:'M200 195 C165 165 144 140 169 115 C190 95 205 116 200 142 C203 101 231 83 249 108 C269 135 241 162 217 171 C264 143 294 165 283 197 C275 225 244 222 220 208 C255 238 240 273 210 266 C185 262 182 235 193 217 C176 258 138 256 125 225 C114 196 149 178 185 191 Z M200 219 C200 285 196 337 198 391 M197 336 C166 304 131 313 129 333 C136 356 171 359 197 345 M200 365 C232 334 263 333 269 351 C260 374 231 382 201 373'},
 {name:'Թիթեռ',d:'M197 234 C166 174 103 135 75 177 C44 231 106 260 175 260 C110 263 71 306 103 344 C140 379 179 325 196 276 M203 234 C234 174 297 135 325 177 C356 231 294 260 225 260 C290 263 329 306 297 344 C260 379 221 325 204 276 M200 214 C177 193 176 169 161 159 M200 214 C223 193 224 169 239 159 M200 218 C180 237 182 277 200 316 C218 277 220 237 200 218Z'},
 {name:'Տնակ',d:'M79 238 L200 125 L321 238 L305 238 L305 370 L95 370 L95 238 Z M160 370 V277 H240 V370 M111 249 L200 166 L289 249 M111 282 H153 V319 H111 Z M250 282 H292 V319 H250 Z M260 153 V118 H290 V181'},
 {name:'Ձուկ',d:'M104 254 C157 159 278 169 322 252 C269 338 152 337 104 254 Z M104 254 L47 196 L47 309 Z M214 193 L235 151 L266 198 M214 315 L238 353 L269 306 M271 243 A7 7 0 1 0 285 243 A7 7 0 1 0 271 243 M309 265 Q290 286 278 265'},
 {name:'Արև',d:'M200 177 A80 80 0 1 1 199.9 177 M200 68 V113 M200 322 V367 M89 217 H45 M355 217 H310 M122 138 L90 105 M278 296 L310 329 M278 138 L310 105 M122 296 L90 329 M164 206 A6 6 0 1 0 164 207 M236 206 A6 6 0 1 0 236 207 M164 248 Q200 277 236 248'}
];
// Closed paintable regions: NEVER use the decorative outline stroke as a paint mask.
// Every brush mark is clipped to these exact silhouettes, including at the edges.
const paintRegions=[
  [ // flower: petals, narrow stem, two closed leaves
    'M200 194 C171 163 143 140 169 115 C190 95 205 116 200 142 C203 101 231 83 249 108 C269 135 241 162 217 171 C264 143 294 165 283 197 C275 225 244 222 220 208 C255 238 240 273 210 266 C185 262 182 235 193 217 C176 258 138 256 125 225 C114 196 149 178 185 191 Z',
    'M194 220 L204 220 L203 391 L193 391 Z',
    'M198 341 C174 308 136 309 129 333 C136 356 171 359 198 345 Z',
    'M200 370 C232 334 263 333 269 351 C260 374 231 382 200 373 Z'
  ],
  [
    'M197 234 C166 174 103 135 75 177 C44 231 106 260 175 260 C110 263 71 306 103 344 C140 379 179 325 196 276 Z',
    'M203 234 C234 174 297 135 325 177 C356 231 294 260 225 260 C290 263 329 306 297 344 C260 379 221 325 204 276 Z',
    'M200 218 C180 237 182 277 200 316 C218 277 220 237 200 218 Z'
  ],
  [
    'M79 238 L200 125 L321 238 L305 238 L305 370 L95 370 L95 238 Z',
    'M260 153 V118 H290 V181 Z'
  ],
  [
    'M104 254 C157 159 278 169 322 252 C269 338 152 337 104 254 Z',
    'M104 254 L47 196 L47 309 Z',
    'M214 193 L235 151 L266 198 Z',
    'M214 315 L238 353 L269 306 Z'
  ],
  [
    'M200 137 A80 80 0 1 1 199.9 137 Z',
    'M194 68 H206 V113 H194 Z','M194 322 H206 V367 H194 Z',
    'M45 211 H89 V223 H45 Z','M310 211 H355 V223 H310 Z',
    'M85 105 L94 96 L127 133 L118 142 Z','M273 292 L282 283 L315 324 L306 333 Z',
    'M273 142 L282 133 L315 100 L306 91 Z','M85 329 L94 338 L127 301 L118 292 Z'
  ]
];
const colors=['#ee5253','#f29a3c','#f4d451','#65bc7e','#54a7e6','#a27bdd','#d47fa3','#6f4b37'];
let index=0,phase='trace',selected=0,active=false,last=null,mask=null,strokeHistory=[],coverage=new Set(),traceRAF=0,markerRAF=0,markerX=0,markerY=0,targetX=0,targetY=0,markerVisible=false,drawLength=0,traceStart=0,runToken=0;
const fit=()=>{const rect=paper.getBoundingClientRect(),ratio=devicePixelRatio||1;const old=strokeHistory.slice();canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio));canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);replay(old)};
function getPoint(e){const r=paper.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pathPoint(p){const pt=art.createSVGPoint();pt.x=p.x;pt.y=p.y;const ctm=art.getScreenCTM();if(!ctm)return {x:200,y:250};return pt.matrixTransform(ctm.inverse())}
function makeMask(){
  const r=paper.getBoundingClientRect();
  mask=document.createElement('canvas');
  mask.width=Math.round(r.width);mask.height=Math.round(r.height);
  const m=mask.getContext('2d');
  const rect=art.getBoundingClientRect();
  const scale=Math.min(rect.width/400,rect.height/500);
  const dx=(rect.width-400*scale)/2,dy=(rect.height-500*scale)/2;
  m.setTransform(scale,0,0,scale,dx,dy);
  m.fillStyle='#000';
  for(const region of paintRegions[index])m.fill(new Path2D(region));
}
function replay(strokes){ctx.clearRect(0,0,canvas.width,canvas.height);if(phase!=='paint')return;makeMask();for(const s of strokes)drawStroke(s,false)}
function drawStroke(s,save=true){const c=ctx,r=paper.getBoundingClientRect();c.save();c.beginPath();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=Math.max(18,r.width*.074);if(s.a.x===s.b.x&&s.a.y===s.b.y){c.arc(s.a.x,s.a.y,c.lineWidth/2,0,Math.PI*2);c.fill()}else{c.moveTo(s.a.x,s.a.y);c.lineTo(s.b.x,s.b.y);c.stroke()}c.globalCompositeOperation='destination-in';c.drawImage(mask,0,0,r.width,r.height);c.restore();if(save)strokeHistory.push(s)}
function showMarker(x,y){targetX=x;targetY=y;markerVisible=true;marker.classList.add('show');if(!markerRAF){markerX=x;markerY=y;const animate=()=>{markerX+=(targetX-markerX)*.34;markerY+=(targetY-markerY)*.34;marker.style.left=markerX+'px';marker.style.top=markerY+'px';if(markerVisible||Math.abs(targetX-markerX)+Math.abs(targetY-markerY)>.5)markerRAF=requestAnimationFrame(animate);else markerRAF=0};markerRAF=requestAnimationFrame(animate)}}
function hideMarker(){markerVisible=false;marker.classList.remove('show')}
function renderPalette(){controls.replaceChildren();colors.forEach((color,i)=>{const b=document.createElement('button');b.className='swatch'+(i===selected?' selected':'');b.style.background=color;b.setAttribute('aria-label','Գույն '+(i+1));b.addEventListener('click',()=>{selected=i;renderPalette()});controls.append(b)});const done=document.createElement('button');done.className='wood action';done.textContent='Պատրաստ է ✓';done.addEventListener('click',complete);controls.append(done)}
function start(){runToken++;cancelAnimationFrame(traceRAF);index=index%drawings.length;phase='trace';active=false;strokeHistory=[];coverage.clear();selected=0;last=null;overlay.classList.remove('visible');$('step').textContent=(index+1)+' / '+drawings.length;hint.textContent='Հպի՛ր նկարին, որ գծվի ✨';outline.setAttribute('d',drawings[index].d);trace.setAttribute('d',drawings[index].d);outline.style.strokeDasharray='1 11';trace.style.strokeDasharray='none';drawLength=trace.getTotalLength();trace.style.strokeDasharray=drawLength+' '+drawLength;trace.style.strokeDashoffset=drawLength;controls.replaceChildren();bar.style.width='0%';hideMarker();fit()}
function autoTrace(){if(phase!=='trace')return;phase='tracing';hint.textContent='Տե՛ս, ինչպես է գծվում նկարը';const token=runToken;traceStart=performance.now();const duration=2600;const tick=now=>{if(token!==runToken)return;const t=Math.min(1,(now-traceStart)/duration),smooth=t*t*(3-2*t);trace.style.strokeDashoffset=drawLength*(1-smooth);const p=trace.getPointAtLength(drawLength*smooth),point=art.createSVGPoint();point.x=p.x;point.y=p.y;const ctm=art.getScreenCTM();if(ctm){const q=point.matrixTransform(ctm),r=paper.getBoundingClientRect();showMarker(q.x-r.left,q.y-r.top)}bar.style.width=Math.round(smooth*100)+'%';if(t<1)traceRAF=requestAnimationFrame(tick);else{phase='paint';outline.style.strokeDasharray='none';hint.textContent='Ընտրի՛ր գույնը և ներկի՛ր մատով 🖍️';bar.style.width='0%';hideMarker();renderPalette();makeMask()}};traceRAF=requestAnimationFrame(tick)}
function paintMove(e){if(!active||phase!=='paint')return;const p=getPoint(e);showMarker(p.x,p.y);if(last){drawStroke({a:last,b:p,color:colors[selected]});const r=paper.getBoundingClientRect();const nx=Math.floor(p.x/r.width*15),ny=Math.floor(p.y/r.height*18);coverage.add(nx+':'+ny);bar.style.width=Math.min(100,Math.round(coverage.size/100*100))+'%'}last=p}
paper.addEventListener('pointerdown',e=>{if(e.target.closest('button')||phase==='done')return;e.preventDefault();if(phase==='trace'){autoTrace();return}if(phase!=='paint')return;active=true;paper.setPointerCapture(e.pointerId);const p=getPoint(e);last=p;drawStroke({a:p,b:p,color:colors[selected]});showMarker(p.x,p.y);coverage.add(Math.floor(p.x/paper.clientWidth*15)+':'+Math.floor(p.y/paper.clientHeight*18))});
paper.addEventListener('pointermove',e=>{if(active){e.preventDefault();paintMove(e)}});
const end=()=>{active=false;last=null;hideMarker()};paper.addEventListener('pointerup',end);paper.addEventListener('pointercancel',end);paper.addEventListener('lostpointercapture',end);
function complete(){if(phase!=='paint')return;if(strokeHistory.length<8){hint.textContent='Մի փոքր էլ ներկի՛ր նկարը 🎨';return}phase='done';hideMarker();overlay.classList.add('visible');for(let i=0;i<13;i++){const sp=document.createElement('span');sp.className='spark';sp.textContent=i%2?'✦':'⭐';sp.style.left='50%';sp.style.top='48%';sp.style.setProperty('--dx',((Math.random()-.5)*280)+'px');sp.style.setProperty('--dy',((Math.random()-.5)*360)+'px');overlay.append(sp);setTimeout(()=>sp.remove(),1000)}}
$('next').addEventListener('click',()=>{index=(index+1)%drawings.length;start()});
$('back').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'areg-paint-back'},location.origin);else history.back()});
addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type!=='areg-paint-theme')return;const {colors:cs,photo,blur}=e.data;const bg=$('theme');if(photo){bg.style.backgroundImage='url('+JSON.stringify(photo)+')';bg.style.filter='blur('+Math.min(20,Math.max(0,Number(blur)||0))+'px)'}else if(Array.isArray(cs)&&cs.length>=3){bg.style.backgroundImage='linear-gradient(150deg,'+cs.slice(0,3).join(',')+')';bg.style.filter='none'}});
let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fit,100)}).observe(paper);
start();
})();
</script></body></html>
