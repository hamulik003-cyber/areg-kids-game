 if(Math.hypot(p.cx-p.tx,p.cy-p.ty)<Math.max(35,Math.min(p.w,p.h)*.55)){
  p.cx=p.tx;p.cy=p.ty;p.locked=true;
  for(let i=0;i<18;i++)particles.push({x:p.tx,y:p.ty,vx:rand(-3,3),vy:rand(-4,1),life:1});
  const placed=pieces.filter(q=>q.locked).length;
  $('status').textContent='Փուլ '+(round+1)+'/5 · '+placed+'/'+count+' կտոր';
  if(placed===count){
   won=true;celebrationStart=performance.now()+320;stars+=5;
   if(!embedded){const saved=Number(localStorage.getItem(STAR_STORAGE_KEY)||0);setHeaderStars(saved+stars)}
   if(embedded)parent.postMessage({type:'areg-jigsaw-earned',amount:5},location.origin);
   $('status').textContent='✨ '+names[image]+'ը կենդանացավ ✨';
   winTimer=setTimeout(()=>{if(won)$('modal').classList.add('show')},3600)
  }
 }else{p.cx=p.homeX;p.cy=p.homeY}
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',e=>{
 if(drag&&e.pointerId===activePointer){drag.cx=drag.homeX;drag.cy=drag.homeY;drag=null;activePointer=null}
 if(e.pointerId===scrollPointer){scrollPointer=null;scrollMoved=false;gesturePiece=null}
});
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=12;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('selected',x===b));build()});$('next').onclick=()=>{round=(round+1)%5;image=imgs.findIndex((im,j)=>j>=round%imgs.length&&im.complete&&im.naturalWidth>0);if(image<0)image=imgs.findIndex(im=>im&&im.complete&&im.naturalWidth>0);build()};
let loaded=0;assets.forEach((src,i)=>{const im=new Image();im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';image=i;resize();build()}};im.onerror=()=>{loaded++;if(loaded===assets.length&&!ready)$('loading').textContent='Կենդանիների նկարները չբեռնվեցին';};im.src=src;imgs[i]=im});$('jigsawBack').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(embedded){parent.postMessage({type:'areg-jigsaw-back'},'*')}else{location.href='index.html'}});resize();
})();
</script></body></html>
