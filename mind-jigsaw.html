<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AREG — Դասական փազլ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif}body{background:radial-gradient(ellipse at 50% 36%,#14508d,#082f69 53%,#061c41);color:#fff5d8}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.sub{position:absolute;top:calc(env(safe-area-inset-top) + 71px);left:15px;right:15px;text-align:center;color:#fff4d3;font-weight:800;text-shadow:0 2px 6px #132f44;pointer-events:none}.footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:10px;right:10px;display:flex;justify-content:center;align-items:center;gap:9px;z-index:2}.action{font:900 15px system-ui;border:2px solid #e9c48a;border-radius:13px;background:linear-gradient(#f6d9a1,#c8874b);box-shadow:0 4px #754726;color:#65391e;padding:10px 15px}.action.selected{background:linear-gradient(#7fe4b0,#38a97a);box-shadow:0 4px #226c52;color:#fff}.modal{position:absolute;inset:0;background:#081d30b8;z-index:4;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(360px,100%);background:linear-gradient(#fff3d1,#e6bb83);border:6px solid #a36a3e;border-radius:25px;box-shadow:0 20px 50px #061d2bb0;padding:22px;text-align:center;color:#774321}.dialog h2{margin:5px 0 12px}.dialog button{width:100%;background:linear-gradient(#73df9b,#299d60);border:2px solid #e8ffdf;border-radius:15px;color:white;font-size:19px;font-weight:900;padding:14px;box-shadow:0 5px #227345}.loading{position:absolute;inset:35% 20%;text-align:center;font-weight:900}
/* Independent clean header matching the approved 'Գտիր զույգը' reference */
.top{display:grid;grid-template-columns:58px minmax(0,1fr) 100px;gap:10px;align-items:center;position:absolute;z-index:8;left:clamp(10px,3vw,22px);right:clamp(10px,3vw,22px);top:calc(clamp(8px,2.4vh,20px) + 9px)}
.top .wood{box-sizing:border-box;margin:0;padding:0;border:3px solid #d3a16d;border-bottom:6px solid #965027;border-radius:19px;background:linear-gradient(180deg,#ffe1ab 0%,#f9c98e 52%,#f2b474 100%);box-shadow:inset 0 2px 1px #fff5d6,0 5px 12px rgba(58,24,6,.16);color:#542718;text-shadow:none;font-family:system-ui,-apple-system,sans-serif;font-weight:950}
.top .back{height:57px;display:grid;place-items:center;font-size:32px;line-height:1;cursor:pointer}
.top .heading{height:60px;min-width:0;display:grid;place-items:center;overflow:hidden;white-space:nowrap;font-size:clamp(13px,3.6vw,21px);line-height:1.12;text-align:center}

</style></head><body><canvas id="game"></canvas><header class="top"><button class="wood back" id="jigsawBack" aria-label="Հետ">←</button><div class="wood heading">Հավաքիր պատկերը</div><div class="wood stars" id="stars">⭐ 0</div></header><div class="sub" id="status">1 / 5　🟡 ⚪ ⚪ ⚪ ⚪</div><div class="modal" id="modal"><div class="dialog"><div style="font-size:64px">🏆</div><h2>Ապրե՜ս, հավաքեցիր նկարը</h2><p>⭐ +5 աստղ</p><button id="next">Շարունակել</button></div></div><div class="loading" id="loading">Բեռնվում է փազլը…</div><script>
(()=>{'use strict';const embedded=new URLSearchParams(location.search).has('embed');if(embedded)document.documentElement.classList.add('embedded');const cv=document.getElementById('game'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1,count=4,round=0,stars=0,board={},panel={},tray={},pieces=[],drag=null,imgs=[],ready=false,particles=[],won=false,activePointer=null,celebrationStart=0,winTimer=null;const assets=['animal-dog.jpg','animal-cat.jpg','animal-rabbit.jpg','animal-lion.jpg','animal-deer.jpg'];const names=['Շնիկ','Կատու','Նապաստակ','Առյուծ','Եղնիկ'];let image=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);const ease=t=>1-Math.pow(1-t,3);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layout()}addEventListener('resize',resize);
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grad(x,y,w,h,colors){const g=ctx.createLinearGradient(x,y,x+w*.3,y+h);colors.forEach((c,i)=>g.addColorStop(i/(colors.length-1),c));return g}
function bluePanel(x,y,w,h,r){ctx.save();ctx.shadowColor='#00142c';ctx.shadowBlur=24;ctx.shadowOffsetY=13;rounded(x,y,w,h,r);ctx.fillStyle='#173d8b';ctx.fill();ctx.restore();rounded(x+3,y+3,w-6,h-6,r-3);ctx.fillStyle=grad(x,y,w,h,['#398ff7','#175ac4','#17418f']);ctx.fill();rounded(x+9,y+9,w-18,h-18,r-8);ctx.fillStyle=grad(x,y,w,h,['#4dafff','#1b62d0','#0b367f']);ctx.fill();rounded(x+15,y+15,w-30,h-30,r-13);ctx.fillStyle='#051d48';ctx.fill();ctx.strokeStyle='#80c6ff';ctx.lineWidth=2.5;ctx.stroke();rounded(x+21,y+21,w-42,h-42,r-17);ctx.fillStyle=grad(x,y,w,h,['#081e49','#092d62','#041735']);ctx.fill();ctx.restore()}
function frame(x,y,w,h){bluePanel(panel.x,panel.y,panel.w,panel.h,33);bluePanel(tray.x,tray.y,tray.w,tray.h,27);ctx.save();ctx.shadowColor='#010c24';ctx.shadowBlur=16;ctx.shadowOffsetY=8;rounded(x-11,y-11,w+22,h+22,22);ctx.fillStyle='#a96636';ctx.fill();ctx.restore();rounded(x-10,y-10,w+20,h+20,22);ctx.fillStyle=grad(x-10,y-10,w+20,h+20,['#ffdb91','#d58b46','#ffca78']);ctx.fill();rounded(x-4,y-4,w+8,h+8,13);ctx.fillStyle='#765033';ctx.fill();rounded(x,y,w,h,10);ctx.fillStyle='#d6bd99';ctx.fill();ctx.save();ctx.globalAlpha=.15;ctx.drawImage(imgs[image],x,y,w,h);ctx.restore();rounded(x,y,w,h,10);ctx.lineWidth=2;ctx.strokeStyle='#fff1c4';ctx.stroke();ctx.textAlign='center';ctx.font='800 13px system-ui';ctx.fillStyle='#ffe1a2';void 0}
function shape(p,offX=0,offY=0){const x=p.x+offX,y=p.y+offY,w=p.w,h=p.h,t=Math.min(w,h)*.18;ctx.beginPath();ctx.moveTo(x,y);function edge(x1,y1,x2,y2,type){const dx=x2-x1,dy=y2-y1,px=-dy,py=dx;if(!type){ctx.lineTo(x2,y2);return}const sign=type;const at=(u,v)=>[x1+dx*u+px*v*sign,y1+dy*u+py*v*sign];let a=at(.32,0);ctx.lineTo(...a);let b=at(.34,-.08),c=at(.30,.2),d=at(.40,.25);ctx.bezierCurveTo(...b,...c,...d);a=at(.5,.38);b=at(.6,.25);ctx.bezierCurveTo(...a,...a,...b);a=at(.70,.2);b=at(.66,-.08);c=at(.68,0);ctx.bezierCurveTo(...a,...b,...c);ctx.lineTo(x2,y2)}
edge(x,y,x+w,y,p.top);edge(x+w,y,x+w,y+h,p.right);edge(x+w,y+h,x,y+h,p.bottom);edge(x,y+h,x,y,p.left);ctx.closePath()}
function drawPiece(p){const scale=p.locked?1:p===drag?1:p.scale;ctx.save();ctx.translate(p.cx,p.cy);ctx.scale(scale,scale);const x=-p.w/2,y=-p.h/2,draw={...p,x,y};ctx.save();ctx.shadowColor='#000d2dbb';ctx.shadowBlur=p.locked?3:13;ctx.shadowOffsetY=p.locked?2:10;shape(draw,0,7);ctx.fillStyle='#67412c';ctx.fill();ctx.restore();shape(draw,0,5);ctx.fillStyle=grad(x,y,p.w,p.h,['#ffdf9c','#b97940','#6b422e']);ctx.fill();shape(draw);ctx.save();ctx.clip();ctx.drawImage(imgs[image],x-p.col*p.w,y-p.row*p.h,board.w,board.h);ctx.restore();shape(draw);ctx.lineWidth=p.locked?1.4:2.5;ctx.strokeStyle='#fff3d7';ctx.stroke();ctx.restore()}
function layout(){const cols=count===4?2:3,rows=count/cols;const top=embedded?Math.max(132,H*.155):Math.max(112,H*.133),bottom=Math.max(38,H*.045);const gap=Math.max(18,Math.min(34,H*.034));const side=Math.max(12,W*.045);const trayH=clamp(H*.125,92,155);const mainH=Math.max(230,H-top-bottom-gap-trayH);panel={x:side,y:top,w:W-2*side,h:mainH};tray={x:side,y:top+mainH+gap,w:W-2*side,h:trayH};const inset=27;const bw=Math.max(80,panel.w-inset*2),bh=Math.max(80,panel.h-inset*2);board={x:panel.x+inset,y:panel.y+inset,w:bw,h:bh,cols,rows};if(pieces.length){const pw=bw/cols,ph=bh/rows;for(const p of pieces){p.w=pw;p.h=ph;p.tx=board.x+(p.col+.5)*pw;p.ty=board.y+(p.row+.5)*ph;if(p.locked){p.cx=p.tx;p.cy=p.ty}else if(p!==drag){p.cx=p.homeX;p.cy=p.homeY}}}}
function build(){if(winTimer){clearTimeout(winTimer);winTimer=null}celebrationStart=0;won=false;drag=null;activePointer=null;$('modal').classList.remove('show');pieces=[];layout();const cols=board.cols,rows=board.rows,pw=board.w/cols,ph=board.h/rows;const grid=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const id=r*cols+c;grid.push({id,row:r,col:c,left:c?-grid[id-1].right:0,top:r?-grid[id-cols].bottom:0,right:c===cols-1?0:Math.random()<.5?1:-1,bottom:r===rows-1?0:Math.random()<.5?1:-1})}const ncols=count===9?5:count===6?3:4,nrows=Math.ceil(count/ncols);const usableW=tray.w-48,usableH=tray.h-18;const sc=Math.min(.49,(usableW/ncols)/pw*.56,(usableH/nrows)/ph*.54);const gapX=usableW/ncols,gapY=usableH/nrows;const order=grid.map((g,i)=>({...g,sort:Math.random()})).sort((a,b)=>a.sort-b.sort);for(let i=0;i<count;i++){const g=order[i],col=i%ncols,row=Math.floor(i/ncols);const hx=tray.x+tray.w/2+(col-(ncols-1)/2)*gapX,hy=tray.y+tray.h/2+(row-(nrows-1)/2)*gapY+3;pieces.push({...g,w:pw,h:ph,tx:board.x+(g.col+.5)*pw,ty:board.y+(g.row+.5)*ph,cx:hx,cy:hy,homeX:hx,homeY:hy,scale:sc,locked:false})}$('status').textContent=(round+1)+' / 5　'+[0,1,2,3,4].map(i=>i===round?'🟡':'⚪').join(' ');}
function drawBg(time){const t=time*.0003;for(let i=0;i<24;i++){const x=(i*87.43+Math.sin(t+i)*12)%W,y=(i*143.7+Math.cos(t+i*.8)*8)%H;ctx.beginPath();ctx.arc(x,y,i%4===0?2.5:1.3,0,7);ctx.fillStyle='rgba(255,224,152,'+(.13+.14*Math.sin(t+i)) +')';ctx.fill()}const a=grad(0,H*.6,W,H*.4,['#0b3674','#061d48']);ctx.fillStyle=a;rounded(0,H*.84,W,H*.2,0);ctx.fill();}
function drawLivingPicture(){ctx.save();rounded(board.x,board.y,board.w,board.h,9);ctx.clip();ctx.drawImage(imgs[image],board.x,board.y,board.w,board.h);ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);drawBg(t);if(ready){frame(board.x,board.y,board.w,board.h);for(let r=1;r<board.rows;r++){ctx.strokeStyle='#8c795d6b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(board.x,board.y+r*board.h/board.rows);ctx.lineTo(board.x+board.w,board.y+r*board.h/board.rows);ctx.stroke()}for(let c=1;c<board.cols;c++){ctx.beginPath();ctx.moveTo(board.x+c*board.w/board.cols,board.y);ctx.lineTo(board.x+c*board.w/board.cols,board.y+board.h);ctx.stroke()}if(won&&celebrationStart){drawLivingPicture(t)}else{pieces.filter(p=>p.locked).forEach(drawPiece);pieces.filter(p=>!p.locked&&p!==drag).forEach(drawPiece);if(drag)drawPiece(drag)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.018;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffdf76';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.life)*3,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.addEventListener('pointerdown',e=>{if(!ready||won||drag)return;const v=pos(e);for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(p.locked)continue;const scale=p.scale;if(Math.abs(v.x-p.homeX)<p.w*scale*.52+7&&Math.abs(v.y-p.homeY)<p.h*scale*.52+7){drag=p;activePointer=e.pointerId;drag.ox=v.x-p.cx;drag.oy=v.y-p.cy;cv.setPointerCapture(e.pointerId);break}}});cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==activePointer)return;const v=pos(e);drag.cx=clamp(v.x-drag.ox,drag.w*.35,W-drag.w*.35);drag.cy=clamp(v.y-drag.oy,130,H-75)});function release(e){if(!drag||e.pointerId!==activePointer)return;const p=drag;drag=null;activePointer=null;if(Math.hypot(p.cx-p.tx,p.cy-p.ty)<Math.max(35,Math.min(p.w,p.h)*.55)){p.cx=p.tx;p.cy=p.ty;p.locked=true;for(let i=0;i<18;i++)particles.push({x:p.tx,y:p.ty,vx:rand(-3,3),vy:rand(-4,1),life:1});const placed=pieces.filter(q=>q.locked).length;if(placed===count){won=true;celebrationStart=performance.now()+320;stars+=5;$('stars').textContent='⭐ '+stars;if(embedded)parent.postMessage({type:'areg-jigsaw-earned',amount:5},location.origin);$('status').textContent='✨ '+names[image]+'ը կենդանացավ ✨';winTimer=setTimeout(()=>{if(won)$('modal').classList.add('show')},3600)}}else{p.cx=p.homeX;p.cy=p.homeY}}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===activePointer){drag.cx=drag.homeX;drag.cy=drag.homeY;drag=null;activePointer=null}});
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('selected',x===b));build()});$('next').onclick=()=>{round=(round+1)%5;image=imgs.findIndex((im,j)=>j>=round%imgs.length&&im.complete&&im.naturalWidth>0);if(image<0)image=imgs.findIndex(im=>im&&im.complete&&im.naturalWidth>0);build()};
let loaded=0;assets.forEach((src,i)=>{const im=new Image();im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';image=i;resize();build()}};im.onerror=()=>{loaded++;if(loaded===assets.length&&!ready)$('loading').textContent='Կենդանիների նկարները չբեռնվեցին';};im.src=src;imgs[i]=im});$('jigsawBack').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(embedded){parent.postMessage({type:'areg-jigsaw-back'},'*')}else{location.href='index.html'}});resize();
})();
</script></body></html>
