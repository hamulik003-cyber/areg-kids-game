<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>AREG — Նոր փազլ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Armenian",Arial,sans-serif;color:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}body{background:radial-gradient(ellipse at 45% 12%,#476c9b 0%,#182b4b 45%,#091326 100%)}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:grid;grid-template-columns:55px 1fr 91px;gap:9px;z-index:3;align-items:center}.chip{border:1px solid #b6e6ff66;background:linear-gradient(155deg,#3d648d,#1b345d);box-shadow:inset 0 2px #ffffff40,0 7px 16px #050c20a0;border-radius:18px;color:#fff;font-weight:900;text-shadow:0 2px 2px #071129;padding:10px 4px;min-height:53px;text-align:center}.top button{font-size:31px}.top .heading{font-size:clamp(16px,4vw,23px);display:grid;place-items:center}.top .stars{font-size:19px;display:grid;place-items:center}
.progress{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 92px);left:16%;right:16%;height:46px;border-radius:26px;border:1px solid #b1e6ff88;background:linear-gradient(160deg,#244872,#152c50);box-shadow:0 8px 18px #02091d80,inset 0 1px #ffffff55;display:grid;place-items:center;font-size:clamp(14px,3.8vw,18px);font-weight:900}
#settingsGear{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 91px);z-index:4;font-size:25px;width:44px;height:44px;padding:0}
.nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);left:7%;right:7%;height:44px;pointer-events:none;z-index:3}
.modal{display:none;position:fixed;inset:0;background:#020b1cce;z-index:10;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{background:linear-gradient(160deg,#294f7a,#101f40);border:2px solid #a5d8ff;border-radius:26px;box-shadow:0 25px 60px #000b;max-width:390px;width:100%;padding:24px;text-align:center}.dialog h2{margin:0 0 18px}.dialog button,.dialog label{border:1px solid #b4e4ff;background:#4d78ad;color:white;border-radius:14px;padding:12px;font-size:17px;font-weight:800}.dialog button{cursor:pointer}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 22px}.choices button{padding:10px 0}.choices .selected{background:#f5a965;color:#16203b}.dialog label{display:block;margin-bottom:10px}#customPhoto{position:absolute;left:-10000px}#photoInfo{font-size:12px;opacity:.8}.loading{position:absolute;top:50%;left:0;right:0;text-align:center;font-weight:800}.embedded .nav{bottom:calc(env(safe-area-inset-bottom) + 25px)}#rewardBurst{position:fixed;inset:0;pointer-events:none;z-index:8}
</style></head><body><canvas id="game"></canvas>
<header class="top"><button id="jigsawBack" class="chip" aria-label="Հետ">←</button><div class="chip heading">Հավաքիր պատկերը</div><div class="chip stars" id="stars">⭐ 0</div></header>
<div id="status" class="progress">Փուլ 1/5 · 0/12 կտոր</div><button id="settingsGear" class="chip" aria-label="Կարգավորումներ">⚙</button>
<div class="nav" aria-hidden="true"></div>
<div class="modal" id="settingsModal"><div class="dialog"><h2>⚙ Կարգավորումներ</h2><strong>Կտորների քանակը</strong><div id="pieceChoices" class="choices"></div><label for="customPhoto">📷 Ընտրել սեփական նկար</label><input id="customPhoto" type="file" accept="image/*"><p id="photoInfo">Նկարը կմնա այս սարքում</p><button id="settingsClose">Խաղալ</button></div></div>
<div class="modal" id="modal"><div class="dialog"><div style="font-size:58px">🏆</div><h2 id="rewardTitle">Ապրե՜ս, հավաքեցիր նկարը</h2><p id="rewardAmount">⭐ +1 աստղ</p><button id="next">Շարունակել</button></div></div><div id="rewardBurst"></div><div id="loading" class="loading">Բեռնվում է փազլը…</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),embedded=new URLSearchParams(location.search).has('embed');if(embedded)document.documentElement.classList.add('embedded');
const assets=['animal-dog.jpg','animal-cat.jpg','animal-rabbit.jpg','animal-lion.jpg','animal-deer.jpg'],names=['Շնիկ','Կատու','Նապաստակ','Առյուծ','Եղնիկ'],imgs=[],KEY='areg-stars-v35';
let W=0,H=0,dpr=1,round=0,count=12,photo=0,custom=false,customURL=null,pieces=[],page=0,board={},tray={},active=null,press=null,swipe=null,pageMotion=null,ready=false,won=false,rewarded=false,animTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),rest=()=>pieces.filter(p=>!p.done);
function stars(n){$('stars').textContent='⭐ '+n}try{if(embedded)parent.postMessage({type:'areg-jigsaw-stars-request'},location.origin);else stars(Number(localStorage.getItem(KEY))||0)}catch(e){}
addEventListener('message',e=>{if(embedded&&e.source===parent&&e.origin===location.origin&&e.data?.type==='areg-jigsaw-stars-sync')stars(Number(e.data.stars)||0)});
function rect(x,y,w,h,r=15){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fill(x,y,w,h,c1,c2,r=15){const g=ctx.createLinearGradient(x,y,x+w*.18,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);rect(x,y,w,h,r);ctx.fillStyle=g;ctx.fill()}
function cover(img,x,y,w,h){if(!img||!img.naturalWidth)return;const sw=img.naturalWidth,sh=img.naturalHeight,s=Math.max(w/sw,h/sh),dw=w/s,dh=h/s;ctx.drawImage(img,(sw-dw)/2,(sh-dh)/2,dw,dh,x,y,w,h)}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);layout()}
function layout(){
 const canvasTop=canvas.getBoundingClientRect().top;
 const progressBottom=$('status').getBoundingClientRect().bottom-canvasTop;
 const top=Math.max(163,H*.212,progressBottom+42);
 const usableBottom=H-Math.max(28,H*.05);
 const freeHeight=Math.max(1,usableBottom-top);
 const preferredTrayH=clamp(freeHeight*.20,100,126);
 const boardTrayGap=clamp(freeHeight*.073,26,46);
 const designH=Math.max(H,760);
 const preferredBoardW=Math.min(W-28,(designH-Math.max(163,designH*.212)-Math.max(156,designH*.174)-30)*.87);
 const preferredBoardH=preferredBoardW/.87;
 const availableBoardH=Math.max(1,freeHeight-boardTrayGap-preferredTrayH);
 const scale=Math.min(1,availableBoardH/preferredBoardH);
 // Align the outer wooden board frame (14px overhang per side) with the tray frame.
 // Change only horizontal board size: keep the approved board height and both Y positions.
 const bw=W-64,bh=preferredBoardH*scale;
 board={x:(W-bw)/2,y:top,w:bw,h:bh};
 tray={x:18,y:top+bh+boardTrayGap,w:W-36,h:preferredTrayH};
 pieces.forEach(p=>{p.x=board.x+(p.c+.5)*board.w/p.cols;p.y=board.y+(p.r+.5)*board.h/p.rows;p.w=board.w/p.cols;p.h=board.h/p.rows})
}
// Real die-cut puzzle tabs: tapered neck, round bulb, and complementary sockets.
function shape(p,x,y){const w=p.w,h=p.h;ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);
 function edge(ax,ay,bx,by,k){const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);if(!k){ctx.lineTo(bx,by);return}
  const nx=-dy/len*k,ny=dx/len*k,depth=Math.min(w,h)*.235;
  const pt=(f,d)=>[ax+dx*f+nx*depth*d,ay+dy*f+ny*depth*d];
  ctx.lineTo(...pt(.285,0));
  ctx.bezierCurveTo(...pt(.355,0),...pt(.37,.035),...pt(.372,.19));
  ctx.bezierCurveTo(...pt(.375,.39),...pt(.315,.48),...pt(.325,.67));
  ctx.bezierCurveTo(...pt(.333,1.12),...pt(.667,1.12),...pt(.675,.67));
  ctx.bezierCurveTo(...pt(.685,.48),...pt(.625,.39),...pt(.628,.19));
  ctx.bezierCurveTo(...pt(.63,.035),...pt(.645,0),...pt(.715,0));
  ctx.lineTo(bx,by)
 }
 edge(x-w/2,y-h/2,x+w/2,y-h/2,p.top);
 edge(x+w/2,y-h/2,x+w/2,y+h/2,p.right);
 edge(x+w/2,y+h/2,x-w/2,y+h/2,p.bottom);
 edge(x-w/2,y+h/2,x-w/2,y-h/2,p.left);ctx.closePath()}
function tile(p,x,y,scale=1,raised=false){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 const ox=p.c*p.w,oy=p.r*p.h;
 ctx.save();ctx.translate(0,raised?7:4);shape(p,0,0);ctx.fillStyle='#061023';ctx.shadowColor='#000c';ctx.shadowBlur=raised?24:10;ctx.shadowOffsetY=raised?13:5;ctx.fill();ctx.restore();
 ctx.save();shape(p,0,0);ctx.clip();
 cover(imgs[photo],-p.w/2-ox,-p.h/2-oy,board.w,board.h);
 const sheen=ctx.createLinearGradient(-p.w/2,-p.h/2,p.w/2,p.h/2);sheen.addColorStop(0,'#ffffff4d');sheen.addColorStop(.3,'#ffffff08');sheen.addColorStop(.75,'#0000000d');sheen.addColorStop(1,'#00000035');ctx.fillStyle=sheen;ctx.fillRect(-p.w,-p.h,p.w*2,p.h*2);
 ctx.restore();shape(p,0,0);ctx.lineWidth=raised?3:2.3;ctx.strokeStyle=raised?'#fff3ca':'#e8e0d5';ctx.stroke();
 ctx.save();ctx.translate(0,-1.2);shape(p,0,0);ctx.lineWidth=1.1;ctx.strokeStyle='#ffffff85';ctx.stroke();ctx.restore();ctx.restore()
}
function build(){won=false;rewarded=false;page=0;pageMotion=null;active=null;press=null;swipe=null;const cols=count===4?2:count===12?3:count===16?4:count===20?4:6,rows=count/cols;pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){pieces.push({id:r*cols+c,r,c,rows,cols,done:false,left:c?0:0,top:r?0:0,right:c===cols-1?0:1,bottom:r===rows-1?0:1,scale:1})}for(const p of pieces){if(p.c) p.left=-pieces[p.id-1].right;if(p.r)p.top=-pieces[p.id-cols].bottom}pieces.sort(()=>Math.random()-.5);layout();update()}
function update(){$('status').textContent='Փուլ '+(round+1)+'/5 · '+pieces.filter(p=>p.done).length+'/'+count+' կտոր'}
function pageCount(){return Math.max(1,Math.ceil(rest().length/3))}
function setPage(n){page=clamp(n,0,pageCount()-1);pageMotion=null}
function easeSlide(p){const x=clamp(p,0,1);return 1-Math.pow(1-x,3)}
function animatePage(to,offset=0){
 const next=clamp(to,0,pageCount()-1);
 const extent=tray.w-38;
 pageMotion={from:page,to:next,start:performance.now(),duration:300,
  fromOffset:offset,toOffset:next===page?0:(next>page?-extent:extent)};
}
function pageSlideX(t){
 if(swipe&&!active)return swipe.dx;
 if(!pageMotion)return 0;
 const motion=pageMotion,p=(t-motion.start)/motion.duration;
 if(p>=1){page=motion.to;pageMotion=null;return 0}
 return motion.fromOffset+(motion.toOffset-motion.fromOffset)*easeSlide(p)
}
function drawTrayPage(pageIndex,offset,dt){
 const gap=(tray.w-38)/3,slot=gap-8,visible=rest().slice(pageIndex*3,pageIndex*3+3);
 visible.forEach((p,i)=>{
  const x=tray.x+19+gap*(i+.5)+offset,y=tray.y+tray.h/2;
  fill(x-slot/2,y-(tray.h-44)/2,slot,tray.h-44,'#3b6a86','#0b213e',12);
  ctx.save();rect(x-slot/2+1,y-(tray.h-44)/2+1,slot-2,tray.h-46,11);
  ctx.strokeStyle='#c5eaff55';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  if(p===active?.piece)return;
  if(p===press?.piece&&!swipe)p.lift=Math.min(1,(p.lift||0)+dt/150);
  else p.lift=Math.max(0,(p.lift||0)-dt/120);
  const sc=Math.min((slot-18)/(p.w*1.52),(tray.h-52)/(p.h*1.52),.78);
  tile(p,x,y,sc*(1+(p.lift||0)*.16),!!p.lift)
 })
}
function scene(t){const dt=Math.min(50,t-(animTime||t));animTime=t;ctx.clearRect(0,0,W,H);
let g=ctx.createRadialGradient(W*.4,H*.25,30,W*.5,H*.5,H);g.addColorStop(0,'#405d91');g.addColorStop(.55,'#172b50');g.addColorStop(1,'#080f25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<17;i++){ctx.beginPath();ctx.arc((i*97+23)%W,(i*139+17)%H,1.5+(i%3),0,7);ctx.fillStyle='#b1e6ff55';ctx.fill()}
ctx.save();ctx.shadowColor='#000e';ctx.shadowBlur=34;ctx.shadowOffsetY=21;fill(board.x-14,board.y-14,board.w+28,board.h+28,'#fce5ba','#7a4d3a',25);ctx.restore();fill(board.x-12,board.y-12,board.w+24,board.h+24,'#fff0ce','#b8794c',23);fill(board.x-7,board.y-7,board.w+14,board.h+14,'#5f92a8','#102d50',18);fill(board.x-3,board.y-3,board.w+6,board.h+6,'#172b49','#081628',13);ctx.save();rect(board.x,board.y,board.w,board.h,11);ctx.clip();ctx.globalAlpha=.31;cover(imgs[photo],board.x,board.y,board.w,board.h);ctx.restore();
for(const p of pieces){if(p.done)tile(p,p.x,p.y);else{ctx.save();shape(p,p.x,p.y);ctx.fillStyle='#0b1d3480';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#f7e2bdc7';ctx.stroke();ctx.restore()}}
ctx.save();ctx.shadowColor='#000c';ctx.shadowBlur=27;ctx.shadowOffsetY=13;fill(tray.x,tray.y,tray.w,tray.h,'#fbe0a8','#7c4d37',25);ctx.restore();fill(tray.x+5,tray.y+5,tray.w-10,tray.h-10,'#ffeac4','#ba7950',21);fill(tray.x+11,tray.y+11,tray.w-22,tray.h-22,'#24587b','#071a32',18);
const slideX=pageSlideX(t);
ctx.save();rect(tray.x+13,tray.y+13,tray.w-26,tray.h-26,14);ctx.clip();
drawTrayPage(page,slideX,dt);
const adjacent=slideX<-.5?page+1:slideX>.5?page-1:null;
if(adjacent!==null&&adjacent>=0&&adjacent<pageCount())drawTrayPage(adjacent,slideX+(adjacent>page?tray.w-38:-(tray.w-38)),dt);
ctx.restore();
if(active){const p=active.piece;tile(p,active.x,active.y,1,true)}
requestAnimationFrame(scene)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function inTray(v){return v.x>tray.x&&v.x<tray.x+tray.w&&v.y>tray.y&&v.y<tray.y+tray.h}
canvas.addEventListener('pointerdown',e=>{if(won||pageMotion)return;const v=point(e);if(!inTray(v))return;const gap=(tray.w-38)/3,i=Math.floor((v.x-(tray.x+19))/gap);const p=(i>=0&&i<3)?rest()[page*3+i]:null;press={piece:p||null,id:e.pointerId,start:v,at:performance.now()};swipe=null;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!press||e.pointerId!==press.id)return;const v=point(e),dx=v.x-press.start.x,dy=v.y-press.start.y;if(active){active.x=v.x;active.y=v.y;return}if(press.piece&&!swipe&&dy< -17&&Math.abs(dy)>Math.abs(dx)*.55){active={piece:press.piece,x:v.x,y:v.y};press.piece.lift=1}else if(!swipe&&Math.abs(dx)>15&&Math.abs(dx)>Math.abs(dy)*1.15){swipe={dx:0}}if(swipe){const next=page+(dx<0?1:-1),canTurn=next>=0&&next<pageCount();swipe.dx=clamp(dx*(canTurn?1:.22),-(tray.w-38),tray.w-38)}});
function finish(e,cancel=false){if(!press||e.pointerId!==press.id)return;const v=point(e);if(active){const p=active.piece;if(!cancel&&Math.hypot(v.x-p.x,v.y-p.y)<Math.max(32,p.w*.42)){p.done=true;setPage(page);update();if(rest().length===0){won=true;setTimeout(reward,900)}}else p.lift=0;active=null}else if(swipe){const dx=v.x-press.start.x,next=page+(dx<0?1:-1);const shouldTurn=!cancel&&Math.abs(dx)>38&&next>=0&&next<pageCount();animatePage(shouldTurn?next:page,swipe.dx)}press=null;swipe=null}
canvas.addEventListener('pointerup',e=>finish(e));canvas.addEventListener('pointercancel',e=>finish(e,true));canvas.addEventListener('lostpointercapture',e=>finish(e,true));
function reward(){if(rewarded)return;rewarded=true;$('modal').classList.add('show');$('rewardTitle').textContent='Ապրե՜ս, հավաքեցիր նկարը';$('rewardAmount').textContent='⭐ +1 աստղ';if(embedded){parent.postMessage({type:'areg-jigsaw-earned',amount:1},location.origin)}else{const n=(Number(localStorage.getItem(KEY))||0)+1;localStorage.setItem(KEY,n);stars(n)}}
$('next').onclick=()=>{round=(round+1)%5;if(!custom){photo=imgs[round]?.naturalWidth?round:imgs.findIndex(im=>im?.naturalWidth>0);if(photo<0)photo=round}build();$('modal').classList.remove('show')};
$('jigsawBack').onclick=()=>{if(embedded)parent.postMessage({type:'areg-jigsaw-back'},'*');else location.href='index.html'};
$('settingsGear').onclick=()=>$('settingsModal').classList.add('show');$('settingsClose').onclick=()=>$('settingsModal').classList.remove('show');
for(const n of [4,12,16,20,36]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{count=n;document.querySelectorAll('#pieceChoices button').forEach(x=>x.classList.toggle('selected',x===b));build()};if(n===12)b.classList.add('selected');$('pieceChoices').append(b)}
$('customPhoto').onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(customURL)URL.revokeObjectURL(customURL);customURL=url;imgs[5]=im;photo=5;custom=true;round=0;build();$('photoInfo').textContent='✓ '+f.name;$('settingsModal').classList.remove('show')};im.onerror=()=>URL.revokeObjectURL(url);im.src=url};
let loaded=0;assets.forEach((a,i)=>{const im=new Image();imgs[i]=im;im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';photo=i;build()}};im.onerror=()=>{loaded++;if(loaded===5&&!ready)$('loading').textContent='Նկարները չբեռնվեցին'};im.src=a});
addEventListener('resize',()=>{resize();setPage(page)});resize();requestAnimationFrame(scene);
})();
</script></body></html>
