<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>AREG — Նոր փազլ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Armenian",Arial,sans-serif;color:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}body{background:radial-gradient(ellipse at 45% 12%,#38568c 0%,#162444 45%,#09132a 100%)}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:grid;grid-template-columns:55px 1fr 91px;gap:9px;z-index:3;align-items:center}.chip{border:1px solid #b6e6ff66;background:linear-gradient(155deg,#3d648d,#1b345d);box-shadow:inset 0 2px #ffffff40,0 7px 16px #050c20a0;border-radius:18px;color:#fff;font-weight:900;text-shadow:0 2px 2px #071129;padding:10px 4px;min-height:53px;text-align:center}.top button{font-size:31px}.top .heading{font-size:clamp(16px,4vw,23px);display:grid;place-items:center}.top .stars{font-size:19px;display:grid;place-items:center}
.progress{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 92px);left:16%;right:16%;height:46px;border-radius:26px;border:1px solid #b1e6ff88;background:linear-gradient(160deg,#244872,#152c50);box-shadow:0 8px 18px #02091d80,inset 0 1px #ffffff55;display:grid;place-items:center;font-size:clamp(14px,3.8vw,18px);font-weight:900}
#settingsGear{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 91px);z-index:4;font-size:25px;width:44px;height:44px;padding:0}
.nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);left:7%;right:7%;display:flex;justify-content:space-between;pointer-events:none;z-index:3}.nav button{pointer-events:auto;border:1px solid #aee5ff99;background:#2c517d;color:#fff;border-radius:15px;width:47px;height:44px;font-size:28px;box-shadow:0 5px #071831}
.modal{display:none;position:fixed;inset:0;background:#020b1cce;z-index:10;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{background:linear-gradient(160deg,#294f7a,#101f40);border:2px solid #a5d8ff;border-radius:26px;box-shadow:0 25px 60px #000b;max-width:390px;width:100%;padding:24px;text-align:center}.dialog h2{margin:0 0 18px}.dialog button,.dialog label{border:1px solid #b4e4ff;background:#4d78ad;color:white;border-radius:14px;padding:12px;font-size:17px;font-weight:800}.dialog button{cursor:pointer}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 22px}.choices button{padding:10px 0}.choices .selected{background:#f5a965;color:#16203b}.dialog label{display:block;margin-bottom:10px}#customPhoto{position:absolute;left:-10000px}#photoInfo{font-size:12px;opacity:.8}.loading{position:absolute;top:50%;left:0;right:0;text-align:center;font-weight:800}.embedded .nav{bottom:calc(env(safe-area-inset-bottom) + 25px)}#rewardBurst{position:fixed;inset:0;pointer-events:none;z-index:8}
</style></head><body><canvas id="game"></canvas>
<header class="top"><button id="jigsawBack" class="chip" aria-label="Հետ">←</button><div class="chip heading">Հավաքիր պատկերը</div><div class="chip stars" id="stars">⭐ 0</div></header>
<div id="status" class="progress">Փուլ 1/5 · 0/12 կտոր</div><button id="settingsGear" class="chip" aria-label="Կարգավորումներ">⚙</button>
<div class="nav"><button id="prevPage" aria-label="Նախորդ կտորներ">‹</button><button id="nextPage" aria-label="Հաջորդ կտորներ">›</button></div>
<div class="modal" id="settingsModal"><div class="dialog"><h2>⚙ Կարգավորումներ</h2><strong>Կտորների քանակը</strong><div id="pieceChoices" class="choices"></div><label for="customPhoto">📷 Ընտրել սեփական նկար</label><input id="customPhoto" type="file" accept="image/*"><p id="photoInfo">Նկարը կմնա այս սարքում</p><button id="settingsClose">Խաղալ</button></div></div>
<div class="modal" id="modal"><div class="dialog"><div style="font-size:58px">🏆</div><h2 id="rewardTitle">Ապրե՜ս, հավաքեցիր նկարը</h2><p id="rewardAmount">⭐ +1 աստղ</p><button id="next">Շարունակել</button></div></div><div id="rewardBurst"></div><div id="loading" class="loading">Բեռնվում է փազլը…</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),embedded=new URLSearchParams(location.search).has('embed');if(embedded)document.documentElement.classList.add('embedded');
const assets=['animal-dog.jpg','animal-cat.jpg','animal-rabbit.jpg','animal-lion.jpg','animal-deer.jpg'],names=['Շնիկ','Կատու','Նապաստակ','Առյուծ','Եղնիկ'],imgs=[],KEY='areg-stars-v35';
let W=0,H=0,dpr=1,round=0,count=12,photo=0,custom=false,customURL=null,pieces=[],page=0,board={},tray={},active=null,press=null,swipe=null,ready=false,won=false,rewarded=false,animTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),rest=()=>pieces.filter(p=>!p.done);
function stars(n){$('stars').textContent='⭐ '+n}try{if(embedded)parent.postMessage({type:'areg-jigsaw-stars-request'},location.origin);else stars(Number(localStorage.getItem(KEY))||0)}catch(e){}
addEventListener('message',e=>{if(embedded&&e.source===parent&&e.origin===location.origin&&e.data?.type==='areg-jigsaw-stars-sync')stars(Number(e.data.stars)||0)});
function rect(x,y,w,h,r=15){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fill(x,y,w,h,c1,c2,r=15){const g=ctx.createLinearGradient(x,y,x+w*.18,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);rect(x,y,w,h,r);ctx.fillStyle=g;ctx.fill()}
function cover(img,x,y,w,h){if(!img||!img.naturalWidth)return;const sw=img.naturalWidth,sh=img.naturalHeight,s=Math.max(w/sw,h/sh),dw=w/s,dh=h/s;ctx.drawImage(img,(sw-dw)/2,(sh-dh)/2,dw,dh,x,y,w,h)}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);layout()}
function layout(){const top=Math.max(168,H*.245),bottom=Math.max(165,H*.185);let bw=Math.min(W-74,(H-top-bottom-34)*.75),bh=bw*4/3;if(top+bh+bottom+28>H){bh=H-top-bottom-28;bw=bh*.75}board={x:(W-bw)/2,y:top,w:bw,h:bh};tray={x:18,y:Math.min(H-bottom-10,top+bh+36),w:W-36,h:Math.max(110,bottom-30)};pieces.forEach(p=>{p.x=board.x+(p.c+.5)*board.w/p.cols;p.y=board.y+(p.r+.5)*board.h/p.rows;p.w=board.w/p.cols;p.h=board.h/p.rows})}
function shape(p,x,y){const w=p.w,h=p.h,t=Math.min(w,h)*.18;ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);function edge(ax,ay,bx,by,k){const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);if(!k){ctx.lineTo(bx,by);return}const nx=-dy/len*k,ny=dx/len*k,at=(f,d)=>[ax+dx*f+nx*d,ay+dy*f+ny*d];ctx.lineTo(...at(.32,0));ctx.bezierCurveTo(...at(.39,0),...at(.35,t),...at(.5,t));ctx.bezierCurveTo(...at(.65,t),...at(.61,0),...at(.68,0));ctx.lineTo(bx,by)}
edge(x-w/2,y-h/2,x+w/2,y-h/2,p.top);edge(x+w/2,y-h/2,x+w/2,y+h/2,p.right);edge(x+w/2,y+h/2,x-w/2,y+h/2,p.bottom);edge(x-w/2,y+h/2,x-w/2,y-h/2,p.left);ctx.closePath()}
function tile(p,x,y,scale=1,raised=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const ox=p.c*p.w,oy=p.r*p.h;ctx.shadowColor='#000b';ctx.shadowBlur=raised?23:9;ctx.shadowOffsetY=raised?14:5;shape(p,0,0);ctx.fillStyle='#0d1b36';ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.save();shape(p,0,0);ctx.clip();cover(imgs[photo],-ox-p.w/2,-oy-p.h/2,board.w,board.h);ctx.restore();shape(p,0,0);ctx.lineWidth=raised?3:2;ctx.strokeStyle=raised?'#fff5ce':'#e9f4ff';ctx.stroke();ctx.restore()}
function build(){won=false;rewarded=false;page=0;active=null;press=null;swipe=null;const cols=count===4?2:count===12?3:count===16?4:count===20?4:6,rows=count/cols;pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){pieces.push({id:r*cols+c,r,c,rows,cols,done:false,left:c?0:0,top:r?0:0,right:c===cols-1?0:1,bottom:r===rows-1?0:1,scale:1})}for(const p of pieces){if(p.c) p.left=-pieces[p.id-1].right;if(p.r)p.top=-pieces[p.id-cols].bottom}pieces.sort(()=>Math.random()-.5);layout();update()}
function update(){$('status').textContent='Փուլ '+(round+1)+'/5 · '+pieces.filter(p=>p.done).length+'/'+count+' կտոր'}
function pageCount(){return Math.max(1,Math.ceil(rest().length/3))}function setPage(n){page=clamp(n,0,pageCount()-1)}
function scene(t){const dt=Math.min(50,t-(animTime||t));animTime=t;ctx.clearRect(0,0,W,H);
let g=ctx.createRadialGradient(W*.4,H*.25,30,W*.5,H*.5,H);g.addColorStop(0,'#405d91');g.addColorStop(.55,'#172b50');g.addColorStop(1,'#080f25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<17;i++){ctx.beginPath();ctx.arc((i*97+23)%W,(i*139+17)%H,1.5+(i%3),0,7);ctx.fillStyle='#b1e6ff55';ctx.fill()}
ctx.save();ctx.shadowColor='#000c';ctx.shadowBlur=26;ctx.shadowOffsetY=16;fill(board.x-20,board.y-20,board.w+40,board.h+40,'#f2bf8a','#9a5272',28);ctx.restore();fill(board.x-14,board.y-14,board.w+28,board.h+28,'#ffdfaa','#a8676d',24);fill(board.x-7,board.y-7,board.w+14,board.h+14,'#162f59','#081b35',17);ctx.save();rect(board.x,board.y,board.w,board.h,11);ctx.clip();ctx.globalAlpha=.25;cover(imgs[photo],board.x,board.y,board.w,board.h);ctx.restore();
for(const p of pieces){if(p.done)tile(p,p.x,p.y);else{ctx.save();shape(p,p.x,p.y);ctx.fillStyle='#0e27475c';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#f5d7a3b0';ctx.stroke();ctx.restore()}}
ctx.save();ctx.shadowColor='#000b';ctx.shadowBlur=20;ctx.shadowOffsetY=10;fill(tray.x,tray.y,tray.w,tray.h,'#eeaa83','#8d5072',25);ctx.restore();fill(tray.x+6,tray.y+6,tray.w-12,tray.h-12,'#ffe3bd','#c18a9b',21);fill(tray.x+12,tray.y+12,tray.w-24,tray.h-24,'#1b416c','#0a1a37',18);
const gap=(tray.w-38)/3,visible=rest().slice(page*3,page*3+3);
visible.forEach((p,i)=>{const x=tray.x+19+gap*(i+.5),y=tray.y+tray.h/2,slot=gap-8;fill(x-slot/2,y-(tray.h-44)/2,slot,tray.h-44,'#31577c','#102a4d',12);if(p===active?.piece)return;if(p===press?.piece){p.lift=Math.min(1,(p.lift||0)+dt/150)}else p.lift=Math.max(0,(p.lift||0)-dt/120);const sc=Math.min((slot-12)/(p.w*1.35),(tray.h-48)/(p.h*1.4),.83);tile(p,x,y,sc*(1+(p.lift||0)*.16),!!p.lift)});
if(active){const p=active.piece;tile(p,active.x,active.y,1,true)}
requestAnimationFrame(scene)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function inTray(v){return v.x>tray.x&&v.x<tray.x+tray.w&&v.y>tray.y&&v.y<tray.y+tray.h}
canvas.addEventListener('pointerdown',e=>{if(won)return;const v=point(e);if(!inTray(v))return;const gap=(tray.w-38)/3,i=Math.floor((v.x-(tray.x+19))/gap);const p=rest()[page*3+clamp(i,0,2)];if(!p)return;press={piece:p,id:e.pointerId,start:v,at:performance.now()};swipe=null;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!press||e.pointerId!==press.id)return;const v=point(e),dx=v.x-press.start.x,dy=v.y-press.start.y;if(active){active.x=v.x;active.y=v.y;return}if(!swipe&&dy< -17&&Math.abs(dy)>Math.abs(dx)*.55){active={piece:press.piece,x:v.x,y:v.y};press.piece.lift=1}else if(!swipe&&Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)*1.3){swipe={dx}}if(swipe)swipe.dx=dx});
function finish(e,cancel=false){if(!press||e.pointerId!==press.id)return;const v=point(e);if(active){const p=active.piece;if(!cancel&&Math.hypot(v.x-p.x,v.y-p.y)<Math.max(32,p.w*.42)){p.done=true;setPage(page);update();if(rest().length===0){won=true;setTimeout(reward,900)}}else p.lift=0;active=null}else if(swipe&&!cancel&&Math.abs(swipe.dx)>38){setPage(page+(swipe.dx<0?1:-1))}press=null;swipe=null}
canvas.addEventListener('pointerup',e=>finish(e));canvas.addEventListener('pointercancel',e=>finish(e,true));canvas.addEventListener('lostpointercapture',e=>finish(e,true));
$('prevPage').onclick=()=>setPage(page-1);$('nextPage').onclick=()=>setPage(page+1);
function reward(){if(rewarded)return;rewarded=true;$('modal').classList.add('show');$('rewardTitle').textContent='Ապրե՜ս, հավաքեցիր նկարը';$('rewardAmount').textContent='⭐ +1 աստղ';if(embedded){parent.postMessage({type:'areg-jigsaw-reward',stars:1},location.origin)}else{const n=(Number(localStorage.getItem(KEY))||0)+1;localStorage.setItem(KEY,n);stars(n)}}
$('next').onclick=()=>{round=(round+1)%5;if(!custom)photo=round;build();$('modal').classList.remove('show')};
$('jigsawBack').onclick=()=>{if(embedded)parent.postMessage({type:'areg-jigsaw-back'},'*');else location.href='index.html'};
$('settingsGear').onclick=()=>$('settingsModal').classList.add('show');$('settingsClose').onclick=()=>$('settingsModal').classList.remove('show');
for(const n of [4,12,16,20,36]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{count=n;document.querySelectorAll('#pieceChoices button').forEach(x=>x.classList.toggle('selected',x===b));build()};if(n===12)b.classList.add('selected');$('pieceChoices').append(b)}
$('customPhoto').onchange=e=>{const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(customURL)URL.revokeObjectURL(customURL);customURL=url;imgs[5]=im;photo=5;custom=true;round=0;build();$('photoInfo').textContent='✓ '+f.name;$('settingsModal').classList.remove('show')};im.onerror=()=>URL.revokeObjectURL(url);im.src=url};
let loaded=0;assets.forEach((a,i)=>{const im=new Image();imgs[i]=im;im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';photo=i;build()}};im.onerror=()=>{loaded++;if(loaded===5&&!ready)$('loading').textContent='Նկարները չբեռնվեցին'};im.src=a});
addEventListener('resize',()=>{resize();setPage(page)});resize();requestAnimationFrame(scene);
})();
</script></body></html>
