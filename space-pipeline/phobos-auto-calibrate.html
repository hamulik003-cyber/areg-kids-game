<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHOBOS_CALIBRATING</title>
<style>
html,body{margin:0;background:#050914;color:#fff;font:14px system-ui,sans-serif}
main{width:1540px;margin:20px auto}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
h1{margin:0;font-size:28px} small{color:#9bb1db}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.proof{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.card{background:#0b1326;border:1px solid #263856;border-radius:18px;padding:12px}
.card h2{font-size:13px;margin:0 0 8px;color:#bfd0ef}
.card img,.card canvas{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#020612;border-radius:12px}
pre{white-space:pre-wrap;background:#091021;border:1px solid #263856;border-radius:14px;padding:14px;margin-top:16px;color:#cfe0ff}
</style>
</head>
<body>
<main>
<header><div><small>SPACE ASSET PIPELINE V3</small><h1>Phobos · irregular geometry calibration</h1></div><strong id="summary">running…</strong></header>
<section class="top">
  <article class="card"><h2>MASTER REFERENCE · 11-phobos.jpg</h2><img id="refView" src="../11-phobos.jpg" alt=""></article>
  <article class="card"><h2>CALIBRATED 3D</h2><canvas id="view3d" width="320" height="320"></canvas></article>
  <article class="card"><h2>50% OVERLAY</h2><canvas id="overlay" width="320" height="320"></canvas></article>
</section>
<section class="proof">
  <article class="card"><h2>0° FRONT</h2><canvas data-proof="0" width="280" height="280"></canvas></article>
  <article class="card"><h2>90°</h2><canvas data-proof="90" width="280" height="280"></canvas></article>
  <article class="card"><h2>180°</h2><canvas data-proof="180" width="280" height="280"></canvas></article>
  <article class="card"><h2>270°</h2><canvas data-proof="270" width="280" height="280"></canvas></article>
  <article class="card"><h2>360° = FRONT</h2><canvas data-proof="360" width="280" height="280"></canvas></article>
</section>
<pre id="result">{"status":"running"}</pre>
</main>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';

const N=320,BASE_Y=-90,BASE_ROLL=-2,SHAPE={x:1.18,y:.96,z:.86,deform:.125,seed:.45};
const resultEl=document.getElementById('result'),summary=document.getElementById('summary');
const refImg=document.getElementById('refView'),viewCanvas=document.getElementById('view3d'),overlayCanvas=document.getElementById('overlay');

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function waitImage(img){return new Promise((resolve,reject)=>{if(img.complete&&img.naturalWidth){resolve();return}img.onload=resolve;img.onerror=reject})}
function drawContain(ctx,img,w,h){ctx.clearRect(0,0,w,h);ctx.fillStyle='#020612';ctx.fillRect(0,0,w,h);const s=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*s,dh=img.naturalHeight*s;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
function dist3(r,g,b,bg){const dr=r-bg[0],dg=g-bg[1],db=b-bg[2];return Math.sqrt(dr*dr+dg*dg+db*db)}
function bgOf(data){const pts=[],k=22;for(const [x0,y0] of [[0,0],[N-k,0],[0,N-k],[N-k,N-k]])for(let y=y0;y<y0+k;y+=2)for(let x=x0;x<x0+k;x+=2){const i=(y*N+x)*4;pts.push([data[i],data[i+1],data[i+2]])}return [0,1,2].map(c=>Math.round(pts.reduce((s,p)=>s+p[c],0)/pts.length))}
function bboxOf(data,bg){let minX=N,minY=N,maxX=-1,maxY=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y*N+x)*4;if(dist3(data[i],data[i+1],data[i+2],bg)>26){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}return maxX>=0?{minX,minY,maxX,maxY,w:maxX-minX+1,h:maxY-minY+1}:{minX:0,minY:0,maxX:N-1,maxY:N-1,w:N,h:N}}
function metric(ref,ren,bg){
  let sum=0,count=0;
  for(let y=6;y<N-6;y+=3)for(let x=6;x<N-6;x+=3){
    const i=(y*N+x)*4,rd=dist3(ref[i],ref[i+1],ref[i+2],bg),ad=dist3(ren[i],ren[i+1],ren[i+2],bg);
    const rm=rd>26?1:0,am=ad>26?1:0;
    let e=Math.abs(rm-am)*2.1;
    if(rm&&am){
      const rs=ref[i]+ref[i+1]+ref[i+2]+1,as=ren[i]+ren[i+1]+ren[i+2]+1;
      e+=Math.abs(ref[i]/rs-ren[i]/as)+Math.abs(ref[i+1]/rs-ren[i+1]/as)+Math.abs(ref[i+2]/rs-ren[i+2]/as);
    }
    sum+=e;count++;
  }
  return sum/Math.max(1,count);
}
function buildGeometry(frontYawDeg){
  const geo=new THREE.SphereGeometry(1,128,96),p=geo.attributes.position,v=new THREE.Vector3();
  const yaw=THREE.MathUtils.degToRad(frontYawDeg),cy=Math.cos(yaw),sy=Math.sin(yaw),q=3.05;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i).normalize();
    const fx=v.x*cy+v.z*sy,fy=v.y,fz=-v.x*sy+v.z*cy;
    const denom=Math.pow(Math.pow(Math.abs(fx)/SHAPE.x,q)+Math.pow(Math.abs(fy)/SHAPE.y,q)+Math.pow(Math.abs(fz)/SHAPE.z,q),1/q);
    let r=1/Math.max(.0001,denom);
    const low=Math.sin(fx*2.20+fy*1.05+SHAPE.seed)*.40+Math.sin(fy*2.85-fz*1.65+SHAPE.seed*1.35)*.34+Math.cos(fz*2.15+fx*1.45-SHAPE.seed*.70)*.26;
    r*=1+SHAPE.deform*low;
    r*=1+.080*fx-.050*fy+.055*fx*fy-.035*fy*fy*fx+.032*fx*fz;
    const dot=fx*.48+fy*.03+fz*.876,t=clamp((dot-.80)/.20,0,1),bowl=Math.sin(t*Math.PI);
    r*=1-.105*bowl*bowl;
    const sx=fx*r,syf=fy*r,sz=fz*r,lx=sx*cy-sz*sy,lz=sx*sy+sz*cy;
    p.setXYZ(lx,syf,lz);
  }
  p.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere();return geo;
}

try{
  await waitImage(refImg);
  const refCanvas=document.createElement('canvas');refCanvas.width=refCanvas.height=N;
  const rctx=refCanvas.getContext('2d',{willReadFrequently:true});drawContain(rctx,refImg,N,N);
  const refData=rctx.getImageData(0,0,N,N).data,bg=bgOf(refData),refBox=bboxOf(refData,bg);

  const renderer=new THREE.WebGLRenderer({canvas:viewCanvas,antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);renderer.setSize(N,N,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(new THREE.Color(bg[0]/255,bg[1]/255,bg[2]/255),1);
  const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1.65,1.65,1.65,-1.65,.1,10);camera.position.set(0,0,4);
  const texture=await new THREE.TextureLoader().loadAsync('../assets/space3d/2k_phobos.jpg');texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=THREE.RepeatWrapping;
  const mesh=new THREE.Mesh(buildGeometry(BASE_Y),new THREE.MeshBasicMaterial({map:texture}));scene.add(mesh);
  const cctx=document.createElement('canvas').getContext('2d',{willReadFrequently:true});cctx.canvas.width=cctx.canvas.height=N;
  function renderAt(yaw,roll,scale){
    mesh.rotation.set(0,THREE.MathUtils.degToRad(yaw),THREE.MathUtils.degToRad(roll));mesh.scale.setScalar(scale);renderer.render(scene,camera);
    cctx.clearRect(0,0,N,N);cctx.drawImage(viewCanvas,0,0,N,N);return cctx.getImageData(0,0,N,N).data
  }
  const baseData=renderAt(BASE_Y,BASE_ROLL,1),baseBox=bboxOf(baseData,bg);
  const scale0=clamp(Math.sqrt((refBox.w/refBox.h)/(baseBox.w/baseBox.h))*((refBox.w+refBox.h)/(baseBox.w+baseBox.h)),.72,1.48);

  let best={yaw:BASE_Y,roll:BASE_ROLL,scale:scale0,score:Infinity};
  for(let yaw=BASE_Y-36;yaw<=BASE_Y+36;yaw+=4)for(let roll=BASE_ROLL-8;roll<=BASE_ROLL+8;roll+=2)for(const sf of [.94,1,1.06]){
    const scale=scale0*sf,score=metric(refData,renderAt(yaw,roll,scale),bg);
    if(score<best.score)best={yaw,roll,scale,score};
  }
  const coarse={...best};
  mesh.geometry.dispose();mesh.geometry=buildGeometry(coarse.yaw);
  best={...coarse,score:Infinity};
  for(let yaw=coarse.yaw-3;yaw<=coarse.yaw+3.001;yaw+=.5)for(let roll=coarse.roll-2;roll<=coarse.roll+2.001;roll+=.5)for(let ds=-.04;ds<=.0401;ds+=.01){
    const scale=coarse.scale*(1+ds),score=metric(refData,renderAt(yaw,roll,scale),bg);
    if(score<best.score)best={yaw,roll,scale,score};
  }
  mesh.geometry.dispose();mesh.geometry=buildGeometry(best.yaw);
  const finalData=renderAt(best.yaw,best.roll,best.scale);
  const octx=overlayCanvas.getContext('2d');octx.putImageData(new ImageData(new Uint8ClampedArray(finalData),N,N),0,0);octx.globalAlpha=.5;octx.drawImage(refCanvas,0,0,N,N);octx.globalAlpha=1;

  for(const canvas of document.querySelectorAll('canvas[data-proof]')){
    const rr=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});rr.setPixelRatio(1);rr.setSize(280,280,false);rr.outputColorSpace=THREE.SRGBColorSpace;rr.toneMapping=THREE.NoToneMapping;rr.setClearColor(0x020612,1);
    const ss=new THREE.Scene(),cc=new THREE.OrthographicCamera(-1.65,1.65,1.65,-1.65,.1,10);cc.position.set(0,0,4);
    const pp=new THREE.Mesh(buildGeometry(best.yaw),new THREE.MeshBasicMaterial({map:texture}));pp.scale.setScalar(best.scale);pp.rotation.set(0,THREE.MathUtils.degToRad(best.yaw+Number(canvas.dataset.proof)),THREE.MathUtils.degToRad(best.roll));ss.add(pp);rr.render(ss,cc);
  }

  const report={status:'ok',algorithm:'v4-phobos-irregular-silhouette-texture-match',measuredYawDeg:Number(best.yaw.toFixed(2)),measuredRollDeg:Number(best.roll.toFixed(2)),measuredScale:Number(best.scale.toFixed(4)),metricScore:Number(best.score.toFixed(6)),shape:SHAPE,texture:'assets/space3d/2k_phobos.jpg',reference:'11-phobos.jpg',approved:false};
  resultEl.textContent=JSON.stringify(report,null,2);summary.textContent='yaw '+report.measuredYawDeg+'° · roll '+report.measuredRollDeg+'° · scale '+report.measuredScale;document.title='PHOBOS_CALIBRATION_READY';
}catch(err){resultEl.textContent=JSON.stringify({status:'error',message:String(err&&err.stack||err)},null,2);document.title='PHOBOS_CALIBRATION_ERROR'}
</script>
</body>
</html>
