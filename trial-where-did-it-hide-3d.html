<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Որտե՞ղ թաքնվեց</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif}body{background:radial-gradient(ellipse at 52% 34%,#e8faff 0%,#8edbff 55%,#5dbbd8 100%);color:#654021}.head{position:absolute;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);left:9px;right:9px;display:grid;grid-template-columns:48px 1fr 65px;gap:7px}.wood{display:grid;place-items:center;min-height:47px;border-radius:15px;border:3px solid #b66b2c;background:linear-gradient(#fff1c5,#e9ae62);box-shadow:0 5px #8a4e25,inset 0 2px #fff9e9;font-weight:900}.wood a{color:inherit;text-decoration:none;font-size:29px}.title{font-size:clamp(15px,4.3vw,21px)}.scene{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 75px) 8px calc(env(safe-area-inset-bottom,0px) + 12px);border:5px solid #c1874d;border-radius:26px;box-shadow:0 12px 25px #47657d55,inset 0 0 0 3px #ffdf9b;overflow:hidden;background:linear-gradient(#92d9ff 0%,#e3f9ff 53%,#9de07c 53%,#4cad6c 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 8px 19px}.cloud{position:absolute;width:95px;height:28px;border-radius:50px;background:#ffffffab;top:16%;left:10%;box-shadow:24px -15px 0 5px #ffffffab,52px -4px 0 2px #ffffffab}.cloud.two{left:auto;right:5%;top:25%;transform:scale(.75)}.instruction{position:relative;z-index:5;width:min(95%,450px);text-align:center;border:3px solid #f2c277;background:#fff3cfe8;border-radius:18px;padding:10px 7px;font-size:clamp(15px,4.5vw,21px);font-weight:900;box-shadow:0 6px 14px #9e6e3a44}.sub{font-size:12px;font-weight:700;color:#9b653e;margin-top:3px}.playfield{position:relative;width:min(100%,480px);flex:1;min-height:230px;perspective:700px;perspective-origin:50% 35%;touch-action:manipulation}.floor{position:absolute;left:3%;right:3%;height:32%;bottom:7%;border-radius:50%;background:radial-gradient(ellipse,#e9bd76 0%,#cf8d53 67%,#ad6c43 100%);border:8px solid #f7d8a3;box-shadow:0 13px 0 #a96a43,0 21px 19px #5e723f66;transform:rotateX(60deg)}.slot{position:absolute;bottom:22%;width:30%;height:50%;left:35%;transform-style:preserve-3d;transition:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}.shadow{position:absolute;bottom:0;left:7%;width:86%;height:15%;border-radius:50%;background:#60492b5c;filter:blur(8px)}.box3d{position:absolute;left:10%;right:10%;bottom:5%;height:65%;transform-style:preserve-3d;transform:rotateX(-13deg) rotateY(-16deg);transition:transform .25s}.front{position:absolute;inset:0;border-radius:12px 12px 17px 17px;border:4px solid #ffffff77;background:linear-gradient(110deg,var(--light),var(--base) 48%,var(--dark));box-shadow:inset -10px -7px 16px #442b2540,0 9px 12px #423b2d45;transform:translateZ(18px)}.side{position:absolute;right:-13px;top:6px;height:93%;width:27px;background:var(--dark);transform:rotateY(75deg);border-radius:5px}.top{position:absolute;left:1%;right:1%;height:27px;top:-11px;border-radius:50%;background:linear-gradient(var(--light),var(--base));border:4px solid #fff7bd;transform:rotateX(65deg) translateZ(8px);box-shadow:0 3px 0 #724e3055}.lid{position:absolute;left:-4%;right:-4%;top:-16px;height:30px;border-radius:50%;background:linear-gradient(var(--light),var(--base));border:5px solid #ffefbb;box-shadow:0 5px 0 var(--dark);transform-origin:50% 50%;transition:transform .55s ease,top .55s ease;z-index:4}.slot.lift .lid{transform:translateY(-83px) rotate(-8deg)}.slot.lift .box3d{transform:rotateX(-13deg) rotateY(-16deg) translateY(10px)}.face{position:absolute;z-index:2;top:25%;left:0;right:0;text-align:center;font-size:clamp(23px,7vw,44px);filter:drop-shadow(0 2px #ffffff70);opacity:.8}.animal{position:absolute;z-index:3;bottom:22%;left:0;right:0;text-align:center;font-size:clamp(40px,13vw,80px);transform:translateY(10px) scale(.7);opacity:0;transition:transform .45s ease,opacity .4s}.slot.reveal .animal{opacity:1;transform:translateY(-64px) scale(1)}.slot.correct .box3d{animation:joy .55s ease-in-out 2}@keyframes joy{50%{transform:rotateX(-13deg) rotateY(-16deg) translateY(-18px)}}.controls{position:relative;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}.btn{border:3px solid #fff0b5;border-radius:16px;background:linear-gradient(#7fdf84,#2e9c51);box-shadow:0 5px #277443;color:white;font-size:17px;font-weight:900;padding:12px 17px;min-width:150px}.btn:disabled{opacity:.5}.btn:active{transform:translateY(4px);box-shadow:0 1px #277443}.small{background:linear-gradient(#ffc879,#eb903a);box-shadow:0 5px #ae612b;min-width:0}.progress{color:#fffdf2;font-weight:900;text-shadow:0 2px 3px #795333;text-align:center}.dots{display:flex;gap:8px;justify-content:center;margin-top:5px}.dots i{width:12px;height:12px;border-radius:50%;background:#fff9e0aa}.dots i.on{background:#ffd343}.spark{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:60px;z-index:9;pointer-events:none;display:none}.spark.show{display:block;animation:appear .8s both}@keyframes appear{0%{opacity:0;transform:translate(-50%,25px) scale(.4)}60%{opacity:1;transform:translate(-50%,-15px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-45px)}}@media(max-height:660px){.scene{padding:8px}.playfield{min-height:190px}.instruction{padding:5px}.slot{height:53%}.controls .btn{padding:7px 12px}.floor{bottom:4%}}
</style></head><body><header class="head"><div class="wood"><a href="index.html" aria-label="Հետ">←</a></div><div class="wood title">Որտե՞ղ թաքնվեց</div><div class="wood">⭐ <span id="stars">0</span></div></header><main class="scene"><div class="cloud"></div><div class="cloud two"></div><div class="instruction"><span id="instruction">Հիշիր՝ ո՞ր տուփի մեջ է նապաստակը։</span><div class="sub" id="sub">Նայիր ուշադիր, հետո հետևիր տուփերին։</div></div><div class="playfield" id="playfield"><div class="floor"></div><div class="spark" id="spark">🌟</div></div><div class="controls"><button class="btn" id="start">▶ Սկսել</button><button class="btn small" id="again">↻ Նորից</button></div><div class="progress">Փուլ <span id="round">1</span>/5<div class="dots" id="dots"></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),field=$('playfield');const palettes=[['#ff96b6','#f64d87','#c83266'],['#9de5ff','#36a8f3','#1877bb'],['#ffe994','#ffbc39','#d78320']];let round=1,stars=0,mode='idle',order=[0,1,2],target=0,boxes=[],busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function info(a,b){$('instruction').textContent=a;$('sub').textContent=b}function drawDots(){$('dots').innerHTML=Array.from({length:5},(_,i)=>'<i class="'+(i<round-1?'on':'')+'"></i>').join('');$('round').textContent=round;$('stars').textContent=stars}function place(box,slot,animate=false){const width=field.clientWidth;const x=(slot-1)*width*.325;const transform='translateX('+x+'px)';if(animate){return box.animate([{transform:box.style.transform||'translateX(0px)'},{transform}],{duration:round<=2?780:round===3?660:540,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'}).finished.then(()=>{box.style.transform=transform;box.getAnimations().forEach(a=>a.cancel())})}box.style.transform=transform;return Promise.resolve()}function create(){boxes.forEach(b=>b.remove());boxes=[];order=[0,1,2];palettes.forEach((p,i)=>{const b=document.createElement('div');b.className='slot';b.style.setProperty('--light',p[0]);b.style.setProperty('--base',p[1]);b.style.setProperty('--dark',p[2]);b.innerHTML='<div class="shadow"></div><div class="animal">🐰</div><div class="box3d"><div class="side"></div><div class="front"><div class="face">★</div></div><div class="top"></div><div class="lid"></div></div>';b.addEventListener('click',()=>choose(i));field.append(b);boxes.push(b);place(b,i)})}async function intro(){mode='watch';$('start').disabled=true;target=Math.floor(Math.random()*3);info('Տես՝ նապաստակը որտե՞ղ է։','Հիշիր նրա տուփը։');boxes[target].classList.add('lift','reveal');await sleep(1900);boxes[target].classList.remove('lift','reveal');await sleep(650);info('Հետևիր տուփերին։','Մի կորցրու նապաստակի տեղը։');await shuffle();mode='guess';info('Որտե՞ղ է նապաստակը։','Հպվիր ճիշտ տուփին։');$('start').disabled=false;$('start').textContent='👀 Ընտրիր տուփը'}async function shuffle(){const swaps=round===1?2:round===2?3:round===3?4:round===4?5:6;for(let k=0;k<swaps;k++){let a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;const i=order[a],j=order[b];await Promise.all([place(boxes[i],b,true),place(boxes[j],a,true)]);[order[a],order[b]]=[order[b],order[a]];await sleep(180)}}async function choose(i){if(mode!=='guess'||busy)return;busy=true;mode='answer';boxes[i].classList.add('lift');await sleep(450);if(i===target){boxes[i].classList.add('reveal','correct');$('spark').classList.remove('show');void $('spark').offsetWidth;$('spark').classList.add('show');info('Ապրե՜ս, գտար նապաստակին։','Հիշողությունդ հիանալի աշխատեց։');stars++;drawDots();await sleep(1200);if(round===5){info('🏆 Հաղթե՜ցիր։','Ավարտեցիր բոլոր 5 փուլերը։');$('start').textContent='▶ Նոր խաղ';mode='finished'}else{round++;drawDots();$('start').textContent='▶ Հաջորդ փուլ';mode='ready'}}else{boxes[i].classList.remove('lift');boxes[target].classList.add('lift','reveal');info('Այս տուփում էր նապաստակը։','Ոչինչ, նորից փորձենք։');await sleep(1350);$('start').textContent='↻ Փորձել նորից';mode='ready'}$('start').disabled=false;busy=false}async function start(){if(busy||mode==='watch')return;if(mode==='guess')return;busy=true;if(mode==='finished'){round=1;stars=0;drawDots()}create();info('Պատրա՞ստ ես։','Ուշադիր հետևիր նապաստակին։');await sleep(350);busy=false;await intro()}$('start').onclick=start;$('again').onclick=()=>{if(mode==='watch'||busy)return;round=1;stars=0;mode='idle';create();drawDots();info('Հիշիր՝ ո՞ր տուփի մեջ է նապաստակը։','Նայիր ուշադիր, հետո հետևիր տուփերին։');$('start').textContent='▶ Սկսել';$('start').disabled=false};window.addEventListener('resize',()=>{if(mode==='watch')return;order.forEach((i,slot)=>place(boxes[i],slot))});create();drawDots()})();
</script></body></html>
