<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui;background:#8dd9fb}canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:9px 16px;background:#fff9e8e8;border:3px solid #b67837;border-radius:22px;color:#794522;font-weight:900;font-size:clamp(13px,3.8vw,19px);white-space:nowrap;pointer-events:none}#again{position:absolute;bottom:18px;right:15px;border:3px solid #fff;border-radius:25px;background:linear-gradient(#ffdf5b,#ff982e);box-shadow:0 5px #a85a24;color:#753a16;font-weight:900;font-size:19px;padding:11px 16px}</style></head><body><canvas id="c"></canvas><div id="tip">Քաշի՛ր ու կառուցի՛ր խելառ աշտարակը 😜</div><button id="again">↻ Նորից</button><script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),tip=document.getElementById('tip');let W=0,H=0,dpr=1,blocks=[],falling=[],drag=null,phase=0,last=0,t=0,party=0;const colors=['#ff695c','#54b9ff','#ffd54c','#8edc75','#bf89f7','#ff9f60'];let audio=null;function sound(freq=300,dur=.12,type='sine'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.72,audio.currentTime+dur);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function reset(){blocks=[];falling=[];drag=null;phase=0;party=0;tip.textContent='Քաշի՛ր ու կառուցի՛ր խելառ աշտարակը 😜';for(let i=0;i<6;i++)blocks.push({id:i,x:0,y:0,w:0,h:0,color:colors[i],placed:false,rot:0,bounce:0});layout()}
function layout(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let size=Math.min(W*.19,74),h=size*.83;blocks.forEach((b,i)=>{b.w=size;b.h=h;if(!b.placed&&b!==drag){b.x=16+(i%3)*(size+Math.max(7,(W-32-3*size)/2));b.y=H-h-18-Math.floor(i/3)*(h+14)}})}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function box(b){ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(b.rot+Math.sin(t*6+b.id)*b.bounce*.08);let w=b.w,h=b.h;ctx.shadowColor='#5c4a4270';ctx.shadowBlur=12;ctx.shadowOffsetY=8;rr(-w/2,-h/2,w,h,12);ctx.fillStyle=b.color;ctx.fill();ctx.shadowColor='transparent';rr(-w/2+5,-h/2+4,w-10,h*.27,9);ctx.fillStyle='#ffffff65';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff9';rr(-w/2+2,-h/2+2,w-4,h-4,11);ctx.stroke();ctx.fillStyle='#342a39';let eye=Math.max(3,w*.055);for(let k of [-1,1]){ctx.beginPath();ctx.ellipse(k*w*.19,-h*.05,eye,eye*1.4,0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#713e45';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,h*.12,w*.12,0,Math.PI);ctx.stroke();if(b.bounce>.1){ctx.fillStyle='#ffedf3';ctx.beginPath();ctx.arc(-w*.32,h*.15,w*.08,0,7);ctx.arc(w*.32,h*.15,w*.08,0,7);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#74c7fb');sky.addColorStop(.65,'#b8e9ff');sky.addColorStop(1,'#e7f6ba');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<6;i++){let x=((i*193+65)%Math.max(W,1)),y=H*.12+i%3*H*.14;ctx.fillStyle='#fff9';for(let k=-1;k<=1;k++){ctx.beginPath();ctx.ellipse(x+k*23,y,35,20,0,0,7);ctx.fill()}}ctx.fillStyle='#9fce81';ctx.beginPath();ctx.ellipse(W*.2,H*.77,W*.48,H*.2,0,0,7);ctx.ellipse(W*.82,H*.77,W*.52,H*.24,0,0,7);ctx.fill();ctx.fillStyle='#b97c44';rr(W*.17,H*.71,W*.66,16,7);ctx.fill();ctx.fillStyle='#f9ca7b';rr(W*.17,H*.69,W*.66,16,7);ctx.fill();ctx.fillStyle='#ffffff88';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('⭐ '+phase+' / 6',W/2,Math.max(85,H*.14));blocks.filter(b=>b.placed).forEach(box);blocks.filter(b=>!b.placed&&b!==drag).forEach(box);if(drag)box(drag);for(let p of falling){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}if(party>0){ctx.fillStyle='#fff9e4df';rr(W*.1,H*.29,W*.8,H*.15,22);ctx.fill();ctx.fillStyle='#a85a23';ctx.font='900 '+Math.min(29,W*.068)+'px system-ui';ctx.fillText('Աշտարակը պարում է՜ 😂',W/2,H*.38)}}
function down(e){let x=e.clientX,y=e.clientY;for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(!b.placed&&x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-8&&y<=b.y+b.h+8){drag=b;drag.dx=x-b.x;drag.dy=y-b.y;c.setPointerCapture(e.pointerId);sound(430,.07);break}}}
function move(e){if(drag){drag.x=e.clientX-drag.dx;drag.y=e.clientY-drag.dy;drag.rot=Math.sin(e.clientX*.05)*.09}}
function up(){if(!drag)return;let b=drag;drag=null;let targetX=W/2-b.w/2,targetY=H*.69-(phase+1)*b.h;let near=Math.abs(b.x-targetX)<Math.max(85,W*.27)&&Math.abs(b.y-targetY)<Math.max(90,H*.2);if(near){b.x=targetX+Math.sin(phase*3)*Math.min(8,W*.018);b.y=targetY;b.rot=(phase%2?1:-1)*.045;b.placed=true;b.bounce=1;phase++;sound(380+phase*90,.2,'triangle');tip.textContent=['Վա՜յ, ծիծաղում է 😂','Հոպլա՜ 🤪','Էս ի՜նչ աշտարակ է 😆','Ուռա՜, էլի՜ 😜','Օ՜յ, ճոճվում է 🙃','Ապրե՜ս, պարում է 🎉'][phase-1];if(phase===6){party=4;for(let i=0;i<65;i++)falling.push({x:Math.random()*W,y:-Math.random()*H,r:3+Math.random()*5,color:colors[i%6],v:1+Math.random()*3});sound(740,.35)}}else{b.rot=0;sound(190,.16,'sawtooth');layout()}}
function frame(ms){let dt=Math.min((ms-last)/1000||.016,.04);last=ms;t+=dt;for(let b of blocks)b.bounce=Math.max(0,b.bounce-dt*1.4);if(party>0)party-=dt;for(let p of falling){p.y+=p.v*dt*90;p.x+=Math.sin(t*4+p.r)*dt*20}draw();requestAnimationFrame(frame)}
c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);document.getElementById('again').addEventListener('click',()=>{sound(520,.1);reset()});addEventListener('resize',layout);reset();requestAnimationFrame(frame)})();
</script></body></html>
