<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Գունավոր մեխանիզմներ 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}body{background:radial-gradient(#4e8190,#132c43)}#app{height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:8px 10px max(9px,env(safe-area-inset-bottom))}#info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900}.chip{background:linear-gradient(#ffeac0,#c68d53);color:#694122;border:3px solid #a16a3f;border-radius:15px;padding:9px 12px;box-shadow:inset 0 2px #fff9,0 4px 8px #0004}#message{flex:1;text-align:center;font-size:13px}#scene{position:relative;flex:1;min-height:240px;overflow:hidden;border:5px solid #c89a64;border-radius:26px;background:radial-gradient(ellipse at 48% 34%,#7aa3ad,#315b75 64%,#1a344f);box-shadow:inset 0 5px 30px #091a3588,0 5px 15px #09192b66}canvas{width:100%;height:100%;display:block;touch-action:none}#feedback{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);font-size:72px;opacity:0;pointer-events:none;transition:opacity .18s}#feedback.show{opacity:1}.tray{background:linear-gradient(145deg,#d6a16a,#95603c);border:4px solid #f4ce95;border-radius:22px;padding:9px;box-shadow:0 5px 10px #0005}.label{text-align:center;font-weight:900;margin-bottom:8px}#parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.part{height:clamp(65px,18vw,91px);display:grid;place-items:center;border-radius:15px;border:3px solid #ffe4ba;border-bottom:5px solid #a36b42;background:linear-gradient(#fff0cf,#e8bf8c);cursor:pointer}.part.selected{outline:4px solid #78f6ff;filter:brightness(1.1)}.gearicon{width:55px;height:55px;filter:drop-shadow(0 4px 3px #0005)}#actions{display:flex;gap:8px}button{font:inherit;font-weight:900;-webkit-tap-highlight-color:transparent}#actions button{flex:1;background:linear-gradient(#ffebc2,#c99458);border:3px solid #fbe3b0;border-bottom:5px solid #906039;color:#694122;border-radius:13px;padding:10px 5px}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#10283dc9;z-index:5}#overlay.show{display:flex}.modal{width:100%;max-width:350px;background:linear-gradient(#fff1ce,#e5b77d);color:#704525;border:7px solid #a47343;border-radius:28px;padding:22px 12px;text-align:center;box-shadow:0 14px 35px #0008}.award{font-size:75px}.modal h2{margin:8px 0 20px}#next{padding:12px 24px;background:linear-gradient(#b3fb8b,#3cbf5e);color:#145a2c;border:3px solid #c9ffad;border-bottom:5px solid #197d3b;border-radius:15px;font-size:18px}@media(max-height:650px){#app{gap:4px}.part{height:57px}.gearicon{width:42px;height:42px}.tray{padding:5px}}
</style></head><body><div id="app"><div id="info"><div class="chip" id="phase">Փուլ 1 / 5</div><div id="message">Ընտրիր անիվը, հետո սեղմիր դատարկ տեղը</div><div class="chip" id="count">0 / 3</div></div><div id="scene"><div id="feedback"></div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="result">Մեխանիզմն աշխատում է</h2><button id="next">Շարունակել ✓</button></div></div></div><div class="tray"><div class="label">Գունավոր ատամնանիվներ</div><div id="parts"></div></div><div id="actions"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="restart">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#scene'),colors=[0xff6b6b,0xffc85e,0x57d4ef,0xb68aff,0x76dd9a,0xff93ca],levels=[3,4,4,5,6],orders=[[0,1,2],[2,0,3,1],[1,4,0,3],[4,2,0,3,1],[0,4,2,1,3,5]];
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.24;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaffff,0x284363,2.6));const key=new THREE.DirectionalLight(0xffe3af,3.5);key.position.set(-4,7,8);scene.add(key);const fill=new THREE.DirectionalLight(0x83ddff,2);fill.position.set(5,3,-5);scene.add(fill);
const root=new THREE.Group();scene.add(root);const gold=new THREE.MeshStandardMaterial({color:0xffd187,metalness:.6,roughness:.25}),wood=new THREE.MeshStandardMaterial({color:0x9b6b48,roughness:.73}),steel=new THREE.MeshStandardMaterial({color:0x7aafbf,metalness:.7,roughness:.26});
const board=new THREE.Mesh(new THREE.BoxGeometry(9,6.2,.45),wood);board.position.z=-.42;root.add(board);const inset=new THREE.Mesh(new THREE.BoxGeometry(8.55,5.75,.08),new THREE.MeshStandardMaterial({color:0x2d6477,metalness:.35,roughness:.48}));inset.position.z=-.17;root.add(inset);
for(const x of [-4.24,4.24])for(const y of [-2.7,2.7]){const bolt=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),gold);bolt.position.set(x,y,-.08);root.add(bolt)}
function gearGeo(teeth=12){const s=new THREE.Shape(),steps=teeth*4;for(let i=0;i<steps;i++){const a=i*2*Math.PI/steps;const radius=(i%4===1||i%4===2)?1.03:.85;const x=Math.cos(a)*radius,y=Math.sin(a)*radius;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();const hole=new THREE.Path();hole.absarc(0,0,.18,0,Math.PI*2,true);s.holes.push(hole);return new THREE.ExtrudeGeometry(s,{depth:.27,bevelEnabled:true,bevelThickness:.055,bevelSize:.035,bevelSegments:2,steps:1,curveSegments:28})}
const geometry=gearGeo(),ringGeo=new THREE.TorusGeometry(.20,.07,10,32),pegGeo=new THREE.CylinderGeometry(.16,.16,.36,24);
let stage=0,selected=-1,placed=[],slots=[],running=false,feedbackTimer=0,winTimer=null;
function layout(n){const layouts={3:[[-2.1,0],[0,0],[2.1,0]],4:[[-2.05,1.08],[0,1.08],[2.05,1.08],[0,-1.08]],5:[[-2.05,1.08],[0,1.08],[2.05,1.08],[-1.03,-1.08],[1.03,-1.08]],6:[[-2.05,1.08],[0,1.08],[2.05,1.08],[-2.05,-1.08],[0,-1.08],[2.05,-1.08]]};return layouts[n]}
function build(){for(const s of slots){root.remove(s.mount);s.mount.traverse(o=>{if(o.geometry&&o.geometry!==geometry&&o.geometry!==ringGeo&&o.geometry!==pegGeo)o.geometry.dispose();if(o.material&&o.material!==gold&&o.material!==steel&&o.material!==wood)o.material.dispose()})}slots=[];placed=[];selected=-1;running=false;clearTimeout(winTimer);$('#overlay').classList.remove('show');const n=levels[stage],positions=layout(n);positions.forEach(([x,y],i)=>{const mount=new THREE.Group();mount.position.set(x,y,0);root.add(mount);const seat=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.12,32),steel);seat.rotation.x=Math.PI/2;seat.position.z=.02;mount.add(seat);const rim=new THREE.Mesh(new THREE.TorusGeometry(.43,.055,8,40),gold);rim.position.z=.12;mount.add(rim);const peg=new THREE.Mesh(pegGeo,steel);peg.rotation.x=Math.PI/2;peg.position.z=.2;mount.add(peg);slots.push({mount,gear:null,id:i})});$('#phase').textContent='Փուլ '+(stage+1)+' / 5';update();renderTray();resize()}
function update(){$('#count').textContent=placed.length+' / '+slots.length;slots.forEach((s,i)=>{s.mount.scale.setScalar(i===selected?1.04:1)})}
function gearSvg(color){return '<svg class="gearicon" viewBox="-55 -55 110 110" aria-hidden="true"><path fill="#'+color.toString(16).padStart(6,'0')+'" stroke="#8d5d45" stroke-width="2" d="'+Array.from({length:48},(_,i)=>{const a=i*Math.PI/24,r=i%4===1||i%4===2?48:39;return(i?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)}).join(' ')+' Z'+'"/><circle r="10" fill="#ffe5b2" stroke="#926342" stroke-width="3"/></svg>'}
function renderTray(){const tray=$('#parts');tray.innerHTML='';const remaining=orders[stage].filter((_,i)=>!slots[i].gear);const choices=[...new Set([...remaining,...colors.map((_,i)=>i)])].slice(0,6);choices.forEach(type=>{const b=document.createElement('button');b.className='part';b.innerHTML=gearSvg(colors[type]);b.setAttribute('aria-label','Ատամնանիվ '+(type+1));if(selected===type)b.classList.add('selected');b.onclick=()=>{selected=type;renderTray();update()};tray.append(b)})}
function flash(v,ok){const f=$('#feedback');f.textContent=v;f.style.color=ok?'#85ff9f':'#ff7777';f.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>f.classList.remove('show'),600)}
function install(index){if(running||selected<0)return;const slot=slots[index];if(slot.gear)return;const correct=orders[stage][index];if(selected!==correct){flash('✕',false);slot.mount.children[1].material=gold;return}const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:colors[selected],metalness:.3,roughness:.26}));mesh.position.z=.25;mesh.scale.setScalar(.05);slot.mount.add(mesh);slot.gear=mesh;placed.push(index);selected=-1;flash('✓',true);update();renderTray();if(placed.length===slots.length){running=true;winTimer=setTimeout(()=>{$('#award').textContent=stage===4?'🏆':'⭐';$('#result').textContent=stage===4?'Բոլոր մեխանիզմներն աշխատում են':'Մեխանիզմն աշխատում է';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')},2400)}}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if($('#overlay').classList.contains('show'))return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(slots.map(s=>s.mount),true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&o.parent!==root)o=o.parent;const i=slots.findIndex(s=>s.mount===o);if(i>=0)install(i)});
$('#undo').onclick=()=>{if(running||!placed.length)return;const i=placed.pop(),s=slots[i];s.mount.remove(s.gear);s.gear.material.dispose();s.gear=null;selected=-1;update();renderTray()};$('#hint').onclick=()=>{const i=slots.findIndex(s=>!s.gear);if(i<0)return;selected=orders[stage][i];renderTray();const m=slots[i].mount;m.children[1].material.color.setHex(0x63ff80);setTimeout(()=>m.children[1].material.color.setHex(0xffd187),1100)};$('#restart').onclick=()=>{stage=0;build()};$('#next').onclick=()=>{stage=(stage+1)%5;build()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const d=Math.max(12,8.9/Math.tan(THREE.MathUtils.degToRad(19))/Math.max(.65,w/h)/2);camera.position.set(0,0,d);camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let prev=0;function tick(time){requestAnimationFrame(tick);const dt=Math.min(40,time-prev||16);prev=time;slots.forEach((s,i)=>{if(!s.gear)return;s.gear.scale.lerp(new THREE.Vector3(1,1,1),.18);if(running)s.gear.rotation.z+=(i%2?-1:1)*dt*.0028});renderer.render(scene,camera)}build();requestAnimationFrame(tick);
</script></body></html>
