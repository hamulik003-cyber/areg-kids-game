<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f4d6a8">
<title>Արեգ</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4d6a8}</style>
</head>
<body>
<script>
(async () => {
  const stamp = Date.now();
  try { if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } } catch (_) {}
  try { if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } } catch (_) {}
  location.replace('./?kiosk=v36-' + stamp + '&hardrefresh=1');
})();
</script>
</body>
</html>
