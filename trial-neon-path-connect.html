<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#23104b"><title>Միացրու ճանապարհը — փորձնական խաղ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;color:#fff}body{background:radial-gradient(ellipse at 50% 45%,#a835a3 0%,#4d1d78 43%,#150d43 85%)}#game{position:absolute;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.pill{background:linear-gradient(#6030a5,#2a175d);border:2px solid #b98bff;border-radius:13px;padding:8px 13px;box-shadow:0 3px 14px #0d032c99;font-weight:800;font-size:15px}.head{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 54px);width:100%;text-align:center;text-shadow:0 3px 10px #11042d;font-weight:850;font-size:20px}.sub{font-size:12px;color:#e3c7ff;margin-top:3px}.footer{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#d3b7ee;pointer-events:none}#win{display:none;position:absolute;inset:0;background:#0c0634aa;align-items:center;justify-content:center;backdrop-filter:blur(6px)}#win.show{display:flex}.modal{width:min(86vw,350px);padding:28px 18px;border:3px solid #bd94ff;border-radius:24px;text-align:center;background:linear-gradient(155deg,#7b35c2,#2d1768);box-shadow:0 18px 50px #120329, inset 0 0 28px #ffffff20}.modal h2{margin:8px 0 4px}.modal p{color:#e4ceff}button{border:0;background:linear-gradient(#74f4e7,#21b9c6);border-radius:15px;padding:13px 27px;color:#10345a;font-size:18px;font-weight:900;box-shadow:0 5px 0 #137989}button:active{transform:translateY(3px);box-shadow:0 2px 0 #137989}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">Մակարդակ <span id="level">1</span>/3</div></div><div class="head">Միացրու ճանապարհը<div class="sub" id="hint">Քաշիր լուսավոր կտորը վանդակի վրա</div></div><div class="footer">Փորձնական խաղ • մատով քաշել կամ հպվել</div><div id="win"><div class="modal"><div style="font-size:55px">🌟</div><h2>Ապրե՛ս</h2><p>Լուսավոր ճանապարհը միացվեց</p><button id="next">Շարունակել</button></div></div><script>
(()=>{'use strict';const cv=document.getElementById('game'),c=cv.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1,cell=50,ox=0,oy=0,trayY=0,level=0,score=0,drag=null,selected=-1,done=false,flowAt=0;const palette=['#ff80e5','#70eaff','#ffd06a'];const routes=[
[[2,0],[2,1],[2,2],[3,2],[3,3],[3,4],[2,4],[2,5]],
[[1,0],[1,1],[2,1],[3,1],[3,2],[3,3],[2,3],[2,4],[2,5]],
[[3,0],[3,1],[2,1],[2,2],[1,2],[1,3],[2,3],[2,4],[2,5]]
];let route=[],pieces=[],slots=[];const round=(x,y,w,h,r=10)=>{c.beginPath();c.roundRect(x,y,w,h,r)};const segment=(a,b)=>[b[0]-a[0],b[1]-a[1]];const dir=(v)=>v[0]===1?'R':v[0]===-1?'L':v[1]===1?'D':'U';const opp=d=>({L:'R',R:'L',U:'D',D:'U'})[d];function init(){route=routes[level%routes.length];pieces=route.slice(1,-1).map((p,i)=>({id:i,dirs:[opp(dir(segment(route[i],p))),dir(segment(p,route[i+2]))],placed:false}));slots=pieces.map((_,i)=>i).sort((a,b)=>((a*7+level*3)%pieces.length)-((b*7+level*3)%pieces.length));done=false;flowAt=0;drag=null;selected=-1;$('level').textContent=level+1;$('hint').textContent='Քաշիր լուսավոր կտորը ճիշտ վանդակի վրա';$('win').classList.remove('show');resize()}function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);cell=Math.min((W-32)/5,(H-295)/6,69);cell=Math.max(33,cell);ox=(W-5*cell)/2;oy=Math.max(145,(H-6*cell)/2-55);trayY=Math.min(H-92,oy+6*cell+35)}addEventListener('resize',resize);function pipe(x,y,ds,color,scale=1,glow=true){c.save();c.translate(x,y);c.scale(scale,scale);c.lineCap='round';c.lineJoin='round';const pts={L:[-cell*.5,0],R:[cell*.5,0],U:[0,-cell*.5],D:[0,cell*.5]};const draw=(width,stroke,blur=0)=>{c.beginPath();c.moveTo(0,0);ds.forEach(d=>c.lineTo(...pts[d]));c.lineWidth=width;c.strokeStyle=stroke;c.shadowColor=color;c.shadowBlur=blur;c.stroke();c.shadowBlur=0};draw(cell*.27,'#190c3d');draw(cell*.20,'#65529e');draw(cell*.14,color,glow?12:0);draw(cell*.055,'#fff9ff',glow?8:0);c.restore()}function draw(t){c.clearRect(0,0,W,H);const bg=c.createRadialGradient(W*.5,H*.4,20,W*.5,H*.4,H*.72);bg.addColorStop(0,'#aa329d');bg.addColorStop(.52,'#542079');bg.addColorStop(1,'#140b3e');c.fillStyle=bg;c.fillRect(0,0,W,H);for(let i=0;i<70;i++){const x=(i*137.9+37)%W,y=(i*239.1+20)%H;c.fillStyle=i%3?'#e9a2fc35':'#65c4f449';c.beginPath();c.arc(x,y,1.4+2*Math.sin(i)*Math.sin(i),0,7);c.fill()}c.save();c.shadowColor='#ff7fe5';c.shadowBlur=25;round(ox-8,oy-8,cell*5+16,cell*6+16,17);c.fillStyle='#261054';c.fill();c.lineWidth=3;c.strokeStyle='#ad6de9';c.stroke();c.restore();for(let row=0;row<6;row++)for(let col=0;col<5;col++){const x=ox+col*cell,y=oy+row*cell;round(x+1,y+1,cell-2,cell-2,4);c.fillStyle=(col+row)%2?'#29145a':'#311965';c.fill();c.strokeStyle='#9c66cf66';c.lineWidth=1;c.stroke()}const color=palette[level%3];route.forEach((p,i)=>{const [col,row]=p,x=ox+(col+.5)*cell,y=oy+(row+.5)*cell;if(i===0||i===route.length-1){c.save();c.shadowColor=color;c.shadowBlur=17;round(x-cell*.35,y-cell*.35,cell*.7,cell*.7,7);c.fillStyle=i===0?'#52ddff':'#ffb443';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.restore();c.fillStyle='#251044';c.font='bold '+(cell*.35)+'px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(i===0?'▶':'★',x,y)}else if(pieces[i-1].placed){pipe(x,y,pieces[i-1].dirs,color)}else{round(x-cell*.43,y-cell*.43,cell*.86,cell*.86,5);c.strokeStyle='#e6a6ff50';c.lineWidth=1.5;c.stroke();}});if(done){const elapsed=(t-flowAt)/125;const end=Math.min(route.length-1,Math.max(0,elapsed));for(let i=0;i<Math.floor(end);i++){const a=route[i],b=route[i+1];c.save();c.beginPath();c.moveTo(ox+(a[0]+.5)*cell,oy+(a[1]+.5)*cell);c.lineTo(ox+(b[0]+.5)*cell,oy+(b[1]+.5)*cell);c.lineWidth=cell*.115;c.lineCap='round';c.strokeStyle='#fff8e9';c.shadowColor=color;c.shadowBlur=22;c.stroke();c.restore()}const k=Math.min(route.length-2,Math.floor(end)),f=end-k,a=route[k],b=route[k+1];const px=ox+(a[0]+.5+(b[0]-a[0])*f)*cell,py=oy+(a[1]+.5+(b[1]-a[1])*f)*cell;c.save();c.fillStyle='#fff';c.shadowColor=color;c.shadowBlur=25;c.beginPath();c.arc(px,py,cell*.11,0,7);c.fill();c.restore();if(elapsed>route.length+3&&$('win').className!=='show'){$('win').classList.add('show');score+=5;$('score').textContent=score}}const trayW=Math.min(W-24,470);round((W-trayW)/2,trayY-14,trayW,cell+34,15);c.fillStyle='#35156fbf';c.fill();c.strokeStyle='#b67afa';c.lineWidth=2;c.stroke();const available=slots.filter(id=>!pieces[id].placed);const spacing=trayW/Math.max(1,slots.length);slots.forEach((id,j)=>{const p=pieces[id];if(p.placed||drag===id)return;const x=(W-trayW)/2+spacing*(j+.5),y=trayY+cell*.43;round(x-cell*.38,y-cell*.38,cell*.76,cell*.76,9);c.fillStyle=selected===id?'#8c4ac2':'#53308a';c.fill();c.strokeStyle='#d0a1ff';c.lineWidth=2;c.stroke();pipe(x,y,p.dirs,color,.67)});if(drag!==null){pipe(pointer.x,pointer.y,pieces[drag].dirs,color,.95)}requestAnimationFrame(draw)}const pointer={x:0,y:0};function findTray(x,y){const trayW=Math.min(W-24,470),spacing=trayW/slots.length;for(let j=0;j<slots.length;j++){const id=slots[j],cx=(W-trayW)/2+spacing*(j+.5);if(!pieces[id].placed&&Math.abs(cx-x)<Math.max(20,spacing*.47)&&Math.abs(trayY+cell*.43-y)<cell*.6)return id}return -1}function target(x,y){const col=Math.floor((x-ox)/cell),row=Math.floor((y-oy)/cell);return route.findIndex(p=>p[0]===col&&p[1]===row)-1}function place(id,x,y){const ix=target(x,y);if(ix<0||ix>=pieces.length||pieces[ix].placed||id!==ix)return false;pieces[id].placed=true;selected=-1;drag=null;if(pieces.every(p=>p.placed)){done=true;flowAt=performance.now();$('hint').textContent='Ճանապարհը միացվեց ✨'}return true}cv.addEventListener('pointerdown',e=>{if(done)return;pointer.x=e.clientX;pointer.y=e.clientY;const id=findTray(pointer.x,pointer.y);if(id>=0){drag=id;selected=id;cv.setPointerCapture(e.pointerId)}else if(selected>=0)place(selected,pointer.x,pointer.y)});cv.addEventListener('pointermove',e=>{if(drag!==null){pointer.x=e.clientX;pointer.y=e.clientY}});cv.addEventListener('pointerup',e=>{if(drag!==null){pointer.x=e.clientX;pointer.y=e.clientY;const id=drag;drag=null;place(id,pointer.x,pointer.y)}});cv.addEventListener('pointercancel',()=>{drag=null});$('next').onclick=()=>{level=(level+1)%3;init()};init();requestAnimationFrame(draw)})();
</script></body></html>
