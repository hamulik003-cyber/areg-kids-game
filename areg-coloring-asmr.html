<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Գունավորիր · ASMR</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#fff;touch-action:none;color:#47384e}#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 12px 14px;gap:8px}header{width:100%;display:flex;align-items:center;justify-content:space-between;max-width:560px}h1{font-size:clamp(17px,4vw,23px);margin:0}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0}header button,#next,#again{background:#fff;border-radius:16px;padding:9px 14px;box-shadow:0 4px 0 #dbcbd1;font-weight:800}#counter{font-weight:800;color:#87708a}.paper{width:min(100%,530px);flex:1;min-height:0;background:#fff;border:0;border-radius:0;box-shadow:none;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}svg{height:100%;width:100%;max-height:530px;overflow:visible;touch-action:none}.guide{fill:none;stroke:#e9e5e4;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.ink{fill:none;stroke:#29242a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.region{stroke:none;transition:fill .22s}.tip{position:absolute;width:58px;height:205px;pointer-events:none;z-index:3;transform:translate(-29px,0) rotate(-42deg);transform-origin:29px 0;filter:drop-shadow(3px 9px 5px #0003);display:none}.tip:before{content:"";position:absolute;left:19px;top:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:30px solid #222329}.tip:after{content:"";position:absolute;left:6px;top:29px;width:46px;height:175px;border-radius:10px 10px 16px 16px;background:linear-gradient(90deg,#891527,#fb4a57 40%,#db2339 78%,#8a1729);border-top:11px solid #222;border-bottom:16px solid #f3e8e3;box-shadow:inset -7px 0 9px #0002}.tip{will-change:left,top}.controls{width:min(100%,530px);display:flex;flex-direction:column;align-items:center;gap:8px}#instruction{font-weight:800;text-align:center;min-height:23px;font-size:16px}.palette[hidden]{display:none!important}.palette{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:48px}.swatch{width:46px;height:46px;border:4px solid #fff;border-radius:50%;box-shadow:0 3px 8px #0002;transition:transform .15s}.swatch.selected{outline:3px solid #493a56;transform:translateY(-4px)}#hold{width:100%;border-radius:18px;background:linear-gradient(#ff6d7c,#ed354d);color:white;font-size:18px;font-weight:900;padding:14px 10px;box-shadow:0 5px 0 #bd233d;user-select:none;-webkit-user-select:none}#hold:active{transform:translateY(3px)}#next{background:#ffe08a}#celebrate{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#fff9;z-index:5;text-align:center;font-size:26px;font-weight:900;gap:16px}#celebrate.show{display:flex}#spark{font-size:46px}@media(max-height:580px){#app{gap:3px;padding:4px 8px}.paper{border-width:4px;border-radius:18px}.swatch{width:35px;height:35px}#hold{padding:9px}.controls{gap:3px}}</style></head><body><main id="app"><header><h1>🎨 Գունավորիր · ASMR</h1><span id="counter"></span></header><section class="paper" id="paper"><svg id="art" viewBox="0 0 320 320" aria-label="Գունավորման պատկեր"></svg><div class="tip" id="tip"></div><div id="paintCursor" style="position:absolute;pointer-events:none;display:none;width:32px;height:32px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #3335,0 3px 8px #0003;transform:translate(-50%,-50%);z-index:4"></div><div id="celebrate"><span id="spark">✨🌟✨</span><span>Ապրե՛ս, Արեգ</span><button id="next">Հաջորդ նկարը →</button></div></section><section class="controls"><div id="instruction">Մատդ պահիր նկարի վրա՝ գծելու համար</div><div class="palette" id="palette" hidden></div></section></main><script>(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',art=document.querySelector('#art'),paper=document.querySelector('#paper'),tip=document.querySelector('#tip'),palette=document.querySelector('#palette'),instruction=document.querySelector('#instruction'),celebrate=document.querySelector('#celebrate'),counter=document.querySelector('#counter'),cursor=document.querySelector('#paintCursor');
const levels=[
{name:'Սրտիկ',parts:['M160 260 C112 226 49 172 49 114 C49 48 122 42 160 93','M160 93 C200 39 271 49 271 114 C271 173 207 230 160 260'],shape:'M160 260 C112 226 49 172 49 114 C49 48 122 42 160 93 C200 39 271 49 271 114 C271 173 207 230 160 260 Z'},
{name:'Խնձոր',parts:['M160 87 C123 52 59 80 63 156 C65 222 120 268 160 250','M160 250 C201 269 257 218 257 156 C259 81 194 52 160 87'],shape:'M160 87 C123 52 59 80 63 156 C65 222 120 268 160 250 C201 269 257 218 257 156 C259 81 194 52 160 87 Z'},
{name:'Արև',parts:['M160 91 A69 69 0 0 1 229 160','M229 160 A69 69 0 1 1 160 91'],shape:'M160 91 A69 69 0 1 1 159.9 91 Z'},
{name:'Փուչիկ',parts:['M160 44 C89 44 78 134 112 188 Q132 224 160 245','M160 245 Q189 223 207 188 C244 134 232 44 160 44'],shape:'M160 44 C89 44 78 134 112 188 Q132 224 160 245 Q189 223 207 188 C244 134 232 44 160 44 Z'}
];const colors=['#f34d64','#ffcf39','#65b66a','#5eafea','#ae80ef'];let level=0,stage='outline',part=0,progress=0,active=false,needRelease=false,inkPaths=[],shapePath,paintLayer,strokeGroup,selected=colors[0],paintLength=0,previous=null,audio=null,last=0,coverageCells=[],coveredCount=0,coverageTotal=0,coverageCanvas=document.createElement('canvas'),coverageCtx=coverageCanvas.getContext('2d');
function node(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function sound(freq=170){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.024,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.1)}catch(e){}}
function coords(e){const m=art.getScreenCTM();if(!m)return null;const p=art.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(m.inverse())}
function setCursor(p){const m=art.getScreenCTM();if(!m)return;const q=new DOMPoint(p.x,p.y).matrixTransform(m),r=paper.getBoundingClientRect();tip.style.left=(q.x-r.left)+'px';tip.style.top=(q.y-r.top)+'px';tip.style.display='block'}
function load(){art.replaceChildren();palette.replaceChildren();level=level%levels.length;stage='outline';part=0;progress=0;active=false;needRelease=false;paintLength=0;previous=null;coveredCount=0;coverageCells=[];coverageTotal=0;celebrate.classList.remove('show');tip.style.display='block';cursor.style.display='none';palette.hidden=true;counter.textContent=(level+1)+' / '+levels.length;instruction.textContent='Մատդ պահիր նկարի վրա՝ առաջին կեսը նկարելու համար';
const def=node('defs',{}),clip=node('clipPath',{id:'paint-clip'});shapePath=node('path',{d:levels[level].shape,fill:'white'});const fillShape=new Path2D(levels[level].shape);for(let y=16;y<304;y+=8)for(let x=16;x<304;x+=8){if(coverageCtx.isPointInPath(fillShape,x,y)){coverageCells.push({x,y,done:false});coverageTotal++}}clip.append(shapePath);def.append(clip);art.append(def);
paintLayer=node('g',{'clip-path':'url(#paint-clip)'});art.append(paintLayer);strokeGroup=node('g',{});art.append(strokeGroup);inkPaths=[];
if(level===1){const stem=node('path',{d:'M160 87 Q153 61 172 40',fill:'none',stroke:'#78523a','stroke-width':10,'stroke-linecap':'round'}),leaf=node('path',{d:'M169 67 Q191 28 232 47 Q218 80 169 67 Z',fill:'#76b65d',stroke:'#315d37','stroke-width':4});art.append(stem,leaf)}
if(level===2){for(let a=0;a<12;a++){const t=a*Math.PI/6,x1=160+94*Math.cos(t),y1=160+94*Math.sin(t),x2=160+124*Math.cos(t),y2=160+124*Math.sin(t);art.append(node('path',{d:'M'+x1+' '+y1+' L'+x2+' '+y2,fill:'none',stroke:'#f5bd41','stroke-width':10,'stroke-linecap':'round'}))}}
if(level===3){art.append(node('path',{d:'M150 246 L170 246 L160 261 Z',fill:'#efac58',stroke:'#333','stroke-width':4}));art.append(node('path',{d:'M160 261 Q135 279 164 300',fill:'none',stroke:'#333','stroke-width':4}))}
for(const d of levels[level].parts){const guide=node('path',{d,fill:'none',stroke:'#aaa','stroke-width':6,'stroke-dasharray':'1 12','stroke-linecap':'round'}),ink=node('path',{d,fill:'none',stroke:'#242024','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round'});strokeGroup.append(guide,ink);const length=ink.getTotalLength();ink.style.strokeDasharray=length;ink.style.strokeDashoffset=length;inkPaths.push({ink,length,guide})}
const first=inkPaths[0].ink.getPointAtLength(0);requestAnimationFrame(()=>setCursor(first));
for(const color of colors){const btn=document.createElement('button');btn.className='swatch'+(selected===color?' selected':'');btn.style.background=color;btn.setAttribute('aria-label','Գույն '+color);btn.addEventListener('pointerdown',e=>e.stopPropagation());btn.addEventListener('click',()=>{selected=color;palette.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===btn));sound(360)});palette.append(btn)}}
function trace(dt){if(stage!=='outline'||!active)return;const item=inkPaths[part];progress=Math.min(item.length,progress+dt*245);item.ink.style.strokeDashoffset=item.length-progress;setCursor(item.ink.getPointAtLength(progress));if(progress>=item.length){active=false;needRelease=true;item.guide.style.opacity='0';sound(480);if(part===0){part=1;progress=0;instruction.textContent='Հանիր մատդ, հետո նորից դիր՝ երկրորդ կեսի համար';setCursor(inkPaths[1].ink.getPointAtLength(0))}else{stage='color';tip.style.display='none';palette.hidden=false;instruction.textContent='Ընտրիր 5 գույներից մեկը և մատդ տար այս ու այն կողմ՝ ներկելու համար';sound(630)}}}
function stampCoverage(x,y){for(const cell of coverageCells){if(!cell.done&&Math.hypot(cell.x-x,cell.y-y)<=21){cell.done=true;coveredCount++}}}
function paint(e){const p=coords(e);if(!p)return;const r=paper.getBoundingClientRect();cursor.style.display='block';cursor.style.background=selected;cursor.style.left=(e.clientX-r.left)+'px';cursor.style.top=(e.clientY-r.top)+'px';if(!previous)previous=p;
const distance=Math.hypot(p.x-previous.x,p.y-previous.y),steps=Math.max(1,Math.ceil(distance/5));for(let i=0;i<=steps;i++){const t=i/steps;stampCoverage(previous.x+(p.x-previous.x)*t,previous.y+(p.y-previous.y)*t)}
const path=node('path',{d:'M'+previous.x+' '+previous.y+' L'+p.x+' '+p.y,fill:'none',stroke:selected,'stroke-width':42,'stroke-linecap':'round','stroke-linejoin':'round'});paintLayer.append(path);previous=p;
if(coverageTotal>0&&coveredCount/coverageTotal>=.94)finish()}
function finish(){stage='done';active=false;cursor.style.display='none';const base=node('path',{d:levels[level].shape,fill:selected,opacity:'.96'});paintLayer.append(base);celebrate.classList.add('show');sound(850);try{localStorage.setItem('areg-coloring-asmr-level',String((level+1)%levels.length))}catch(e){}}
paper.addEventListener('pointerdown',e=>{if(e.target.closest('#celebrate'))return;e.preventDefault();if(stage==='outline'){if(needRelease)return;active=true;paper.setPointerCapture(e.pointerId);sound()}else if(stage==='color'){active=true;previous=null;paper.setPointerCapture(e.pointerId);paint(e);sound(290)}});
paper.addEventListener('pointermove',e=>{if(active&&stage==='color')paint(e)});
function release(){if(needRelease)needRelease=false;active=false;previous=null;cursor.style.display='none'}
paper.addEventListener('pointerup',release);paper.addEventListener('pointercancel',release);paper.addEventListener('lostpointercapture',release);
document.querySelector('#next').addEventListener('click',()=>{level=(level+1)%levels.length;load()});
function frame(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;trace(dt);requestAnimationFrame(frame)}
try{level=Math.max(0,Math.min(levels.length-1,Number(localStorage.getItem('areg-coloring-asmr-level'))||0))}catch(e){}load();requestAnimationFrame(frame);
})();</script></body></html>
