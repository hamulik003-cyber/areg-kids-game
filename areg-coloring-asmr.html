<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Գունավորիր · ASMR</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#eaf5ff,#fff0df);touch-action:none;color:#47384e}#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 12px 14px;gap:8px}header{width:100%;display:flex;align-items:center;justify-content:space-between;max-width:560px}h1{font-size:clamp(17px,4vw,23px);margin:0}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0}header button,#next,#again{background:#fff;border-radius:16px;padding:9px 14px;box-shadow:0 4px 0 #dbcbd1;font-weight:800}#counter{font-weight:800;color:#87708a}.paper{width:min(100%,530px);flex:1;min-height:0;background:#fff;border:8px solid #fff;border-radius:30px;box-shadow:0 12px 32px #746d9d2b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}svg{height:100%;width:100%;max-height:530px;overflow:visible;touch-action:none}.guide{fill:none;stroke:#e9e5e4;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.ink{fill:none;stroke:#29242a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.region{stroke:none;transition:fill .22s}.tip{position:absolute;width:49px;height:77px;pointer-events:none;z-index:3;transform:translate(-17px,-62px) rotate(-38deg);filter:drop-shadow(0 5px 4px #0003);display:none}.tip:before{content:"";position:absolute;left:12px;top:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:24px solid #27252c}.tip:after{content:"";position:absolute;left:4px;top:23px;width:40px;height:50px;border-radius:9px 9px 14px 14px;background:linear-gradient(90deg,#9b1829,#f9424c 45%,#d31927 78%,#7e1523);border-top:9px solid #222}.controls{width:min(100%,530px);display:flex;flex-direction:column;align-items:center;gap:8px}#instruction{font-weight:800;text-align:center;min-height:23px;font-size:16px}.palette{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:48px}.swatch{width:46px;height:46px;border:4px solid #fff;border-radius:50%;box-shadow:0 3px 8px #0002;transition:transform .15s}.swatch.selected{outline:3px solid #493a56;transform:translateY(-4px)}#hold{width:100%;border-radius:18px;background:linear-gradient(#ff6d7c,#ed354d);color:white;font-size:18px;font-weight:900;padding:14px 10px;box-shadow:0 5px 0 #bd233d;user-select:none;-webkit-user-select:none}#hold:active{transform:translateY(3px)}#next{background:#ffe08a}#celebrate{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#fff9;z-index:5;text-align:center;font-size:26px;font-weight:900;gap:16px}#celebrate.show{display:flex}#spark{font-size:46px}@media(max-height:580px){#app{gap:3px;padding:4px 8px}.paper{border-width:4px;border-radius:18px}.swatch{width:35px;height:35px}#hold{padding:9px}.controls{gap:3px}}</style></head><body><main id="app"><header><h1>🎨 Գունավորիր · ASMR</h1><span id="counter"></span></header><section class="paper" id="paper"><svg id="art" viewBox="0 0 320 320" aria-label="Գունավորման պատկեր"></svg><div class="tip" id="tip"></div><div id="celebrate"><span id="spark">✨🌟✨</span><span>Ապրե՛ս, Արեգ</span><button id="next">Հաջորդ նկարը →</button></div></section><section class="controls"><div id="instruction">Պահիր կոճակը՝ ուրվագիծը նկարելու համար</div><div class="palette" id="palette"></div><button id="hold">🖍️ ՊԱՀԻՐ ԵՎ ՆԿԱՐԻՐ</button></section></main><script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',art=document.querySelector('#art'),paper=document.querySelector('#paper'),tip=document.querySelector('#tip'),palette=document.querySelector('#palette'),hold=document.querySelector('#hold'),instruction=document.querySelector('#instruction'),celebrate=document.querySelector('#celebrate'),counter=document.querySelector('#counter');
const levels=[
{name:'Սրտիկ',paths:['M160 260 C112 226 49 172 49 114 C49 48 122 42 160 93 C200 39 271 49 271 114 C271 173 207 230 160 260 Z'],regions:[{d:'M160 260 C112 226 49 172 49 114 C49 48 122 42 160 93 C200 39 271 49 271 114 C271 173 207 230 160 260 Z',color:'#f34d64'}]},
{name:'Խնձոր',paths:['M160 87 C123 52 59 80 63 156 C65 222 120 268 160 250 C201 269 257 218 257 156 C259 81 194 52 160 87 Z','M160 89 Q150 49 182 34','M165 68 Q198 32 229 51 Q211 79 165 68 Z'],regions:[{d:'M160 87 C123 52 59 80 63 156 C65 222 120 268 160 250 C201 269 257 218 257 156 C259 81 194 52 160 87 Z',color:'#ee5147'},{d:'M165 68 Q198 32 229 51 Q211 79 165 68 Z',color:'#65b66a'}]},
{name:'Արև',paths:['M160 91 A69 69 0 1 1 159.9 91','M160 30 V69','M160 250 V290','M30 160 H70','M250 160 H290','M68 68 L97 97','M223 223 L251 251','M68 252 L97 223','M223 97 L251 69'],regions:[{d:'M160 91 A69 69 0 1 1 159.9 91',color:'#ffcf39'}]},
{name:'Փուչիկ',paths:['M160 44 C89 44 78 134 112 188 Q132 224 160 245 Q189 223 207 188 C244 134 232 44 160 44 Z','M149 245 L171 245 L160 260 Z','M160 260 Q130 279 165 302'],regions:[{d:'M160 44 C89 44 78 134 112 188 Q132 224 160 245 Q189 223 207 188 C244 134 232 44 160 44 Z',color:'#ae80ef'}]}
];const colors=['#f34d64','#ffcf39','#65b66a','#5eafea','#ae80ef','#ff9e4b'];let level=0,stage='trace',paths=[],total=0,progress=0,pressed=false,last=0,audio=null,chosen=colors[0],filled=new Set(),regions=[];
function el(tag,attrs){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function sound(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=kind==='win'?'sine':'triangle';o.frequency.setValueAtTime(kind==='win'?550:kind==='fill'?390:125,t);o.frequency.exponentialRampToValueAtTime(kind==='win'?990:kind==='fill'?620:95,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function load(){art.replaceChildren();palette.replaceChildren();paths=[];regions=[];total=0;progress=0;filled.clear();stage='trace';pressed=false;celebrate.classList.remove('show');tip.style.display='none';hold.hidden=false;palette.hidden=true;instruction.textContent='Պահիր կոճակը՝ ուրվագիծը նկարելու համար';counter.textContent=(level+1)+' / '+levels.length;const item=levels[level];for(const region of item.regions){const n=el('path',{d:region.d,fill:'#ffffff',class:'region'});art.append(n);regions.push({node:n,color:region.color})}for(const d of item.paths){const guide=el('path',{d,class:'guide'}),ink=el('path',{d,class:'ink'});art.append(guide,ink);const length=ink.getTotalLength();ink.style.strokeDasharray=length;ink.style.strokeDashoffset=length;paths.push({node:ink,length});total+=length}colors.forEach(color=>{const btn=document.createElement('button');btn.className='swatch'+(color===chosen?' selected':'');btn.style.background=color;btn.setAttribute('aria-label','Ընտրել գույն');btn.addEventListener('click',()=>{chosen=color;palette.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===btn));sound('fill')});palette.append(btn)});}
function advance(dt){if(stage!=='trace'||!pressed)return;progress=Math.min(total,progress+dt*310);let remaining=progress,active=null;for(const p of paths){const drawn=Math.max(0,Math.min(p.length,remaining));p.node.style.strokeDashoffset=p.length-drawn;if(remaining>=0&&remaining<=p.length)active={p,drawn};remaining-=p.length}if(active){const point=active.p.node.getPointAtLength(active.drawn),matrix=active.p.node.getScreenCTM();if(matrix){const screen=new DOMPoint(point.x,point.y).matrixTransform(matrix),rect=paper.getBoundingClientRect();tip.style.left=(screen.x-rect.left)+'px';tip.style.top=(screen.y-rect.top)+'px';tip.style.display='block'}}if(progress>=total){pressed=false;stage='fill';tip.style.display='none';hold.hidden=true;palette.hidden=false;instruction.textContent='Ընտրիր գույնը և դիպիր նկարի հատվածին';sound('fill')}}
function fillAt(e){if(stage!=='fill')return;const rect=art.getBoundingClientRect(),pt=art.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const svgPoint=pt.matrixTransform(art.getScreenCTM().inverse());let target=-1;for(let i=regions.length-1;i>=0;i--){const region=regions[i];if(!filled.has(i)&&region.node.isPointInFill(svgPoint)){target=i;break}}if(target<0){target=regions.findIndex((_,i)=>!filled.has(i))}if(target<0)return;const region=regions[target];region.node.style.fill=chosen;filled.add(target);sound('fill');if(filled.size===regions.length){stage='done';celebrate.classList.add('show');sound('win');try{localStorage.setItem('areg-coloring-asmr-level',String((level+1)%levels.length))}catch(e){}}}
hold.addEventListener('pointerdown',e=>{e.preventDefault();if(stage!=='trace')return;pressed=true;hold.setPointerCapture(e.pointerId);sound('draw')});for(const event of ['pointerup','pointercancel','lostpointercapture'])hold.addEventListener(event,()=>{pressed=false});art.addEventListener('pointerdown',e=>{if(stage==='fill'){e.preventDefault();fillAt(e)}});document.querySelector('#next').addEventListener('click',()=>{level=(level+1)%levels.length;load()});function frame(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;advance(dt);requestAnimationFrame(frame)}try{level=Math.max(0,Math.min(levels.length-1,Number(localStorage.getItem('areg-coloring-asmr-level'))||0))}catch(e){}load();requestAnimationFrame(frame);
})();
</script></body></html>
