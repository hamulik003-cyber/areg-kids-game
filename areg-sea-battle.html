*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071e35;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#286e92,#0b3657 45%,#071e35 90%)}#app:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 30px,#ffffff05 31px 32px);pointer-events:none}.top{position:relative;text-align:center;padding:9px 12px 5px;flex-shrink:0}.top h1{font-size:clamp(21px,5vw,29px);margin:0;font-weight:950;letter-spacing:.5px}.top small{color:#b4dce7;font-weight:750}.panel{position:relative;margin:auto 12px;display:flex;flex-direction:column;gap:12px;padding:17px 13px;border:1px solid #9cd9eb55;border-radius:25px;background:linear-gradient(150deg,#174d6fef,#0a2a47f5);box-shadow:0 16px 40px #0017;max-height:calc(100% - 85px);overflow:auto}.panel h2{margin:0;text-align:center;font-size:20px}.panel p{margin:0;text-align:center;color:#d1e9ee;font-size:14px;line-height:1.45}.choice{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 13px;border-radius:17px;background:linear-gradient(130deg,#267a9c,#15506d);border:1px solid #9be5ee66;box-shadow:0 5px #09263b;font-weight:850;font-size:16px}.choice span{font-size:30px}.primary{background:linear-gradient(#ffdd77,#eea83d);color:#533312;font-weight:950;border-radius:15px;padding:13px 16px;box-shadow:0 5px #9d6429}.secondary{background:#256582;border:1px solid #77bcd1aa;border-radius:14px;padding:10px 12px;font-weight:850}.primary:disabled,.secondary:disabled{opacity:.45}.row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.row>*{flex:1}.status{text-align:center;font-size:14px;font-weight:850;color:#fff4b7;min-height:25px;padding:3px 9px}.g html,body{overscroll-behavior:none}#app{background:radial-gradient(ellipse at 52% 44%,#083d65 0%,#041a34 57%,#020e21 100%)}#app:before{background-image:linear-gradient(115deg,#0b68b022 1px,transparent 1px),linear-gradient(25deg,#0d68a01b 1px,transparent 1px);background-size:47px 47px;opacity:.7}.top{z-index:2;padding:6px 10px 3px}.top h1{font-size:clamp(19px,4.5vw,25px);text-shadow:0 0 18px #24b6ff77}.top small{font-size:11px}.game{justify-content:center;gap:5px;padding:3px 9px 6px}.board-wrap{width:min(100%,min(55dvh,450px));gap:3px}.board-title{color:#d6faff;background:linear-gradient(90deg,#123e5c,#0c2946);border:1px solid #238bc0;border-radius:9px;padding:5px 9px;box-shadow:0 0 13px #0089df44;font-size:12px}.board{position:relative;width:100%;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:1px;padding:5px;border:2px solid #4abfff;border-radius:8px;background:linear-gradient(145deg,#168fe6,#075aab);box-shadow:0 0 0 2px #04304c,0 0 22px #0a8efc66,0 5px 0 #052a4b;touch-action:none;user-select:none}.cell{border-radius:0;background:linear-gradient(135deg,#159ce9,#087acb);border:1px solid #b1ecff48;font-size:clamp(11px,2.7vw,18px);overflow:visible;touch-action:none}.cell:nth-child(even){background:linear-gradient(135deg,#1493e0,#0c7bc8)}.cell.ship{background:linear-gradient(145deg,#c5d8df,#708fa4);box-shadow:inset 0 1px #fff9,inset 0 -2px #3b5b71}.cell.hit{background:radial-gradient(circle,#f22,#8d182a 70%,#3d1a34);color:#fff;text-shadow:0 0 8px red}.cell.sunk{background:#3b172a}.cell.miss{background:linear-gradient(135deg,#157fb9,#105e9b)}.cell.miss:after{content:"◉";font-size:clamp(12px,3.1vw,19px);color:#e9faff;text-shadow:0 0 3px #fff}.cell.ghost{background:#72d8a8aa!important}.cell.invalid{background:#ed5665aa!important}.cell.hint{box-shadow:inset 0 0 0 2px #ffdb67}.cell.selected{outline:2px solid #ffdc70}.cell.hit:after{content:"✚";position:absolute;z-index:3;font-size:clamp(13px,3.3vw,22px);color:#ff3636;text-shadow:0 0 3px #290000,0 0 10px #ff0000;pointer-events:none}.cell.hit{color:transparent}.coord-top{display:grid;grid-template-columns:repeat(10,1fr);padding:0 6px 1px;margin-left:23px;gap:1px;width:calc(100% - 23px);color:#e7f7ff;font-size:10px;font-weight:900;text-align:center}.board-row{display:flex;width:100%;align-items:stretch;gap:3px}.coord-left{width:20px;flex-shrink:0;display:grid;grid-template-rows:repeat(10,1fr);align-items:center;text-align:center;font-size:10px;font-weight:900;color:#e7f7ff}.board-row .board{width:calc(100% - 23px)}.dock{width:min(100%,450px);border:2px solid #3cb5ed;border-radius:10px;padding:8px;background:linear-gradient(145deg,#0e6aa7,#074677);box-shadow:0 0 14px #0e91ef44;display:flex;flex-direction:column;gap:5px}.dock-label{font-size:12px;font-weight:900;color:#e5faff;text-align:center}.dock-ships{display:flex;justify-content:space-evenly;align-items:center;gap:4px;min-height:48px;flex-wrap:wrap}.ship-token{position:relative;display:flex;gap:1px;padding:5px;border:1px solid #8bdfff99;border-radius:8px;background:linear-gradient(145deg,#4b7186,#1b4059);box-shadow:0 3px #0a2b43;touch-action:none;user-select:none}.ship-token span{display:block;width:clamp(12px,3.4vw,20px);height:clamp(16px,4.1vw,23px);background:linear-gradient(145deg,#e1e8e9,#6d8697);border:1px solid #304c60}.ship-token span:first-child{border-radius:55% 10% 10% 55%}.ship-token span:last-child{border-radius:10% 55% 55% 10%}.ship-token.active{outline:2px solid #ffe482}.ship-token.used{opacity:.22;pointer-events:none}.ship-art{position:absolute;inset:7%;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#1a3445;font-size:clamp(10px,3vw,16px);text-shadow:0 1px #d5e8ec}.battle-view{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;overflow:hidden}.battle-view .board-wrap{width:min(100%,min(42dvh,400px))}.battle-view .board{padding:3px;gap:1px;border-width:2px}.battle-view .board-title{padding:3px 8px}.battle-view .coord-top{font-size:9px}.battle-view .coord-left{font-size:9px}.battle-view .board-row .board{width:calc(100% - 23px)}.battle-view .status{font-size:12px;min-height:18px;padding:1px}.battle-separator{display:flex;align-items:center;justify-content:space-between;gap:6px;width:min(100%,400px);padding:3px 5px;background:linear-gradient(90deg,#03486d,#117c9a,#03486d);border:1px solid #1db0d2;border-radius:8px;box-shadow:0 0 11px #00b1e644;font-weight:950;font-size:11px;text-align:center}.battle-separator span{flex:1}.battle-separator .count{background:#0c3654;border-radius:6px;padding:3px 5px;flex:0 0 auto}.battle-view.enter .board-wrap:first-child{animation:rise .65s ease-out both}.battle-view.enter .board-wrap:last-child{animation:appear .65s ease-out both}@keyframes rise{from{transform:translateY(24vh);opacity:.65}to{transform:translateY(0);opacity:1}}@keyframes appear{from{transform:translateY(25vh);opacity:0}to{transform:translateY(0);opacity:1}}.splash{position:absolute;z-index:5;pointer-events:none;inset:0;display:grid;place-items:center;font-size:clamp(20px,6vw,36px);animation:burst .7s ease-out both}@keyframes burst{0%{transform:scale(.1);opacity:0}30%{opacity:1}100%{transform:scale(1.7);opacity:0}}.bottom{z-index:3;padding:6px 8px max(7px,env(safe-area-inset-bottom));gap:5px}.bottom button{font-size:12px;padding:8px 10px}.placement-status{font-size:12px;font-weight:850;color:#fff1b8;text-align:center}.placement-actions{display:flex;gap:6px;width:min(100%,450px)}.placement-actions button{flex:1}.ship-parts{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3vw,18px);color:#183d53;text-shadow:0 1px #e7f8ff}.cell.ship.bow{border-radius:40% 8% 8% 40%}.cell.ship.stern{border-radius:8% 40% 40% 8%}.cell.ship.vertical.bow{border-radius:40% 40% 8% 8%}.cell.ship.vertical.stern{border-radius:8% 8% 40% 40%}@media(max-height:720px){.battle-view .board-wrap{width:min(100%,min(39dvh,360px))}.battle-view{gap:2px}.top{padding:2px}.dock{padding:5px}.dock-ships{min-height:34px}.ship-token{padding:3px}.game{gap:3px}}@media(max-height:600px){.battle-view .board-wrap{width:min(100%,min(37dvh,310px))}.battle-view .coord-top,.battle-view .coord-left{font-size:8px}.top small{display:none}.board-title{font-size:10px}}
</style></head><body><div id="app"><header class="top"><h1>⚓ Ծովամարտ</h1><small>Գտի՛ր հակառակորդի նավերը</small></header><div id="view" class="game"></div><footer id="footer" class="bottom"></footer></div>
<script>
'use strict';
const N=10,FLEET=[5,4,3,3,2],$=s=>document.querySelector(s),view=$('#view'),footer=$('#footer');
let mode='',phase='menu',mine=null,theirs=null,turn=0,placeIndex=0,orientation=0,selected=null,peer=null,conn=null,room='',host=false,remoteReady=false,localReady=false,remoteTurn=false,session=0,aiMemory=[],audio=null,finished=false;
const clone=o=>JSON.parse(JSON.stringify(o)),rand=n=>Math.floor(Math.random()*n),idx=(x,y)=>y*N+x,xy=i=>[i%N,Math.floor(i/N)];
function beep(type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const tones=type==='hit'?[190,110]:type==='win'?[392,523,659,784]:type==='miss'?[500,380]:[480];tones.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type==='hit'?'sawtooth':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.06,now+i*.1+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.17);o.connect(g);g.connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+.18)})}catch(e){}}
function empty(){return {ships:[],shots:[]}}
function canPut(b,start,len,dir){const [x,y]=xy(start),cells=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx>=N||yy>=N)return null;cells.push(idx(xx,yy))}for(const ship of b.ships)for(const a of ship){for(const c of cells){const [ax,ay]=xy(a),[cx,cy]=xy(c);if(Math.abs(ax-cx)<=1&&Math.abs(ay-cy)<=1)return null}}return cells}
function randomBoard(){const b=empty();for(const len of FLEET){let options=[];for(let d=0;d<2;d++)for(let i=0;i<100;i++){const cells=canPut(b,i,len,d);if(cells)options.push(cells)}if(!options.length)return randomBoard();b.ships.push(options[rand(options.length)])}return b}
function hitAt(b,i){if(b.shots.includes(i))return null;b.shots.push(i);const ship=b.ships.find(s=>s.includes(i));return {hit:!!ship,sunk:!!ship&&ship.every(c=>b.shots.includes(c)),win:b.ships.every(s=>s.every(c=>b.shots.includes(c)))}}
function allHit(b){return b.ships.every(s=>s.every(c=>b.shots.includes(c)))}
function showMenu(){phase='menu';session++;cleanup();view.innerHTML='<section class="panel"><h2>Ընտրի՛ր խաղի ձևը</h2><p>5 նավ • 10×10 ծովային դաշտ • կրակոցներ հերթով</p><button class="choice" data-mode="ai"><span>🤖</span>Խաղալ համակարգչի դեմ</button><button class="choice" data-mode="local"><span>👫</span>Երկուսով՝ մեկ հեռախոսով</button><button class="choice" data-mode="online"><span>🌐</span>Երկու հեռախոսով՝ առցանց</button></section>';footer.innerHTML='';view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode))}
function cleanup(){try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}conn=null;peer=null;remoteReady=false;localReady=false;room='';finished=false}
function start(m){cleanup();mode=m;mine=empty();theirs=m==='ai'?randomBoard():empty();turn=0;placeIndex=0;orientation=0;selected=null;finished=false;if(m==='online')return onlineMenu();if(m==='local')return prepareLocal(0);phase='place';renderPlace()}
function boardHTML(b,opts={}){
 const show=opts.show??false,click=opts.click??null,board=document.createElement('div');board.className='board';board.setAttribute('role','grid');
 for(let i=0;i<N*N;i++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.dataset.i=i;
 const ship=b.ships.find(s=>s.includes(i)),shot=b.shots.includes(i);
 if(ship&&show){cell.classList.add('ship');const p=ship.indexOf(i);if(p===0)cell.classList.add('bow');if(p===ship.length-1)cell.classList.add('stern');if(ship.length>1&&ship[1]-ship[0]===N)cell.classList.add('vertical');if(p===Math.floor(ship.length/2)&&!shot){const detail=document.createElement('span');detail.className='ship-parts';detail.textContent=ship.length>=4?'⚙':'◆';cell.append(detail)}}
 if(shot){cell.classList.add(ship?'hit':'miss','fired');if(ship&&ship.every(c=>b.shots.includes(c)))cell.classList.add('sunk')}
 if(opts.ghost?.includes(i))cell.classList.add(opts.valid?'ghost':'invalid');
 cell.setAttribute('aria-label',String.fromCharCode(65+i%N)+(Math.floor(i/N)+1)+(shot?', կրակված':''));
 cell.disabled=shot||!click;if(click)cell.onclick=()=>click(i);board.append(cell)}
 return board
}
function framedBoard(b,opts={}){const frame=document.createElement('div');frame.className='board-wrap';const title=document.createElement('div');title.className='board-title';title.innerHTML='<span></span><span class="badge"></span>';title.children[0].textContent=opts.title||'';title.children[1].textContent=opts.subtitle||'';frame.append(title);const coords=document.createElement('div');coords.className='coord-top';for(let n=1;n<=N;n++){const el=document.createElement('span');el.textContent=n;coords.append(el)}frame.append(coords);const row=document.createElement('div');row.className='board-row';const letters=document.createElement('div');letters.className='coord-left';for(let n=0;n<N;n++){const el=document.createElement('span');el.textContent=String.fromCharCode(65+n);letters.append(el)}row.append(letters,boardHTML(b,opts));frame.append(row);return frame}

function shell(title,subtitle=''){view.innerHTML='';const head=document.createElement('div');head.className='board-title';head.innerHTML='<span>'+title+'</span><span class="badge">'+subtitle+'</span>';const wrap=document.createElement('div');wrap.className='board-wrap';wrap.append(head);view.append(wrap);return wrap}
function renderPlace(){
 phase='place';view.innerHTML='';const b=currentPlaceBoard(),len=FLEET[placeIndex];const f=framedBoard(b,{title:'⚓ ՔՈ ՆԱՎԵՐԸ',subtitle:(placeIndex)+' / '+FLEET.length});
 view.append(f);const board=f.querySelector('.board');
 let drag=null,hover=-1,ghost=[];
 function drawGhost(i){hover=i;ghost=i<0?[]:(canPut(b,i,len,orientation)||ghostCells(i,len,orientation));const valid=i>=0&&!!canPut(b,i,len,orientation);board.querySelectorAll('.cell').forEach((c,j)=>{c.classList.toggle('ghost',ghost.includes(j)&&valid);c.classList.toggle('invalid',ghost.includes(j)&&!valid)})}
 function place(i){const cells=canPut(b,i,len,orientation);if(!cells)return false;b.ships.push(cells);placeIndex++;selected=null;beep('place');if(placeIndex===FLEET.length){if(mode==='local'){if(turn===0)prepareLocal(1);else startBattle()}else if(mode==='online'){localReady=true;send({type:'ready'});waitOnline()}else startBattle()}else renderPlace();return true}
 board.querySelectorAll('.cell').forEach(c=>{c.onclick=()=>{if(drag)return;place(+c.dataset.i)}});
 const status=document.createElement('div');status.className='placement-status';status.textContent='Նավը ներքևից քաշի՛ր դեպի ծովը';view.append(status);
 const dock=document.createElement('div');dock.className='dock';dock.innerHTML='<div class="dock-label">🚢 ՆԱՎԵՐԻ ՆԱՎԱՀԱՆԳԻՍՏ · Քաշի՛ր և տեղադրի՛ր</div>';
 const dockShips=document.createElement('div');dockShips.className='dock-ships';
 FLEET.forEach((n,k)=>{const token=document.createElement('div');token.className='ship-token '+(k<placeIndex?'used':k===placeIndex?'active':'');token.dataset.len=n;token.innerHTML=Array.from({length:n},()=>'<span></span>').join('')+'<b class="ship-art">⚓</b>';if(k===placeIndex){
 token.addEventListener('pointerdown',e=>{e.preventDefault();token.setPointerCapture(e.pointerId);drag={id:e.pointerId};status.textContent='Բաց թող նավը ազատ վանդակների վրա';move(e)});
 token.addEventListener('pointermove',e=>{if(drag?.id===e.pointerId)move(e)});
 token.addEventListener('pointerup',e=>{if(drag?.id!==e.pointerId)return;const i=hover;drag=null;drawGhost(-1);if(i>=0&&!place(i))status.textContent='Այստեղ չի տեղավորվում։ Փորձի՛ր այլ տեղ'});
 token.addEventListener('pointercancel',()=>{drag=null;drawGhost(-1)});
 }dockShips.append(token)});
 dock.append(dockShips);view.append(dock);
 function move(e){const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el?.closest('.cell');const i=cell&&board.contains(cell)?+cell.dataset.i:-1;drawGhost(i)}
 const actions=document.createElement('div');actions.className='placement-actions';actions.innerHTML='<button class="secondary" id="rotate">↻ Պտտել նավը</button><button class="secondary" id="auto">🎲 Ավտոմատ դասավորել</button>';view.append(actions);
 actions.querySelector('#rotate').onclick=()=>{orientation=1-orientation;drawGhost(-1);status.textContent=orientation?'Ուղղահայաց նավ':'Հորիզոնական նավ'};
 actions.querySelector('#auto').onclick=()=>{b.ships=randomBoard().ships;placeIndex=FLEET.length;beep('place');if(mode==='local'){if(turn===0)prepareLocal(1);else startBattle()}else if(mode==='online'){localReady=true;send({type:'ready'});waitOnline()}else startBattle()};
 footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=confirmExit
}

function ghostCells(start,len,dir){const [x,y]=xy(start),a=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx<N&&yy<N)a.push(idx(xx,yy))}return a}
function currentPlaceBoard(){return mode==='local'?turn===0?mine:theirs:mine}
function prepareLocal(player){turn=player;placeIndex=0;orientation=0;selected=null;modal('🙈','Խաղացող '+(player+1),'Հեռախոսը փոխանցի՛ր խաղացող '+(player+1)+'-ին։ Մի՛ նայիր մյուսի նավերին։','Պատրաստ եմ',()=>{phase='place';renderPlace()})}
function startBattle(){phase='battle';turn=0;aiMemory=[];if(mode==='local')passTurn();else renderBattle(true)}
function passTurn(){modal('🔒','Փոխանցի՛ր հեռախոսը','Հիմա խաղում է խաղացող '+(turn+1)+'-ը։ Մյուս խաղացողը թող չնայի էկրանին։','Սկսել հերթը',renderBattle)}
function renderBattle(animate=false){
 phase='battle';view.innerHTML='';const opponent=mode==='local'?(turn===0?theirs:mine):theirs;
 const my=mode==='local'?(turn===0?mine:theirs):mine;
 const canFire=!finished&&!(mode==='online'&&remoteTurn)&&!(mode==='ai'&&turn===1);
 const stage=document.createElement('div');stage.className='battle-view'+(animate?' enter':'');
 stage.append(framedBoard(my,{title:'⚓ ՔՈ ՆԱՎԵՐԸ',subtitle:'Խորտակված՝ '+my.ships.filter(s=>s.every(c=>my.shots.includes(c))).length+'/'+FLEET.length,show:true}));
 const separator=document.createElement('div');separator.className='battle-separator';
 separator.innerHTML='<span class="count">🎯 '+opponent.shots.filter(i=>opponent.ships.some(s=>s.includes(i))).length+'</span><span></span><span class="count">⚓ '+FLEET.length+'</span>';
 separator.children[1].textContent=mode==='local'?'ԽԱՂԱՑՈՂ '+(turn+1)+' · ԿՐԱԿԻ՛Ր':mode==='online'?(remoteTurn?'ԸՆԿԵՐՈՋ ՀԵՐԹՆ Է':'ՔՈ ՀԵՐԹՆ Է · ԿՐԱԿԻ՛Ր'):(turn===1?'ՀԱՄԱԿԱՐԳԻՉՆ Է ԿՐԱԿՈՒՄ':'ՔՈ ՀԵՐԹՆ Է · ԿՐԱԿԻ՛Ր');
 stage.append(separator);
 stage.append(framedBoard(opponent,{title:'🎯 ՀԱԿԱՌԱԿՈՐԴԻ ԾՈՎԸ',subtitle:'10 × 10',show:false,click:canFire?fire:null}));
 view.append(stage);footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=confirmExit
}
function animateShot(boardIndex,cellIndex,hit,callback){
 const frames=view.querySelectorAll('.board');const board=frames[boardIndex];const cell=board?.querySelectorAll('.cell')[cellIndex];
 if(cell){const burst=document.createElement('span');burst.className='splash';burst.textContent=hit?'💥':'💦';cell.append(burst)}
 setTimeout(callback,650)
}

function fire(i){if(phase!=='battle'||finished)return;if(mode==='online'){if(remoteTurn||!conn?.open)return;send({type:'shot',i});remoteTurn=true;renderBattle();return}const b=mode==='local'?(turn===0?theirs:mine):theirs;const result=hitAt(b,i);if(!result)return;beep(result.hit?'hit':'miss');if(result.win)return victory(mode==='local'?'Խաղացող '+(turn+1):'Դու');if(mode==='local'){animateShot(1,i,result.hit,()=>{turn=1-turn;passTurn()})}else{turn=1;animateShot(1,i,result.hit,()=>{renderBattle();setTimeout(aiShot,850)})}}
function aiShot(){if(phase!=='battle'||mode!=='ai')return;const free=Array.from({length:100},(_,i)=>i).filter(i=>!mine.shots.includes(i));const options=aiMemory.filter(i=>free.includes(i));const pick=options.length?options[rand(options.length)]:free[rand(free.length)];const r=hitAt(mine,pick);if(r.hit){const [x,y]=xy(pick);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)aiMemory.push(idx(xx,yy))}if(r.sunk)aiMemory=[]}beep(r.hit?'hit':'miss');if(r.win)return victory('Համակարգիչը');animateShot(0,pick,r.hit,()=>{turn=0;renderBattle()})}
function victory(who){finished=true;phase='end';beep('win');modal('🏆',who==='Դու'?'Դու հաղթեցի՜ր':who+' հաղթեց', 'Բոլոր նավերը գտնված են։ Նորից խաղա՞նք։','Նոր խաղ',()=>start(mode),true)}
function modal(emoji,title,desc,button,action,menu=false){const old=view.querySelector('.overlay');if(old)old.remove();const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><div class="big wave">'+emoji+'</div><h2></h2><p></p><button class="primary"></button>'+(menu?'<button class="secondary" id="menuBtn">Գլխավոր մենյու</button>':'')+'</div>';o.querySelector('h2').textContent=title;o.querySelector('p').textContent=desc;o.querySelector('.primary').textContent=button;o.querySelector('.primary').onclick=()=>{o.remove();action()};view.append(o);if(menu)o.querySelector('#menuBtn').onclick=showMenu}
function confirmExit(){modal('⚓','Դուրս գա՞լ խաղից','Ընթացիկ խաղը կավարտվի։','Այո, մենյու',showMenu,true)}
function onlineMenu(){phase='online';view.innerHTML='<section class="panel"><h2>🌐 Առցանց ծովամարտ</h2><p>Երկու հեռախոսն էլ պետք է միացված լինեն ինտերնետին։ Մեկը ստեղծում է սենյակ, մյուսը միանում է կոդով։</p><button class="choice" id="create"><span>➕</span>Ստեղծել սենյակ</button><input class="field" id="code" placeholder="ՍԵՆՅԱԿԻ ԿՈԴԸ" maxlength="10" autocapitalize="characters"><button class="primary" id="join">Միանալ ընկերոջը</button><div class="info" id="netStatus">Կապը հաստատվում է առցանց ծառայության միջոցով։</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;$('#create').onclick=()=>connectPeer(true);$('#join').onclick=()=>connectPeer(false)}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Առցանց կապի գրադարանը չբեռնվեց'));document.head.append(script)})}
async function connectPeer(isHost){const mySession=++session;host=isHost;const status=$('#netStatus');status.textContent='Միանում ենք սերվերին…';try{await loadPeer();if(mySession!==session)return;room=isHost?Math.random().toString(36).slice(2,8).toUpperCase():$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(room))throw Error('Գրի՛ր 6 նիշանոց սենյակի կոդը');peer=new Peer('areg-sea-'+room+(isHost?'-h':'-g'),{debug:0});peer.on('error',e=>{if(mySession===session)networkError(e.type==='unavailable-id'?'Սենյակն արդեն զբաղված է':'Չհաջողվեց միանալ սերվերին')});peer.on('disconnected',()=>{if(mySession===session&&phase==='battle')networkError('Կապը ընդհատվել է')});peer.on('open',()=>{if(mySession!==session)return;if(isHost){peer.on('connection',c=>setupConnection(c));showRoom()}else{const c=peer.connect('areg-sea-'+room+'-h',{reliable:true});setupConnection(c)}})}catch(e){if(mySession===session)networkError(e.message)}}
function showRoom(){phase='room';view.innerHTML='<section class="panel"><h2>Սենյակը պատրաստ է</h2><p>Ուղարկի՛ր այս կոդը ընկերոջդ</p><div class="field" id="roomCode"></div><button class="secondary" id="copy">Պատճենել կոդը</button><p id="wait">Սպասում ենք ընկերոջը…</p></section>';$('#roomCode').textContent=room;$('#copy').onclick=()=>{navigator.clipboard?.writeText(room).then(()=>$('#wait').textContent='Կոդը պատճենված է').catch(()=>$('#wait').textContent='Ասա՛ ընկերոջդ կոդը՝ '+room)};footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu}
function setupConnection(c){conn=c;c.on('open',()=>{if(phase==='menu')return;remoteReady=false;localReady=false;mine=empty();theirs=empty();placeIndex=0;orientation=0;selected=null;phase='place';renderPlace()});c.on('data',handleMessage);c.on('close',()=>{if(phase!=='menu'&&phase!=='end')networkError('Ընկերդ անջատվել է')});c.on('error',()=>networkError('Կապի սխալ'))}
function send(data){if(conn?.open)conn.send(data)}
function handleMessage(d){if(!d||typeof d!=='object')return;if(d.type==='ready'){remoteReady=true;if(localReady&&phase==='waiting')startOnlineBattle()}if(d.type==='shot'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100)return;const r=hitAt(mine,d.i);if(!r)return;beep(r.hit?'hit':'miss');send({type:'result',i:d.i,hit:r.hit,sunk:r.sunk,win:r.win});if(r.win)return victory('Ընկերդ');animateShot(0,d.i,r.hit,()=>{remoteTurn=false;renderBattle()})}if(d.type==='result'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100||theirs.shots.includes(d.i))return;theirs.shots.push(d.i);if(d.hit)theirs.ships.push([d.i]);beep(d.hit?'hit':'miss');if(d.win)return victory('Դու');animateShot(1,d.i,!!d.hit,()=>{remoteTurn=true;renderBattle()})}}
function waitOnline(){phase='waiting';view.innerHTML='<section class="panel"><h2>🚢 Նավերը պատրաստ են</h2><p>Սպասում ենք, մինչև ընկերդ դասավորի իր նավերը։</p><div class="status wave">🌊 Սպասում ենք…</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;if(remoteReady&&localReady)startOnlineBattle()}
function startOnlineBattle(){phase='battle';remoteTurn=!host;renderBattle(true)}
function networkError(message){if(phase==='menu')return;phase='error';modal('📡','Առցանց կապի խնդիր',message,'Վերադառնալ',showMenu)}
showMenu();
</script></body></html>
