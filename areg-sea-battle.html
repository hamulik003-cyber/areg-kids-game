function aiShot(){if(phase!=='battle'||mode!=='ai')return;const free=Array.from({length:100},(_,i)=>i).filter(i=>!mine.shots.includes(i));const options=aiMemory.filter(i=>free.includes(i));const pick=options.length?options[rand(options.length)]:free[rand(free.length)];const r=hitAt(mine,pick);if(r.hit){const [x,y]=xy(pick);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)aiMemory.push(idx(xx,yy))}if(r.sunk)aiMemory=[]}shotBusy=true;animateShot(0,pick,r.hit,()=>{shotBusy=false;if(r.win)return victory('Համակարգիչը');turn=0;renderBattle()},r.sunk)}
function victory(who){finished=true;shotBusy=false;phase='end';beep('win');modal('🏆',who==='Դու'?'Դու հաղթեցի՜ր':who+' հաղթեց', 'Բոլոր նավերը գտնված են։ Նորից խաղա՞նք։','Նոր խաղ',()=>start(mode),true)}
function modal(emoji,title,desc,button,action,menu=false){const old=view.querySelector('.overlay');if(old)old.remove();const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><div class="modal-bubbles" aria-hidden="true">'+Array.from({length:13},(_,i)=>'<i style="--x:'+((i*37+9)%94)+'%;--s:'+(7+(i*11)%20)+'px;--d:'+(7+(i%5)*1.7)+'s;--delay:-'+(i*.93)+'s;--y:'+(8+i*7%85)+'%"></i>').join('')+'</div><div class="big wave">'+emoji+'</div><h2></h2><p></p><button class="primary"></button>'+(menu?'<button class="secondary" id="menuBtn">Գլխավոր մենյու</button>':'')+'</div>';o.querySelector('h2').textContent=title;o.querySelector('p').textContent=desc;o.querySelector('.primary').textContent=button;o.querySelector('.primary').onclick=()=>{o.remove();action()};view.append(o);if(menu)o.querySelector('#menuBtn').onclick=showMenu}

// Trial-only in-app family invitations. Presence works only while this page is open.
const FAMILY_ROLES={dad:'Հայրիկ',kiso:'Քրիստինա',alen:'Ալեն'};
const FAMILY_INVITE_LABELS={dad:'Հրավիրել Հայրիկին',kiso:'Հրավիրել Քրիստինային',alen:'Հրավիրել Ալենին'};
const PRESENCE_PREFIX='areg-test-sea-family-v1-';
function familyRole(){try{return localStorage.getItem('areg-sea-family-role')||''}catch(e){return ''}}
function saveFamilyRole(role){try{localStorage.setItem('areg-sea-family-role',role)}catch(e){}}
function changeFamilyRole(){try{presencePeer?.destroy()}catch(e){}presencePeer=null;saveFamilyRole('');onlineMenu()}
async function initPresence(){
 const role=familyRole();if(!FAMILY_ROLES[role]||presencePeer)return;
 presenceRole=role;
 try{
  await loadPeer();
  if(phase!=='online'||presencePeer)return;
  const p=new Peer(PRESENCE_PREFIX+role,{debug:0});presencePeer=p;
  p.on('connection',c=>{
   c.on('data',d=>{
    if(!d||d.type!=='family-invite'||!FAMILY_ROLES[d.from]||d.from===role||!/^[A-Z0-9]{6}$/.test(d.room)||!['online','room'].includes(phase))return;
    c.send({type:'family-delivered'});
    const from=FAMILY_ROLES[d.from];
    const overlay=document.createElement('div');overlay.className='overlay';
    overlay.innerHTML='<div class="modal"><div class="big">🚢</div><h2>Հրավեր ծովամարտի</h2><p>'+from+'ը հրավիրում է քեզ խաղալու։</p><div class="row"><button class="secondary" id="declineFamily">Մերժել</button><button class="primary" id="acceptFamily">Ընդունել</button></div></div>';
    document.querySelector('#app').append(overlay);
    overlay.querySelector('#declineFamily').onclick=()=>{c.send({type:'family-reply',accepted:false});overlay.remove()};
    overlay.querySelector('#acceptFamily').onclick=()=>{c.send({type:'family-reply',accepted:true});overlay.remove();if(phase!=='online')onlineMenu();const code=$('#code');if(code)code.value=d.room;connectPeer(false)};
   });
  });
  p.on('error',e=>{const el=$('#familyStatus');if(el)el.textContent=e.type==='unavailable-id'?'Այս անունով արդեն մեկ սարք միացված է։ Փակիր մյուս պատուհանը։':'Ընտանեկան կապը հասանելի չէ։'});
  p.on('open',()=>{const el=$('#familyStatus');if(el)el.textContent='🟢 '+FAMILY_ROLES[role]+' — պատրաստ է հրավեր ստանալու'});
 }catch(e){const el=$('#familyStatus');if(el)el.textContent='Հրավերների կապը չհաստատվեց'}
}
function sendFamilyInvite(target){
 if(!FAMILY_ROLES[target]||target===familyRole()||!room)return;
 const el=$('#wait');if(el)el.textContent='Փնտրում ենք '+FAMILY_ROLES[target]+'ին…';
 const c=presencePeer?.connect(PRESENCE_PREFIX+target,{reliable:true});
 if(!c){if(el)el.textContent='Ընտանեկան կապը հասանելի չէ';return}
 let answered=false,delivered=false;
 const timeout=setTimeout(()=>{if(!delivered&&!answered){if(el)el.textContent='Քրիստինայի կամ Ալենի խաղը հրավերը չի հաստատել։ Ստուգեք՝ խաղը բաց է և ճիշտ անունն է ընտրված։';try{c.close()}catch(e){}}},8000);
 c.on('open',()=>{c.send({type:'family-invite',from:familyRole(),room});if(el)el.textContent='Հրավերն ուղարկվում է…'});
 c.on('data',d=>{if(d?.type==='family-delivered'){delivered=true;clearTimeout(timeout);if(el)el.textContent='Հրավերը հայտնվել է մյուս հեռախոսում։ Սպասում ենք պատասխանին…'}if(d?.type==='family-reply'){answered=true;clearTimeout(timeout);if(el)el.textContent=d.accepted?'Հրավերն ընդունված է։ Միանում ենք…':'Հրավերը մերժվեց';c.close()}});
 c.on('error',()=>{if(el&&!answered)el.textContent='Չհաջողվեց ուղարկել հրավերը'});
 c.on('close',()=>{clearTimeout(timeout);if(el&&!answered&&!delivered)el.textContent='Ընկերը հասանելի չէ կամ կապն ընդհատվեց'});
}
function onlineMenu(inviteCode=''){
 document.querySelector('#app').classList.remove('combat-mode');phase='online';
 const role=familyRole();
 if(!FAMILY_ROLES[role]&&!inviteCode){
  view.innerHTML='<section class="panel"><h2>👨‍👩‍👦 Ընտանեկան խաղ</h2><p>Այս հեռախոսը ո՞ւմն է։ Ընտրիր մեկ անգամ։</p><button class="choice" data-role="dad">👨 Հայրիկ</button><button class="choice" data-role="kiso">👩 Քրիստինա</button><button class="choice" data-role="alen">👦 Ալեն</button><p>Անունը պահվում է միայն այս հեռախոսում։</p></section>';
  footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;
  view.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{saveFamilyRole(b.dataset.role);onlineMenu()});return;
 }
 view.innerHTML='<section class="panel"><h2>🌐 Առցանց ծովամարտ</h2><p>Երբ երկուսդ այս էջում եք, հրավիրիր անմիջապես խաղի մեջ՝ առանց հղման։</p><div class="info" id="familyStatus">Միանում ենք ընտանեկան կապին…</div><button class="choice" id="create"><span>🚢</span>Հրավիրել խաղի</button><details><summary>Միանալ կոդով (պահուստային տարբերակ)</summary><input class="field" id="code" placeholder="ՍԵՆՅԱԿԻ ԿՈԴԸ" maxlength="10" autocapitalize="characters"><button class="primary" id="join">Միանալ</button></details><div class="info" id="netStatus">Ընտանեկան հրավերները գործում են, երբ խաղը բաց է։</div></section>';
 footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';
 $('#home').onclick=showMenu;$('#create').onclick=()=>connectPeer(true);$('#join').onclick=()=>connectPeer(false);
 if(role){const settings=document.createElement('button');settings.className='secondary';settings.textContent='👤 Ես՝ '+FAMILY_ROLES[role]+' · Փոխել';settings.onclick=changeFamilyRole;view.querySelector('.panel').append(settings);initPresence();}
 if(inviteCode){$('#code').value=inviteCode;$('#netStatus').textContent='Հրավերը բացված է․ միանում ենք ընկերոջդ…';connectPeer(false)}
}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Առցանց կապի գրադարանը չբեռնվեց'));document.head.append(script)})}
async function connectPeer(isHost){const mySession=++session;host=isHost;const status=$('#netStatus');status.textContent='Միանում ենք սերվերին…';try{await loadPeer();if(mySession!==session)return;room=isHost?Math.random().toString(36).slice(2,8).toUpperCase():$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(room))throw Error('Գրի՛ր 6 նիշանոց սենյակի կոդը');peer=new Peer('areg-sea-'+room+(isHost?'-h':'-g'),{debug:0});peer.on('error',e=>{if(mySession===session)networkError(e.type==='unavailable-id'?'Սենյակն արդեն զբաղված է':'Չհաջողվեց միանալ սերվերին')});peer.on('disconnected',()=>{if(mySession===session&&phase==='battle')networkError('Կապը ընդհատվել է')});peer.on('open',()=>{if(mySession!==session)return;if(isHost){peer.on('connection',c=>setupConnection(c));showRoom()}else{const c=peer.connect('areg-sea-'+room+'-h',{reliable:true});setupConnection(c)}})}catch(e){if(mySession===session)networkError(e.message)}}
function showRoom(){
 phase='room';
 // A direct game URL opens the same trial HTML on any phone, even without the installed app.
 const inviteUrl=new URL('areg-sea-battle.html',location.href);
 inviteUrl.searchParams.set('invite',room);
 view.innerHTML='<section class="panel"><h2>🚢 Սենյակը պատրաստ է</h2><p>Ուղարկիր հրավերը Ալենին, Քիսոյին կամ ընկերոջդ։ Հղումը բացելիս նա ինքնաբերաբար կմիանա։</p><button class="primary" id="shareInvite">🔗 Հրավիրել ընկերոջը</button><button class="secondary" id="copyInvite">Պատճենել հրավերի հղումը</button><details><summary>Սենյակի պահուստային կոդը</summary><div class="field" id="roomCode"></div></details><p id="wait">Սպասում ենք ընկերոջը…</p></section>';
 $('#roomCode').textContent=room;
 const role=familyRole(),other=Object.keys(FAMILY_ROLES).filter(k=>k!==role);
 const box=document.createElement('div');box.className='row';box.style.flexDirection='column';
 other.forEach(k=>{const b=document.createElement('button');b.className='choice';b.style.width='100%';b.textContent='🎮 '+FAMILY_INVITE_LABELS[k];b.onclick=()=>sendFamilyInvite(k);box.append(b)});
 if(role&&FAMILY_ROLES[role]){view.querySelector('.panel').insertBefore(box,$('#shareInvite'));const who=document.createElement('button');who.className='secondary';who.textContent='👤 Ես՝ '+FAMILY_ROLES[role]+' · Փոխել';who.onclick=()=>{cleanup();changeFamilyRole()};view.querySelector('.panel').append(who)}
 const link=inviteUrl.toString();
 const copy=async()=>{try{await navigator.clipboard.writeText(link);$('#wait').textContent='Հղումը պատճենված է։ Ուղարկիր ընկերոջդ։'}catch(e){$('#wait').textContent='Պատճենիր հղումը՝ '+link}};
 $('#copyInvite').onclick=copy;
 $('#shareInvite').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Ծովամարտ՝ խաղանք միասին',text:'Միացիր իմ Ծովամարտին 🚢',url:link});return}catch(e){if(e.name==='AbortError')return}}await copy()};
 footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu
}
function setupConnection(c){conn=c;c.on('open',()=>{if(phase==='menu')return;remoteReady=false;localReady=false;mine=empty();theirs=empty();placeIndex=0;orientation=0;selected=null;phase='place';renderPlace()});c.on('data',handleMessage);c.on('close',()=>{if(phase!=='menu'&&phase!=='end')networkError('Ընկերդ անջատվել է')});c.on('error',()=>networkError('Կապի սխալ'))}
function send(data){if(conn?.open)conn.send(data)}
function handleMessage(d){
 if(!d||typeof d!=='object')return;
 if(d.type==='ready'){remoteReady=true;if(localReady&&phase==='waiting')startOnlineBattle()}
 if(d.type==='shot'){
  if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100)return;
  const r=hitAt(mine,d.i);if(!r)return;
  const sunkShip=r.sunk?mine.ships.find(ship=>ship.includes(d.i)):null;
  // Reveal full ship shape only on the final hit; keep all other ship locations secret.
  send({type:'result',i:d.i,hit:r.hit,sunk:r.sunk,win:r.win,
   ...(sunkShip?{shipCells:sunkShip.slice(),shipIndex:mine.ships.indexOf(sunkShip)}:{})});
  shotBusy=true;
  animateShot(0,d.i,r.hit,()=>{shotBusy=false;if(r.win)return victory('Ընկերդ');remoteTurn=false;renderBattle()},r.sunk)
 }
 if(d.type==='result'){
  if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100||theirs.shots.includes(d.i))return;
  theirs.shots.push(d.i);
  if(d.hit)onlineHits.add(d.i);
  if(d.hit&&d.sunk&&Array.isArray(d.shipCells)&&Number.isInteger(d.shipIndex)){
   const cells=d.shipCells;
   const valid=FLEET[d.shipIndex]===cells.length&&new Set(cells).size===cells.length&&
    cells.every(i=>Number.isInteger(i)&&i>=0&&i<100&&(i===d.i||theirs.shots.includes(i))&&onlineHits.has(i))&&
    cells.includes(d.i)&&!theirs.ships.some(ship=>ship.some(i=>cells.includes(i)));
   if(valid){
    const ordered=cells.slice().sort((a,b)=>a-b);
    const horizontal=ordered.every((i,k)=>k===0||(i===ordered[k-1]+1&&Math.floor(i/N)===Math.floor(ordered[k-1]/N)));
    const vertical=ordered.every((i,k)=>k===0||i===ordered[k-1]+N);
    if(horizontal||vertical){
     theirs.ships.push(ordered);
     onlineSunkAssets[ordered.join(',')]=d.shipIndex;
    }
   }
  }
  shotBusy=true;
  animateShot(1,d.i,!!d.hit,()=>{shotBusy=false;if(d.win)return victory('Դու');remoteTurn=true;renderBattle()},!!d.sunk)
 }
}
function waitOnline(){phase='waiting';view.innerHTML='<section class="panel"><h2>🚢 Նավերը պատրաստ են</h2><p>Սպասում ենք, մինչև ընկերդ դասավորի իր նավերը։</p><div class="status wave">🌊 Սպասում ենք…</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;if(remoteReady&&localReady)startOnlineBattle()}
function startOnlineBattle(){phase='battle';remoteTurn=!host;renderBattle(true)}
function networkError(message){if(phase==='menu')return;phase='error';modal('📡','Առցանց կապի խնդիր',message,'Վերադառնալ',showMenu)}

 if(e.target.closest('#app')&&!e.target.closest('input,textarea'))e.preventDefault();

const incomingInvite=new URLSearchParams(location.search).get('invite');
if(incomingInvite&&/^[A-Z0-9]{6}$/i.test(incomingInvite)){start('online');onlineMenu(incomingInvite.toUpperCase())}else showMenu();
