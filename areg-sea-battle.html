<script>
'use strict';
const N=10,FLEET=[5,4,3,3,2],$=s=>document.querySelector(s),view=$('#view'),footer=$('#footer');
let mode='',phase='menu',mine=null,theirs=null,turn=0,placeIndex=0,orientation=0,selected=null,peer=null,conn=null,room='',host=false,remoteReady=false,localReady=false,remoteTurn=false,session=0,aiMemory=[],audio=null,finished=false,shotBusy=false,previewNode=null;
const clone=o=>JSON.parse(JSON.stringify(o)),rand=n=>Math.floor(Math.random()*n),idx=(x,y)=>y*N+x,xy=i=>[i%N,Math.floor(i/N)];
function beep(type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const tones=type==='hit'?[140,90,70]:type==='win'?[392,523,659,784]:type==='miss'?[480,310]:type==='launch'?[680,420,240]:type==='sink'?[260,180,100]:type==='place'?[280,410]:[480];tones.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=['hit','launch','sink'].includes(type)?'sawtooth':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(type==='hit'?.09:.055,now+i*.1+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.22);o.connect(g);g.connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+.23)})}catch(e){}}
function empty(){return {ships:[],shots:[]}}
function canPut(b,start,len,dir){const [x,y]=xy(start),cells=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx>=N||yy>=N)return null;cells.push(idx(xx,yy))}for(const ship of b.ships)for(const a of ship){for(const c of cells){const [ax,ay]=xy(a),[cx,cy]=xy(c);if(Math.abs(ax-cx)<=1&&Math.abs(ay-cy)<=1)return null}}return cells}
function randomBoard(){const b=empty();for(const len of FLEET){let options=[];for(let d=0;d<2;d++)for(let i=0;i<100;i++){const cells=canPut(b,i,len,d);if(cells)options.push(cells)}if(!options.length)return randomBoard();b.ships.push(options[rand(options.length)])}return b}
function hitAt(b,i){if(b.shots.includes(i))return null;b.shots.push(i);const ship=b.ships.find(s=>s.includes(i));return {hit:!!ship,sunk:!!ship&&ship.every(c=>b.shots.includes(c)),win:b.ships.every(s=>s.every(c=>b.shots.includes(c)))}}
function allHit(b){return b.ships.every(s=>s.every(c=>b.shots.includes(c)))}
function showMenu(){phase='menu';session++;cleanup();shotBusy=false;view.innerHTML='<section class="panel"><h2>Ընտրի՛ր խաղի ձևը</h2><p>5 նավ • 10×10 ծովային դաշտ • կրակոցներ հերթով</p><button class="choice" data-mode="ai"><span>🤖</span>Խաղալ համակարգչի դեմ</button><button class="choice" data-mode="local"><span>👫</span>Երկուսով՝ մեկ հեռախոսով</button><button class="choice" data-mode="online"><span>🌐</span>Երկու հեռախոսով՝ առցանց</button></section>';footer.innerHTML='';view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode))}
function cleanup(){previewNode?.remove();previewNode=null;try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}conn=null;peer=null;remoteReady=false;localReady=false;room='';finished=false}
function start(m){cleanup();shotBusy=false;mode=m;mine=empty();theirs=m==='ai'?randomBoard():empty();turn=0;placeIndex=0;orientation=0;selected=null;finished=false;if(m==='online')return onlineMenu();if(m==='local')return prepareLocal(0);phase='place';renderPlace()}
function boardHTML(b,opts={}){
 const show=opts.show??false,click=opts.click??null,board=document.createElement('div');board.className='board';board.setAttribute('role','grid');
 for(let i=0;i<N*N;i++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.dataset.i=i;
 const ship=b.ships.find(s=>s.includes(i)),shot=b.shots.includes(i);
 if(ship&&show){cell.classList.add('ship');const p=ship.indexOf(i);cell.setAttribute('data-ship-size',ship.length);if(p===0)cell.classList.add('bow');if(p===ship.length-1)cell.classList.add('stern');if(ship.length>1&&ship[1]-ship[0]===N)cell.classList.add('vertical');if(p===Math.floor(ship.length/2)&&!shot){const detail=document.createElement('span');detail.className='ship-parts';detail.textContent=ship.length>=4?'⚙':'◆';cell.append(detail)}}
 if(shot){cell.classList.add(ship?'hit':'miss','fired');if(ship&&ship.every(c=>b.shots.includes(c)))cell.classList.add('sunk')}

 cell.disabled=shot||(!click&&!opts.place);if(click)cell.onclick=()=>click(i);board.append(cell)}
 return board
}
function framedBoard(b,opts={}){const frame=document.createElement('div');frame.className='board-wrap';const title=document.createElement('div');title.className='board-title';title.innerHTML='<span></span><span class="badge"></span>';title.children[0].textContent=opts.title||'';title.children[1].textContent=opts.subtitle||'';frame.append(title);const coords=document.createElement('div');coords.className='coord-top';for(let n=1;n<=N;n++){const el=document.createElement('span');el.textContent=n;coords.append(el)}frame.append(coords);const row=document.createElement('div');row.className='board-row';const letters=document.createElement('div');letters.className='coord-left';for(let n=0;n<N;n++){const el=document.createElement('span');el.textContent=String.fromCharCode(65+n);letters.append(el)}row.append(letters,boardHTML(b,opts));frame.append(row);return frame}

function shell(title,subtitle=''){view.innerHTML='';const head=document.createElement('div');head.className='board-title';head.innerHTML='<span>'+title+'</span><span class="badge">'+subtitle+'</span>';const wrap=document.createElement('div');wrap.className='board-wrap';wrap.append(head);view.append(wrap);return wrap}
function renderPlace(){
 phase='place';view.innerHTML='';const b=currentPlaceBoard(),len=FLEET[placeIndex]||0;const f=framedBoard(b,{title:'⚓ ՔՈ ՆԱՎԵՐԸ',subtitle:(placeIndex)+' / '+FLEET.length,place:true,show:true});
 view.append(f);const board=f.querySelector('.board');
 let drag=null,hover=-1,ghost=[],suppressPlacementClickUntil=0;
 function drawGhost(i){hover=i;/* Never paint valid/invalid placement cells: only the actual ship follows the finger. */}
 function place(i){if(!len)return false;const cells=canPut(b,i,len,orientation);if(!cells)return false;suppressPlacementClickUntil=Date.now()+500;b.ships.push(cells);placeIndex++;selected=null;beep('place');renderPlace();return true}
 board.querySelectorAll('.cell').forEach(c=>{c.onclick=()=>{if(drag||Date.now()<suppressPlacementClickUntil)return;const i=+c.dataset.i;if(b.ships.some(ship=>ship.includes(i)))return;place(i)}});
 const status=document.createElement('div');status.className='placement-status';status.textContent=placeIndex===FLEET.length?'Բոլոր նավերը տեղադրված են։ Սեղմի՛ր «Պատրաստ է»':'Նավը ներքևից քաշի՛ր դեպի ծովը';view.append(status);
 const dock=document.createElement('div');dock.className='dock';dock.innerHTML='<div class="dock-label">🚢 ՆԱՎԵՐԻ ՆԱՎԱՀԱՆԳԻՍՏ · Քաշի՛ր և տեղադրի՛ր</div>';
 const dockShips=document.createElement('div');dockShips.className='dock-ships';
 FLEET.forEach((n,k)=>{const token=document.createElement('div');token.className='ship-token '+(k<placeIndex?'used':k===placeIndex?'active':'');token.dataset.len=n;token.innerHTML=Array.from({length:n},()=>'<span></span>').join('')+'<b class="ship-art">⚓</b>';if(k===placeIndex){

 let lastTap=0;
 function dragGhost(x,y){if(!previewNode){previewNode=document.createElement('div');previewNode.className='ship-drag-float';previewNode.innerHTML=Array.from({length:len},()=>'<span></span>').join('');document.body.append(previewNode)}previewNode.classList.toggle('vertical',orientation===1);previewNode.style.left=x+'px';previewNode.style.top=y+'px';previewNode.style.visibility='visible'}
 function clearDrag(){previewNode?.remove();previewNode=null;drag=null;drawGhost(-1)}
 token.addEventListener('pointerdown',e=>{
  e.preventDefault();const now=Date.now();
  if(now-lastTap<330){orientation=1-orientation;status.textContent=orientation?'Նավը՝ ուղղահայաց':'Նավը՝ հորիզոնական';lastTap=0;return}
  lastTap=now;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
  try{token.setPointerCapture(e.pointerId)}catch(_){}
  dragGhost(e.clientX,e.clientY);beep('place');move(e)
});
 token.addEventListener('pointermove',e=>{if(drag?.id!==e.pointerId)return;drag.moved=drag.moved||Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8;dragGhost(e.clientX,e.clientY);move(e)});
 token.addEventListener('pointerup',e=>{
 if(drag?.id!==e.pointerId)return;
 move(e);const i=hover,wasMoved=drag.moved;clearDrag();
 if(wasMoved&&i>=0){suppressPlacementClickUntil=Date.now()+500;if(!place(i))status.textContent='Այստեղ նավը չի տեղավորվում'}
 else if(wasMoved)status.textContent='Քաշի՛ր նավը դեպի կապույտ խաղադաշտ';
});
 token.addEventListener('pointercancel',clearDrag);token.style.touchAction='none';

 }dockShips.append(token)});
 dock.append(dockShips);view.append(dock);
 function move(e){
  // Calculate the target from board geometry rather than hit-testing through
  // iOS pointer capture, the floating ship or nested iframe elements.
  const rect=board.getBoundingClientRect(),style=getComputedStyle(board);
  const padL=parseFloat(style.paddingLeft)||0,padT=parseFloat(style.paddingTop)||0;
  const padR=parseFloat(style.paddingRight)||0,padB=parseFloat(style.paddingBottom)||0;
  const gap=parseFloat(style.columnGap)||0,rowGap=parseFloat(style.rowGap)||0;
  const width=(rect.width-padL-padR-gap*(N-1))/N;
  const height=(rect.height-padT-padB-rowGap*(N-1))/N;
  const x=e.clientX-rect.left-padL,y=e.clientY-rect.top-padT;
  const col=Math.floor(x/(width+gap)),row=Math.floor(y/(height+rowGap));
  drawGhost(col>=0&&col<N&&row>=0&&row<N?idx(col,row):-1);
}
 const actions=document.createElement('div');actions.className='placement-actions';actions.innerHTML='<button class="secondary" id="rotate">↻ Պտտել նավը</button><button class="secondary" id="auto">🎲 Ավտոմատ դասավորել</button>'+(placeIndex===FLEET.length?'<button class="primary" id="ready">ՊԱՏՐԱՍՏ Է ✓</button>':'');view.append(actions);
 actions.querySelector('#rotate').onclick=()=>{orientation=1-orientation;drawGhost(-1);status.textContent=orientation?'Ուղղահայաց նավ':'Հորիզոնական նավ'};
 actions.querySelector('#auto').onclick=()=>{b.ships=randomBoard().ships;placeIndex=FLEET.length;beep('place');renderPlace()};const ready=actions.querySelector('#ready');if(ready)ready.onclick=()=>{if(mode==='local'){if(turn===0)prepareLocal(1);else startBattle()}else if(mode==='online'){localReady=true;send({type:'ready'});waitOnline()}else startBattle()};
 footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=confirmExit
}

function ghostCells(start,len,dir){const [x,y]=xy(start),a=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx<N&&yy<N)a.push(idx(xx,yy))}return a}
function currentPlaceBoard(){return mode==='local'?turn===0?mine:theirs:mine}
function prepareLocal(player){turn=player;placeIndex=0;orientation=0;selected=null;modal('🙈','Խաղացող '+(player+1),'Հեռախոսը փոխանցի՛ր խաղացող '+(player+1)+'-ին։ Մի՛ նայիր մյուսի նավերին։','Պատրաստ եմ',()=>{phase='place';renderPlace()})}
function startBattle(){phase='battle';turn=0;aiMemory=[];if(mode==='local')passTurn();else renderBattle(true)}
function passTurn(){modal('🔒','Փոխանցի՛ր հեռախոսը','Հիմա խաղում է խաղացող '+(turn+1)+'-ը։ Մյուս խաղացողը թող չնայի էկրանին։','Սկսել հերթը',renderBattle)}
function renderBattle(animate=false){
 phase='battle';view.innerHTML='';const opponent=mode==='local'?(turn===0?theirs:mine):theirs;
 const my=mode==='local'?(turn===0?mine:theirs):mine;
 const canFire=!finished&&!shotBusy&&!(mode==='online'&&remoteTurn)&&!(mode==='ai'&&turn===1);
 const stage=document.createElement('div');stage.className='battle-view'+(animate?' enter':'');
 stage.append(framedBoard(my,{title:'⚓ ՔՈ ՆԱՎԵՐԸ',subtitle:'Խորտակված՝ '+my.ships.filter(s=>s.every(c=>my.shots.includes(c))).length+'/'+FLEET.length,show:true}));
 const separator=document.createElement('div');separator.className='battle-separator '+((mode==='online'&&remoteTurn)||(mode==='ai'&&turn===1)?'enemy-turn':'own-turn');
 separator.innerHTML='<span class="count">🎯 '+opponent.shots.filter(i=>opponent.ships.some(s=>s.includes(i))).length+'</span><span></span><span class="count">⚓ '+FLEET.length+'</span>';
 separator.children[1].textContent=mode==='local'?'ԽԱՂԱՑՈՂ '+(turn+1)+' · ԿՐԱԿԻ՛Ր':mode==='online'?(remoteTurn?'ԸՆԿԵՐՈՋ ՀԵՐԹՆ Է':'ՔՈ ՀԵՐԹՆ Է · ԿՐԱԿԻ՛Ր'):(turn===1?'ՀԱՄԱԿԱՐԳԻՉՆ Է ԿՐԱԿՈՒՄ':'ՔՈ ՀԵՐԹՆ Է · ԿՐԱԿԻ՛Ր');
 stage.append(separator);
 stage.append(framedBoard(opponent,{title:'🎯 ՀԱԿԱՌԱԿՈՐԴԻ ԾՈՎԸ',subtitle:'10 × 10',show:false,click:canFire?fire:null}));
 view.append(stage);footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=confirmExit
}
function animateShot(boardIndex,cellIndex,hit,callback,sunk=false){
 const frames=view.querySelectorAll('.board'),board=frames[boardIndex],cell=board?.querySelectorAll('.cell')[cellIndex];
 if(!cell){callback();return}
 const from=frames[1-boardIndex]?.getBoundingClientRect(),to=cell.getBoundingClientRect();
 const x=to.left+to.width/2,y=to.top+to.height/2;
 const startX=from?from.left+from.width/2:x,startY=from?from.top+from.height/2:y+130;
 const missile=document.createElement('div');missile.className='shot-missile';missile.style.left=startX+'px';missile.style.top=startY+'px';document.body.append(missile);
 const dx=x-startX,dy=y-startY,angle=Math.atan2(dy,dx)*180/Math.PI+90;
 missile.style.transform='rotate('+angle+'deg)';beep('launch');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{missile.style.transform='translate('+dx+'px,'+dy+'px) rotate('+angle+'deg) scale(.65)'}));
 setTimeout(()=>{missile.remove();const burst=document.createElement('span');burst.className='splash';burst.textContent=hit?(sunk?'🔥':'💥'):'💦';cell.append(burst);beep(sunk?'sink':hit?'hit':'miss');if(hit&&navigator.vibrate)navigator.vibrate(sunk?[70,45,90]:[45,25,50]);setTimeout(()=>{burst.remove();callback()},360)},510)
}

function fire(i){
 if(phase!=='battle'||finished||shotBusy)return;
 if(mode==='online'){if(remoteTurn||!conn?.open||theirs.shots.includes(i))return;shotBusy=true;send({type:'shot',i});remoteTurn=true;renderBattle();return}
 const b=mode==='local'?(turn===0?theirs:mine):theirs,r=hitAt(b,i);if(!r)return;
 shotBusy=true;
 animateShot(1,i,r.hit,()=>{
  shotBusy=false;
  if(r.win)return victory(mode==='local'?'Խաղացող '+(turn+1):'Դու');
  if(mode==='local'){turn=1-turn;passTurn()}else{turn=1;renderBattle();setTimeout(aiShot,750)}
 },r.sunk)
}

function aiShot(){if(phase!=='battle'||mode!=='ai')return;const free=Array.from({length:100},(_,i)=>i).filter(i=>!mine.shots.includes(i));const options=aiMemory.filter(i=>free.includes(i));const pick=options.length?options[rand(options.length)]:free[rand(free.length)];const r=hitAt(mine,pick);if(r.hit){const [x,y]=xy(pick);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)aiMemory.push(idx(xx,yy))}if(r.sunk)aiMemory=[]}shotBusy=true;animateShot(0,pick,r.hit,()=>{shotBusy=false;if(r.win)return victory('Համակարգիչը');turn=0;renderBattle()},r.sunk)}
function victory(who){finished=true;shotBusy=false;phase='end';beep('win');modal('🏆',who==='Դու'?'Դու հաղթեցի՜ր':who+' հաղթեց', 'Բոլոր նավերը գտնված են։ Նորից խաղա՞նք։','Նոր խաղ',()=>start(mode),true)}
function modal(emoji,title,desc,button,action,menu=false){const old=view.querySelector('.overlay');if(old)old.remove();const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><div class="big wave">'+emoji+'</div><h2></h2><p></p><button class="primary"></button>'+(menu?'<button class="secondary" id="menuBtn">Գլխավոր մենյու</button>':'')+'</div>';o.querySelector('h2').textContent=title;o.querySelector('p').textContent=desc;o.querySelector('.primary').textContent=button;o.querySelector('.primary').onclick=()=>{o.remove();action()};view.append(o);if(menu)o.querySelector('#menuBtn').onclick=showMenu}
function confirmExit(){modal('⚓','Դուրս գա՞լ խաղից','Ընթացիկ խաղը կավարտվի։','Այո, մենյու',showMenu,true)}
function onlineMenu(){phase='online';view.innerHTML='<section class="panel"><h2>🌐 Առցանց ծովամարտ</h2><p>Երկու հեռախոսն էլ պետք է միացված լինեն ինտերնետին։ Մեկը ստեղծում է սենյակ, մյուսը միանում է կոդով։</p><button class="choice" id="create"><span>➕</span>Ստեղծել սենյակ</button><input class="field" id="code" placeholder="ՍԵՆՅԱԿԻ ԿՈԴԸ" maxlength="10" autocapitalize="characters"><button class="primary" id="join">Միանալ ընկերոջը</button><div class="info" id="netStatus">Կապը հաստատվում է առցանց ծառայության միջոցով։</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;$('#create').onclick=()=>connectPeer(true);$('#join').onclick=()=>connectPeer(false)}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Առցանց կապի գրադարանը չբեռնվեց'));document.head.append(script)})}
async function connectPeer(isHost){const mySession=++session;host=isHost;const status=$('#netStatus');status.textContent='Միանում ենք սերվերին…';try{await loadPeer();if(mySession!==session)return;room=isHost?Math.random().toString(36).slice(2,8).toUpperCase():$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(room))throw Error('Գրի՛ր 6 նիշանոց սենյակի կոդը');peer=new Peer('areg-sea-'+room+(isHost?'-h':'-g'),{debug:0});peer.on('error',e=>{if(mySession===session)networkError(e.type==='unavailable-id'?'Սենյակն արդեն զբաղված է':'Չհաջողվեց միանալ սերվերին')});peer.on('disconnected',()=>{if(mySession===session&&phase==='battle')networkError('Կապը ընդհատվել է')});peer.on('open',()=>{if(mySession!==session)return;if(isHost){peer.on('connection',c=>setupConnection(c));showRoom()}else{const c=peer.connect('areg-sea-'+room+'-h',{reliable:true});setupConnection(c)}})}catch(e){if(mySession===session)networkError(e.message)}}
function showRoom(){phase='room';view.innerHTML='<section class="panel"><h2>Սենյակը պատրաստ է</h2><p>Ուղարկի՛ր այս կոդը ընկերոջդ</p><div class="field" id="roomCode"></div><button class="secondary" id="copy">Պատճենել կոդը</button><p id="wait">Սպասում ենք ընկերոջը…</p></section>';$('#roomCode').textContent=room;$('#copy').onclick=()=>{navigator.clipboard?.writeText(room).then(()=>$('#wait').textContent='Կոդը պատճենված է').catch(()=>$('#wait').textContent='Ասա՛ ընկերոջդ կոդը՝ '+room)};footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu}
function setupConnection(c){conn=c;c.on('open',()=>{if(phase==='menu')return;remoteReady=false;localReady=false;mine=empty();theirs=empty();placeIndex=0;orientation=0;selected=null;phase='place';renderPlace()});c.on('data',handleMessage);c.on('close',()=>{if(phase!=='menu'&&phase!=='end')networkError('Ընկերդ անջատվել է')});c.on('error',()=>networkError('Կապի սխալ'))}
function send(data){if(conn?.open)conn.send(data)}
function handleMessage(d){if(!d||typeof d!=='object')return;if(d.type==='ready'){remoteReady=true;if(localReady&&phase==='waiting')startOnlineBattle()}if(d.type==='shot'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100)return;const r=hitAt(mine,d.i);if(!r)return;beep(r.hit?'hit':'miss');send({type:'result',i:d.i,hit:r.hit,sunk:r.sunk,win:r.win});shotBusy=true;animateShot(0,d.i,r.hit,()=>{shotBusy=false;if(r.win)return victory('Ընկերդ');remoteTurn=false;renderBattle()},r.sunk)}if(d.type==='result'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=100||theirs.shots.includes(d.i))return;theirs.shots.push(d.i);if(d.hit)theirs.ships.push([d.i]);beep(d.hit?'hit':'miss');shotBusy=true;animateShot(1,d.i,!!d.hit,()=>{shotBusy=false;if(d.win)return victory('Դու');remoteTurn=true;renderBattle()},!!d.sunk)}}
function waitOnline(){phase='waiting';view.innerHTML='<section class="panel"><h2>🚢 Նավերը պատրաստ են</h2><p>Սպասում ենք, մինչև ընկերդ դասավորի իր նավերը։</p><div class="status wave">🌊 Սպասում ենք…</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;if(remoteReady&&localReady)startOnlineBattle()}
function startOnlineBattle(){phase='battle';remoteTurn=!host;renderBattle(true)}
function networkError(message){if(phase==='menu')return;phase='error';modal('📡','Առցանց կապի խնդիր',message,'Վերադառնալ',showMenu)}
showMenu();
