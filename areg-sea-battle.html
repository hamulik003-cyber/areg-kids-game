<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ծովամարտ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071e35;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#286e92,#0b3657 45%,#071e35 90%)}#app:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 30px,#ffffff05 31px 32px);pointer-events:none}.top{position:relative;text-align:center;padding:9px 12px 5px;flex-shrink:0}.top h1{font-size:clamp(21px,5vw,29px);margin:0;font-weight:950;letter-spacing:.5px}.top small{color:#b4dce7;font-weight:750}.panel{position:relative;margin:auto 12px;display:flex;flex-direction:column;gap:12px;padding:17px 13px;border:1px solid #9cd9eb55;border-radius:25px;background:linear-gradient(150deg,#174d6fef,#0a2a47f5);box-shadow:0 16px 40px #0017;max-height:calc(100% - 85px);overflow:auto}.panel h2{margin:0;text-align:center;font-size:20px}.panel p{margin:0;text-align:center;color:#d1e9ee;font-size:14px;line-height:1.45}.choice{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 13px;border-radius:17px;background:linear-gradient(130deg,#267a9c,#15506d);border:1px solid #9be5ee66;box-shadow:0 5px #09263b;font-weight:850;font-size:16px}.choice span{font-size:30px}.primary{background:linear-gradient(#ffdd77,#eea83d);color:#533312;font-weight:950;border-radius:15px;padding:13px 16px;box-shadow:0 5px #9d6429}.secondary{background:#256582;border:1px solid #77bcd1aa;border-radius:14px;padding:10px 12px;font-weight:850}.primary:disabled,.secondary:disabled{opacity:.45}.row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.row>*{flex:1}.status{text-align:center;font-size:14px;font-weight:850;color:#fff4b7;min-height:25px;padding:3px 9px}.game{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:5px;padding:0 10px 10px}.board-wrap{width:min(100%,min(55dvh,430px));display:flex;flex-direction:column;align-items:center;gap:6px}.board-title{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:850;color:#c5e9f2}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;padding:6px;background:linear-gradient(135deg,#75c9d8,#246a8b);border:3px solid #a3e7ed;border-radius:14px;box-shadow:0 7px 0 #073049,0 12px 25px #0017}.cell{min-width:0;min-height:0;position:relative;border-radius:5px;background:linear-gradient(140deg,#3197bb,#1b709a);border:1px solid #ffffff24;display:grid;place-items:center;font-size:clamp(12px,4vw,22px);touch-action:manipulation;transition:background .2s}.cell:disabled{cursor:default}.cell.ship{background:linear-gradient(140deg,#becdd3,#667f91);box-shadow:inset 0 2px #ffffff8a,inset 0 -3px #304a60}.cell.hit{background:radial-gradient(circle,#ffcc6b,#d24c36 68%,#753b40);animation:impact .4s both}.cell.miss{background:#195a82}.cell.miss:after{content:"•";color:#e1f7ff;font-size:24px}.cell.sunk{background:#783943}.cell.selected{outline:3px solid #ffda73;z-index:2}.cell.hint{box-shadow:inset 0 0 0 3px #ffe79c}.cell.ghost{background:#87bd9b}.cell.invalid{background:#bd5360}.cell:focus-visible{outline:3px solid #fff}.cell.fired{pointer-events:none}@keyframes impact{from{transform:scale(1.2)}to{transform:scale(1)}}.bottom{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 10px max(11px,env(safe-area-inset-bottom));background:#09273ed9;border-top:1px solid #ffffff22}.bottom button{font-size:13px}.fleet{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.ship-pill{padding:9px 12px;border:1px solid #9ad5e4;border-radius:13px;background:#245c78;font-weight:850;font-size:15px}.ship-pill.active{background:#e6af54;color:#41290f;border-color:#fff2a2}.ship-pill.done{background:#357b63;color:#dcfff0}.badge{padding:3px 9px;border-radius:10px;background:#143b57;font-size:12px}.overlay{position:absolute;inset:0;z-index:15;background:#041727f0;display:flex;align-items:center;justify-content:center;padding:17px}.modal{width:min(100%,390px);border:2px solid #8cd7e8;border-radius:24px;padding:23px 18px;background:linear-gradient(#1c6381,#0b304e);display:flex;flex-direction:column;gap:13px;text-align:center;box-shadow:0 20px 50px #0009}.modal h2{margin:0;font-size:24px}.modal p{margin:0;color:#d2f0f4;line-height:1.5}.modal .big{font-size:60px}.field{padding:12px;border-radius:12px;background:#e8f5f4;color:#0b314c;border:0;width:100%;text-align:center;font-weight:850;font-size:19px;letter-spacing:1px}.hide{display:none!important}.info{font-size:12px;color:#c1dbe2;text-align:center}.turn-tag{font-size:14px;font-weight:850;text-align:center}.wave{animation:wave 1.4s ease-in-out infinite alternate}@keyframes wave{to{transform:translateY(-4px)}}@media(max-height:700px){.top{padding:4px}.top h1{font-size:19px}.game{gap:2px}.board-wrap{width:min(100%,min(51dvh,370px))}.board-title{font-size:11px}.bottom{padding:6px}.panel{gap:9px;padding:12px}}@media(max-height:560px){.board-wrap{width:min(100%,min(46dvh,280px))}.top small{display:none}.board{gap:1px;padding:4px}.bottom button{padding:7px}}
</style></head><body><div id="app"><header class="top"><h1>⚓ Ծովամարտ</h1><small>Գտի՛ր հակառակորդի նավերը</small></header><div id="view" class="game"></div><footer id="footer" class="bottom"></footer></div>
<script>
'use strict';
const N=8,FLEET=[4,3,3,2,2,1,1],$=s=>document.querySelector(s),view=$('#view'),footer=$('#footer');
let mode='',phase='menu',mine=null,theirs=null,turn=0,placeIndex=0,orientation=0,selected=null,peer=null,conn=null,room='',host=false,remoteReady=false,remoteTurn=false,session=0,aiMemory=[],audio=null,finished=false;
const clone=o=>JSON.parse(JSON.stringify(o)),rand=n=>Math.floor(Math.random()*n),idx=(x,y)=>y*N+x,xy=i=>[i%N,Math.floor(i/N)];
function beep(type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const tones=type==='hit'?[190,110]:type==='win'?[392,523,659,784]:type==='miss'?[500,380]:[480];tones.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type==='hit'?'sawtooth':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.06,now+i*.1+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.17);o.connect(g);g.connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+.18)})}catch(e){}}
function empty(){return {ships:[],shots:[]}}
function canPut(b,start,len,dir){const [x,y]=xy(start),cells=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx>=N||yy>=N)return null;cells.push(idx(xx,yy))}for(const ship of b.ships)for(const a of ship){for(const c of cells){const [ax,ay]=xy(a),[cx,cy]=xy(c);if(Math.abs(ax-cx)<=1&&Math.abs(ay-cy)<=1)return null}}return cells}
function randomBoard(){const b=empty();for(const len of FLEET){let options=[];for(let d=0;d<2;d++)for(let i=0;i<64;i++){const cells=canPut(b,i,len,d);if(cells)options.push(cells)}if(!options.length)return randomBoard();b.ships.push(options[rand(options.length)])}return b}
function hitAt(b,i){if(b.shots.includes(i))return null;b.shots.push(i);const ship=b.ships.find(s=>s.includes(i));return {hit:!!ship,sunk:!!ship&&ship.every(c=>b.shots.includes(c)),win:b.ships.every(s=>s.every(c=>b.shots.includes(c)))}}
function allHit(b){return b.ships.every(s=>s.every(c=>b.shots.includes(c)))}
function showMenu(){phase='menu';session++;cleanup();view.innerHTML='<section class="panel"><h2>Ընտրի՛ր խաղի ձևը</h2><p>7 նավ • 8×8 ծովային դաշտ • կրակոցներ հերթով</p><button class="choice" data-mode="ai"><span>🤖</span>Խաղալ համակարգչի դեմ</button><button class="choice" data-mode="local"><span>👫</span>Երկուսով՝ մեկ հեռախոսով</button><button class="choice" data-mode="online"><span>🌐</span>Երկու հեռախոսով՝ առցանց</button></section>';footer.innerHTML='';view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode))}
function cleanup(){try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}conn=null;peer=null;remoteReady=false;room='';finished=false}
function start(m){cleanup();mode=m;mine=empty();theirs=m==='ai'?randomBoard():empty();turn=0;placeIndex=0;orientation=0;selected=null;finished=false;if(m==='online')return onlineMenu();if(m==='local')return prepareLocal(0);phase='place';renderPlace()}
function boardHTML(b,opts={}){const show=opts.show??false,attack=opts.attack??false,click=opts.click??null;const board=document.createElement('div');board.className='board';board.setAttribute('role','grid');for(let i=0;i<64;i++){const cell=document.createElement('button');cell.type='button';cell.className='cell';const ship=b.ships.find(s=>s.includes(i)),shot=b.shots.includes(i);if(ship&&show)cell.classList.add('ship');if(shot){cell.classList.add(ship?'hit':'miss','fired');if(ship&&ship.every(c=>b.shots.includes(c)))cell.classList.add('sunk');if(ship)cell.textContent='✹'}if(opts.ghost?.includes(i))cell.classList.add(opts.valid?'ghost':'invalid');cell.setAttribute('aria-label',String.fromCharCode(65+i%8)+(Math.floor(i/8)+1)+(shot?', կրակված':''));cell.disabled=shot||!click; if(click)cell.onclick=()=>click(i);board.append(cell)}return board}
function shell(title,subtitle=''){view.innerHTML='';const head=document.createElement('div');head.className='board-title';head.innerHTML='<span>'+title+'</span><span class="badge">'+subtitle+'</span>';const wrap=document.createElement('div');wrap.className='board-wrap';wrap.append(head);view.append(wrap);return wrap}
function renderPlace(){phase='place';view.innerHTML='';const t=currentPlaceBoard(),len=FLEET[placeIndex];const wrap=shell('Դասավորի՛ր նավերդ','Նավ '+(placeIndex+1)+' / '+FLEET.length);const preview=selected===null?null:canPut(t,selected,len,orientation);wrap.append(boardHTML(t,{show:true,ghost:selected===null?null:preview||ghostCells(selected,len,orientation),valid:!!preview,click:i=>{selected=i;const cells=canPut(t,i,len,orientation);if(cells){t.ships.push(cells);selected=null;placeIndex++;beep('place');if(placeIndex===FLEET.length){if(mode==='local'){prepareLocal(1)}else if(mode==='online'){send({type:'ready'});remoteReady=true;waitOnline()}else startBattle()}else renderPlace()}else renderPlace()}}));const line=document.createElement('div');line.className='status';line.textContent='Տեղադրի՛ր '+len+' վանդակ երկարությամբ նավը';view.append(line);const pills=document.createElement('div');pills.className='fleet';FLEET.forEach((n,i)=>{const el=document.createElement('span');el.className='ship-pill '+(i<placeIndex?'done':i===placeIndex?'active':'');el.textContent='🚢 '+n;pills.append(el)});view.append(pills);footer.innerHTML='<button class="secondary" id="rotate">↻ Պտտել</button><button class="secondary" id="auto">🎲 Ավտոմատ</button><button class="secondary" id="back">⌂ Մենյու</button>';$('#rotate').onclick=()=>{orientation=1-orientation;renderPlace()};$('#auto').onclick=()=>{const b=randomBoard();t.ships=b.ships;placeIndex=FLEET.length;selected=null;beep('place');if(mode==='local')prepareLocal(1);else if(mode==='online'){send({type:'ready'});remoteReady=true;waitOnline()}else startBattle()};$('#back').onclick=showMenu}
function ghostCells(start,len,dir){const [x,y]=xy(start),a=[];for(let k=0;k<len;k++){const xx=x+(dir===0?k:0),yy=y+(dir===1?k:0);if(xx<N&&yy<N)a.push(idx(xx,yy))}return a}
function currentPlaceBoard(){return mode==='local'?turn===0?mine:theirs:mine}
function prepareLocal(player){turn=player;placeIndex=0;orientation=0;selected=null;modal('🙈','Խաղացող '+(player+1),'Հեռախոսը փոխանցի՛ր խաղացող '+(player+1)+'-ին։ Մի՛ նայիր մյուսի նավերին։','Պատրաստ եմ',()=>{if(player===1){phase='place';renderPlace()}else{phase='place';renderPlace()}})}
function startBattle(){phase='battle';turn=0;if(mode==='local')passTurn();else renderBattle()}
function passTurn(){modal('🔒','Փոխանցի՛ր հեռախոսը','Հիմա խաղում է խաղացող '+(turn+1)+'-ը։ Մյուս խաղացողը թող չնայի էկրանին։','Սկսել հերթը',renderBattle)}
function renderBattle(){phase='battle';view.innerHTML='';const opponent=mode==='local'?(turn===0?theirs:mine):theirs;const my=mode==='local'?(turn===0?mine:theirs):mine;const isOnline=mode==='online',canFire=!finished&&(!isOnline||remoteTurn===false)&&!(mode==='ai'&&turn===1);const wrap=shell('🎯 Հակառակորդի ծովը','Դիպուկ՝ '+opponent.shots.filter(i=>opponent.ships.some(s=>s.includes(i))).length);wrap.append(boardHTML(opponent,{show:false,click:canFire?fire:null}));const stats=document.createElement('div');stats.className='status';stats.textContent=mode==='local'?'Խաղացող '+(turn+1)+' — Քո կրակոցը':mode==='online'?(remoteTurn?'Սպասիր ընկերոջդ կրակոցին':'Քո հերթն է, կրակի՛ր'):'Քո հերթն է, կրակի՛ր';view.append(stats);const own=document.createElement('div');own.className='board-title';own.style.maxWidth='390px';own.textContent='🛡️ Քո նավերը՝ '+(my.ships.filter(s=>s.every(c=>my.shots.includes(c))).length)+' խորտակված';view.append(own);const mini=document.createElement('div');mini.className='fleet';mini.innerHTML=my.ships.map(s=>'<span class="badge" style="background:'+(s.every(c=>my.shots.includes(c))?'#91495a':'#245d78')+'">🚢 '+s.length+'</span>').join('');view.append(mini);footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=()=>confirmExit()}
function fire(i){if(phase!=='battle'||finished)return;if(mode==='online'){if(remoteTurn||!conn?.open)return;send({type:'shot',i});remoteTurn=true;renderBattle();return}const b=mode==='local'?(turn===0?theirs:mine):theirs;const result=hitAt(b,i);if(!result)return;beep(result.hit?'hit':'miss');if(result.win)return victory(mode==='local'?'Խաղացող '+(turn+1):'Դու');if(mode==='local'){turn=1-turn;setTimeout(passTurn,550)}else{turn=1;renderBattle();setTimeout(aiShot,850)}}
function aiShot(){if(phase!=='battle'||mode!=='ai')return;const free=Array.from({length:64},(_,i)=>i).filter(i=>!mine.shots.includes(i));const options=aiMemory.filter(i=>free.includes(i));const pick=options.length?options[rand(options.length)]:free[rand(free.length)];const r=hitAt(mine,pick);if(r.hit){const [x,y]=xy(pick);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)aiMemory.push(idx(xx,yy))}if(r.sunk)aiMemory=[]}beep(r.hit?'hit':'miss');if(r.win)return victory('Համակարգիչը');turn=0;renderBattle();const s=view.querySelector('.status');if(s)s.textContent=r.hit?'Համակարգիչը դիպավ քո նավին։ Քո հերթն է։':'Համակարգիչը վրիպեց։ Քո հերթն է։'}
function victory(who){finished=true;phase='end';beep('win');modal('🏆',who==='Դու'?'Դու հաղթեցի՜ր':who+' հաղթեց', 'Բոլոր նավերը գտնված են։ Նորից խաղա՞նք։','Նոր խաղ',()=>start(mode),true)}
function modal(emoji,title,desc,button,action,menu=false){const old=view.querySelector('.overlay');if(old)old.remove();const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><div class="big wave">'+emoji+'</div><h2></h2><p></p><button class="primary"></button>'+(menu?'<button class="secondary" id="menuBtn">Գլխավոր մենյու</button>':'')+'</div>';o.querySelector('h2').textContent=title;o.querySelector('p').textContent=desc;o.querySelector('.primary').textContent=button;o.querySelector('.primary').onclick=()=>{o.remove();action()};view.append(o);if(menu)o.querySelector('#menuBtn').onclick=showMenu}
function confirmExit(){modal('⚓','Դուրս գա՞լ խաղից','Ընթացիկ խաղը կավարտվի։','Այո, մենյու',showMenu,true)}
function onlineMenu(){phase='online';view.innerHTML='<section class="panel"><h2>🌐 Առցանց ծովամարտ</h2><p>Երկու հեռախոսն էլ պետք է միացված լինեն ինտերնետին։ Մեկը ստեղծում է սենյակ, մյուսը միանում է կոդով։</p><button class="choice" id="create"><span>➕</span>Ստեղծել սենյակ</button><input class="field" id="code" placeholder="ՍԵՆՅԱԿԻ ԿՈԴԸ" maxlength="10" autocapitalize="characters"><button class="primary" id="join">Միանալ ընկերոջը</button><div class="info" id="netStatus">Կապը հաստատվում է առցանց ծառայության միջոցով։</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;$('#create').onclick=()=>connectPeer(true);$('#join').onclick=()=>connectPeer(false)}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Առցանց կապի գրադարանը չբեռնվեց'));document.head.append(script)})}
async function connectPeer(isHost){const mySession=++session;host=isHost;const status=$('#netStatus');status.textContent='Միանում ենք սերվերին…';try{await loadPeer();if(mySession!==session)return;room=isHost?Math.random().toString(36).slice(2,8).toUpperCase():$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(room))throw Error('Գրի՛ր 6 նիշանոց սենյակի կոդը');peer=new Peer('areg-sea-'+room+(isHost?'-h':'-g'),{debug:0});peer.on('error',e=>{if(mySession===session)networkError(e.type==='unavailable-id'?'Սենյակն արդեն զբաղված է':'Չհաջողվեց միանալ սերվերին')});peer.on('disconnected',()=>{if(mySession===session&&phase==='battle')networkError('Կապը ընդհատվել է')});peer.on('open',()=>{if(mySession!==session)return;if(isHost){peer.on('connection',c=>setupConnection(c));showRoom()}else{const c=peer.connect('areg-sea-'+room+'-h',{reliable:true});setupConnection(c)}})}catch(e){if(mySession===session)networkError(e.message)}}
function showRoom(){phase='room';view.innerHTML='<section class="panel"><h2>Սենյակը պատրաստ է</h2><p>Ուղարկի՛ր այս կոդը ընկերոջդ</p><div class="field" id="roomCode"></div><button class="secondary" id="copy">Պատճենել կոդը</button><p id="wait">Սպասում ենք ընկերոջը…</p></section>';$('#roomCode').textContent=room;$('#copy').onclick=()=>{navigator.clipboard?.writeText(room).then(()=>$('#wait').textContent='Կոդը պատճենված է').catch(()=>$('#wait').textContent='Ասա՛ ընկերոջդ կոդը՝ '+room)};footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu}
function setupConnection(c){conn=c;c.on('open',()=>{if(phase==='menu')return;remoteReady=false;mine=empty();theirs=empty();placeIndex=0;orientation=0;selected=null;phase='place';renderPlace()});c.on('data',handleMessage);c.on('close',()=>{if(phase!=='menu'&&phase!=='end')networkError('Ընկերդ անջատվել է')});c.on('error',()=>networkError('Կապի սխալ'))}
function send(data){if(conn?.open)conn.send(data)}
function handleMessage(d){if(!d||typeof d!=='object')return;if(d.type==='ready'){remoteReady=true;if(phase==='waiting')startOnlineBattle()}if(d.type==='shot'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=64)return;const r=hitAt(mine,d.i);if(!r)return;beep(r.hit?'hit':'miss');send({type:'result',i:d.i,hit:r.hit,sunk:r.sunk,win:r.win});if(r.win)return victory('Ընկերդ');remoteTurn=false;renderBattle()}if(d.type==='result'){if(phase!=='battle'||!remoteTurn||!Number.isInteger(d.i)||d.i<0||d.i>=64||theirs.shots.includes(d.i))return;theirs.shots.push(d.i);if(d.hit)theirs.ships.push([d.i]);beep(d.hit?'hit':'miss');if(d.win)return victory('Դու');remoteTurn=false;renderBattle()}}
function waitOnline(){phase='waiting';view.innerHTML='<section class="panel"><h2>🚢 Նավերը պատրաստ են</h2><p>Սպասում ենք, մինչև ընկերդ դասավորի իր նավերը։</p><div class="status wave">🌊 Սպասում ենք…</div></section>';footer.innerHTML='<button class="secondary" id="home">⌂ Մենյու</button>';$('#home').onclick=showMenu;if(remoteReady)startOnlineBattle()}
function startOnlineBattle(){phase='battle';remoteTurn=!host;renderBattle()}
function networkError(message){if(phase==='menu')return;phase='error';modal('📡','Առցանց կապի խնդիր',message,'Վերադառնալ',showMenu)}
showMenu();
</script></body></html>
