<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#a8dce8;color:#284452;touch-action:none}button{font:inherit}.game{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 24%,#f4fcf8 0%,#d5eff2 42%,#92c9da 100%)}.game:before{content:'';position:absolute;inset:0;background:linear-gradient(150deg,#fff7 0%,transparent 42%);pointer-events:none}.garage{position:absolute;inset:0;width:100%;height:100%}.car-stage{position:absolute;left:0;right:0;top:16%;bottom:18%;display:grid;place-items:center;touch-action:none}.car-wrap{width:min(96vw,560px);aspect-ratio:520/470;position:relative;filter:drop-shadow(0 21px 18px #31657b45);animation:enter .65s cubic-bezier(.15,.8,.2,1) both}@keyframes enter{from{transform:translateY(60px) scale(.88);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}#car{width:100%;height:100%;overflow:visible}.shine{animation:glint 4s ease-in-out infinite}@keyframes glint{0%,75%,100%{opacity:.08}85%{opacity:.45}}.hud{position:absolute;top:12px;left:13px;right:13px;border:3px solid #fff9e9;background:linear-gradient(#fff7d9,#f7d7a4);border-radius:22px;box-shadow:0 7px 0 #b98b62,0 11px 20px #477e9545;padding:10px 15px 12px;text-align:center}.hud strong{font-size:clamp(17px,4.2vw,23px);color:#76442d}.sub{font-size:12px;font-weight:800;color:#906644;margin:2px 0 8px}.meter{height:13px;border-radius:30px;background:#d2d6c9;box-shadow:inset 0 2px 4px #7775;border:2px solid #fff}.meter div{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#50bbf5,#62d9ac);transition:width .25s}.footer{position:absolute;bottom:0;left:0;right:0;padding:13px 10px max(15px,env(safe-area-inset-bottom));background:linear-gradient(#fff4df,#f4ce9a);border-top:4px solid #fffaf0;box-shadow:0 -7px 28px #4786a12e}.instruction{text-align:center;font-size:clamp(12px,3.1vw,16px);font-weight:900;color:#77543e;margin:0 0 10px}.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tool{min-width:0;border:2px solid #fff;border-bottom:6px solid #be8a56;background:linear-gradient(#fff2d2,#f1bb79);border-radius:17px;color:#76472c;padding:8px 2px 6px;font-size:clamp(10px,2.8vw,14px);font-weight:900;box-shadow:0 5px 11px #996e5030}.tool span{display:block;font-size:clamp(24px,7vw,37px);margin-bottom:3px}.tool.on{background:linear-gradient(#d2f9ff,#83d9e9);border-bottom-color:#4399b7;transform:translateY(2px)}.tool:active{transform:translateY(3px)}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.dirt{position:absolute;inset:0;pointer-events:none}.spot{position:absolute;background:radial-gradient(ellipse,#7c5a3a9c 0%,#99724c7a 50%,#9c775300 73%);border-radius:45%;filter:blur(1px);transform:rotate(var(--rot));transition:opacity .18s}.foam{position:absolute;border-radius:50%;background:radial-gradient(circle at 28% 24%,white 0 15%,#f6ffffe8 27%,#a8e9edcc 63%,#9dd3dc00 74%);pointer-events:none;animation:pop .75s ease-out forwards}@keyframes pop{from{transform:scale(.2);opacity:.95}to{transform:translateY(-24px) scale(1.7);opacity:0}}.done{position:absolute;inset:0;background:#214a5b88;display:none;place-items:center}.done.show{display:grid}.result{width:85%;border-radius:26px;border:5px solid white;background:linear-gradient(#fff9e8,#f4d6a9);box-shadow:0 20px 50px #22475b77;text-align:center;padding:24px 12px;font-weight:900;font-size:24px;color:#8a522d}.result p{font-size:15px}.result button{border:2px solid white;border-bottom:5px solid #39966b;border-radius:18px;background:#78dba5;padding:13px 30px;font-weight:900;color:#28583b;font-size:18px}.spark{animation:spark .7s ease-out both}@keyframes spark{from{filter:brightness(1)}50%{filter:brightness(1.65)}to{filter:brightness(1)}}.mist{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:linear-gradient(110deg,transparent 35%,#fff7 52%,transparent 69%);transform:translateX(-160%);opacity:0}.mist.play{animation:sweep 1.2s ease-in-out}@keyframes sweep{0%{opacity:0;transform:translateX(-160%)}30%{opacity:.6}100%{opacity:0;transform:translateX(160%)}} 
</style></head><body><div class="game"><svg class="garage" viewBox="0 0 420 780" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e5f7f6"/><stop offset="1" stop-color="#9ecdd9"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b8d8d8"/><stop offset="1" stop-color="#76b3c7"/></linearGradient></defs><path d="M0 0H420V550H0Z" fill="url(#wall)"/><path d="M0 490H420V780H0Z" fill="url(#floor)"/><path d="M0 490L420 490" stroke="#fff" stroke-width="8"/><path d="M0 660L420 620M0 760L420 710M100 490L10 780M290 490L400 780" stroke="#e1f7f8" stroke-width="3" opacity=".65"/><rect x="16" y="65" width="24" height="425" rx="10" fill="#5fa8bf"/><rect x="380" y="65" width="24" height="425" rx="10" fill="#5fa8bf"/><rect x="12" y="64" width="395" height="26" rx="12" fill="#3f95b5"/><path d="M30 91V468M392 91V468" stroke="#c1eff4" stroke-width="6" opacity=".6"/><rect x="87" y="111" width="247" height="28" rx="14" fill="#fff7cf" opacity=".8"/><path d="M101 125H318" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="43" cy="110" r="12" fill="#ffefae"/><circle cx="376" cy="110" r="12" fill="#ffefae"/></svg>
<div class="car-stage" id="stage"><div class="car-wrap" id="carWrap"><svg id="car" viewBox="0 0 520 470" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="glass" x2=".3" y2="1"><stop stop-color="#efffff"/><stop offset=".4" stop-color="#95d9f1"/><stop offset="1" stop-color="#32637f"/></linearGradient><radialGradient id="ground"><stop stop-color="#29566d88"/><stop offset="1" stop-color="#29566d00"/></radialGradient></defs><g id="vehicle"></g></svg><div class="dirt" id="dirt"></div><div class="mist" id="mist"></div></div></div><canvas id="fx"></canvas>
<div class="hud"><strong>🚗 Իմ ավտոլվացումը</strong><div class="sub" id="subtitle">Մեքենա 1 · Մաքրի՛ր կեղտը</div><div class="meter"><div id="meter"></div></div></div>
<div class="footer"><p class="instruction" id="instruction">Մատով լվա՛ մեքենան, որ փայլի ✨</p><div class="tools"><button class="tool on" data-tool="water"><span>💦</span>Ջուր</button><button class="tool" data-tool="foam"><span>🫧</span>Փրփուր</button><button class="tool" data-tool="sponge"><span>🧽</span>Սպունգ</button><button class="tool" data-tool="rinse"><span>🚿</span>Ողողել</button></div></div><div class="done" id="done"><div class="result">✨ Ապրե՛ս, Արեգ ջան։<p>Մեքենան փայլում է։</p><button id="next">Հաջորդ մեքենան →</button></div></div></div>
<script>
(()=>{'use strict';const stage=document.querySelector('#stage'),wrap=document.querySelector('#carWrap'),dirt=document.querySelector('#dirt'),fx=document.querySelector('#fx'),ctx=fx.getContext('2d'),meter=document.querySelector('#meter'),instruction=document.querySelector('#instruction'),subtitle=document.querySelector('#subtitle');let tool='water',car=0,down=false,pointer=null,particles=[],spots=[],completed=false,last=0;const vehicles=[
{type:'Հեչբեք',color:'#f2b04f',light:'#ffdc91',dark:'#b97730',roof:'M116 258L157 191Q174 170 207 169H314Q338 171 359 199L392 258Z',windows:'M169 246L188 196Q193 186 212 186H251V246ZM266 186H309Q325 188 339 210L362 246H266Z',body:'M60 271Q65 257 112 255H401Q453 258 465 285L474 331Q473 361 447 367H68Q43 359 45 332L48 291Q49 280 60 271Z'},
{type:'Միկրոավտոբուս',color:'#58a9d8',light:'#b4eaff',dark:'#2d6e9c',roof:'M74 255L89 178Q93 153 124 153H393Q414 154 424 184L443 255Z',windows:'M107 239L117 184Q119 174 137 174H207V239ZM220 174H299V239H220ZM313 174H383Q397 177 401 194L414 239H313Z',body:'M67 258Q72 246 99 245H443Q466 248 470 278L474 334Q471 363 446 365H65Q43 360 44 336L47 281Q48 265 67 258Z'},
{type:'Պիկապ',color:'#e75f58',light:'#ffafa2',dark:'#a43b45',roof:'M107 256L137 190Q148 165 179 165H270Q297 167 308 194L332 256Z',windows:'M153 240L164 196Q168 184 188 184H218V240ZM232 184H266Q282 185 289 200L308 240H232Z',body:'M55 274Q61 258 104 255H328L346 276H464Q478 277 479 296V340Q478 362 451 366H64Q44 361 44 339V296Q44 281 55 274Z'},
{type:'Ամենագնաց',color:'#70b99c',light:'#c2efd1',dark:'#337e72',roof:'M102 256L139 184Q153 160 187 160H338Q364 163 383 193L416 256Z',windows:'M152 242L173 193Q179 180 199 180H250V242ZM263 180H329Q347 182 360 203L383 242H263Z',body:'M65 268Q74 254 114 253H423Q457 258 470 285L475 333Q473 363 448 366H66Q44 360 44 337L49 288Q52 276 65 268Z'}];
function renderVehicle(){const v=vehicles[car%vehicles.length],g=document.querySelector('#vehicle');g.innerHTML='<ellipse cx="260" cy="409" rx="232" ry="29" fill="url(#ground)"/>'+
'<path d="'+v.roof+'" fill="'+v.color+'" stroke="'+v.dark+'" stroke-width="5"/>'+
'<path d="'+v.windows+'" fill="url(#glass)" stroke="'+v.light+'" stroke-width="5" stroke-linejoin="round"/>'+
'<path d="'+v.body+'" fill="'+v.color+'" stroke="'+v.dark+'" stroke-width="5"/>'+
'<path d="M65 279Q252 257 461 282" fill="none" stroke="'+v.light+'" stroke-width="11" opacity=".8"/>'+
'<path d="M65 335Q255 349 460 332" fill="none" stroke="'+v.dark+'" stroke-width="6" opacity=".5"/>'+
'<path d="M252 255V326" stroke="'+v.dark+'" stroke-width="4" opacity=".65"/>'+
'<rect x="262" y="281" width="29" height="7" rx="3.5" fill="#f1fbff"/>'+
'<path d="M461 288Q475 290 477 310L475 320H459Z" fill="#fff1b5"/><path d="M44 290H59V318H44Z" fill="#ff8278"/>'+
'<path d="M86 354Q88 309 130 309Q173 309 176 354M357 354Q360 309 403 309Q445 309 449 354" fill="'+v.dark+'"/>'+
'<circle cx="130" cy="355" r="45" fill="#202b38" stroke="#3d4a58" stroke-width="6"/><circle cx="403" cy="355" r="45" fill="#202b38" stroke="#3d4a58" stroke-width="6"/>'+
'<circle cx="130" cy="355" r="26" fill="#c4d7de" stroke="#809ca9" stroke-width="5"/><circle cx="403" cy="355" r="26" fill="#c4d7de" stroke="#809ca9" stroke-width="5"/>'+
'<circle cx="130" cy="355" r="9" fill="#718c9d"/><circle cx="403" cy="355" r="9" fill="#718c9d"/>'+
'<path d="M86 269H436" stroke="#ffffff" stroke-width="5" opacity=".28"/>'}
function resize(){fx.width=innerWidth*Math.min(devicePixelRatio,2);fx.height=innerHeight*Math.min(devicePixelRatio,2);ctx.setTransform(fx.width/innerWidth,0,0,fx.height/innerHeight,0,0)}addEventListener('resize',resize);resize();function rnd(a,b){return a+Math.random()*(b-a)}function reset(){dirt.replaceChildren();spots=[];completed=false;document.querySelector('#done').classList.remove('show');wrap.style.animation='none';void wrap.offsetWidth;wrap.style.animation='';renderVehicle();for(let i=0;i<92;i++){const el=document.createElement('i');el.className='spot';const x=rnd(12,87),y=rnd(47,78);el.style.left=x+'%';el.style.top=y+'%';el.style.width=rnd(5,11)+'%';el.style.height=rnd(3,7)+'%';el.style.setProperty('--rot',rnd(-40,40)+'deg');dirt.appendChild(el);spots.push({el,x,y,alpha:1})}instruction.textContent='Մատով լվա՛ '+vehicles[car%vehicles.length].type+'ը ✨';update()}function update(){const progress=100*spots.reduce((n,s)=>n+(1-s.alpha),0)/spots.length;meter.style.width=progress+'%';subtitle.textContent='Մեքենա '+(car+1)+' · Մաքրությունը '+Math.round(progress)+'%';if(progress>=95&&!completed){completed=true;wrap.classList.add('spark');document.querySelector('#mist').classList.add('play');setTimeout(()=>{document.querySelector('#done').classList.add('show');wrap.classList.remove('spark');document.querySelector('#mist').classList.remove('play')},1100)}}function emit(x,y){const count=tool==='foam'?12:tool==='sponge'?5:16;for(let i=0;i<count;i++){const a=rnd(-Math.PI,Math.PI),speed=tool==='water'||tool==='rinse'?rnd(2.5,6):rnd(.6,2.4);particles.push({x:x+rnd(-9,9),y:y+rnd(-8,8),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed+(tool==='water'||tool==='rinse'?2:0),r:tool==='foam'?rnd(5,13):tool==='sponge'?rnd(6,10):rnd(1.5,3.7),life:1,type:tool})}}function touch(e){const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<8||x>92||y<43||y>81)return;emit(e.clientX,e.clientY);for(const s of spots){const d=Math.hypot((s.x-x)*1.15,(s.y-y)*1.9);if(d<(tool==='sponge'?14:11)){s.alpha=Math.max(0,s.alpha-(tool==='foam'?.10:tool==='water'?.14:tool==='rinse'?.24:.28));s.el.style.opacity=s.alpha}}update()}stage.addEventListener('pointerdown',e=>{if(completed||down)return;down=true;pointer=e.pointerId;stage.setPointerCapture(pointer);touch(e)});stage.addEventListener('pointermove',e=>{if(down&&pointer===e.pointerId)touch(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,e=>{if(e.pointerId===pointer){down=false;pointer=null}});document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b));instruction.textContent=({water:'Ջրով լվա՛ կեղտոտ մասերը 💦',foam:'Փրփուրով ծածկի՛ր մեքենան 🫧',sponge:'Սպունգով մաքրի՛ր մեքենան 🧽',rinse:'Ողողի՛ր, որ փայլի 🚿'})[tool]}));document.querySelector('#next').addEventListener('click',()=>{car++;reset()});function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.type==='foam'?.026:.065;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life*.9;if(p.type==='water'||p.type==='rinse'){ctx.strokeStyle=p.type==='rinse'?'#c7f7ff':'#6ad7fa';ctx.lineWidth=p.r;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);ctx.stroke();ctx.strokeStyle='#f6ffff';ctx.lineWidth=1;ctx.stroke()}else if(p.type==='foam'){ctx.fillStyle='#e7ffff';ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.2-p.life*.2),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.23,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#ffe59a';ctx.beginPath();ctx.arc(p.x,p.y,p.r*.65,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);reset()})();
</script></body></html>
