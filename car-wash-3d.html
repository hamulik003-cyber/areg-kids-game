<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG ավտոլվացում</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;background:#b9d8dd}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#bcd5d5 url('./carwash_background.webp') center center / cover no-repeat}svg{display:block;width:100%;height:100%}#scene{position:absolute;inset:0}#carLayer{position:absolute;left:2%;right:2%;top:35%;height:39%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 3px #20323a35);pointer-events:none}#carLayer::before{content:"";position:absolute;z-index:0;left:8%;right:8%;top:78%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(4,9,14,.94) 0%,rgba(7,13,18,.76) 43%,rgba(10,18,23,.34) 73%,transparent 100%);filter:blur(5px);transform:scaleY(.72)}.car-stage{z-index:1;position:absolute;width:100%;height:auto;max-height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease;user-select:none;-webkit-user-drag:none}.car-stage:first-child{opacity:1}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#instruction{position:absolute;top:8px;left:10px;right:10px;padding:8px;border-radius:14px;background:#ffffffd8;text-align:center;color:#35505c;font-size:14px;font-weight:900}#progress{height:11px;border-radius:14px;background:#5e8090;margin:8px 12px 3px;overflow:hidden;border:2px solid white}#bar{height:100%;width:0;background:linear-gradient(90deg,#68d7e4,#8feab7);transition:width .12s}#tools{display:flex;gap:6px;padding:7px 7px max(8px,env(safe-area-inset-bottom));background:#d8edf0}button{flex:1;min-width:0;border:2px solid white;border-bottom:5px solid #9bacc2;border-radius:13px;background:linear-gradient(#fff9e7,#e8bd80);color:#6c482c;font-size:12px;font-weight:900;padding:9px 3px}button.active{background:linear-gradient(#e4fffd,#86d6e5);color:#315a65}button span{display:block;font-size:25px}#win{position:absolute;inset:0;display:none;place-items:center;background:#234554a9}#win.show{display:grid}#win>div{background:linear-gradient(#fff9e9,#f1cb90);padding:24px;border:5px solid white;border-radius:24px;text-align:center;font-weight:900;color:#62402a}#win b{font-size:50px;display:block}#win button{padding:12px 20px;margin-top:14px}</style></head><body><div id="app"><div id="view"><svg id="scene" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="walls" x2="0" y2="1"><stop stop-color="#f9fbf7"/><stop offset="1" stop-color="#c1d4d3"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#a9bdc0"/><stop offset="1" stop-color="#617e85"/></linearGradient><pattern id="tiles" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" stroke="#9eb6b5" fill="none" stroke-width="1.2" opacity=".5"/></pattern></defs><path fill="url(#walls)" d="M0 0H390V445H0Z"/><path fill="url(#tiles)" d="M0 0H390V445H0Z"/><path d="M0 275H390V445H0Z" fill="#9cb4b7" opacity=".7"/><path d="M0 445H390V720H0Z" fill="url(#floor)"/><path d="M0 445H390V720H0Z" fill="url(#tiles)" opacity=".5"/><path d="M0 0H390V64H0Z" fill="#d9e2de"/><path d="M90 0V105M295 0V105" stroke="#d4dddb" stroke-width="22"/><path d="M0 65H390" stroke="#b4c5c2" stroke-width="5"/><rect x="15" y="49" width="150" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><rect x="230" y="49" width="145" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><path d="M0 440H390" stroke="#d4e0de" stroke-width="5"/><path d="M17 495L373 495L387 513H3Z" fill="#354c53"/><path d="M28 503H363" stroke="#a8c6c9" stroke-width="7" stroke-dasharray="6 7"/><path d="M0 575H390M195 514V720" stroke="#c1d3d6" stroke-width="2" opacity=".35"/><path d="M6 270V442" stroke="#5b777c" stroke-width="12"/><path d="M6 290Q34 330 11 383" stroke="#e86c44" fill="none" stroke-width="7"/></svg><div id="carLayer"><img class="car-stage" id="car-stage-0" src="./car_stage_1_muddy.png" alt="Մեքենայի 1-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-1" src="./car_stage_2_foam.png" alt="Մեքենայի 2-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-2" src="./car_stage_3_wet.png" alt="Մեքենայի 3-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-3" src="./car_stage_4_clean.png" alt="Մեքենայի 4-րդ վիճակը" draggable="false"></div><canvas id="fx"></canvas><div id="instruction">🧽 Սպունգով մաքրիր ցեխը · 1/4</div><div id="win"><div><b>🏆</b>Ապրե՛ս, մեքենան փայլում է։<p><button id="again">Կրկին խաղալ</button></p></div></div></div><div id="progress"><div id="bar"></div></div><div id="tools"><button id="sponge" class="active"><span>🧽</span>Սպունգ</button><button id="soap"><span>🫧</span>Փրփուր</button><button id="rinse"><span>🚿</span>Կարշեր</button><button id="dry"><span>✨</span>Չորացնել</button></div></div><script>
(()=>{const bgImage=new Image();bgImage.onload=()=>{document.querySelector('#scene').style.opacity='0'};bgImage.src='./carwash_background.webp';const $=s=>document.querySelector(s);let stage=0,progress=0,down=false,seed=19,particles=[];const rand=()=>Math.random();const canvas=$('#fx'),ctx=canvas.getContext('2d');const images=[...document.querySelectorAll('.car-stage')];/* Align visible car silhouettes to the same exact pixel bounds, regardless of PNG transparent margins. */async function alignCars(){try{await Promise.all(images.map(im=>im.decode()));const w=images[0].naturalWidth,h=images[0].naturalHeight;function bounds(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const data=x.getImageData(0,0,c.width,c.height).data;let l=c.width,t=c.height,r=-1,b=-1;for(let y=0;y<c.height;y+=1)for(let xx=0;xx<c.width;xx+=1){if(data[(y*c.width+xx)*4+3]>32){l=Math.min(l,xx);r=Math.max(r,xx);t=Math.min(t,y);b=Math.max(b,y)}}return r<l?null:{l,t,w:r-l+1,h:b-t+1}}const ref=bounds(images[0]);if(!ref)return;for(let i=1;i<images.length;i++){const im=images[i],bb=bounds(im);if(!bb)continue;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.drawImage(im,bb.l,bb.t,bb.w,bb.h,ref.l,ref.t,ref.w,ref.h);im.src=c.toDataURL('image/png')}}catch(e){console.warn('Car alignment fallback',e)}}alignCars();function init(){stage=0;progress=0;particles=[];$('#win').classList.remove('show');update()}function update(){const texts=['🧽 Սպունգով մաքրիր ցեխը · 1/4','🫧 Փրփուրով մաքրիր մեքենան · 2/4','🚿 Կարշերով լվա փրփուրը · 3/4','✨ Չորացրու մեքենան · 4/4'];$('#bar').style.width=(progress*100)+'%';$('#instruction').textContent=texts[stage]||'Պատրաստ է';for(const [i,id] of ['sponge','soap','rinse','dry'].entries())$('#'+id).classList.toggle('active',i===stage);images.forEach((img,i)=>img.style.opacity=i===stage?'1':'0')}function next(){stage++;progress=0;if(stage>=4){images.forEach((img,i)=>img.style.opacity=i===3?'1':'0');$('#win').classList.add('show');$('#bar').style.width='100%';$('#instruction').textContent='🌟 Իդեալական մաքուր մեքենա';return}update()}function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);function wash(e){if(stage>=4)return;const r=$('#carLayer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;progress=Math.min(1,progress+.022);for(let i=0;i<8;i++)particles.push({x:e.clientX,y:e.clientY,vx:(rand()-.5)*5,vy:(rand()-.5)*4,life:1,r:2+rand()*5});if(particles.length>140)particles.splice(0,particles.length-140);if(progress>=1)next();else update()}const view=$('#view');view.addEventListener('pointerdown',e=>{down=true;view.setPointerCapture(e.pointerId);wash(e)});view.addEventListener('pointermove',e=>{if(down)wash(e)});view.addEventListener('pointerup',()=>down=false);view.addEventListener('pointercancel',()=>down=false);for(const [i,id] of ['sponge','soap','rinse','dry'].entries())$('#'+id).onclick=()=>{$('#instruction').textContent=i===stage?['🧽 Մաքրիր ցեխը','🫧 Փրփուր քսիր','🚿 Ջրով լվա','✨ Չորացրու'][stage]:'Սկզբում ավարտիր ընթացիկ փուլը'};$('#again').onclick=init;function frame(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life-=.05;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=stage===1?'#f9ffff':stage===2?'#a9efff':'#d5f6f7';ctx.beginPath();ctx.arc(p.x-r.left,p.y-r.top,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(frame)}init();frame()})();
</script></body></html>
