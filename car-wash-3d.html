<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#a4d6e5}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.screen{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#e8fbff,#8dc6d8 65%,#538baa)}.top{position:absolute;top:8px;left:12px;right:12px;border:2px solid #fff9;border-radius:16px;background:linear-gradient(#fffef0ed,#d9edf2ed);padding:8px 12px;box-shadow:0 6px 22px #23506933}.step{font-size:12px;font-weight:850;color:#416276;text-align:center}.track{margin-top:7px;height:10px;border-radius:20px;background:#7eabb755;box-shadow:inset 0 2px 4px #25495b55;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#55b5ef,#7ce0c3);border-radius:20px;transition:width .18s}.bottom{position:absolute;bottom:0;left:0;right:0;padding:12px 10px max(13px,env(safe-area-inset-bottom));background:linear-gradient(#fff5e6f7,#e5bd90fa);border-top:3px solid #fff;box-shadow:0 -9px 26px #20496035}.tip{text-align:center;color:#795138;font-size:clamp(12px,3.2vw,15px);font-weight:900;margin:0 0 9px}.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tool{border:2px solid #fff;border-bottom:5px solid #b78a64;border-radius:16px;background:linear-gradient(#fff4d8,#efc393);padding:8px 1px 6px;font-weight:900;color:#71472f;font-size:clamp(10px,2.7vw,13px)}.tool b{display:block;font-size:clamp(23px,6.5vw,34px);margin-bottom:2px}.tool.active{background:linear-gradient(#e4ffff,#7ed5e9);border-bottom-color:#4596b6;transform:translateY(2px)}.tool:disabled{opacity:.55}.finish{position:absolute;inset:0;background:#123e59a6;display:none;place-items:center;z-index:8}.finish.show{display:grid}.modal{width:84%;max-width:340px;border-radius:28px;border:5px solid #fff;background:linear-gradient(#fffbed,#f2c993);box-shadow:0 24px 70px #0a293b88;text-align:center;padding:23px;color:#80502e;font-weight:900;font-size:23px}.modal small{display:block;font-size:14px;margin:10px 0 20px}.modal button{font:900 18px system-ui;border-radius:15px;padding:12px 23px;border:2px solid white;border-bottom:5px solid #379b75;background:#7ae2ae;color:#215d42}.hint{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-size:12px;font-weight:800;color:#fff;background:#234b60aa;padding:7px 13px;border-radius:22px;white-space:nowrap;pointer-events:none}#fallback{position:absolute;inset:25% 10%;display:none;place-items:center;text-align:center;color:#234d60;font-weight:900}
</style></head><body><div class="screen"><canvas id="scene"></canvas><div class="top"><div class="step" id="step">Մեքենա 1 · Քայլ 1/4</div><div class="track"><div class="fill" id="fill"></div></div></div><div class="hint" id="hint">Մատով շարժի՛ր գործիքը մեքենայի վրա</div><div class="bottom"><p class="tip" id="tip">🧽 Մաքրի՛ր հաստ կեղտը</p><div class="tools"><button class="tool active" disabled><b>🧽</b>Մաքրել</button><button class="tool" disabled><b>🫧</b>Փրփուր</button><button class="tool" disabled><b>🚿</b>Ողողել</button><button class="tool" disabled><b>✨</b>Փայլեցնել</button></div></div><div class="finish" id="finish"><div class="modal">🏆 Ապրե՛ս, Արեգ ջան։<small>Մեքենան փայլում է։</small><button id="next">Հաջորդ մեքենան →</button></div></div><div id="fallback">Այս սարքում 3D տեսարանը չբացվեց։</div></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const canvas=document.getElementById('scene'),stepEl=document.getElementById('step'),fill=document.getElementById('fill'),tip=document.getElementById('tip'),finish=document.getElementById('finish'),buttons=[...document.querySelectorAll('.tool')];
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});}catch(e){document.getElementById('fallback').style.display='grid';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;
const scene=new THREE.Scene();scene.background=new THREE.Color('#a5d6e6');scene.fog=new THREE.Fog('#a5d6e6',12,27);
const camera=new THREE.PerspectiveCamera(34,1,.1,80);camera.position.set(7.6,5.1,10.7);camera.lookAt(0,1.18,0);
scene.add(new THREE.HemisphereLight(0xeafaff,0x55748b,2.4));const sun=new THREE.DirectionalLight(0xfff5e5,3.5);sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;sun.shadow.bias=-.0002;scene.add(sun);
const rim=new THREE.DirectionalLight(0x8ceeff,2);rim.position.set(4,5,-6);scene.add(rim);
const mat=(color,metalness=0,roughness=.5)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const floor=mat('#8caab5',.12,.27),white=mat('#e5f6fa',.05,.4),dark=mat('#1c2e3e',.08,.55),chrome=mat('#d7e6ee',.83,.18),glass=new THREE.MeshPhysicalMaterial({color:'#7fc4e2',metalness:.14,roughness:.11,transparent:true,opacity:.77,clearcoat:1,clearcoatRoughness:.05});
function box(w,h,d,m,x,y,z,round=.1){const g=new THREE.BoxGeometry(w,h,d);const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
const ground=box(45,.16,45,floor,0,-.13,0);ground.castShadow=false;scene.add(ground);
for(let z=-12;z<=12;z+=2){const stripe=box(45,.005,.018,mat('#d5edf1',.04,.65),0,-.04,z);stripe.castShadow=false;scene.add(stripe)}
const back=box(20,12,.3,mat('#b5d9e3',.08,.68),0,5,-7);back.castShadow=false;scene.add(back);
for(let x of [-6,6]){const col=box(.32,7,.4,mat('#3f819c',.55,.3),x,3.4,-5);scene.add(col);const light=box(.17,5,.06,new THREE.MeshBasicMaterial({color:'#e7ffff'}),x,3.5,-4.74);scene.add(light)}
const beam=box(12.5,.32,.55,mat('#428eab',.4,.3),0,7,-5);scene.add(beam);
const wash=new THREE.Group();scene.add(wash);const bodyParts=[],wheels=[],foam=[],sprays=[],sparkles=[];let paint,carIndex=0,phase=0,progress=0,down=false,lastTouch=0,workingSeconds=0,phaseLocked=false,wetness=0;const palette=['#ff9f40','#49b9e8','#e86e98','#8cc769','#a98be9'];const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const localHit=new THREE.Vector3();let audio=null,noise=null,source=null,volume=null;
function buildCar(){while(wash.children.length){const obj=wash.children[0];wash.remove(obj);obj.traverse(o=>{if(o.geometry)o.geometry.dispose()})}bodyParts.length=0;wheels.length=0;foam.length=0;sprays.length=0;sparkles.length=0;paint=new THREE.MeshPhysicalMaterial({color:palette[carIndex%palette.length],metalness:.28,roughness:.27,clearcoat:1,clearcoatRoughness:.09});const shell=box(4.7,.92,2.22,paint,0,1.03,0);wash.add(shell);bodyParts.push(shell);const hood=box(1.26,.2,2.12,paint,1.42,1.54,0);wash.add(hood);bodyParts.push(hood);const roof=box(2.1,.17,1.93,paint,-.38,2.32,0);wash.add(roof);bodyParts.push(roof);const cabin=box(2.28,.69,1.86,glass,-.36,1.94,0);wash.add(cabin);bodyParts.push(cabin);for(let z of [-1.12,1.12]){for(let x of [-1.47,1.48]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.53,.53,.26,32),dark);wheel.rotation.x=Math.PI/2;wheel.position.set(x,.57,z);wheel.castShadow=true;wash.add(wheel);wheels.push(wheel);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.28,32),chrome);rim.rotation.x=Math.PI/2;rim.position.copy(wheel.position);wash.add(rim);for(let k=0;k<5;k++){const a=k*Math.PI*2/5;const spoke=box(.055,.2,.012,mat('#748b9d',.7,.2),x+Math.sin(a)*.18,.57+Math.cos(a)*.18,z+(z>0?.15:-.15));spoke.rotation.z=-a;wash.add(spoke)}}const trim=box(4.1,.06,.055,chrome,0,1.12,z+(z>0?.07:-.07));wash.add(trim);for(let x of [-.8,.85]){const handle=box(.34,.065,.08,chrome,x,1.47,z+(z>0?.02:-.02));wash.add(handle)}}for(let z of [-.77,.77]){wash.add(box(.13,.3,.34,new THREE.MeshBasicMaterial({color:'#fff4c6'}),2.39,1.22,z));wash.add(box(.11,.25,.33,new THREE.MeshBasicMaterial({color:'#fa7771'}),-2.39,1.22,z))}wash.add(box(.15,.33,1.72,chrome,2.39,.91,0));wash.add(box(.13,.23,1.7,dark,-2.39,.89,0));for(let z of [-.99,.99]){const mirror=box(.3,.17,.19,paint,.45,1.78,z);wash.add(mirror)}const dirtMat=new THREE.MeshBasicMaterial({color:'#76583c',transparent:true,opacity:.76,depthWrite:false});for(let i=0;i<150;i++){const side=i%3,spot=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.085,8,6),dirtMat.clone());spot.scale.set(1.5,.32,1.15);if(side===0)spot.position.set((Math.random()-.5)*4.2,1.505,(Math.random()-.5)*1.8);else if(side===1){spot.position.set((Math.random()-.5)*4.3,1.1,1.126);spot.rotation.x=Math.PI/2}else{spot.position.set((Math.random()-.5)*4.3,1.1,-1.126);spot.rotation.x=Math.PI/2}spot.userData.dirt=true;wash.add(spot);bodyParts.push(spot)}wash.rotation.y=-.25}
function reset(){phase=0;progress=0;wetness=0;workingSeconds=0;phaseLocked=false;finish.classList.remove('show');buildCar();updateUI()}
function updateUI(){stepEl.textContent='Մեքենա '+(carIndex+1)+' · Քայլ '+(phase+1)+'/4 · '+Math.floor(progress)+'%';fill.style.width=progress+'%';tip.textContent=['🧽 Մաքրի՛ր հաստ կեղտը','🫧 Փրփուրով ծածկի՛ր մեքենան','🚿 Ջրով ողողի՛ր փրփուրը','✨ Փայլեցրո՛ւ մեքենան'][phase];buttons.forEach((b,i)=>{b.classList.toggle('active',i===phase);b.disabled=i!==phase})}
function nextPhase(){if(phaseLocked)return;phaseLocked=true;stopSound();setTimeout(()=>{if(phase===3){finish.classList.add('show');return}phase++;progress=0;workingSeconds=0;phaseLocked=false;if(phase===3){paint.roughness=.1;paint.needsUpdate=true}updateUI()},1100)}
function addParticle(pos,kind){const isFoam=kind===1;const mesh=new THREE.Mesh(new THREE.SphereGeometry(isFoam?.065:.025,7,6),new THREE.MeshBasicMaterial({color:isFoam?0xf4ffff:kind===2?0xa8eaff:0xfff1a0,transparent:true,opacity:isFoam?.91:.8}));mesh.position.copy(pos);mesh.position.x+=(Math.random()-.5)*.35;mesh.position.y+=(Math.random()-.5)*.24;mesh.position.z+=(Math.random()-.5)*.3;wash.add(mesh);const item={mesh,kind,life:isFoam?999:.6+Math.random()*.4,velocity:new THREE.Vector3((Math.random()-.5)*.06,kind===2?-.055:.015,(Math.random()-.5)*.06)};(isFoam?foam:sprays).push(item);if(sprays.length>230){const old=sprays.shift();wash.remove(old.mesh);old.mesh.geometry.dispose();old.mesh.material.dispose()}}
function soundStart(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(!noise){noise=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}if(source){source.stop();source.disconnect()}source=audio.createBufferSource();source.buffer=noise;source.loop=true;const filter=audio.createBiquadFilter();filter.type=phase===1?'lowpass':'bandpass';filter.frequency.value=[400,680,2600,1100][phase];filter.Q.value=.6;volume=audio.createGain();volume.gain.value=0;source.connect(filter);filter.connect(volume);volume.connect(audio.destination);source.start();volume.gain.setTargetAtTime([.026,.046,.11,.02][phase],audio.currentTime,.04)}catch(e){}}
function stopSound(){if(volume&&audio)volume.gain.setTargetAtTime(0,audio.currentTime,.07)}
function hit(e){const rect=canvas.getBoundingClientRect();pointer.x=(e.clientX-rect.left)/rect.width*2-1;pointer.y=-(e.clientY-rect.top)/rect.height*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(bodyParts.filter(o=>!o.userData.dirt),false);if(!hits.length)return null;return hits[0].point}
function act(e){if(phaseLocked)return;const now=performance.now();if(now-lastTouch<35)return;workingSeconds+=lastTouch?Math.min(.12,(now-lastTouch)/1000):.07;lastTouch=now;const p=hit(e);if(!p)return;const lp=wash.worldToLocal(p.clone());if(phase===0){let removed=0;for(const part of bodyParts){if(!part.userData.dirt||!part.visible)continue;if(part.position.distanceTo(lp)<.72&&Math.random()>.25){part.visible=false;removed++}}progress=Math.min(100,progress+removed*.18+.17);for(let i=0;i<4;i++)addParticle(lp,0)}else if(phase===1){for(let i=0;i<5;i++)addParticle(lp,1);progress=Math.min(100,progress+.56)}else if(phase===2){for(let i=0;i<22;i++)addParticle(lp,2);for(let i=foam.length-1;i>=0;i--){if(foam[i].mesh.position.distanceTo(lp)<.95){wash.remove(foam[i].mesh);foam[i].mesh.geometry.dispose();foam[i].mesh.material.dispose();foam.splice(i,1)}}for(const part of bodyParts){if(part.userData.dirt&&part.visible&&part.position.distanceTo(lp)<1.1)part.visible=false}progress=Math.min(100,progress+.48);wetness=Math.min(1,wetness+.01);paint.roughness=.12}else{for(let i=0;i<7;i++)addParticle(lp,3);progress=Math.min(100,progress+.55);paint.roughness=Math.max(.045,paint.roughness-.002)}updateUI();if(progress>=98&&workingSeconds>=4.5)nextPhase()}
canvas.addEventListener('pointerdown',e=>{if(down||phaseLocked)return;down=true;lastTouch=0;canvas.setPointerCapture(e.pointerId);soundStart();act(e)});canvas.addEventListener('pointermove',e=>{if(down)act(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{down=false;stopSound()});document.getElementById('next').addEventListener('click',()=>{carIndex++;reset()});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(7.6,5.1,h>w?13.7:10.7);camera.lookAt(0,1.2,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();reset();
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-prev)/1000);prev=now;for(let i=sprays.length-1;i>=0;i--){const p=sprays[i];p.life-=dt;p.mesh.position.addScaledVector(p.velocity,dt*60);p.velocity.y-=.002;if(p.life<=0){wash.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();sprays.splice(i,1)}else p.mesh.material.opacity=Math.min(.8,p.life)}if(phase===3)paint.metalness=.32+Math.sin(now*.0018)*.05;renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
