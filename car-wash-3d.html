<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG ավտոլվացում</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;background:#b9d8dd}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#bcd5d5 url('./carwash_background.webp') center center / cover no-repeat}svg{display:block;width:100%;height:100%}#scene{position:absolute;inset:0}#carLayer{position:absolute;left:2%;right:2%;top:35%;height:39%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 3px #20323a35);pointer-events:none}#carLayer::before{content:"";position:absolute;z-index:0;left:8%;right:8%;top:78%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(4,9,14,.94) 0%,rgba(7,13,18,.76) 43%,rgba(10,18,23,.34) 73%,transparent 100%);filter:blur(5px);transform:scaleY(.72)}.car-stage{z-index:1;position:absolute;width:100%;height:auto;max-height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease;user-select:none;-webkit-user-drag:none}.car-stage{display:none!important}#washCanvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;touch-action:none;pointer-events:auto;display:block}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#instruction{position:absolute;top:8px;left:10px;right:10px;padding:8px;border-radius:14px;background:#ffffffd8;text-align:center;color:#35505c;font-size:14px;font-weight:900}#progress{height:11px;border-radius:14px;background:#5e8090;margin:8px 12px 3px;overflow:hidden;border:2px solid white}#bar{height:100%;width:0;background:linear-gradient(90deg,#68d7e4,#8feab7);transition:width .12s}#tools{display:flex;gap:6px;padding:7px 7px max(8px,env(safe-area-inset-bottom));background:#d8edf0}button{flex:1;min-width:0;border:2px solid white;border-bottom:5px solid #9bacc2;border-radius:13px;background:linear-gradient(#fff9e7,#e8bd80);color:#6c482c;font-size:12px;font-weight:900;padding:9px 3px}button.active{background:linear-gradient(#e4fffd,#86d6e5);color:#315a65}button span{display:block;font-size:25px}#win{position:absolute;inset:0;display:none;place-items:center;background:#234554a9}#win.show{display:grid}#win>div{background:linear-gradient(#fff9e9,#f1cb90);padding:24px;border:5px solid white;border-radius:24px;text-align:center;font-weight:900;color:#62402a}#win b{font-size:50px;display:block}#win button{padding:12px 20px;margin-top:14px}</style></head><body><div id="app"><div id="view"><svg id="scene" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="walls" x2="0" y2="1"><stop stop-color="#f9fbf7"/><stop offset="1" stop-color="#c1d4d3"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#a9bdc0"/><stop offset="1" stop-color="#617e85"/></linearGradient><pattern id="tiles" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" stroke="#9eb6b5" fill="none" stroke-width="1.2" opacity=".5"/></pattern></defs><path fill="url(#walls)" d="M0 0H390V445H0Z"/><path fill="url(#tiles)" d="M0 0H390V445H0Z"/><path d="M0 275H390V445H0Z" fill="#9cb4b7" opacity=".7"/><path d="M0 445H390V720H0Z" fill="url(#floor)"/><path d="M0 445H390V720H0Z" fill="url(#tiles)" opacity=".5"/><path d="M0 0H390V64H0Z" fill="#d9e2de"/><path d="M90 0V105M295 0V105" stroke="#d4dddb" stroke-width="22"/><path d="M0 65H390" stroke="#b4c5c2" stroke-width="5"/><rect x="15" y="49" width="150" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><rect x="230" y="49" width="145" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><path d="M0 440H390" stroke="#d4e0de" stroke-width="5"/><path d="M17 495L373 495L387 513H3Z" fill="#354c53"/><path d="M28 503H363" stroke="#a8c6c9" stroke-width="7" stroke-dasharray="6 7"/><path d="M0 575H390M195 514V720" stroke="#c1d3d6" stroke-width="2" opacity=".35"/><path d="M6 270V442" stroke="#5b777c" stroke-width="12"/><path d="M6 290Q34 330 11 383" stroke="#e86c44" fill="none" stroke-width="7"/></svg><div id="carLayer"><img class="car-stage" id="car-stage-0" src="./car_stage_1_muddy.png" alt="Մեքենայի 1-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-1" src="./car_stage_2_foam.png" alt="Մեքենայի 2-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-2" src="./car_stage_3_wet.png" alt="Մեքենայի 3-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-3" src="./car_stage_4_clean.png" alt="Մեքենայի 4-րդ վիճակը" draggable="false"><canvas id="washCanvas" aria-label="Ինտերակտիվ ավտոլվացում"></canvas></div><canvas id="fx"></canvas><div id="instruction">🧽 Սպունգով մաքրիր ցեխը · 1/4</div><div id="win"><div><b>🏆</b>Ապրե՛ս, մեքենան փայլում է։<p><button id="again">Կրկին խաղալ</button></p></div></div></div><div id="progress"><div id="bar"></div></div><div id="tools"><button id="sponge" class="active"><span>🧽</span>Սպունգ</button><button id="soap"><span>🫧</span>Փրփուր</button><button id="rinse"><span>🚿</span>Կարշեր</button><button id="dry"><span>✨</span>Չորացնել</button></div></div><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#washCanvas'),ctx=canvas.getContext('2d'),W=700,H=420;
const names=['car_stage_1_muddy.png','car_stage_2_foam.png','car_stage_3_wet.png','car_stage_4_clean.png'];
const images=names.map(src=>{const i=new Image();i.src=src;return i});
const frames=[],paint=document.createElement('canvas'),pc=paint.getContext('2d'),mask=document.createElement('canvas'),mc=mask.getContext('2d'),buffer=document.createElement('canvas'),bc=buffer.getContext('2d');
[canvas,paint,mask,buffer].forEach(c=>{c.width=W;c.height=H});
const GW=70,GH=42,covered=new Uint8Array(GW*GH),valid=new Uint8Array(GW*GH),alpha=new Uint8Array(W*H);
let stage=0,ready=false,pressed=false,last=null,count=0,total=0,passes=new Uint8Array(GW*GH),spongeTrail=[];
function extent(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const t=c.getContext('2d',{willReadFrequently:true});t.drawImage(im,0,0);const d=t.getImageData(0,0,c.width,c.height).data;let l=c.width,r=-1,top=c.height,b=-1;for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2)if(d[(y*c.width+x)*4+3]>40){l=Math.min(l,x);r=Math.max(r,x);top=Math.min(top,y);b=Math.max(b,y)}return r<0?null:{l,r,top,b}}
async function boot(){try{await Promise.all(images.map(i=>i.decode()));for(const im of images){const b=extent(im),c=document.createElement('canvas');c.width=W;c.height=H;const t=c.getContext('2d');if(!b)throw Error('Empty car PNG');t.drawImage(im,b.l,b.top,b.r-b.l+1,b.b-b.top+1,30,52,640,316);frames.push(c)}
const data=frames[0].getContext('2d').getImageData(0,0,W,H).data;for(let i=0;i<W*H;i++)alpha[i]=data[i*4+3]>50?1:0;
for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const x=Math.floor((gx+.5)*W/GW),y=Math.floor((gy+.5)*H/GH),idx=gy*GW+gx;valid[idx]=alpha[y*W+x];if(valid[idx])total++}
ready=true;reset()}catch(e){console.error(e);$('#instruction').textContent='Մեքենայի պատկերների բեռնման խնդիր'}}
function reset(){stage=0;$('#win').classList.remove('show');begin()}
function begin(){pressed=false;last=null;covered.fill(0);passes.fill(0);spongeTrail=[];count=0;pc.clearRect(0,0,W,H);mc.clearRect(0,0,W,H);if(stage!==1){mc.fillStyle='#fff';mc.fillRect(0,0,W,H)}render();label()}
function label(){const labels=['🧽 Սպունգով դանդաղ մաքրիր ցեխը · 1/4','🫧 Մատով փրփուր քսիր մեքենային · 2/4','🚿 Ջրով լվա փրփուրը · 3/4','✨ Սրբիր ջրի կաթիլները · 4/4'];$('#instruction').textContent=labels[stage]||'🌟 Պատրաստ է';$('#bar').style.width=Math.round(count/Math.max(1,total)*100)+'%';['sponge','soap','rinse','dry'].forEach((id,i)=>$('#'+id).classList.toggle('active',i===stage))}
function render(){if(!ready)return;ctx.clearRect(0,0,W,H);ctx.drawImage(frames[stage===0?3:stage===1?3:stage===2?2:3],0,0);
if(stage===1){ctx.drawImage(paint,0,0);return}
bc.clearRect(0,0,W,H);bc.globalCompositeOperation='source-over';bc.drawImage(stage===0?frames[0]:stage===2?frames[1]:frames[2],0,0);bc.globalCompositeOperation='destination-in';bc.drawImage(mask,0,0);bc.globalCompositeOperation='source-over';ctx.drawImage(buffer,0,0);if(stage===0){for(const p of spongeTrail){ctx.save();ctx.globalAlpha=p.life*.36;const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.r);g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}}}
function at(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function mark(x,y){const rad=stage===1?25:stage===2?28:stage===3?22:20;if(x<0||x>=W||y<0||y>=H||!alpha[Math.floor(y)*W+Math.floor(x)])return;
if(stage===1){pc.save();pc.beginPath();pc.arc(x,y,rad,0,Math.PI*2);pc.clip();pc.fillStyle='rgba(236,251,255,.85)';pc.fillRect(x-rad,y-rad,rad*2,rad*2);pc.restore();pc.strokeStyle='rgba(255,255,255,.85)';pc.lineWidth=2;for(let i=0;i<5;i++){const a=Math.random()*6.283,d=Math.random()*rad;pc.beginPath();pc.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,2+Math.random()*4,0,6.283);pc.stroke()}}
else{mc.save();mc.globalCompositeOperation='destination-out';if(stage===0){const g=mc.createRadialGradient(x,y,rad*.12,x,y,rad);g.addColorStop(0,'rgba(0,0,0,.46)');g.addColorStop(.58,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,0)');mc.fillStyle=g;spongeTrail.push({x,y,r:rad*.9,life:1});if(spongeTrail.length>22)spongeTrail.shift()}else mc.fillStyle='rgba(0,0,0,.42)';mc.beginPath();mc.arc(x,y,rad,0,6.283);mc.fill();mc.restore()}
const minX=Math.max(0,Math.floor((x-rad)/W*GW)),maxX=Math.min(GW-1,Math.ceil((x+rad)/W*GW)),minY=Math.max(0,Math.floor((y-rad)/H*GH)),maxY=Math.min(GH-1,Math.ceil((y+rad)/H*GH));
for(let gy=minY;gy<=maxY;gy++)for(let gx=minX;gx<=maxX;gx++){const cx=(gx+.5)*W/GW,cy=(gy+.5)*H/GH,id=gy*GW+gx;if(valid[id]&&Math.hypot(cx-x,cy-y)<rad*.77){if(stage===0){passes[id]=Math.min(4,passes[id]+1);if(passes[id]===3&&!covered[id]){covered[id]=1;count++}}else if(!covered[id]){covered[id]=1;count++}}}}
function stroke(e){if(!ready||stage>=4)return;const p=at(e),q=last||p,d=Math.hypot(p.x-q.x,p.y-q.y),n=Math.max(1,Math.ceil(d/7));for(let i=0;i<=n;i++){const t=i/n;mark(q.x+(p.x-q.x)*t,q.y+(p.y-q.y)*t)}last=p;for(const v of spongeTrail)v.life*=.92;render();label();if(count/Math.max(total,1)>=.78){stage++;if(stage===4){ctx.clearRect(0,0,W,H);ctx.drawImage(frames[3],0,0);$('#win').classList.add('show');$('#bar').style.width='100%';$('#instruction').textContent='🌟 Մեքենան փայլում է';pressed=false}else begin()}}
canvas.addEventListener('pointerdown',e=>{if(!ready||stage>=4)return;pressed=true;last=null;canvas.setPointerCapture(e.pointerId);stroke(e)});
canvas.addEventListener('pointermove',e=>{if(pressed)stroke(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>{pressed=false;last=null});
$('#again').onclick=reset;['sponge','soap','rinse','dry'].forEach((id,i)=>$('#'+id).onclick=()=>{if(stage!==i)$('#instruction').textContent='Սկզբում ավարտիր ընթացիկ փուլը'});
const bg=new Image();bg.onload=()=>{$('#scene').style.opacity='0'};bg.src='carwash_background.webp';boot();
})();
</script></body></html>
