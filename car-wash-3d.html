<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#a8dce8;color:#284452;touch-action:none}button{font:inherit}.game{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 24%,#f4fcf8 0%,#d5eff2 42%,#92c9da 100%)}.game:before{content:'';position:absolute;inset:0;background:linear-gradient(150deg,#fff7 0%,transparent 42%);pointer-events:none}.garage{position:absolute;inset:0;width:100%;height:100%}.car-stage{position:absolute;left:0;right:0;top:16%;bottom:18%;display:grid;place-items:center;touch-action:none}.car-wrap{width:min(96vw,560px);aspect-ratio:520/470;position:relative;filter:drop-shadow(0 21px 18px #31657b45);animation:enter .65s cubic-bezier(.15,.8,.2,1) both}@keyframes enter{from{transform:translateY(60px) scale(.88);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}#car{width:100%;height:100%;overflow:visible}.shine{animation:glint 4s ease-in-out infinite}@keyframes glint{0%,75%,100%{opacity:.08}85%{opacity:.45}}.hud{position:absolute;top:12px;left:13px;right:13px;border:3px solid #fff9e9;background:linear-gradient(#fff7d9,#f7d7a4);border-radius:22px;box-shadow:0 7px 0 #b98b62,0 11px 20px #477e9545;padding:10px 15px 12px;text-align:center}.hud strong{font-size:clamp(17px,4.2vw,23px);color:#76442d}.sub{font-size:12px;font-weight:800;color:#906644;margin:2px 0 8px}.meter{height:13px;border-radius:30px;background:#d2d6c9;box-shadow:inset 0 2px 4px #7775;border:2px solid #fff}.meter div{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#50bbf5,#62d9ac);transition:width .25s}.footer{position:absolute;bottom:0;left:0;right:0;padding:13px 10px max(15px,env(safe-area-inset-bottom));background:linear-gradient(#fff4df,#f4ce9a);border-top:4px solid #fffaf0;box-shadow:0 -7px 28px #4786a12e}.instruction{text-align:center;font-size:clamp(12px,3.1vw,16px);font-weight:900;color:#77543e;margin:0 0 10px}.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tool{min-width:0;border:2px solid #fff;border-bottom:6px solid #be8a56;background:linear-gradient(#fff2d2,#f1bb79);border-radius:17px;color:#76472c;padding:8px 2px 6px;font-size:clamp(10px,2.8vw,14px);font-weight:900;box-shadow:0 5px 11px #996e5030}.tool span{display:block;font-size:clamp(24px,7vw,37px);margin-bottom:3px}.tool.on{background:linear-gradient(#d2f9ff,#83d9e9);border-bottom-color:#4399b7;transform:translateY(2px)}.tool:active{transform:translateY(3px)}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.dirt{position:absolute;inset:0;pointer-events:none}.spot{position:absolute;background:radial-gradient(ellipse,#7c5a3a9c 0%,#99724c7a 50%,#9c775300 73%);border-radius:45%;filter:blur(1px);transform:rotate(var(--rot));transition:opacity .18s}.foam{position:absolute;border-radius:50%;background:radial-gradient(circle at 28% 24%,white 0 15%,#f6ffffe8 27%,#a8e9edcc 63%,#9dd3dc00 74%);pointer-events:none;animation:pop .75s ease-out forwards}@keyframes pop{from{transform:scale(.2);opacity:.95}to{transform:translateY(-24px) scale(1.7);opacity:0}}.done{position:absolute;inset:0;background:#214a5b88;display:none;place-items:center}.done.show{display:grid}.result{width:85%;border-radius:26px;border:5px solid white;background:linear-gradient(#fff9e8,#f4d6a9);box-shadow:0 20px 50px #22475b77;text-align:center;padding:24px 12px;font-weight:900;font-size:24px;color:#8a522d}.result p{font-size:15px}.result button{border:2px solid white;border-bottom:5px solid #39966b;border-radius:18px;background:#78dba5;padding:13px 30px;font-weight:900;color:#28583b;font-size:18px}.spark{animation:spark .7s ease-out both}@keyframes spark{from{filter:brightness(1)}50%{filter:brightness(1.65)}to{filter:brightness(1)}}.mist{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:linear-gradient(110deg,transparent 35%,#fff7 52%,transparent 69%);transform:translateX(-160%);opacity:0}.mist.play{animation:sweep 1.2s ease-in-out}@keyframes sweep{0%{opacity:0;transform:translateX(-160%)}30%{opacity:.6}100%{opacity:0;transform:translateX(160%)}} 
</style></head><body><div class="game"><svg class="garage" viewBox="0 0 420 780" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e5f7f6"/><stop offset="1" stop-color="#9ecdd9"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b8d8d8"/><stop offset="1" stop-color="#76b3c7"/></linearGradient></defs><path d="M0 0H420V550H0Z" fill="url(#wall)"/><path d="M0 490H420V780H0Z" fill="url(#floor)"/><path d="M0 490L420 490" stroke="#fff" stroke-width="8"/><path d="M0 660L420 620M0 760L420 710M100 490L10 780M290 490L400 780" stroke="#e1f7f8" stroke-width="3" opacity=".65"/><rect x="16" y="65" width="24" height="425" rx="10" fill="#5fa8bf"/><rect x="380" y="65" width="24" height="425" rx="10" fill="#5fa8bf"/><rect x="12" y="64" width="395" height="26" rx="12" fill="#3f95b5"/><path d="M30 91V468M392 91V468" stroke="#c1eff4" stroke-width="6" opacity=".6"/><rect x="87" y="111" width="247" height="28" rx="14" fill="#fff7cf" opacity=".8"/><path d="M101 125H318" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="43" cy="110" r="12" fill="#ffefae"/><circle cx="376" cy="110" r="12" fill="#ffefae"/></svg>

154L391 222Z" fill="#fbc0a7" opacity=".8"/><path d="M143 219Q164 167 194 149Q207 142 248 142L316 145Q333 148 343 168L367 221Z" fill="url(#wind)" stroke="#f6a69a" stroke-width="11" stroke-linejoin="round"/><path d="M248 144L242 221" stroke="#e9a6a3" stroke-width="10"/><path d="M174 183L210 150L230 150L198 215" fill="#eaffff" opacity=".32"/><path d="M283 150L307 150L350 212L332 212" fill="#eaffff" opacity=".23"/><path d="M80 265Q146 238 261 240Q382 241 446 264L458 329Q366 349 258 347Q136 347 60 329Z" fill="url(#front)"/><path d="M84 266Q258 226 435 265" fill="none" stroke="#ffb7a0" stroke-width="10" stroke-linecap="round" opacity=".7"/><path d="M85 307Q257 330 433 306" fill="none" stroke="#b6324b" stroke-width="5" opacity=".6"/><path d="M58 341Q264 371 465 341L459 376Q254 405 62 377Z" fill="#c9434b"/><path d="M109 356Q254 377 409 354L400 379Q252 394 120 380Z" fill="#293b4a"/><path d="M147 357Q256 368 367 356" stroke="#a5b4bd" stroke-width="4" fill="none"/><path d="M75 267Q103 249 156 261L175 290Q130 306 75 290Z" fill="#fff4d7" stroke="#f8cfa9" stroke-width="6"/><path d="M353 262Q413 246 448 269L450 289Q394 307 347 291Z" fill="#fff4d7" stroke="#f8cfa9" stroke-width="6"/><path d="M81 270Q112 262 150 269" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/><path d="M361 270Q411 260 440 275" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/><rect x="211" y="348" width="93" height="27" rx="9" fill="url(#chrome)"/><rect x="222" y="352" width="71" height="19" rx="5" fill="#e8f6f9"/><path d="M75 322Q94 330 111 330M415 331Q432 330 450 323" stroke="#fff5d5" stroke-width="5" opacity=".7"/><path d="M72 303Q69 285 76 277" stroke="#fff9" stroke-width="7" stroke-linecap="round"/><path d="M453 302Q454 289 449 280" stroke="#fff9" stroke-width="7" stroke-linecap="round"/><path class="shine" d="M126 247Q265 225 385 246" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg><div class="dirt" id="dirt"></div><div class="mist" id="mist"></div></div></div><canvas id="fx"></canvas>
<div class="hud"><strong>🚗 Իմ ավտոլվացումը</strong><div class="sub" id="subtitle">Մեքենա 1 · Մաքրի՛ր կեղտը</div><div class="meter"><div id="meter"></div></div></div>
<div class="footer"><p class="instruction" id="instruction">Մատով լվա՛ մեքենան, որ փայլի ✨</p><div class="tools"><button class="tool on" data-tool="water"><span>💦</span>Ջուր</button><button class="tool" data-tool="foam"><span>🫧</span>Փրփուր</button><button class="tool" data-tool="sponge"><span>🧽</span>Սպունգ</button><button class="tool" data-tool="rinse"><span>🚿</span>Ողողել</button></div></div><div class="done" id="done"><div class="result">✨ Ապրե՛ս, Արեգ ջան։<p>Մեքենան փայլում է։</p><button id="next">Հաջորդ մեքենան →</button></div></div></div>
<script>
(()=>{'use strict';const stage=document.querySelector('#stage'),wrap=document.querySelector('#carWrap'),dirt=document.querySelector('#dirt'),fx=document.querySelector('#fx'),ctx=fx.getContext('2d'),meter=document.querySelector('#meter'),instruction=document.querySelector('#instruction'),subtitle=document.querySelector('#subtitle');let tool='water',car=0,down=false,pointer=null,particles=[],spots=[],completed=false,last=0;const palette=[['#ffb6a2','#f47765','#d94c4e','#a72e48'],['#b7e9ff','#64c4e8','#378cc5','#2e5c99'],['#fff1b1','#ffd36c','#eea849','#b96c35'],['#c7f2d9','#79d9b1','#38a887','#277e80'],['#dfcbff','#a98beb','#785fc2','#5a438e']];function resize(){fx.width=innerWidth*Math.min(devicePixelRatio,2);fx.height=innerHeight*Math.min(devicePixelRatio,2);ctx.setTransform(fx.width/innerWidth,0,0,fx.height/innerHeight,0,0)}addEventListener('resize',resize);resize();function rnd(a,b){return a+Math.random()*(b-a)}function reset(){dirt.replaceChildren();spots=[];completed=false;document.querySelector('#done').classList.remove('show');wrap.style.animation='none';void wrap.offsetWidth;wrap.style.animation='';const stops=document.querySelectorAll('#bodyPaint stop');palette[car%palette.length].forEach((color,i)=>stops[i].setAttribute('stop-color',color));const front=document.querySelectorAll('#front stop');palette[car%palette.length].slice(1).forEach((color,i)=>front[i].setAttribute('stop-color',color));for(let i=0;i<86;i++){const el=document.createElement('i');el.className='spot';const x=rnd(15,85),y=rnd(51,83);el.style.left=x+'%';el.style.top=y+'%';el.style.width=rnd(5,12)+'%';el.style.height=rnd(3,7)+'%';el.style.setProperty('--rot',rnd(-40,40)+'deg');dirt.appendChild(el);spots.push({el,x,y,alpha:1})}update()}function update(){const progress=100*spots.reduce((n,s)=>n+(1-s.alpha),0)/spots.length;meter.style.width=progress+'%';subtitle.textContent='Մեքենա '+(car+1)+' · Մաքրությունը '+Math.round(progress)+'%';if(progress>=95&&!completed){completed=true;wrap.classList.add('spark');document.querySelector('#mist').classList.add('play');setTimeout(()=>{document.querySelector('#done').classList.add('show');wrap.classList.remove('spark');document.querySelector('#mist').classList.remove('play')},1100)}}function emit(x,y){for(let i=0;i<7;i++)particles.push({x:x+rnd(-13,13),y:y+rnd(-11,11),vx:rnd(-1.9,1.9),vy:rnd(-3.3,-.5),r:rnd(3,9),life:1,type:tool})}function touch(e){const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<8||x>92||y<48||y>87)return;emit(e.clientX,e.clientY);for(const s of spots){const d=Math.hypot((s.x-x)*1.15,(s.y-y)*1.9);if(d<(tool==='sponge'?14:11)){s.alpha=Math.max(0,s.alpha-(tool==='foam'?.10:tool==='water'?.14:tool==='rinse'?.24:.28));s.el.style.opacity=s.alpha}}update()}stage.addEventListener('pointerdown',e=>{if(completed||down)return;down=true;pointer=e.pointerId;stage.setPointerCapture(pointer);touch(e)});stage.addEventListener('pointermove',e=>{if(down&&pointer===e.pointerId)touch(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,e=>{if(e.pointerId===pointer){down=false;pointer=null}});document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b));instruction.textContent=({water:'Ջրով լվա՛ կեղտոտ մասերը 💦',foam:'Փրփուրով ծածկի՛ր մեքենան 🫧',sponge:'Սպունգով մաքրի՛ր մեքենան 🧽',rinse:'Ողողի՛ր, որ փայլի 🚿'})[tool]}));document.querySelector('#next').addEventListener('click',()=>{car++;reset()});function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.045;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life*.88;ctx.fillStyle=p.type==='foam'?'#faffff':p.type==='sponge'?'#ffe38a':'#a4edff';ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.stroke()}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);reset()})();
</script></body></html>
