<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui;background:#bcd9e8;color:#15314c}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px 12px 18px}.head{background:linear-gradient(#fffdf1,#f1d5a5);border:3px solid #fff9e8;border-radius:20px;padding:10px;text-align:center;box-shadow:0 5px 0 #ba8856,0 8px 18px #27415b3b;font-weight:900;font-size:clamp(14px,4vw,21px)}.small{font-size:13px;font-weight:650;margin-top:4px}.progress{height:11px;background:#b4c4c9;border:2px solid #fff;border-radius:30px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0%;background:linear-gradient(90deg,#46c3fc,#65e6a4);transition:width .3s}.bottom{display:flex;gap:7px;align-items:center;justify-content:center;pointer-events:auto}.tool{flex:1;max-width:110px;border:2px solid #fff5d8;border-bottom:5px solid #ac7747;background:linear-gradient(#ffe6ae,#efb66d);border-radius:16px;padding:10px 2px;font-weight:900;font-size:12px;color:#643c24;box-shadow:0 5px 12px #223e4e38}.tool.on{background:linear-gradient(#c3f6ff,#72c9e9);border-bottom-color:#3988a8;transform:translateY(2px)}.tool span{display:block;font-size:28px;margin-bottom:3px}.tip{pointer-events:none;align-self:center;margin-bottom:12px;background:#f9fdffea;padding:7px 15px;border-radius:50px;font-size:13px;font-weight:800}.done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#11263a77;pointer-events:auto}.done.show{display:flex}.panel{width:85%;background:#fff3d9;border:5px solid #fff;border-radius:26px;padding:24px 15px;text-align:center;box-shadow:0 14px 35px #17304670;font-weight:900;font-size:23px}.panel button{margin-top:17px;padding:13px 28px;border-radius:17px;border:0;background:#6ed29d;font-weight:900;font-size:19px;color:#164832}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#c9e6f1;font-weight:900} 
</style></head><body><div id="scene"></div><div id="loading">🚙 Պատրաստում ենք ավտոլվացումը...</div><div class="hud"><div class="head"><div id="heading">🚗 Իմ ավտոլվացումը 3D</div><div class="small" id="stage">Փուլ 1 · Լվա՛ մեքենան</div><div class="progress"><div class="fill" id="fill"></div></div></div><div><div class="tip" id="tip">Ընտրի՛ր ջուրը և մատով մաքրի՛ր մեքենան</div><div class="bottom"><button class="tool on" data-tool="water"><span>💦</span>Ջուր</button><button class="tool" data-tool="soap"><span>🫧</span>Փրփուր</button><button class="tool" data-tool="sponge"><span>🧽</span>Սպունգ</button><button class="tool" data-tool="rinse"><span>🚿</span>Ողողել</button></div></div></div><div class="done" id="done"><div class="panel">✨ Փայլուն մեքենա՜ 🚗<div style="font-size:15px;margin-top:10px">Հաջորդ մեքենան սպասում է</div><button id="next">Շարունակել →</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const host=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9dfec);scene.fog=new THREE.Fog(0xb9dfec,18,38);
const camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(6.7,5.5,10.6);camera.lookAt(0,1.15,0);
scene.add(new THREE.HemisphereLight(0xf5fbff,0x61707a,2.5));const sun=new THREE.DirectionalLight(0xffffff,3.1);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const mat=(color,metalness=0,roughness=.5)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),mat(0x8baeb9));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const tiles=new THREE.Group();scene.add(tiles);for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){if((x+z)%2===0){const t=new THREE.Mesh(new THREE.PlaneGeometry(.95,.95),mat(0x99b8c0));t.rotation.x=-Math.PI/2;t.position.set(x*.97,.012,z*.97);tiles.add(t)}}
function box(w,h,d,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
const wall=mat(0xd9e7e9);box(14,5,.3,wall,0,2.5,-5.3);box(.3,5,10,wall,-7,2.5,-.4);
const blue=mat(0x3195bd,.4,.28),white=mat(0xe5f9ff,.2,.25),steel=mat(0x768d9c,.65,.28);for(const x of [-3.5,3.5]){box(.32,5,.4,blue,x,2.5,-2.5);box(.46,.2,.55,white,x,4.9,-2.5)}box(7.4,.3,.55,blue,0,5,-2.5);
for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),new THREE.MeshBasicMaterial({color:0xffe9a3}));l.position.set(-3+i*1.5,4.8,-2.18);scene.add(l)}
const car=new THREE.Group();scene.add(car);
const paint=mat(0xff705b,.55,.22),glass=mat(0x28536b,.25,.12),rubber=mat(0x202b34,.1,.83),chrome=mat(0xe2f2f7,.85,.2),lamp=mat(0xfff0bd,.3,.2);
box(4.1,.95,2.05,paint,0,1.03,0,car);
const hood=box(1.35,.24,2.01,paint,1.35,1.57,0,car);hood.rotation.z=-.06;
const roof=box(1.86,.16,1.76,paint,-.42,2.35,0,car);
const cabin=box(1.84,.7,1.76,glass,-.43,1.96,0,car);cabin.rotation.z=-.07;
for(const x of [-1.37,1.34])for(const z of [-1.09,1.09]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.24,28),rubber);wheel.rotation.x=Math.PI/2;wheel.position.set(x,.73,z);wheel.castShadow=true;car.add(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.252,24),chrome);hub.rotation.x=Math.PI/2;hub.position.copy(wheel.position);car.add(hub)}
for(const z of [-.75,.75]){box(.13,.26,.45,lamp,2.09,1.2,z,car);box(.13,.23,.43,mat(0xdb2d35),-2.09,1.19,z,car)}
box(.13,.24,1.8,chrome,2.12,.78,0,car);box(.13,.2,1.75,chrome,-2.12,.78,0,car);
const dirtMat=new THREE.MeshStandardMaterial({color:0x7c5a3b,transparent:true,opacity:.83,depthWrite:false,roughness:1});const dirt=new THREE.Group();car.add(dirt);
const spots=[];let clean=0,level=0,tool='water',down=false,lastPoint=null,particles=[],completed=false;
function seedDirt(){spots.length=0;while(dirt.children.length){const o=dirt.children[0];dirt.remove(o);o.geometry.dispose()}const random=(a,b)=>a+Math.random()*(b-a);for(let i=0;i<95;i++){const radius=random(.09,.28);const o=new THREE.Mesh(new THREE.SphereGeometry(radius,9,6),dirtMat.clone());const side=i%3;const x=random(-1.85,1.85),z=random(-.89,.89);if(side===0)o.position.set(x,1.54+random(.03,.11),z);else if(side===1)o.position.set(x,random(.92,1.44),1.043);else o.position.set(x,random(.92,1.44),-1.043);o.scale.set(1,random(.16,.35),1);dirt.add(o);spots.push(o)}clean=0;completed=false;update()}
function update(){const p=Math.round(clean/spots.length*100);document.querySelector('#fill').style.width=p+'%';document.querySelector('#stage').textContent='Փուլ '+(level+1)+' · Մաքրությունը '+p+'%';if(p>=95&&!completed){completed=true;setTimeout(()=>{document.querySelector('#done').classList.add('show')},800)}}
seedDirt();
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();const spray=new THREE.Group();scene.add(spray);const dropGeo=new THREE.SphereGeometry(.035,7,5);const waterMat=new THREE.MeshBasicMaterial({color:0x74dfff,transparent:true,opacity:.8}),foamMat=new THREE.MeshStandardMaterial({color:0xf9ffff,transparent:true,opacity:.9});const spongeMat=new THREE.MeshBasicMaterial({color:0xffd159});
function puff(point){for(let i=0;i<8;i++){const o=new THREE.Mesh(dropGeo,tool==='soap'?foamMat:tool==='sponge'?spongeMat:waterMat);o.position.copy(point);o.position.add(new THREE.Vector3((Math.random()-.5)*.35,(Math.random()-.5)*.28,(Math.random()-.5)*.3));o.scale.setScalar(tool==='soap'?2.1:1.3);scene.add(o);particles.push({o,life:1,v:new THREE.Vector3((Math.random()-.5)*.045,Math.random()*.055,(Math.random()-.5)*.045)})}}
function sprayAt(e){const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(car.children.filter(x=>x.isMesh),false);if(!hits.length)return;const point=hits[0].point;puff(point);let changed=0;for(const o of spots){if(!o.visible)continue;const wp=o.getWorldPosition(new THREE.Vector3());if(wp.distanceTo(point)<(tool==='sponge'?.65:.55)){o.material.opacity=Math.max(0,o.material.opacity-(tool==='soap'?.12:tool==='water'?.2:.31));if(o.material.opacity<=.08){o.visible=false;changed++}}}clean+=changed;update()}
renderer.domElement.addEventListener('pointerdown',e=>{if(completed)return;down=true;renderer.domElement.setPointerCapture(e.pointerId);sprayAt(e)});
renderer.domElement.addEventListener('pointermove',e=>{if(down&&!completed)sprayAt(e)});
for(const event of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(event,()=>down=false);
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b));document.querySelector('#tip').textContent=({water:'Մատով ուղղի՛ր ջրի շիթը',soap:'Ծածկի՛ր մեքենան փրփուրով',sponge:'Սպունգով մաքրի՛ր կեղտը',rinse:'Ողողի՛ր ու փայլեցրու մեքենան'})[tool]}));
document.querySelector('#next').addEventListener('click',()=>{level++;paint.color.setHex([0xff705b,0x55aaf1,0xf7cb42,0x8e72dc,0x50c9a0][level%5]);document.querySelector('#done').classList.remove('show');seedDirt()});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(6.5,h>w*1.4?6.5:5.5,h>w*1.4?13.5:10.5);camera.lookAt(0,1.25,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();document.querySelector('#loading').remove();let last=0;function frame(now){requestAnimationFrame(frame);if(now-last<16)return;last=now;car.rotation.y=Math.sin(now*.00035)*.045;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=.055;p.o.position.add(p.v);p.o.scale.multiplyScalar(.98);if(p.life<=0){scene.remove(p.o);particles.splice(i,1)}}renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
