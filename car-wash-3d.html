<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG ավտոլվացում</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;background:#b9d8dd}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#bcd5d5 url('./carwash_background.webp') center center / cover no-repeat}svg{display:block;width:100%;height:100%}#scene{position:absolute;inset:0}#carLayer{position:absolute;inset:0;filter:drop-shadow(0 12px 7px #243b4960)}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#instruction{position:absolute;top:8px;left:10px;right:10px;padding:8px;border-radius:14px;background:#ffffffd8;text-align:center;color:#35505c;font-size:14px;font-weight:900}#progress{height:11px;border-radius:14px;background:#5e8090;margin:8px 12px 3px;overflow:hidden;border:2px solid white}#bar{height:100%;width:0;background:linear-gradient(90deg,#68d7e4,#8feab7);transition:width .12s}#tools{display:flex;gap:6px;padding:7px 7px max(8px,env(safe-area-inset-bottom));background:#d8edf0}button{flex:1;min-width:0;border:2px solid white;border-bottom:5px solid #9bacc2;border-radius:13px;background:linear-gradient(#fff9e7,#e8bd80);color:#6c482c;font-size:12px;font-weight:900;padding:9px 3px}button.active{background:linear-gradient(#e4fffd,#86d6e5);color:#315a65}button span{display:block;font-size:25px}#win{position:absolute;inset:0;display:none;place-items:center;background:#234554a9}#win.show{display:grid}#win>div{background:linear-gradient(#fff9e9,#f1cb90);padding:24px;border:5px solid white;border-radius:24px;text-align:center;font-weight:900;color:#62402a}#win b{font-size:50px;display:block}#win button{padding:12px 20px;margin-top:14px}</style></head><body><div id="app"><div id="view"><svg id="scene" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="walls" x2="0" y2="1"><stop stop-color="#f9fbf7"/><stop offset="1" stop-color="#c1d4d3"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#a9bdc0"/><stop offset="1" stop-color="#617e85"/></linearGradient><pattern id="tiles" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" stroke="#9eb6b5" fill="none" stroke-width="1.2" opacity=".5"/></pattern></defs><path fill="url(#walls)" d="M0 0H390V445H0Z"/><path fill="url(#tiles)" d="M0 0H390V445H0Z"/><path d="M0 275H390V445H0Z" fill="#9cb4b7" opacity=".7"/><path d="M0 445H390V720H0Z" fill="url(#floor)"/><path d="M0 445H390V720H0Z" fill="url(#tiles)" opacity=".5"/><path d="M0 0H390V64H0Z" fill="#d9e2de"/><path d="M90 0V105M295 0V105" stroke="#d4dddb" stroke-width="22"/><path d="M0 65H390" stroke="#b4c5c2" stroke-width="5"/><rect x="15" y="49" width="150" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><rect x="230" y="49" width="145" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><path d="M0 440H390" stroke="#d4e0de" stroke-width="5"/><path d="M17 495L373 495L387 513H3Z" fill="#354c53"/><path d="M28 503H363" stroke="#a8c6c9" stroke-width="7" stroke-dasharray="6 7"/><path d="M0 575H390M195 514V720" stroke="#c1d3d6" stroke-width="2" opacity=".35"/><path d="M6 270V442" stroke="#5b777c" stroke-width="12"/><path d="M6 290Q34 330 11 383" stroke="#e86c44" fill="none" stroke-width="7"/></svg><svg id="carLayer" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="paint" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffe7a8"/><stop offset=".35" stop-color="#f7b96e"/><stop offset="1" stop-color="#c66e46"/></linearGradient><linearGradient id="window" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#dff8fb"/><stop offset=".5" stop-color="#86b8ca"/><stop offset="1" stop-color="#42677b"/></linearGradient><clipPath id="bodyClip"><path d="M29 357Q40 342 81 338L104 328Q123 280 160 275Q228 258 272 280Q297 294 321 331L355 340Q370 347 371 364L372 391Q370 409 349 413H43Q23 412 22 392Z"/></clipPath></defs><ellipse cx="196" cy="418" rx="172" ry="17" fill="#20394755"/><path d="M92 335Q125 283 160 275Q228 258 272 280Q302 300 321 335Z" fill="#f4bb77" stroke="#a96745" stroke-width="5"/><path d="M122 327L157 288Q178 282 197 283V331Z" fill="url(#window)" stroke="#ffdfa1" stroke-width="5"/><path d="M208 283Q256 279 272 295L299 332H208Z" fill="url(#window)" stroke="#ffdfa1" stroke-width="5"/><path d="M29 357Q40 342 81 338L104 328Q123 280 160 275Q228 258 272 280Q297 294 321 331L355 340Q370 347 371 364L372 391Q370 409 349 413H43Q23 412 22 392Z" fill="url(#paint)" stroke="#a96745" stroke-width="5"/><path d="M29 359Q173 339 355 359" stroke="#ffdfa0" stroke-width="7" opacity=".8" fill="none"/><path d="M203 336V404" stroke="#b36c45" stroke-width="3"/><path d="M218 358H237" stroke="#fff3d5" stroke-width="5" stroke-linecap="round"/><path d="M25 387H370" stroke="#aa633f" stroke-width="5" opacity=".65"/><path d="M28 365H42V384H26Z" fill="#d85450"/><path d="M352 365H372V384H352Z" fill="#fff4c1"/><circle cx="98" cy="411" r="36" fill="#273039" stroke="#171f24" stroke-width="5"/><circle cx="98" cy="411" r="24" fill="#b5c5c8" stroke="#e3ecec" stroke-width="5"/><circle cx="98" cy="411" r="9" fill="#617a82"/><circle cx="295" cy="411" r="36" fill="#273039" stroke="#171f24" stroke-width="5"/><circle cx="295" cy="411" r="24" fill="#b5c5c8" stroke="#e3ecec" stroke-width="5"/><circle cx="295" cy="411" r="9" fill="#617a82"/><g id="dirt" clip-path="url(#bodyClip)"></g><g id="stains" clip-path="url(#bodyClip)"></g><g id="foam" clip-path="url(#bodyClip)"></g><g id="wet" clip-path="url(#bodyClip)"></g></svg><canvas id="fx"></canvas><div id="instruction">🧽 Սպունգով մաքրիր ցեխը · 1/4</div><div id="win"><div><b>🏆</b>Ապրե՛ս, մեքենան փայլում է։<p><button id="again">Կրկին խաղալ</button></p></div></div></div><div id="progress"><div id="bar"></div></div><div id="tools"><button id="sponge" class="active"><span>🧽</span>Սպունգ</button><button id="soap"><span>🫧</span>Փրփուր</button><button id="rinse"><span>🚿</span>Կարշեր</button><button id="dry"><span>✨</span>Չորացնել</button></div></div><script>
(()=>{const bgImage=new Image();bgImage.onload=()=>{document.querySelector('#scene').style.opacity='0'};bgImage.src='./carwash_background.webp';const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';let stage=0,progress=0,down=false,seed=19,particles=[];const canvas=$('#fx'),ctx=canvas.getContext('2d');const groups=['#dirt','#stains','#foam','#wet'];const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};function ellipse(group,x,y,rx,ry,color,opacity){const e=document.createElementNS(NS,'ellipse');for(const [k,v] of Object.entries({cx:x,cy:y,rx,ry,fill:color,opacity}))e.setAttribute(k,v);$(group).append(e)}function init(){for(const g of groups)$(g).replaceChildren();seed=19;for(let i=0;i<170;i++){let x=25+rand()*345,y=285+rand()*130;ellipse('#dirt',x,y,3+rand()*18,2+rand()*9,rand()>.5?'#76503a':'#97704c',.8+rand()*.2)}for(let i=0;i<48;i++)ellipse('#stains',25+rand()*345,293+rand()*113,4+rand()*13,2+rand()*7,'#d8c1a2',.5+rand()*.3);for(let i=0;i<110;i++)ellipse('#foam',25+rand()*345,286+rand()*125,2+rand()*12,2+rand()*10,rand()>.4?'#f4ffff':'#d5f6ff',.7+rand()*.3);for(let i=0;i<80;i++)ellipse('#wet',25+rand()*345,285+rand()*125,1+rand()*2,8+rand()*20,'#a8e6f8',.4+rand()*.3);stage=0;progress=0;particles=[];$('#win').classList.remove('show');update()}function update(){const p=progress;$('#bar').style.width=(p*100)+'%';const texts=['🧽 Սպունգով մաքրիր ցեխը · 1/4','🫧 Փրփուրով մաքրիր լաքաները · 2/4','🚿 Կարշերով լվա փրփուրը · 3/4','✨ Չորացրու մեքենան · 4/4'];$('#instruction').textContent=texts[stage]||'Պատրաստ է';for(const [i,id] of ['sponge','soap','rinse','dry'].entries())$(('#'+id)).classList.toggle('active',i===stage);const g=groups.map(s=>$(s));g[0].style.opacity=stage===0?1-p*.78:stage===1?.22*(1-p):0;g[1].style.opacity=stage===0?0:stage===1?1-p*.75:0;g[2].style.opacity=stage<1?0:stage===1?p:stage===2?1-p:0;g[3].style.opacity=stage<2?0:stage===2?p:stage===3?1-p:0}function next(){stage++;progress=0;if(stage>=4){$('#win').classList.add('show');$('#bar').style.width='100%';$('#instruction').textContent='🌟 Իդեալական մաքուր մեքենա';return}update()}function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);function wash(e){if(stage>=4)return;const r=$('#carLayer').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*390,y=(e.clientY-r.top)/r.height*720;if(x<20||x>374||y<270||y>449)return;progress=Math.min(1,progress+.022);for(let i=0;i<8;i++)particles.push({x:e.clientX,y:e.clientY,vx:(rand()-.5)*5,vy:(rand()-.5)*4,life:1,r:2+rand()*5});if(particles.length>140)particles.splice(0,particles.length-140);if(progress>=1)next();else update()}const view=$('#view');view.addEventListener('pointerdown',e=>{down=true;view.setPointerCapture(e.pointerId);wash(e)});view.addEventListener('pointermove',e=>{if(down)wash(e)});view.addEventListener('pointerup',()=>down=false);view.addEventListener('pointercancel',()=>down=false);for(const [i,id] of ['sponge','soap','rinse','dry'].entries())$('#'+id).onclick=()=>{$('#instruction').textContent=i===stage?['🧽 Մաքրիր ցեխը','🫧 Փրփուր քսիր','🚿 Ջրով լվա','✨ Չորացրու'][stage]:'Սկզբում ավարտիր ընթացիկ փուլը'};$('#again').onclick=init;function frame(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life-=.05;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=stage===1?'#f9ffff':stage===2?'#a9efff':'#d5f6f7';ctx.beginPath();ctx.arc(p.x-r.left,p.y-r.top,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(frame)}init();frame()})();
