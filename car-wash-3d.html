<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG ավտոլվացում</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;background:#b9d8dd}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#bcd5d5 url('./carwash_background.webp') center center / cover no-repeat}svg{display:block;width:100%;height:100%}#scene{position:absolute;inset:0}#carLayer{position:absolute;left:2%;right:2%;top:35%;height:39%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 3px #20323a35);pointer-events:none}#carLayer::before{content:"";position:absolute;z-index:0;left:8%;right:8%;top:78%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(4,9,14,.94) 0%,rgba(7,13,18,.76) 43%,rgba(10,18,23,.34) 73%,transparent 100%);filter:blur(5px);transform:scaleY(.72)}.car-stage{z-index:1;position:absolute;width:100%;height:auto;max-height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease;user-select:none;-webkit-user-drag:none}.car-stage:first-child{opacity:1}#washCanvas{position:absolute;z-index:2;width:100%;height:100%;touch-action:none}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#instruction{position:absolute;top:8px;left:10px;right:10px;padding:8px;border-radius:14px;background:#ffffffd8;text-align:center;color:#35505c;font-size:14px;font-weight:900}#progress{height:11px;border-radius:14px;background:#5e8090;margin:8px 12px 3px;overflow:hidden;border:2px solid white}#bar{height:100%;width:0;background:linear-gradient(90deg,#68d7e4,#8feab7);transition:width .12s}#tools{display:flex;gap:6px;padding:7px 7px max(8px,env(safe-area-inset-bottom));background:#d8edf0}button{flex:1;min-width:0;border:2px solid white;border-bottom:5px solid #9bacc2;border-radius:13px;background:linear-gradient(#fff9e7,#e8bd80);color:#6c482c;font-size:12px;font-weight:900;padding:9px 3px}button.active{background:linear-gradient(#e4fffd,#86d6e5);color:#315a65}button span{display:block;font-size:25px}#win{position:absolute;inset:0;display:none;place-items:center;background:#234554a9}#win.show{display:grid}#win>div{background:linear-gradient(#fff9e9,#f1cb90);padding:24px;border:5px solid white;border-radius:24px;text-align:center;font-weight:900;color:#62402a}#win b{font-size:50px;display:block}#win button{padding:12px 20px;margin-top:14px}</style></head><body><div id="app"><div id="view"><svg id="scene" viewBox="0 0 390 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="walls" x2="0" y2="1"><stop stop-color="#f9fbf7"/><stop offset="1" stop-color="#c1d4d3"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#a9bdc0"/><stop offset="1" stop-color="#617e85"/></linearGradient><pattern id="tiles" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" stroke="#9eb6b5" fill="none" stroke-width="1.2" opacity=".5"/></pattern></defs><path fill="url(#walls)" d="M0 0H390V445H0Z"/><path fill="url(#tiles)" d="M0 0H390V445H0Z"/><path d="M0 275H390V445H0Z" fill="#9cb4b7" opacity=".7"/><path d="M0 445H390V720H0Z" fill="url(#floor)"/><path d="M0 445H390V720H0Z" fill="url(#tiles)" opacity=".5"/><path d="M0 0H390V64H0Z" fill="#d9e2de"/><path d="M90 0V105M295 0V105" stroke="#d4dddb" stroke-width="22"/><path d="M0 65H390" stroke="#b4c5c2" stroke-width="5"/><rect x="15" y="49" width="150" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><rect x="230" y="49" width="145" height="13" rx="6" fill="#f9ffff" stroke="#a6c6ca" stroke-width="3"/><path d="M0 440H390" stroke="#d4e0de" stroke-width="5"/><path d="M17 495L373 495L387 513H3Z" fill="#354c53"/><path d="M28 503H363" stroke="#a8c6c9" stroke-width="7" stroke-dasharray="6 7"/><path d="M0 575H390M195 514V720" stroke="#c1d3d6" stroke-width="2" opacity=".35"/><path d="M6 270V442" stroke="#5b777c" stroke-width="12"/><path d="M6 290Q34 330 11 383" stroke="#e86c44" fill="none" stroke-width="7"/></svg><div id="carLayer"><img class="car-stage" id="car-stage-0" src="./car_stage_1_muddy.png" alt="Մեքենայի 1-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-1" src="./car_stage_2_foam.png" alt="Մեքենայի 2-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-2" src="./car_stage_3_wet.png" alt="Մեքենայի 3-րդ վիճակը" draggable="false"><img class="car-stage" id="car-stage-3" src="./car_stage_4_clean.png" alt="Մեքենայի 4-րդ վիճակը" draggable="false"><canvas id="washCanvas" aria-label="Ինտերակտիվ ավտոլվացում"></canvas></div><canvas id="fx"></canvas><div id="instruction">🧽 Սպունգով մաքրիր ցեխը · 1/4</div><div id="win"><div><b>🏆</b>Ապրե՛ս, մեքենան փայլում է։<p><button id="again">Կրկին խաղալ</button></p></div></div></div><div id="progress"><div id="bar"></div></div><div id="tools"><button id="sponge" class="active"><span>🧽</span>Սպունգ</button><button id="soap"><span>🫧</span>Փրփուր</button><button id="rinse"><span>🚿</span>Կարշեր</button><button id="dry"><span>✨</span>Չորացնել</button></div></div><script>
(()=>{'use strict';
const $=s=>document.querySelector(s), canvas=$('#washCanvas'),ctx=canvas.getContext('2d'),view=$('#view'),car=$('#carLayer'),fx=$('#fx'),fctx=fx.getContext('2d');
const files=['car_stage_1_muddy.png','car_stage_2_foam.png','car_stage_3_wet.png','car_stage_4_clean.png'];
const imgs=files.map(src=>{let im=new Image();im.src=src;return im});
const W=700,H=420;canvas.width=W;canvas.height=H;
const layer=document.createElement('canvas');layer.width=W;layer.height=H;const lc=layer.getContext('2d');
const mask=document.createElement('canvas');mask.width=W;mask.height=H;const mc=mask.getContext('2d',{willReadFrequently:true});
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');
let ready=false,stage=0,down=false,last=null,particles=[],allowed=new Uint8Array(W*H),visited=new Uint8Array(48*28),cells=0,total=1,paintBounds=null;
function bounds(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const t=c.getContext('2d',{willReadFrequently:true});t.drawImage(im,0,0);const d=t.getImageData(0,0,c.width,c.height).data;let l=c.width,r=-1,top=c.height,b=-1;for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2)if(d[(y*c.width+x)*4+3]>45){l=Math.min(l,x);r=Math.max(r,x);top=Math.min(top,y);b=Math.max(b,y)}return r<0?null:{l,r,t:top,b}}
const normalized=[];
async function load(){try{await Promise.all(imgs.map(i=>i.decode()));const b0=bounds(imgs[0]);if(!b0)throw Error('No alpha');const target={x:30,y:52,w:640,h:316};for(let i=0;i<4;i++){const b=bounds(imgs[i]);const c=document.createElement('canvas');c.width=W;c.height=H;const t=c.getContext('2d');if(b)t.drawImage(imgs[i],b.l,b.t,b.r-b.l+1,b.b-b.t+1,target.x,target.y,target.w,target.h);normalized.push(c)}const d=normalized[0].getContext('2d').getImageData(0,0,W,H).data;for(let i=0;i<W*H;i++)allowed[i]=d[i*4+3]>45?1:0;ready=true;init()}catch(e){console.error('Car images failed',e);$('#instruction').textContent='Մեքենայի նկարները չեն բեռնվել'}} 
function makeLayer(){lc.clearRect(0,0,W,H);mc.clearRect(0,0,W,H);if(stage===0){lc.drawImage(normalized[0],0,0);mc.fillStyle='#fff';mc.fillRect(0,0,W,H)}else if(stage===1){/* Foam is drawn by the child's finger, never a pre-foamed picture. */}else if(stage===2){lc.drawImage(normalized[1],0,0);mc.fillStyle='#fff';mc.fillRect(0,0,W,H)}else if(stage===3){lc.drawImage(normalized[2],0,0);mc.fillStyle='#fff';mc.fillRect(0,0,W,H)}}
function init(){stage=0;down=false;last=null;particles=[];$('#win').classList.remove('show');enterStage()}
function enterStage(){visited.fill(0);cells=0;total=0;for(let gy=0;gy<28;gy++)for(let gx=0;gx<48;gx++){const x=Math.floor((gx+.5)*W/48),y=Math.floor((gy+.5)*H/28);if(allowed[y*W+x])total++}makeLayer();update();draw()}
function update(){const txt=['🧽 Մաքրիր ցեխը՝ ամբողջ մեքենայով · 1/4','🫧 Քսիր փրփուրը մատով · 2/4','🚿 Լվա փրփուրը ջրով · 3/4','✨ Չորացրու մեքենան · 4/4'];$('#instruction').textContent=txt[stage];$('#bar').style.width=Math.min(100,Math.round(cells/Math.max(total,1)*100))+'%';['sponge','soap','rinse','dry'].forEach((id,i)=>$('#'+id).classList.toggle('active',i===stage))}
function draw(){if(!ready)return;ctx.clearRect(0,0,W,H);ctx.drawImage(normalized[stage===0?3:stage===1?3:stage===2?2:3],0,0);if(stage===1){ctx.save();ctx.globalAlpha=.19;ctx.drawImage(normalized[0],0,0);ctx.restore()}if(stage===2||stage===3){}if(stage!==1){tc.clearRect(0,0,W,H);tc.drawImage(layer,0,0);tc.globalCompositeOperation='destination-in';tc.drawImage(mask,0,0);tc.globalCompositeOperation='source-over';ctx.drawImage(tmp,0,0)}else{tc.clearRect(0,0,W,H);tc.drawImage(layer,0,0);tc.globalCompositeOperation='destination-in';tc.drawImage(normalized[3],0,0);tc.globalCompositeOperation='source-over';ctx.drawImage(tmp,0,0)}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function touch(x,y){if(x<0||x>=W||y<0||y>=H||!allowed[Math.floor(y)*W+Math.floor(x)])return;const rad=stage===1?29:stage===2?31:stage===3?24:23;if(stage===1){lc.save();lc.beginPath();lc.arc(x,y,rad,0,Math.PI*2);lc.clip();lc.fillStyle='rgba(230,251,255,.93)';lc.fillRect(x-rad,y-rad,rad*2,rad*2);lc.restore();lc.fillStyle='rgba(248,255,255,.65)';for(let i=0;i<7;i++){const a=Math.random()*6.283,rr=Math.random()*rad;lc.beginPath();lc.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,2+Math.random()*5,0,6.283);lc.fill()}}else{mc.save();mc.globalCompositeOperation='destination-out';mc.fillStyle='rgba(0,0,0,.32)';mc.beginPath();mc.arc(x,y,rad,0,6.283);mc.fill();mc.restore()}const gx=Math.floor(x/W*48),gy=Math.floor(y/H*28);for(let yy=Math.max(0,gy-2);yy<=Math.min(27,gy+2);yy++)for(let xx=Math.max(0,gx-2);xx<=Math.min(47,gx+2);xx++){const px=Math.floor((xx+.5)*W/48),py=Math.floor((yy+.5)*H/28);if(!allowed[py*W+px]||Math.hypot(px-x,py-y)>rad)returnCell();else{const idx=yy*48+xx;if(!visited[idx]){visited[idx]=1;cells++}}}function returnCell(){}}
function stroke(e){if(!ready||stage>3)return;const p=point(e),prev=last||p,dist=Math.hypot(p.x-prev.x,p.y-prev.y),steps=Math.max(1,Math.ceil(dist/9));for(let i=0;i<=steps;i++){const t=i/steps;touch(prev.x+(p.x-prev.x)*t,prev.y+(p.y-prev.y)*t)}last=p;draw();update();if(cells/Math.max(1,total)>.68){stage++;if(stage===4){ctx.clearRect(0,0,W,H);ctx.drawImage(normalized[3],0,0);$('#bar').style.width='100%';$('#instruction').textContent='🌟 Մեքենան փայլում է';$('#win').classList.add('show');down=false}else enterStage()}}
canvas.addEventListener('pointerdown',e=>{if(!ready||stage>=4)return;down=true;last=null;canvas.setPointerCapture(e.pointerId);stroke(e)});
canvas.addEventListener('pointermove',e=>{if(down)stroke(e)});
canvas.addEventListener('pointerup',()=>{down=false;last=null});canvas.addEventListener('pointercancel',()=>{down=false;last=null});
$('#again').onclick=init;['sponge','soap','rinse','dry'].forEach((id,i)=>$('#'+id).onclick=()=>{$('#instruction').textContent=i===stage?'Մատով աշխատիր մեքենայի ամբողջ մակերեսով':'Նախ ավարտիր ընթացիկ փուլը'});
const bg=new Image();bg.onload=()=>{$('#scene').style.opacity='0'};bg.src='./carwash_background.webp';load();
})();
</script></body></html>
