<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG • Կախարդական աշտարակ 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{background:radial-gradient(ellipse at 48% 24%,#718eaa,#233c61 65%,#14233c);color:#fff}#app{height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;padding:10px 10px max(10px,env(safe-area-inset-bottom));gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{background:linear-gradient(#ffe7b5,#c88d50);color:#754622;border:3px solid #a86a39;border-bottom-width:5px;border-radius:17px;box-shadow:inset 0 2px #fff8,0 5px 12px #0b182655;font-weight:900;padding:9px;text-align:center}h1{font-size:clamp(15px,4.1vw,22px);margin:0;flex:1}.pill.small{font-size:13px}#scene{flex:1;min-height:230px;position:relative;border:4px solid #ba8b5b;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 52% 40%,#668ba0,#294866 65%,#182e4d);box-shadow:inset 0 4px 28px #101c3b88,0 5px 15px #09152766}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;text-align:center;font-weight:850;text-shadow:0 2px 6px #081b2b}#feedback{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:72px;pointer-events:none;opacity:0;transition:opacity .2s}#feedback.show{opacity:1}.tray{padding:10px;background:linear-gradient(145deg,#dba46a,#955e37);border:4px solid #f5d09a;border-bottom-color:#704423;border-radius:22px;box-shadow:0 5px 14px #101c2a66}.traytitle{text-align:center;font-weight:850;margin-bottom:8px}#pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.piece{height:clamp(64px,18vw,91px);border-radius:15px;background:linear-gradient(#ffedcc,#dfb47e);border:3px solid #ffe3b4;box-shadow:0 4px 0 #9d693d;display:grid;place-items:center;font-size:38px;cursor:pointer;touch-action:none}.piece:active{transform:translateY(3px);box-shadow:0 1px 0 #9d693d}.piece:disabled{opacity:.38}.piece.selected{outline:4px solid #68f4ff;filter:brightness(1.12)}.piece .swatch{width:52%;height:48%;border-radius:9px;box-shadow:inset -9px -7px 9px #0003,inset 7px 6px 8px #fff8,0 7px 5px #0003;transform:rotate(-14deg)}#controls{display:flex;justify-content:center;gap:8px}button{font:inherit;font-weight:800}#controls button,#next{background:linear-gradient(#adf883,#3ab85b);border:3px solid #c4ffa2;border-bottom:5px solid #177637;border-radius:14px;padding:10px 14px;color:#12522b}#overlay{position:absolute;inset:0;background:#102238bd;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}#overlay.show{display:flex}.modal{width:100%;max-width:350px;text-align:center;background:linear-gradient(#fff0cb,#dfad70);color:#694122;border:7px solid #9f693f;border-radius:27px;padding:20px;box-shadow:0 12px 40px #0008}.award{font-size:80px}.modal h2{margin:7px 0 18px}#next{min-width:190px;font-size:18px}@media(max-height:680px){#app{gap:5px}.piece{height:59px}.tray{padding:6px}header .pill{padding:5px}}
</style></head><body><div id="app"><header><span class="pill small">AREG</span><h1 class="pill">Կախարդական աշտարակ 3D</h1><span class="pill small" id="phase">1 / 5</span></header><div id="scene"><div id="hud">Ընտրիր դետալը և տեղադրիր աշտարակի վրա</div><div id="feedback"></div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="result">Ապրե՛ս</h2><button id="next">Շարունակել ✓</button></div></div></div><div class="tray"><div class="traytitle">Ընտրիր ճիշտ դետալը</div><div id="pieces"></div></div><div id="controls"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="restart">⟳ Սկսել նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s), host=$('#scene'), tray=$('#pieces'), colors=['#f35365','#f8b641','#4ac4e6','#9b72f0','#68cc83','#f18bbd','#ff824c','#53a6f7'], types=['box','cylinder','cone','oct','star','sphere'];
let stage=0,placed=[],selected=null,meshes=[],busy=false,raf=0;const stages=[[0,1,2],[2,0,3,1],[1,3,0,4,2],[4,2,0,3,1],[0,4,2,1,3,5]];
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff2da,0x274067,2.5));const key=new THREE.DirectionalLight(0xffe5b2,3.2);key.position.set(-4,9,8);scene.add(key);const rim=new THREE.DirectionalLight(0x80d8ff,2.2);rim.position.set(6,5,-5);scene.add(rim);
const root=new THREE.Group();scene.add(root);
const wood=new THREE.MeshStandardMaterial({color:0xb97840,roughness:.62,metalness:.02});const gold=new THREE.MeshStandardMaterial({color:0xffd58b,metalness:.55,roughness:.27});
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.35,2.5,.35,64),wood);base.position.y=-2.0;root.add(base);const rimBase=new THREE.Mesh(new THREE.TorusGeometry(2.32,.10,12,80),gold);rimBase.rotation.x=Math.PI/2;rimBase.position.y=-1.79;root.add(rimBase);
const plinth=new THREE.Mesh(new THREE.CylinderGeometry(1.28,1.38,.2,64),gold);plinth.position.y=-1.72;root.add(plinth);
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshBasicMaterial({color:0x142f46,transparent:true,opacity:.25}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.24;scene.add(floor);
for(let i=0;i<16;i++){const x=Math.sin(i*2.4)*5,y=Math.cos(i*3.1)*2,z=-2.5-i*.15;const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.05+(i%3)*.022,0),new THREE.MeshBasicMaterial({color:i%2?0xffe2a0:0xa1e8ff,transparent:true,opacity:.65}));m.position.set(x,y,z);scene.add(m)}
const mat=i=>new THREE.MeshStandardMaterial({color:new THREE.Color(colors[i%colors.length]),metalness:.15,roughness:.28});
function geometry(t){if(t===0)return new THREE.BoxGeometry(1.7,.73,1.7,2,1,2);if(t===1)return new THREE.CylinderGeometry(.93,.93,.73,48);if(t===2)return new THREE.ConeGeometry(1.05,.77,48);if(t===3)return new THREE.CylinderGeometry(.92,.92,.73,8);if(t===4)return new THREE.DodecahedronGeometry(.95,0);return new THREE.SphereGeometry(.87,40,24)}
function addPart(t,index,animated=true){const m=new THREE.Mesh(geometry(t),mat(t));m.position.y=animated?3.4:-1.25+index*.79;m.rotation.y=t*.31+.2;m.userData={target:-1.25+index*.79,index};root.add(m);meshes.push(m);if(!animated)m.position.y=m.userData.target;return m}
function options(){tray.innerHTML='';const correct=stages[stage][placed.length];const pool=[correct,...types.map((_,i)=>i).filter(i=>i!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);pool.forEach(t=>{const b=document.createElement('button');b.className='piece';b.setAttribute('aria-label','Դետալ '+(t+1));const s=document.createElement('span');s.className='swatch';s.style.background=colors[t];s.style.borderRadius=t===1||t===5?'50%':t===2?'50% 50% 12% 12%':'9px';b.append(s);b.onclick=()=>choose(t,b);tray.append(b)})}
function choose(t,b){if(busy)return;tray.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=t;const correct=stages[stage][placed.length];if(t!==correct){flash('✕',false);b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});return}busy=true;addPart(t,placed.length);placed.push(t);flash('✓',true);setTimeout(()=>{busy=false;if(placed.length===stages[stage].length){$('#award').textContent=stage===4?'🏆':'⭐';$('#result').textContent=stage===4?'Դու կառուցեցիր բոլոր աշտարակները':'Աշտարակը պատրաստ է';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')}else options()},700)}
let flashTimer;function flash(symbol,ok){const f=$('#feedback');f.textContent=symbol;f.style.color=ok?'#79ff99':'#ff7777';f.classList.add('show');clearTimeout(flashTimer);flashTimer=setTimeout(()=>f.classList.remove('show'),500)}
function reset(){meshes.forEach(m=>{root.remove(m);m.geometry.dispose();m.material.dispose()});meshes=[];placed=[];busy=false;selected=null;$('#phase').textContent=(stage+1)+' / 5';$('#overlay').classList.remove('show');options()}
$('#next').onclick=()=>{stage=(stage+1)%5;reset()};$('#restart').onclick=()=>{stage=0;reset()};$('#undo').onclick=()=>{if(busy||!placed.length)return;placed.pop();const m=meshes.pop();root.remove(m);m.geometry.dispose();m.material.dispose();options()};$('#hint').onclick=()=>{const t=stages[stage][placed.length];const b=[...tray.querySelectorAll('.piece')].find(x=>x.getAttribute('aria-label')==='Դետալ '+(t+1));if(b){b.animate([{boxShadow:'0 0 0 0 #8cff8a'},{boxShadow:'0 0 0 8px #8cff8a'},{boxShadow:'0 0 0 0 #8cff8a'}],{duration:900,iterations:3})}};
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;root.rotation.y+=dx*.009;down={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>down=null);renderer.domElement.addEventListener('pointercancel',()=>down=null);
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(6.3,3.7,Math.max(11,13*(.8/(w/h))));camera.lookAt(0,.0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
let prev=0;function tick(time){raf=requestAnimationFrame(tick);const dt=Math.min(40,time-prev||16);prev=time;for(const m of meshes){const target=m.userData.target;if(Math.abs(m.position.y-target)>.005)m.position.y+=(target-m.position.y)*Math.min(.24,dt*.012);else m.position.y=target}renderer.render(scene,camera)}reset();raf=requestAnimationFrame(tick);
</script></body></html>
