<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Փոքրիկ մեխանիկ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#d7e9ed;color:#51402d;touch-action:manipulation}button{font:inherit;cursor:pointer;border:0}#app{height:100dvh;min-height:300px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 8%,#fff8e4,#d9e8e7 70%)}.heading{text-align:center;padding:9px 8px 3px;font-weight:900;font-size:clamp(16px,4vw,23px);color:#66513a}.sub{text-align:center;font-size:clamp(12px,3vw,15px);color:#816e55;min-height:22px}.workshop{position:relative;flex:1;min-height:0;margin:7px 12px 0;border:9px solid #a87548;border-bottom:15px solid #875a35;border-radius:27px;background:linear-gradient(125deg,#a6d4d7,#dff1ec 45%,#9ac2bf);box-shadow:inset 0 4px 14px #fff9,0 10px 0 #654a30,0 14px 22px #59472a44;overflow:hidden}.workshop:before{content:"";position:absolute;left:7%;right:7%;top:5%;height:35%;border:8px solid #e4c99e;border-radius:18px;background:linear-gradient(160deg,#d5f5f8,#f3fff4);box-shadow:inset 0 0 0 4px #9e6b3e,0 6px 12px #324b4b33}.shelf{position:absolute;top:34%;left:4%;width:92%;height:15px;border-radius:8px;background:linear-gradient(#f6dca5,#956439);box-shadow:0 8px 8px #40301833}.peg{position:absolute;top:9%;font-size:clamp(22px,6vw,42px);filter:drop-shadow(0 5px 2px #0002)}.peg.a{left:15%}.peg.b{right:17%}.bench{position:absolute;bottom:0;left:0;right:0;height:23%;background:linear-gradient(#f7d29a 0 12%,#a86d3b 13%,#bd8550 70%,#835332);box-shadow:0 -9px 16px #4c302b25}.scene{position:absolute;inset:20% 2% 14%;display:grid;place-items:center}.toy{position:relative;width:min(75vw,320px);height:min(46vw,200px);max-height:70%;filter:drop-shadow(0 14px 7px #40342a3b);animation:arrive .55s cubic-bezier(.2,1.3,.4,1) both}@keyframes arrive{from{opacity:0;transform:translateY(-35px) scale(.85)}to{opacity:1;transform:none}}.car-body{position:absolute;left:8%;top:37%;width:84%;height:43%;border-radius:35% 38% 18% 18%;background:linear-gradient(155deg,#ffe78c 0%,#f4a73c 45%,#db712c);border:5px solid #a85e2d;box-shadow:inset 0 12px 7px #fff8,inset 0 -8px 4px #99492255}.car-roof{position:absolute;left:27%;top:12%;width:46%;height:39%;border-radius:50% 50% 6% 6%;background:linear-gradient(145deg,#fbe7a5,#e2a14d);border:5px solid #ad6b36}.window{position:absolute;left:34%;top:20%;width:32%;height:22%;border-radius:35% 35% 6% 6%;background:linear-gradient(140deg,#e9ffff,#74b4cf);border:4px solid #fff9}.wheel{position:absolute;bottom:6%;width:25%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#dce6ed 0 17%,#647a8a 18% 32%,#222c37 33% 69%,#4c535b 70% 83%,#161d23 84%);border:3px solid #151b20;box-shadow:inset 3px 4px 4px #fff5}.wheel.left{left:17%}.wheel.right{right:16%}.missing{background:radial-gradient(circle,#555 0 25%,#b67741 26% 35%,transparent 36%);border:4px dashed #fffa}.robot{position:absolute;width:47%;height:80%;left:27%;top:7%}.robot-head{position:absolute;left:13%;top:0;width:74%;height:37%;border-radius:24%;background:linear-gradient(135deg,#e2fcfa,#80becb 70%,#5694a4);border:5px solid #4f8593;box-shadow:inset 0 5px #fff8}.robot-eye{position:absolute;top:38%;left:24%;width:13%;aspect-ratio:1;border-radius:50%;background:#31516b;box-shadow:32px 0 #31516b}.robot-body{position:absolute;left:21%;top:38%;width:58%;height:43%;border-radius:19%;background:linear-gradient(135deg,#f8d989,#de994b);border:5px solid #b07745}.robot-arm{position:absolute;top:43%;width:20%;height:32%;border-radius:18px;background:linear-gradient(90deg,#7bafc0,#d2e8ed);border:4px solid #568597}.robot-arm.left{left:0}.robot-arm.right{right:0}.robot-leg{position:absolute;bottom:0;width:22%;height:18%;background:#6e9cab;border-radius:10px}.robot-leg.left{left:25%}.robot-leg.right{right:25%}.bolt{position:absolute;left:43%;top:53%;width:14%;aspect-ratio:1;border-radius:50%;background:#f4f0d6;border:5px solid #926338;display:grid;place-items:center;font-size:22px}.plane{position:absolute;inset:12% 3%;display:grid;place-items:center;font-size:clamp(105px,35vw,190px);filter:drop-shadow(0 6px 1px #6664)}.part-target{position:absolute;border:5px dashed #ffe47b;border-radius:50%;background:#fff4;box-shadow:0 0 0 5px #5c3b2b33;animation:pulse 1.3s infinite;pointer-events:none}@keyframes pulse{50%{box-shadow:0 0 0 11px #f5dd6944}}.part-target.wheel-slot{bottom:7%;left:16%;width:25%;aspect-ratio:1}.part-target.robot-slot{top:41%;right:0;width:24%;height:35%}.part-target.plane-slot{left:42%;top:45%;width:25%;height:24%}.tray{min-height:104px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 8px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#fff6dc,#ead2a6);border-top:5px solid #bd9160}.tool{position:relative;width:clamp(76px,25vw,116px);height:82px;border-radius:20px;background:linear-gradient(#fffdf0,#d9c3a0);border:4px solid #c69b65;box-shadow:0 6px 0 #9a724b,0 8px 12px #634e3730;display:grid;place-items:center;font-size:42px;touch-action:none;user-select:none}.tool:active{transform:translateY(3px);box-shadow:0 3px 0 #9a724b}.tool span{font-size:11px;position:absolute;bottom:3px;font-weight:800;color:#745d41}.done{position:absolute;inset:0;display:grid;place-items:center;background:#e4f7e9dc;z-index:9;text-align:center;animation:arrive .4s both}.done-card{border:8px solid #d8b77d;border-radius:26px;padding:20px 22px;background:linear-gradient(#fff8e6,#f5dba6);box-shadow:0 12px 25px #60462a44}.done .star{font-size:65px;animation:spin .7s both}@keyframes spin{from{transform:scale(.3) rotate(-35deg)}to{transform:scale(1) rotate(0)}}.next{background:linear-gradient(#87e6a0,#36a86b);padding:12px 28px;border-radius:20px;color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px #28784c}.counter{font-size:12px;color:#856b50;margin-top:7px}@media(max-height:550px){.tray{min-height:80px}.tool{height:60px;font-size:30px}.heading{padding:2px}.scene{inset:15% 2% 12%}}
</style><style>
#instruction{font-weight:750}.tool{transition:transform .13s;touch-action:none}.tool.active{transform:scale(1.12);background:#fff8bf}.toy{overflow:visible}.hotspot{position:absolute;border:3px dashed #fff3a5;border-radius:16px;box-shadow:0 0 0 4px #5b9a9b55;display:grid;place-items:center;font-size:clamp(20px,6vw,34px);background:#ffffff36;touch-action:none;user-select:none;z-index:3}.hotspot.ready{border-style:solid;background:#d5ffd3aa}.tool.used{opacity:.4}.tool small{position:absolute;bottom:2px;font-size:10px;font-weight:700;color:#6a5034}.tool span{display:none}.feedback{position:absolute;left:8%;right:8%;bottom:4%;font-size:15px;font-weight:850;text-align:center;color:#754a25;text-shadow:0 1px #fff}.hood{position:absolute;left:19%;top:23%;width:62%;height:25%;background:linear-gradient(#ffdf8a,#d67d37);border:5px solid #a55e31;border-radius:30px 30px 8px 8px;z-index:2;transform-origin:50% 95%;transition:transform .45s}.hood.open{transform:rotateX(67deg) translateY(-16px)}.engine{position:absolute;left:34%;top:30%;width:34%;height:24%;border-radius:9px;background:repeating-linear-gradient(90deg,#566e78 0 12px,#9fb7bd 12px 18px);border:4px solid #364b54;z-index:1}.screw{position:absolute;z-index:4;bottom:12%;left:27%;width:14%;aspect-ratio:1;border-radius:50%;background:#c4c9c8;border:4px solid #647079;display:grid;place-items:center;color:#47515a;font-size:24px;touch-action:none}.screw.turn{animation:turn .5s linear}@keyframes turn{to{transform:rotate(360deg)}}.testdrive{animation:drive 1.8s ease-in-out both!important}@keyframes drive{0%{transform:translateX(0)}50%{transform:translateX(30%) rotate(-3deg)}100%{transform:translateX(0)}}.statusdots{display:flex;gap:7px;justify-content:center;margin:5px}.statusdots i{height:8px;width:26px;background:#cab9a1;border-radius:8px}.statusdots i.on{background:#59b880}.scene{touch-action:none}.tool[data-tool]{font-size:36px}
</style></head><body><main id="app"><div class="heading">🔧 Փոքրիկ մեխանիկ</div><div class="sub" id="instruction" aria-live="polite"></div><section class="workshop" id="workshop"><div class="peg a">🪛</div><div class="peg b">🔨</div><div class="shelf"></div><div class="scene" id="scene"></div><div class="bench"></div></section><div class="tray" id="tray"></div></main><script>
'use strict';
const scene=document.querySelector('#scene'),tray=document.querySelector('#tray'),instruction=document.querySelector('#instruction'),workshop=document.querySelector('#workshop');
const jobs=[
 {name:'Մեքենայի վերանորոգում',steps:[
 {action:'tap',target:'hood',say:'Բացի՛ր կապոտը',icon:'👆'},
 {action:'drag',target:'engine',tool:'🔋',wrong:'🛞',say:'Տեղադրի՛ր նոր մարտկոցը'},
 {action:'tap',target:'hood',say:'Փակի՛ր կապոտը',icon:'👆'},
 {action:'drag',target:'wheel',tool:'🛞',wrong:'🪽',say:'Տեղադրի՛ր նոր անիվը'},
 {action:'rotate',target:'bolt',tool:'🔧',wrong:'🖌️',say:'Պտտի՛ր պտուտակը'},
 {action:'tap',target:'test',say:'Փորձարկի՛ր մեքենան',icon:'▶️'}]},
 {name:'Ռոբոտի վերանորոգում',steps:[
 {action:'tap',target:'arm',say:'Ստուգի՛ր ռոբոտի ձեռքը',icon:'👆'},
 {action:'drag',target:'arm',tool:'🦾',wrong:'🛞',say:'Տեղադրի՛ր նոր ձեռքը'},
 {action:'drag',target:'power',tool:'🔋',wrong:'🪛',say:'Տեղադրի՛ր մարտկոցը'},
 {action:'rotate',target:'bolt',tool:'🔧',wrong:'🖌️',say:'Ամրացրո՛ւ պտուտակը'},
 {action:'tap',target:'test',say:'Միացրո՛ւ ռոբոտին',icon:'▶️'}]},
 {name:'Ինքնաթիռի վերանորոգում',steps:[
 {action:'tap',target:'wing',say:'Ստուգի՛ր թևը',icon:'👆'},
 {action:'drag',target:'wing',tool:'🪽',wrong:'🛞',say:'Տեղադրի՛ր թևը'},
 {action:'rotate',target:'bolt',tool:'🪛',wrong:'🔋',say:'Ամրացրո՛ւ պտուտակը'},
 {action:'tap',target:'test',say:'Փորձարկի՛ր ինքնաթիռը',icon:'▶️'}]}];
const locations=[
 {hood:[27,27,46,27],engine:[41,42,21,22],wheel:[14,66,28,30],bolt:[23,70,20,24],test:[29,26,44,48]},
 {arm:[68,36,19,43],power:[40,52,19,23],bolt:[40,52,19,23],test:[29,24,44,51]},
 {wing:[37,37,29,33],bolt:[47,53,20,24],test:[27,24,48,52]}];
let job=0,stage=0,locked=false,rotateProgress=0,selected=false,activeDrag=null,feedbackTimer=0,doneJobs=0;
function shape(){
 if(job===0){return '<div class="toy mechanic-toy"><div class="car-roof"></div><div class="window"></div><div class="car-body"></div><div class="engine"></div><div class="hood '+(stage===1||stage===2?'open':'')+'"></div><div class="wheel right"></div><div class="wheel left '+(stage<4?'missing':'')+'"></div><div class="screw">✚</div></div>'}
 if(job===1){return '<div class="toy mechanic-toy"><div class="robot"><div class="robot-head"><div class="robot-eye"></div></div><div class="robot-body"></div><div class="robot-arm left"></div>'+(stage>=2?'<div class="robot-arm right"></div>':'')+'<div class="robot-leg left"></div><div class="robot-leg right"></div><div class="bolt">'+(stage>=3?'💚':'⚡')+'</div></div></div>'}
 return '<div class="toy mechanic-toy"><div class="plane">✈️</div></div>';
}
function getTarget(){return scene.querySelector('.mechanic-target')}
function getConfig(){return jobs[job].steps[stage]}
function message(str){clearTimeout(feedbackTimer);instruction.textContent=str;feedbackTimer=setTimeout(()=>{if(!locked)instruction.textContent=getConfig().say},1300)}
function makeButton(icon,correct){const b=document.createElement('button');b.type='button';b.className='tool';b.textContent=icon;b.setAttribute('aria-label',correct?'Ճիշտ գործիք':'Այլ գործիք');b.dataset.correct=String(correct);tray.append(b);return b}
function render(){
 locked=false;selected=false;rotateProgress=0;activeDrag=null;
 const config=getConfig();scene.innerHTML=shape();tray.replaceChildren();instruction.textContent=config.say;
 const toy=scene.querySelector('.mechanic-toy'),p=locations[job][config.target];
 const t=document.createElement('div');t.className='hotspot mechanic-target';Object.assign(t.style,{left:p[0]+'%',top:p[1]+'%',width:p[2]+'%',height:p[3]+'%'});
 t.textContent=config.action==='tap'?config.icon:config.action==='rotate'?'↻':'✦';toy.append(t);
 if(config.action==='tap'){t.style.cursor='pointer';t.addEventListener('click',finish);const prompt=document.createElement('div');prompt.textContent='👆 Հպի՛ր լուսավորված հատվածին';prompt.style.cssText='font-weight:800;text-align:center;font-size:14px';tray.append(prompt)}
 if(config.action==='drag'){
  makeButton(config.wrong,false);makeButton(config.tool,true);
  for(const b of tray.querySelectorAll('.tool'))enableDrag(b);
 }
 if(config.action==='rotate'){
  makeButton(config.wrong,false);makeButton(config.tool,true);
  for(const b of tray.querySelectorAll('.tool'))b.addEventListener('click',()=>{if(b.dataset.correct==='false'){message('Փորձի՛ր մյուս գործիքը');return}selected=true;b.classList.add('active');message('Պտտի՛ր լուսավորված պտուտակը');t.textContent='↻';});
  let angle=null;
  t.addEventListener('pointerdown',e=>{if(!selected||locked)return;t.setPointerCapture(e.pointerId);const r=t.getBoundingClientRect();angle=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));e.preventDefault()});
  t.addEventListener('pointermove',e=>{if(angle===null||locked)return;const r=t.getBoundingClientRect(),next=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));let delta=next-angle;while(delta>Math.PI)delta-=2*Math.PI;while(delta< -Math.PI)delta+=2*Math.PI;angle=next;rotateProgress+=Math.abs(delta);t.style.transform='rotate('+Math.round(rotateProgress*180/Math.PI)+'deg)';if(rotateProgress>=Math.PI*1.3)finish()});
  t.addEventListener('pointerup',()=>angle=null);t.addEventListener('pointercancel',()=>angle=null);
 }
 const dots=document.createElement('div');dots.className='statusdots';for(let i=0;i<jobs[job].steps.length;i++){const d=document.createElement('i');if(i<=stage)d.classList.add('on');dots.append(d)}tray.append(dots);
}
function enableDrag(button){
 button.addEventListener('pointerdown',e=>{if(locked)return;const rect=button.getBoundingClientRect();activeDrag={id:e.pointerId,button,correct:button.dataset.correct==='true',x:e.clientX,y:e.clientY,left:rect.left,top:rect.top};button.setPointerCapture(e.pointerId);button.classList.add('active');e.preventDefault()});
 button.addEventListener('pointermove',e=>{if(!activeDrag||activeDrag.id!==e.pointerId||activeDrag.button!==button)return;button.style.transform='translate('+(e.clientX-activeDrag.x)+'px,'+(e.clientY-activeDrag.y)+'px) scale(1.13)';button.style.zIndex='12'});
 button.addEventListener('pointerup',e=>{if(!activeDrag||activeDrag.id!==e.pointerId)return;const drag=activeDrag;activeDrag=null;button.style.transform='';button.style.zIndex='';button.classList.remove('active');const rect=getTarget().getBoundingClientRect();const inside=e.clientX>=rect.left-28&&e.clientX<=rect.right+28&&e.clientY>=rect.top-28&&e.clientY<=rect.bottom+28;if(!drag.correct){message('Այս գործիքը չի համապատասխանում');return}if(inside)finish();else message('Տա՛ր գործիքը լուսավորված տեղը')});
 button.addEventListener('pointercancel',()=>{activeDrag=null;button.style.transform='';button.classList.remove('active')});
}
function finish(){
 if(locked)return;locked=true;clearTimeout(feedbackTimer);instruction.textContent='Հրաշալի՜ է։';const t=getTarget();if(t){t.classList.add('ready');t.textContent='✓';t.style.transform='scale(1.08)'}
 const toy=scene.querySelector('.mechanic-toy'),test=getConfig().target==='test';if(test)toy.classList.add('testdrive');else{toy.style.transition='filter .3s';toy.style.filter='drop-shadow(0 0 12px #fff0a0)'}
 setTimeout(()=>{stage++;if(stage>=jobs[job].steps.length)complete();else render()},test?1900:650);
}
function complete(){
 locked=true;doneJobs=Math.max(doneJobs,job+1);scene.innerHTML=shape();tray.replaceChildren();const panel=document.createElement('div');panel.className='done';panel.innerHTML='<div class="done-card"><div class="star">🌟</div><h2>Ապրե՛ս, վարպետ</h2><p>'+jobs[job].name+'ն ավարտված է։</p><button class="next">Հաջորդ խաղալիքը ▶</button><div class="counter">'+doneJobs+' / '+jobs.length+'</div></div>';workshop.append(panel);panel.querySelector('button').addEventListener('click',()=>{panel.remove();job=(job+1)%jobs.length;stage=0;render()});
}
render();
</script></body></html>
