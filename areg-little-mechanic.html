<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Փոքրիկ մեխանիկ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#d7e9ed;color:#51402d;touch-action:manipulation}button{font:inherit;cursor:pointer;border:0}#app{height:100dvh;min-height:300px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 8%,#fff8e4,#d9e8e7 70%)}.heading{text-align:center;padding:9px 8px 3px;font-weight:900;font-size:clamp(16px,4vw,23px);color:#66513a}.sub{text-align:center;font-size:clamp(12px,3vw,15px);color:#816e55;min-height:22px}.workshop{position:relative;flex:1;min-height:0;margin:7px 12px 0;border:9px solid #a87548;border-bottom:15px solid #875a35;border-radius:27px;background:linear-gradient(125deg,#a6d4d7,#dff1ec 45%,#9ac2bf);box-shadow:inset 0 4px 14px #fff9,0 10px 0 #654a30,0 14px 22px #59472a44;overflow:hidden}.workshop:before{content:"";position:absolute;left:7%;right:7%;top:5%;height:35%;border:8px solid #e4c99e;border-radius:18px;background:linear-gradient(160deg,#d5f5f8,#f3fff4);box-shadow:inset 0 0 0 4px #9e6b3e,0 6px 12px #324b4b33}.shelf{position:absolute;top:34%;left:4%;width:92%;height:15px;border-radius:8px;background:linear-gradient(#f6dca5,#956439);box-shadow:0 8px 8px #40301833}.peg{position:absolute;top:9%;font-size:clamp(22px,6vw,42px);filter:drop-shadow(0 5px 2px #0002)}.peg.a{left:15%}.peg.b{right:17%}.bench{position:absolute;bottom:0;left:0;right:0;height:23%;background:linear-gradient(#f7d29a 0 12%,#a86d3b 13%,#bd8550 70%,#835332);box-shadow:0 -9px 16px #4c302b25}.scene{position:absolute;inset:20% 2% 14%;display:grid;place-items:center}.toy{position:relative;width:min(75vw,320px);height:min(46vw,200px);max-height:70%;filter:drop-shadow(0 14px 7px #40342a3b);animation:arrive .55s cubic-bezier(.2,1.3,.4,1) both}@keyframes arrive{from{opacity:0;transform:translateY(-35px) scale(.85)}to{opacity:1;transform:none}}.car-body{position:absolute;left:8%;top:37%;width:84%;height:43%;bo }.plane{position:absolute;inset:12% 3%;display:grid;place-items:center;font-size:clamp(105px,35vw,190px);filter:drop-shadow(0 6px 1px #6664)}.part-target{position:absolute;border:5px dashed #ffe47b;border-radius:50%;background:#fff4;box-shadow:0 0 0 5px #5c3b2b33;animation:pulse 1.3s infinite;pointer-events:none}@keyframes pulse{50%{box-shadow:0 0 0 11px #f5dd6944}}.part-target.wheel-slot{bottom:7%;left:16%;width:25%;aspect-ratio:1}.part-target.robot-slot{top:41%;right:0;width:24%;height:35%}.part-target.plane-slot{left:42%;top:45%;width:25%;height:24%}.tray{min-height:104px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 8px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#fff6dc,#ead2a6);border-top:5px solid #bd9160}.tool{position:relative;width:clamp(76px,25vw,116px);height:82px;border-radius:20px;background:linear-gradient(#fffdf0,#d9c3a0);border:4px solid #c69b65;box-shadow:0 6px 0 #9a724b,0 8px 12px #634e3730;display:grid;place-items:center;font-size:42px;touch-action:none;user-select:none}.tool:active{transform:translateY(3px);box-shadow:0 3px 0 #9a724b}.tool span{font-size:11px;position:absolute;bottom:3px;font-weight:800;color:#745d41}.done{position:absolute;inset:0;display:grid;place-items:center;background:#e4f7e9dc;z-index:9;text-align:center;animation:arrive .4s both}.done-card{border:8px solid #d8b77d;border-radius:26px;padding:20px 22px;background:linear-gradient(#fff8e6,#f5dba6);box-shadow:0 12px 25px #60462a44}.done .star{font-size:65px;animation:spin .7s both}@keyframes spin{from{transform:scale(.3) rotate(-35deg)}to{transform:scale(1) rotate(0)}}.next{background:linear-gradient(#87e6a0,#36a86b);padding:12px 28px;border-radius:20px;color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px #28784c}.counter{font-size:12px;color:#856b50;margin-top:7px}@media(max-height:550px){.tray{min-height:80px}.tool{height:60px;font-size:30px}.heading{padding:2px}.scene{inset:15% 2% 12%}}

#instruction{font-weight:750}.tool{transition:transform .13s;touch-action:none}.tool.active{transform:scale(1.12);background:#fff8bf}.toy{overflow:visible}.hotspot{position:absolute;border:3px dashed #fff3a5;border-radius:16px;box-shadow:0 0 0 4px #5b9a9b55;display:grid;place-items:center;font-size:clamp(20px,6vw,34px);background:#ffffff36;touch-action:none;user-select:none;z-index:3}.hotspot.ready{border-style:solid;background:#d5ffd3aa}.tool.used{opacity:.4}.tool small{position:absolute;bottom:2px;font-size:10px;font-weight:700;color:#6a5034}.tool span{display:none}.feedback{position:absolute;left:8%;right:8%;bottom:4%;font-size:15px;font-weight:850;text-align:center;color:#754a25;text-shadow:0 1px #fff}.hood{position:absolute;left:19%;top:23%;width:62%;height:25%;background:linear-gradient(#ffdf8a,#d67d37);border:5px solid #a55e31;border-radius:30px 30px 8px 8px;z-index:2;transform-origin:50% 95%;transition:transform .45s}.hood.open{transform:rotateX(67deg) translateY(-16px)}.engine{position:absolute;left:34%;top:30%;width:34%;height:24%;border-radius:9px;background:repeating-linear-gradient(90deg,#566e78 0 12px,#9fb7bd 12px 18px);border:4px solid #364b54;z-index:1}.screw{position:absolute;z-index:4;bottom:12%;left:27%;width:14%;aspect-ratio:1;border-radius:50%;background:#c4c9c8;border:4px solid #647079;display:grid;place-items:center;color:#47515a;font-size:24px;touch-action:none}.screw.turn{animation:turn .5s linear}@keyframes turn{to{transform:rotate(360deg)}}.testdrive{animation:drive 1.8s ease-in-out both!important}@keyframes drive{0%{transform:translateX(0)}50%{transform:translateX(30%) rotate(-3deg)}100%{transform:translateX(0)}}.statusdots{display:flex;gap:7px;justify-content:center;margin:5px}.statusdots i{height:8px;width:26px;background:#cab9a1;border-radius:8px}.statusdots i.on{background:#59b880}.scene{touch-action:none}.tool[data-tool]{font-size:36px}

:5px;justify-content:center;margin-top:5px}.mechanic-progress b{width:22px;height:7px;border-radius:5px;background:#c7b7a1}.mechanic-progress b.passed{background:#51ad7d}.tool.dragging{z-index:99!important;filter:drop-shadow(0 10px 7px #0004)}.tool:focus-visible,.next:focus-visible{outline:4px solid #4488aa}.mini-flag{position:absolute;right:5%;top:7%;font-size:25px}.toy.car-variant-blue .car-body{background:linear-gradient(150deg,#a9e8ff,#4294ca 60%,#27689a)}.toy.car-variant-red .car-body{background:linear-gradient(150deg,#ffc0aa,#ed6556 60%,#a83940)}.toy.car-variant-green .car-body{background:linear-gradient(150deg,#d4f6a7,#6dbf71 60%,#367b51)}.toy.robot-variant .robot-body{background:linear-gradient(140deg,#f8bbd4,#d57cb4)}.toy.robot-variant .robot-head{background:linear-gradient(140deg,#e8e1ff,#a7a1dc)}@media(max-height:650px){.heading{font-size:16px}.sub{font-size:12px}.tray{min-height:82px}.tool{height:62px}.scene{inset:16% 2% 13%}.toy{height:min(43vw,170px)}}
</style></head><body><main id="app"><div class="heading">🔧 Փոքրիկ մեխանիկ</div><div class="sub" id="instruction" aria-live="polite"></div><section class="workshop" id="workshop"><div class="peg a">🪛</div><div class="peg b">🔨</div><div class="shelf"></div><div class="scene" id="scene"></div><div class="bench"></div></section><div class="tray" id="tray"></div></main><script>
'use strict';
const scene=document.querySelector('#scene'),tray=document.querySelector('#tray'),instruction=document.querySelector('#instruction'),workshop=document.querySelector('#workshop');
const types=[
 {name:'Մեքենա',intro:'Մեքենան օգնության կարիք ունի',steps:[
 ['tap','hood','Բացի՛ր կապոտը'],['drag','engine','Տեղադրի՛ր մարտկոցը','🔋','🧽'],['tap','hood','Փակի՛ր կապոտը'],['drag','wheel','Տեղադրի՛ր անիվը','🛞','🔋'],['turn','bolt','Ամրացրո՛ւ անիվը','🔧','🖌️'],['wipe','body','Մաքրի՛ր մեքենան','🧽','🔧'],['tap','test','Փորձարկի՛ր մեքենան']]},
 {name:'Ռոբոտ',intro:'Ռոբոտը կորցրել է իր ուժը',steps:[
 ['tap','arm','Ստուգի՛ր ձեռքը'],['drag','arm','Տեղադրի՛ր նոր ձեռքը','🦾','🛞'],['drag','power','Տեղադրի՛ր մարտկոցը','🔋','🪽'],['turn','bolt','Ամրացրո՛ւ պտուտակը','🪛','🧽'],['wipe','body','Փայլեցրո՛ւ ռոբոտին','🧽','🛞'],['tap','test','Միացրո՛ւ ռոբոտին']]},
 {name:'Ինքնաթիռ',intro:'Ինքնաթիռը պատրաստվում է թռիչքի',steps:[
 ['tap','wing','Ստուգի՛ր թևը'],['drag','wing','Տեղադրի՛ր նոր թևը','🪽','🔋'],['turn','bolt','Ամրացրո՛ւ պտուտակը','🪛','🧽'],['wipe','body','Մաքրի՛ր թևերը','🧽','🔧'],['tap','test','Փորձարկի՛ր թռիչքը']]},
 {name:'Նավակ',intro:'Նավակը սպասում է վերանորոգման',steps:[
 ['tap','sail','Ստուգի՛ր առագաստը'],['drag','sail','Տեղադրի՛ր առագաստը','⛵','🛞'],['turn','bolt','Ամրացրո՛ւ հենակը','🔧','🔋'],['wipe','body','Մաքրի՛ր նավակը','🧽','🪽'],['tap','test','Փորձարկի՛ր նավակը']]}];
const locations=[
 {hood:[26,22,48,32],engine:[39,34,23,25],wheel:[12,66,30,30],bolt:[20,68,23,26],body:[20,39,60,35],test:[20,20,60,65]},
 {arm:[65,32,25,44],power:[40,49,21,26],bolt:[40,49,21,26],body:[31,38,39,42],test:[25,18,50,70]},
 {wing:[35,34,33,37],bolt:[48,50,23,28],body:[20,29,60,55],test:[20,18,60,70]},
 {sail:[40,20,30,44],bolt:[46,49,23,28],body:[20,51,60,32],test:[20,18,60,70]}];
const palettes=['blue','red','green','gold'];
const missions=Array.from({length:16},(_,i)=>({type:i%4,variant:Math.floor(i/4)}));
const KEY='areg-little-mechanic-progress-v3';
let mission=0,step=0,locked=false,selected=false,drag=null,turnAngle=null,turnTotal=0,wipeTotal=0,lastWipe=null,noticeTimer=null,audio=null,animTimer=null;
try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isInteger(stored.mission)&&stored.mission>=0&&stored.mission<missions.length)mission=stored.mission;if(Number.isInteger(stored.step)&&stored.step>=0&&stored.step<types[missions[mission].type].steps.length)step=stored.step}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify({mission,step}))}catch(e){}}
function sound(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784,1046]:kind==='bad'?[260,220]:kind==='turn'?[340]:[440,660];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='bad'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.1);g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.075,now+i*.1+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.16);o.connect(g);g.connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+.17)})}catch(e){}}
function config(){return types[missions[mission].type].steps[step]}
function currentType(){return missions[mission].type}
function notify(s,bad=false){clearTimeout(noticeTimer);instruction.textContent=s;if(bad)sound('bad');noticeTimer=setTimeout(()=>{if(!locked)instruction.textContent=config()[2]},1100)}
function toy(){
 const type=currentType(),variant=missions[mission].variant;
 if(type===0)return '<div class="toy mechanic-toy car-variant-'+palettes[variant]+'"><div class="car-roof"></div><div class="window"></div><div class="car-body"></div><div class="engine"></div><div class="hood '+(step>=1&&step<=2?'open':'')+'"></div><div class="wheel right"></div><div class="wheel left '+(step<4?'missing':'')+'"></div><div class="screw">✚</div></div>';
 if(type===1)return '<div class="toy mechanic-toy '+(variant%2?'robot-variant':'')+'"><div class="robot"><div class="robot-head"><div class="robot-eye"></div></div><div class="robot-body"></div><div class="robot-arm left"></div>'+(step>=2?'<div class="robot-arm right"></div>':'')+'<div class="robot-leg left"></div><div class="robot-leg right"></div><div class="bolt">'+(step>=3?'💚':'⚡')+'</div></div></div>';
 if(type===2)return '<div class="toy mechanic-toy"><div class="plane" style="transform:rotate('+(variant*6-10)+'deg)">✈️</div></div>';
 return '<div class="toy mechanic-toy" style="display:grid;place-items:center"><div style="font-size:clamp(110px,37vw,185px);filter:drop-shadow(0 9px 6px #364a4a66)">⛵</div></div>';
}
function targetRect(){return scene.querySelector('.mechanic-target').getBoundingClientRect()}
function inside(x,y,margin=25){const r=targetRect();return x>=r.left-margin&&x<=r.right+margin&&y>=r.top-margin&&y<=r.bottom+margin}
function toolButton(icon,correct){const b=document.createElement('button');b.className='tool';b.type='button';b.dataset.correct=correct?'yes':'no';b.textContent=icon;tray.append(b);return b}
function render(){
 clearTimeout(animTimer);locked=false;selected=false;drag=null;turnAngle=null;turnTotal=0;wipeTotal=0;lastWipe=null;
 const c=config(),type=currentType(),p=locations[type][c[1]];
 instruction.textContent=c[2];scene.innerHTML=toy();tray.replaceChildren();
 const model=scene.querySelector('.mechanic-toy');const t=document.createElement('div');t.className='hotspot mechanic-target';Object.assign(t.style,{left:p[0]+'%',top:p[1]+'%',width:p[2]+'%',height:p[3]+'%'});t.textContent=c[0]==='tap'?'👆':c[0]==='turn'?'↻':c[0]==='wipe'?'✨':'✦';model.append(t);
 if(c[0]==='tap'){t.addEventListener('click',success);const info=document.createElement('div');info.className='mechanic-help';info.textContent='👆 Հպի՛ր լուսավորված հատվածին';tray.append(info)}
 if(c[0]==='drag'||c[0]==='wipe'){const buttons=[toolButton(c[4],false),toolButton(c[3],true)];buttons.forEach(b=>setupDrag(b,c))}
 if(c[0]==='turn'){const buttons=[toolButton(c[4],false),toolButton(c[3],true)];buttons.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.correct==='no'){notify('Փորձի՛ր մյուս գործիքը',true);return}selected=true;b.classList.add('active');notify('Պտտի՛ր պտուտակը շրջանաձև');sound('tap')}));setupTurn(t)}
 const progress=document.createElement('div');progress.className='mechanic-progress';for(let i=0;i<types[type].steps.length;i++){const dot=document.createElement('b');if(i<=step)dot.classList.add('passed');progress.append(dot)}tray.append(progress);
}
function setupDrag(b,c){
 b.addEventListener('pointerdown',e=>{if(locked)return;drag={id:e.pointerId,b,correct:b.dataset.correct==='yes',x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY};b.setPointerCapture(e.pointerId);b.classList.add('dragging');e.preventDefault()});
 b.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||drag.b!==b)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;b.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';b.style.zIndex='20';if(c[0]==='wipe'&&drag.correct&&inside(e.clientX,e.clientY,8)){wipeTotal+=Math.hypot(e.clientX-drag.lastX,e.clientY-drag.lastY);if(wipeTotal>=175){drag=null;b.style.transform='';success();return}}drag.lastX=e.clientX;drag.lastY=e.clientY});
 b.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId||drag.b!==b)return;const d=drag;drag=null;b.classList.remove('dragging');b.style.transform='';b.style.zIndex='';if(!d.correct){notify('Այս գործիքը հարմար չէ',true);return}if(c[0]==='drag'&&inside(e.clientX,e.clientY))success();else if(c[0]==='wipe')notify('Սահեցրո՛ւ սպունգը խաղալիքի վրայով');else notify('Տա՛ր մասը լուսավորված տեղը')});
 b.addEventListener('pointercancel',()=>{drag=null;b.classList.remove('dragging');b.style.transform='';b.style.zIndex=''});
}
function setupTurn(t){
 t.addEventListener('pointerdown',e=>{if(!selected||locked){notify('Նախ ընտրի՛ր պտուտակահանը');return}t.setPointerCapture(e.pointerId);const r=t.getBoundingClientRect();turnAngle=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);e.preventDefault()});
 t.addEventListener('pointermove',e=>{if(turnAngle===null||locked)return;const r=t.getBoundingClientRect(),a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);let delta=a-turnAngle;while(delta>Math.PI)delta-=2*Math.PI;while(delta< -Math.PI)delta+=2*Math.PI;turnAngle=a;turnTotal+=Math.abs(delta);t.style.transform='rotate('+Math.round(turnTotal*180/Math.PI)+'deg)';if(turnTotal>Math.PI*1.6){turnAngle=null;success()}});
 t.addEventListener('pointerup',()=>turnAngle=null);t.addEventListener('pointercancel',()=>turnAngle=null);
}
function success(){
 if(locked)return;locked=true;clearTimeout(noticeTimer);sound('tap');instruction.textContent='Հրաշալի՜ է։';const t=scene.querySelector('.mechanic-target'),model=scene.querySelector('.mechanic-toy');if(t){t.classList.add('ready');t.textContent='✓';t.style.animation='none'}if(model){model.classList.add(config()[1]==='test'?'testdrive':'repaired')}const delay=config()[1]==='test'?1950:650;animTimer=setTimeout(()=>{step++;if(step>=types[currentType()].steps.length)complete();else{store();render()}},delay);
}
function confetti(parent){const layer=document.createElement('div');layer.className='celebration';for(let i=0;i<32;i++){const e=document.createElement('i');e.className='confetti';e.style.left=(Math.random()*100)+'%';e.style.background=['#e4b45b','#72b9cb','#db8da8','#9acb83'][i%4];e.style.animationDelay=(Math.random()*.8)+'s';layer.append(e)}parent.append(layer)}
function complete(){
 sound('win');scene.innerHTML=toy();tray.replaceChildren();const panel=document.createElement('div');panel.className='done';panel.innerHTML='<div class="done-card"><div class="star">🌟</div><h2>Ապրե՛ս, վարպետ</h2><p>'+types[currentType()].name+'ն արդեն աշխատում է։</p><button class="next">Հաջորդ խաղալիքը ▶</button><div class="counter">Առաջադրանք '+(mission+1)+' / '+missions.length+'</div></div>';workshop.append(panel);confetti(panel);panel.querySelector('button').addEventListener('click',()=>{panel.remove();mission=(mission+1)%missions.length;step=0;store();render()});
}
render();
</script></body></html>
