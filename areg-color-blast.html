<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c6efff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1.5vh,14px);padding:10px 8px;background:radial-gradient(circle at 50% 15%,#f9fcff,#a6dffa 72%,#8bc6ec)}header{display:flex;align-items:center;justify-content:space-between;width:min(96vw,500px);gap:6px}.pill{background:linear-gradient(#fff9e5,#ffdda1);border:3px solid #c48646;border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 #9a663b;font-weight:900;color:#835026;text-align:center;font-size:clamp(13px,3.7vw,19px)}#goal{font-size:clamp(13px,3.4vw,18px)}#board{position:relative;width:min(94vw,calc((100dvh - 245px)*.875),480px);aspect-ratio:7/8;border:9px solid #dba362;border-radius:25px;background:#7555ad;box-shadow:inset 0 4px 12px #402c6e,0 9px 0 #966039,0 14px 25px #5a74a777;padding:7px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:3px;touch-action:manipulation}.cell{position:relative;border:0;border-radius:9px;background:linear-gradient(145deg,var(--hi),var(--base) 55%,var(--lo));box-shadow:inset 2px 3px 3px #ffffff88,inset -3px -4px 4px #0002,0 3px 0 #352857;transition:transform .18s,opacity .18s;cursor:pointer;min-width:0;min-height:0}.cell:before{content:'';position:absolute;left:15%;top:9%;width:48%;height:14%;background:#ffffff65;border-radius:80%;transform:rotate(-16deg)}.cell:after{content:'';position:absolute;left:20%;bottom:13%;width:12%;height:11%;border-radius:50%;background:#ffffff55}.cell.pop{transform:scale(.1) rotate(25deg);opacity:0}.cell.new{animation:drop .32s cubic-bezier(.2,1.2,.5,1)}@keyframes drop{from{transform:translateY(-85px) scale(.85)}to{transform:translateY(0) scale(1)}}#status{height:28px;font-weight:900;color:#774580;text-shadow:0 2px #fff;font-size:clamp(15px,4vw,21px);text-align:center}footer{display:flex;gap:12px;justify-content:center;width:100%}button.action{border:3px solid white;border-radius:19px;background:linear-gradient(#ffe875,#ffa841);box-shadow:0 5px 0 #be7532;padding:10px 17px;font-size:17px;font-weight:900;color:#814a24}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#362c6b99;border-radius:14px;z-index:5}#overlay.show{display:flex}.modal{background:linear-gradient(#fffef0,#ffe4aa);border:6px solid #f5ae59;border-radius:26px;padding:22px;text-align:center;color:#78421e;box-shadow:0 14px 35px #2b184b80}.modal h2{margin:4px 0 14px;font-size:26px}.modal p{font-weight:800}#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;left:var(--x);top:var(--y);width:9px;height:9px;background:var(--color);border-radius:50%;animation:fly .5s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}@media(max-height:660px){#wrap{gap:5px}.pill{padding:5px 8px}#board{width:min(94vw,calc((100dvh - 180px)*.875),480px)}footer button.action{padding:6px 12px}}</style></head><body><main id="wrap"><header><div class="pill" id="level">Փուլ 1</div><div class="pill" id="goal">🎯 0 / 12</div><div class="pill" id="moves">👆 18</div></header><div id="status">Միացրո՛ւ 2 կամ ավելի նույն գույնի խորանարդ</div><div id="board"><div id="fx"></div><div id="overlay"><div class="modal"><h2 id="result">Ապրե՜ս 🌟</h2><p id="details"></p><button class="action" id="next">Շարունակել ➜</button></div></div></div><footer><button class="action" id="restart">↻ Նորից</button><button class="action" id="sound">🔊 Ձայն</button></footer></main><script>
(()=>{'use strict';const R=8,C=7,N=R*C,colors=[['#f65e73','#ffb2b7','#c83258'],['#4dbde9','#b0f1ff','#2589ca'],['#f8c64e','#fff2a2','#db8732'],['#82d96d','#d0ffb2','#46aa50'],['#aa83ed','#dfc8ff','#7c54c2']],board=document.getElementById('board'),fx=document.getElementById('fx'),overlay=document.getElementById('overlay');let grid=[],level=1,score=0,moves=18,target=12,locked=false,muted=false,audio=null,finished=false;const $=id=>document.getElementById(id);function tone(freq=380,dur=.12,type='sine'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.38,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}function rand(){return Math.floor(Math.random()*colors.length)}function update(){$('level').textContent='Փուլ '+level;$('goal').textContent='🎯 '+Math.min(score,target)+' / '+target;$('moves').textContent='👆 '+moves}function start(){grid=Array.from({length:N},rand);score=0;moves=Math.max(13,19-Math.min(level,6));target=10+level*2;locked=false;finished=false;overlay.classList.remove('show');$('status').textContent='Հպվի՛ր նույն գույնի խմբին';render();update()}function group(idx){let color=grid[idx],seen=new Set([idx]),stack=[idx];if(color==null)return[];while(stack.length){let i=stack.pop(),r=Math.floor(i/C),c=i%C;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let nr=r+dr,nc=c+dc,j=nr*C+nc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&!seen.has(j)&&grid[j]===color){seen.add(j);stack.push(j)}}}return [...seen]}function render(fresh=[]){[...board.querySelectorAll('.cell')].forEach(x=>x.remove());for(let i=0;i<N;i++){let b=document.createElement('button'),c=colors[grid[i]];b.className='cell'+(fresh.includes(i)?' new':'');b.style.setProperty('--base',c[0]);b.style.setProperty('--hi',c[1]);b.style.setProperty('--lo',c[2]);b.setAttribute('aria-label','Գունավոր խորանարդ');b.addEventListener('click',()=>tap(i));board.insertBefore(b,fx)}}function sparks(indices,color){let bounds=board.getBoundingClientRect();for(let i of indices.slice(0,18)){let cell=board.querySelectorAll('.cell')[i],rect=cell.getBoundingClientRect();for(let k=0;k<3;k++){let p=document.createElement('i');p.className='spark';p.style.setProperty('--x',(rect.left-bounds.left+rect.width/2)+'px');p.style.setProperty('--y',(rect.top-bounds.top+rect.height/2)+'px');p.style.setProperty('--dx',((Math.random()-.5)*90)+'px');p.style.setProperty('--dy',((Math.random()-.5)*110)+'px');p.style.setProperty('--color',colors[color][k]);fx.append(p);setTimeout(()=>p.remove(),520)}}}function tap(i){if(locked||finished)return;let indices=group(i);if(indices.length<2){tone(180,.09,'triangle');$('status').textContent='Փորձի՛ր կողք-կողքի նույն գույները';return}locked=true;const color=grid[i];sparks(indices,color);const cells=board.querySelectorAll('.cell');indices.forEach(j=>cells[j].classList.add('pop'));tone(320+Math.min(indices.length,9)*55,.17);score+=indices.length;moves--;$('status').textContent=indices.length>=5?'Վա՜յ, ինչ մեծ պայթյուն 🎉':'Ապրե՜ս, շարունակիր ⭐';update();setTimeout(()=>{for(let j of indices)grid[j]=null;for(let c=0;c<C;c++){let keep=[];for(let r=R-1;r>=0;r--){let v=grid[r*C+c];if(v!==null)keep.push(v)}for(let r=R-1;r>=0;r--)grid[r*C+c]=keep[R-1-r]??rand()}render(Array.from({length:N},(_,i)=>i));locked=false;if(score>=target){finish(true)}else if(moves<=0){finish(false)}else if(!grid.some((_,j)=>group(j).length>=2)){for(let j=0;j<N;j++)grid[j]=rand();render();$('status').textContent='Գույները խառնվեցին ✨'}},230)}function finish(win){finished=true;overlay.classList.add('show');$('result').textContent=win?'Ապրե՜ս 🌟':'Կրկին փորձենք 💛';$('details').textContent=win?'Դու հավաքեցիր '+score+' խորանարդ':'Մի քիչ էլ փորձենք միասին';$('next').textContent=win?'Հաջորդ փուլ ➜':'Կրկնել ↻';if(win){[540,660,800].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*140))}}$('next').onclick=()=>{if(score>=target)level++;start()};$('restart').onclick=()=>start();$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Անձայն':'🔊 Ձայն';if(!muted)tone(420)};start()})();
</script></body></html>
