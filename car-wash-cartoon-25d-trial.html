<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Մուլտային ավտոլվացում</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#a3c5d1;touch-action:none}#scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#d9edf0,#8ab8c6)}#garage{width:100%;height:100%;position:absolute;inset:0}#carArea{position:absolute;left:3%;right:3%;top:28%;height:43%;display:grid;place-items:center;filter:drop-shadow(0 18px 13px #2d485b50)}#car{width:100%;max-height:100%;overflow:visible;animation:enter .9s cubic-bezier(.2,.9,.2,1) both}@keyframes enter{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#meter{position:absolute;top:12px;left:14px;right:14px;height:13px;border:3px solid #f9fff9;border-radius:15px;background:#9db4b5;overflow:hidden;box-shadow:0 4px 10px #3b60643a}#bar{height:100%;width:0;background:linear-gradient(90deg,#7ae1c7,#4ebee2);transition:width .2s}#title{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:13px;font-weight:900;color:#385965;text-shadow:0 1px #fff}#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{border:3px solid #fff6df;border-bottom:6px solid #b58763;background:linear-gradient(#fff8e7,#f2c68d);border-radius:15px;min-height:62px;font-size:12px;font-weight:900;color:#744d31;padding:6px 1px;box-shadow:0 5px 14px #355c6555}button span{display:block;font-size:27px}button.active{background:linear-gradient(#e4ffff,#83d4e4);border-bottom-color:#5394ad}#result{position:absolute;inset:0;display:none;place-items:center;background:#284b58ad}#result.show{display:grid}#card{padding:25px;border:5px solid #fff6d9;background:linear-gradient(#fff7df,#eebf8e);border-radius:25px;text-align:center;font-weight:900;color:#795034}#card div{font-size:58px}#card button{margin-top:14px;padding:12px 24px}
</style></head><body><div id="scene">

4" stroke-width="2"/><path d="M100 565L20 800M310 565L400 800" stroke="#d0e0e1"/></g><rect x="0" y="190" width="13" height="320" rx="4" fill="#687c7f"/><path d="M6 250Q36 260 20 340" fill="none" stroke="#ef8152" stroke-width="7"/></svg>

<canvas id="fx"></canvas><div id="meter"><div id="bar"></div></div><div id="title">Մատով լվա՛ մեքենան ✨</div><div id="controls"><button id="sponge" class="active"><span>🧽</span>Մաքրել</button><button id="foam"><span>🫧</span>Փրփուր</button><button id="water"><span>🚿</span>Ջուր</button><button id="reset"><span>↺</span>Նորից</button></div><div id="result"><div id="card"><div>🌟</div>Ապրե՛ս, մեքենան փայլում է։<p><button id="again">Կրկին խաղալ</button></p></div></div></div><script>
(()=>{const $=s=>document.querySelector(s),svgNS='http://www.w3.org/2000/svg',mud=$('#mud'),canvas=$('#fx'),ctx=canvas.getContext('2d');let spots=[],particles=[],mode='sponge',down=false,clean=0,foam=0;let seed=43;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function resize(){canvas.width=innerWidth*Math.min(devicePixelRatio,2);canvas.height=innerHeight*Math.min(devicePixelRatio,2);ctx.setTransform(canvas.width/innerWidth,0,0,canvas.height/innerHeight,0,0)}addEventListener('resize',resize);resize();function reset(){mud.replaceChildren();spots=[];particles=[];clean=0;foam=0;seed=43;for(let i=0;i<125;i++){const el=document.createElementNS(svgNS,'ellipse');const x=42+rand()*520,y=151+rand()*128,rx=4+rand()*19,ry=3+rand()*10;el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('rx',rx);el.setAttribute('ry',ry);el.setAttribute('transform','rotate('+Math.round(rand()*90-45)+' '+x+' '+y+')');el.setAttribute('fill',rand()>.5?'#6a422f':'#896045');el.setAttribute('opacity',.7+rand()*.3);mud.append(el);spots.push({x,y,el,alpha:1})}$('#bar').style.width='0%';$('#result').classList.remove('show');setMode('sponge')}function setMode(m){mode=m;for(const b of document.querySelectorAll('#controls button'))b.classList.toggle('active',b.id===m)}for(const m of ['sponge','foam','water'])$('#'+m).onclick=()=>setMode(m);$('#reset').onclick=reset;$('#again').onclick=reset;function point(e){const r=$('#car').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*350}}function move(e){const p=point(e);if(p.x<25||p.x>575||p.y<92||p.y>310)return;for(const s of spots){const d=Math.hypot((s.x-p.x), (s.y-p.y)*1.3);if(d<37){s.alpha=Math.max(0,s.alpha-(mode==='water'?.12:mode==='sponge'?.09:.012));s.el.setAttribute('opacity',s.alpha)}}const amount=mode==='water'?20:mode==='foam'?9:5;for(let i=0;i<amount;i++)particles.push({x:e.clientX+(rand()-.5)*22,y:e.clientY+(rand()-.5)*22,vx:(rand()-.5)*5,vy:rand()*5-2,r:mode==='foam'?3+rand()*8:2+rand()*3,life:1,type:mode});if(particles.length>350)particles.splice(0,particles.length-350);clean=spots.reduce((n,s)=>n+1-s.alpha,0)/spots.length;$('#bar').style.width=Math.round(clean*100)+'%';if(clean>.94){$('#result').classList.add('show');down=false}}const area=$('#carArea');area.addEventListener('pointerdown',e=>{down=true;area.setPointerCapture(e.pointerId);move(e)});area.addEventListener('pointermove',e=>{if(down)move(e)});area.addEventListener('pointerup',()=>down=false);area.addEventListener('pointercancel',()=>down=false);function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.035;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.type==='foam'?'#f4ffff':p.type==='water'?'#b0f4ff':'#bb8753';ctx.fill();if(p.type==='foam'){ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke()}}ctx.globalAlpha=1;requestAnimationFrame(frame)}reset();frame()})();
</script></body></html>
