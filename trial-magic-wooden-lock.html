<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Կախարդական փայտե կողպեք</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif;color:#59351e}body{background:radial-gradient(ellipse at 50% 40%,#397b7b,#122d45 80%)}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}.head{position:absolute;z-index:4;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 13px);display:grid;grid-template-columns:50px 1fr 72px;gap:8px;pointer-events:none}.wood{pointer-events:auto;min-height:48px;display:grid;place-items:center;border:3px solid #b37b47;border-radius:17px;background:linear-gradient(#fff2cc,#eeb778);box-shadow:0 5px #81502d,inset 0 2px #fffbe9;font-weight:900;text-align:center}.wood a{font-size:28px;text-decoration:none;color:inherit}.wood.title{font-size:clamp(14px,4.3vw,21px)}.caption{position:absolute;z-index:4;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 79px);border:3px solid #ba8b58;border-radius:16px;background:#fff1cce9;padding:9px 7px;text-align:center;font-weight:900;font-size:clamp(14px,4vw,19px)}.caption small{display:block;color:#9c714c;font-size:12px;margin-top:3px}.bottom{position:absolute;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:10px}.progress{color:#fff4ce;font-weight:900;text-shadow:0 2px 5px #1c283d}.controls{display:flex;gap:9px}.btn{border:3px solid #fff4d2;border-radius:16px;background:linear-gradient(#70df85,#229a53);box-shadow:0 5px #196c41;padding:12px 22px;color:white;font-weight:900;font-size:17px;min-width:175px}.btn.alt{min-width:0;background:linear-gradient(#ffce89,#e89544);box-shadow:0 5px #ad6730}.btn:disabled{opacity:.55}.btn:active{transform:translateY(4px)}.modal{position:absolute;inset:0;z-index:10;background:#112c45a9;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.popup{width:min(360px,100%);background:linear-gradient(#fff6d9,#f0c78d);border:6px solid #b57c47;border-radius:26px;padding:26px 15px;text-align:center;box-shadow:0 18px 50px #0b223f99}.popup h2{margin:5px 0 16px}.popup .btn{width:100%}.error{position:absolute;z-index:20;top:42%;left:20px;right:20px;background:#fff2d8;border-radius:12px;padding:20px;text-align:center;font-weight:800}
@media(max-height:700px){.caption{top:calc(env(safe-area-inset-top,0px) + 68px);padding:5px}.bottom{gap:4px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}.btn{padding:8px}.head .wood{min-height:41px}}
</style></head><body><div id="scene"></div><header class="head"><div class="wood"><a href="index.html">←</a></div><div class="wood title">Կախարդական կողպեք</div><div class="wood">⭐ <span id="stars">0</span></div></header><div class="caption"><span id="message">Պտտիր երեք գունավոր սկավառակները։</span><small id="hint">Համընկեցրու նշանները վերևի ոսկե սլաքների հետ։</small></div><div class="bottom"><div class="progress" id="progress">Փուլ 1/5 · 0/3 ճիշտ</div><div class="controls"><button class="btn" id="start">▶ Սկսել</button><button class="btn alt" id="reset">↻</button></div></div><div class="modal" id="modal"><div class="popup"><div style="font-size:65px">🏆</div><h2>Ապրե՜ս, բացեցիր կողպեքը։</h2><button class="btn" id="continue">Շարունակել</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),T=window.THREE;if(!T){$('scene').innerHTML='<div class="error">3D շարժիչը չի բեռնվել։ Ստուգիր ինտերնետը։</div>';return}const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;$('scene').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#183c4b');scene.fog=new T.Fog('#183c4b',17,32);const camera=new T.PerspectiveCamera(38,1,.1,100);camera.position.set(5,5.3,11.7);camera.lookAt(0,1.35,0);scene.add(new T.HemisphereLight('#fff5d9','#174d5c',2));const key=new T.DirectionalLight('#fff0cc',3.5);key.position.set(-4,8,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;scene.add(key);const rim=new T.DirectionalLight('#62b7d1',2);rim.position.set(5,5,-4);scene.add(rim);const mat=(c,metal=0,rough=.5)=>new T.MeshPhysicalMaterial({color:c,metalness:metal,roughness:rough,clearcoat:.2});const wood=mat('#a66a3d',0,.53),woodLight=mat('#e5ad69',0,.43),woodDark=mat('#76482d',0,.58),gold=mat('#e9b84f',.65,.22),ivory=mat('#fff0cb',.05,.35),dark=mat('#3c322c',.15,.52),palette=['#e74f63','#2f9de2','#8dc94d','#f3bd40'];function mesh(g,m,parent=scene){const x=new T.Mesh(g,m);x.castShadow=true;x.receiveShadow=true;parent.add(x);return x}function cube(w,h,d,m,parent=scene){return mesh(new T.BoxGeometry(w,h,d),m,parent)}function sphere(r,m,parent=scene){return mesh(new T.SphereGeometry(r,24,16),m,parent)}
const floor=mesh(new T.PlaneGeometry(100,100),mat('#245363',0,.9));floor.rotation.x=-Math.PI/2;floor.position.y=-.6;const platform=mesh(new T.CylinderGeometry(5.5,5.8,.28,80),woodDark);platform.position.y=-.38;platform.scale.z=.8;const plTop=mesh(new T.CylinderGeometry(5.4,5.5,.07,80),woodLight);plTop.position.y=-.2;plTop.scale.z=.8;
const lock=new T.Group();scene.add(lock);const base=cube(7.4,5.5,1.45,wood,lock);base.position.y=2.35;const frame=cube(7.65,5.75,1.25,woodLight,lock);frame.position.set(0,2.35,-.15);const face=cube(7.05,5.2,.22,wood,lock);face.position.set(0,2.35,.79);const stripeTop=cube(7.3,.13,.28,woodDark,lock);stripeTop.position.set(0,4.93,.85);const stripeBottom=cube(7.3,.13,.28,woodDark,lock);stripeBottom.position.set(0,-.22,.85);const brassTop=cube(7.6,.09,.32,gold,lock);brassTop.position.set(0,5.18,.76);const brassBottom=cube(7.6,.09,.32,gold,lock);brassBottom.position.set(0,-.47,.76);for(let x of [-3.48,3.48])for(let y of [-.18,4.9]){const rivet=sphere(.1,gold,lock);rivet.position.set(x,y,.98);rivet.scale.z=.5}
const keyhole=mesh(new T.TorusGeometry(.37,.1,12,36),gold,lock);keyhole.position.set(0,.25,1.02);const keyCenter=sphere(.17,dark,lock);keyCenter.position.set(0,.25,1.03);keyCenter.scale.z=.45;
const dials=[],centers=[-2.25,0,2.25],targets=[0,0,0],values=[0,0,0];for(let i=0;i<3;i++){const mount=mesh(new T.CylinderGeometry(1.1,1.1,.16,64),woodDark,lock);mount.rotation.x=Math.PI/2;mount.position.set(centers[i],2.7,1.03);const rimRing=mesh(new T.TorusGeometry(1.05,.1,12,64),gold,lock);rimRing.position.set(centers[i],2.7,1.2);const spin=new T.Group();spin.position.set(centers[i],2.7,1.24);lock.add(spin);const disk=mesh(new T.CylinderGeometry(.92,.92,.19,64),ivory,spin);disk.rotation.x=Math.PI/2;disk.position.z=.08;const dialFace=mesh(new T.CylinderGeometry(.82,.82,.03,64),woodLight,spin);dialFace.rotation.x=Math.PI/2;dialFace.position.z=.19;for(let k=0;k<4;k++){const a=k*Math.PI/2,ring=mesh(new T.TorusGeometry(.19,.075,12,30),mat(palette[k],.08,.27),spin);ring.position.set(Math.sin(a)*.58,Math.cos(a)*.58,.26);const mid=sphere(.13,mat(palette[k],.08,.26),spin);mid.position.set(Math.sin(a)*.58,Math.cos(a)*.58,.27);mid.scale.z=.35}const pointer=mesh(new T.ConeGeometry(.15,.3,3),gold,lock);pointer.position.set(centers[i],3.95,1.34);pointer.rotation.z=Math.PI;const glow=mesh(new T.TorusGeometry(.98,.035,8,64),mat('#ffe4a5',.4,.2),lock);glow.position.set(centers[i],2.7,1.29);glow.visible=false;dials.push({spin,glow})}
const topLid=new T.Group();lock.add(topLid);const lid=cube(7.7,.65,1.65,woodLight,topLid);lid.position.y=5.42;const lidGold=cube(7.9,.1,1.75,gold,topLid);lidGold.position.y=5.8;const gift=sphere(.55,mat('#ffd84d',.25,.2),lock);gift.position.set(0,4.3,.35);gift.visible=false;
let stage=1,stars=0,mode='idle',token=0;const animations=[];function tween(obj,to,duration=550,delay=0){return new Promise(resolve=>{const from={};for(const k in to)from[k]=obj[k];animations.push({obj,from,to,duration,delay,start:performance.now(),resolve})})}function animate(){requestAnimationFrame(animate);const now=performance.now();for(let i=animations.length-1;i>=0;i--){const a=animations[i],dt=now-a.start-a.delay;if(dt<0)continue;const t=Math.min(1,dt/a.duration),p=.5-.5*Math.cos(t*Math.PI);for(const k in a.to)a.obj[k]=a.from[k]+(a.to[k]-a.from[k])*p;if(t>=1){animations.splice(i,1);a.resolve()}}renderer.render(scene,camera)}animate();function update(){const n=values.filter((v,i)=>v===targets[i]).length;$('progress').textContent='Փուլ '+stage+'/5 · '+n+'/3 ճիշտ';$('stars').textContent=stars;dials.forEach((d,i)=>d.glow.visible=values[i]===targets[i]);return n}function info(m,h){$('message').textContent=m;$('hint').textContent=h}function begin(){token++;mode='playing';gift.visible=false;gift.scale.setScalar(1);topLid.position.y=0;for(let i=0;i<3;i++){targets[i]=(stage+i)%4;values[i]=(targets[i]+1+Math.floor(Math.random()*3))%4;dials[i].spin.rotation.z=-values[i]*Math.PI/2}update();info('Պտտիր սկավառակները։','Յուրաքանչյուրի վերևի նշանը համապատասխանեցրու ճիշտ գույնին։');$('start').textContent='🔓 Բացիր կողպեքը';$('start').disabled=false}async function turn(i){if(mode!=='playing')return;mode='moving';values[i]=(values[i]+1)%4;await tween(dials[i].spin.rotation,{z:dials[i].spin.rotation.z-Math.PI/2},500);update();mode='playing';if(values.every((v,j)=>v===targets[j]))await unlock()}async function unlock(){mode='unlock';$('start').disabled=true;info('Ճի՜շտ է, կողպեքը բացվեց։','Անակնկալը դուրս է գալիս։');gift.visible=true;await Promise.all([tween(topLid.position,{y:1.7},1000),tween(gift.position,{y:6.4,z:1.5},1250)]);await Promise.all([tween(gift.rotation,{y:Math.PI*2},1250),tween(gift.scale,{x:1.4,y:1.4,z:1.4},1250)]);stars+=5;update();$('modal').classList.add('open');mode='done'}const ray=new T.Raycaster(),mouse=new T.Vector2();renderer.domElement.addEventListener('pointerup',ev=>{if(mode!=='playing')return;const r=renderer.domElement.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(dials.map(d=>d.spin),true);if(hits.length){let p=hits[0].object;while(p.parent&&!dials.some(d=>d.spin===p))p=p.parent;const i=dials.findIndex(d=>d.spin===p);if(i>=0)turn(i)}});$('start').onclick=()=>{if(mode==='idle'||mode==='ready')begin();else if(mode==='playing')info('Հպվիր գունավոր սկավառակներին։','Փորձիր համընկեցնել բոլոր երեքը։')};$('reset').onclick=()=>{token++;animations.splice(0).forEach(a=>a.resolve());stage=1;stars=0;mode='idle';gift.visible=false;gift.position.set(0,4.3,.35);topLid.position.y=0;$('modal').classList.remove('open');$('start').disabled=false;$('start').textContent='▶ Սկսել';info('Պտտիր երեք գունավոր սկավառակները։','Համընկեցրու նշանները վերևի սլաքների հետ։');update()};$('continue').onclick=()=>{stage=stage===5?1:stage+1;$('modal').classList.remove('open');gift.position.set(0,4.3,.35);begin()};function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.set(innerWidth/innerHeight<.65?4.5:5,innerWidth/innerHeight<.65?5.4:5.2,innerWidth/innerHeight<.65?15.5:12.5);camera.lookAt(0,2.6,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();update()})();
