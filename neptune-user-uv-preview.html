<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Neptune UV Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020611;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}.badge{font-size:11px;font-weight:900;letter-spacing:.12em;color:#80c8ff}.title{font-size:23px;font-weight:900;margin:3px 0 12px}
.card{background:#07142f;border:1px solid #26436e;border-radius:20px;padding:10px;margin-bottom:12px}.card h2{font-size:12px;color:#a9c5ef;margin:0 0 8px}
.map{width:100%;border-radius:13px;display:block}
.stage{height:min(60vh,560px);min-height:380px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 46%,#12346c 0,#07142f 50%,#020611 100%)}
.stage canvas{display:block;width:100%;height:100%}.note{font-size:12px;line-height:1.45;color:#91a9ce}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">HIDDEN UV TEST</div>
  <div class="title">Նեպտուն · քո UV փռվածքով</div>
  <div class="card"><h2>ՔՈ 2:1 UV MAP-ը</h2><img id="map" class="map"></div>
  <div class="card"><h2>ԻՐԱԿԱՆ THREE.JS SPHERE</h2><div id="stage" class="stage"></div></div>
  <div class="note">Փորձնական էջում texture-ը քո ուղարկած 1536×768 map-ի թեթև local JPEG պատճենն է։ UV mapping-ը չի փոխվել։ Եթե նստեց ճիշտ՝ վերջնականում դրվում է օրիգինալ resolution-ը։</div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const url='./assets/space3d/user/neptune-user-uv-test.jpg?v=3';
document.getElementById('map').src=url;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x07142f,1);
renderer.setSize(stage.clientWidth,stage.clientHeight,false);
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,.1,50);camera.position.set(0,0,4.1);
const tex=await new THREE.TextureLoader().loadAsync(url);
tex.colorSpace=THREE.SRGBColorSpace;
tex.wrapS=THREE.RepeatWrapping;
tex.wrapT=THREE.ClampToEdgeWrapping;
tex.minFilter=THREE.LinearMipmapLinearFilter;
tex.magFilter=THREE.LinearFilter;
tex.anisotropy=16;
const geo=new THREE.SphereGeometry(1.35,128,96);
const mat=new THREE.MeshBasicMaterial({map:tex,color:0xffffff,toneMapped:false});
const mesh=new THREE.Mesh(geo,mat);
mesh.rotation.z=THREE.MathUtils.degToRad(28.32);
mesh.rotation.y=-Math.PI/2;
scene.add(mesh);
function resize(){
 const w=Math.max(2,stage.clientWidth),h=Math.max(2,stage.clientHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
let last=performance.now();
function loop(t){
 const dt=Math.min(.04,(t-last)/1000);last=t;
 mesh.rotation.y+=dt*.16;
 resize();renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
