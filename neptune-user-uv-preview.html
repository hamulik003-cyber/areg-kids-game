document.getElementById('map').src=url;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x07142f,1);
renderer.setSize(stage.clientWidth,stage.clientHeight,false);
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,.1,50);camera.position.set(0,0,4.1);
const tex=await new THREE.TextureLoader().loadAsync(url);
tex.colorSpace=THREE.SRGBColorSpace;
tex.wrapS=THREE.RepeatWrapping;
tex.wrapT=THREE.ClampToEdgeWrapping;
tex.minFilter=THREE.LinearMipmapLinearFilter;
tex.magFilter=THREE.LinearFilter;
tex.anisotropy=16;
const geo=new THREE.SphereGeometry(1.35,128,96);
const mat=new THREE.MeshBasicMaterial({map:tex,color:0xffffff,toneMapped:false});
const mesh=new THREE.Mesh(geo,mat);
mesh.rotation.z=THREE.MathUtils.degToRad(28.32);
mesh.rotation.y=-Math.PI/2;
scene.add(mesh);
function resize(){
 const w=Math.max(2,stage.clientWidth),h=Math.max(2,stage.clientHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
let last=performance.now();
function loop(t){
 const dt=Math.min(.04,(t-last)/1000);last=t;
 mesh.rotation.y+=dt*.16;
 resize();renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
