<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ի՞նչ փոխվեց</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif}body{background:linear-gradient(#73c9fc 0%,#d9f5ff 53%,#9edc83 53%,#4ea95d 100%);color:#6c411d}.head{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);left:9px;right:9px;display:grid;grid-template-columns:48px 1fr 60px;gap:7px}.wood{min-height:47px;border-radius:15px;border:3px solid #b7763e;background:linear-gradient(#fff2c5,#f4bf7b);box-shadow:0 5px #8b502b,inset 0 2px #fff9e6;display:grid;place-items:center;font-weight:900}.wood a{text-decoration:none;color:inherit;font-size:27px}.title{font-size:clamp(17px,5vw,23px)}.game{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 76px) 8px calc(env(safe-area-inset-bottom,0px) + 12px);border:5px solid #c58b50;border-radius:24px;background:linear-gradient(#9ce2ff,#e7f9ff 55%,#b4dc88 55%,#7ec068);box-shadow:0 12px 25px #4b633b66;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;overflow:hidden}.notice{width:100%;max-width:440px;border:3px solid #e5b873;border-radius:16px;background:#fff1cddd;padding:12px;text-align:center;font-size:clamp(16px,4.7vw,22px);font-weight:900;box-shadow:0 5px 10px #a17d4a55}.hint{font-size:12px;font-weight:700;margin-top:4px;color:#926438}.board{width:min(100%,450px);flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;align-content:center;max-height:520px}.card{position:relative;min-height:0;border:5px solid #fff2c4;border-radius:23px;background:linear-gradient(145deg,#fff2cc,#e4ac72);box-shadow:0 9px 0 #a86d43,0 14px 16px #64422d44;display:grid;place-items:center;transition:transform .25s,opacity .25s;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}.card:before{content:"";position:absolute;inset:7px;border-radius:14px;border:2px dashed #c78b55aa;pointer-events:none}.card .item{font-size:clamp(48px,16vw,96px);filter:drop-shadow(0 7px 3px #8d5b3550);line-height:1;transition:transform .3s}.card.changed{outline:5px solid #55c873;transform:translateY(-6px)}.card.wrong{animation:shake .32s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.curtain{position:absolute;inset:0;border-radius:17px;background:linear-gradient(135deg,#c788e8,#8645bd);display:grid;place-items:center;color:#fff6d8;font-size:55px;font-weight:900;opacity:0;transform:scale(.75);pointer-events:none;transition:opacity .35s,transform .35s}.card.covered .curtain{opacity:1;transform:scale(1)}.controls{display:flex;gap:9px;justify-content:center;width:100%;max-width:450px}.btn{border:3px solid #edffce;border-radius:15px;background:linear-gradient(#7bdf86,#289c4d);color:#fff;font-weight:900;font-size:17px;padding:11px 17px;box-shadow:0 5px #287545;flex:1}.btn.alt{background:linear-gradient(#ffcc83,#e99443);box-shadow:0 5px #ad6532;flex:0 0 auto}.btn:disabled{opacity:.5}.progress{font-weight:900;color:#fff;text-shadow:0 2px 3px #795b3d;text-align:center}.dots{display:flex;gap:8px;justify-content:center;margin-top:4px}.dots i{height:11px;width:11px;border-radius:50%;background:#fff9dfaa}.dots i.on{background:#ffe047}.celebrate{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:76px;pointer-events:none;opacity:0}.celebrate.show{animation:pop 1s both}@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.3)}45%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-100%) scale(1)}}@media(max-height:680px){.game{gap:5px;padding:7px}.notice{padding:5px}.board{gap:7px}.card .item{font-size:clamp(40px,13vw,72px)}.btn{padding:6px}}
</style></head><body><header class="head"><div class="wood"><a href="index.html" aria-label="Հետ">←</a></div><div class="wood title">Ի՞նչ փոխվեց</div><div class="wood">⭐ <span id="stars">0</span></div></header><main class="game"><div class="notice"><span id="message">Ուշադիր նայիր առարկաներին։</span><div class="hint" id="hint">Հիշիր՝ ինչ կա յուրաքանչյուր տեղում։</div></div><div class="board" id="board"></div><div class="controls"><button class="btn" id="action">▶ Սկսել</button><button class="btn alt" id="reset">↻</button></div><div class="progress">Փուլ <span id="round">1</span>/5<div class="dots" id="dots"></div></div><div class="celebrate" id="celebrate">🌟</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),pool=['🍎','🚗','🐻','🌼','🚀','🐸','🦋','🍓','🎈','🦊','🍋','🐧','🌈','🧸','🍄','🐠','🚂','🐝','🌻','🪁','🐢','🍒'];let round=1,stars=0,state='idle',before=[],after=[],changed=-1,timeout=null,wrong=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));function sample(except=[]){const opts=pool.filter(x=>!except.includes(x));return opts[Math.floor(Math.random()*opts.length)]}function text(a,b){$('message').textContent=a;$('hint').textContent=b}function progress(){$('round').textContent=round;$('stars').textContent=stars;$('dots').innerHTML=Array.from({length:5},(_,i)=>'<i class="'+(i<round-1?'on':'')+'"></i>').join('')}function render(covered=false){$('board').innerHTML='';after.forEach((item,i)=>{const c=document.createElement('div');c.className='card'+(covered?' covered':'');c.innerHTML='<span class="item">'+item+'</span><div class="curtain">?</div>';c.addEventListener('click',()=>choose(i));$('board').append(c)})}function setup(){before=[];for(let i=0;i<4;i++)before.push(sample(before));after=[...before];changed=Math.floor(Math.random()*4);after[changed]=sample(before);wrong=0;render();progress()}async function start(){if(state==='show'||state==='cover'||state==='guess')return;if(state==='finished'){round=1;stars=0}state='show';$('action').disabled=true;setup();text('Հիշիր բոլոր չորս առարկաները։','Մի քանի վայրկյան ուշադիր նայիր։');await wait(round<=2?3200:round<=4?2700:2300);if(state!=='show')return;state='cover';document.querySelectorAll('.card').forEach(c=>c.classList.add('covered'));text('Ի՞նչ փոխվեց։','Մի պահ ծածկենք առարկաները։');await wait(1050);if(state!=='cover')return;render();state='guess';text('Գտիր՝ ո՞ր առարկան փոխվեց։','Սեղմիր այն քառակուսին, որտեղ փոփոխություն կա։');$('action').textContent='👆 Ընտրիր';$('action').disabled=true}async function choose(i){if(state!=='guess')return;const card=$('board').children[i];if(i!==changed){wrong++;card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');text('Փորձիր նորից։','Ուշադիր համեմատիր հիշածդ։');return}state='result';card.classList.add('changed');$('celebrate').classList.remove('show');void $('celebrate').offsetWidth;$('celebrate').classList.add('show');stars++;progress();text('Ապրե՜ս, ճիշտ գտար։','Այստեղ '+before[i]+' էր, հիմա՝ '+after[i]+'։');$('action').disabled=false;$('action').textContent=round===5?'🏆 Ավարտել':'▶ Հաջորդ փուլ';if(round===5){state='finished';text('🏆 Հաղթե՜ցիր։','Դու գտար բոլոր փոփոխությունները։');$('action').textContent='▶ Նոր խաղ'}else{round++;state='ready'}}$('action').onclick=start;$('reset').onclick=()=>{clearTimeout(timeout);state='idle';round=1;stars=0;setup();text('Ուշադիր նայիր առարկաներին։','Հիշիր՝ ինչ կա յուրաքանչյուր տեղում։');$('action').disabled=false;$('action').textContent='▶ Սկսել'};setup()})();</script></body></html>
