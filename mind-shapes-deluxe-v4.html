<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#653c25}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#e9c9a2}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #347cc0}#app{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);gap:10px;max-width:650px;margin:auto;background:radial-gradient(ellipse at 50% 25%,#fff1d8,#e5bf92 65%,#ba865b);box-shadow:0 0 60px #70402455}

/* v2: larger tray shapes, visual-only guidance and animated stage celebrations */
.scene-wrap{min-height:320px}#tip{display:none}#message:empty{display:none}#message{font-size:29px;bottom:14px;left:38%;right:38%;background:transparent;text-shadow:0 2px 3px #fff,0 4px 8px #51371c66}
#feedback{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.7);font-size:66px;z-index:6;opacity:0;pointer-events:none;text-shadow:0 4px 10px #0005}
#feedback.ok{animation:feedback-pop .8s ease-out forwards}#feedback.wrong{animation:feedback-shake .72s ease-out forwards}
@keyframes feedback-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.24)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1.05)}}

.piece.wrong{animation:piece-error .5s ease-in-out;border-color:#e95448;box-shadow:0 0 12px #f43c39bb;background:#ffb4a1}
@keyframes piece-error{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.overlay{background:#3b251cc4}.modal{position:relative;overflow:hidden;isolation:isolate;padding:29px 18px 24px}.modal h2,.modal p,.modal button,.modal .award,.modal .bonus{position:relative;z-index:2}.modal h2{font-size:clamp(23px,6vw,30px)}.modal p{font-weight:750;font-size:15px}.modal .award{font-size:68px;filter:drop-shadow(0 5px 4px #6b482855);animation:award-bounce 1s ease-out both}.modal .continue{min-width:190px;font-size:18px;margin-top:8px}
@keyframes award-bounce{0%{transform:translateY(-28px) scale(.5);opacity:0}60%{transform:translateY(5px) scale(1.18);opacity:1}100%{transform:translateY(0) scale(1)}}
.celebrate{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}.spark{position:absolute;left:var(--x);top:-25px;font-size:var(--size);opacity:0;animation:spark-fall var(--dur) ease-in var(--delay) infinite;filter:drop-shadow(0 2px 2px #99652255)}
@keyframes spark-fall{0%{opacity:0;transform:translate3d(0,-20px,0) rotate(0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate3d(var(--drift),420px,0) rotate(220deg)}}
