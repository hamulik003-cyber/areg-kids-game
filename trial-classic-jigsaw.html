<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AREG — Դասական փազլ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif}body{background:radial-gradient(ellipse at 50% 36%,#14508d,#082f69 53%,#061c41);color:#fff5d8}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:center;gap:8px;z-index:2}.wood{border:2px solid #e9c48a;border-radius:13px;background:linear-gradient(160deg,#ffdea0,#f5b66c 65%,#c67c3b);box-shadow:inset 0 2px 3px #ffe3ac,0 4px 0 #643f2d,0 8px 15px #09233188;color:#653213;text-shadow:0 1px 1px #fff4c2;font-weight:900;min-height:44px;display:grid;place-items:center;padding:7px 12px}.back{text-decoration:none;font-size:25px}.title{flex:1;text-align:center;font-size:clamp(15px,4vw,21px)}.star{font-size:16px}.sub{position:absolute;top:calc(env(safe-area-inset-top) + 71px);left:15px;right:15px;text-align:center;color:#fff4d3;font-weight:800;text-shadow:0 2px 6px #132f44;pointer-events:none}.footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:10px;right:10px;display:flex;justify-content:center;align-items:center;gap:9px;z-index:2}.action{font:900 15px system-ui;border:2px solid #e9c48a;border-radius:13px;background:linear-gradient(#f6d9a1,#c8874b);box-shadow:0 4px #754726;color:#65391e;padding:10px 15px}.action.selected{background:linear-gradient(#7fe4b0,#38a97a);box-shadow:0 4px #226c52;color:#fff}.modal{position:absolute;inset:0;background:#081d30b8;z-index:4;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(360px,100%);background:linear-gradient(#fff3d1,#e6bb83);border:6px solid #a36a3e;border-radius:25px;box-shadow:0 20px 50px #061d2bb0;padding:22px;text-align:center;color:#774321}.dialog h2{margin:5px 0 12px}.dialog button{width:100%;background:linear-gradient(#73df9b,#299d60);border:2px solid #e8ffdf;border-radius:15px;color:white;font-size:19px;font-weight:900;padding:14px;box-shadow:0 5px #227345}.loading{position:absolute;inset:35% 20%;text-align:center;font-weight:900}
</style></head><body><canvas id="game"></canvas><div class="hud"><a class="wood back" href="index.html">←</a><div class="wood title">Փազլ</div><div class="wood star">⭐ <span id="stars">0</span></div></div><div class="sub" id="status">1 / 5　🟡 ⚪ ⚪ ⚪ ⚪</div><div class="footer"><button class="action selected" data-count="4">4 կտոր</button><button class="action" data-count="6">6 կտոր</button><button class="action" data-count="9">9 կտոր</button><button class="action" id="again">↻</button></div><div class="modal" id="modal"><div class="dialog"><div style="font-size:64px">🏆</div><h2>Ապրե՜ս, հավաքեցիր նկարը</h2><p>⭐ +5 աստղ</p><button id="next">Շարունակել</button></div></div><div class="loading" id="loading">Բեռնվում է փազլը…</div><script>
(()=>{'use strict';const cv=document.getElementById('game'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1,count=4,round=0,stars=0,board={},panel={},tray={},pieces=[],drag=null,imgs=[],ready=false,particles=[],won=false,activePointer=null,celebrationStart=0,winTimer=null;const emojis=['🐶','🐱','🐸','🦋','🐰'];const names=['Շնիկ','Կատու','Գորտ','Թիթեռ','Նապաստակ'];let image=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);const ease=t=>1-Math.pow(1-t,3);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layout()}addEventListener('resize',resize);
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grad(x,y,w,h,colors){const g=ctx.createLinearGradient(x,y,x+w*.3,y+h);colors.forEach((c,i)=>g.addColorStop(i/(colors.length-1),c));return g}
function bluePanel(x,y,w,h,r){ctx.save();ctx.shadowColor='#00142c';ctx.shadowBlur=24;ctx.shadowOffsetY=13;rounded(x,y,w,h,r);ctx.fillStyle='#173d8b';ctx.fill();ctx.restore();rounded(x+3,y+3,w-6,h-6,r-3);ctx.fillStyle=grad(x,y,w,h,['#398ff7','#175ac4','#17418f']);ctx.fill();rounded(x+9,y+9,w-18,h-18,r-8);ctx.fillStyle=grad(x,y,w,h,['#4dafff','#1b62d0','#0b367f']);ctx.fill();rounded(x+15,y+15,w-30,h-30,r-13);ctx.fillStyle='#051d48';ctx.fill();ctx.strokeStyle='#80c6ff';ctx.lineWidth=2.5;ctx.stroke();rounded(x+21,y+21,w-42,h-42,r-17);ctx.fillStyle=grad(x,y,w,h,['#081e49','#092d62','#041735']);ctx.fill();ctx.restore()}
function frame(x,y,w,h){bluePanel(panel.x,panel.y,panel.w,panel.h,33);bluePanel(tray.x,tray.y,tray.w,tray.h,27);ctx.save();ctx.shadowColor='#010c24';ctx.shadowBlur=16;ctx.shadowOffsetY=8;rounded(x-11,y-11,w+22,h+22,22);ctx.fillStyle='#a96636';ctx.fill();ctx.restore();rounded(x-10,y-10,w+20,h+20,22);ctx.fillStyle=grad(x-10,y-10,w+20,h+20,['#ffdb91','#d58b46','#ffca78']);ctx.fill();rounded(x-4,y-4,w+8,h+8,13);ctx.fillStyle='#765033';ctx.fill();rounded(x,y,w,h,10);ctx.fillStyle='#d6bd99';ctx.fill();ctx.save();ctx.globalAlpha=.15;ctx.drawImage(imgs[image],x,y,w,h);ctx.restore();rounded(x,y,w,h,10);ctx.lineWidth=2;ctx.strokeStyle='#fff1c4';ctx.stroke();ctx.textAlign='center';ctx.font='800 13px system-ui';ctx.fillStyle='#ffe1a2';ctx.fillText('Տեղադրիր կտորները ճիշտ տեղերում',tray.x+tray.w/2,tray.y+tray.h-13)}
function shape(p,offX=0,offY=0){const x=p.x+offX,y=p.y+offY,w=p.w,h=p.h,t=Math.min(w,h)*.18;ctx.beginPath();ctx.moveTo(x,y);function edge(x1,y1,x2,y2,type){const dx=x2-x1,dy=y2-y1,px=-dy,py=dx;if(!type){ctx.lineTo(x2,y2);return}const sign=type;const at=(u,v)=>[x1+dx*u+px*v*sign,y1+dy*u+py*v*sign];let a=at(.32,0);ctx.lineTo(...a);let b=at(.34,-.08),c=at(.30,.2),d=at(.40,.25);ctx.bezierCurveTo(...b,...c,...d);a=at(.5,.38);b=at(.6,.25);ctx.bezierCurveTo(...a,...a,...b);a=at(.70,.2);b=at(.66,-.08);c=at(.68,0);ctx.bezierCurveTo(...a,...b,...c);ctx.lineTo(x2,y2)}
edge(x,y,x+w,y,p.top);edge(x+w,y,x+w,y+h,p.right);edge(x+w,y+h,x,y+h,p.bottom);edge(x,y+h,x,y,p.left);ctx.closePath()}
function drawPiece(p){const scale=p.locked?1:p===drag?1:p.scale;ctx.save();ctx.translate(p.cx,p.cy);ctx.scale(scale,scale);const x=-p.w/2,y=-p.h/2,draw={...p,x,y};ctx.save();ctx.shadowColor='#000d2dbb';ctx.shadowBlur=p.locked?3:13;ctx.shadowOffsetY=p.locked?2:10;shape(draw,0,7);ctx.fillStyle='#67412c';ctx.fill();ctx.restore();shape(draw,0,5);ctx.fillStyle=grad(x,y,p.w,p.h,['#ffdf9c','#b97940','#6b422e']);ctx.fill();shape(draw);ctx.save();ctx.clip();ctx.drawImage(imgs[image],x-p.col*p.w,y-p.row*p.h,board.w,board.h);ctx.restore();shape(draw);ctx.lineWidth=p.locked?1.4:2.5;ctx.strokeStyle='#fff3d7';ctx.stroke();ctx.restore()}
function layout(){const cols=count===4?2:3,rows=count/cols;const top=Math.max(136,H*.162),bottom=74;const gap=Math.max(15,Math.min(26,H*.027));const available=H-top-bottom-gap;const trayH=clamp(available*.255,120,230);const mainH=available-trayH;const side=Math.max(12,W*.045);panel={x:side,y:top,w:W-2*side,h:mainH};tray={x:side,y:top+mainH+gap,w:W-2*side,h:trayH};const innerW=panel.w-70,innerH=panel.h-74;const ratio=1.04;const bw=Math.min(innerW,innerH*ratio,500);const bh=bw/ratio;board={x:(W-bw)/2,y:panel.y+(panel.h-bh)/2,w:bw,h:bh,cols,rows};if(pieces.length){const pw=bw/cols,ph=bh/rows;for(const p of pieces){p.w=pw;p.h=ph;p.tx=board.x+(p.col+.5)*pw;p.ty=board.y+(p.row+.5)*ph;if(p.locked){p.cx=p.tx;p.cy=p.ty}}}}
function build(){if(winTimer){clearTimeout(winTimer);winTimer=null}celebrationStart=0;won=false;drag=null;activePointer=null;$('modal').classList.remove('show');pieces=[];layout();const cols=board.cols,rows=board.rows,pw=board.w/cols,ph=board.h/rows;const grid=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const id=r*cols+c;grid.push({id,row:r,col:c,left:c?-grid[id-1].right:0,top:r?-grid[id-cols].bottom:0,right:c===cols-1?0:Math.random()<.5?1:-1,bottom:r===rows-1?0:Math.random()<.5?1:-1})}const ncols=count===9?5:count===6?3:4,nrows=Math.ceil(count/ncols);const usableW=tray.w-54,usableH=tray.h-48;const sc=Math.min(.74,(usableW/ncols)/pw*.79,(usableH/nrows)/ph*.72);const gapX=usableW/ncols,gapY=usableH/nrows;const order=grid.map((g,i)=>({...g,sort:Math.random()})).sort((a,b)=>a.sort-b.sort);for(let i=0;i<count;i++){const g=order[i],col=i%ncols,row=Math.floor(i/ncols);const hx=tray.x+tray.w/2+(col-(ncols-1)/2)*gapX,hy=tray.y+tray.h/2+(row-(nrows-1)/2)*gapY-4;pieces.push({...g,w:pw,h:ph,tx:board.x+(g.col+.5)*pw,ty:board.y+(g.row+.5)*ph,cx:hx,cy:hy,homeX:hx,homeY:hy,scale:sc,locked:false})}$('status').textContent=(round+1)+' / 5　'+[0,1,2,3,4].map(i=>i===round?'🟡':'⚪').join(' ');}
function drawBg(time){const t=time*.0003;for(let i=0;i<24;i++){const x=(i*87.43+Math.sin(t+i)*12)%W,y=(i*143.7+Math.cos(t+i*.8)*8)%H;ctx.beginPath();ctx.arc(x,y,i%4===0?2.5:1.3,0,7);ctx.fillStyle='rgba(255,224,152,'+(.13+.14*Math.sin(t+i)) +')';ctx.fill()}const a=grad(0,H*.6,W,H*.4,['#0b3674','#061d48']);ctx.fillStyle=a;rounded(0,H*.84,W,H*.2,0);ctx.fill();ctx.fillStyle='#1e58a5';ctx.fillRect(0,H*.84,W,3)}
function drawLivingPicture(t){const age=t-celebrationStart;if(age<0)return;const fade=Math.min(1,age/450),breath=1+Math.sin(age*.004)*.012;ctx.save();rounded(board.x,board.y,board.w,board.h,9);ctx.clip();ctx.translate(board.x+board.w/2,board.y+board.h/2);ctx.scale(breath,breath);ctx.translate(-board.w/2,-board.h/2);ctx.globalAlpha=fade;ctx.drawImage(imgs[image],0,0,board.w,board.h);ctx.restore();ctx.save();rounded(board.x,board.y,board.w,board.h,9);ctx.clip();const sec=age*.001;const hop=Math.abs(Math.sin(sec*3.2))*board.h*.065;const tilt=Math.sin(sec*2.8)*.095;const pulse=1+Math.sin(sec*4)*.055;ctx.translate(board.x+board.w*.5,board.y+board.h*.52-hop);ctx.rotate(tilt);ctx.scale(pulse,pulse);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.floor(board.h*.56)+'px "Apple Color Emoji","Segoe UI Emoji",system-ui';ctx.shadowColor='#061e4a66';ctx.shadowBlur=13;ctx.shadowOffsetY=8;ctx.fillText(emojis[image],0,0);ctx.restore();const shine=(age%2300)/2300;if(shine<.65){ctx.save();rounded(board.x,board.y,board.w,board.h,9);ctx.clip();const sx=board.x-board.w*.5+shine*board.w*2.4;const g=ctx.createLinearGradient(sx-55,0,sx+55,0);g.addColorStop(0,'#ffffff00');g.addColorStop(.5,'#fff8c740');g.addColorStop(1,'#ffffff00');ctx.fillStyle=g;ctx.fillRect(board.x,board.y,board.w,board.h);ctx.restore()}}
function draw(t){ctx.clearRect(0,0,W,H);drawBg(t);if(ready){frame(board.x,board.y,board.w,board.h);for(let r=1;r<board.rows;r++){ctx.strokeStyle='#8c795d6b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(board.x,board.y+r*board.h/board.rows);ctx.lineTo(board.x+board.w,board.y+r*board.h/board.rows);ctx.stroke()}for(let c=1;c<board.cols;c++){ctx.beginPath();ctx.moveTo(board.x+c*board.w/board.cols,board.y);ctx.lineTo(board.x+c*board.w/board.cols,board.y+board.h);ctx.stroke()}if(won&&celebrationStart){drawLivingPicture(t)}else{pieces.filter(p=>p.locked).forEach(drawPiece);pieces.filter(p=>!p.locked&&p!==drag).forEach(drawPiece);if(drag)drawPiece(drag)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.018;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffdf76';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.life)*3,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.addEventListener('pointerdown',e=>{if(!ready||won||drag)return;const v=pos(e);for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(p.locked)continue;const scale=p.scale;if(Math.abs(v.x-p.cx)<p.w*scale*.67+12&&Math.abs(v.y-p.cy)<p.h*scale*.67+12){drag=p;activePointer=e.pointerId;drag.ox=v.x-p.cx;drag.oy=v.y-p.cy;pieces.splice(i,1);pieces.push(p);cv.setPointerCapture(e.pointerId);break}}});cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==activePointer)return;const v=pos(e);drag.cx=clamp(v.x-drag.ox,drag.w*.35,W-drag.w*.35);drag.cy=clamp(v.y-drag.oy,130,H-75)});function release(e){if(!drag||e.pointerId!==activePointer)return;const p=drag;drag=null;activePointer=null;if(Math.hypot(p.cx-p.tx,p.cy-p.ty)<Math.max(35,Math.min(p.w,p.h)*.55)){p.cx=p.tx;p.cy=p.ty;p.locked=true;for(let i=0;i<18;i++)particles.push({x:p.tx,y:p.ty,vx:rand(-3,3),vy:rand(-4,1),life:1});const placed=pieces.filter(q=>q.locked).length;if(placed===count){won=true;celebrationStart=performance.now()+320;stars+=5;$('stars').textContent=stars;$('status').textContent='✨ '+names[image]+'ը կենդանացավ ✨';winTimer=setTimeout(()=>{if(won)$('modal').classList.add('show')},3600)}}else{p.cx=p.homeX;p.cy=p.homeY}}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('selected',x===b));build()});$('again').onclick=build;$('next').onclick=()=>{round=(round+1)%5;image=imgs.findIndex((im,j)=>j>=round%imgs.length&&im.complete&&im.naturalWidth>0);if(image<0)image=imgs.findIndex(im=>im.complete&&im.naturalWidth>0);build()};
function makeEmojiImage(emoji,index){const c=document.createElement('canvas');c.width=640;c.height=640;const g=c.getContext('2d');const bg=g.createLinearGradient(0,0,640,640);const colors=[['#a8e3ff','#2e96d4'],['#ffddae','#ec9a7a'],['#b8f4bc','#58bb93'],['#c9c5ff','#7fa8f1'],['#f9d7f0','#da9ed1']][index];bg.addColorStop(0,colors[0]);bg.addColorStop(1,colors[1]);g.fillStyle=bg;g.fillRect(0,0,640,640);g.fillStyle='#ffffff45';for(let i=0;i<18;i++){const x=(i*197+47)%640,y=(i*127+31)%640;g.beginPath();g.arc(x,y,8+i%5*7,0,7);g.fill()}g.fillStyle='#ffffff55';g.beginPath();g.ellipse(320,545,225,60,0,0,7);g.fill();g.textAlign='center';g.textBaseline='middle';g.shadowColor='#0b2d5d88';g.shadowBlur=22;g.shadowOffsetY=16;g.font='420px "Apple Color Emoji","Segoe UI Emoji",system-ui';g.fillText(emoji,320,300);return c.toDataURL('image/png')}let loaded=0;emojis.forEach((emoji,i)=>{const im=new Image();im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';image=0;resize();build()}};im.onerror=()=>{loaded++;if(loaded===emojis.length&&!ready)$('loading').textContent='Կերպարները չբեռնվեցին'};im.src=makeEmojiImage(emoji,i);imgs[i]=im});resize();
})();
</script></body></html>
