<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AREG — Դասական փազլ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif}body{background:radial-gradient(ellipse at 48% 40%,#386d78,#173e51 65%,#10283d);color:#fff5d8}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:center;gap:8px;z-index:2}.wood{border:2px solid #e9c48a;border-radius:13px;background:linear-gradient(145deg,#dca66a,#ad6939 65%,#7d462a);box-shadow:inset 0 2px 3px #ffe3ac,0 4px 0 #643f2d,0 8px 15px #09233188;color:#fff8de;text-shadow:0 2px 2px #734022;font-weight:900;min-height:44px;display:grid;place-items:center;padding:7px 12px}.back{text-decoration:none;font-size:25px}.title{flex:1;text-align:center;font-size:clamp(15px,4vw,21px)}.star{font-size:16px}.sub{position:absolute;top:calc(env(safe-area-inset-top) + 71px);left:15px;right:15px;text-align:center;color:#fff4d3;font-weight:800;text-shadow:0 2px 6px #132f44;pointer-events:none}.footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:10px;right:10px;display:flex;justify-content:center;align-items:center;gap:9px;z-index:2}.action{font:900 15px system-ui;border:2px solid #e9c48a;border-radius:13px;background:linear-gradient(#f6d9a1,#c8874b);box-shadow:0 4px #754726;color:#65391e;padding:10px 15px}.action.selected{background:linear-gradient(#7fe4b0,#38a97a);box-shadow:0 4px #226c52;color:#fff}.modal{position:absolute;inset:0;background:#081d30b8;z-index:4;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(360px,100%);background:linear-gradient(#fff3d1,#e6bb83);border:6px solid #a36a3e;border-radius:25px;box-shadow:0 20px 50px #061d2bb0;padding:22px;text-align:center;color:#774321}.dialog h2{margin:5px 0 12px}.dialog button{width:100%;background:linear-gradient(#73df9b,#299d60);border:2px solid #e8ffdf;border-radius:15px;color:white;font-size:19px;font-weight:900;padding:14px;box-shadow:0 5px #227345}.loading{position:absolute;inset:35% 20%;text-align:center;font-weight:900}
</style></head><body><canvas id="game"></canvas><div class="hud"><a class="wood back" href="index.html">←</a><div class="wood title">🧩 Դասական փազլ</div><div class="wood star">⭐ <span id="stars">0</span></div></div><div class="sub" id="status">Հավաքիր նկարը՝ կտորները տեղադրելով շրջանակի մեջ</div><div class="footer"><button class="action selected" data-count="4">4 կտոր</button><button class="action" data-count="6">6 կտոր</button><button class="action" data-count="9">9 կտոր</button><button class="action" id="again">↻</button></div><div class="modal" id="modal"><div class="dialog"><div style="font-size:64px">🏆</div><h2>Ապրե՜ս, հավաքեցիր նկարը</h2><p>⭐ +5 աստղ</p><button id="next">Շարունակել</button></div></div><div class="loading" id="loading">Բեռնվում է փազլը…</div><script>
(()=>{'use strict';const cv=document.getElementById('game'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1,count=4,round=0,stars=0,board={},panel={},tray={},pieces=[],drag=null,imgs=[],ready=false,particles=[],won=false;const assets=['animal-deer.jpg','animal-lion.jpg','animal-elephant.jpg','animal-giraffe.jpg','animal-dog.jpg'];let image=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);const ease=t=>1-Math.pow(1-t,3);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layout()}addEventListener('resize',resize);
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function grad(x,y,w,h,colors){const g=ctx.createLinearGradient(x,y,x+w*.3,y+h);colors.forEach((c,i)=>g.addColorStop(i/(colors.length-1),c));return g}
function frame(x,y,w,h){const px=panel.x,py=panel.y,pw=panel.w,ph=panel.h;ctx.save();ctx.shadowColor='#020f2d';ctx.shadowBlur=25;ctx.shadowOffsetY=13;rounded(px,py,pw,ph,Math.min(37,pw*.075));ctx.fillStyle='#233e83';ctx.fill();ctx.restore();rounded(px+6,py+6,pw-12,ph-12,31);ctx.fillStyle=grad(px,py,pw,ph,['#568bde','#224c9e','#1c3776']);ctx.fill();rounded(px+14,py+14,pw-28,ph-28,26);ctx.fillStyle='#0c244d';ctx.fill();ctx.strokeStyle='#83bbff';ctx.lineWidth=4;ctx.stroke();rounded(px+23,py+23,pw-46,ph-46,19);ctx.fillStyle=grad(px,py,pw,ph,['#0a1c3b','#102c56','#081934']);ctx.fill();ctx.save();ctx.shadowColor='#03142b';ctx.shadowBlur=18;ctx.shadowOffsetY=8;rounded(x-13,y-13,w+26,h+26,19);ctx.fillStyle='#27426b';ctx.fill();ctx.restore();rounded(x-9,y-9,w+18,h+18,15);ctx.fillStyle=grad(x-9,y-9,w+18,h+18,['#fff0cf','#bf8c54','#f9d6a0']);ctx.fill();rounded(x-4,y-4,w+8,h+8,10);ctx.fillStyle='#654d38';ctx.fill();rounded(x,y,w,h,7);ctx.fillStyle='#f3e5c9';ctx.fill();ctx.save();ctx.globalAlpha=.18;ctx.drawImage(imgs[image],x,y,w,h);ctx.restore();rounded(x,y,w,h,7);ctx.strokeStyle='#fff8df';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<4;i++){const px2=x+(i%2?w+7:-7),py2=y+(i<2?-7:h+7);ctx.beginPath();ctx.arc(px2,py2,3.2,0,7);ctx.fillStyle='#f8d899';ctx.fill()}ctx.save();rounded(tray.x,tray.y,tray.w,tray.h,15);ctx.fillStyle='#071a38';ctx.fill();ctx.strokeStyle='#3d76bd';ctx.lineWidth=3;ctx.stroke();ctx.restore();ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#ffe5b1';ctx.fillText('Ընտրիր կտորը և դիր ճիշտ տեղը',px+pw/2,py+ph-18)}
function shape(p,offX=0,offY=0){const x=p.x+offX,y=p.y+offY,w=p.w,h=p.h,t=Math.min(w,h)*.18;ctx.beginPath();ctx.moveTo(x,y);function edge(x1,y1,x2,y2,type){const dx=x2-x1,dy=y2-y1,px=-dy,py=dx;if(!type){ctx.lineTo(x2,y2);return}const sign=type;const at=(u,v)=>[x1+dx*u+px*v*sign,y1+dy*u+py*v*sign];let a=at(.32,0);ctx.lineTo(...a);let b=at(.34,-.08),c=at(.30,.2),d=at(.40,.25);ctx.bezierCurveTo(...b,...c,...d);a=at(.5,.38);b=at(.6,.25);ctx.bezierCurveTo(...a,...a,...b);a=at(.70,.2);b=at(.66,-.08);c=at(.68,0);ctx.bezierCurveTo(...a,...b,...c);ctx.lineTo(x2,y2)}
edge(x,y,x+w,y,p.top);edge(x+w,y,x+w,y+h,p.right);edge(x+w,y+h,x,y+h,p.bottom);edge(x,y+h,x,y,p.left);ctx.closePath()}
function drawPiece(p){const x=p.cx-p.w/2,y=p.cy-p.h/2;const draw={...p,x,y};ctx.save();ctx.shadowColor=p.locked?'#102a31a1':'#010e26c9';ctx.shadowBlur=p.locked?5:17;ctx.shadowOffsetY=p.locked?3:12;shape(draw,0,7);ctx.fillStyle='#6a452e';ctx.fill();ctx.restore();ctx.save();shape(draw,0,4);ctx.fillStyle='#c28b53';ctx.fill();ctx.strokeStyle='#785235';ctx.lineWidth=2;ctx.stroke();ctx.save();shape(draw);ctx.clip();ctx.drawImage(imgs[image],x-p.col*p.w,y-p.row*p.h,board.w,board.h);ctx.restore();shape(draw);ctx.strokeStyle='#fff4db';ctx.lineWidth=p.locked?1.2:2.6;ctx.stroke();ctx.restore()}
function layout(){const cols=count===6?3:count===9?3:2,rows=count/cols;const top=Math.max(145,H*.17),bottom=82;const ph=Math.max(300,H-top-bottom-5);panel={x:Math.max(9,W*.045),y:top,w:W-Math.max(18,W*.09),h:ph};const pad=34;const usableW=panel.w-2*pad;const boardW=Math.min(usableW,H*.40,440),boardH=boardW*.73;const trayY=panel.y+boardH+57;const trayH=Math.max(75,panel.y+panel.h-trayY-49);board={x:(W-boardW)/2,y:panel.y+32,w:boardW,h:boardH,cols,rows};tray={x:panel.x+25,y:trayY,w:panel.w-50,h:trayH};if(pieces.length){const pw=boardW/cols,phh=boardH/rows;for(const p of pieces){p.w=pw;p.h=phh;p.tx=board.x+(p.col+.5)*pw;p.ty=board.y+(p.row+.5)*phh;if(p.locked){p.cx=p.tx;p.cy=p.ty}else{p.cx=clamp(p.cx,pw*.5+8,W-pw*.5-8);p.cy=clamp(p.cy,tray.y+phh*.45,tray.y+tray.h-phh*.4)}}}}
function build(){won=false;drag=null;$('modal').classList.remove('show');const cols=count===6?3:count===9?3:2,rows=count/cols;pieces=[];layout();const pw=board.w/cols,ph=board.h/rows;const grid=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const id=r*cols+c;const left=c?-grid[id-1].right:0,top=r?-grid[id-cols].bottom:0;grid.push({id,row:r,col:c,left,top,right:c===cols-1?0:Math.random()<.5?1:-1,bottom:r===rows-1?0:Math.random()<.5?1:-1})}const ncols=count===4?2:3,nrows=Math.ceil(count/ncols);const gapX=Math.min(pw*.96,(tray.w-14)/ncols),gapY=Math.min(ph*.88,(tray.h-12)/nrows);for(let i=0;i<count;i++){const g=grid[i],col=i%ncols,row=Math.floor(i/ncols);pieces.push({...g,w:pw,h:ph,tx:board.x+(g.col+.5)*pw,ty:board.y+(g.row+.5)*ph,cx:tray.x+tray.w/2+(col-(ncols-1)/2)*gapX,cy:tray.y+tray.h/2+(row-(nrows-1)/2)*gapY,locked:false})}$('status').textContent='Փուլ '+(round+1)+'/5 · Հավաքիր նկարը';}
function drawBg(time){const t=time*.0003;for(let i=0;i<24;i++){const x=(i*87.43+Math.sin(t+i)*12)%W,y=(i*143.7+Math.cos(t+i*.8)*8)%H;ctx.beginPath();ctx.arc(x,y,i%4===0?2.5:1.3,0,7);ctx.fillStyle='rgba(255,224,152,'+(.13+.14*Math.sin(t+i)) +')';ctx.fill()}const a=grad(0,H*.6,W,H*.4,['#16365a','#0c1f43']);ctx.fillStyle=a;rounded(0,H*.84,W,H*.2,0);ctx.fill();ctx.fillStyle='#467bc3';ctx.fillRect(0,H*.84,W,3)}
function draw(t){ctx.clearRect(0,0,W,H);drawBg(t);if(ready){frame(board.x,board.y,board.w,board.h);for(let r=1;r<board.rows;r++){ctx.strokeStyle='#8c795d6b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(board.x,board.y+r*board.h/board.rows);ctx.lineTo(board.x+board.w,board.y+r*board.h/board.rows);ctx.stroke()}for(let c=1;c<board.cols;c++){ctx.beginPath();ctx.moveTo(board.x+c*board.w/board.cols,board.y);ctx.lineTo(board.x+c*board.w/board.cols,board.y+board.h);ctx.stroke()}pieces.filter(p=>p.locked).forEach(drawPiece);pieces.filter(p=>!p.locked&&p!==drag).forEach(drawPiece);if(drag)drawPiece(drag);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.018;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffdf76';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.life)*3,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.addEventListener('pointerdown',e=>{if(!ready||won)return;const v=pos(e);for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(p.locked)continue;if(Math.abs(v.x-p.cx)<p.w*.65&&Math.abs(v.y-p.cy)<p.h*.7){drag=p;drag.ox=v.x-p.cx;drag.oy=v.y-p.cy;pieces.splice(i,1);pieces.push(p);cv.setPointerCapture(e.pointerId);break}}});cv.addEventListener('pointermove',e=>{if(!drag)return;const v=pos(e);drag.cx=clamp(v.x-drag.ox,drag.w*.4,W-drag.w*.4);drag.cy=clamp(v.y-drag.oy,125,H-70)});function release(){if(!drag)return;const p=drag;drag=null;if(Math.hypot(p.cx-p.tx,p.cy-p.ty)<Math.max(36,Math.min(p.w,p.h)*.48)){p.cx=p.tx;p.cy=p.ty;p.locked=true;for(let i=0;i<17;i++)particles.push({x:p.tx,y:p.ty,vx:rand(-3,3),vy:rand(-4,1),life:1});const placed=pieces.filter(q=>q.locked).length;$('status').textContent='Փուլ '+(round+1)+'/5 · '+placed+'/'+count+' կտոր';if(placed===count){won=true;stars+=5;$('stars').textContent=stars;setTimeout(()=>$('modal').classList.add('show'),850)}}}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll('[data-count]').forEach(x=>x.classList.toggle('selected',x===b));build()});$('again').onclick=build;$('next').onclick=()=>{round=(round+1)%5;image=imgs.findIndex((im,j)=>j>=round%imgs.length&&im.complete&&im.naturalWidth>0);if(image<0)image=imgs.findIndex(im=>im.complete&&im.naturalWidth>0);build()};
let loaded=0;assets.forEach((src,i)=>{const im=new Image();im.onload=()=>{loaded++;if(!ready){ready=true;$('loading').style.display='none';image=i;resize();build()}};im.onerror=()=>{loaded++;if(loaded===assets.length&&!ready)$('loading').textContent='Նկարները չբեռնվեցին։ Ստուգիր կապը։';};im.src=src;imgs[i]=im});resize();
})();
</script></body></html>
