</style></head><body><div id="app"><header><button class="btn" id="back" aria-label="Նախորդ փուլ">‹</button><h1 id="levelLabel">ՓՈՒԼ 1</h1><button class="btn" id="reset" aria-label="Կրկնել">↻</button></header><div id="hint">Հետևիր կետագծին՝ ֆլոմաստերով</div><div id="board"><svg id="drawing" viewBox="0 0 320 430" aria-label="Նկարելու խաղ"></svg><div id="marker"></div></div><div id="status"></div><div id="palette"></div><div id="toolbar"><button id="next" class="btn">Հաջորդ նկարը ›</button></div></div><script>

function setMarker(e){const r=board.getBoundingClientRect();marker.style.left=(e.clientX-r.left-12)+'px';marker.style.top=(e.clientY-r.top-10)+'px';marker.style.display='block'}

function centerArtwork(){const paths=levels[index].paths;let bounds={x:Infinity,y:Infinity,right:-Infinity,bottom:-Infinity};const probe=el('g');svg.append(probe);for(const d of paths){const p=el('path',{d});probe.append(p);const b=p.getBBox();bounds.x=Math.min(bounds.x,b.x);bounds.y=Math.min(bounds.y,b.y);bounds.right=Math.max(bounds.right,b.x+b.width);bounds.bottom=Math.max(bounds.bottom,b.y+b.height)}probe.remove();const w=bounds.right-bounds.x,h=bounds.bottom-bounds.y;const frameW=320,frameH=430;const cx=(bounds.x+bounds.right)/2,cy=(bounds.y+bounds.bottom)/2;svg.setAttribute('viewBox',[cx-frameW/2,cy-frameH/2,frameW,frameH].join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet')}

function startTrace(){svg.replaceChildren();const paths=levels[index].paths;paths.forEach((d,i)=>{if(i<step)svg.append(el('path',{d,class:'outline'}))});const d=paths[step];tracePath=el('path',{d,class:'ghost'});svg.append(tracePath);const overlay=el('path',{d,class:'done'});svg.append(overlay);traceLength=overlay.getTotalLength();overlay.style.strokeDasharray=traceLength;overlay.style.strokeDashoffset=traceLength;tracePath=overlay;progress=0;const p=overlay.getPointAtLength(0);svg.append(el('circle',{id:'startDot',cx:p.x,cy:p.y,r:8}));hint.textContent='Պահիր մատդ էկրանին՝ ֆլոմաստերը ինքնուրույն կնկարի';status.textContent=(step+1)+' / '+paths.length+' ուրվագիծ'}

let frame=0,lastFrame=0,pointerId=null;

function autoTrace(t){if(!drawing||phase!=='trace')return;
 const dt=lastFrame?Math.min((t-lastFrame)/1000,.05):0;lastFrame=t;
 // While a finger stays on screen, the pen follows the line automatically.

 const p=tracePath.getPointAtLength(progress),screen=p.matrixTransform(svg.getScreenCTM()),rect=board.getBoundingClientRect();
 marker.style.left=(screen.x-rect.left-12)+'px';marker.style.top=(screen.y-rect.top-10)+'px';marker.style.display='block';
 const dot=svg.querySelector('#startDot');if(dot){dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y)}

}
let colorPointer=null,activeRegion=-1,lastPoint=null,brushLayer=null,regionMasks=[],regionStrokes=[],regionCells=[],regionCovered=[],regionComplete=new Set(),currentStroke=null,currentStrokeD='',targetRegion=0,guide=null,colorFingerStart=null,colorPenStart=null,colorPenPosition=null;
function startColor(){stopAuto();phase='color';svg.replaceChildren();parts=[];regionMasks=[];regionStrokes=[];regionCells=[];regionCovered=[];regionComplete.clear();targetRegion=0;guide=null;
 const defs=el('defs');svg.append(defs);const paths=levels[index].paths;
 paths.forEach((d,i)=>{const cp=el('clipPath',{id:'color-mask-'+i,clipPathUnits:'userSpaceOnUse'});cp.append(el('path',{d}));defs.append(cp);

 const g=el('g',{'clip-path':'url(#color-mask-'+i+')'});svg.append(g);regionStrokes.push(g);

 const b=shape.getBBox(),cells=[];for(let y=b.y+5;y<b.y+b.height;y+=12)for(let x=b.x+5;x<b.x+b.width;x+=12){if(shape.isPointInFill(new DOMPoint(x,y)))cells.push({x,y})}regionCells.push(cells);regionCovered.push(new Set());
 });palette.style.visibility='visible';showTarget();}
function showTarget(){if(guide){guide.remove();guide=null}if(targetRegion>=parts.length)return;const shape=parts[targetRegion],b=shape.getBBox();guide=el('path',{d:levels[index].paths[targetRegion],fill:'#ffde66','fill-opacity':'.18',stroke:'#ffb400','stroke-width':'5','stroke-dasharray':'9 9','stroke-linecap':'round','pointer-events':'none'});guide.classList.add('color-guide');svg.append(guide);hint.textContent='Ընտրիր գույնը, մատդ դիր ցանկացած տեղ և շարժիր';status.textContent='Հերթը՝ '+(targetRegion+1)+' / '+parts.length+' հատված';}
