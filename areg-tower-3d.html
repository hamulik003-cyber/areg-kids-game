<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Կառուցիր աշտարակը 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;background:#cdefff}main{height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 48% 20%,#f9ffff,#d6f4fc 55%,#acd7f1);padding:10px 8px 16px;gap:7px}#hud{width:min(96%,560px);display:flex;justify-content:space-between;align-items:center;gap:5px}#hud span{border:3px solid #b9874b;border-radius:15px;padding:7px 10px;background:linear-gradient(#fff7db,#f7d7a3);box-shadow:0 4px 0 #946236;color:#74481f;font-weight:900;font-size:clamp(13px,3.5vw,18px)}#tip{font-weight:850;color:#675083;text-align:center;font-size:clamp(13px,3.8vw,19px);min-height:24px}#stage{flex:1;min-height:0;width:min(100%,600px);position:relative;border:7px solid #d6a36e;border-radius:25px;overflow:hidden;box-shadow:inset 0 0 25px #ffffff99,0 7px 0 #9b6947;background:linear-gradient(#e8faff,#a9dcf3)}canvas{width:100%;height:100%;display:block;touch-action:none}#dock{height:120px;width:min(100%,580px);display:flex;align-items:center;justify-content:space-evenly;gap:4px;background:#fff8e6;border:5px solid #c88f54;border-radius:23px;box-shadow:0 5px 0 #a56e3c;padding:6px}.shape{height:90px;flex:1;min-width:0;border:3px solid #d6b077;border-radius:16px;background:linear-gradient(#fff,#f2dfb9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;color:#755334;font-weight:800;touch-action:none;user-select:none}.shape svg{height:50px;width:58px;filter:drop-shadow(1px 4px 2px #0002)}.shape.selected{border-color:#40ad64;background:#d9ffdf;transform:translateY(-3px)}#overlay{display:none;position:absolute;inset:0;z-index:3;align-items:center;justify-content:center;background:#34446a99}#overlay.show{display:flex}#modal{background:linear-gradient(#fffef4,#ffe6a4);border:6px solid #dba05c;border-radius:26px;text-align:center;padding:22px;max-width:88%;color:#73451d;box-shadow:0 12px 28px #0004}#modal h2{font-size:28px;margin:0 0 10px}button#next,button#reset{background:linear-gradient(#ffed91,#ffb44c);border:3px solid #fff;border-radius:17px;padding:10px 18px;font-size:17px;font-weight:900;color:#70451f;box-shadow:0 4px 0 #b47d3e}#reset{font-size:14px!important;padding:8px 12px!important}#floating{position:absolute;top:12px;right:10px;color:#8b5a31;font-weight:900;background:#fff8d8cc;border-radius:13px;padding:6px 9px;font-size:13px;pointer-events:none}#fallback{display:none;padding:20px;text-align:center;color:#654b3a}</style></head><body><main><div id="hud"><span id="level">Փուլ 1</span><span id="count">🏗️ 0 / 5</span><button id="reset">↻ Նորից</button></div><div id="tip">Ընտրի՛ր պատկեր, հետո դի՛ր աշտարակի վրա</div><div id="stage"><canvas id="scene"></canvas><div id="floating">☝️ Քաշիր պատկերը դեպի աշտարակ</div><div id="overlay"><div id="modal"><h2>Ապրե՜ս! 🌟</h2><p>Աշտարակը պատրաստ է</p><button id="next">Հաջորդ փուլ ➜</button></div></div><div id="fallback">3D տեսքը չբացվեց։ Ստուգիր ինտերնետ կապը։</div></div><div id="dock"></div></main><script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script><script>
(()=>{'use strict';const T=window.THREE;if(!T){document.getElementById('fallback').style.display='block';return}const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('scene'),dock=$('dock');let level=1,stack=[],selected=0,drag=false,startY=0,rotating=false,ready=true;const types=[{name:'Խորանարդ',geo:()=>new T.BoxGeometry(1.3,.8,1.3),color:0xf38c68},{name:'Գլան',geo:()=>new T.CylinderGeometry(.65,.65,.8,40),color:0x65b9f1},{name:'Պրիզմա',geo:()=>new T.CylinderGeometry(.73,.73,.8,6),color:0xb18de7},{name:'Բուրգ',geo:()=>new T.ConeGeometry(.73,.9,4),color:0xffcb58},{name:'Կոն',geo:()=>new T.ConeGeometry(.65,.9,40),color:0x81d99a},{name:'Գունդ',geo:()=>new T.SphereGeometry(.63,32,24),color:0xf59ab8}];const scene=new T.Scene();scene.background=new T.Color('#c7eafa');const camera=new T.PerspectiveCamera(37,1,.1,100);camera.position.set(5.3,5.1,10.5);camera.lookAt(0,1.8,0);const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;scene.add(new T.HemisphereLight(0xffffff,0x829fc0,2.2));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(-4,10,6);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-10;light.shadow.camera.right=10;light.shadow.camera.top=12;light.shadow.camera.bottom=-10;scene.add(light);const ground=new T.Mesh(new T.CylinderGeometry(2.5,2.6,.35,64),new T.MeshStandardMaterial({color:0xd6b181,roughness:.7}));ground.position.y=-.23;ground.receiveShadow=true;scene.add(ground);const platform=new T.Mesh(new T.CylinderGeometry(1.25,1.35,.28,48),new T.MeshStandardMaterial({color:0xfff0c9,roughness:.5,metalness:.05}));platform.position.y=.04;platform.receiveShadow=true;scene.add(platform);const decor=new T.Group();scene.add(decor);for(let i=0;i<12;i++){const a=i*Math.PI/6,p=new T.Mesh(new T.SphereGeometry(.07,12,8),new T.MeshStandardMaterial({color:i%2?0xf5b05d:0xffffff,emissive:i%2?0x8d4e1b:0x4488aa,emissiveIntensity:.25}));p.position.set(Math.cos(a)*2.25,.08,Math.sin(a)*2.25);decor.add(p)}const material=color=>new T.MeshStandardMaterial({color,roughness:.32,metalness:.07});const preview=new T.Mesh(types[0].geo(),material(types[0].color));preview.position.set(2.4,1.4,0);preview.castShadow=true;scene.add(preview);function shapeSvg(i){const c=['#f38c68','#65b9f1','#b18de7','#ffcb58','#81d99a','#f59ab8'][i];const paths=['<path d="M14 20L32 9L51 20V43L32 54L14 43Z"/><path d="M14 20L32 31L51 20M32 31V54"/>','<ellipse cx="32" cy="15" rx="19" ry="8"/><path d="M13 15V44Q32 60 51 44V15"/><ellipse cx="32" cy="44" rx="19" ry="8"/>','<path d="M12 19L31 10L52 19V44L31 55L12 44Z"/><path d="M12 19L31 30L52 19M31 30V55"/>','<path d="M32 6L9 45L32 57L55 45Z"/><path d="M32 6V57M9 45L32 38L55 45"/>','<ellipse cx="32" cy="47" rx="23" ry="9"/><path d="M9 47L32 5L55 47"/>','<circle cx="32" cy="32" r="23"/><ellipse cx="32" cy="32" rx="10" ry="23"/>'];return '<svg viewBox="0 0 64 64" fill="'+c+'" stroke="#866346" stroke-width="2.3" stroke-linejoin="round">'+paths[i]+'</svg>'}function fillDock(){dock.replaceChildren();types.forEach((t,i)=>{const b=document.createElement('button');b.className='shape'+(selected===i?' selected':'');b.innerHTML=shapeSvg(i)+'<span>'+t.name+'</span>';b.addEventListener('click',()=>choose(i));b.addEventListener('pointerdown',e=>{startY=e.clientY;drag=true});b.addEventListener('pointerup',e=>{if(drag&&startY-e.clientY>45)place();drag=false});dock.append(b)})}function choose(i){selected=i;preview.geometry.dispose();preview.material.dispose();preview.geometry=types[i].geo();preview.material=material(types[i].color);fillDock()}function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);function update(){const goal=Math.min(5+level-1,9);$('level').textContent='Փուլ '+level;$('count').textContent='🏗️ '+stack.length+' / '+goal;return goal}function place(){if(!ready||stack.length>=update())return;ready=false;const t=types[selected],obj=new T.Mesh(t.geo(),material(t.color));obj.castShadow=true;obj.receiveShadow=true;const height=t.name==='Գունդ'?1.05:t.name==='Կոն'||t.name==='Բուրգ'?.9:.8;let bottom=.18;for(let s of stack)bottom+=s.h;obj.position.set(0,bottom+height/2+2,0);obj.rotation.y=Math.random()*.5;scene.add(obj);stack.push({mesh:obj,h:height});let target=bottom+height/2;const begin=performance.now();function fall(now){const p=Math.min(1,(now-begin)/570),ease=1-Math.pow(1-p,3);obj.position.y=target+2*(1-ease);obj.rotation.y+=.018;if(p<1)requestAnimationFrame(fall);else{obj.position.y=target;ready=true;if(stack.length>=update())setTimeout(()=>{$('overlay').classList.add('show');$('tip').textContent='Աշտարակը պատրաստ է! 🌟'},350);else $('tip').textContent='Հրաշալի՜ է, ավելացրու հաջորդ պատկերը'}}requestAnimationFrame(fall)}function reset(){for(let s of stack){scene.remove(s.mesh);s.mesh.geometry.dispose();s.mesh.material.dispose()}stack=[];ready=true;$('overlay').classList.remove('show');$('tip').textContent='Ընտրի՛ր պատկեր, հետո դի՛ր աշտարակի վրա';update()}$('next').onclick=()=>{level++;reset()};$('reset').onclick=reset;canvas.addEventListener('pointerdown',e=>{rotating=true;startY=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(rotating){let dx=e.clientX-startY;startY=e.clientX;decor.rotation.y+=dx*.012;stack.forEach(s=>s.mesh.rotation.y+=dx*.009);preview.rotation.y+=dx*.015}});canvas.addEventListener('pointerup',e=>{if(rotating){rotating=false;place()}});canvas.addEventListener('pointercancel',()=>rotating=false);function animate(){preview.rotation.y+=.009;preview.rotation.x=.12+Math.sin(performance.now()*.0009)*.12;decor.rotation.y+=.001;renderer.render(scene,camera)}renderer.setAnimationLoop(animate);fillDock();update();resize()})();
</script></body></html>
