const [x,z]=xyz(t.r,t.c);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.userData.tile=t});scene.add(g);t.group=g;t.target=g.position.clone();t.slide=null}
function clear(){for(const t of tiles)scene.remove(t.group);tiles=[];if(ball){scene.remove(ball);ball=null}won=false;animating=false;ballPath=[];ballT=0;ballCurve=null;ballDistance=0;ballLength=0;collectedKeys=0;unlockTime=0;ballReturning=false;lastAttempt=''}
function setup(){clear();moves=0;document.getElementById('moves').textContent='Քայլեր՝ 0';document.getElementById('level').textContent='Փուլ '+(level+1);document.getElementById('modal').classList.remove('show');document.getElementById('run').disabled=false;tiles=configs[level%configs.length].map(t=>({...t,d:[...t.d]}));for(const t of tiles)makeTile(t);document.getElementById('msg').textContent='Սահեցրու սալիկները դեպի դատարկ վանդակը'}
function find(r,c){return tiles.find(t=>t.r===r&&t.c===c)}
function move(t,dr,dc){if(animating||won||tiles.some(q=>q.slide)||t.fixed)return;const choices=[[dr,dc]].filter(([a,b])=>Math.abs(a)+Math.abs(b)===1).map(([a,b])=>[t.r+a,t.c+b]).filter(([r,c])=>r>=0&&r<N&&c>=0&&c<N&&!find(r,c));if(!choices.length)return;const [r,c]=choices[0];t.r=r;t.c=c;const [x,z]=xyz(r,c);t.slide={from:t.group.position.clone(),to:new T.Vector3(x,0,z),elapsed:0,duration:.14};t.target.set(x,0,z);moves++;lastAttempt='';document.getElementById('moves').textContent='Քայլեր՝ '+moves}
// Direct manipulation: the tile tracks the finger in world space, then snaps quickly.
let touchStart=null;const dragPlane=new T.Plane(new T.Vector3(0,1,0),-.36);
function worldAt(e){const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const p=new T.Vector3();return ray.ray.intersectPlane(dragPlane,p)?p:null}
renderer.domElement.addEventListener('pointerdown',e=>{if(animating||won||tiles.some(t=>t.slide))return;const p=worldAt(e);if(!p)return;const hit=ray.intersectObjects(tiles.map(t=>t.group),true)[0],tile=hit?.object.userData.tile;if(!tile||tile.fixed)return;const options=[[0,1],[1,0],[0,-1],[-1,0]].filter(([dr,dc])=>{const rr=tile.r+dr,cc=tile.c+dc;return rr>=0&&rr<N&&cc>=0&&cc<N&&!find(rr,cc)});if(!options.length)return;touchStart={tile,start:p,options,axis:null,amount:0,downAt:performance.now(),screenX:e.clientX,screenY:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{const d=touchStart;if(!d)return;const p=worldAt(e);if(!p)return;const dx=p.x-d.start.x,dz=p.z-d.start.z;let choice=d.axis;if(!choice){const primary=Math.abs(dx)>Math.abs(dz)?[0,Math.sign(dx)]:[Math.sign(dz),0];choice=d.options.find(([dr,dc])=>dr===primary[0]&&dc===primary[1]);if(!choice)return;d.axis=choice}const [dr,dc]=choice;const distance=Math.max(0,Math.min(cell,dr?dz*dr:dx*dc));d.amount=distance;const [x,z]=xyz(d.tile.r,d.tile.c);d.tile.group.position.set(x+dc*distance,0,z+dr*distance)});
function releaseDrag(e,cancel=false){const d=touchStart;if(!d)return;touchStart=null;const t=d.tile;const [x,z]=xyz(t.r,t.c);if(cancel){t.slide={from:t.group.position.clone(),to:new T.Vector3(x,0,z),elapsed:0,duration:.11};return}if(!d.axis){const choice=d.options[0];move(t,...choice);return}const elapsed=Math.max(1,performance.now()-d.downAt);const projected=d.amount;const shouldCommit=projected>cell*.24||(projected>cell*.09&&elapsed<210);if(shouldCommit){move(t,...d.axis)}else{t.slide={from:t.group.position.clone(),to:new T.Vector3(x,0,z),elapsed:0,duration:.11}}}
renderer.domElement.addEventListener('pointerup',e=>releaseDrag(e));renderer.domElement.addEventListener('pointercancel',e=>releaseDrag(e,true));
function route(){const start=tiles.find(t=>t.kind==='start'),goal=tiles.find(t=>t.kind==='goal');if(!start||!goal)return null;const q=[[start,[start]]],seen=new Set([start.id]);while(q.length){const [t,path]=q.shift();if(t===goal)return path;for(const d of t.d){const [dr,dc]=dirs[d],n=find(t.r+dr,t.c+dc);if(n&&n.d.includes(op[d])&&!seen.has(n.id)){seen.add(n.id);q.push([n,[...path,n]])}}}return null}
function launch(pathOverride){if(animating||won)return;const path=Array.isArray(pathOverride)?pathOverride:route();if(!path){document.getElementById('msg').textContent='Ճանապարհը դեռ փակ է․ միացրու խողովակները';return}collectedKeys=0;unlockTime=0;ballReturning=false;const startTile=tiles.find(t=>t.kind==='start');if(startTile?.startOrb)startTile.startOrb.visible=false;if(ball){scene.remove(ball);ball=null}for(const t of tiles)if(t.key){t.keyCollected=false;t.keySpinner.visible=true}document.getElementById('msg').textContent='Հավաքիր 3 բանալիները…';ballPath=path;ballT=0;ballDistance=0;const points=[];for(let i=0;i<path.length;i++){const [x,z]=xyz(path[i].r,path[i].c);points.push(new T.Vector3(x,.75,z))}ballCurve=new T.CatmullRomCurve3(points,false,'centripetal',.5);ballLength=ballCurve.getLength();animating=true;ball=mesh(new T.SphereGeometry(.295,40,30),material(0xf5f0e6,.12,.7));ball.castShadow=false;ball.receiveShadow=false;scene.add(ball);const [x,z]=xyz(path[0].r,path[0].c);ball.position.set(x,.75,z);document.getElementById('run').disabled=true}
document.getElementById('run').onclick=()=>launch();document.getElementById('reset').onclick=setup;document.getElementById('next').onclick=()=>{level++;setup()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.fov=34;const aspect=w/h;const targetWidth=9.6;const dist=Math.max(13.2,targetWidth/(2*Math.tan(camera.fov*Math.PI/360)*aspect));camera.position.set(0,dist,0.01);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(w,h,true)}addEventListener('resize',resize);resize();setup();let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(Math.max((now-last)/1000,0),.09);last=now;warmAccent.intensity=.6+.16*Math.sin(now*.00055);const nightHue=.65+.07*Math.sin(now*.000028);grainFloor.material.color.setHSL(nightHue,.72,.085);scene.background.setHSL(nightHue,.72,.075);for(const f of backgroundFlecks){const t=now*.00012+f.phase;f.mesh.rotation.y=now*.00035+f.phase;f.mesh.rotation.z=now*.0002+f.phase;f.mesh.position.x=f.x+.32*Math.sin(t*2.1);f.mesh.position.z=f.z+.38*Math.cos(t*1.7);f.mesh.position.y=-.48+.07*Math.sin(t*3);const pulse=.5-.5*Math.cos(t*2.4);const hue=(now*.000075+f.phase*.13)%1;f.mesh.material.color.setHSL(hue,.95,.64);f.mesh.material.opacity=.9*pulse;f.glow.material.color.setHSL(hue,.9,.58);f.glow.material.opacity=.17*pulse}for(const t of tiles){if(t.keySpinner)t.keySpinner.rotation.y=now*.0013+t.keySpinOffset;if(t.slide){const slide=t.slide;slide.elapsed=Math.min(slide.duration,slide.elapsed+dt);const p=slide.elapsed/slide.duration;const eased=p*p*(3-2*p);t.group.position.lerpVectors(slide.from,slide.to,eased);if(p>=1){t.group.position.copy(slide.to);t.slide=null}}}if(!animating&&!won&&!tiles.some(t=>t.slide)&&!touchStart){const ready=route();if(ready){const signature=ready.map(t=>t.id+':'+t.r+','+t.c).join('|');if(signature!==lastAttempt){lastAttempt=signature;launch(ready)}}}if(animating&&ball&&ballCurve){ballDistance=ballReturning?Math.max(0,ballDistance-dt*5.1):Math.min(ballLength,ballDistance+dt*5.1);const u=ballLength>0?ballDistance/ballLength:1;ball.position.copy(ballCurve.getPointAt(u));ball.rotation.z-=dt*8;if(!ballReturning)for(const t of ballPath){if(t.key&&!t.keyCollected){const [x,z]=xyz(t.r,t.c);if(Math.hypot(ball.position.x-x,ball.position.z-z)<.39){t.keyCollected=true;t.keySpinner.visible=false;collectedKeys++;document.getElementById('msg').textContent='Բանալիներ՝ '+collectedKeys+'/3'}}}
 if(!ballReturning&&u>=1){if(collectedKeys===3){animating=false;const goal=tiles.find(t=>t.kind==='goal');if(goal){goal.lockBody.material.color.setHex(0x16a765);goal.lockFront.material.color.setHex(0x36d98d);goal.lockShackle.position.x=.25;goal.lockShackle.rotation.y=-.34}unlockTime=now+1100;document.getElementById('msg').textContent='🔓 Կողպեքը բացվեց';}else{ballReturning=true;document.getElementById('msg').textContent='🔒 Հավաքիր բոլոր 3 բանալիները․ գնդիկը վերադառնում է';}}if(ballReturning&&ballDistance<=0){ballReturning=false;animating=false;scene.remove(ball);ball=null;for(const t of tiles)if(t.key){t.keyCollected=false;t.keySpinner.visible=true}collectedKeys=0;const startTile=tiles.find(t=>t.kind==='start');if(startTile?.startOrb)startTile.startOrb.visible=true;document.getElementById('msg').textContent='🔑 Կողպեքը բացելու համար պետք է 3 բանալի';document.getElementById('run').disabled=false}}if(unlockTime&&now>=unlockTime){unlockTime=0;won=true;document.getElementById('modal').classList.add('show')}renderer.render(scene,camera)}requestAnimationFrame(loop);
