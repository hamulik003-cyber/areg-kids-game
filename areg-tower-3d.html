<div class="stage" id="stage"></div><div class="hint">Կառուցի՛ր, պտտի՛ր և գործարկի՛ր գնդիկը</div><div class="actions"><button class="action" id="play">▶ Փորձարկել</button><button class="action" id="reset">↻ Մաքրել</button></div><div class="dock"><button class="tool" data-type="ramp">🪵<small>Թեք</small></button><button class="tool" data-type="tube">🟦<small>Խողովակ</small></button><button class="tool" data-type="bumper">🟠<small>Անիվ</small></button><button class="tool" data-type="ball">🟡<small>Գնդիկ</small></button><button class="tool" id="rotate">↻<small>Պտտել</small></button><button class="tool" id="remove">✕<small>Ջնջել</small></button></div>

add('ramp',innerWidth*.19,innerHeight*.35);add('ramp',innerWidth*.52,innerHeight*.51);add('ball',innerWidth*.24,innerHeight*.22);
