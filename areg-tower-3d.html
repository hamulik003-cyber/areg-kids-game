<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Գնդիկի ճանապարհը</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif}body{background:#e5c99e;color:#684128}#view{position:absolute;inset:0}canvas{display:block;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.chip{background:linear-gradient(#fff2d2,#e5bd86);border:2px solid #ae7d4f;border-bottom-width:4px;border-radius:17px;padding:8px 12px;font-size:13px;font-weight:900;box-shadow:0 4px 10px #6d452933}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:12px;right:12px;display:flex;justify-content:center;gap:10px}.btn{border:3px solid #ad7545;border-bottom-width:6px;border-radius:19px;padding:12px 17px;background:linear-gradient(#fff0c7,#e3b575);font-size:15px;font-weight:900;color:#704222;box-shadow:0 6px 14px #68422550;touch-action:manipulation}.btn:active{transform:translateY(3px);border-bottom-width:3px}.btn.primary{background:linear-gradient(#c4f3cd,#65bc8b);border-color:#42835c;color:#1d5439}.message{position:absolute;left:12px;right:12px;top:58px;text-align:center;font-weight:800;color:#795336;text-shadow:0 1px #fff;font-size:13px;pointer-events:none}.modal{position:absolute;inset:0;background:#2c241a99;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{width:min(90vw,360px);background:linear-gradient(#fff1d1,#e8b982);border:6px solid #a87345;border-radius:28px;text-align:center;padding:24px;box-shadow:0 15px 40px #25150766}.card h2{font-size:26px;margin:8px}.card p{font-weight:700;line-height:1.5}@media(max-height:640px){.hud{top:3px}.message{top:48px}.bottom{bottom:5px}.btn{padding:8px 12px}}</style></head><body>
<div id="view"></div><div class="hud"><div class="chip" id="level">Փուլ 1</div><div class="chip" id="moves">Քայլեր՝ 0</div></div><div class="message" id="msg">Տեղափոխիր դետալները՝ գնդիկի ճանապարհը բացելու համար</div><div class="bottom"><button class="btn primary" id="run">▶ Գործարկել</button><button class="btn" id="reset">↺ Սկզբից</button></div><div class="modal" id="modal"><div class="card"><div style="font-size:54px">🌟</div><h2>Ապրե՛ս</h2><p>Գնդիկը հասավ նպատակին։</p><button class="btn primary" id="next">Հաջորդ փուլ →</button></div></div>
<script type="module">
import * as T from './vendor/three.module.min.js';
const host=document.getElementById('view'),N=4,cell=1.75,off=(N-1)*cell/2;const scene=new T.Scene();scene.background=new T.Color(0xe7d3b4);scene.fog=new T.Fog(0xe7d3b4,18,32);const camera=new T.PerspectiveCamera(37,1,.1,60);camera.position.set(0,8.8,13.6);camera.lookAt(0,.1,0);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;host.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff4db,0x877366,2.2));const sun=new T.DirectionalLight(0xffedcd,3.3);sun.position.set(-4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;sun.shadow.normalBias=.02;scene.add(sun);const fill=new T.DirectionalLight(0xb6e4e8,1.1);fill.position.set(5,3,-3);scene.add(fill);
const material=(c,r=.75,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m}),wood=material(0xd4a06c),side=material(0x9c6039),rim=material(0xe9be86),groove=material(0x66432d),gold=material(0xf5b74d,.25,.24),goalMat=material(0x69b987,.4,.2);
function mesh(g,m){const o=new T.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o}
const base=mesh(new T.BoxGeometry(8,.52,8),side);base.position.y=-.35;scene.add(base);const face=mesh(new T.BoxGeometry(7.65,.13,7.65),rim);face.position.y=-.05;scene.add(face);
const slots=[];for(let row=0;row<N;row++)for(let col=0;col<N;col++){const p=mesh(new T.BoxGeometry(cell-.09,.05,cell-.09),material((row+col)%2?0xbd895a:0xc49362));p.position.set(col*cell-off,.03,row*cell-off);scene.add(p);slots.push(p)}
const configs=[
[{id:0,r:0,c:0,kind:'start',d:['R']},{id:1,r:0,c:1,kind:'straight',d:['L','R']},{id:2,r:0,c:3,kind:'corner',d:['L','D']},{id:3,r:0,c:2,kind:'straight',d:['U','D']},{id:4,r:2,c:2,kind:'corner',d:['U','R']},{id:5,r:2,c:3,kind:'goal',d:['L']},{id:6,r:1,c:0,kind:'corner',d:['D','R']},{id:7,r:1,c:1,kind:'straight',d:['U','D']},{id:8,r:2,c:0,kind:'straight',d:['L','R']},{id:9,r:2,c:1,kind:'corner',d:['U','L']},{id:10,r:3,c:0,kind:'corner',d:['U','R']},{id:11,r:3,c:1,kind:'straight',d:['L','R']},{id:12,r:3,c:2,kind:'corner',d:['U','L']},{id:13,r:3,c:3,kind:'straight',d:['U','D']},{id:14,r:1,c:3,kind:'corner',d:['L','D']}],
[{id:0,r:0,c:0,kind:'start',d:['D']},{id:1,r:1,c:0,kind:'corner',d:['U','R']},{id:2,r:1,c:1,kind:'corner',d:['L','D']},{id:3,r:2,c:1,kind:'corner',d:['U','R']},{id:4,r:2,c:2,kind:'straight',d:['L','R']},{id:5,r:2,c:3,kind:'goal',d:['L']},{id:6,r:0,c:1,kind:'straight',d:['U','D']},{id:7,r:0,c:2,kind:'corner',d:['D','R']},{id:8,r:0,c:3,kind:'corner',d:['L','D']},{id:9,r:1,c:2,kind:'straight',d:['L','R']},{id:10,r:1,c:3,kind:'corner',d:['U','L']},{id:11,r:2,c:0,kind:'corner',d:['U','R']},{id:12,r:3,c:0,kind:'straight',d:['U','D']},{id:13,r:3,c:1,kind:'corner',d:['L','U']},{id:14,r:3,c:2,kind:'straight',d:['L','R']}]
];
const dirs={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},op={U:'D',D:'U',L:'R',R:'L'};let level=0,tiles=[],moves=0,animating=false,ball=null,ballPath=[],ballT=0,won=false;const ray=new T.Raycaster(),pointer=new T.Vector2();function xyz(r,c){return [c*cell-off,r*cell-off]}
function makeTile(t){const g=new T.Group(),top=mesh(new T.BoxGeometry(cell-.13,.26,cell-.13),wood);top.position.y=.24;g.add(top);const edging=mesh(new T.BoxGeometry(cell-.12,.08,cell-.12),side);edging.position.y=.11;g.add(edging);
const hole=mesh(new T.BoxGeometry(cell-.27,.025,cell-.27),rim);hole.position.y=.378;g.add(hole);
const center=mesh(new T.CylinderGeometry(.3,.3,.028,36),groove);center.position.y=.4;g.add(center);
for(const d of t.d){const seg=mesh(new T.BoxGeometry(d==='L'||d==='R'?.64:.52,.032,d==='U'||d==='D'?.64:.52),groove);seg.position.set(d==='L'?-.49:d==='R'?.49:0,.41,d==='U'?-.49:d==='D'?.49:0);g.add(seg);const inset=mesh(new T.BoxGeometry(d==='L'||d==='R'?.58:.36,.008,d==='U'||d==='D'?.58:.36),material(0x855738));inset.position.copy(seg.position);inset.position.y=.433;g.add(inset)}
if(t.kind==='start'||t.kind==='goal'){const ring=mesh(new T.TorusGeometry(.37,.09,12,36),t.kind==='start'?gold:goalMat);ring.rotation.x=Math.PI/2;ring.position.y=.47;g.add(ring)}
g.position.set(...[xyz(t.r,t.c)[0],0,xyz(t.r,t.c)[1]]);g.traverse(o=>{if(o.isMesh)o.userData.tile=t});scene.add(g);t.group=g;t.target=g.position.clone()}
function clear(){for(const t of tiles)scene.remove(t.group);tiles=[];if(ball){scene.remove(ball);ball=null}won=false;animating=false;ballPath=[];ballT=0}
function setup(){clear();moves=0;document.getElementById('moves').textContent='Քայլեր՝ 0';document.getElementById('level').textContent='Փուլ '+(level+1);document.getElementById('modal').classList.remove('show');document.getElementById('run').disabled=false;tiles=configs[level%configs.length].map(t=>({...t,d:[...t.d]}));for(const t of tiles)makeTile(t);document.getElementById('msg').textContent='Տեղափոխիր դետալները՝ ճանապարհը միացնելու համար'}
function find(r,c){return tiles.find(t=>t.r===r&&t.c===c)}
function move(t){if(animating||won||t.kind==='start'||t.kind==='goal')return;const choices=[[0,1],[1,0],[0,-1],[-1,0]].map(([dr,dc])=>[t.r+dr,t.c+dc]).filter(([r,c])=>r>=0&&r<N&&c>=0&&c<N&&!find(r,c));if(!choices.length)return;const [r,c]=choices[0];t.r=r;t.c=c;const [x,z]=xyz(r,c);t.target.set(x,0,z);moves++;document.getElementById('moves').textContent='Քայլեր՝ '+moves}
renderer.domElement.addEventListener('pointerdown',e=>{if(animating||won)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const h=ray.intersectObjects(tiles.map(t=>t.group),true)[0];if(h?.object.userData.tile)move(h.object.userData.tile)});
function route(){const start=tiles.find(t=>t.kind==='start'),goal=tiles.find(t=>t.kind==='goal');if(!start||!goal)return null;const q=[[start,[start]]],seen=new Set([start.id]);while(q.length){const [t,path]=q.shift();if(t===goal)return path;for(const d of t.d){const [dr,dc]=dirs[d],n=find(t.r+dr,t.c+dc);if(n&&n.d.includes(op[d])&&!seen.has(n.id)){seen.add(n.id);q.push([n,[...path,n]])}}}return null}
function launch(){if(animating||won)return;const path=route();if(!path){document.getElementById('msg').textContent='Ճանապարհը դեռ փակ է․ միացրու խողովակները';return}document.getElementById('msg').textContent='Գնդիկը շարժվում է…';ballPath=path;ballT=0;animating=true;ball=mesh(new T.SphereGeometry(.27,32,24),gold);scene.add(ball);const [x,z]=xyz(path[0].r,path[0].c);ball.position.set(x,.75,z);document.getElementById('run').disabled=true}
document.getElementById('run').onclick=launch;document.getElementById('reset').onclick=setup;document.getElementById('next').onclick=()=>{level++;setup()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;const fov=camera.fov*Math.PI/180;const visibleH=2*Math.tan(fov/2);const availableWidth=.90;const requiredDistance=(8.9/availableWidth)/(visibleH*camera.aspect);const distance=Math.max(15,requiredDistance);camera.position.set(0,distance*.68,distance);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();setup();let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;for(const t of tiles)t.group.position.lerp(t.target,Math.min(1,dt*13));if(animating&&ball&&ballPath.length){ballT+=dt*1.2;const seg=Math.min(Math.floor(ballT),ballPath.length-1),f=Math.min(1,ballT-seg),a=ballPath[seg],b=ballPath[Math.min(seg+1,ballPath.length-1)];const [ax,az]=xyz(a.r,a.c),[bx,bz]=xyz(b.r,b.c);const ease=f*f*(3-2*f);ball.position.set(ax+(bx-ax)*ease,.75+Math.sin(f*Math.PI)*.07,az+(bz-az)*ease);ball.rotation.z-=dt*4;if(ballT>=ballPath.length-1+.35){animating=false;won=true;document.getElementById('modal').classList.add('show')}}renderer.render(scene,camera)}requestAnimationFrame(loop);
</script></body></html>
