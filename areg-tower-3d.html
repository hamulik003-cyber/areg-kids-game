<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Գնդիկի ճանապարհը</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif}body{background:#e5c99e;color:#684128}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.chip{background:linear-gradient(#fff2d2,#e5bd86);border:2px solid #ae7d4f;border-bottom-width:4px;border-radius:17px;padding:8px 12px;font-size:13px;font-weight:900;box-shadow:0 4px 10px #6d452933}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:12px;right:12px;display:flex;justify-content:center;gap:10px}.btn{border:3px solid #ad7545;border-bottom-width:6px;border-radius:19px;padding:12px 17px;background:linear-gradient(#fff0c7,#e3b575);font-size:15px;font-weight:900;color:#704222;box-shadow:0 6px 14px #68422550;touch-action:manipulation}.btn:active{transform:translateY(3px);border-bottom-width:3px}.btn.primary{background:linear-gradient(#c4f3cd,#65bc8b);border-color:#42835c;color:#1d5439}.message{position:absolute;left:12px;right:12px;top:58px;text-align:center;font-weight:800;color:#795336;text-shadow:0 1px #fff;font-size:13px;pointer-events:none}.modal{position:absolute;inset:0;background:#2c241a99;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{width:min(90vw,360px);background:linear-gradient(#fff1d1,#e8b982);border:6px solid #a87345;border-radius:28px;text-align:center;padding:24px;box-shadow:0 15px 40px #25150766}.card h2{font-size:26px;margin:8px}.card p{font-weight:700;line-height:1.5}@media(max-height:640px){.hud{top:3px}.message{top:48px}.bottom{bottom:5px}.btn{padding:8px 12px}}</style></head><body>
<div id="view"></div><div class="hud"><div class="chip" id="level">Փուլ 1</div><div class="chip" id="moves">Քայլեր՝ 0</div></div><div class="message" id="msg">Տեղափոխիր դետալները՝ գնդիկի ճանապարհը բացելու համար</div><div class="bottom"><button class="btn primary" id="run">▶ Գործարկել</button><button class="btn" id="reset">↺ Սկզբից</button></div><div class="modal" id="modal"><div class="card"><div style="font-size:54px">🌟</div><h2>Ապրե՛ս</h2><p>Գնդիկը հասավ նպատակին։</p><button class="btn primary" id="next">Հաջորդ փուլ →</button></div></div>
<script type="module">
import * as T from './vendor/three.module.min.js';
const host=document.getElementById('view'),N=4,cell=1.75,off=(N-1)*cell/2;const scene=new T.Scene();scene.background=new T.Color(0xb47c4b);scene.fog=new T.Fog(0xb47c4b,18,32);const camera=new T.PerspectiveCamera(37,1,.1,60);camera.position.set(0,15,0.01);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;host.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xfff4db,0x877366,2.2));const sun=new T.DirectionalLight(0xffedcd,3.3);sun.position.set(-4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;sun.shadow.normalBias=.02;scene.add(sun);const fill=new T.DirectionalLight(0xb6e4e8,1.1);fill.position.set(5,3,-3);scene.add(fill);
const material=(c,r=.75,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function woodTexture(base,dark,seed){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,512);let state=seed*7919+17;const rand=()=>{state=(state*1664525+1013904223)>>>0;return state/4294967296};for(let i=0;i<240;i++){const y=rand()*512;x.beginPath();x.moveTo(0,y);for(let xx=0;xx<=512;xx+=12)x.lineTo(xx,y+Math.sin(xx*.017+i*.71)*(.8+rand()*2.4));x.strokeStyle=dark;x.globalAlpha=.025+rand()*.12;x.lineWidth=.3+rand()*2.3;x.stroke()}x.globalAlpha=1;for(let i=0;i<3;i++){const cx=60+rand()*390,cy=60+rand()*390;x.strokeStyle=dark;x.globalAlpha=.055;for(let k=0;k<3;k++){x.beginPath();x.ellipse(cx,cy,10+k*9,4+k*3,0,0,Math.PI*2);x.stroke()}}x.globalAlpha=1;const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);return t}
const wood=new T.MeshStandardMaterial({map:woodTexture('#b87a45','#5d321c',3),roughness:.73}),side=material(0x82431f),rim=new T.MeshStandardMaterial({map:woodTexture('#dc9a59','#85512b',8),roughness:.7}),groove=material(0x2d180e,.98),channel=material(0x56301b,.94),bevel=material(0x6c391e),gold=material(0xf5b74d,.25,.58),goalMat=material(0x69b987,.4,.2),steel=material(0x6e7480,.36,.68),steelDark=material(0x333843,.44,.55);
function mesh(g,m){const o=new T.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o}
const base=mesh(new T.BoxGeometry(7.85,.6,7.85),side);base.position.y=-.37;scene.add(base);const outer=mesh(new T.BoxGeometry(8.08,.24,8.08),rim);outer.position.y=-.29;scene.add(outer);const face=mesh(new T.BoxGeometry(7.35,.12,7.35),groove);face.position.y=-.05;scene.add(face);
const slots=[];for(let row=0;row<N;row++)for(let col=0;col<N;col++){const p=mesh(new T.BoxGeometry(cell-.04,.04,cell-.04),material(0x6b4129));p.position.set(col*cell-off,.025,row*cell-off);scene.add(p);slots.push(p)}
const configs=[
[{id:0,r:0,c:0,kind:'start',d:['R']},{id:1,r:0,c:1,kind:'straight',d:['L','R']},{id:2,r:0,c:3,kind:'corner',d:['L','D']},{id:3,r:0,c:2,kind:'straight',d:['U','D']},{id:4,r:2,c:2,kind:'corner',d:['U','R']},{id:5,r:2,c:3,kind:'goal',d:['L']},{id:6,r:1,c:0,kind:'corner',d:['D','R']},{id:7,r:1,c:1,kind:'straight',d:['U','D']},{id:8,r:2,c:0,kind:'straight',d:['L','R']},{id:9,r:2,c:1,kind:'corner',d:['U','L']},{id:10,r:3,c:0,kind:'corner',d:['U','R']},{id:11,r:3,c:1,kind:'straight',d:['L','R']},{id:12,r:3,c:2,kind:'corner',d:['U','L']},{id:13,r:3,c:3,kind:'straight',d:['U','D']},{id:14,r:1,c:3,kind:'corner',d:['L','D']}],
[{id:0,r:0,c:0,kind:'start',d:['D']},{id:1,r:1,c:0,kind:'corner',d:['U','R']},{id:2,r:1,c:1,kind:'corner',d:['L','D']},{id:3,r:2,c:1,kind:'corner',d:['U','R']},{id:4,r:2,c:2,kind:'straight',d:['L','R']},{id:5,r:2,c:3,kind:'goal',d:['L']},{id:6,r:0,c:1,kind:'straight',d:['U','D']},{id:7,r:0,c:2,kind:'corner',d:['D','R']},{id:8,r:0,c:3,kind:'corner',d:['L','D']},{id:9,r:1,c:2,kind:'straight',d:['L','R']},{id:10,r:1,c:3,kind:'corner',d:['U','L']},{id:11,r:2,c:0,kind:'corner',d:['U','R']},{id:12,r:3,c:0,kind:'straight',d:['U','D']},{id:13,r:3,c:1,kind:'corner',d:['L','U']},{id:14,r:3,c:2,kind:'straight',d:['L','R']}]
];
const dirs={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},op={U:'D',D:'U',L:'R',R:'L'};let level=0,tiles=[],moves=0,animating=false,ball=null,ballPath=[],ballT=0,won=false;const ray=new T.Raycaster(),pointer=new T.Vector2();function xyz(r,c){return [c*cell-off,r*cell-off]}
function makeTile(t){const g=new T.Group();
const top=mesh(new T.BoxGeometry(cell-.075,.25,cell-.075),wood);top.position.y=.23;g.add(top);
const edging=mesh(new T.BoxGeometry(cell-.06,.09,cell-.06),side);edging.position.y=.095;g.add(edging);
const channelWidth=.57,edgeWidth=.72;
function strip(d,width,height,m,y){const horiz=d==='L'||d==='R',length=.98;const seg=mesh(new T.BoxGeometry(horiz?length:width,height,horiz?width:length),m);seg.position.set(d==='L'?-.48:d==='R'?.48:0,y,d==='U'?-.48:d==='D'?.48:0);g.add(seg)}
const centerLip=mesh(new T.CylinderGeometry(edgeWidth/2,edgeWidth/2,.024,40),bevel);centerLip.position.y=.366;g.add(centerLip);
for(const d of t.d)strip(d,edgeWidth,.025,bevel,.367);
const centerDark=mesh(new T.CylinderGeometry(channelWidth/2,channelWidth/2,.028,40),groove);centerDark.position.y=.39;g.add(centerDark);
for(const d of t.d)strip(d,channelWidth,.028,groove,.39);
const centerInside=mesh(new T.CylinderGeometry(.225,.225,.009,36),channel);centerInside.position.y=.408;g.add(centerInside);
for(const d of t.d)strip(d,.44,.009,channel,.411);
if(t.kind==='start'){const orb=mesh(new T.SphereGeometry(.245,32,24),material(0xf2eee2,.19,.42));orb.position.y=.57;g.add(orb);const glow=mesh(new T.TorusGeometry(.33,.035,10,40),gold);glow.rotation.x=Math.PI/2;glow.position.y=.428;g.add(glow)}
if(t.kind==='goal'){const ring=mesh(new T.TorusGeometry(.31,.07,12,40),goalMat);ring.rotation.x=Math.PI/2;ring.position.y=.435;g.add(ring)}
if(t.id===7||t.id===9){const key=new T.Group(),stem=mesh(new T.BoxGeometry(.37,.065,.075),gold);stem.position.x=.15;key.add(stem);const head=mesh(new T.TorusGeometry(.12,.04,8,20),gold);head.rotation.x=Math.PI/2;head.position.x=-.08;key.add(head);const tooth=mesh(new T.BoxGeometry(.055,.07,.12),gold);tooth.position.set(.3,0,.08);key.add(tooth);key.position.set(0,.465,0);g.add(key)}
if(t.id===14){const plate=mesh(new T.BoxGeometry(.9,.045,.94),steel);plate.position.y=.47;g.add(plate);for(const xx of [-.36,.36])for(const zz of [-.37,.37]){const rivet=mesh(new T.SphereGeometry(.045,10,8),steelDark);rivet.position.set(xx,.508,zz);g.add(rivet)}const lock=mesh(new T.BoxGeometry(.42,.09,.38),steelDark);lock.position.y=.54;g.add(lock);const shackle=mesh(new T.TorusGeometry(.18,.045,8,20,Math.PI),steel);shackle.rotation.x=Math.PI/2;shackle.position.set(0,.58,-.18);g.add(shackle)}
const [x,z]=xyz(t.r,t.c);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.userData.tile=t});scene.add(g);t.group=g;t.target=g.position.clone()}
function clear(){for(const t of tiles)scene.remove(t.group);tiles=[];if(ball){scene.remove(ball);ball=null}won=false;animating=false;ballPath=[];ballT=0}
function setup(){clear();moves=0;document.getElementById('moves').textContent='Քայլեր՝ 0';document.getElementById('level').textContent='Փուլ '+(level+1);document.getElementById('modal').classList.remove('show');document.getElementById('run').disabled=false;tiles=configs[level%configs.length].map(t=>({...t,d:[...t.d]}));for(const t of tiles)makeTile(t);document.getElementById('msg').textContent='Սահեցրու սալիկները դեպի դատարկ վանդակը'}
function find(r,c){return tiles.find(t=>t.r===r&&t.c===c)}
function move(t,dr,dc){if(animating||won||t.kind==='start'||t.kind==='goal')return;const choices=[[dr,dc]].filter(([a,b])=>Math.abs(a)+Math.abs(b)===1).map(([a,b])=>[t.r+a,t.c+b]).filter(([r,c])=>r>=0&&r<N&&c>=0&&c<N&&!find(r,c));if(!choices.length)return;const [r,c]=choices[0];t.r=r;t.c=c;const [x,z]=xyz(r,c);t.target.set(x,0,z);moves++;document.getElementById('moves').textContent='Քայլեր՝ '+moves}
let touchStart=null;renderer.domElement.addEventListener('pointerdown',e=>{if(animating||won)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const h=ray.intersectObjects(tiles.map(t=>t.group),true)[0];touchStart=h?.object.userData.tile?{tile:h.object.userData.tile,x:e.clientX,y:e.clientY}:null;if(touchStart)renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',e=>{if(!touchStart)return;const {tile,x,y}=touchStart;touchStart=null;const dx=e.clientX-x,dy=e.clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))<13){const options=[[0,1],[1,0],[0,-1],[-1,0]];for(const [dr,dc] of options){if(!find(tile.r+dr,tile.c+dc)){move(tile,dr,dc);break}}}else if(Math.abs(dx)>Math.abs(dy))move(tile,0,Math.sign(dx));else move(tile,Math.sign(dy),0)});renderer.domElement.addEventListener('pointercancel',()=>touchStart=null);
function route(){const start=tiles.find(t=>t.kind==='start'),goal=tiles.find(t=>t.kind==='goal');if(!start||!goal)return null;const q=[[start,[start]]],seen=new Set([start.id]);while(q.length){const [t,path]=q.shift();if(t===goal)return path;for(const d of t.d){const [dr,dc]=dirs[d],n=find(t.r+dr,t.c+dc);if(n&&n.d.includes(op[d])&&!seen.has(n.id)){seen.add(n.id);q.push([n,[...path,n]])}}}return null}
function launch(){if(animating||won)return;const path=route();if(!path){document.getElementById('msg').textContent='Ճանապարհը դեռ փակ է․ միացրու խողովակները';return}document.getElementById('msg').textContent='Գնդիկը շարժվում է…';ballPath=path;ballT=0;animating=true;ball=mesh(new T.SphereGeometry(.27,32,24),gold);scene.add(ball);const [x,z]=xyz(path[0].r,path[0].c);ball.position.set(x,.75,z);document.getElementById('run').disabled=true}
document.getElementById('run').onclick=launch;document.getElementById('reset').onclick=setup;document.getElementById('next').onclick=()=>{level++;setup()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.fov=34;const aspect=w/h;const targetWidth=8.5;const dist=Math.max(13.2,targetWidth/(2*Math.tan(camera.fov*Math.PI/360)*aspect));camera.position.set(0,dist,0.01);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(w,h,true)}addEventListener('resize',resize);resize();setup();let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;for(const t of tiles)t.group.position.lerp(t.target,Math.min(1,dt*13));if(animating&&ball&&ballPath.length){ballT+=dt*1.2;const seg=Math.min(Math.floor(ballT),ballPath.length-1),f=Math.min(1,ballT-seg),a=ballPath[seg],b=ballPath[Math.min(seg+1,ballPath.length-1)];const [ax,az]=xyz(a.r,a.c),[bx,bz]=xyz(b.r,b.c);const ease=f*f*(3-2*f);ball.position.set(ax+(bx-ax)*ease,.75+Math.sin(f*Math.PI)*.07,az+(bz-az)*ease);ball.rotation.z-=dt*4;if(ballT>=ballPath.length-1+.35){animating=false;won=true;document.getElementById('modal').classList.add('show')}}renderer.render(scene,camera)}requestAnimationFrame(loop);
</script></body></html>
