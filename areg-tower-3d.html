<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Փոքրիկ գյուտարար</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#dcecf1;color:#354650;overflow:hidden;touch-action:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;z-index:5;gap:10px}.wood{background:linear-gradient(#e9b977,#b77c46);border:3px solid #8c5830;border-radius:20px;color:#fff9e9;box-shadow:0 4px #80502d;padding:9px 14px;font-weight:900;text-shadow:0 2px #80502d}.title{font-size:clamp(15px,4.5vw,22px)}button{border:0;cursor:pointer;font:inherit}.stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#f7f7e9,#dceff0 70%,#bad5df);overflow:hidden}.stage:after{content:"";position:absolute;bottom:16%;height:2px;left:0;right:0;background:#adc8ca}.piece{position:absolute;touch-action:none;user-select:none;filter:drop-shadow(0 5px 2px #59778140);cursor:grab}.piece.selected{outline:3px dashed #d59b4e;border-radius:15px}.ramp{height:16px;border-radius:12px;background:linear-gradient(#f9ce8b,#d98d58);border:3px solid #ab6949;transform-origin:center}.tube{height:34px;border-radius:14px;background:linear-gradient(#b0e9e9,#75c3ce);border:4px solid #519da9;transform-origin:center}.bumper{width:55px;height:55px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffdf92,#e69d48);border:5px solid #c77d42}.ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff6c6,#f3a750 65%,#bf663a);border:2px solid #cf8743;z-index:4}.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;background:#fff9e8eF;border:3px solid #b7c5b4;border-radius:24px;padding:12px 8px;display:flex;justify-content:space-around;gap:6px;align-items:center;box-shadow:0 5px 18px #64858a35}.tool{width:57px;height:62px;border-radius:17px;background:#e5eee8;border:2px solid #adc9c3;font-size:25px;display:grid;place-items:center}.tool small{font-size:10px;font-weight:800}.actions{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 106px);width:100%;display:flex;justify-content:center;gap:12px}.action{background:#f4bc65;color:#684728;border-radius:20px;padding:11px 18px;font-weight:900;border:3px solid #d28d4e;box-shadow:0 4px #aa713e}.hint{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:12px;right:12px;text-align:center;font-weight:750;color:#68848b;font-size:14px;pointer-events:none}@media(max-height:650px){.dock{padding:6px}.tool{height:47px}.actions{bottom:calc(env(safe-area-inset-bottom) + 80px)}} </style></head><body>
<div class="stage" id="stage"></div><header class="top"><button class="wood" onclick="history.length>1?history.back():location.href='index.html'">←</button><div class="wood title">Փոքրիկ գյուտարար</div><div class="wood">⭐</div></header><div class="hint">Ընտրիր մասերը և կառուցիր գնդիկի ճանապարհ</div><div class="actions"><button class="action" id="play">▶ Փորձարկել</button><button class="action" id="reset">↻ Մաքրել</button></div><div class="dock"><button class="tool" data-type="ramp">🪵<small>Թեք</small></button><button class="tool" data-type="tube">🟦<small>Խողովակ</small></button><button class="tool" data-type="bumper">🟠<small>Անիվ</small></button><button class="tool" data-type="ball">🟡<small>Գնդիկ</small></button><button class="tool" id="rotate">↻<small>Պտտել</small></button><button class="tool" id="remove">✕<small>Ջնջել</small></button></div>
<script>
const stage=document.querySelector('#stage'),items=[];let chosen=null,playing=false,raf=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function add(type,x,y){const el=document.createElement('div');el.className='piece '+type;const w=type==='ramp'?120:type==='tube'?110:type==='ball'?30:55,h=type==='ramp'?16:type==='tube'?34:type==='ball'?30:55;const obj={el,type,x,y,w,h,angle:type==='ramp'?-15:0,vx:0,vy:0};items.push(obj);stage.append(el);render(obj);el.addEventListener('pointerdown',e=>{if(playing)return;e.preventDefault();chosen=obj;document.querySelectorAll('.piece').forEach(p=>p.classList.remove('selected'));el.classList.add('selected');el.setPointerCapture(e.pointerId);obj.dx=e.clientX-obj.x;obj.dy=e.clientY-obj.y});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId)||playing)return;obj.x=clamp(e.clientX-obj.dx,0,innerWidth-obj.w);obj.y=clamp(e.clientY-obj.dy,90,innerHeight-175-obj.h);render(obj)});return obj}
function render(o){o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';o.el.style.width=o.w+'px';o.el.style.height=o.h+'px';o.el.style.transform='rotate('+o.angle+'deg)'}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if(playing)return;const type=b.dataset.type;add(type,innerWidth*.5-(type==='ball'?15:55)+Math.random()*24,innerHeight*.4)});document.querySelector('#rotate').onclick=()=>{if(chosen&&!playing){chosen.angle=(chosen.angle+15)%360;render(chosen)}};document.querySelector('#remove').onclick=()=>{if(chosen&&!playing){chosen.el.remove();items.splice(items.indexOf(chosen),1);chosen=null}};document.querySelector('#reset').onclick=()=>{cancelAnimationFrame(raf);playing=false;items.splice(0).forEach(o=>o.el.remove());chosen=null;document.querySelector('#play').textContent='▶ Փորձարկել'};
document.querySelector('#play').onclick=()=>{if(playing){cancelAnimationFrame(raf);playing=false;document.querySelector('#play').textContent='▶ Փորձարկել';return}playing=true;document.querySelector('#play').textContent='Ⅱ Դադար';const balls=items.filter(o=>o.type==='ball');if(!balls.length)balls.push(add('ball',innerWidth*.45,innerHeight*.24));balls.forEach(o=>{o.vx=0;o.vy=0});let last=performance.now();function tick(now){const dt=Math.min((now-last)/16.67,2);last=now;for(const b of balls){b.vy+=.21*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;for(const r of items){if(r===b||r.type==='ball')continue;const cx=r.x+r.w/2,cy=r.y+r.h/2,rad=-r.angle*Math.PI/180,dx=b.x+15-cx,dy=b.y+15-cy;const lx=dx*Math.cos(rad)-dy*Math.sin(rad),ly=dx*Math.sin(rad)+dy*Math.cos(rad);if(Math.abs(lx)<r.w/2+9&&Math.abs(ly)<r.h/2+12&&b.vy>0){b.y=cy-15-r.h/2-10;b.vy=-Math.max(1.3,b.vy*.25);b.vx+=Math.sin(-rad)*1.2}}if(b.y>innerHeight-195){b.y=innerHeight-195;b.vy*=-.48;b.vx*=.96}if(b.x<0||b.x>innerWidth-30){b.vx*=-.8;b.x=clamp(b.x,0,innerWidth-30)}render(b)}if(playing)raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)};
add('ramp',innerWidth*.19,innerHeight*.35);add('ramp',innerWidth*.52,innerHeight*.51);add('ball',innerWidth*.24,innerHeight*.22);
</script></body></html>
