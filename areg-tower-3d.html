function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.fov=34;const aspect=w/h;const targetWidth=8.5;const dist=Math.max(13.2,targetWidth/(2*Math.tan(camera.fov*Math.PI/360)*aspect));camera.position.set(0,dist,0.01);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(w,h,true)}addEventListener('resize',resize);resize();setup();let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;warmAccent.intensity=.6+.16*Math.sin(now*.00055);for(const t of tiles){if(t.keySpinner)t.keySpinner.rotation.y=now*.00125+t.keySpinOffset;if(t.slide){const slide=t.slide;slide.elapsed=Math.min(slide.duration,slide.elapsed+dt);const p=slide.elapsed/slide.duration;const eased=p*p*(3-2*p);t.group.position.lerpVectors(slide.from,slide.to,eased);if(p>=1){t.group.position.copy(slide.to);t.slide=null}}}if(animating&&ball&&ballCurve){ballDistance=Math.min(ballLength,ballDistance+dt*3.8);const u=ballLength>0?ballDistance/ballLength:1;ball.position.copy(ballCurve.getPointAt(u));ball.rotation.z-=dt*8;if(u>=1){animating=false;won=true;document.getElementById('modal').classList.add('show')}}renderer.render(scene,camera)}requestAnimationFrame(loop);
</script></body></html>
