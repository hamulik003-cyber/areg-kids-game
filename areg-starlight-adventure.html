<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Արեգ․ Լույսի պարտեզը</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162b;font-family:system-ui;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;color:#ffe1a0;font-weight:900}#score{position:absolute;left:15px;top:12px;text-shadow:0 2px 5px #000}#health{position:absolute;right:15px;top:12px;color:#ff784d}#jump{position:absolute;right:18px;bottom:22px;border:2px solid #ffe1a0;background:linear-gradient(#ffdb85,#da853b);color:#633717;border-radius:50%;width:76px;height:76px;font-size:28px;pointer-events:auto;box-shadow:0 6px 18px #0007}#fire{position:absolute;right:105px;bottom:37px;width:61px;height:61px;border-radius:50%;border:3px solid #d2ffbd;background:linear-gradient(#72d978,#338c55);color:white;font-size:26px;font-weight:900;pointer-events:auto;box-shadow:0 5px 12px #0006;display:none}#stick{position:absolute;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;left:20px;bottom:22px;width:118px;height:118px;border-radius:50%;border:3px solid #d8e8ff88;background:radial-gradient(circle at 35% 30%,#b6dbff50,#16243e99 72%);box-shadow:inset 0 3px 15px #ffffff20,0 6px 20px #0007;pointer-events:auto;touch-action:none;display:grid;place-items:center}#knob{pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:57px;height:57px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff1bc,#d4a25d 65%,#9d633d);border:3px solid #fff4c9;box-shadow:0 4px 12px #0009;transform:translateX(0)}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0c1225bd;pointer-events:auto}#panel{max-width:90%;padding:24px 18px;text-align:center;border-radius:24px;border:2px solid #bd9b6c;background:linear-gradient(145deg,#343b62,#191e38);color:#fff;box-shadow:0 20px 50px #0008}h2{color:#ffdb87;font-size:clamp(21px,6vw,32px)}#start{font-size:22px;font-weight:900;border:0;border-radius:16px;background:linear-gradient(#ffe49c,#df9c4f);padding:15px 42px;color:#5c351a}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="score">✦ <span id="points">0 / 12</span></div><div id="health">♥ ♥ ♥</div><div id="stick" role="group" aria-label="Շարժման անալոգ"><div id="knob"></div></div><button id="jump" aria-label="Ցատկել">↑</button><button id="fire" aria-label="Լույսի ուժ">✦</button></div><div id="overlay"><div id="panel"><h2>✨ Արեգը և Լույսի պարտեզը</h2><p>Գիշերային պարտեզի լույսերը մարել են։ Հավաքիր 12 լուսաստղ, բացիր երեք լուսավոր դարպասները և արթնացրու Լուսնի ծառը։</p><button id="start">Սկսել արկածը ▶</button></div></div><script>
(()=>{'use strict';
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),btn=document.querySelector('#start'),points=document.querySelector('#points'),health=document.querySelector('#health');
let w=0,h=0,dpr=1,ground=0,heroY=0,vy=0,scroll=0,playerX=0,moveAxis=0,runDistance=0,facing=1,score=0,hp=3,playing=false,last=0,tt=0,stage=0,invincible=0,powerMode=0,win=false;
let stars=[],enemies=[],platforms=[],sparks=[],gateOpen=[false,false,false],soundOn=true,audioCtx=null,musicTimer=0,musicStep=0,prevX=0;
const LEVEL_END=3960, gatePositions=[1090,2200,3290], checkpointPositions=[0,1160,2280,3360];
const aregSprite=new Image();aregSprite.src='./a_high_resolution_cutout_png_style_illustration_on.png';
// Whole-pose atlas playback: never cut the approved photograph into limbs.
// Source rectangles contain complete characters; each pose has a calibrated head anchor.
const runAtlases=['stride-front-v1.png','stride-recovery-v1.png'].map(name=>{
 const image=new Image();image.src='./assets/areg-run/'+name;return image;
});
const runFrames=[
 {atlas:0,col:0,anchor:235,scale:.18,foot:500},
 {atlas:0,col:1,anchor:226,scale:.18,foot:500},
 {atlas:1,col:0,anchor:310,scale:.135,foot:660},
 {atlas:1,col:1,anchor:310,scale:.135,foot:660},
 {atlas:1,col:2,anchor:300,scale:.135,foot:660},
 {atlas:1,col:3,anchor:300,scale:.135,foot:660},
 {atlas:0,col:2,anchor:227,scale:.18,foot:500},
 {atlas:0,col:3,anchor:235,scale:.18,foot:500}
];
function drawAreg(){
 const grounded=playing&&vy===0;
 const ready=runAtlases.every(im=>im.complete&&im.naturalWidth>0);
 // Stride follows world distance, independent of refresh rate. A jump uses the
 // untouched approved full PNG; loading/error also falls back to that image.
 if(ready){
  // Keep the same face and hair artwork in the air as on the ground.
  // Freeze on one whole-body running pose while airborne; never swap to the separate original PNG.
  const index=grounded?(Math.abs(moveAxis)>.08?Math.floor(runDistance/8.5)%runFrames.length:1):1,pose=runFrames[index];
  const im=runAtlases[pose.atlas],cw=im.naturalWidth/4,ch=pose.atlas===0?im.naturalHeight/2:im.naturalHeight;
  g.drawImage(im,pose.col*cw,0,cw,ch,-pose.anchor*pose.scale,36-pose.foot*pose.scale,cw*pose.scale,ch*pose.scale);
  c.dataset.aregPose=grounded?String(index):'jump-same-atlas';
 }else if(aregSprite.complete&&aregSprite.naturalWidth>0){
  g.drawImage(aregSprite,-35,-54,70,90);
  c.dataset.aregPose=grounded?'fallback':'air-or-idle';
 }
}
c.dataset.aregAnimation='whole-pose-v1';

function resize(){dpr=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);const old=ground;ground=h*.77;if(playing)heroY+=ground-old;else heroY=ground-36}window.addEventListener('resize',resize);resize();
function tone(freq,duration=.14,type='sine',volume=.065,slide=1){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t+duration);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(volume,t+.018);v.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(v);v.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.025)}catch(e){}}
function sound(k){const a={jump:[420,.18,'triangle',.065,1.6],star:[840,.2,'sine',.09,1.6],hit:[170,.25,'sawtooth',.045,.5],bounce:[290,.16,'triangle',.07,1.8],gate:[500,.45,'sine',.08,2],win:[620,.7,'triangle',.09,1.9],power:[550,.32,'sine',.09,1.8],step:[180,.08,'triangle',.025,1.1]}[k];if(a)tone(...a)}
const melody=[392,494,587,659,587,494,440,523,659,784,659,523,494,392,440,523];
function music(dt){musicTimer+=dt;if(musicTimer>.29){musicTimer=0;if(playing){tone(melody[musicStep++%melody.length],.21,'triangle',.018);if(musicStep%4===1)tone(196,.28,'sine',.017)}}}
function makeWorld(){stars=[];enemies=[];platforms=[];gateOpen=[false,false,false];for(let i=0;i<3;i++){const base=i*1100;const xs=[base+170,base+340,base+520,base+710];xs.forEach((x,j)=>stars.push({x,y:ground-(j%2?120:75),taken:false}));platforms.push({x:base+295,y:ground-95,len:155});platforms.push({x:base+665,y:ground-108,len:135});enemies.push({x:base+590,start:base+535,end:base+640,dir:1,alive:true});if(i>0)enemies.push({x:base+860,start:base+810,end:base+925,dir:-1,alive:true})}for(let i=0;i<3;i++)platforms.push({x:i*1100+890,y:ground-68,len:100});stars.push({x:3600,y:ground-110,taken:false},{x:3730,y:ground-80,taken:false},{x:3820,y:ground-110,taken:false});}
function reset(){score=0;hp=3;stage=0;scroll=0;playerX=70;runDistance=0;facing=1;vy=0;heroY=ground-36;tt=0;invincible=0;powerMode=0;win=false;playing=true;musicTimer=0;musicStep=0;makeWorld();releaseStick();points.textContent='0 / 12';health.textContent='♥ ♥ ♥';overlay.style.display='none';document.querySelector('#fire').style.display='none';sound('gate')}
function jump(){if(playing&&Math.abs(vy)<1){vy=-520;sound('jump')}}
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickPointer=null;
function setStick(clientX){const rect=stick.getBoundingClientRect();const delta=clientX-(rect.left+rect.width/2);const deadzone=9,range=39;const magnitude=Math.min(1,Math.max(0,(Math.abs(delta)-deadzone)/range));moveAxis=Math.sign(delta)*magnitude;knob.style.transform='translateX('+Math.round(Math.sign(delta)*magnitude*34)+'px)';}
function releaseStick(e){if(stickPointer!==null&&(!e||e.pointerId===stickPointer)){stickPointer=null;moveAxis=0;knob.style.transform='translateX(0px)';}}
stick.addEventListener('pointerdown',e=>{sound('land');e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e.clientX)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();setStick(e.clientX)}});
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);window.addEventListener('blur',()=>releaseStick());

document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());btn.addEventListener('click',()=>reset());document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();if(powerMode>0){powerMode=0;invincible=3;document.querySelector('#fire').style.display='none';sound('power');for(const enemy of enemies)if(Math.abs(enemy.x-playerX)<145)enemy.alive=false}});
function reward(x,y){score++;points.textContent=score+' / 12';sound('star');for(let j=0;j<12;j++)sparks.push({x:x-scroll,y,vx:(Math.random()-.5)*140,vy:-40-Math.random()*110,life:1});}
function finish(success){playing=false;win=success;overlay.style.display='grid';document.querySelector('#panel h2').textContent=success?'🏆 Լույսը վերադարձավ պարտեզ':'✨ Փորձենք նորից';document.querySelector('#panel p').textContent=success?'Արեգը հավաքեց '+score+' լուսաստղ և արթնացրեց Լուսնի ծառը։':'Հավաքեցիր '+score+' լուսաստղ։ Հաջորդ անգամ կհասնես Լուսնի ծառին։';btn.textContent=success?'Նորից խաղալ ▶':'Կրկին փորձել ▶';sound(success?'win':'hit')}
function hurt(){if(invincible>0)return;if(powerMode>0){powerMode=0;document.querySelector('#fire').style.display='none'}else hp--;health.textContent=Array(Math.max(0,hp)).fill('♥').join(' ');sound('hit');invincible=1.7;vy=-230;if(hp<=0){finish(false);return}playerX=checkpointPositions[stage]+75;heroY=ground-90;vy=0}
function update(dt){tt+=dt;music(dt);if(!playing)return;invincible=Math.max(0,invincible-dt);prevX=playerX;playerX=Math.max(24,Math.min(LEVEL_END,playerX+moveAxis*205*dt));if(Math.abs(moveAxis)>.08){facing=Math.sign(moveAxis);runDistance+=Math.abs(playerX-prevX)}const oldY=heroY;vy+=1130*dt;heroY+=vy*dt;let surface=ground-36;for(const p of platforms){if(playerX>p.x-22&&playerX<p.x+p.len+22&&oldY+36<=p.y+12&&heroY+36>=p.y&&vy>=0)surface=Math.min(surface,p.y-36)}if(heroY>=surface&&vy>=0){heroY=surface;vy=0}for(const enemy of enemies){if(!enemy.alive)continue;enemy.x+=enemy.dir*43*dt;if(enemy.x<enemy.start||enemy.x>enemy.end)enemy.dir*=-1;if(Math.abs(playerX-enemy.x)<27&&Math.abs(heroY-(ground-28))<43){if(vy>45&&oldY<ground-53){enemy.alive=false;vy=-325;sound('bounce')}else hurt()}}
for(const star of stars){if(!star.taken&&Math.abs(playerX-star.x)<33&&Math.abs(heroY-star.y)<56){star.taken=true;reward(star.x,star.y)}}
for(let i=0;i<3;i++){const gate=gatePositions[i];if(!gateOpen[i]&&playerX>gate-40&&playerX<gate+22){const gathered=stars.filter(s=>s.taken&&s.x<gate).length;if(gathered>=4*(i+1)){gateOpen[i]=true;stage=i+1;powerMode=1;document.querySelector('#fire').style.display='block';sound('gate')}else playerX=gate-40}}
if(playerX>LEVEL_END-75){if(score>=12)finish(true);else playerX=LEVEL_END-75}
if(heroY>h+80)hurt();scroll=Math.max(0,playerX-w*.26);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt*1.5}sparks=sparks.filter(p=>p.life>0)}
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function rect(x,y,wid,hei,color){g.fillStyle=color;g.fillRect(x,y,wid,hei)}
function draw(){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#071b1c');sky.addColorStop(.65,'#235a48');sky.addColorStop(1,'#70a68b');g.fillStyle=sky;g.fillRect(0,0,w,h);for(let i=0;i<42;i++){const x=((i*149+40-scroll*.13)%(w+70)+w+70)%(w+70),y=18+(i*47)%(Math.max(60,ground-80));circle(x,y,1.4+Math.sin(tt*2+i)*.55,'#f5e9b8')}
for(let layer=0;layer<3;layer++){const speed=[.13,.3,.55][layer],color=['#102b28','#194237','#295e46'][layer];for(let i=Math.floor(scroll*speed/150)-2;i<Math.ceil((scroll*speed+w)/150)+2;i++){const x=i*150-scroll*speed,tall=ground*(.48+.15*Math.sin(i*2+layer));rect(x-13,ground-tall,26,tall,color);circle(x,ground-tall,44+layer*5,color);circle(x-36,ground-tall+30,32,color);circle(x+34,ground-tall+16,38,color)}}for(let i=Math.floor(scroll/260)-1;i<Math.ceil((scroll+w)/260)+1;i++){const x=i*260-scroll;rect(x-12,-15,24,ground*.35,'#153325');for(let j=0;j<4;j++){g.strokeStyle='#27543b';g.lineWidth=5;g.beginPath();g.moveTo(x+(j-2)*17,0);g.quadraticCurveTo(x+(j-2)*25,ground*.19,x+(j-2)*16+Math.sin(tt+j)*6,ground*.32);g.stroke()}}rect(0,ground,w,h-ground,'#263b2d');rect(0,ground,w,14,'#5e9259');for(let i=Math.floor(scroll/42)-1;i<Math.ceil((scroll+w)/42)+1;i++){const x=i*42-scroll;rect(x,ground+18,2,h-ground-18,'#405f42');circle(x+21,ground+27,2,'#608b58')}
for(const p of platforms){const x=p.x-scroll;if(x+p.len<0||x>w)continue;g.fillStyle='#5c4635';g.beginPath();g.roundRect(x,p.y,p.len,18,7);g.fill();rect(x+5,p.y+2,p.len-10,5,'#70a264');for(let j=14;j<p.len;j+=30)circle(x+j,p.y+9,2,'#9dbb76')}
for(let i=0;i<3;i++){const x=gatePositions[i]-scroll;if(x< -60||x>w+60)continue;rect(x-13,ground-127,26,127,gateOpen[i]?'#68c7a8':'#e5a873');circle(x,ground-138,19,gateOpen[i]?'#d8fff0':'#ffde9b');g.fillStyle='#24395a';g.textAlign='center';g.font='bold 16px system-ui';g.fillText(gateOpen[i]?'✓':String((i+1)*4),x,ground-132)}
for(const star of stars){if(star.taken)continue;const x=star.x-scroll;if(x< -40||x>w+40)continue;g.save();g.translate(x,star.y+Math.sin(tt*3+x)*4);g.rotate(tt*.35);g.fillStyle='#ffe28b';g.beginPath();for(let k=0;k<10;k++){const r=k%2?7:16,a=k*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}
for(const enemy of enemies){if(!enemy.alive)continue;const x=enemy.x-scroll;if(x< -40||x>w+40)continue;circle(x,ground-23,22,'#786047');circle(x-8,ground-27,5,'#f4ebf9');circle(x+8,ground-27,5,'#f4ebf9');circle(x-8,ground-27,2,'#2d2947');circle(x+8,ground-27,2,'#2d2947');circle(x,ground-9,8,'#a7906b')}
const treeX=LEVEL_END-scroll;if(treeX>-160&&treeX<w+160){rect(treeX-12,ground-190,24,190,'#896d8e');for(let i=0;i<7;i++){const a=i*Math.PI*2/7;circle(treeX+Math.cos(a)*53,ground-205+Math.sin(a)*35,38,score>=12?'#f1cf90':'#8e91bb')}circle(treeX,ground-220,24,score>=12?'#fff1bb':'#bdc2d8')}
for(const p of sparks){g.globalAlpha=Math.max(0,p.life);circle(p.x,p.y,2.5,'#ffe6a2')}g.globalAlpha=1;
if(invincible<=0||Math.floor(tt*12)%2===0){g.save();g.translate(playerX-scroll,heroY);if(facing<0)g.scale(-1,1);drawAreg();g.restore()}
g.textAlign='center';g.fillStyle='#f9e9c2';g.font='bold 14px system-ui';g.fillText(['Պարտեզի մուտք','Լուսե կամուրջ','Աստղային արահետ','Լուսնի ծառ'][stage],w*.5,27)}
function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
