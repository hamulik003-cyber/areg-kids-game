<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Աստղերի կիրճ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162b;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;color:#ffe1a0;font-weight:900}#score{position:absolute;left:15px;top:12px;text-shadow:0 2px 5px #000}#health{position:absolute;right:15px;top:12px;color:#ff784d}#jump{position:absolute;right:18px;bottom:22px;border:2px solid #ffe1a0;background:linear-gradient(#ffdb85,#da853b);color:#633717;border-radius:50%;width:76px;height:76px;font-size:28px;pointer-events:auto;box-shadow:0 6px 18px #0007}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0c1225bd;pointer-events:auto}#panel{max-width:90%;padding:24px 18px;text-align:center;border-radius:24px;border:2px solid #bd9b6c;background:linear-gradient(145deg,#343b62,#191e38);color:#fff;box-shadow:0 20px 50px #0008}h2{color:#ffdb87;font-size:clamp(21px,6vw,32px)}#start{font-size:22px;font-weight:900;border:0;border-radius:16px;background:linear-gradient(#ffe49c,#df9c4f);padding:15px 42px;color:#5c351a}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="score">⭐ <span id="points">0</span></div><div id="health">♥ ♥ ♥</div><button id="jump" aria-label="Ցատկել">↑</button></div><div id="overlay"><div id="panel"><h2>✦ Աստղերի կիրճ ✦</h2><p>Հպիր էկրանին՝ ցատկելու և աստղերը հավաքելու համար։</p><button id="start">Խաղալ ▶</button></div></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),btn=document.querySelector('#start'),points=document.querySelector('#points'),health=document.querySelector('#health');let w=0,h=0,dpr=1,ground=0,heroY=0,vy=0,scroll=0,score=0,hp=3,playing=false,paused=false,last=0,tt=0,platforms=[],stars=[],sparks=[];const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);ground=h*.68;if(!playing)heroY=ground-36}window.addEventListener('resize',resize);resize();function reset(){score=0;hp=3;scroll=0;tt=0;vy=0;heroY=ground-36;platforms=[];stars=[];sparks=[];let x=-60;for(let i=0;i<75;i++){const len=i===0?Math.max(450,w):rand(175,310),gap=i===0?0:rand(58,115);x+=gap;const y=ground+rand(-12,12);platforms.push({x,len,y});for(let j=0;j<Math.floor(len/115);j++)stars.push({x:x+60+j*110,y:y-rand(76,120),taken:false});x+=len}playing=true;overlay.style.display='none';points.textContent='0';health.textContent='♥ ♥ ♥'}function jump(){if(!playing)return;if(Math.abs(vy)<.01)vy=-Math.min(590,h*.87)}btn.addEventListener('click',reset);document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});function glow(x,y,r,color){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'transparent');g.fillStyle=grad;g.fillRect(x-r,y-r,2*r,2*r)}function polygon(pts,col){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}function draw(){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0b1329');sky.addColorStop(.5,'#293250');sky.addColorStop(1,'#d97654');g.fillStyle=sky;g.fillRect(0,0,w,h);glow(w*.6,h*.7,w*.85,'#ec79547a');for(let i=0;i<80;i++){const x=(i*97+31-scroll*.045)%(w+40),y=(i*53)%(h*.52);g.fillStyle=i%4===0?'#8fb9ed':'#526ba4';g.globalAlpha=.25+.35*Math.sin(tt+i)**2;g.fillRect(x,y,2,2)}g.globalAlpha=1;for(let depth=0;depth<3;depth++){const base=h*(.49+depth*.07);for(let i=-1;i<9;i++){const x=i*145-(scroll*(.06+depth*.09)%145);polygon([[x-100,h],[x+80,base-55-(i%3)*28],[x+190,h]],['#2d3458','#373a5a','#5a4562'][depth])}}const lava=g.createLinearGradient(0,ground,0,h);lava.addColorStop(0,'#f6a65a');lava.addColorStop(.7,'#ffbd58');lava.addColorStop(1,'#d35e37');g.fillStyle=lava;g.fillRect(0,ground,w,h-ground);for(let i=0;i<28;i++){const x=(i*83-scroll*.13)%(w+80),y=ground+((i*37)%(h-ground));glow(x,y,rand(9,20),'#fff1a855')}for(const p of platforms){const x=p.x-scroll;if(x+p.len<0||x>w)continue;g.fillStyle='#1d2238';g.fillRect(x,p.y+13,p.len,17);g.fillStyle='#6e779e';g.fillRect(x,p.y,p.len,14);g.fillStyle='#a5a5bc';g.fillRect(x,p.y,p.len,4);for(let k=0;k<p.len/40;k++){g.strokeStyle='#30364e';g.beginPath();g.moveTo(x+k*40,p.y+3);g.lineTo(x+k*40+4,p.y+14);g.stroke()}}for(const s of stars){if(s.taken)continue;const x=s.x-scroll;if(x<0||x>w)continue;const y=s.y+Math.sin(tt*3+s.x)*5;glow(x,y,25,'#ffe89988');polygon([[x,y-12],[x+4,y-4],[x+12,y],[x+4,y+4],[x,y+12],[x-4,y+4],[x-12,y],[x-4,y-4]],'#fff2aa')}for(const p of sparks){g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}g.globalAlpha=1;const x=w*.28,y=heroY;glow(x,y+16,49,'#ffa65a40');g.save();g.translate(x,y);g.rotate(Math.max(-.12,Math.min(.22,vy/2500)));g.fillStyle='#395c57';g.beginPath();g.ellipse(0,17,24,25,0,0,Math.PI*2);g.fill();g.fillStyle='#d58b57';g.beginPath();g.ellipse(0,-12,24,22,0,0,Math.PI*2);g.fill();polygon([[-20,-24],[-25,-47],[-5,-31]],'#e4c9a0');polygon([[8,-32],[24,-47],[20,-18]],'#e4c9a0');g.fillStyle='#fff5d6';g.beginPath();g.arc(-8,-13,5,0,7);g.arc(9,-13,5,0,7);g.fill();g.fillStyle='#262b3e';g.beginPath();g.arc(-8,-13,2,0,7);g.arc(9,-13,2,0,7);g.fill();g.fillStyle='#9a4e39';g.fillRect(-5,0,10,4);g.restore()}function update(dt){if(!playing)return;tt+=dt;scroll+=dt*Math.min(280,135+score*3);const worldX=scroll+w*.28;vy+=1150*dt;const before=heroY+36;heroY+=vy*dt;for(const p of platforms){if(worldX>p.x+5&&worldX<p.x+p.len-5&&vy>=0&&before<=p.y+12&&heroY+36>=p.y){heroY=p.y-36;vy=0;break}}for(const s of stars){if(!s.taken&&Math.abs(s.x-worldX)<31&&Math.abs(s.y-heroY)<65){s.taken=true;score++;points.textContent=score;for(let i=0;i<14;i++)sparks.push({x:w*.28,y:heroY-15,vx:rand(-90,90),vy:rand(-110,20),life:1,r:rand(1,4),color:'#ffe69b'})}}for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt*1.5}sparks=sparks.filter(p=>p.life>0);if(heroY>h+80){hp--;health.textContent=Array(hp).fill('♥').join(' ');if(hp<=0){playing=false;overlay.style.display='grid';document.querySelector('#panel h2').textContent='⭐ Հավաքեցիր '+score+' աստղ';btn.textContent='Կրկին խաղալ ▶'}else{heroY=ground-150;vy=0;scroll=Math.max(0,scroll-190)}}}function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
