<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Աստղերի կիրճ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162b;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;color:#ffe1a0;font-weight:900}#score{position:absolute;left:15px;top:12px;text-shadow:0 2px 5px #000}#health{position:absolute;right:15px;top:12px;color:#ff784d}#jump{position:absolute;right:18px;bottom:22px;border:2px solid #ffe1a0;background:linear-gradient(#ffdb85,#da853b);color:#633717;border-radius:50%;width:76px;height:76px;font-size:28px;pointer-events:auto;box-shadow:0 6px 18px #0007}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0c1225bd;pointer-events:auto}#panel{max-width:90%;padding:24px 18px;text-align:center;border-radius:24px;border:2px solid #bd9b6c;background:linear-gradient(145deg,#343b62,#191e38);color:#fff;box-shadow:0 20px 50px #0008}h2{color:#ffdb87;font-size:clamp(21px,6vw,32px)}#start{font-size:22px;font-weight:900;border:0;border-radius:16px;background:linear-gradient(#ffe49c,#df9c4f);padding:15px 42px;color:#5c351a}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="score">⭐ <span id="points">0</span></div><div id="health">♥ ♥ ♥</div><button id="jump" aria-label="Ցատկել">↑</button></div><div id="overlay"><div id="panel"><h2>✦ Աստղերի կիրճ ✦</h2><p>Հպիր էկրանին՝ ցատկելու և աստղերը հավաքելու համար։</p><button id="start">Խաղալ ▶</button></div></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),btn=document.querySelector('#start'),points=document.querySelector('#points'),health=document.querySelector('#health');let w=0,h=0,dpr=1,ground=0,heroY=0,vy=0,scroll=0,score=0,hp=3,playing=false,paused=false,last=0,tt=0,platforms=[],stars=[],sparks=[];const aregSprite=new Image();aregSprite.src='./a_high_resolution_cutout_png_style_illustration_on.png';const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);ground=h*.68;if(!playing)heroY=ground-36}window.addEventListener('resize',resize);resize();function reset(){score=0;hp=3;scroll=0;tt=0;vy=0;heroY=ground-36;platforms=[];stars=[];sparks=[];let x=-60;for(let i=0;i<75;i++){const len=i===0?Math.max(450,w):rand(175,310),gap=i===0?0:rand(58,115);x+=gap;const y=ground+rand(-12,12);platforms.push({x,len,y});for(let j=0;j<Math.floor(len/115);j++)stars.push({x:x+60+j*110,y:y-rand(76,120),taken:false});x+=len}playing=true;overlay.style.display='none';points.textContent='0';health.textContent='♥ ♥ ♥'}function jump(){if(!playing)return;if(Math.abs(vy)<.01)vy=-Math.min(590,h*.87)}btn.addEventListener('click',reset);document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});function glow(x,y,r,color){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'transparent');g.fillStyle=grad;g.fillRect(x-r,y-r,2*r,2*r)}function polygon(pts,col){g.fillStyle=col;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill()}function draw(){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0b1329');sky.addColorStop(.5,'#293250');sky.addColorStop(1,'#d97654');g.fillStyle=sky;g.fillRect(0,0,w,h);glow(w*.6,h*.7,w*.85,'#ec79547a');for(let i=0;i<80;i++){const x=(i*97+31-scroll*.045)%(w+40),y=(i*53)%(h*.52);g.fillStyle=i%4===0?'#8fb9ed':'#526ba4';g.globalAlpha=.25+.35*Math.sin(tt+i)**2;g.fillRect(x,y,2,2)}g.globalAlpha=1;for(let depth=0;depth<3;depth++){const base=h*(.43+depth*.075),spacing=145;for(let i=-2;i<Math.ceil(w/spacing)+3;i++){const x=i*spacing-(scroll*(.055+depth*.085)%spacing);polygon([[x-130,h],[x+32,base-95-(i%3)*27],[x+175,h]],['#293354','#3c3a62','#654664'][depth]);polygon([[x-9,base+9],[x+32,base-95-(i%3)*27],[x+76,base+8]],['#343d68','#4c476d','#775473'][depth])}}drawCastle();function drawCastle(){const cx=w*.69-(scroll*.12% (w+350)),cy=h*.49,scale=Math.max(.8,Math.min(1.3,w/440));g.save();g.translate(cx,cy);g.scale(scale,scale);glow(0,0,210,'#ff9a4a45');g.fillStyle='#282b4b';for(let i=-2;i<4;i++){const xx=i*42,ht=72+(i%3)*35;g.fillRect(xx,-ht,39,ht+40);polygon([[xx-7,-ht],[xx+20,-ht-32],[xx+46,-ht]],'#202844');for(let j=0;j<3;j++){g.fillStyle='#f6a44d';g.fillRect(xx+12,-ht+22+j*24,7,13)}}g.fillStyle='#282b4b';g.fillRect(-115,-16,230,33);g.restore()}
function waterfall(x,y,height){glow(x,y+height*.4,36,'#ffcf7160');const grad=g.createLinearGradient(x-14,y,x+17,y);grad.addColorStop(0,'#b64f31');grad.addColorStop(.4,'#ffdb76');grad.addColorStop(.7,'#fff3a0');grad.addColorStop(1,'#b85b36');g.fillStyle=grad;g.beginPath();g.moveTo(x-17,y);g.bezierCurveTo(x-24,y+height*.4,x-5,y+height*.75,x-25,y+height);g.lineTo(x+27,y+height);g.bezierCurveTo(x+7,y+height*.65,x+25,y+height*.3,x+17,y);g.fill()}
const lava=g.createLinearGradient(0,ground,0,h);lava.addColorStop(0,'#f6a65a');lava.addColorStop(.7,'#ffbd58');lava.addColorStop(1,'#d35e37');g.fillStyle=lava;g.fillRect(0,ground,w,h-ground);for(let i=0;i<28;i++){const x=(i*83-scroll*.13)%(w+80),y=ground+((i*37)%(h-ground));glow(x,y,10+(i%4)*4,'#fff1a855')}waterfall(w*.72-scroll*.06%(w+120),ground-26,h*.36);for(const p of platforms){const x=p.x-scroll;if(x+p.len<0||x>w)continue;glow(x+p.len*.5,p.y+17,p.len*.8,'#ff9d4940');const rock=g.createLinearGradient(0,p.y,0,p.y+47);rock.addColorStop(0,'#7885a7');rock.addColorStop(.28,'#535a7e');rock.addColorStop(1,'#29283d');g.fillStyle=rock;g.beginPath();g.moveTo(x,p.y+4);g.lineTo(x+p.len,p.y+4);g.lineTo(x+p.len-9,p.y+31);g.lineTo(x+p.len*.77,p.y+48);g.lineTo(x+20,p.y+39);g.closePath();g.fill();for(let k=0;k<Math.ceil(p.len/39);k++){const xx=x+k*39;g.strokeStyle='#252b44';g.lineWidth=2;g.beginPath();g.moveTo(xx,p.y+6);g.lineTo(xx+4,p.y+26);g.lineTo(xx+10,p.y+29);g.stroke();g.fillStyle='#8e96b4';g.fillRect(xx+3,p.y+7,Math.min(33,p.len-k*39-5),2)}g.fillStyle='#4c7041';g.fillRect(x,p.y,p.len,7);g.fillStyle='#83a15b';for(let k=0;k<p.len/13;k++){g.beginPath();g.ellipse(x+k*13,p.y+1,9,3,0,0,7);g.fill()}if(p.len>220){g.fillStyle='#d7a46b';g.fillRect(x+28,p.y-47,6,47);glow(x+31,p.y-53,52,'#ffb34b80');g.fillStyle='#ffc77b';g.beginPath();g.ellipse(x+31,p.y-53,8,13,0,0,7);g.fill()}}for(const s of stars){if(s.taken)continue;const x=s.x-scroll;if(x<0||x>w)continue;const y=s.y+Math.sin(tt*3+s.x)*5;glow(x,y,37,'#ffe89988');polygon([[x,y-12],[x+4,y-4],[x+12,y],[x+4,y+4],[x,y+12],[x-4,y+4],[x-12,y],[x-4,y-4]],'#fff2aa')}for(const p of sparks){g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}g.globalAlpha=1;const x=w*.28,y=heroY;glow(x,y+15,49,'#ffa65a40');g.save();g.translate(x,y);g.rotate(Math.max(-.11,Math.min(.2,vy/2800)));const bob=Math.abs(vy)<1?Math.sin(tt*15)*2:0;if(aregSprite.complete&&aregSprite.naturalWidth>0)g.drawImage(aregSprite,-35,-66+bob,70,90);g.restore()}function update(dt){if(!playing)return;tt+=dt;scroll+=dt*Math.min(280,135+score*3);const worldX=scroll+w*.28;vy+=1150*dt;const before=heroY+36;heroY+=vy*dt;for(const p of platforms){if(worldX>p.x+5&&worldX<p.x+p.len-5&&vy>=0&&before<=p.y+12&&heroY+36>=p.y){heroY=p.y-36;vy=0;break}}for(const s of stars){if(!s.taken&&Math.abs(s.x-worldX)<31&&Math.abs(s.y-heroY)<65){s.taken=true;score++;points.textContent=score;for(let i=0;i<14;i++)sparks.push({x:w*.28,y:heroY-15,vx:rand(-90,90),vy:rand(-110,20),life:1,r:rand(1,4),color:'#ffe69b'})}}for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt*1.5}sparks=sparks.filter(p=>p.life>0);if(heroY>h+80){hp--;health.textContent=Array(hp).fill('♥').join(' ');if(hp<=0){playing=false;overlay.style.display='grid';document.querySelector('#panel h2').textContent='⭐ Հավաքեցիր '+score+' աստղ';btn.textContent='Կրկին խաղալ ▶'}else{heroY=ground-150;vy=0;scroll=Math.max(0,scroll-190)}}}function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
