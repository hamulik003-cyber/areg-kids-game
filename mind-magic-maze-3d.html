<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Կախարդական լաբիրինթոս 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}body{background:#183951;color:#fff}#app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:8px}#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:850}#hud span{border:3px solid #b9854b;background:linear-gradient(#ffefcb,#d5a16c);border-radius:14px;padding:9px;color:#754724}#hud b{text-align:center;font-size:14px}#view{flex:1;min-height:240px;position:relative;overflow:hidden;border:5px solid #cb9860;border-radius:24px;background:radial-gradient(#87b9cb,#305f80 78%)}canvas{width:100%;height:100%;display:block;touch-action:none}#tip{position:absolute;left:10px;right:10px;top:12px;text-align:center;font-weight:800;text-shadow:0 2px 5px #000a;pointer-events:none}#buttons{display:flex;gap:8px}button{font:900 14px system-ui;cursor:pointer}#buttons button{flex:1;padding:12px 4px;background:linear-gradient(#fff1d0,#d6a26c);color:#744523;border:3px solid #ffe0aa;border-bottom:5px solid #a46d3d;border-radius:14px}#buttons #start{background:linear-gradient(#baff99,#3ebc5e);color:#1d6034;border-color:#d7ffbd;border-bottom-color:#197d3d}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#102c43d0;padding:20px}#overlay.show{display:flex}.modal{width:100%;max-width:330px;background:linear-gradient(#fff0cf,#e1b078);color:#704422;border:7px solid #a6703d;border-radius:25px;padding:25px;text-align:center}.award{font-size:75px}.modal h2{margin:8px 0 18px}#next{border:3px solid #d6ffba;border-radius:15px;background:linear-gradient(#baff98,#3bbc61);color:#1a5c31;padding:12px 25px}@media(max-height:650px){#app{gap:4px}#buttons button{padding:6px 3px}#hud span{padding:5px}}</style></head><body><div id="app"><div id="hud"><span id="phase">Փուլ 1 / 5</span><b>Կախարդական լաբիրինթոս 3D</b><span id="time">00:00</span></div><div id="view"><div id="tip">Մատով քաշիր դաշտը՝ գնդակը գլորելու համար</div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="message">Գնդակը հասավ աստղին</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="buttons"><button id="reset">⟳ Նորից</button><button id="hint">💡 Հուշում</button><button id="start">▶ Սկսել</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset=0;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeafaff,0x365a71,2.5));const sun=new THREE.DirectionalLight(0xffe5b9,3.5);sun.position.set(-5,8,10);scene.add(sun);const fill=new THREE.DirectionalLight(0x91e6ff,1.6);fill.position.set(5,3,-5);scene.add(fill);
const root=new THREE.Group();scene.add(root);const wood=new THREE.MeshStandardMaterial({color:0xa57549,roughness:.66}),wallMat=new THREE.MeshStandardMaterial({color:0xf0c88c,metalness:.17,roughness:.42}),floorMat=new THREE.MeshStandardMaterial({color:0x5bafbf,metalness:.15,roughness:.4}),gold=new THREE.MeshStandardMaterial({color:0xffd57d,metalness:.65,roughness:.25}),ballMat=new THREE.MeshPhysicalMaterial({color:0xff688d,metalness:.12,roughness:.09,clearcoat:1});
const board=new THREE.Mesh(new THREE.BoxGeometry(9.3,9.3,.55),wood);board.position.z=-.35;root.add(board);const field=new THREE.Mesh(new THREE.BoxGeometry(8.7,8.7,.14),floorMat);field.position.z=-.04;root.add(field);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.24,30,24),ballMat);ball.position.z=.35;root.add(ball);const goal=new THREE.Group();root.add(goal);const torus=new THREE.Mesh(new THREE.TorusGeometry(.32,.095,12,40),gold);goal.add(torus);const star=new THREE.Mesh(new THREE.OctahedronGeometry(.2,0),gold);star.position.z=.1;goal.add(star);
const cell=1.08,N=7,origin=-3.24;let stage=0,grid=[],walls=[],pos=new THREE.Vector2(),vel=new THREE.Vector2(),tilt=new THREE.Vector2(),running=false,won=false,elapsed=0,last=0,drag=false,down=null,startedAt=0,solution=[];
const stages=[17,21,26,32,38];function world(r,c){return new THREE.Vector2(origin+c*cell,origin+(N-1-r)*cell)}
function makeMaze(){grid=Array.from({length:N},()=>Array.from({length:N},()=>[1,1,1,1]));const seen=Array.from({length:N},()=>Array(N).fill(false));const stack=[[0,0]];seen[0][0]=true;const d=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];let seed=stage*101+31;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};while(stack.length){const [r,c]=stack[stack.length-1],options=d.filter(([dr,dc])=>{const rr=r+dr,cc=c+dc;return rr>=0&&rr<N&&cc>=0&&cc<N&&!seen[rr][cc]});if(!options.length){stack.pop();continue}const [dr,dc,a,b]=options[Math.floor(rand()*options.length)],rr=r+dr,cc=c+dc;grid[r][c][a]=0;grid[rr][cc][b]=0;seen[rr][cc]=true;stack.push([rr,cc])}solution=stack;for(let i=0;i<Math.min(stage*2,7);i++){const r=Math.floor(rand()*N),c=Math.floor(rand()*N),a=Math.floor(rand()*4),dr=d[a][0],dc=d[a][1],rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N){grid[r][c][a]=0;grid[rr][cc][d[a][3]]=0}}}
function makeWall(x,y,w,h){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,.36),wallMat);mesh.position.set(x,y,.23);root.add(mesh);walls.push(mesh)}
function build(){for(const w of walls){root.remove(w);w.geometry.dispose()}walls=[];makeMaze();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const [x,y]=world(r,c).toArray();if(grid[r][c][0])makeWall(x,y+cell/2,cell+.13,.14);if(grid[r][c][3])makeWall(x-cell/2,y,.14,cell+.13);if(r===N-1&&grid[r][c][2])makeWall(x,y-cell/2,cell+.13,.14);if(c===N-1&&grid[r][c][1])makeWall(x+cell/2,y,.14,cell+.13)}pos.copy(world(0,0));vel.set(0,0);tilt.set(0,0);ball.position.set(pos.x,pos.y,.39);goal.position.set(...world(N-1,N-1).toArray(),.25);running=false;won=false;elapsed=0;root.rotation.set(0,0,0);$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#time').textContent='00:00';$('#start').textContent='▶ Սկսել';$('#tip').textContent='Մատով քաշիր դաշտը՝ գնդակը գլորելու համար';$('#overlay').classList.remove('show')}
function collide(next){const rad=.22;let x=next.x,y=next.y;const c=Math.max(0,Math.min(N-1,Math.round((pos.x-origin)/cell))),r=Math.max(0,Math.min(N-1,Math.round((origin+(N-1)*cell-pos.y)/cell)));const center=world(r,c),cellWall=grid[r][c];if(cellWall[1]&&x>center.x+cell/2-rad){x=center.x+cell/2-rad;vel.x=0}if(cellWall[3]&&x<center.x-cell/2+rad){x=center.x-cell/2+rad;vel.x=0}if(cellWall[0]&&y>center.y+cell/2-rad){y=center.y+cell/2-rad;vel.y=0}if(cellWall[2]&&y<center.y-cell/2+rad){y=center.y-cell/2+rad;vel.y=0}return new THREE.Vector2(x,y)}
renderer.domElement.addEventListener('pointerdown',e=>{if(won)return;drag=true;down={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);if(!running){running=true;$('#start').textContent='⏸ Դադար'}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!down)return;tilt.x=THREE.MathUtils.clamp((e.clientX-down.x)/95,-1,1);tilt.y=THREE.MathUtils.clamp((down.y-e.clientY)/95,-1,1)});function release(){drag=false;down=null;tilt.set(0,0)}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);
$('#start').onclick=()=>{if(won)return;running=!running;$('#start').textContent=running?'⏸ Դադար':'▶ Շարունակել'};$('#reset').onclick=build;$('#hint').onclick=()=>{$('#tip').textContent='Թեքիր տախտակը փոքր շարժումներով և հետևիր բաց միջանցքներին';setTimeout(()=>$('#tip').textContent='Մատով քաշիր դաշտը՝ գնդակը գլորելու համար',2400)};$('#next').onclick=()=>{stage=(stage+1)%5;build()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const t=Math.tan(THREE.MathUtils.degToRad(37/2));camera.position.set(0,0,Math.max(5.5/t,5.5/(t*camera.aspect)));camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.035,(t-last||16)/1000);last=t;if(running&&!won){elapsed+=dt;const seconds=Math.floor(elapsed);$('#time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');vel.x=(vel.x+tilt.x*7*dt)*Math.exp(-2.6*dt);vel.y=(vel.y+tilt.y*7*dt)*Math.exp(-2.6*dt);vel.clampLength(0,2.3);let next=collide(new THREE.Vector2(pos.x+vel.x*dt,pos.y+vel.y*dt));pos.copy(next);ball.position.set(pos.x,pos.y,.39);ball.rotation.x+=vel.y*dt*2;ball.rotation.y+=vel.x*dt*2;const target=world(N-1,N-1);if(pos.distanceTo(target)<.27){won=true;running=false;$('#award').textContent=stage===4?'🏆':'⭐';$('#message').textContent=stage===4?'Բոլոր լաբիրինթոսները հաղթահարված են':'Գնդակը հասավ աստղին';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';setTimeout(()=>$('#overlay').classList.add('show'),500)}}root.rotation.y+=(tilt.x*.065-root.rotation.y)*.09;root.rotation.x+=(-tilt.y*.065-root.rotation.x)*.09;star.rotation.z+=dt*1.4;renderer.render(scene,camera)}build();requestAnimationFrame(tick);
</script></body></html>
