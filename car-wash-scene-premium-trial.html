<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Ավտոլվացում • նոր 3D տեսարան</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9da9a8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#label{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}#label span{background:#293d44bd;color:#fff;border:1px solid #ffffff6e;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:850}#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center}button{border:2px solid #f9f9f2;border-bottom:5px solid #858d91;background:linear-gradient(#fff,#d7dedf);border-radius:13px;color:#34464d;padding:11px 7px;font-weight:850;font-size:12px;flex:1;max-width:160px}button.active{background:linear-gradient(#fef2bb,#f2c774);border-color:#fff7d4}#hint{position:absolute;bottom:82px;left:10px;right:10px;text-align:center;color:#fff;font-size:12px;font-weight:800;text-shadow:0 2px 5px #1b303d}
</style></head><body><div id="view"></div><div id="label"><span>🚘 Ավտոլվացում • 3D տեսարան</span><span id="state">Ցեխոտ</span></div><div id="hint">Մատով պտտիր մեքենան • երկու մատով մոտեցրու</div><div id="controls"><button id="rotate" class="active">⟳ Պտտել</button><button id="wash">🚿 Լվանալ</button><button id="dirt">🟤 Ցեխոտել</button><button id="reset">↺ Վերադարձ</button></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const host=document.querySelector('#view');let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){document.querySelector('#hint').textContent='Այս սարքում WebGL-ը չբացվեց';throw e}renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc9d2d1);const camera=new THREE.PerspectiveCamera(35,1,.1,100);scene.add(new THREE.HemisphereLight(0xf7fbff,0x7d8584,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-11;sun.shadow.camera.right=11;sun.shadow.camera.top=11;sun.shadow.camera.bottom=-11;sun.shadow.normalBias=.02;scene.add(sun);const material=(color,rough=.55,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const wall=material(0xe3e7e4,.72),lower=material(0xadb7b8,.64),floorMat=material(0x777f80,.23,.22),seam=material(0x9ba3a3,.9),beam=material(0xd0d4d0,.65),black=material(0x22272a,.84),metal=material(0x9aa3a7,.3,.75),glass=material(0x667b82,.17,.35),lightMat=new THREE.MeshBasicMaterial({color:0xf8ffff}),mud=material(0x6b4931,.98),mudLight=material(0x886347,.99),red=material(0xa93329,.32,.32),rubber=material(0x202326,.96);
function mesh(parent,geo,mat,x=0,y=0,z=0){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(parent,w,h,d,mat,x=0,y=0,z=0){return mesh(parent,new THREE.BoxGeometry(w,h,d),mat,x,y,z)}function sphere(parent,r,mat,x=0,y=0,z=0){return mesh(parent,new THREE.SphereGeometry(r,16,12),mat,x,y,z)}
const garage=new THREE.Group();scene.add(garage);box(garage,16,.18,15,floorMat,0,-.14,0);box(garage,16,9,.12,wall,0,4,-7.5);box(garage,.12,9,15,wall,-8,4,0);box(garage,.12,9,15,wall,8,4,0);box(garage,16,.25,15,beam,0,8.35,0);
for(let y=1.4;y<8;y+=1.4){box(garage,16,.022,.045,seam,0,y,-7.39);box(garage,.045,.022,15,seam,-7.91,y,0);box(garage,.045,.022,15,seam,7.91,y,0)}box(garage,16,3.2,.08,lower,0,1.45,-7.38);box(garage,.08,3.2,15,lower,-7.87,1.45,0);box(garage,.08,3.2,15,lower,7.87,1.45,0);
for(let x=-7;x<8;x+=2.3){box(garage,.023,.015,15,seam,x,-.03,0)}for(let z=-7;z<8;z+=2.4){box(garage,16,.015,.024,seam,0,-.025,z)}
for(const x of [-5.6,0,5.6]){box(garage,.35,.5,15,beam,x,8.1,0);box(garage,.19,.09,6.1,lightMat,x,7.78,-2.2);const lamp=new THREE.PointLight(0xeafaff,2.5,12,2);lamp.position.set(x,7.6,-1.8);garage.add(lamp)}
const drain=box(garage,11,.025,.95,black,0,.01,2.5);for(let i=-24;i<=24;i++)box(garage,.08,.028,.82,metal,i*.215,.045,2.5);for(const x of [-5.2,5.2]){box(garage,.07,3.8,.12,metal,x,1.85,-6.8);box(garage,.7,.55,.26,black,x,3.5,-6.65)}
const car=new THREE.Group();scene.add(car);car.position.set(0,.15,.55);const paint=material(0xc0b5a6,.29,.38),trim=material(0x303337,.64,.18),chrome=material(0xc1c9ca,.19,.8),wheelGroup=new THREE.Group();car.add(wheelGroup);
const body=mesh(car,new THREE.CapsuleGeometry(1.15,3.5,8,18),paint,0,1.15,0);body.rotation.z=Math.PI/2;body.scale.set(.94,.52,.79);const hood=mesh(car,new THREE.SphereGeometry(1,28,16),paint,1.47,1.04,0);hood.scale.set(1.2,.44,.9);const rear=mesh(car,new THREE.SphereGeometry(1,28,16),paint,-1.48,1.06,0);rear.scale.set(1.07,.47,.88);const roof=mesh(car,new THREE.SphereGeometry(1,32,18),paint,-.18,1.69,0);roof.scale.set(1.55,.61,.76);
for(const side of [-1,1]){const win=mesh(car,new THREE.SphereGeometry(1,24,12),glass,-.12,1.75,side*.69);win.scale.set(1.28,.36,.07);const door=box(car,.045,.69,.035,trim,-.22,1.08,side*.94);box(car,.32,.07,.1,chrome,.28,1.33,side*.99);const mirror=box(car,.23,.18,.24,paint,.87,1.48,side*1.04);for(const x of [-1.35,1.42]){const wheel=mesh(car,new THREE.CylinderGeometry(.48,.48,.27,30),rubber,x,.52,side*.87);wheel.rotation.x=Math.PI/2;const rim=mesh(car,new THREE.CylinderGeometry(.3,.3,.285,28),chrome,x,.52,side*.87);rim.rotation.x=Math.PI/2;const hub=mesh(car,new THREE.CylinderGeometry(.09,.09,.29,16),trim,x,.52,side*.87);hub.rotation.x=Math.PI/2}}
for(const side of [-1,1]){box(car,.12,.2,.3,material(0xfff3cb,.3),2.34,1.06,side*.57);box(car,.1,.16,.32,red,-2.35,1.04,side*.56)}
box(car,.09,.13,1.7,chrome,2.43,.73,0);box(car,.09,.14,1.7,chrome,-2.41,.73,0);
const dirtGroup=new THREE.Group();car.add(dirtGroup);let seed=29;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const stains=[];for(let i=0;i<240;i++){const x=(rand()-.5)*4.55,z=(rand()-.5)*1.9,y=.68+rand()*.8;const patch=sphere(dirtGroup,.08+rand()*.16,rand()>.45?mud:mudLight,x,y,z);patch.scale.set(1.1+rand()*1.4,.14,.7+rand()*.8);patch.rotation.y=rand()*Math.PI;stains.push(patch)}
let clean=0,mode='rotate',drag=null,yaw=0,zoom=13,auto=0;const setMode=m=>{mode=m;document.querySelectorAll('#controls button').forEach(b=>b.classList.toggle('active',b.id===m))};function cleanStep(amount){clean=THREE.MathUtils.clamp(clean+amount,0,1);for(let i=0;i<stains.length;i++)stains[i].visible=i/stains.length>=clean;document.querySelector('#state').textContent=clean>.99?'Մաքուր ✨':clean>0?'Մաքրվում է':'Ցեխոտ'}
document.querySelector('#rotate').onclick=()=>setMode('rotate');document.querySelector('#wash').onclick=()=>setMode('wash');document.querySelector('#dirt').onclick=()=>{cleanStep(-1);setMode('rotate')};document.querySelector('#reset').onclick=()=>{cleanStep(-1);yaw=0;zoom=13;setMode('rotate')};
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);if(mode==='wash')cleanStep(.045)});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.y=e.clientY;if(mode==='rotate')yaw+=dx*.008;else cleanStep(.015)});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.015,9,17)},{passive:true});
let pinch=0;const fingers=new Map();canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches)fingers.set(t.identifier,[t.clientX,t.clientY])},{passive:true});canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches)fingers.set(t.identifier,[t.clientX,t.clientY]);if(fingers.size>=2){const p=[...fingers.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)zoom=THREE.MathUtils.clamp(zoom+(pinch-d)*.02,9,17);pinch=d}},{passive:true});canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)fingers.delete(t.identifier);pinch=0},{passive:true});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);function tick(){requestAnimationFrame(tick);car.rotation.y=yaw;const portrait=camera.aspect<.8;const dist=zoom*(portrait?1.36:1);camera.position.set(0,4.1,dist);camera.lookAt(0,1.35,-.1);renderer.render(scene,camera)}resize();tick();
</script></body></html>
