<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>AREG • Գնդիկների լաբորատորիա 3D</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}body{background:#132c45;color:#fff}#app{height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;padding:8px 10px max(8px,env(safe-area-inset-bottom));gap:8px;background:radial-gradient(ellipse at 50% 20%,#537c91,#1a3b58 72%,#10263e)}#status{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900}.chip{border:2px solid #c99b5f;border-radius:15px;padding:8px 12px;background:linear-gradient(#ffe8bb,#c78b52);color:#704523;box-shadow:inset 0 2px #fff8,0 3px 7px #0004}#instructions{flex:1;text-align:center;font-size:clamp(12px,3.4vw,16px);align-self:center}#stage{position:relative;flex:1;min-height:220px;border:4px solid #c39764;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#719ab0,#315d7b 55%,#172f4d);box-shadow:inset 0 3px 28px #0b1c3888,0 6px 13px #07192a77}canvas{display:block;width:100%;height:100%;touch-action:none}#hintText{position:absolute;left:10px;right:10px;top:10px;text-align:center;font-weight:850;font-size:13px;text-shadow:0 2px 5px #071729;pointer-events:none}#feedback{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:70px;opacity:0;transition:opacity .2s;pointer-events:none}#feedback.show{opacity:1}#controls{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap}button{font:inherit;font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}.action{flex:1;min-width:75px;border:2px solid #ffe5ad;border-bottom:5px solid #976338;border-radius:14px;padding:11px 5px;color:#704523;background:linear-gradient(#fff0c7,#d9a46c)}.action:active{transform:translateY(3px);border-bottom-width:2px}#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:#081b34b8}#overlay.show{display:flex}.modal{text-align:center;max-width:360px;width:100%;border:7px solid #a87445;border-radius:26px;padding:22px 15px;background:linear-gradient(#fff1d2,#e4b578);color:#704321;box-shadow:0 15px 35px #0007}.award{font-size:75px}.modal h2{font-size:25px}#next{background:linear-gradient(#a8f987,#35b95b);border:3px solid #c4ffa7;border-bottom:5px solid #16793a;border-radius:16px;padding:12px 25px;color:#12502b;font-size:18px}@media(max-height:650px){#app{gap:4px}.action{padding:7px 4px}.chip{padding:5px 8px}}
</style></head><body><div id="app"><div id="status"><div class="chip" id="phase">Փուլ 1 / 5</div><div id="instructions">Նույն գույները հավաքիր միասին</div><div class="chip" id="moves">Քայլեր 0</div></div><div id="stage"><div id="hintText">Ընտրիր առաջին, հետո երկրորդ խողովակը</div><div id="feedback"></div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2 id="result">Ապրե՛ս</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="controls"><button class="action" id="undo">↶ Հետ</button><button class="action" id="hint">💡 Հուշում</button><button class="action" id="reset">⟳ Կրկնել</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#stage'),palette=[0xff547a,0x4bdbfa,0xffc34b,0x9e7bff,0x70e0a3,0xff8e51],levels=[2,3,3,4,4];
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f9ff,0x1d3655,2.7));const sun=new THREE.DirectionalLight(0xffe9c7,3.4);sun.position.set(-5,8,8);scene.add(sun);const rim=new THREE.DirectionalLight(0x8cd8ff,2.6);rim.position.set(5,4,-6);scene.add(rim);
const group=new THREE.Group();scene.add(group);const gold=new THREE.MeshStandardMaterial({color:0xe9bd74,metalness:.65,roughness:.27}),wood=new THREE.MeshStandardMaterial({color:0x916347,roughness:.72}),glass=new THREE.MeshPhysicalMaterial({color:0xd9f8ff,metalness:0,roughness:.12,transmission:.82,transparent:true,opacity:.3,thickness:.24,side:THREE.DoubleSide,depthWrite:false});
const base=new THREE.Mesh(new THREE.CylinderGeometry(5.1,5.25,.36,80),wood);base.position.y=-2.15;group.add(base);const border=new THREE.Mesh(new THREE.TorusGeometry(5.08,.09,12,90),gold);border.rotation.x=Math.PI/2;border.position.y=-1.95;group.add(border);
const ambient=[];for(let i=0;i<24;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.028+(i%3)*.014,8,6),new THREE.MeshBasicMaterial({color:i%2?0xffe5a6:0x8beaff,transparent:true,opacity:.6}));p.position.set(Math.sin(i*3.7)*7,Math.cos(i*2.8)*3, -3-(i%4));scene.add(p);ambient.push(p)}
const ballGeo=new THREE.SphereGeometry(.36,28,20),ballMats=palette.map(c=>new THREE.MeshPhysicalMaterial({color:c,metalness:.12,roughness:.16,clearcoat:1,clearcoatRoughness:.08}));
let stage=0,tubes=[],selected=-1,history=[],moves=0,busy=false,animations=[],flashTimer;
const capacity=4;function flash(symbol,good){const f=$('#feedback');f.textContent=symbol;f.style.color=good?'#8affac':'#ff7979';f.classList.add('show');clearTimeout(flashTimer);flashTimer=setTimeout(()=>f.classList.remove('show'),550)}
function disposeTube(t){group.remove(t.root);t.root.traverse(o=>{if(o.geometry&&o.geometry!==ballGeo)o.geometry.dispose()})}
function makeTube(x,id,values){const root=new THREE.Group();root.position.x=x;group.add(root);const holder=new THREE.Mesh(new THREE.CylinderGeometry(.54,.58,.16,40),gold);holder.position.y=-1.85;root.add(holder);
const cylinder=new THREE.Mesh(new THREE.CylinderGeometry(.49,.49,3.25,44,1,true),glass);cylinder.position.y=-.1;cylinder.renderOrder=3;root.add(cylinder);const bottom=new THREE.Mesh(new THREE.CylinderGeometry(.49,.49,.09,44),new THREE.MeshStandardMaterial({color:0xa3e5f3,metalness:.5,roughness:.2,transparent:true,opacity:.38}));bottom.position.y=-1.75;root.add(bottom);
const lip=new THREE.Mesh(new THREE.TorusGeometry(.5,.055,10,48),gold);lip.rotation.x=Math.PI/2;lip.position.y=1.55;root.add(lip);const glow=new THREE.Mesh(new THREE.TorusGeometry(.61,.045,8,48),new THREE.MeshBasicMaterial({color:0x71ff8e,transparent:true,opacity:.95}));glow.rotation.x=Math.PI/2;glow.position.y=-1.82;glow.visible=false;root.add(glow);
const t={id,root,values:values.slice(),balls:[],glow};values.forEach((v,i)=>{const b=new THREE.Mesh(ballGeo,ballMats[v]);b.position.set(0,-1.37+i*.76,0);root.add(b);t.balls.push(b)});return t}
function createState(){tubes.forEach(disposeTube);tubes=[];history=[];selected=-1;moves=0;busy=false;animations=[];const n=levels[stage];let vals=[];for(let c=0;c<n;c++)for(let j=0;j<4;j++)vals.push(c);
const rand=(()=>{let s=(stage+1)*7919;return()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296)})();for(let i=vals.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
const stacks=Array.from({length:n},(_,i)=>vals.slice(i*4,(i+1)*4));stacks.push([],[]);const count=stacks.length;const gap=count<=4?2.25:1.85;const x0=-(count-1)*gap/2;stacks.forEach((v,i)=>tubes.push(makeTube(x0+i*gap,i,v)));$('#phase').textContent='Փուլ '+(stage+1)+' / 5';update();$('#overlay').classList.remove('show');resize()}
function update(){tubes.forEach((t,i)=>{t.glow.visible=i===selected});$('#moves').textContent='Քայլեր '+moves}
function won(){return tubes.every(t=>t.values.length===0||(t.values.length===4&&t.values.every(v=>v===t.values[0])))}
function move(a,b,record=true){if(busy||a===b||a<0||b<0)return false;const src=tubes[a],dst=tubes[b];if(!src.values.length||dst.values.length>=4)return false;const v=src.values.at(-1);if(dst.values.length&&dst.values.at(-1)!==v)return false;
if(record)history.push({a,b});src.values.pop();dst.values.push(v);const ball=src.balls.pop();const endY=-1.37+(dst.values.length-1)*.76;const worldX=src.root.position.x, targetX=dst.root.position.x;group.add(ball);ball.position.x=worldX;ball.position.y=-1.37+src.values.length*.76;dst.balls.push(ball);animations.push({ball,dst:dst.root,fromX:worldX,toX:targetX,toY:endY,t:0});busy=true;moves++;selected=-1;update();return true}
function finishMove(){busy=false;if(won())setTimeout(()=>{$('#award').textContent=stage===4?'🏆':'⭐';$('#result').textContent=stage===4?'Լաբորատորիան պատրաստ է':'Բոլոր գույները հավաքված են';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')},350)}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(busy||$('#overlay').classList.contains('show'))return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(tubes.map(t=>t.root),true);let index=-1;if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==group)o=o.parent;index=tubes.findIndex(t=>t.root===o)}if(index<0){const point=ray.ray.at((camera.position.z)/Math.max(.01,-ray.ray.direction.z),new THREE.Vector3());index=tubes.reduce((best,t,i)=>Math.abs(t.root.position.x-point.x)<Math.abs(tubes[best]?.root.position.x-point.x??Infinity)?i:best,-1)}if(index<0)return;if(selected<0){if(tubes[index].values.length){selected=index;update()}}else if(selected===index){selected=-1;update()}else{const old=selected;selected=-1;if(!move(old,index))flash('✕',false);update()}});
$('#undo').onclick=()=>{if(busy||!history.length)return;const {a,b}=history.pop();const src=tubes[b],dst=tubes[a],v=src.values.pop(),ball=src.balls.pop();dst.values.push(v);dst.balls.push(ball);src.root.remove(ball);dst.root.add(ball);ball.position.set(0,-1.37+(dst.values.length-1)*.76,0);moves=Math.max(0,moves-1);selected=-1;update()};$('#reset').onclick=createState;$('#next').onclick=()=>{stage=(stage+1)%5;createState()};
$('#hint').onclick=()=>{if(busy)return;let suggestion=null;for(let a=0;a<tubes.length;a++){const s=tubes[a];if(!s.values.length)continue;if(s.values.length===4&&s.values.every(x=>x===s.values[0]))continue;for(let b=0;b<tubes.length;b++){if(a===b)continue;const d=tubes[b];if(d.values.length<4&&(d.values.length===0||d.values.at(-1)===s.values.at(-1))){if(d.values.length>0){suggestion=[a,b];break}if(!suggestion)suggestion=[a,b]}}if(suggestion&&tubes[suggestion[1]].values.length)break}if(suggestion){selected=suggestion[0];update();tubes[suggestion[1]].glow.visible=true;setTimeout(()=>{if(selected===suggestion[0])tubes[suggestion[1]].glow.visible=false},1500)}};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const count=levels[stage]+2;const distance=Math.max(13, (count*1.85+1.6)/(2*Math.tan(THREE.MathUtils.degToRad(34/2))*Math.max(.45,w/h)));camera.position.set(0,2.1,distance);camera.lookAt(0,-.2,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let prev=0;function tick(time){requestAnimationFrame(tick);const dt=Math.min(40,time-prev||16);prev=time;for(let i=animations.length-1;i>=0;i--){const a=animations[i];a.t=Math.min(1,a.t+dt/690);const p=a.t,s=p*p*(3-2*p);a.ball.position.x=a.fromX+(a.toX-a.fromX)*s;a.ball.position.y=a.toY+Math.sin(p*Math.PI)*2.2;if(p===1){group.remove(a.ball);a.dst.add(a.ball);a.ball.position.set(0,a.toY,0);animations.splice(i,1);finishMove()}}ambient.forEach((p,i)=>{p.position.y+=Math.sin(time*.0005+i)*.0006});renderer.render(scene,camera)}createState();requestAnimationFrame(tick);
</script></body></html>
