name: AREG Full Game Audit
on:
  push:
    branches: [main, v238-smooth-loading-lab, v2381-3d-cache-version-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assets-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the entire push range and PR merge-base, not only HEAD^.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test project handoff enforcement
        run: node --test qa/handoff-guard.test.mjs
      - name: Require both project handoffs with code changes
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          AREG_EVENT_NAME: ${{ github.event_name }}
          AREG_PUSH_BEFORE: ${{ github.event.before }}
          AREG_PR_BASE: ${{ github.event.pull_request.base.sha }}
          AREG_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node qa/handoff-guard.mjs
      - name: Unit test session results and ephemeral score rules
        run: node --test qa/finding-session.test.mjs
      - name: Unit test per-visit ten-correct milestones and reward unlock wallet
        run: node --test qa/star-economy.test.mjs
      - run: node qa/full-audit.mjs
      - name: Diagnose large 3D texture retrieval on preview and main hosts (nonblocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          AREG_PREVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for texture in 04-earth.png 08-saturn.png 09-uranus.png; do
            echo "::group::3D UV texture $texture"
            for host in preview main; do
              if [ "$host" = preview ]; then
                url="https://rawcdn.githack.com/hamulik003-cyber/areg-kids-game/${AREG_PREVIEW_HEAD}/assets/space3d/user-final/${texture}?v=final27repo4"
              else
                url="https://hamulik003-cyber.github.io/areg-kids-game/assets/space3d/user-final/${texture}?v=final27repo4"
              fi
              echo "$host: $url"
              curl -L --retry 1 --connect-timeout 8 --max-time 25 -sS -o /tmp/areg-probe-texture -w "status=%{http_code}; content-type=%{content_type}; received=%{size_download}; target=%{url_effective}\n" "$url" || true
              file /tmp/areg-probe-texture || true
            done
            echo "::endgroup::"
          done

  mobile-browser:
    needs: assets-and-code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: node qa/browser-smoke.mjs
      - name: Verify latest PWA HTML replaces stale cached page, offline still works
        run: node qa/pwa-update.test.mjs

  ios-webkit:
    needs: assets-and-code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - run: AREG_BROWSER=webkit node qa/browser-smoke.mjs
      - name: Verify latest PWA HTML replaces stale cached page, offline still works
        run: AREG_BROWSER=webkit node qa/pwa-update.test.mjs
