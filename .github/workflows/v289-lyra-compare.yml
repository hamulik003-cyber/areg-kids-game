name: V289 Lyra original JPG transparency remake — trial only
on:
  push:
    branches: [feature/v289-lyra-original-jpg-transparent-rematte-pilot]
    paths:
      - scripts/v289-lyra-original-rgb-rematte.py
      - .github/workflows/v289-lyra-compare.yml
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Rebuild Lyra original-source quality transparency preview
        run: python scripts/v289-lyra-original-rgb-rematte.py
      - name: Assert no game asset was changed
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths=[x[3:] for x in changed if x.strip()]
          assert paths and all(x.startswith('qa/v289-lyra-restore/') for x in paths),paths
          print('PASS: all changes are preview files only. GitHub live game untouched.')
          PY
      - name: Commit ONLY review pictures to V289 feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/v289-lyra-restore/
          git commit -m "V289 QA: original JPG color fidelity Lyra transparent PNG WebP comparisons"
          git push origin HEAD:feature/v289-lyra-original-jpg-transparent-rematte-pilot
