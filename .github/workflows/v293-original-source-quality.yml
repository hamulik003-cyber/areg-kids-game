name: V293 original-source high-detail artworks — feature only
on:
  push:
    branches: [feature/v293-original-source-quality-safe]
    paths:
      - scripts/v293-build-high-detail.py
      - qa/v293-source-bundle/**
      - .github/workflows/v293-original-source-quality.yml
permissions:
  contents: write
jobs:
  build-37-protected-belt:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline image-processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless scipy
      - name: Match all 38 approved objects with original source art, rebuild 37
        run: python -u scripts/v293-build-high-detail.py
      - name: Guard main, Orion Belt, all non-constellation assets, sizes, and image pairs
        run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/constellations-transparent')
          report=json.loads(Path('qa/v293-quality-report/report.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          assert report['generated']==37 and report['pictures_in_game']==38
          assert len(report['source_mapping'])==38 and len({x['source_index'] for x in report['source_mapping']})==38
          assert len(manifest)==38
          change=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths=[x[3:] for x in change if x.strip()]
          assert all(x.startswith(('assets/constellations-transparent/','qa/v293-quality-report/')) for x in paths),paths
          allowed={f'assets/constellations-transparent/{a["stem"]}.{ext}' for a in report['assets'] for ext in ('png','webp')}
          allowed.add('assets/constellations-transparent/manifest.json')
          assert allowed.issubset(set(paths)),allowed-set(paths)
          for a in report['assets']:
              name=a['stem']; w,h=a['game_px']
              assert a['webp_bytes']<=300_000,(name,a['webp_bytes'])
              assert w<=1100 and h<=1200,(name,w,h)
              with Image.open(root/(name+'.webp')) as webp,Image.open(root/(name+'.png')) as png:
                  assert webp.size==png.size==(w,h),name
                  assert webp.convert('RGBA').getextrema()[3][0]==0,name
                  assert png.mode=='RGBA',name
          for ext in ('png','webp'):
              n=f'assets/constellations-transparent/16-hayk-belt.{ext}'
              orig=subprocess.check_output(['git','rev-parse','34548b66aeb1cadde0fb1e643830de091d2172a6:'+n],text=True).strip()
              now=subprocess.check_output(['git','hash-object',n],text=True).strip()
              assert orig==now,(n,orig,now)
          print('PASS 37 regenerated high-definition source-original transparent art; unchanged protected belt; other sections untouched.')
          PY
      - name: Verify no layout, star, audio or scoring regression
        run: node qa/full-audit.mjs
      - name: Record only transparent pairs and QA report (feature branch)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/constellations-transparent qa/v293-quality-report
          git commit -m 'V293 feature only: 37 high-resolution ZIP-source constellation PNG/WebP assets'
          git push origin HEAD:feature/v293-original-source-quality-safe
      - name: Publish QA report
        uses: actions/upload-artifact@v4
        with:
          name: v293-38-constellation-quality-report
          path: qa/v293-quality-report/
          retention-days: 14
