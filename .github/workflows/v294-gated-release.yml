name: V294 gated release QA — quality, no flicker, existing caches
on:
  push:
    branches: [release/v294-constellation-original-quality]
    paths:
      - .github/workflows/v294-gated-release.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact approved changes and 38 correctly paired constellation assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          from PIL import Image
          base='34548b66aeb1cadde0fb1e643830de091d2172a6'
          names=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          approved={'app.js','index.html','service-worker.js','refresh.html','constellation-quest-v246.js',
                    'qa/full-audit.mjs','qa/pwa-update.test.mjs',
                    '.github/workflows/v294-gated-release.yml',
                    'assets/constellations-transparent/manifest.json'}
          assert all(n in approved or n.startswith('assets/constellations-transparent/') for n in names),names
          manifest=json.loads(Path('assets/constellations-transparent/manifest.json').read_text())
          assert len(manifest)==38
          source={Path(x['source']).stem for x in manifest}
          assert len(source)==38
          folder=Path('assets/constellations-transparent')
          sizes=[]
          for n in source:
            for ext in ('png','webp'):
              path=folder/(n+'.'+ext)
              assert path.is_file(),path
            if n not in ('01-hayk-orion','16-hayk-belt'):
              with Image.open(folder/(n+'.webp')) as w, Image.open(folder/(n+'.png')) as p:
                assert w.size==p.size and w.width>=720 and w.height>=750,n
                assert w.convert('RGBA').getextrema()[3][0]==0,n
              sizes.append((n,(folder/(n+'.webp')).stat().st_size))
          assert len(sizes)==36
          assert max(v for _,v in sizes)<=300000
          for n in ('01-hayk-orion','16-hayk-belt'):
            for ext in ('png','webp'):
              filename=f'assets/constellations-transparent/{n}.{ext}'
              old=subprocess.check_output(['git','rev-parse',base+':'+filename],text=True).strip()
              new=subprocess.check_output(['git','hash-object',filename],text=True).strip()
              assert old==new,filename
          quest=Path('constellation-quest-v246.js').read_text()
          app=Path('app.js').read_text()
          worker=Path('service-worker.js').read_text()
          assert 'ARTWORK_LRU_LIMIT=10' in quest
          assert "'?v=294'" in quest
          assert "const PRESERVED_LEGACY_RUNTIME='areg-v287-runtime'" in worker
          assert "k!==PRESERVED_LEGACY_RUNTIME" in worker
          assert "const CORE_CACHE='areg-v294-core'" in worker
          assert "const RUNTIME_CACHE='areg-v294-runtime'" in worker
          assert "'./constellation-quest-v246.js?v=294'" in worker
          assert "constellation-quest-v246.js?v=294" in app
          assert "service-worker.js?v=294" in app
          assert "app.js?v=294" in Path('index.html').read_text()
          print('PASS: 36 high-detail source PNG/WebP pairs, 2 approved artworks byte-identical, other game assets untouched, cache migration protected; WebP max',max(v for _,v in sizes))
          PY
      - run: node qa/full-audit.mjs
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - name: All 17 routes, four-choice image decode, native loss/win motion, no flicker, reward persistence
        run: AREG_BROWSER=webkit node qa/browser-smoke.mjs
      - name: iPhone service-worker navigation/update, offline cache and wallet protection
        run: AREG_BROWSER=webkit node qa/pwa-update.test.mjs
  pwa-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: DotKiosk-style cache-first old-vs-new HTML and offline app update regression
        run: node qa/pwa-update.test.mjs
