name: Import exact UV 27

on:
  push:
    paths:
      - ".github/uv-import-url.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download UV archive
        shell: bash
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < .github/uv-import-url.txt)"
          test -n "$URL"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/areg-exact-uv-27.zip
          unzip -q /tmp/areg-exact-uv-27.zip -d /tmp/uvpack

      - name: Validate and install exact originals
        shell: python
        run: |
          import json, pathlib, struct, hashlib, shutil, sys

          root=pathlib.Path("/tmp/uvpack")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          expected=[
            "sun","mercury","venus","earth","moon","mars","jupiter","saturn","uranus","neptune",
            "phobos","deimos","io","europa","ganymede","callisto","titan","enceladus","titania",
            "oberon","triton","charon","pluto","ceres","haumea","makemake","eris"
          ]
          items=manifest.get("items",[])
          if manifest.get("count") != 27 or len(items) != 27:
              raise SystemExit("Expected exactly 27 UV items")
          got=[x.get("id") for x in items]
          if got != expected:
              raise SystemExit(f"ID/order mismatch: {got}")

          dest=pathlib.Path("assets/space3d/user-final")
          dest.mkdir(parents=True,exist_ok=True)
          out=[]
          hashes=set()

          for i,(exp_id,item) in enumerate(zip(expected,items),1):
              src=root/item["file"]
              data=src.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{exp_id}: expected PNG")
              w,h=struct.unpack(">II",data[16:24])
              if w != h*2:
                  raise SystemExit(f"{exp_id}: not exact 2:1 ({w}x{h})")
              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes:
                  raise SystemExit(f"{exp_id}: duplicate binary detected")
              hashes.add(sha)
              target=dest/f"{exp_id}.png"
              target.write_bytes(data)
              out.append({
                  "index":i,"id":exp_id,"name":item.get("name",""),
                  "reference":item.get("reference",""),
                  "file":str(target).replace("\\","/"),
                  "width":w,"height":h,"size":len(data),"sha256":sha
              })

          (dest/"manifest.json").write_text(
              json.dumps({"version":1,"count":27,"items":out},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("Validated and installed 27 exact UV originals")

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/space3d/user-final
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Assets: install final 27 exact UV originals"
          git push origin HEAD:main
