name: V288 FREE classic image cleanup - preview only
on:
  push:
    branches: [feature/v288-nongenerative-constellation-cleanup-pilot]
    paths:
      - scripts/v288-preview-cleanup.py
      - .github/workflows/v288-preview-cleanup.yml
permissions:
  contents: write
jobs:
  non-generative-cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image processing libraries only
        run: python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - name: Make 3 visual test comparisons without touching game files
        run: python scripts/v288-preview-cleanup.py
      - name: Verify only QA image preview files differ, never game assets
        run: |
          python - <<'PY'
          import subprocess
          tracked=subprocess.check_output(['git','status','--porcelain'],text=True)
          assert not any(line.endswith(('.png','.webp')) and '/constellations-transparent/' in line for line in tracked.splitlines()),tracked
          paths=[line[3:] for line in tracked.splitlines() if line.strip()]
          assert paths and all(x.startswith('qa/v288-previews/') for x in paths),tracked
          print('QA ONLY, NO production assets modified')
          PY
      - name: Commit shareable side-by-side samples to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/v288-previews
          git commit -m "V288 QA: 3 side-by-side non-generative clarity samples [preview-only]"
          git push origin HEAD:feature/v288-nongenerative-constellation-cleanup-pilot
