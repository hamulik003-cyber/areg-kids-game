name: Train Quick Draw AI (trial)
on:
  push:
    branches:
      - trial/areg-test-full-app-20261017
    paths:
      - 'tools/train_quickdraw.py'
      - '.github/workflows/train-quickdraw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests tensorflow-cpu==2.16.2 tensorflowjs==4.22.0
      - name: Train and evaluate Quick Draw classifier
        run: python tools/train_quickdraw.py
      - name: Publish trained browser model as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdraw-tfjs-model
          path: |
            quickdraw-model/web/
            quickdraw-model/labels.json
          retention-days: 14
