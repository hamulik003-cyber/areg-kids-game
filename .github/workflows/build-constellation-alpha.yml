name: Build transparent constellation PNG and WebP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-constellation-alpha.py
      - .github/workflows/build-constellation-alpha.yml
permissions:
  contents: write
concurrency:
  group: constellation-alpha-production
  cancel-in-progress: false
jobs:
  build-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate 38 PNG and WebP alpha assets from approved originals
        run: python scripts/build-constellation-alpha.py
      - name: Verify exact file counts and transparent channels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base = Path('assets/constellations-transparent')
          files = json.loads((base / 'manifest.json').read_text())
          assert len(files) == 38
          for item in files:
              for ext in ('png','webp'):
                  path = Path(item[ext])
                  assert path.is_file(), path
                  image = Image.open(path)
                  assert image.mode == 'RGBA', (path, image.mode)
                  assert image.getchannel('A').getextrema()[0] == 0, path
                  assert image.getchannel('A').getextrema()[1] >= 150, path
          print('Verified 38 transparent source PNG and 38 compressed transparent WebP')
          PY
      - name: Publish generated artwork to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellations-transparent
          if git diff --cached --quiet; then
            echo "Images up to date"
          else
            git commit -m "V252: generate 38 transparent constellation PNG originals and alpha WebP runtime assets"
            git push origin HEAD:main
          fi
