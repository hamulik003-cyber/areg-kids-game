name: Localize Earth texture for V3

on:
  push:
    branches:
      - space-pipeline-v3
    paths:
      - '.github/workflows/localize-earth-texture-v3.yml'

permissions:
  contents: write

jobs:
  localize-earth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3 branch
        uses: actions/checkout@v4
        with:
          ref: space-pipeline-v3

      - name: Extract current Earth texture URL from V2
        id: earth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          s=Path('space-search-v2/space-search-v2.js').read_text(encoding='utf-8')
          m=re.search(r"earth:\{[\s\S]*?texture:'([^']+)'", s)
          if not m:
              raise SystemExit('Earth texture URL not found')
          print('url='+m.group(1))
          PY

      - name: Download and verify local Earth texture
        env:
          EARTH_URL: ${{ steps.earth.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p space-assets/earth
          curl -fL --retry 4 --retry-delay 2 "$EARTH_URL" -o space-assets/earth/texture-2k.png
          test -s space-assets/earth/texture-2k.png
          file space-assets/earth/texture-2k.png
          python - <<'PY'
          import struct
          p='space-assets/earth/texture-2k.png'
          with open(p,'rb') as f:
              sig=f.read(8)
              if sig != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('Not a PNG')
              length=struct.unpack('>I',f.read(4))[0]
              kind=f.read(4)
              if kind != b'IHDR' or length < 8:
                  raise SystemExit('Missing PNG IHDR')
              w,h=struct.unpack('>II',f.read(8))
          print('Earth texture:', w, 'x', h)
          if w != h*2:
              raise SystemExit(f'Expected 2:1 equirectangular texture, got {w}x{h}')
          PY

      - name: Commit localized texture to V3 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space-assets/earth/texture-2k.png
          git commit -m "V3: localize Earth 2:1 texture" || exit 0
          git push origin HEAD:space-pipeline-v3
