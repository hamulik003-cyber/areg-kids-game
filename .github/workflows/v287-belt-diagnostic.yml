name: V287 Belt diagnostics (read-only)
on:
  push:
    branches: [feature/v287-constellation-preserve-art-quality-belt-stars]
    paths:
      - scripts/v287-belt-diagnostic.py
      - .github/workflows/v287-belt-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python scripts/v287-belt-diagnostic.py
