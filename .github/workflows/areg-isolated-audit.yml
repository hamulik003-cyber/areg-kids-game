name: AREG isolated audit (read-only)
on:
  push:
    branches:
      - safety/areg-audit-pilot-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Nardi rule module syntax
        run: node --check --input-type=module < areg-nardi-rules.js
      - name: Run isolated Nardi regression checks
        run: node --experimental-default-type=module --test tests/*.test.mjs
