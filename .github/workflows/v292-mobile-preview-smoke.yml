name: V292 public preview mobile Safari smoke
on:
  push:
    branches: [v292-constellation-hybrid-color-pilot]
    paths:
      - .github/workflows/v292-mobile-preview-smoke.yml
permissions:
  contents: read
jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - name: Verify real public page loads all 8 thumbnails and zoom/swap works
        run: |
          node --input-type=module <<'JS'
          import { webkit } from 'playwright';
          const url='https://raw.githack.com/hamulik003-cyber/areg-kids-game/v292-constellation-hybrid-color-pilot/v292-constellation-hybrid-compare.html';
          const browser=await webkit.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          if(response.status()!==200)throw Error('Public HTML HTTP '+response.status());
          console.log('PUBLIC_PREVIEW_DIAGNOSTIC',response.url(),await page.title(),(await page.content()).slice(0,1100));
          const count=await page.locator('button.tile').count();
          if(count!==8)throw Error('Expected 8 cards, saw '+count);
          await page.waitForFunction(()=>[...document.querySelectorAll('.tile img')].every(x=>x.complete && x.naturalWidth>0),null,{timeout:90000});
          await page.locator('button.tile[data-item="lyra-vivid"]').click();
          await page.locator('#viewer:not([hidden])').waitFor();
          await page.locator('#plus').click();
          const zoom=await page.locator('#zoomPct').innerText();
          if(zoom!=='150%')throw Error('Zoom broken: '+zoom);
          await page.locator('#swap').click();
          if(!((await page.locator('#vTitle').innerText()).includes('Հին')))throw Error('Cycle back to old failed');
          await page.locator('#close').click();
          if(!(await page.locator('#viewer').isHidden()))throw Error('Close broken');
          if(errors.length)throw Error('JS errors '+errors.join('; '));
          console.log('PASS: public V292 image comparison renders all 8 WebPs on iPhone WebKit; zoom/cycle/close work.');
          await browser.close();
          JS
