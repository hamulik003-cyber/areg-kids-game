name: V294 FINAL — 38 shapes + iPhone/PWA no regression
# Exact same product version V294; internal cache tag v294f maintains safe upgrades.
on:
  push:
    branches: [release/v294-final-picture-consistency]
    paths:
      - .github/workflows/v294-final-quality-gate.yml
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Validate every approved object, shape, colors, origin, storage budget and file scope
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          base='34548b66aeb1cadde0fb1e643830de091d2172a6'
          prior='2fe0bddeb6efb8e7be29070d8ca80ceca412ec36'
          manifest=json.loads(Path('assets/constellations-transparent/manifest.json').read_text())
          qa=json.loads(Path('qa/v294-geometry/audit.json').read_text())
          rec=json.loads(Path('qa/v294-geometry/reconstruction.json').read_text())
          assert len(manifest)==38 and qa['compared']==38 and not qa['flags']
          assert rec['count']==36
          allowed={'app.js','index.html','constellation-quest-v246.js','service-worker.js','refresh.html',
                    'qa/full-audit.mjs','qa/pwa-update.test.mjs','CURRENT_STATUS.md','PROJECT_HANDOFF.md',
                    'qa/v294-geometry/audit.json','qa/v294-geometry/reconstruction.json',
                    '.github/workflows/v294-final-quality-gate.yml',
                    'assets/constellations-transparent/manifest.json'}
          changed=subprocess.check_output(['git','diff','--name-only',prior,'HEAD'],text=True).splitlines()
          assert all(f in allowed or f.startswith('assets/constellations-transparent/') for f in changed),changed
          assert len([f for f in changed if f.endswith(('.png','.webp')) and 'assets/constellations-transparent/' in f])==72
          assert max(row['webpBytes'] for row in rec['assets'])<=345000
          assert all(abs(row['newMean']-row['oldMean'])<8 for row in rec['assets'])
          assert all(abs(row['newCoverage']/row['oldCoverage']-1)<.01 for row in rec['assets'])
          for name in ('01-hayk-orion','16-hayk-belt'):
              for ext in ('png','webp'):
                  path=f'assets/constellations-transparent/{name}.{ext}'
                  sha0=subprocess.check_output(['git','rev-parse',base+':'+path],text=True).strip()
                  sha1=subprocess.check_output(['git','hash-object',path],text=True).strip()
                  assert sha0==sha1,path
          s=Path('service-worker.js').read_text()
          assert "const PRESERVED_LAST_RUNTIME='areg-v294-runtime'" in s
          assert "const PRESERVED_LEGACY_RUNTIME='areg-v287-runtime'" in s
          assert 'v=294f' in Path('constellation-quest-v246.js').read_text()
          print('PASS: exact 38/38 consistency, 36 corrected originals, 2 SHA protected, updates versioned V294, no other game or asset files changed')
          PY
      - run: node qa/full-audit.mjs
  webkit-gameplay:
    runs-on: ubuntu-latest
    needs: geometry
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - name: Safari WebKit — all 17 game routes, 38 illustrated choices, fades, stars, next-round preloads
        run: AREG_BROWSER=webkit node qa/browser-smoke.mjs
  webkit-pwa:
    runs-on: ubuntu-latest
    needs: geometry
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - name: iOS cache and offline — preserve other sections, music, star count
        run: AREG_BROWSER=webkit node qa/pwa-update.test.mjs
  chromium-pwa:
    runs-on: ubuntu-latest
    needs: geometry
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: PWA update route, cache/score continuity and offline DotKiosk-like navigation
        run: node qa/pwa-update.test.mjs
