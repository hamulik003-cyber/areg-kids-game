name: V286 build four corrected constellation PNG WebP pairs (staging only)
on:
  push:
    branches: [feature/v286-verified-constellation-artwork]
    paths:
      - scripts/v286-correct-constellation-art.py
      - .github/workflows/v286-correct-constellation-art.yml
permissions:
  contents: write
jobs:
  four-artworks:
    if: "!contains(github.event.head_commit.message, '[v286-assets-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small image processing deps
        run: python -m pip install numpy pillow opencv-python-headless
      - name: Generate four fixed asset pairs preserving 34 others
        run: python scripts/v286-correct-constellation-art.py
      - name: Ensure only approved binary paths and manifest were generated
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          allowed={f'assets/constellations-transparent/{stem}.{ext}'
              for stem in ('10-lyra','16-hayk-belt','22-pisces','30-canis-minor')
              for ext in ('png','webp')}
          allowed.add('assets/constellations-transparent/manifest.json')
          assert changed, 'No corrected assets generated'
          assert changed<=allowed, 'Unexpected changed files: '+str(changed-allowed)
          assert all(path in changed for path in allowed if path.endswith('.webp'))
          print('V286 34 untouched assets protected:',len(changed),'files changed')
          PY
      - name: Push generated binary files to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellations-transparent/
          git commit -m "V286: render four corrected constellation artworks [v286-assets-generated]"
          git push origin HEAD:feature/v286-verified-constellation-artwork
