name: AREG access pilot isolated tests
on:
  push:
    branches:
      - feature/areg-test-access-approval-design-20261109
    paths:
      - 'access-pilot/**'
      - '.github/workflows/areg-access-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test access-pilot/*.test.mjs
