name: Reward Worlds 3D Standalone Preview
on:
  pull_request:
    paths:
      - reward-worlds-real3d-five.html
      - qa/reward-worlds-3d.browser.mjs
      - .github/workflows/reward-worlds-preview.yml
  workflow_dispatch:
jobs:
  chrome-threejs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: node --check qa/reward-worlds-3d.browser.mjs
      - run: node qa/reward-worlds-3d.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: areg-reward-worlds-chromium
          path: reward-preview-screenshots/
          if-no-files-found: ignore
  ios-webkit-threejs:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - run: AREG_BROWSER=webkit node qa/reward-worlds-3d.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: areg-reward-worlds-webkit
          path: reward-preview-screenshots/
          if-no-files-found: ignore
