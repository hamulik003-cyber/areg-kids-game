name: Localize horse and camel narration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-horse-camel-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download final Armenian narration
        env:
          HORSE_URL: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/16572231-6393-49b9-8b81-e0bf21d6924b/AREG_horse_Armenian_final.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmNkODRjNzI5ZTE1YTQ0OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTI5NTQ3NH0.CRmxoWFAXOIoR6n-2DArPLfs6RU7DlZdvz3ONFhs32A"
          CAMEL_URL: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/8b294c49-6e16-4638-88e1-e276a6950afa/AREG_camel_Armenian_final.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWQ5OTYxN2U4OTkxM2FkMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMwNjg3OH0.qS2qQJg9ypodcO2C8qC18hjwsOf7bIeEyLo-ztZM5Fs"
        run: |
          set -euo pipefail
          mkdir -p audio/animals
          curl -fL --retry 3 --retry-delay 2 "$HORSE_URL" -o audio/animals/horse-voice.mp3
          curl -fL --retry 3 --retry-delay 2 "$CAMEL_URL" -o audio/animals/camel-voice.mp3
          test -s audio/animals/horse-voice.mp3
          test -s audio/animals/camel-voice.mp3
          file audio/animals/horse-voice.mp3
          file audio/animals/camel-voice.mp3

      - name: Commit local narration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/animals/horse-voice.mp3 audio/animals/camel-voice.mp3
          git commit -m "Localize horse and camel Armenian narration" || exit 0
          git push origin main
