<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Կառուցիր կամուրջը 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}body{background:#193d56;color:white}#app{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px}#hud,#buttons{display:flex;justify-content:space-between;gap:7px;align-items:center}#hud span,button{font:800 14px system-ui;background:linear-gradient(#fff0c9,#d6a16b);border:3px solid #e9c28c;border-radius:14px;color:#754724;padding:10px}#title{font-weight:900;text-align:center}#view{position:relative;flex:1;min-height:230px;border:5px solid #c79761;border-radius:24px;overflow:hidden;background:radial-gradient(#93c3d4,#3d789b 80%)}canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:absolute;left:8px;right:8px;top:12px;text-align:center;font-weight:900;text-shadow:0 2px 5px #0008;pointer-events:none}#buttons button{flex:1}#buttons #test{background:linear-gradient(#b9fa93,#43bb62);color:#205e32}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#102b43d0}#overlay.show{display:grid}.panel{text-align:center;border:7px solid #a7703d;border-radius:25px;background:linear-gradient(#fff1d0,#e1b077);color:#724421;padding:25px;max-width:330px}.panel h2{margin:8px}.panel .emoji{font-size:70px}#next{background:linear-gradient(#c5ff99,#42ba63)}</style></head><body><div id="app"><div id="hud"><span id="phase">Փուլ 1 / 5</span><div id="title">Կառուցիր կամուրջը 3D</div><span id="count">0 / 3</span></div><div id="view"><div id="tip">Սեղմիր բաց տեղին՝ կամրջի հատվածը տեղադրելու համար</div><div id="overlay"><div class="panel"><div class="emoji" id="award">⭐</div><h2 id="message">Կամուրջը պատրաստ է</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="buttons"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="test">🚗 Փորձարկել</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.domElement.style.position='absolute';renderer.domElement.style.inset=0;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe9faff,0x3c6681,2.5));const light=new THREE.DirectionalLight(0xffe5b7,3.2);light.position.set(-4,8,8);scene.add(light);
const root=new THREE.Group();scene.add(root);const wood=new THREE.MeshStandardMaterial({color:0xb17a48,roughness:.58}),woodEdge=new THREE.MeshStandardMaterial({color:0x80522d,roughness:.64}),water=new THREE.MeshStandardMaterial({color:0x3eaccc,metalness:.2,roughness:.2,transparent:true,opacity:.85}),grass=new THREE.MeshStandardMaterial({color:0x78b36c,roughness:.88}),gold=new THREE.MeshStandardMaterial({color:0xf0c477,metalness:.45,roughness:.33}),wheelMat=new THREE.MeshStandardMaterial({color:0x313a49,roughness:.67}),carMat=new THREE.MeshStandardMaterial({color:0xf56e75,metalness:.28,roughness:.26});
function box(w,h,d,m,x,y,z,parent=root){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
box(12,4,.3,water,0,-.35,-.65);for(const x of [-4.9,4.9]){box(2.2,5,.5,grass,x,-.1,-.36);box(2.1,.45,.45,woodEdge,x,0,.1)}for(let i=0;i<10;i++){const stripe=box(.04,3,.01,new THREE.MeshBasicMaterial({color:0xc3f3ff,transparent:true,opacity:.16}),-4.5+i,0,-.47);stripe.rotation.z=.13}
const slots=[],planks=[];let stage=0,filled=[],driving=false,carX=-5.5,won=false,last=0;const stages=[3,4,5,6,7];
const car=new THREE.Group();root.add(car);box(1.1,.42,.48,carMat,0,.6,.43,car);box(.58,.32,.46,carMat,-.07,.91,.43,car);for(const x of [-.38,.39])for(const z of [.16,.72]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.12,18),wheelMat);wheel.rotation.x=Math.PI/2;wheel.position.set(x,.35,z);car.add(wheel)}
function clearStage(){for(const a of [...slots,...planks]){root.remove(a);a.traverse(o=>{if(o.geometry)o.geometry.dispose()})}slots.length=0;planks.length=0}
function start(){clearStage();filled=[];driving=false;won=false;carX=-5.4;car.position.set(carX,0,0);$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#count').textContent='0 / '+stages[stage];$('#tip').textContent='Սեղմիր բաց տեղին՝ կամրջի հատվածը տեղադրելու համար';const n=stages[stage],width=7.6/n;for(let i=0;i<n;i++){const x=-3.8+(i+.5)*width;const outline=box(width-.09,.12,.63,gold,x,0,.04);outline.material=gold.clone();outline.material.transparent=true;outline.material.opacity=.32;outline.userData.slot=i;slots.push(outline)}}
function put(i){if(driving||won||filled.includes(i))return;filled.push(i);const slot=slots[i];slot.visible=false;const plank=box(7.6/stages[stage]-.07,.38,.78,wood,slot.position.x,0,.27);plank.userData.slot=i;planks.push(plank);box(7.6/stages[stage]-.12,.07,.81,woodEdge,slot.position.x,-.18,.26,plank);$('#count').textContent=filled.length+' / '+stages[stage];if(filled.length===stages[stage])$('#tip').textContent='Կամուրջը պատրաստ է․ սեղմիր «Փորձարկել»'};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(driving||won)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(slots.filter(o=>o.visible),false)[0];if(hit)put(hit.object.userData.slot)});
$('#undo').onclick=()=>{if(driving||!filled.length)return;const i=filled.pop();const p=planks.pop();root.remove(p);slots[i].visible=true;$('#count').textContent=filled.length+' / '+stages[stage]};$('#hint').onclick=()=>{if(driving)return;const s=slots.find(o=>o.visible);if(!s)return;s.material.opacity=.9;setTimeout(()=>s.material.opacity=.32,800)};$('#reset').onclick=start;$('#next').onclick=()=>{stage=(stage+1)%5;start()};$('#test').onclick=()=>{if(driving)return;if(filled.length!==stages[stage]){$('#tip').textContent='Նախ տեղադրիր կամրջի բոլոր մասերը';return}driving=true;$('#tip').textContent='Մեքենան անցնում է կամրջով…'};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const tan=Math.tan(THREE.MathUtils.degToRad(18));camera.position.set(0,0,Math.max(7.4/tan,6.2/(tan*camera.aspect)));camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last||16)/1000);last=t;if(driving){carX+=dt*2.65;car.position.x=carX;car.position.y=.04*Math.sin(carX*6);if(carX>5.5){driving=false;won=true;$('#award').textContent=stage===4?'🏆':'⭐';$('#message').textContent=stage===4?'Բոլոր կամուրջները կառուցված են':'Մեքենան անվտանգ անցավ';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')}}renderer.render(scene,camera)}start();requestAnimationFrame(tick);
</script></body></html>
