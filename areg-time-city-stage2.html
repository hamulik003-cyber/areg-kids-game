<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Արեգ — Ժամանակի քաղաքը · Փուլ 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121b35;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top,10px);left:10px;right:10px;color:#fff4d8;display:flex;justify-content:space-between;align-items:center;font-weight:900;text-shadow:0 2px 5px #142036}button{touch-action:manipulation;border:2px solid #f9d59c;border-radius:18px;background:linear-gradient(#f8db96,#bf824c);color:#35243b;font-weight:900;font-size:20px;padding:13px;box-shadow:0 5px 0 #68422f}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;min-width:70px;height:68px}#puzzle{display:none;position:fixed;inset:0;background:#0d1424b9;align-items:center;justify-content:center;padding:16px}#panel{width:min(440px,95vw);border:5px solid #dfb477;border-radius:28px;background:linear-gradient(150deg,#344a6a,#18263f);padding:18px;color:white;text-align:center;box-shadow:0 18px 60px #000a}#panel h2{margin:4px 0 8px;color:#ffde92}#panel p{font-size:16px;line-height:1.5}#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}#choices button{font-size:19px;padding:12px 4px;min-height:62px}#feedback{min-height:28px;color:#b9ffcd}#restart{font-size:14px;padding:8px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="name">Փուլ 2 · Ժամանակի քաղաք</span><span id="stars">★ 0/6</span><button id="restart">↻</button></div><div id="controls"><div><button id="left">◀</button> <button id="right">▶</button></div><button id="jump">↑</button></div><div id="puzzle"><div id="panel"><h2 id="title"></h2><p id="instruction"></p><div id="choices"></div><div id="feedback"></div><button id="close">Փակել</button></div></div><script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,D=1,t=0,last=0,ground=0,scroll=0,x=75,y=0,vy=0,holdL=false,holdR=false,jump=false,done=[false,false,false,false,false,false],active=-1,step=0,attempt=[],feedback='',won=false;
const zones=[
{title:'Երկնային կայարան',hint:'Փոխիր երեք երկաթուղային սլաքները։ Հետևիր լույսերին՝ կապույտ, ոսկեգույն, կանաչ։',labels:['Կապույտ','Ոսկեգույն','Կանաչ'],target:[0,1,2],kind:'route',colors:['#8ed9ff','#ffdd83','#a2ffc3']},
{title:'Ժամացույցների սրահ',hint:'Յուրաքանչյուր ժամացույցի սլաքը դիր փայլող նշանի վրա՝ 3, 6, 9։',labels:['3','6','9','12'],target:[0,1,2],kind:'clock'},
{title:'Գոլորշու լաբորատորիա',hint:'Բացիր խողովակները ճիշտ հերթով, որ գոլորշին հասնի վերելակին։',labels:['Կարմիր','Կանաչ','Կապույտ'],target:[1,2,0],kind:'steam'},
{title:'Ճոճանակների գրադարան',hint:'Հիշիր լուսավոր զանգերի հաջորդականությունը՝ 🔔 🌙 ⭐։',labels:['🔔','🌙','⭐'],target:[0,1,2],kind:'music'},
{title:'Օդային այգիներ',hint:'Պտտիր երեք հայելիները, որպեսզի շողերը հասնեն սերմերին։',labels:['↗','→','↘'],target:[0,2,1],kind:'mirror'},
{title:'Ժամանակի սիրտը',hint:'Էներգետիկ օղակները դասավորիր՝ փոքր, միջին, մեծ։',labels:['Փոքր','Միջին','Մեծ'],target:[0,1,2],kind:'rings'}];
const palettes=[['#1a315a','#5c9fba','#d9d2a4'],['#142b43','#5a667e','#cba25e'],['#253e3d','#618775','#bd8865'],['#2b234f','#71629a','#bd91ad'],['#24475b','#74bca4','#f6a5a9'],['#141c43','#5953a0','#ffd789']];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);ground=H*.78;if(!y)y=ground-42}
addEventListener('resize',resize);resize();
function rect(a,b,w,h,col){g.fillStyle=col;g.fillRect(a,b,w,h)}
function circle(a,b,r,col){g.fillStyle=col;g.beginPath();g.arc(a,b,r,0,Math.PI*2);g.fill()}
function line(a,b,c,d,color,width=3){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function zoneAt(pos){return Math.max(0,Math.min(5,Math.floor(pos/1000)))}
function bg(z){const p=palettes[z],grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,p[0]);grad.addColorStop(.72,p[1]);grad.addColorStop(1,p[2]);rect(0,0,W,H,grad);for(let layer=0;layer<3;layer++){const rate=[.12,.24,.48][layer];for(let i=-1;i<Math.ceil(W/135)+2;i++){const wx=i*135-(scroll*rate%135),h=90+Math.sin(i*4+layer*5)*34+layer*48;rect(wx,ground-h,65,h,p[0]+(layer?'aa':'77'));if(z===0){rect(wx-9,ground-h-13,82,12,'#b6dcdf66');line(wx+12,ground-h,wx+12,ground-7,'#ffe8c755',2)}else if(z===1){circle(wx+33,ground-h+28,30,'#e5c77b66');circle(wx+33,ground-h+28,24,p[0]);line(wx+33,ground-h+28,wx+33+Math.cos(t*.5)*17,ground-h+28+Math.sin(t*.5)*17,'#ffdc9a',2)}else if(z===2){for(let j=0;j<3;j++)line(wx+10+j*20,ground-h,wx+10+j*20,ground,'#c9a077',5)}else if(z===3){rect(wx,ground-h-10,85,12,'#e7c0ad88');for(let j=0;j<4;j++)rect(wx+j*18,ground-h+6,12,40,'#e7c0ad66')}else if(z===4){circle(wx+30,ground-h,36,'#9ce8b777');circle(wx+30,ground-h-20,22,'#d2f9bd88')}else{circle(wx+32,ground-h,35,'#b8a7ff88');line(wx+32,ground-h,wx+32,ground,'#ffe7aa88',3)}}}for(let i=0;i<38;i++){let px=(i*119-scroll*.08)%(W+80);if(px<0)px+=W+80;circle(px,(i*53)%Math.max(80,ground-20),1.2+Math.sin(t*2+i)*.5,'#fff6d7aa')}rect(0,ground,W,H-ground,p[0]);rect(0,ground,W,12,p[2]);for(let i=0;i<W/40+1;i++)rect(i*40-(scroll%40),ground+18,24,3,'#ffffff19')}
function drawMechanic(z,cx){const cy=ground-76;g.save();g.translate(cx,cy);g.shadowColor='#ffdc8a';g.shadowBlur=20;circle(0,0,51,'#172e4b');g.shadowBlur=0;g.strokeStyle='#f6d59c';g.lineWidth=5;g.beginPath();g.arc(0,0,50,0,Math.PI*2);g.stroke();if(z===0){line(-27,10,29,-11,'#cda06a',8);line(0,5,0,-30,'#fff1b2',5)}if(z===1){for(let i=0;i<12;i++){const a=i*Math.PI/6;circle(Math.cos(a)*36,Math.sin(a)*36,2,'#ffe3a2')}line(0,0,20*Math.cos(t),20*Math.sin(t),'#f7c56b',4)}if(z===2){for(let i=0;i<3;i++)circle((i-1)*20,0,11,['#db967c','#a9e7a5','#8fcbe9'][i]);rect(-28,-29,56,6,'#b3c7bc')}if(z===3){for(let i=0;i<3;i++){line((i-1)*23,-32,(i-1)*23,0,'#ffdaae',2);circle((i-1)*23,4,10,'#f7bfc4')}}if(z===4){line(-28,28,28,-28,'#fff3ad',4);rect(-14,-10,28,15,'#9fd2ed');circle(0,24,8,'#d3ffc0')}if(z===5){for(let i=0;i<3;i++){g.strokeStyle=['#e7b5f9','#a8e8ff','#ffda92'][i];g.lineWidth=4;g.beginPath();g.ellipse(0,0,14+i*11,30+i*6,t*.3+i,0,Math.PI*2);g.stroke()}}g.restore();g.fillStyle='#fff1c6';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(done[z]?'✓':'✦',cx,cy-59)}
function drawHero(){const sx=x-scroll;g.save();g.translate(sx,y);g.fillStyle='#2e3750';rect(-13,22,10,20,'#31486d');rect(4,22,10,20,'#31486d');rect(-17,-2,34,29,'#61b2b4');circle(0,-19,19,'#e6ae80');g.fillStyle='#3c2c36';g.beginPath();g.arc(0,-24,20,Math.PI,2*Math.PI);g.fill();circle(-6,-18,2,'#262936');circle(7,-18,2,'#262936');g.restore()}
function draw(){let z=zoneAt(x);bg(z);for(let i=0;i<6;i++){const px=i*1000+760-scroll;if(px>-70&&px<W+70){drawMechanic(i,px);if(done[i]){for(let j=0;j<6;j++)circle(px+Math.cos(t+j)*75,ground-76+Math.sin(t+j)*52,2,'#ffe4a8')}}}for(let i=1;i<6;i++){const bx=i*1000-80-scroll;if(bx>-40&&bx<W+40){rect(bx,ground-150,20,150,done[i-1]?'#9ce9b777':'#b36b63');circle(bx+10,ground-159,22,done[i-1]?'#b6ffcb':'#ffd7a0')}}drawHero();g.textAlign='center';g.fillStyle='#fff6d6';g.font='bold 17px system-ui';g.fillText(zones[z].title,W/2,75);if(won){rect(0,0,W,H,'#101b36bb');g.font='bold 27px system-ui';g.fillText('Ժամանակի քաղաքը փրկված է!',W/2,H*.43);g.font='18px system-ui';g.fillText('Ապրե՛ս, Արեգ 🫶',W/2,H*.51)}}
function update(dt){t+=dt;if(won||active>=0)return;const dir=Number(holdR)-Number(holdL);const next=Math.max(24,Math.min(5970,x+dir*210*dt));const nextZone=zoneAt(next);if(nextZone>0&&!done[nextZone-1]&&next>nextZone*1000-110){x=nextZone*1000-110}else x=next;if(jump&&y>=ground-42){vy=-370;jump=false}vy+=980*dt;y=Math.min(ground-42,y+vy*dt);if(y===ground-42)vy=0;scroll=Math.max(0,Math.min(6000-W,x-W*.32));for(let i=0;i<6;i++){if(!done[i]&&Math.abs(x-(i*1000+760))<62){open(i);break}}}
function open(i){active=i;step=0;attempt=[];feedback='';$('puzzle').style.display='flex';$('title').textContent=zones[i].title;render()}
function render(){const z=zones[active];if(!z)return;$('instruction').textContent=z.hint+' ('+(step+1)+'/3)';$('feedback').textContent=feedback;const choices=$('choices');choices.innerHTML='';z.labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>choose(i);choices.appendChild(b)})}
function choose(v){if(active<0)return;const z=zones[active];if(v!==z.target[step]){feedback='Փորձիր նորից․ նայիր հուշմանը';step=0;render();return}step++;feedback='Ճիշտ է ✓';if(step===3){done[active]=true;$('stars').textContent='★ '+done.filter(Boolean).length+'/6';feedback='Ապրե՛ս, մեխանիզմը գործարկվեց!';if(active===5)won=true;setTimeout(()=>{if(active>=0)close()},550);return}render()}
function close(){$('puzzle').style.display='none';active=-1}
$('close').onclick=close;$('restart').onclick=()=>{x=75;y=0;vy=0;scroll=0;done.fill(false);won=false;close();$('stars').textContent='★ 0/6'};
for(const [id,key] of [['left','holdL'],['right','holdR']]){const b=$(id);const set=v=>{if(key==='holdL')holdL=v;else holdR=v};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>set(false))}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump=true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')holdL=true;if(e.key==='ArrowRight')holdR=true;if(e.key==='ArrowUp'||e.key===' ')jump=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')holdL=false;if(e.key==='ArrowRight')holdR=false});
function frame(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
