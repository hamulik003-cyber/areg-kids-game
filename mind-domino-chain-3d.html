<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Դոմինոյի կախարդական շղթան 3D</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}body{background:#173b57;color:white}#app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:8px}#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900}#hud span,button{background:linear-gradient(#fff0cd,#d5a16b);border:3px solid #b6804a;border-radius:14px;color:#704321;padding:10px;font:900 14px system-ui}#hud b{text-align:center;font-size:14px}#view{position:relative;flex:1;min-height:240px;overflow:hidden;border:5px solid #cb9760;border-radius:24px;background:radial-gradient(#9fc9d4,#417b97 72%,#214a66)}canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:absolute;left:10px;right:10px;top:10px;text-align:center;font-weight:850;text-shadow:0 2px 5px #0008;pointer-events:none}#buttons{display:flex;gap:7px}#buttons button{flex:1;padding:11px 4px}#buttons #play{background:linear-gradient(#b9ff97,#43bc60);color:#195c32;border-color:#d3ffb9}#overlay{position:absolute;inset:0;background:#102b43d2;display:none;align-items:center;justify-content:center;padding:20px}#overlay.show{display:flex}.panel{background:linear-gradient(#fff0ce,#e2b179);border:7px solid #a6703d;border-radius:25px;color:#714321;text-align:center;padding:24px;max-width:350px}.award{font-size:75px}.panel h2{margin:8px 0 18px}#next{background:linear-gradient(#baff97,#41bd61);border-color:#d4ffbb}@media(max-height:650px){#app{gap:4px}#buttons button{padding:6px 3px}#hud span{padding:6px}}</style></head><body><div id="app"><div id="hud"><span id="phase">Փուլ 1 / 5</span><b>Դոմինոյի կախարդական շղթան 3D</b><span id="count">0 / 8</span></div><div id="view"><div id="tip">Սեղմիր նշված տեղերին՝ դոմինոները տեղադրելու համար</div><div id="overlay"><div class="panel"><div class="award" id="award">⭐</div><h2 id="message">Շղթան ավարտված է</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="buttons"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="play">▶ Գործարկել</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#view'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.domElement.style.position='absolute';renderer.domElement.style.inset=0;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf9ff,0x28485d,2.6));const sun=new THREE.DirectionalLight(0xffe7ba,3.3);sun.position.set(-5,7,8);scene.add(sun);const rim=new THREE.DirectionalLight(0x9ae9ff,1.6);rim.position.set(5,4,-4);scene.add(rim);
const root=new THREE.Group();scene.add(root),wood=new THREE.MeshStandardMaterial({color:0xa87548,roughness:.64}),gold=new THREE.MeshStandardMaterial({color:0xeec37c,metalness:.52,roughness:.3}),colors=[0xf26d7b,0x58c6ed,0xf9c75c,0x94dca0,0xb69af5,0xf1a76c].map(c=>new THREE.MeshStandardMaterial({color:c,metalness:.18,roughness:.36}));const board=new THREE.Mesh(new THREE.BoxGeometry(10,10,.5),wood);board.position.z=-.46;root.add(board);const inner=new THREE.Mesh(new THREE.BoxGeometry(9.55,9.55,.12),new THREE.MeshStandardMaterial({color:0x487d85,roughness:.56}));inner.position.z=-.14;root.add(inner);
const counts=[8,10,12,14,16],dominoGeo=new THREE.BoxGeometry(.33,.94,.35),dotsMat=new THREE.MeshStandardMaterial({color:0xffeac0,metalness:.15,roughness:.42}),slotMat=new THREE.MeshStandardMaterial({color:0xf3d69e,transparent:true,opacity:.3});let stage=0,tiles=[],placed=[],playing=false,won=false,elapsed=0,tipTimer;
function curvePoints(n){const result=[];for(let i=0;i<n;i++){const t=i/(n-1),x=-3.8+t*7.6,y=Math.sin(t*Math.PI*(1.2+stage*.18))*1.8+Math.cos(t*Math.PI*2)*.25;result.push(new THREE.Vector2(x,y))}return result}
function start(){for(const t of tiles){root.remove(t.group);root.remove(t.slot)}tiles=[];placed=[];playing=false;won=false;elapsed=0;$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#count').textContent='0 / '+counts[stage];$('#tip').textContent='Սեղմիր նշված տեղերին՝ դոմինոները տեղադրելու համար';const points=curvePoints(counts[stage]);for(let i=0;i<points.length;i++){const p=points[i],next=points[Math.min(points.length-1,i+1)],prev=points[Math.max(0,i-1)],a=Math.atan2(next.y-prev.y,next.x-prev.x),group=new THREE.Group();group.position.set(p.x,p.y,.23);group.rotation.z=a-Math.PI/2;const pivot=new THREE.Group();group.add(pivot);const tile=new THREE.Mesh(dominoGeo,colors[(i+stage)%colors.length]);tile.position.y=.47;pivot.add(tile);for(const v of [-.18,.18]){const dot=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),dotsMat);dot.position.set(0,.47+v,.19);pivot.add(dot)}root.add(group);const slot=new THREE.Mesh(new THREE.CircleGeometry(.29,24),slotMat.clone());slot.position.set(p.x,p.y,.05);slot.userData.index=i;root.add(slot);group.visible=false;tiles.push({group,pivot,slot,placed:false,fall:0})}}
function place(i){if(playing||won||tiles[i].placed)return;tiles[i].placed=true;tiles[i].group.visible=true;tiles[i].slot.visible=false;placed.push(i);$('#count').textContent=placed.length+' / '+tiles.length;if(placed.length===tiles.length)$('#tip').textContent='Շղթան պատրաստ է․ սեղմիր «Գործարկել»'}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(playing||won)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(tiles.filter(t=>!t.placed).map(t=>t.slot),false)[0];if(hit)place(hit.object.userData.index)});
$('#undo').onclick=()=>{if(playing||!placed.length)return;const i=placed.pop();tiles[i].placed=false;tiles[i].group.visible=false;tiles[i].slot.visible=true;$('#count').textContent=placed.length+' / '+tiles.length};$('#hint').onclick=()=>{const t=tiles.find(x=>!x.placed);if(!t)return;t.slot.material.opacity=.9;clearTimeout(tipTimer);tipTimer=setTimeout(()=>t.slot.material.opacity=.3,850)};$('#reset').onclick=start;$('#next').onclick=()=>{stage=(stage+1)%5;start()};$('#play').onclick=()=>{if(playing||won)return;if(placed.length!==tiles.length){$('#tip').textContent='Նախ տեղադրիր բոլոր դոմինոները';return}playing=true;elapsed=0;$('#tip').textContent='Դոմինոները հերթով ընկնում են…'};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const t=Math.tan(THREE.MathUtils.degToRad(37/2));camera.position.set(0,0,Math.max(5.9/t,5.9/(t*camera.aspect)));camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let last=0;function tick(now){requestAnimationFrame(tick);const dt=Math.min(.04,(now-last||16)/1000);last=now;if(playing){elapsed+=dt;for(let i=0;i<tiles.length;i++){const local=(elapsed-i*.22)/.34;const p=Math.max(0,Math.min(1,local));tiles[i].pivot.rotation.x=-p*Math.PI*.48}if(elapsed>(tiles.length-1)*.22+.5){playing=false;won=true;$('#award').textContent=stage===4?'🏆':'⭐';$('#message').textContent=stage===4?'Բոլոր շղթաները կառուցված են':'Դոմինոյի շղթան հաջողվեց';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';setTimeout(()=>$('#overlay').classList.add('show'),400)}}renderer.render(scene,camera)}start();requestAnimationFrame(tick);
</script></body></html>
