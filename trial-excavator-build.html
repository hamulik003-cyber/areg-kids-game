:root{--top:calc(env(safe-area-inset-top,0px) + 12px)}*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Armenian",sans-serif;touch-action:manipulation}body{background:radial-gradient(ellipse at 50% 27%,#b4d4c9 0%,#709c9e 52%,#456b80 100%);color:#53301b}body:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff33,transparent 48%),radial-gradient(ellipse at 20% 90%,#f5b26e50,transparent 65%);pointer-events:none}.top{position:absolute;top:var(--top);left:9px;right:9px;display:grid;grid-template-columns:52px minmax(0,1fr) 63px;gap:7px;z-index:3}.wood{display:grid;place-items:center;min-height:46px;border:3px solid #ad6a32;border-radius:14px;background:linear-gradient(#ffe8b1,#f6bf72);box-shadow:0 4px 0 #824822,inset 0 2px 1px #fff8df;color:#5b3016;font-weight:900;text-decoration:none}.back{font-size:28px}.title{font-size:clamp(14px,4.05vw,20px);white-space:nowrap;letter-spacing:-.045em}.stars{font-size:19px}.layout{position:absolute;inset:calc(var(--top) + 65px) 0 0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 12px);gap:7px}.status{color:#fff9df;text-shadow:0 2px 5px #314e5d;font-size:15px;font-weight:850;text-align:center}.progress{display:flex;justify-content:center;gap:9px;margin-top:7px}.progress span{width:10px;height:10px;border-radius:50%;background:#e1e4d9a0}.progress span.on{background:#ffe49d;box-shadow:0 0 9px #fff6be}.garage{width:min(97vw,500px);position:relative;aspect-ratio:1/1.05;max-height:57vh;border:6px solid #c08a4e;border-radius:23px;background:radial-gradient(ellipse at 50% 60%,#e8c99d 0%,#b6ac91 56%,#7898a0 100%);box-shadow:0 14px 32px #26465d8c,inset 0 0 0 3px #f6d4a1;overflow:hidden}.garage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 17%,#ffffff14 17.2% 17.7%),linear-gradient(transparent 74%,#876a50 74.3%,#7b6554 100%)}.garage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.part{transition:opacity .35s ease,transform .65s cubic-bezier(.18,.95,.23,1.08);transform-box:fill-box;transform-origin:center;opacity:.15;filter:grayscale(1)}.part.fitted{opacity:1;filter:none}.part.animate-in{animation:fit .55s cubic-bezier(.16,1.2,.25,1)}@keyframes fit{from{opacity:.3;transform:translate(0,-45px) scale(.75)}to{opacity:1;transform:translate(0,0) scale(1)}}.outline{fill:none;stroke:#fff4c8;stroke-width:3;stroke-dasharray:9 7;opacity:.7}.garage.running #boom{animation:arm 1.6s ease-in-out infinite alternate;transform-origin:61% 54%}.garage.running #bucket{animation:scoop 1.6s ease-in-out infinite alternate;transform-origin:70% 45%}.garage.running #track .links{animation:tracks .5s linear infinite}.garage.running #bodyMachine{animation:idle .35s ease-in-out infinite alternate}@keyframes arm{to{transform:rotate(-12deg)}}@keyframes scoop{to{transform:rotate(14deg)}}@keyframes tracks{to{stroke-dashoffset:-25}}@keyframes idle{to{transform:translateY(-2px)}}.tray{width:min(97vw,500px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border:4px solid #d49c5d;border-radius:20px;background:linear-gradient(#9a663e,#76482f);box-shadow:0 10px 20px #26465b77}.tile{border:2px solid #f8d6a0;border-radius:12px;min-width:0;aspect-ratio:1;background:linear-gradient(145deg,#ffe9b5,#eab06a);display:grid;place-items:center;box-shadow:0 4px 0 #6c3d21;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}.tile svg{width:90%;height:90%;overflow:visible;filter:drop-shadow(1px 4px 2px #65462d55)}.tile.done{opacity:.28;pointer-events:none}.tile.pick{outline:4px solid #b8ffc4}.tile small{position:absolute;bottom:2px;font-size:9px;font-weight:800;color:#603b23}.hint{font-size:13px;color:#fff8df;text-align:center;text-shadow:0 2px 3px #385568;line-height:1.3}.control{border:3px solid #d5edba;background:linear-gradient(#68c976,#328e4b);color:white;font-weight:900;border-radius:14px;padding:11px 20px;font-size:17px;box-shadow:0 5px 0 #246e39;display:none}.control.visible{display:block}.floating{position:fixed;z-index:10;pointer-events:none;width:86px;height:86px;display:grid;place-items:center;border:3px solid #fff1bc;border-radius:15px;background:#f5c780;box-shadow:0 8px 24px #142d4d88;transform:translate(-50%,-50%)}.floating svg{width:85%;height:85%}.msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff0c9;padding:14px 18px;border:3px solid #bd8247;border-radius:15px;font-size:19px;font-weight:900;display:none;z-index:4;text-align:center;box-shadow:0 12px 25px #30465a88}.msg.show{display:block}@media(max-height:670px){.garage{max-height:48vh;width:min(82vw,410px)}.tray{padding:5px}.hint{font-size:11px}.layout{gap:2px}}
</style></head><body><header class="top"><a class="wood back" href="index.html" aria-label="Հետ">←</a><div class="wood title">Գործարկիր մեքենան</div><div class="wood stars">⭐ 0</div></header><main class="layout"><div class="status"><span id="stage">Տեղադրիր մեքենայի մասերը՝ 0/4</span><div class="progress" id="progress"></div></div><div class="garage" id="garage"><svg viewBox="0 0 400 420" aria-label="Հավաքվող էքսկավատոր" role="img"><defs><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe076"/><stop offset=".52" stop-color="#f5b524"/><stop offset="1" stop-color="#c98312"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6e7e9"/><stop offset="1" stop-color="#477a91"/></linearGradient><linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#667887"/><stop offset="1" stop-color="#27343f"/></linearGradient><filter id="shadow"><feDropShadow dx="1" dy="5" stdDeviation="4" flood-opacity=".27"/></filter></defs><ellipse cx="200" cy="341" rx="150" ry="24" fill="#403b3350"/><ellipse cx="200" cy="351" rx="169" ry="30" fill="#b07c4d" stroke="#e6b47a" stroke-width="7"/><g id="track" class="part"><rect x="86" y="285" width="235" height="54" rx="26" fill="#29323a" stroke="#121c24" stroke-width="7"/><rect x="103" y="294" width="201" height="35" rx="18" fill="#505b60"/><path class="links" d="M101 311H307" stroke="#c6c8bc" stroke-width="6" stroke-dasharray="12 12"/><circle cx="123" cy="312" r="16" fill="#829094" stroke="#202e36" stroke-width="5"/><circle cx="283" cy="312" r="16" fill="#829094" stroke="#202e36" stroke-width="5"/><circle cx="164" cy="312" r="12" fill="#3b4b54"/><circle cx="202" cy="312" r="12" fill="#3b4b54"/><circle cx="242" cy="312" r="12" fill="#3b4b54"/></g><g id="bodyMachine" class="part" filter="url(#shadow)"><path d="M100 259 Q101 238 124 235 H278 Q301 235 306 254 L317 284 Q316 295 302 295 H105 Q91 292 100 259Z" fill="url(#yellow)" stroke="#bd7a14" stroke-width="5"/><path d="M230 245 L277 245 L291 280 L235 280Z" fill="#dd941d"/><rect x="112" y="268" width="103" height="9" rx="4" fill="#ffed9c"/><circle cx="190" cy="282" r="9" fill="#b16a14" stroke="#fce3a0" stroke-width="3"/></g><g id="cabin" class="part" filter="url(#shadow)"><path d="M139 237 L148 145 Q149 132 165 132 H226 Q240 132 242 146 L257 237Z" fill="url(#yellow)" stroke="#b87916" stroke-width="6"/><path d="M161 148 H224 L233 213 H154Z" fill="url(#glass)" stroke="#384d57" stroke-width="7"/><path d="M191 147 L190 215" stroke="#354b56" stroke-width="6"/><path d="M151 220 H242" stroke="#6f4c23" stroke-width="7"/><rect x="166" y="224" width="24" height="7" rx="3" fill="#fff0a1"/></g><g id="boom" class="part" filter="url(#shadow)"><path d="M244 242 L266 163 L312 117 Q326 109 338 122 L344 133 Q346 142 336 149 L294 191 L282 251Z" fill="url(#yellow)" stroke="#b87516" stroke-width="6"/><path d="M283 175 L315 133" stroke="#fff0a4" stroke-width="8" stroke-linecap="round"/><path d="M291 193 L323 220" stroke="#64707b" stroke-width="10" stroke-linecap="round"/><circle cx="265" cy="237" r="13" fill="#5b6771" stroke="#e2b75c" stroke-width="5"/><circle cx="331" cy="132" r="10" fill="#5b6771" stroke="#e2b75c" stroke-width="4"/></g><g id="bucket" class="part" filter="url(#shadow)"><path d="M323 214 Q351 191 369 210 L379 244 Q369 270 338 270 L320 254Z" fill="url(#metal)" stroke="#222f39" stroke-width="5"/><path d="M334 269 L344 280 L350 269 L359 279 L366 263" fill="#414b51" stroke="#222f39" stroke-width="3"/><circle cx="329" cy="219" r="8" fill="#a2adb1" stroke="#36424b" stroke-width="4"/></g></svg><div class="msg" id="msg"></div></div><div class="tray" id="tray"></div><div class="hint" id="hint">Սեղմիր մասի վրա, հետո՝ մեքենայի վրա։ Կամ քաշիր մասը մեքենայի վրա։</div><button id="start" class="control">▶ Գործարկել</button><button id="again" class="control">↻ Կրկնել</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),parts=[{id:'track',label:'Թրթուր',icon:'<rect x="8" y="23" width="76" height="36" rx="18" fill="#29323a" stroke="#65747b" stroke-width="5"/><circle cx="24" cy="41" r="10" fill="#89959c"/><circle cx="68" cy="41" r="10" fill="#89959c"/>'},{id:'bodyMachine',label:'Հիմք',icon:'<path d="M12 50 L18 24 Q20 16 32 16 H73 L85 49Z" fill="#f2ae23" stroke="#a36a18" stroke-width="5"/><rect x="22" y="32" width="48" height="7" rx="3" fill="#ffe7a0"/>'},{id:'cabin',label:'Խցիկ',icon:'<path d="M21 70 L26 13 Q28 7 37 7 H66 Q75 7 76 16 L82 70Z" fill="#f2b127" stroke="#ad7819" stroke-width="5"/><path d="M36 17 H66 L71 52 H31Z" fill="#7db9c8" stroke="#394e58" stroke-width="5"/>'},{id:'boom',label:'Շերեփ',icon:'<path d="M13 76 L31 34 L67 11 Q75 6 81 16 L82 23 L51 48 L39 80Z" fill="#f2b127" stroke="#a56c18" stroke-width="5"/><path d="M67 44 Q87 36 91 53 L86 73 L70 76Z" fill="#48525d"/>'}];let step=0,drag=null,selected=null,running=false;const tray=$('tray'),garage=$('garage');function draw(){tray.innerHTML='';parts.forEach((p,i)=>{const el=document.createElement('div');el.className='tile'+(i<step?' done':'');el.dataset.index=i;el.innerHTML='<svg viewBox="0 0 100 90">'+p.icon+'</svg><small>'+p.label+'</small>';el.addEventListener('pointerdown',down);el.addEventListener('click',()=>{if(i===step)choose(i)});tray.append(el)});$('progress').innerHTML=parts.map((_,i)=>'<span class="'+(i<step?'on':'')+'"></span>').join('');$('stage').textContent=step<4?'Տեղադրիր մեքենայի մասերը՝ '+step+'/4':'Մեքենան պատրաստ է՛';$('start').classList.toggle('visible',step===4&&!running);$('again').classList.toggle('visible',running)}function choose(i){if(i!==step)return;selected=i;tray.querySelectorAll('.tile').forEach(t=>t.classList.toggle('pick',+t.dataset.index===i));$('hint').textContent='Հիմա սեղմիր մեքենայի վրա՝ մասը տեղադրելու համար։'}function fit(i){if(i!==step||running)return;const el=$(parts[i].id);el.classList.add('fitted','animate-in');el.addEventListener('animationend',()=>el.classList.remove('animate-in'),{once:true});step++;selected=null;$('hint').textContent=step===4?'Բոլոր մասերը տեղում են։ Գործարկի՛ր մեքենան։':'Հաջորդ մասը տեղադրիր մեքենայի վրա։';draw();if(step===4){$('msg').textContent='✨ Ապրե՜ս։';$('msg').classList.add('show');setTimeout(()=>$('msg').classList.remove('show'),1100)}}garage.addEventListener('click',()=>{if(selected!==null)fit(selected)});function down(e){const i=+e.currentTarget.dataset.index;if(i!==step)return;choose(i);if(e.pointerType==='mouse'&&e.button!==0)return;const t=e.currentTarget,clone=document.createElement('div');clone.className='floating';clone.innerHTML=t.querySelector('svg').outerHTML;document.body.append(clone);drag={i,id:e.pointerId,clone};clone.style.left=e.clientX+'px';clone.style.top=e.clientY+'px';t.setPointerCapture(e.pointerId);t.addEventListener('pointermove',move);t.addEventListener('pointerup',up,{once:true});t.addEventListener('pointercancel',up,{once:true})}function move(e){if(!drag||e.pointerId!==drag.id)return;drag.clone.style.left=e.clientX+'px';drag.clone.style.top=e.clientY+'px'}function up(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;d.clone.remove();drag=null;const box=garage.getBoundingClientRect();if(e.clientX>=box.left&&e.clientX<=box.right&&e.clientY>=box.top&&e.clientY<=box.bottom)fit(d.i)}$('start').onclick=()=>{running=true;garage.classList.add('running');$('hint').textContent='Մեքենան աշխատո՜ւմ է։';$('msg').textContent='🚜 Բռա՛վո։';$('msg').classList.add('show');setTimeout(()=>$('msg').classList.remove('show'),1300);draw()};$('again').onclick=()=>{running=false;step=0;selected=null;garage.classList.remove('running');parts.forEach(p=>$(p.id).classList.remove('fitted','animate-in'));$('hint').textContent='Սեղմիր մասի վրա, հետո՝ մեքենայի վրա։ Կամ քաշիր մասը մեքենայի վրա։';draw()};draw()})();
</script></body></html>
