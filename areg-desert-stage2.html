}function activateNewPuzzle(){if(!ready||puzzleSolved)return;const a=[3760,3832,3904],i=a.findIndex(x=>Math.abs(heroX-x)<33);if(i<0)return;if(i===puzzleStep){puzzleStep++;sound('star');if(puzzleStep===3){puzzleSolved=true;liftClock=0;message.textContent='Վերելակներն ակտիվացան';setTimeout(()=>{if(message.textContent==='Վերելակներն ակտիվացան')message.textContent=''},2200)}}else{puzzleStep=0;sound('hit');message.textContent='Փորձիր ճիշտ հերթականությամբ';setTimeout(()=>{if(message.textContent==='Փորձիր ճիշտ հերթականությամբ')message.textContent=''},1500)}}function myValue(){return ground-120+Math.sin(tt*1.7)*28}function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function jump(){if(!ready)return;jumpBuffer=.15}document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#act').addEventListener('pointerdown',e=>{e.preventDefault();if(!ready)return;if(Math.abs(heroX-2067)<85&&!gate){plate=true;gate=true;sound('switch');message.textContent='Կամուրջը կառուցվում է';setTimeout(()=>message.textContent='',2200)}else activateNewPuzzle()});const stick=document.querySelector('#stick');function steer(e){const r=stick.getBoundingClientRect(),v=(e.clientX-(r.left+r.width/2))/(r.width*.36);axis=Math.abs(v)<.2?0:Math.max(-1,Math.min(1,v));knob.style.transform='translateX('+axis*30+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);steer(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))steer(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,()=>{axis=0;knob.style.transform='translateX(0)'});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')axis=1;if(e.key==='ArrowLeft'||e.key==='a')axis=-1;if(e.code==='Space')jump();if(e.key==='e'){if(!gate&&Math.abs(heroX-2067)<85){plate=true;gate=true;sound('switch'
