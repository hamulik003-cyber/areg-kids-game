<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Արեգ — Անապատի գաղտնիքը · Փուլ 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7b66b;font-family:system-ui;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}*,*::before,*::after{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none;color:#fff7d7;font-weight:900;text-shadow:0 2px 6px #65381c}#status{position:absolute;top:14px;left:16px;font-size:15px}#stick{position:absolute;bottom:20px;left:18px;width:116px;height:116px;border:3px solid #fff2ca99;border-radius:50%;background:#76513955;pointer-events:auto;display:grid;place-items:center;touch-action:none}#knob{width:55px;height:55px;border-radius:50%;border:3px solid #fff2ce;background:radial-gradient(circle at 30% 20%,#ffe8a2,#b97938);box-shadow:0 3px 12px #0006;pointer-events:none}#jump,#act{position:absolute;bottom:22px;right:18px;width:76px;height:76px;border-radius:50%;border:3px solid #fff0c5;background:linear-gradient(#ffe3a2,#d79448);color:#6b3d20;font-size:29px;font-weight:900;pointer-events:auto}#act{right:106px;bottom:35px;width:62px;height:62px;font-size:24px}#message{position:absolute;left:50%;top:14%;transform:translateX(-50%);text-align:center;max-width:90%;font-size:18px;white-space:nowrap}#end{position:absolute;inset:0;background:#281b34bd;display:none;place-items:center;color:white;text-align:center}#end article{background:linear-gradient(#72517b,#302d4f);border:3px solid #f6d494;border-radius:22px;padding:24px;max-width:88%}#end button{background:#f8d68a;color:#5c361e;border:0;border-radius:14px;padding:14px 24px;font-weight:900;font-size:18px}</style></head><body><canvas id="scene"></canvas><div id="hud"><div id="status">☀ Փուլ 2 · Անապատի գաղտնիքը</div><div id="message"></div><div id="stick"><div id="knob"></div></div><button id="act" aria-label="Գործարկել">⚙</button><button id="jump" aria-label="Ցատկել">↑</button></div><div id="end"><article><h2>🌟 Ապրես, Արեգ</h2><p>Անապատի դարպասը բացվեց։</p><button onclick="location.reload()">Կրկին խաղալ ▶</button></article></div><script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),g=canvas.getContext('2d'),message=document.querySelector('#message'),knob=document.querySelector('#knob');let w=0,h=0,dpr=1,ground=0,tt=0,last=0,scroll=0,heroX=135,heroY=0,vy=0,axis=0,face=1,run=0,ready=false,opening=0,arrival=0,closing=0,intro='opening',jumpBuffer=0,coyote=0,checkpoint=135,gate=false,plate=false,crystal=false,won=false;const WIDTH=3100,doorX=60;const sprite=new Image();sprite.src='./a_high_resolution_cutout_png_style_illustration_on.png';const atlases=['./assets/areg-run/stride-front-v1.png','./assets/areg-run/stride-recovery-v1.png'].map(src=>{const im=new Image();im.src=src;return im});const poses=[{a:0,c:0,s:.18,anchor:220,foot:500},{a:0,c:1,s:.18,anchor:220,foot:500},{a:1,c:0,s:.135,anchor:300,foot:660},{a:1,c:1,s:.135,anchor:300,foot:660},{a:1,c:2,s:.135,anchor:300,foot:660},{a:1,c:3,s:.135,anchor:300,foot:660},{a:0,c:2,s:.18,anchor:227,foot:500},{a:0,c:3,s:.18,anchor:235,foot:500}];const ledges=[{x:510,y:-75,len:160},{x:690,y:-145,len:160},{x:1090,y:-92,len:160},{x:1590,y:-78,len:135},{x:1860,y:-125,len:150},{x:2320,y:-90,len:150}],gaps=[{x:450,len:410},{x:1250,len:175},{x:2100,len:180}],stars=[{x:585,y:-125},{x:765,y:-195},{x:1160,y:-140},{x:1670,y:-128},{x:1930,y:-174},{x:2390,y:-140}].map(s=>({...s,taken:false}));const cacti=[{x:310,h:75,kind:0},{x:1030,h:105,kind:1},{x:1180,h:63,kind:2},{x:1735,h:89,kind:3},{x:2020,h:112,kind:4},{x:2475,h:70,kind:5},{x:2630,h:95,kind:6},{x:2900,h:81,kind:7}];function drawCactus(c){const x=c.x-scroll,y=ground,h=c.h;if(x<-70||x>w+70)return;g.save();g.translate(x,y);const shades=['#39835b','#32785d','#518c62','#29735a','#4b916b','#34765a','#518466','#3c8865'];const color=shades[c.kind];g.lineCap='round';g.strokeStyle='#235f4c';g.lineWidth=17;g.beginPath();g.moveTo(0,0);g.lineTo(0,-h);g.stroke();g.strokeStyle=color;g.lineWidth=12;g.stroke();if(c.kind!==2){const left=-1*(15+(c.kind%3)*6),right=14+(c.kind%2)*9;g.strokeStyle=color;g.lineWidth=10;g.beginPath();g.moveTo(0,-h*.4);g.quadraticCurveTo(left,-h*.38,left,-h*(.66+(c.kind%2)*.12));g.stroke();if(c.kind!==5){g.beginPath();g.moveTo(0,-h*.58);g.quadraticCurveTo(right,-h*.53,right,-h*(.78-(c.kind%3)*.05));g.stroke()}}g.strokeStyle='#b5d99a99';g.lineWidth=1.5;for(let j=-4;j<=4;j+=4){g.beginPath();g.moveTo(j,-8);g.lineTo(j,-h+7);g.stroke()}if(c.kind===2||c.kind===6){circle(0,-h-3,5,c.kind===2?'#f5d08a':'#e8a5a1')}g.restore()}let movingX=1460;function resize(){const old=ground;w=canvas.clientWidth;h=canvas.clientHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);ground=h*.77;if(old)heroY+=ground-old;else heroY=ground-36}addEventListener('resize',resize);resize();heroX=doorX+42;heroY=ground-36;function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function box(x,y,a,b,c){g.fillStyle=c;g.fillRect(x,y,a,b)}function dune(offset,speed,base,color,amp){g.beginPath();g.moveTo(-50,h);for(let x=-50;x<=w+60;x+=8){const world=x+scroll*speed+offset;const yy=base+Math.sin(world/260)*amp+Math.sin(world/113+1.5)*amp*.22;g.lineTo(x,yy)}g.lineTo(w+60,h);g.closePath();g.fillStyle=color;g.fill()}function drawDoor(x,op){const y=ground;g.save();g.translate(x,0);g.fillStyle='#ac7858';g.beginPath();g.moveTo(-16,y);g.lineTo(-16,y-148);g.quadraticCurveTo(42,y-237,100,y-148);g.lineTo(100,y);g.closePath();g.fill();g.strokeStyle='#f4d49a';g.lineWidth=5;g.stroke();g.fillStyle='#3e4c65';g.beginPath();g.moveTo(0,y);g.lineTo(0,y-143);g.quadraticCurveTo(42,y-203,84,y-143);g.lineTo(84,y);g.fill();g.save();g.translate(42+op*33,0);g.scale(Math.max(.07,1-op*.9),1);g.fillStyle='#32778b';g.beginPath();g.moveTo(-40,y);g.lineTo(-40,y-143);g.quadraticCurveTo(0,y-194,40,y-143);g.lineTo(40,y);g.closePath();g.fill();g.strokeStyle='#f5d79a';g.lineWidth=3;g.stroke();circle(23,y-65,4,'#f6d07c');g.restore();g.restore()}function drawHero(){g.save();g.translate(heroX-scroll,heroY+36);if(face<0)g.scale(-1,1);const loaded=atlases.every(im=>im.complete&&im.naturalWidth>0);if(loaded){const i=Math.abs(axis)>.08&&ready&&vy===0?Math.floor(run/8.5)%poses.length:1,p=poses[i],im=atlases[p.a],cw=im.naturalWidth/4,ch=p.a===0?im.naturalHeight/2:im.naturalHeight;g.drawImage(im,p.c*cw,0,cw,ch,-p.anchor*p.s,-ch*p.s,cw*p.s,ch*p.s)}else if(sprite.complete&&sprite.naturalWidth)g.drawImage(sprite,-35,-90,70,90);g.restore()}function update(dt){tt+=dt;movingX=1470+Math.sin(tt*1.1)*92;if(intro!=='done'){if(intro==='opening'){opening=Math.min(1,opening+dt*.5);if(opening===1)intro='appearing'}else if(intro==='appearing'){arrival=Math.min(1,arrival+dt*.65);if(arrival===1)intro='walking'}else if(intro==='walking'){heroX=Math.min(doorX+140,heroX+dt*43);run+=dt*43;if(heroX>=doorX+140)intro='closing'}else if(intro==='closing'){closing=Math.min(1,closing+dt*.55);if(closing===1){intro='done';ready=true;message.textContent='Գտիր արևի բյուրեղը և բացիր դարպասը';setTimeout(()=>message.textContent='',3500)}}return}if(won)return;const oldY=heroY,oldX=heroX;heroX=Math.max(30,Math.min(WIDTH-80,heroX+axis*200*dt));if(axis){face=Math.sign(axis);run+=Math.abs(heroX-oldX)}vy+=1100*dt;heroY+=vy*dt;let surface=ground-36;for(const p of ledges){const y=ground+p.y;if(heroX>p.x-18&&heroX<p.x+p.len+18&&oldY+36<=y+10&&heroY+36>=y&&vy>=0)surface=Math.min(surface,y-36)}const my=ground-120+Math.sin(tt*1.7)*28;if(heroX>movingX-22&&heroX<movingX+120&&oldY+36<=my+14&&heroY+36>=my&&vy>=0)surface=Math.min(surface,my-36);const overGap=gaps.some(p=>heroX>p.x+7&&heroX<p.x+p.len-7)&&!(gate&&heroX>2100&&heroX<2280);if(heroY>=surface&&vy>=0&&(!overGap||surface<ground-36)){heroY=surface;vy=0;coyote=.12}else coyote=Math.max(0,coyote-dt);if(jumpBuffer>0&&coyote>0){vy=-520;jumpBuffer=0;coyote=0}jumpBuffer=Math.max(0,jumpBuffer-dt);if(heroY>h+80){heroX=checkpoint;heroY=ground-36;vy=0}if(heroX>1500)checkpoint=1490;if(heroX>2300)checkpoint=2300;for(const s of stars){if(!s.taken&&Math.abs(heroX-s.x)<35&&Math.abs(heroY-(ground+s.y))<55)s.taken=true}if(!crystal&&Math.abs(heroX-1990)<48&&Math.abs(heroY-(ground-175))<65){crystal=true;message.textContent='☀ Արևի բյուրեղը գտնված է';setTimeout(()=>message.textContent='',2500)}if(heroX>2690&&crystal&&gate){won=true;document.querySelector('#end').style.display='grid'}scroll+=(Math.max(0,Math.min(WIDTH-w,heroX-w*.3))-scroll)*Math.min(1,dt*4)}function draw(){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#4f9fc5');sky.addColorStop(.52,'#b8d7cf');sky.addColorStop(1,'#ffe4a1');box(0,0,w,h,sky);const sunX=w*.76-scroll*.055;g.save();g.shadowColor='#fff2ad';g.shadowBlur=40;circle(sunX,ground*.2,35,'#fff0ac');g.restore();dune(0,.08,ground*.51,'#d6ac79',52);dune(140,.19,ground*.61,'#e6b975',48);dune(40,.38,ground*.73,'#edbe70',34);const sand=g.createLinearGradient(0,ground,0,h);sand.addColorStop(0,'#eac078');sand.addColorStop(1,'#a9693e');box(0,ground,w,h-ground,sand);box(0,ground,w,12,'#f6d69a');box(0,ground+12,w,5,'#c28b52');for(let k=0;k<Math.ceil(w/120)+2;k++){const sx=k*120-scroll%120;g.strokeStyle='#9d6a3e66';g.lineWidth=2;g.beginPath();g.moveTo(sx,ground+28);g.quadraticCurveTo(sx+40,ground+22,sx+92,ground+30);g.stroke()}for(let i=Math.floor(scroll/75)-1;i<(scroll+w)/75+2;i++){const x=i*75-scroll;circle(x+11,ground+22+(i%3)*13,2,'#f8dba088');g.strokeStyle='#b9885688';g.beginPath();g.moveTo(x,ground+34);g.lineTo(x+27,ground+34);g.stroke()}for(const p of gaps){const x=p.x-scroll;box(x,ground,p.len,h-ground,'#8b4a36');for(let k=0;k<4;k++)circle(x+(k*43+tt*14)%p.len,ground+12+Math.sin(tt*2+k)*5,4,'#f3a05e')}for(const cactus of cacti)drawCactus(cactus);if(gate){box(2100-scroll,ground-7,180,15,'#a67949');for(let k=0;k<8;k++)box(2100-scroll+k*23,ground-9,21,12,'#f3d18e')}for(const p of ledges){const x=p.x-scroll,y=ground+p.y;box(x,y,p.len,19,'#a77852');box(x,y,p.len,6,'#ffe2a0');for(let j=12;j<p.len;j+=25)circle(x+j,y+13,3,'#e3b579')}box(movingX-scroll,myValue(),120,16,'#ad7850');box(movingX-scroll,myValue(),120,5,'#ffe5a4');for(const s of stars)if(!s.taken){const x=s.x-scroll,y=ground+s.y;g.save();g.translate(x,y);g.rotate(tt*.45);g.fillStyle='#fff0a0';g.shadowColor='#ffe088';g.shadowBlur=12;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?6:15;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}if(!crystal){g.save();g.translate(1990-scroll,ground-175);g.rotate(tt*.6);g.fillStyle='#e6f7e6';g.shadowColor='#fff6c0';g.shadowBlur=22;g.beginPath();g.moveTo(0,-22);g.lineTo(16,0);g.lineTo(0,22);g.lineTo(-16,0);g.closePath();g.fill();g.restore()}const px=2040-scroll;box(px,ground-18,70,18,plate?'#72cfa8':'#b77d4c');box(px+8,ground-21,54,5,'#ffe1a0');g.fillStyle='#754c31';g.font='bold 14px system-ui';g.fillText('☀',px+30,ground-30);if(!gate){box(2100-scroll,ground-145,22,145,'#976b4b');circle(2111-scroll,ground-155,18,'#f8d394')}drawDoor(doorX-scroll,opening*(1-closing));drawDoor(2740-scroll,0);if(intro!=='opening'){g.save();g.globalAlpha=.22;g.fillStyle='#70462e';g.beginPath();g.ellipse(heroX-scroll,ground+6,27,7,0,0,Math.PI*2);g.fill();g.restore()}if(intro==='opening'){}else if(intro==='appearing'){g.save();g.globalAlpha=arrival;drawHero();g.restore()}else drawHero();g.fillStyle='#fff7d9';g.font='bold 14px system-ui';g.textAlign='center';g.fillText(heroX<1300?'Ավազե բլուրներ':heroX<2200?'Արևի բյուրեղ':'Անապատի դարպաս',w*.5,28)}function myValue(){return ground-120+Math.sin(tt*1.7)*28}function frame(now){const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function jump(){if(!ready)return;jumpBuffer=.15}document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#act').addEventListener('pointerdown',e=>{e.preventDefault();if(!ready)return;if(Math.abs(heroX-2070)<95&&crystal){plate=true;gate=true;message.textContent='Կամուրջը բացվեց';setTimeout(()=>message.textContent='',2200)}});const stick=document.querySelector('#stick');function steer(e){const r=stick.getBoundingClientRect(),v=(e.clientX-(r.left+r.width/2))/(r.width*.36);axis=Math.abs(v)<.2?0:Math.max(-1,Math.min(1,v));knob.style.transform='translateX('+axis*30+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);steer(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))steer(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,()=>{axis=0;knob.style.transform='translateX(0)'});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')axis=1;if(e.key==='ArrowLeft'||e.key==='a')axis=-1;if(e.code==='Space')jump();if(e.key==='e'&&crystal&&Math.abs(heroX-2070)<95){plate=true;gate=true}});addEventListener('keyup',e=>{if(['ArrowRight','ArrowLeft','d','a'].includes(e.key))axis=0});document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault())})();
</script></body></html>
