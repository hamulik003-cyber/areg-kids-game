<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Արեգ․ Վեց աշխարհների գաղտնիքը</title><style>html,body{margin:0;background:#111c2d;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;background:#16283bba;padding:9px;border-radius:12px;font-size:13px}#controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);width:100%;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:12px;margin:0 20px}button{pointer-events:auto;border:2px solid #ffe2a1;background:#264962;color:white;border-radius:16px;font-size:25px;width:62px;height:62px;touch-action:none}</style><canvas id="game"></canvas><div id="hud">Աշխարհ 1 · Արձագանքի անտառ<br><span id="hint">Գտիր էներգիայի բյուրեղը և բացիր կամուրջը</span></div><div id="controls"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button data-key="use">✦</button><button data-key="jump">↑</button></div></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),hint=document.querySelector('#hint');let W=960,H=540;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();const keys={};document.querySelectorAll('button').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp'||e.key===' ')keys.jump=true;if(e.key==='e')keys.use=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='ArrowUp'||e.key===' ')keys.jump=false;if(e.key==='e')keys.use=false});let p={x:60,y:350,vx:0,vy:0,w:26,h:42,ground:false},crystal=false,bridge=false,win=false,lever=false,prevUse=false,prevJump=false;const solids=[{x:0,y:470,w:290,h:70},{x:380,y:470,w:240,h:70},{x:720,y:470,w:240,h:70},{x:165,y:388,w:92,h:18},{x:435,y:360,w:100,h:18},{x:570,y:294,w:86,h:18}];function update(){if(win)return;p.vx=(Number(!!keys.right)-Number(!!keys.left))*3.3;if(keys.jump&&!prevJump&&p.ground){p.vy=-10.5;p.ground=false}prevJump=!!keys.jump;p.vy=Math.min(13,p.vy+.46);let oldY=p.y;p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx));p.y+=p.vy;p.ground=false;let platforms=bridge?[...solids,{x:290,y:470,w:90,h:70},{x:620,y:470,w:100,h:70}]:solids;for(const s of platforms){if(p.x+p.w>s.x&&p.x<s.x+s.w&&oldY+p.h<=s.y+5&&p.y+p.h>=s.y&&p.vy>=0){p.y=s.y-p.h;p.vy=0;p.ground=true}}if(p.y>H){p.x=60;p.y=350;p.vy=0}if(!crystal&&Math.hypot(p.x-600,p.y-260)<42){crystal=true;hint.textContent='Բյուրեղը գտար։ Գնա դեպի լծակը'}if(keys.use&&!prevUse&&crystal&&Math.abs(p.x-466)<60&&Math.abs(p.y-420)<85){bridge=!bridge;lever=true;hint.textContent=bridge?'Կամուրջը բացվեց։ Հասի՛ր լուսավոր դարպասին':'Կամուրջը փակվեց'}prevUse=!!keys.use;if(bridge&&p.x>865&&p.y>350){win=true;hint.textContent='Առաջին փորձությունը հաղթահարված է։'}}function draw(){const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#112e55');sky.addColorStop(1,'#396f72');g.fillStyle=sky;g.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){g.fillStyle=['#284b60','#235451','#1a423c'][layer];for(let i=0;i<17;i++){let x=i*72+(layer*29)%65,y=425-layer*24;g.beginPath();g.moveTo(x-36,y);g.lineTo(x,y-155+layer*25);g.lineTo(x+36,y);g.fill()}}g.fillStyle='#5b4036';for(const s of solids){g.fillRect(s.x,s.y,s.w,s.h);g.fillStyle='#77a668';g.fillRect(s.x,s.y,s.w,9);g.fillStyle='#5b4036'}if(bridge){g.fillStyle='#d2a66a';g.fillRect(290,465,90,13);g.fillRect(620,465,100,13)}g.fillStyle='#e7d67c';g.fillRect(460,420,9,50);g.fillStyle=bridge?'#65f5e4':'#ed995b';g.fillRect(458,410,27,12);if(!crystal){g.fillStyle='#9cfaff';g.beginPath();g.moveTo(613,245);g.lineTo(630,265);g.lineTo(613,285);g.lineTo(596,265);g.fill()}g.fillStyle='#c6f6ed';g.fillRect(882,392,45,78);g.fillStyle='#19454a';g.fillRect(889,401,31,69);g.fillStyle='#f3cfa0';g.fillRect(p.x+5,p.y,16,15);g.fillStyle='#438ad0';g.fillRect(p.x+2,p.y+15,22,20);g.fillStyle='#263451';g.fillRect(p.x+3,p.y+35,8,7);g.fillRect(p.x+16,p.y+35,8,7);if(win){g.fillStyle='#101e35d9';g.fillRect(220,175,520,175);g.fillStyle='white';g.font='bold 31px system-ui';g.fillText('Ապրե՛ս, փորձությունն ավարտված է',245,265)}}let last=0;function frame(t){let n=Math.min(3,Math.max(1,Math.round((t-last)/16.67)));last=t;for(let i=0;i<n;i++)update();draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
