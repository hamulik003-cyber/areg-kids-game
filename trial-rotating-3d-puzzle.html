<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Հավաքիր պատկերը — 3D փորձնական</title>
<style>
:root{--wood:#c98139;--cream:#ffe1a0;--top:calc(env(safe-area-inset-top,0px) + 12px)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Armenian",sans-serif;color:#633414}body{background:radial-gradient(ellipse at 50% 25%,#a2dcbe 0%,#67b2a1 45%,#365c7c 100%)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 16% 65%,#d9eeab77,transparent 34%),radial-gradient(circle at 88% 28%,#ffe6a566,transparent 30%);pointer-events:none}.top{position:absolute;top:var(--top);left:9px;right:9px;display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:8px;align-items:center;z-index:3}.wood{border:3px solid #b76b2c;border-radius:15px;background:linear-gradient(#ffe5a9,#f6b968);box-shadow:0 5px 0 #8d4e28, inset 0 2px 2px #fff8d2;font-weight:900;color:#663111;text-align:center;min-height:46px;display:grid;place-items:center}.back{font-size:27px;text-decoration:none}.heading{font-size:clamp(15px,4.1vw,21px);letter-spacing:-.035em;white-space:nowrap}.star{font-size:21px}.main{position:absolute;inset:calc(var(--top) + 69px) 0 0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px);gap:9px}.progress{font-size:16px;font-weight:900;color:#fff8dc;text-shadow:0 2px 4px #254a54}.dots{display:flex;gap:9px;margin-top:5px;justify-content:center}.dots i{width:9px;height:9px;border-radius:50%;background:#f8e9c688}.dots i.on{background:#ffce66;box-shadow:0 0 10px #ffeb9c}.scene{width:min(89vw,42vh,360px);aspect-ratio:1;perspective:950px;position:relative;touch-action:none}.board{position:absolute;inset:0;border:13px solid #c88a47;border-radius:25px;background:linear-gradient(130deg,#8d623c,#e7b878);box-shadow:0 22px 24px #173c4e77,inset 0 0 0 3px #ffe3a3;transform:rotateX(8deg) rotateY(-10deg);transform-style:preserve-3d;transition:transform .24s ease-out;touch-action:none}.board:after{content:"";position:absolute;inset:0;border-radius:11px;box-shadow:inset 0 0 25px #42240e33;pointer-events:none}.slots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:3px;border-radius:11px;overflow:hidden}.slot{position:relative;display:grid;place-items:center;background:#614e3c99;border:1px solid #fff7c144;transform-style:preserve-3d}.slot .ghost{font-size:clamp(42px,13vw,74px);opacity:.12;filter:grayscale(1)}.slot .piece{position:absolute;inset:0;border:0;border-radius:4px;display:grid;place-items:center;animation:pop .45s cubic-bezier(.15,1.5,.4,1);transform:translateZ(11px);font-size:clamp(45px,14vw,79px);background:linear-gradient(135deg,#fff1b9,#ffd38a)}.slot .piece:after{content:"";position:absolute;inset:0;border:2px solid #ffffffa8;border-radius:4px;pointer-events:none}.tray{width:min(96vw,460px);padding:13px 10px;background:linear-gradient(#a56a3c,#7a482c);border:4px solid #db9c55;border-radius:22px;display:flex;justify-content:space-around;gap:7px;box-shadow:0 12px 22px #263f4d77}.tile{width:22%;aspect-ratio:1;border-radius:15px;border:3px solid #ffe6a3;background:linear-gradient(135deg,#fff0c4,#f4b96e);display:grid;place-items:center;box-shadow:0 5px 0 #653c25;font-size:clamp(31px,10vw,53px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:opacity .2s,transform .2s}.tile.done{opacity:.25;pointer-events:none}.tile.selected{outline:4px solid #7cff9c;transform:translateY(-5px)}.hint{font-size:13px;text-align:center;color:#fff7dd;text-shadow:0 2px 3px #173d4b;max-width:340px;line-height:1.4}.tip{font-size:13px;color:#ffdfaa;text-align:center}.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:17px 22px;border-radius:20px;background:#fff0c6;color:#75401c;box-shadow:0 15px 40px #153b52aa;font-size:23px;font-weight:900;z-index:6;display:none;text-align:center}.toast.show{display:block;animation:pop .3s ease}.next{margin-top:12px;padding:10px 25px;border-radius:14px;background:#4ba85c;border:2px solid #d2ffc2;color:white;font-weight:900;font-size:18px}.drag{position:fixed;pointer-events:none;z-index:10;width:76px;height:76px;border-radius:13px;border:3px solid white;background:#ffdf9e;display:grid;place-items:center;font-size:47px;box-shadow:0 12px 28px #1239;transform:translate(-50%,-50%)}@keyframes pop{from{opacity:.2;scale:.75}to{opacity:1;scale:1}}@media(max-height:650px){.main{gap:3px}.scene{width:min(65vw,34vh)}.tray{padding:6px}.tile{font-size:28px}.hint{font-size:11px}}
</style></head><body>
<header class="top"><a class="wood back" href="index.html" aria-label="Հետ">←</a><div class="wood heading">Հավաքիր պատկերը</div><div class="wood star">⭐ 0</div></header>
<main class="main"><div class="progress"><span id="phase">Փուլ 1/5</span><div class="dots" id="dots"></div></div><div class="scene" id="scene"><div class="board" id="board"><div class="slots" id="slots"></div></div></div><div class="tray" id="tray"></div><div class="hint" id="hint">Քաշիր մասերը համապատասխան տեղերը։ Կարող ես նաև սեղմել մասի վրա, հետո՝ վանդակի։</div><div class="tip">Փորձնական տարբերակ • աստղերը չեն պահպանվում</div></main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const rounds=[['🐶','🌼','🌳','🦋'],['🚒','🚦','☁️','🌈'],['🐱','🧶','🐟','🌸'],['🐘','🌴','☀️','🌿'],['🚜','🌻','🌾','🐝']];let round=0,placed=new Set(),selected=null,drag=null,rotX=8,rotY=-10,rotateStart=null;const $=id=>document.getElementById(id),board=$('board'),slots=$('slots'),tray=$('tray'),toast=$('toast');function render(){placed=new Set();selected=null;rotX=8;rotY=-10;board.style.transform='rotateX(8deg) rotateY(-10deg)';$('phase').textContent='Փուլ '+(round+1)+'/5';$('dots').innerHTML=rounds.map((_,i)=>'<i class="'+(i===round?'on':'')+'"></i>').join('');slots.innerHTML='';tray.innerHTML='';rounds[round].forEach((emoji,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.i=i;s.innerHTML='<span class="ghost">'+emoji+'</span>';s.addEventListener('click',()=>place(i,selected));slots.append(s)});[0,1,2,3].sort(()=>Math.random()-.5).forEach(i=>{const t=document.createElement('div');t.className='tile';t.textContent=rounds[round][i];t.dataset.i=i;t.addEventListener('pointerdown',startDrag);tray.append(t)})}function choose(i){selected=i;document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('selected',+t.dataset.i===i))}function place(slot,i){if(i===null||placed.has(slot)||placed.has(i))return;if(slot!==i){board.animate([{filter:'brightness(1)'},{filter:'brightness(1.45)'},{filter:'brightness(1)'}],{duration:240});return}placed.add(i);const s=slots.children[slot],p=document.createElement('div');p.className='piece';p.textContent=rounds[round][i];s.append(p);document.querySelector('.tile[data-i="'+i+'"]').classList.add('done');selected=null;document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));if(placed.size===4)setTimeout(finish,600)}function finish(){toast.className='toast show';toast.innerHTML=round===4?'🏆 Ապրե՜ս։<div style="font-size:18px">Բոլոր պատկերները հավաքեցիր։</div>':'⭐ Ապրե՜ս։<div style="font-size:17px">Պատկերը պատրաստ է։</div>';const btn=document.createElement('button');btn.className='next';btn.textContent=round===4?'Սկսել նորից':'Շարունակել';btn.onclick=()=>{round=(round+1)%rounds.length;toast.className='toast';render()};toast.append(btn)}function startDrag(e){if(e.pointerType==='mouse'&&e.button!==0)return;const t=e.currentTarget,i=+t.dataset.i;if(placed.has(i))return;choose(i);const ghost=document.createElement('div');ghost.className='drag';ghost.textContent=t.textContent;document.body.append(ghost);drag={id:e.pointerId,i,ghost,startX:e.clientX,startY:e.clientY};ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';t.setPointerCapture(e.pointerId);t.addEventListener('pointermove',moveDrag);t.addEventListener('pointerup',endDrag,{once:true});t.addEventListener('pointercancel',endDrag,{once:true})}function moveDrag(e){if(!drag||e.pointerId!==drag.id)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;d.ghost.remove();drag=null;const el=document.elementFromPoint(e.clientX,e.clientY),s=el?.closest('.slot');if(s)place(+s.dataset.i,d.i)}board.addEventListener('pointerdown',e=>{if(e.target.closest('.piece'))return;rotateStart={x:e.clientX,y:e.clientY,rx:rotX,ry:rotY,id:e.pointerId,moved:false};board.setPointerCapture(e.pointerId)});board.addEventListener('pointermove',e=>{if(!rotateStart||rotateStart.id!==e.pointerId)return;const dx=e.clientX-rotateStart.x,dy=e.clientY-rotateStart.y;if(Math.abs(dx)+Math.abs(dy)>8)rotateStart.moved=true;if(!rotateStart.moved)return;rotY=rotateStart.ry+dx*.22;rotX=Math.max(-18,Math.min(24,rotateStart.rx-dy*.2));board.style.transform='rotateX('+rotX+'deg) rotateY('+rotY+'deg)'});board.addEventListener('pointerup',()=>rotateStart=null);board.addEventListener('pointercancel',()=>rotateStart=null);render()})();
</script></body></html>
