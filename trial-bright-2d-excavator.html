<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Գործարկիր մեքենան • 2D փորձ</title><style>
:root{--safe:calc(env(safe-area-inset-top,0px) + 12px)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Armenian",sans-serif}body{background:linear-gradient(180deg,#58b9ff 0%,#b3e7ff 34%,#f6d899 69%,#b57943 100%);color:#643519}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 13% 30%,#ffffff90,transparent 20%),radial-gradient(circle at 82% 44%,#fff4bd9a,transparent 23%);pointer-events:none}.header{position:absolute;z-index:10;top:var(--safe);left:9px;right:9px;display:grid;grid-template-columns:49px minmax(0,1fr) 61px;gap:7px}.wood{min-height:46px;display:grid;place-items:center;border:3px solid #b66d2f;border-radius:14px;background:linear-gradient(#ffecbb,#f7bf76);box-shadow:0 5px 0 #8c5029,inset 0 2px 2px #fff9e5;color:#603113;text-decoration:none;font-weight:900}.back{font-size:29px}.title{font-size:clamp(14px,4vw,20px);letter-spacing:-.055em;white-space:nowrap}.stars{font-size:20px}.content{position:absolute;inset:calc(var(--safe) + 65px) 0 0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:6px;padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 12px)}.progress{text-align:center;color:#fffdf0;text-shadow:0 2px 4px #754621;font-weight:900;font-size:16px}.dots{display:flex;justify-content:center;gap:9px;margin-top:6px}.dots i{width:10px;height:10px;background:#fff9d999;border-radius:50%}.dots i.on{background:#ffd448;box-shadow:0 0 8px #fff3a8}.stage{position:relative;width:min(97vw,490px);flex:1;min-height:0;max-height:65vh;border-radius:23px;border:5px solid #d18c45;box-shadow:0 15px 28px #66432c66,inset 0 0 0 3px #ffe1a5;background:linear-gradient(#76cafa,#d6f4ff 47%,#9fce6b 47%,#5fba63 72%,#b37c4a 72%);overflow:hidden;touch-action:none}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 76% 21%,#fff1a5 0 6%,transparent 7%),radial-gradient(ellipse at 22% 50%,#3c9b5599 0 8%,transparent 9%),radial-gradient(ellipse at 90% 52%,#3c9b5599 0 8%,transparent 9%);pointer-events:none}.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 2px #573b2870)}.ghost{opacity:.2;filter:grayscale(1)}.part{opacity:0;transition:opacity .25s}.part.placed{opacity:1;animation:pop .48s cubic-bezier(.17,1.5,.4,1)}@keyframes pop{0%{transform:translateY(-28px) scale(.8);opacity:.4}100%{transform:translateY(0) scale(1);opacity:1}}.stage.run #arm{animation:arm 1.4s ease-in-out infinite alternate;transform-origin:54% 54%;transform-box:view-box}.stage.run #bucket{animation:bucket 1.4s ease-in-out infinite alternate;transform-origin:81% 44%;transform-box:view-box}.stage.run #tracks .belt{animation:belt .55s linear infinite}@keyframes arm{to{transform:rotate(-8deg)}}@keyframes bucket{to{transform:rotate(12deg)}}@keyframes belt{to{stroke-dashoffset:-30}}.tray{width:min(97vw,490px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:9px 6px;border:4px solid #d79c5c;border-radius:19px;background:linear-gradient(#a16b40,#79482b);box-shadow:0 9px 19px #4b352b88}.tile{min-width:0;aspect-ratio:.86;border:2px solid #ffefbb;border-radius:12px;background:linear-gradient(145deg,#fff0c8,#f2bc6f);box-shadow:0 4px 0 #613b24;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;cursor:grab}.tile svg{width:95%;height:75%;filter:drop-shadow(0 3px 2px #69462755)}.tile small{font-size:9px;font-weight:900;position:absolute;bottom:2px;white-space:nowrap}.tile.selected{outline:4px solid #b0ff95;transform:translateY(-4px)}.tile.done{opacity:.3;pointer-events:none}.hint{text-align:center;color:#fffaf0;text-shadow:0 2px 4px #4f352b;font-weight:850;font-size:13px;min-height:17px}.btn{display:none;border:3px solid #d9ffb9;background:linear-gradient(#69d976,#269b4c);color:white;font-weight:900;font-size:18px;border-radius:14px;padding:11px 24px;box-shadow:0 5px 0 #246b39}.btn.show{display:block}.float{position:fixed;z-index:30;width:90px;height:90px;pointer-events:none;transform:translate(-50%,-50%);background:#ffe4a8;border:3px solid white;border-radius:16px;box-shadow:0 9px 22px #293d4c88;display:grid;place-items:center}.float svg{width:90%;height:90%}.toast{position:absolute;z-index:20;top:44%;left:50%;transform:translate(-50%,-50%);background:#fff0bb;border:4px solid #dca252;border-radius:20px;padding:14px 23px;font-weight:900;font-size:24px;white-space:nowrap;box-shadow:0 12px 30px #4a352a88;display:none}.toast.show{display:block}@media(max-height:680px){.content{gap:2px}.tray{padding:4px}.tile{aspect-ratio:1.12}.hint{font-size:11px}.stage{max-height:55vh}}
</style></head><body><header class="header"><a class="wood back" href="index.html" aria-label="Հետ">←</a><div class="wood title">Գործարկիր մեքենան</div><div class="wood stars">⭐ 0</div></header><main class="content"><div class="progress" id="progress">Տեղադրիր մասերը՝ 0/5<div class="dots" id="dots"></div></div><div class="stage" id="stage"><svg viewBox="0 0 400 420" aria-label="Հավաքիր էքսկավատորը"><defs><linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff18c"/><stop offset=".48" stop-color="#ffc22d"/><stop offset="1" stop-color="#df8a10"/></linearGradient><linearGradient id="metal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#879ba6"/><stop offset="1" stop-color="#303e49"/></linearGradient><linearGradient id="window" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#c8f4ff"/><stop offset="1" stop-color="#3c93c4"/></linearGradient></defs><ellipse cx="202" cy="345" rx="166" ry="31" fill="#85582c88"/><ellipse cx="202" cy="356" rx="175" ry="30" fill="#b67b45" stroke="#f4c67c" stroke-width="9"/><g id="ghost" class="ghost"><rect x="84" y="290" width="234" height="49" rx="24" fill="#fff"/><path d="M104 250 H305 L315 292 H98Z" fill="#fff"/><path d="M139 244 L149 150 Q152 136 166 136 H233 L255 244Z" fill="#fff"/><path d="M252 250 L278 171 L321 117 L345 137 L298 191 L287 260Z" fill="#fff"/><path d="M328 209 Q365 190 377 221 L371 260 L333 274 L320 252Z" fill="#fff"/></g><g id="tracks" class="part"><rect x="85" y="291" width="232" height="51" rx="25" fill="#26323b" stroke="#151d24" stroke-width="7"/><rect x="100" y="302" width="203" height="28" rx="14" fill="#5a6870"/><path class="belt" d="M108 314 H294" stroke="#d1d7d1" stroke-width="6" stroke-dasharray="11 10"/><circle cx="123" cy="317" r="16" fill="#84939b" stroke="#35434b" stroke-width="5"/><circle cx="282" cy="317" r="16" fill="#84939b" stroke="#35434b" stroke-width="5"/><circle cx="166" cy="317" r="12" fill="#34424c"/><circle cx="207" cy="317" r="12" fill="#34424c"/><circle cx="247" cy="317" r="12" fill="#34424c"/></g><g id="bodyPart" class="part"><path d="M102 250 Q102 236 122 234 H284 Q299 234 307 255 L315 284 Q312 295 297 295 H105 Q94 292 102 250Z" fill="url(#gold)" stroke="#a9680c" stroke-width="5"/><path d="M234 241 H278 L294 278 H232Z" fill="#df9014"/><path d="M115 263 H210" stroke="#fff4a2" stroke-width="8" stroke-linecap="round"/><rect x="245" y="259" width="37" height="5" rx="2" fill="#74461b"/><rect x="245" y="269" width="37" height="5" rx="2" fill="#74461b"/></g><g id="cabin" class="part"><path d="M139 243 L147 147 Q148 133 164 133 H227 Q242 133 244 150 L256 243Z" fill="url(#gold)" stroke="#ad6f10" stroke-width="6"/><path d="M159 151 H224 L235 218 H151Z" fill="url(#window)" stroke="#354f5d" stroke-width="7"/><path d="M190 151 V218" stroke="#385362" stroke-width="6"/><path d="M153 222 H241" stroke="#a36a20" stroke-width="7"/><rect x="168" y="230" width="25" height="6" rx="3" fill="#fff2a1"/></g><g id="arm" class="part"><path d="M248 247 L268 170 L314 120 Q325 108 337 119 L346 131 Q349 141 338 151 L298 194 L287 255Z" fill="url(#gold)" stroke="#a66c10" stroke-width="7"/><path d="M283 175 L320 134" stroke="#fff5ad" stroke-width="8" stroke-linecap="round"/><path d="M290 196 L324 217" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/><circle cx="267" cy="241" r="13" fill="#687681" stroke="#ffe18b" stroke-width="5"/><circle cx="331" cy="136" r="11" fill="#687681" stroke="#ffe18b" stroke-width="5"/></g><g id="bucket" class="part"><path d="M327 209 Q357 193 371 213 L381 247 Q371 270 339 271 L319 253Z" fill="url(#metal)" stroke="#263440" stroke-width="6"/><path d="M337 271 L344 283 L353 271 L361 283 L371 265" fill="#465563" stroke="#27343c" stroke-width="3"/><circle cx="330" cy="220" r="8" fill="#aab6ba" stroke="#394b55" stroke-width="4"/></g></svg><div class="toast" id="toast">🌟 Ապրե՜ս։</div></div><div class="hint" id="hint">Քաշիր մասը մեքենայի վրա կամ ընտրիր ու սեղմիր։</div><div class="tray" id="tray"></div><button class="btn" id="go">▶ Գործարկել</button><button class="btn" id="again">↻ Կրկնել</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),ids=['tracks','bodyPart','cabin','arm','bucket'],names=['Թրթուր','Թափք','Խցիկ','Թև','Շերեփ'],svg=document.querySelector('#stage svg'),tray=$('tray');let step=0,selected=null,drag=null,running=false;const symbols=ids.map(id=>$(id).outerHTML.replace(/class="part"/,'class="part placed"'));function render(){tray.innerHTML='';ids.forEach((id,i)=>{const t=document.createElement('div');t.className='tile'+(i<step?' done':'')+(selected===i?' selected':'');t.dataset.i=i;const v=document.createElementNS('http://www.w3.org/2000/svg','svg');v.setAttribute('viewBox',i===0?'70 278 265 76':i===1?'90 223 235 82':i===2?'125 120 145 135':i===3?'235 100 130 170':'306 183 86 115');v.innerHTML=symbols[i];t.append(v);const label=document.createElement('small');label.textContent=names[i];t.append(label);t.addEventListener('pointerdown',down);tray.append(t)});$('dots').innerHTML=ids.map((_,i)=>'<i class="'+(i<step?'on':'')+'"></i>').join('');$('progress').firstChild.textContent=step<5?'Տեղադրիր մասերը՝ '+step+'/5':'Մեքենան պատրաստ է՛';$('go').classList.toggle('show',step===5&&!running);$('again').classList.toggle('show',running)}function select(i){if(i!==step)return;selected=i;render();$('hint').textContent='Սեղմիր մեքենայի վրա կամ քաշիր ընտրված մասը։'}function fit(i){if(i!==step||running)return;$(ids[i]).classList.add('placed');step++;selected=null;render();$('hint').textContent=step===5?'Ապրե՜ս։ Հիմա գործարկիր մեքենան։':'Ընտրիր հաջորդ մասը։';if(step===5){$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1000)}}function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;const i=Number(e.currentTarget.dataset.i);if(i!==step)return;select(i);const ghost=document.createElement('div');ghost.className='float';ghost.innerHTML=e.currentTarget.querySelector('svg').outerHTML;document.body.append(ghost);ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';drag={id:e.pointerId,i,ghost,startX:e.clientX,startY:e.clientY};const t=e.currentTarget;t.setPointerCapture(e.pointerId);t.addEventListener('pointermove',move);t.addEventListener('pointerup',end,{once:true});t.addEventListener('pointercancel',end,{once:true})}function move(e){if(!drag||e.pointerId!==drag.id)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}function end(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.ghost.remove();const r=$('stage').getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)fit(d.i)}$('stage').addEventListener('click',()=>{if(selected!==null)fit(selected)});$('go').onclick=()=>{running=true;$('stage').classList.add('run');$('toast').textContent='🏆 Հրաշալի՜';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600);$('hint').textContent='Մեքենան աշխատո՜ւմ է։';render()};$('again').onclick=()=>{running=false;step=0;selected=null;$('stage').classList.remove('run');ids.forEach(id=>$(id).classList.remove('placed'));$('hint').textContent='Քաշիր մասը մեքենայի վրա կամ ընտրիր ու սեղմիր։';render()};render()})();
</script></body></html>
