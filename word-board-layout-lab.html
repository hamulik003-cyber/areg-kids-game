<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AREG — Բառերի դասավորության փորձարկում</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#eaf7ff,#a6d4ed);font-family:system-ui,-apple-system,sans-serif;color:#fbe6bd}body{padding:calc(env(safe-area-inset-top) + 15px) 12px calc(env(safe-area-inset-bottom) + 20px)}main{max-width:480px;margin:auto}.title{font-size:22px;font-weight:900;color:#4b2816;text-align:center;margin:5px 0 12px}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:13px}.controls button{border:2px solid #b78046;border-radius:12px;padding:11px 13px;font-weight:800;font-size:16px;background:linear-gradient(#ffdfab,#dca46b);color:#58351f}.controls button.active{background:#174b43;color:#fff4d8;border-color:#e6bd7d}.shell{background:radial-gradient(ellipse at 50% 20%,#2c4961,#101d30 85%);border:12px solid #bc894f;border-radius:30px;box-shadow:inset 0 0 0 3px #ebc48c,0 4px 0 #84502d;padding:12px 9px 20px}.caption{text-align:center;font-size:19px;font-weight:900;margin-bottom:12px}.board{border:10px solid #bc894f;border-radius:23px;box-shadow:inset 0 0 0 3px #6f4a2a;background:radial-gradient(ellipse,#20524a,#0a302f);padding:13px 10px;height:min(54vh,480px);min-height:330px;display:flex;flex-direction:column;justify-content:space-around;overflow:hidden}.line{display:flex;justify-content:space-between;align-items:center;min-height:0;width:100%}.word{display:flex;gap:var(--gap,3px);flex:none}.cell{width:var(--cell,25px);height:var(--cell,25px);display:grid;place-items:center;border:1px solid #bba98b;border-radius:6px;background:linear-gradient(#fff9e8,#e7ddc4);box-shadow:0 3px 1px #92785b;color:#20413b;font-weight:900;font-size:calc(var(--cell,25px)*.62);line-height:1}.line .word:last-child:not(:first-child){margin-left:8px}.details{color:#543b2a;font-size:13px;line-height:1.5;text-align:center;margin:14px auto;max-width:460px}.legend{font-size:13px;text-align:center;margin-top:12px;color:#ffdfae}.toggle{display:flex;align-items:center;justify-content:center;gap:8px;color:#533923;margin:12px 0;font-weight:700}.toggle input{width:19px;height:19px}.note{font-size:12px;color:#71513a;text-align:center}
</style></head><body><main><div class="title">Բառերի մենամարտ · դասավորության փորձարկում</div><div class="controls" id="controls"></div><label class="toggle"><input type="checkbox" id="show" checked> Ցույց տալ բառերի տառերը</label><section class="shell"><div class="caption">⚔ Բառերի մենամարտ</div><div class="board" id="board"></div><div class="legend" id="legend"></div></section><div class="details" id="details"></div><p class="note">Սա առանձին տեսողական փորձարկում է։ Հիմնական խաղը և DotKiosk-ը չեն փոփոխվում։</p></main><script>
const examples=['օր','այ','ես','դաս','տուն','արտ','արև','գիրք','սեր','սեղան','ընկեր','ամպեր','ծաղիկ','դպրոց','մատիտ','աշակերտ','հեռախոս','հեռախոսը','գրատախտակ','ընկերներ'];
const tokenize=w=>Array.from(w.replace(/ու/gi,'¤')).map(c=>c==='¤'?'ու':c);
const catalog=examples.map(w=>({word:w,parts:tokenize(w)})).sort((a,b)=>a.parts.length-b.parts.length);
let count=12;const board=document.getElementById('board'),controls=document.getElementById('controls'),show=document.getElementById('show');
function layout(){controls.replaceChildren();[3,6,9,12].forEach(n=>{const b=document.createElement('button');b.textContent=n+' բառ';b.className=n===count?'active':'';b.onclick=()=>{count=n;layout()};controls.append(b)});board.replaceChildren();const style=getComputedStyle(board),width=board.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);const cell=36,gap=3,between=12;board.style.setProperty('--cell',cell+'px');const fit=(a,b)=>{let l=Math.max(0,...a.map(x=>x.parts.length)),rr=Math.max(0,...b.map(x=>x.parts.length));return (l+rr)*cell+(l+rr-2)*gap+(b.length?between:0)<=width};
let selected=[];for(const item of catalog){if(selected.length===count)break;const trial=[...selected,item],left=trial.slice(0,6),right=trial.slice(6);if(fit(left,right))selected=trial}const left=selected.slice(0,6),right=selected.slice(6),rows=Math.max(left.length,right.length);for(let i=0;i<rows;i++){const line=document.createElement('div');line.className='line';for(const item of [left[i],right[i]]){if(!item)continue;const group=document.createElement('div');group.className='word';for(const part of item.parts){const c=document.createElement('div');c.className='cell';c.textContent=show.checked?part:'';group.append(c)}line.append(group)}board.append(line)}document.getElementById('legend').textContent=selected.length+' բառ · 36×36 px անփոփոխ վանդակներ';document.getElementById('details').textContent=selected.length<count?'Այս լայնությամբ '+count+' բառ չի տեղավորվում 36px վանդակներով. չափը չի փոքրացվել։':'Բառերի երկարությունները՝ '+selected.map(x=>x.parts.length).join(', ')+'. «ու»-ն մեկ վանդակ է։'}
show.addEventListener('change',layout);window.addEventListener('resize',layout);layout();
</script></body></html>
