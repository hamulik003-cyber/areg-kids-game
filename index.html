<!doctype html>
<html lang="hy" data-theme="day">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f4d6a8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Արեգ 3D աշխարհ" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Արեգ 3D աշխարհ</title>
      <script>
    window.__AREG_BUILD = new URLSearchParams(location.search).get('kiosk') || String(Date.now());
    const aregCss = document.createElement('link');
    aregCss.rel = 'stylesheet';
    aregCss.href = 'styles.css?v=' + encodeURIComponent(window.__AREG_BUILD);
    document.head.appendChild(aregCss);
  </script>

  <style id="areg-single-layer-hard-fix">
    /* V11: force true single-layer UI even if an old stylesheet is still cached */
    .section-card::before,
    .section-card::after,
    .magic-card::before,
    .magic-card::after,
    .asset-button::before,
    .asset-button::after {
      content: none !important;
      display: none !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .section-card,
    .magic-card,
    .asset-button,
    .section-card > img,
    .magic-card > img,
    .asset-button > img {
      outline: none !important;
      border-color: transparent !important;
    }

    .section-card,
    .magic-card {
      box-shadow: none !important;
      filter: none !important;
    }
  </style>


  <style id="areg-v31-clean-pro-layout">
    /* V18 FINAL: exact equal-size 2x2 section grid */
    .nature-card,.space-card,.mind-card,.create-card{width:344px!important;height:400px!important;}
    .nature-card{left:9px!important;top:260px!important;}
    .space-card{left:356px!important;top:260px!important;}
    .mind-card{left:9px!important;top:666px!important;}
    .create-card{left:356px!important;top:666px!important;}
    .magic-card{left:8px!important;top:1072px!important;width:694px!important;height:330px!important;}
    .bottom-landscape{left:0!important;top:1405px!important;width:709px!important;height:131px!important;}
  </style>
</head>
<body>
  <div id="appBackground" aria-hidden="true"></div>
  <div id="ambientLayer" aria-hidden="true">
    <span class="particle p1">✦</span><span class="particle p2">•</span><span class="particle p3">✧</span>
    <span class="particle p4">❧</span><span class="particle p5">✦</span><span class="particle p6">•</span>
  </div>

  <main id="homeScreen" class="screen screen--active" aria-label="Գլխավոր ընտրացանկ">
    <div id="designStage" class="design-stage" role="application" aria-label="Արեգ 3D աշխարհ">
      <button id="avatarButton" class="asset-button avatar-button" aria-label="Փոխել կերպարի նկարը">
        <img class="asset-img" src="avatar-frame.png?v=31" alt="" draggable="false" />
        <img id="savedAvatar" class="saved-avatar" alt="Ընտրված նկար" draggable="false" hidden />
      </button>

      <img class="logo asset-img" src="logo.png?v=31" alt="Արեգ 3D աշխարհ" draggable="false" />

      <button id="starCounter" class="asset-button star-counter" aria-label="120 աստղ">
        <img class="asset-img" src="star-counter.png?v=31" alt="120 աստղ" draggable="false" />
      </button>

      <button id="settingsButton" class="asset-button settings-button" aria-label="Կարգավորումներ">
        <img class="asset-img" src="settings.png?v=31" alt="" draggable="false" />
      </button>

      <button class="section-card nature-card" data-section="nature" aria-label="Բնություն">
        <img class="asset-img" src="nature.png?v=31" alt="Բնություն" draggable="false" />
        <span class="card-layer nature-deer-head" aria-hidden="true"></span>
        <span class="card-layer nature-bird" aria-hidden="true"></span>
        <span class="card-fx nature-glint nature-glint-a" aria-hidden="true"></span>
        <span class="card-fx nature-glint nature-glint-b" aria-hidden="true"></span>
        <span class="nature-water-shimmer" aria-hidden="true"></span>
        <img class="frame-guard" src="nature-frame-guard.png?v=31" alt="" aria-hidden="true" draggable="false" />
        <span class="card-shine-mask" aria-hidden="true"><span class="card-shine-band"></span></span>
      </button>
      <button class="section-card space-card" data-section="space" aria-label="Տիեզերք">
        <img class="asset-img" src="space.png?v=31" alt="Տիեզերք" draggable="false" />
        <span class="card-layer space-earth" aria-hidden="true"></span>
        <span class="card-layer space-saturn" aria-hidden="true"></span>
        <span class="card-layer space-astronaut" aria-hidden="true"></span>
        <span class="card-layer space-rocket" aria-hidden="true"></span>
        <span class="space-twinkle st1" aria-hidden="true"></span>
        <span class="space-twinkle st2" aria-hidden="true"></span>
        <span class="space-twinkle st3" aria-hidden="true"></span>
        <img class="frame-guard" src="space-frame-guard.png?v=31" alt="" aria-hidden="true" draggable="false" />
        <span class="card-shine-mask" aria-hidden="true"><span class="card-shine-band"></span></span>
      </button>
      <button class="section-card mind-card" data-section="mind" aria-label="Մտքի խաղեր">
        <img class="asset-img" src="mind.png?v=31" alt="Մտքի խաղեր" draggable="false" />
        <span class="card-layer mind-blocks" aria-hidden="true"></span>
        <span class="mind-thought-dot md1" aria-hidden="true"></span>
        <span class="mind-thought-dot md2" aria-hidden="true"></span>
        <span class="card-shine-mask" aria-hidden="true"><span class="card-shine-band"></span></span>
      </button>
      <button class="section-card create-card" data-section="create" aria-label="Ստեղծագործություն">
        <img class="asset-img" src="create.png?v=31" alt="Ստեղծագործություն" draggable="false" />
        <span class="card-layer create-dog" aria-hidden="true"></span>
        <span class="create-paint-spark cp1" aria-hidden="true"></span>
        <span class="create-paint-spark cp2" aria-hidden="true"></span>
        <span class="create-rainbow-glow" aria-hidden="true"></span>
        <span class="card-shine-mask" aria-hidden="true"><span class="card-shine-band"></span></span>
      </button>
      <button class="section-card magic-card" data-section="magic" aria-label="Կախարդական աստղի սենյակ">
        <span class="magic-glow" aria-hidden="true"></span>
        <img class="asset-img" src="magic.png?v=31" alt="Կախարդական աստղի սենյակ" draggable="false" />
        <span class="card-layer magic-star-float" aria-hidden="true"></span>
        <span class="magic-spark ms1" aria-hidden="true"></span>
        <span class="magic-spark ms2" aria-hidden="true"></span>
        <span class="magic-spark ms3" aria-hidden="true"></span>
        <span class="magic-book-glow" aria-hidden="true"></span>
        <img class="frame-guard" src="magic-frame-guard.png?v=31" alt="" aria-hidden="true" draggable="false" />
        <span class="card-shine-mask" aria-hidden="true"><span class="card-shine-band"></span></span>
      </button>

      <img class="bottom-landscape asset-img" src="bottom-landscape.png?v=31" alt="" draggable="false" />
    </div>
  </main>

  <section id="sectionScreen" class="screen section-screen" aria-live="polite" hidden>
    <button id="sectionBack" class="wood-button back-button" aria-label="Հետ">‹ <span>Հետ</span></button>
    <div class="coming-soon">Շուտով</div>
  </section>

  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="modal-backdrop" data-close="settings"></div>
    <div class="settings-panel">
      <div class="panel-header">
        <h2 id="settingsTitle">Կարգավորումներ</h2>
        <button class="round-close" data-close="settings" aria-label="Փակել">×</button>
      </div>

      <div class="settings-list">
        <label class="setting-row"><span>Ընդհանուր ձայն</span><input id="masterSound" type="checkbox" /><span class="switch"></span></label>
        <label class="setting-row"><span>Երաժշտություն</span><input id="musicSound" type="checkbox" /><span class="switch"></span></label>
        <label class="setting-row"><span>Ձայնային հուշումներ</span><input id="voiceHints" type="checkbox" /><span class="switch"></span></label>
        <label class="setting-row"><span>Խաղի էֆեկտներ</span><input id="gameEffects" type="checkbox" /><span class="switch"></span></label>
      </div>

      <h3 class="theme-heading">Թեմա</h3>
      <div id="themeGrid" class="theme-grid" aria-label="Ընտրել թեմա"></div>
    </div>
  </div>

  <div id="avatarModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="avatarTitle" hidden>
    <div class="modal-backdrop" data-close="avatar"></div>
    <div class="avatar-panel">
      <div class="panel-header">
        <h2 id="avatarTitle">Կերպարի նկար</h2>
        <button class="round-close" data-close="avatar" aria-label="Փակել">×</button>
      </div>

      <div id="cropPreview" class="crop-preview" aria-label="Կլոր նախադիտում">
        <img id="cropImage" alt="Ընտրված լուսանկար" draggable="false" hidden />
        <div id="cropPlaceholder" class="crop-placeholder">Ընտրիր լուսանկար</div>
      </div>

      <div class="avatar-actions">
        <label class="wood-button file-button">Ընտրել նկար<input id="photoInput" type="file" accept="image/*" /></label>
      </div>

      <div class="zoom-tools">
        <button id="zoomOut" class="round-tool" aria-label="Փոքրացնել">−</button>
        <input id="zoomSlider" type="range" min="0.4" max="4" step="0.01" value="1" aria-label="Մասշտաբ" />
        <button id="zoomIn" class="round-tool" aria-label="Մեծացնել">+</button>
      </div>
      <p class="crop-help">Քաշիր՝ տեղաշարժելու համար, երկու մատով՝ մեծացնելու կամ փոքրացնելու։</p>
      <button id="saveAvatar" class="wood-button save-avatar" disabled>Պահպանել</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="menuMusic" src="menu-music.mp3?v=31" loop preload="auto"></audio>
<script>
    (function(){
      const v = encodeURIComponent(window.__AREG_BUILD || String(Date.now()));
      const files = ['app.js','v9-fix.js'];
      let chain = Promise.resolve();
      files.forEach(function(file){
        chain = chain.then(function(){
          return new Promise(function(resolve, reject){
            const s = document.createElement('script');
            s.src = file + '?v=' + v;
            s.onload = resolve;
            s.onerror = reject;
            document.body.appendChild(s);
          });
        });
      });
    })();
  </script>
</body>
</html>
