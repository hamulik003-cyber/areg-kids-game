<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ո՞ւմ ստվերն է</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,-apple-system,sans-serif;color:#572b18;touch-action:manipulation}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #35a9ff}
.game{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);padding:clamp(8px,2.4vh,20px) clamp(10px,3vw,22px) clamp(12px,2.5vh,22px);position:relative}
.top{display:grid;grid-template-columns:58px minmax(0,1fr) 100px;gap:10px;align-items:center}.wood{border:3px solid #c58b52;border-bottom:6px solid #965027;background:linear-gradient(#ffe0a8,#efb36e);border-radius:19px;box-shadow:inset 0 2px 1px #fff5d6,0 6px 12px #3a18062a;font-weight:950;color:#542718}.back{height:57px;font-size:32px}.heading{height:60px;display:grid;place-items:center;font-size:clamp(18px,4.8vw,28px);white-space:nowrap}.stars{height:57px;display:grid;place-items:center;font-size:22px}.progress{align-self:center;padding:5px 20px;background:#fff2d6;border:3px solid #d7a36c;border-radius:50px;font-size:16px;font-weight:900}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;border:6px solid #b77a43;border-radius:34px;background:radial-gradient(circle at 50% 20%,#fff9e8 0,#ffedc9 48%,#e9b875 100%);box-shadow:inset 0 0 0 4px #ffe3b1,0 14px 26px #371a0a30;isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;opacity:.35;background:radial-gradient(circle at 20% 80%,#8fb66d 0 2px,transparent 3px),radial-gradient(circle at 85% 25%,#c8a468 0 3px,transparent 4px);background-size:76px 94px;pointer-events:none}
.stage.space{background:radial-gradient(circle at 55% 25%,#7b81c6,#252c66 58%,#131b48)}.stage.space:before{background:radial-gradient(circle,#fff 1px,transparent 2px);background-size:33px 47px;opacity:.5}.stage.toys{background:radial-gradient(circle at 50% 10%,#fff9ef,#f7c9b4 70%,#e3a67f)}
.hint{position:absolute;right:13px;top:13px;width:53px;height:55px;font-size:26px;z-index:2}.prompt{font-weight:900;font-size:clamp(17px,4vw,25px);z-index:1;margin:6px 60px 10px 10px;text-align:center;color:#754220}.space .prompt{color:#fff2da}
.shadowboard{width:min(84%,410px);flex:0 1 72%;max-height:490px;min-height:170px;display:grid;place-items:center;position:relative;perspective:750px}.board{position:absolute;inset:3%;border:11px solid #a66b3b;border-radius:24px;background:radial-gradient(circle at 45% 35%,#fff8e6,#f4d9ac);box-shadow:0 12px 0 #734123,0 22px 27px #39200c44,inset 0 0 0 4px #e7bc78;transform:rotateX(4deg);animation:boardFloat 4s ease-in-out infinite}.board:before{content:"";position:absolute;inset:-16px;border-radius:27px;border:3px solid #dca36a;pointer-events:none}.shadow-float{position:relative;z-index:1;display:grid;place-items:center;transform:translateY(-2%);animation:shadowFloat 3s ease-in-out infinite}
.shadow-motion{display:grid;place-items:center;grid-area:1/1;transform:translate3d(0,0,0);transform-origin:center;backface-visibility:hidden}
.silhouette,.shadow-color{grid-area:1/1;font-size:clamp(110px,31vh,240px);line-height:1;backface-visibility:hidden}
.silhouette{filter:brightness(0);opacity:1}
.shadow-color{opacity:0;pointer-events:none}
.shadow-motion.reveal{animation:smoothPop 1.15s cubic-bezier(.22,.61,.36,1) both}
.shadow-motion.reveal .silhouette{animation:fadeShadow 1.15s ease-in-out both}
.shadow-motion.reveal .shadow-color{animation:fadeColor 1.15s ease-in-out both}
.shadow-float.leaving{animation:shadowExit .65s ease-in-out both}
@keyframes smoothPop{0%{transform:translate3d(0,0,0) scale(.88) rotate(-4deg)}65%{transform:translate3d(0,0,0) scale(1.025) rotate(0deg)}100%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}}
@keyframes fadeShadow{0%,15%{opacity:1}100%{opacity:0}}
@keyframes fadeColor{0%,15%{opacity:0}100%{opacity:1}}

.options{height:clamp(110px,20vh,172px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1.5vw,11px);padding:8px;border:5px solid #a76c3f;border-radius:27px;background:linear-gradient(#e5ae70,#b87540);box-shadow:0 8px 0 #7d4628,0 13px 20px #371a0a44}
.option{min-width:0;display:grid;place-items:center;border:4px solid #f9dbab;border-bottom:8px solid #c99055;border-radius:20px;background:linear-gradient(#fff5db,#ffdfaa);box-shadow:inset 0 2px 0 #fff,0 5px 10px #512a1540;transition:transform .18s,filter .18s;position:relative}.option span{font-size:clamp(62px,15vw,124px);line-height:1;filter:drop-shadow(0 5px 3px #57311945);animation:toyBreathe 3s ease-in-out infinite}.option:active{transform:scale(.94) translateY(3px)}.option.correct{background:linear-gradient(#e6ffcb,#b5e98b);border-color:#d7ffa5}.option.wrong{background:#ffbbb2;border-color:#f07066;animation:wrong .35s ease-in-out}.option.correct:after{content:"✓";position:absolute;right:5px;top:0;font-size:30px;color:#26853d}.option.wrong:after{content:"✕";position:absolute;right:5px;top:0;font-size:30px;color:#b52d2d}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#180d0959;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.modal{width:min(85%,350px);padding:25px 18px;display:grid;gap:15px;text-align:center;justify-items:center;border-radius:29px;background:linear-gradient(#fff5d9,#f0c18c);border:6px solid #d6a16a;box-shadow:0 20px 40px #1d0b0866;font-weight:900;font-size:22px}.modal{position:relative;overflow:hidden;isolation:isolate}.reward-stage{font-size:19px;color:#7a4525;font-weight:950}.trophy{font-size:70px;line-height:1}.trophy[hidden]{display:none}.modal .medal{font-size:54px;display:flex;justify-content:center;flex-wrap:wrap;gap:2px;min-height:68px;max-width:100%}.medal .earned-star{display:inline-block;filter:drop-shadow(0 3px 5px #a56c2677);animation:rewardGlow 1.6s ease-in-out infinite alternate}.continue{padding:12px 28px;font-size:22px;color:#184a20;background:linear-gradient(#baff9d,#54c76d);border-color:#3e9a4e;border-bottom-color:#25713a;box-shadow:inset 0 2px 1px #edffe3,0 6px 12px #1b69292a}.sparkles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.sparkle{position:absolute;top:-35px;font-size:20px;opacity:0;animation:sparkleFall 2.7s ease-in infinite}.modal>:not(.sparkles){position:relative;z-index:1}.reward-fly{position:fixed;z-index:1000;pointer-events:none;font-size:36px;line-height:1;filter:drop-shadow(0 3px 5px #8b570c88);will-change:transform,opacity}@keyframes sparkleFall{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translate3d(15px,430px,0) rotate(150deg);opacity:0}}@keyframes rewardGlow{from{transform:scale(.96)}to{transform:scale(1.06)}}
@keyframes boardFloat{50%{transform:rotateX(1deg) translateY(-6px)}}@keyframes shadowFloat{50%{transform:translateY(-7%) rotate(-2deg)}}@keyframes toyBreathe{50%{transform:translateY(-4px) scale(1.03)}}@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}65%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes shadowExit{0%{opacity:1;transform:translateY(-2%) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(.86)}}@keyframes wrong{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-height:680px){.game{padding:5px 9px;gap:5px}.top{grid-template-columns:46px 1fr 76px;gap:5px}.heading,.back,.stars{height:44px;font-size:17px}.options{height:95px}.silhouette{font-size:clamp(85px,24vh,155px)}.prompt{margin:0;font-size:16px}.progress{padding:1px 15px}.hint{width:42px;height:42px;font-size:20px}}
</style></head><body><main class="game"><header class="top"><button class="wood back" id="back" aria-label="Հետ">←</button><div class="wood heading">Ո՞ւմ ստվերն է</div><div class="wood stars" id="stars">⭐ 150</div></header><div class="progress" id="progress">Փուլ 1 / 5 · Հարց 1 / 10</div><section class="stage" id="stage"><button class="wood hint" id="hint" aria-label="Հուշում">💡</button><div class="prompt">Գտիր ճիշտ կերպարը</div><div class="shadowboard"><div class="board"></div><div class="shadow-float" id="shadowFloat"><div class="shadow-motion" id="shadowMotion"><div class="silhouette" id="shadow" aria-label="Գտիր ստվերի կերպարը"></div><div class="shadow-color" id="shadowColor" aria-hidden="true"></div></div></div></div></section><div class="options" id="options"></div><div class="overlay" id="overlay" hidden><div class="modal"><div class="sparkles" id="sparkles" aria-hidden="true"></div><div class="reward-stage" id="rewardStage">Փուլ 1 / 5</div><div class="medal" id="medal">⭐</div><div class="trophy" id="trophy" hidden>🏆</div><div id="message">Վաստակեցիր 1 աստղ</div><button class="wood continue" id="continue">Շարունակել →</button></div></div></main><script>
'use strict';
document.addEventListener('contextmenu',e=>e.preventDefault(),true);document.addEventListener('selectstart',e=>e.preventDefault(),true);document.addEventListener('dragstart',e=>e.preventDefault(),true);
const $=id=>document.getElementById(id);
// More variety without extra network requests or new images. Each 6-round visit
// draws distinct answers and shuffled distractors; repeat visits avoid the last
// visit's answers where possible.
const pools={
forest:['🦌','🦊','🐻','🐰','🐿️','🦔','🐶','🐱','🐸','🦁','🐯','🐨','🐵','🐮','🐷','🐴','🐑','🐘','🦒','🦓','🦘','🦜','🦉','🦋','🐢','🐧','🦆','🐙','🐬'],
toys:['🧸','🚂','🚗','🚌','🚒','🚑','🚜','🚲','🛴','🛵','🚁','✈️','⛵','🚢','⚽','🎁','🎸','🎹','🎲','🪁','🪀','🎨','🧩','🥁','🎺','🛹'],
space:['🚀','🛸','🛰️','🤖','🌙','⭐','☄️','👨‍🚀','🌈','🔭']
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeRounds(){let last=[];try{last=JSON.parse(sessionStorage.getItem('areg-shadow-last-answers')||'[]')}catch{}
 const chosen=[];for(const kind of ['forest','toys','space','forest','toys','space','forest','toys','space','forest']){
  const candidates=pools[kind].filter(x=>!chosen.includes(x)&&!last.includes(x));
  const fallback=pools[kind].filter(x=>!chosen.includes(x));
  const answer=shuffle(candidates.length?candidates:fallback)[0];
  chosen.push(answer);
  const distractors=shuffle(pools[kind].filter(x=>x!==answer)).slice(0,3);
  const options=shuffle([answer,...distractors]);chosen[chosen.length-1]=answer;
  rounds.push({kind,answer,options});
 }
 shuffle(rounds);
 try{sessionStorage.setItem('areg-shadow-last-answers',JSON.stringify(chosen))}catch{}
}
const rounds=[];makeRounds();
let index=0,locked=false,hinted=false,active=true,feedbackTimer=0,audioCtx=null,rewardGranted=false,completedSets=0;const rewardAnimations=new Set();const STAR_KEY='areg-stars-v35';const wrongTimers=new WeakMap();const options=$('options'),shadow=$('shadow'),shadowColor=$('shadowColor'),shadowMotion=$('shadowMotion'),shadowFloat=$('shadowFloat'),overlay=$('overlay');
/* Same two-tone wrong / three-tone correct feedback as approved Shape Sorter. */
function play(ok){try{const AC=window.AudioContext||window.webkitAudioContext;audioCtx ||= new AC();if(audioCtx.state==='suspended')audioCtx.resume();for(const [hz,delay] of (ok?[[523,0],[784,.10],[1046,.2]]:[[392,0],[330,.13]])){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+.01+delay;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.23)}}catch(e){}}
function stars(){try{const v=Number(localStorage.getItem(STAR_KEY)||0);$('stars').textContent='⭐ '+(Number.isFinite(v)&&v>=0?v:0)}catch{$('stars').textContent='⭐ 0'}}
function awardStars(amount){if(rewardGranted)return;rewardGranted=true;try{const previous=Number(localStorage.getItem(STAR_KEY)||0);const base=Number.isFinite(previous)&&previous>=0?previous:0;localStorage.setItem(STAR_KEY,String(base+amount))}catch{}}
function showReward(){if(rewardGranted)return;completedSets=Math.min(5,completedSets+1);const count=completedSets;const final=count===5;$('rewardStage').textContent='Փուլ '+count+' / 5';$('trophy').hidden=!final;const medal=$('medal');medal.replaceChildren();for(let i=0;i<count;i++){const s=document.createElement('span');s.className='earned-star';s.textContent='⭐';s.style.animationDelay=(i*.12)+'s';medal.append(s)}$('message').textContent=final?'Հաղթանակ․ ավարտեցիր բոլոր 5 փուլերը։ Վաստակեցիր 5 աստղ':'Վաստակեցիր '+count+' աստղ';$('continue').textContent=final?'Կրկին խաղալ ↻':'Շարունակել →';const sparkles=$('sparkles');sparkles.replaceChildren();for(let i=0;i<18;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=i%3===0?'✦':'✨';s.style.left=(5+(i*37)%90)+'%';s.style.animationDelay=((i*137)%1900/1000)+'s';s.style.animationDuration=(2.2+(i%4)*.35)+'s';sparkles.append(s)}overlay.hidden=false;victorySound();awardStars(count);flyRewardStars(count)}
function flyRewardStars(count){const origin=$('medal').getBoundingClientRect(),destination=$('stars').getBoundingClientRect();const total=Math.min(count,30);for(let i=0;i<total;i++){const star=document.createElement('span');star.className='reward-fly';star.textContent='⭐';star.style.left=(origin.left+origin.width*(i+.5)/(total+1))+'px';star.style.top=(origin.top+origin.height*.35)+'px';document.body.append(star);rewardAnimations.add(star);const dx=destination.left+destination.width*.35-(origin.left+origin.width*(i+.5)/(total+1)),dy=destination.top+destination.height*.3-(origin.top+origin.height*.35);const anim=star.animate([{transform:'translate3d(0,0,0) scale(1)',opacity:1},{transform:'translate3d('+dx*.45+'px,'+(dy*.15-45)+'px,0) scale(1.25)',opacity:1,offset:.45},{transform:'translate3d('+dx+'px,'+dy+'px,0) scale(.35)',opacity:0}],{duration:1100,delay:250+i*170,easing:'cubic-bezier(.24,.6,.32,1)',fill:'forwards'});anim.finished.catch(()=>{}).then(()=>{star.remove();rewardAnimations.delete(star);if(active)stars()})}if(count>total)stars()}
function victorySound(){try{const AC=window.AudioContext||window.webkitAudioContext;audioCtx ||= new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime+.03;for(const [i,hz] of [523.25,659.25,783.99,1046.5,1318.51].entries()){const t=now+i*.15,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+(i===4?.62:.28));o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+(i===4?.64:.30))}}catch{}}
function clearWrong(b){const t=wrongTimers.get(b);if(t)clearTimeout(t);wrongTimers.delete(b);b.classList.remove('wrong')}
function draw(){if(!active)return;locked=false;hinted=false;overlay.hidden=true;const r=rounds[index];$('progress').textContent='Փուլ '+(completedSets+1)+' / 5 · Հարց '+(index+1)+' / '+rounds.length;$('stage').className='stage '+r.kind;shadowMotion.className='shadow-motion';shadowFloat.className='shadow-float';shadow.textContent=r.answer;shadowColor.textContent=r.answer;options.replaceChildren();for(const emoji of r.options){const b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-label','Ընտրել '+emoji);const s=document.createElement('span');s.textContent=emoji;b.append(s);b.addEventListener('click',()=>choose(b,emoji));options.append(b)}}
function choose(b,emoji){if(!active||locked)return;const right=emoji===rounds[index].answer;if(!right){play(false);clearWrong(b);void b.offsetWidth;b.classList.add('wrong');wrongTimers.set(b,setTimeout(()=>clearWrong(b),480));return}locked=true;play(true);for(const option of options.children)clearWrong(option);b.classList.add('correct');clearTimeout(feedbackTimer);
 shadowMotion.classList.add('reveal');
 feedbackTimer=setTimeout(()=>{if(!active)return;if(index===rounds.length-1){showReward();return}shadowFloat.classList.add('leaving');feedbackTimer=setTimeout(()=>{if(!active)return;index++;draw()},650)},2500)}
$('continue').addEventListener('click',()=>{if(!active)return;if(overlay.hidden||!rewardGranted)return;if(completedSets>=5)completedSets=0;index=0;rewardGranted=false;rounds.length=0;makeRounds();draw()});$('hint').addEventListener('click',()=>{if(locked)return;const r=rounds[index];for(const b of options.children){if(b.textContent===r.answer){b.animate([{boxShadow:'0 0 0 0 #8ef2a6'},{boxShadow:'0 0 0 10px #8ef2a6aa'},{boxShadow:'0 0 0 0 #8ef2a6'}],{duration:1100,iterations:2});break}}});$('back').addEventListener('click',()=>{active=false;clearTimeout(feedbackTimer);for(const star of rewardAnimations)star.remove();rewardAnimations.clear();window.parent.postMessage({type:'areg-mind-shadow-back'},location.origin)});stars();draw();
</script></body></html>
