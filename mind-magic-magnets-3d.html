<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Կախարդական մագնիսներ 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#1d4057;color:white;font:700 15px system-ui}#app{height:100dvh;display:flex;flex-direction:column;padding:9px;gap:8px}#top,#buttons{display:flex;gap:8px;align-items:center;justify-content:space-between}#top span,button{border:3px solid #e8c18a;border-radius:13px;background:linear-gradient(#fff0c9,#d29b60);color:#704523;padding:10px;font:800 14px system-ui}#scene{position:relative;flex:1;min-height:220px;overflow:hidden;border:5px solid #c79761;border-radius:25px;background:radial-gradient(#85b4bd,#28516f 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}#buttons button{flex:1}#note{position:absolute;top:12px;left:0;right:0;text-align:center;text-shadow:0 2px 4px #0009;pointer-events:none}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#0a223bc9}#overlay.show{display:grid}.modal{text-align:center;background:linear-gradient(#fff1d3,#deb078);border:6px solid #a46b3f;border-radius:23px;padding:24px;color:#704421}.modal h2{margin:10px}.award{font-size:65px}#next{background:linear-gradient(#b8fb92,#43bd62)}
</style></head><body><div id="app"><div id="top"><span id="phase">Փուլ 1 / 5</span><b>Գնդիկները տար օղակների մեջ</b><span id="score">0 / 2</span></div><div id="scene"><div id="note">Մատով քաշիր մագնիսը</div><div id="overlay"><div class="modal"><div class="award" id="award">⭐</div><h2>Ապրե՛ս</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="buttons"><button id="polarity">🧲 Ձգել</button><button id="reset">⟳ Կրկնել</button><button id="hint">💡 Հուշում</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#scene'),colors=[0xff6284,0x53d6f4,0xffc45d,0xae8cff,0x6de0a1],counts=[2,3,3,4,5],scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.domElement.style.position='absolute';renderer.domElement.style.inset=0;host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x22445a,2.8));const light=new THREE.DirectionalLight(0xffe6b8,3);light.position.set(-5,7,8);scene.add(light);
const root=new THREE.Group();scene.add(root),wood=new THREE.MeshStandardMaterial({color:0xa4744d,roughness:.65}),gold=new THREE.MeshStandardMaterial({color:0xecc47c,metalness:.65,roughness:.28}),blue=new THREE.MeshStandardMaterial({color:0x48b9ee,metalness:.3,roughness:.3}),red=new THREE.MeshStandardMaterial({color:0xf05b67,metalness:.3,roughness:.3});
const board=new THREE.Mesh(new THREE.BoxGeometry(9,11,.45),wood);board.position.z=-.5;root.add(board);const floor=new THREE.Mesh(new THREE.BoxGeometry(8.6,10.6,.1),new THREE.MeshStandardMaterial({color:0x3d7782,roughness:.52}));floor.position.z=-.22;root.add(floor);
const magnet=new THREE.Group();root.add(magnet);for(const [x,y,w,h,m] of [[-.4,0,.42,1.25,red],[.4,0,.42,1.25,blue],[0,-.5,1.22,.38,gold]]){const piece=new THREE.Mesh(new THREE.BoxGeometry(w,h,.55),m);piece.position.set(x,y,.3);magnet.add(piece)}
const sphereGeo=new THREE.SphereGeometry(.34,28,20),ballMats=colors.map(c=>new THREE.MeshPhysicalMaterial({color:c,metalness:.3,roughness:.12,clearcoat:1})),ringGeo=new THREE.TorusGeometry(.55,.11,12,48);
let stage=0,balls=[],targets=[],polarity=1,drag=false,won=false,score=0,last=0;
function clear(){for(const b of balls)root.remove(b.mesh);for(const t of targets){root.remove(t.mesh);t.mesh.geometry.dispose();t.mesh.material.dispose()}balls=[];targets=[]}
function start(){clear();polarity=1;drag=false;won=false;score=0;magnet.position.set(0,-3.5,.2);$('#polarity').textContent='🧲 Ձգել';$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#score').textContent='0 / '+counts[stage];$('#overlay').classList.remove('show');const n=counts[stage];for(let i=0;i<n;i++){const x=-3+i*6/Math.max(1,n-1),y=3.4-(i%2)*.4;const ring=new THREE.Mesh(ringGeo,new THREE.MeshStandardMaterial({color:colors[i],emissive:colors[i],emissiveIntensity:.2}));ring.position.set(x,y,.08);root.add(ring);targets.push({mesh:ring,done:false});const b=new THREE.Mesh(sphereGeo,ballMats[i]);b.position.set(-2.8+i*5.6/Math.max(1,n-1),-.8+(i%2)*.7,.4);root.add(b);balls.push({mesh:b,v:new THREE.Vector2(),done:false})}}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3();
function world(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);ray.ray.intersectPlane(plane,hit);return hit}
renderer.domElement.addEventListener('pointerdown',e=>{if(won)return;const p=world(e);if(Math.hypot(p.x-magnet.position.x,p.y-magnet.position.y)<1.4){drag=true;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const p=world(e);magnet.position.x=THREE.MathUtils.clamp(p.x,-3.7,3.7);magnet.position.y=THREE.MathUtils.clamp(p.y,-4.3,4.4)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
$('#polarity').onclick=()=>{polarity*=-1;$('#polarity').textContent=polarity===1?'🧲 Ձգել':'🧲 Վանել'};$('#reset').onclick=start;$('#hint').onclick=()=>{$('#note').textContent='Ձգիր գնդակը դեպի իր գույնի օղակը';setTimeout(()=>$('#note').textContent='Մատով քաշիր մագնիսը',1800)};$('#next').onclick=()=>{stage=(stage+1)%5;start()};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const a=Math.tan(THREE.MathUtils.degToRad(37/2));camera.position.set(0,0,Math.max(6/a,4.8/(a*camera.aspect)));camera.lookAt(0,0,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.035,(t-last||16)/1000);last=t;for(let i=0;i<balls.length;i++){const b=balls[i];if(b.done)continue;const p=b.mesh.position,dx=magnet.position.x-p.x,dy=magnet.position.y-p.y,d=Math.max(.5,Math.hypot(dx,dy)),force=polarity*15/(d*d+1.3);b.v.x=(b.v.x+dx/d*force*dt)*Math.exp(-2.7*dt);b.v.y=(b.v.y+dy/d*force*dt)*Math.exp(-2.7*dt);b.v.clampLength(0,3.5);p.x=THREE.MathUtils.clamp(p.x+b.v.x*dt,-3.8,3.8);p.y=THREE.MathUtils.clamp(p.y+b.v.y*dt,-4.6,4.65);b.mesh.rotation.y+=b.v.x*dt;const goal=targets[i];if(!goal.done&&Math.hypot(p.x-goal.mesh.position.x,p.y-goal.mesh.position.y)<.43){goal.done=true;b.done=true;p.copy(goal.mesh.position);p.z=.4;score++;$('#score').textContent=score+' / '+counts[stage];if(score===counts[stage]){won=true;setTimeout(()=>{$('#award').textContent=stage===4?'🏆':'⭐';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')},650)}}}renderer.render(scene,camera)}start();requestAnimationFrame(tick);
</script></body></html>
