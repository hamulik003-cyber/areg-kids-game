<path d="M242 112Q253 95 281 94L303 94L303 150L203 150Z" fill="url(#glass)" stroke="#486073" stroke-width="5" stroke-linejoin="round"/>
<path d="M317 94L355 94Q376 94 389 112L420 151L317 151Z" fill="url(#glass)" stroke="#486073" stroke-width="5" stroke-linejoin="round"/>
