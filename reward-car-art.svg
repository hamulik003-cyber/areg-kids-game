<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" data-facing="right" aria-label="Կարմիր մուլտային մեքենա՝ առջևը աջ կողմում" preserveAspectRatio="xMidYMid meet">
<defs>
 <linearGradient id="paint" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#ff7963"/><stop offset=".45" stop-color="#f53e39"/><stop offset="1" stop-color="#b91834"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff8e70"/><stop offset="1" stop-color="#e82b32"/></linearGradient>
 <linearGradient id="glass" x1=".2" y1="0" x2=".85" y2="1"><stop stop-color="#c3f5f3"/><stop offset=".45" stop-color="#6cbbd4"/><stop offset="1" stop-color="#30789f"/></linearGradient>
 <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c4752"/><stop offset=".7" stop-color="#141e2a"/><stop offset="1" stop-color="#0e1620"/></linearGradient>
 <radialGradient id="hub"><stop stop-color="#fafaf0"/><stop offset=".8" stop-color="#bfcbd4"/><stop offset="1" stop-color="#8493a0"/></radialGradient>
</defs>
<!-- Single shared artwork in the reward card and the animated scene. Clear front RIGHT: sloping windshield, pronounced long bonnet, white headlamp and dark grille. Rear LEFT: red vertical tail lamp and exhaust. -->
<path d="M74 214L74 188Q76 175 91 172L173 163L210 108Q230 77 272 77L356 77Q387 79 406 105L445 158L495 173Q526 184 530 210L532 235Q532 258 505 259L100 259Q74 257 74 238Z" fill="url(#paint)" stroke="#8b1f32" stroke-width="5" stroke-linejoin="round"/>
