<path d="M117 185Q250 173 426 183L492 182" stroke="#ffd2b2" stroke-width="6" stroke-linecap="round" opacity=".44" fill="none"/>
<!-- Forward-sloping windshield / bonnet seam is visually asymmetric --> 
<path d="M432 160L448 167L494 174M448 188Q475 187 504 197" stroke="#a21d33" stroke-width="5" fill="none" opacity=".82" stroke-linecap="round"/>
<path d="M433 158L453 165L482 169" stroke="#ffaaa0" stroke-width="3" fill="none" opacity=".68"/>
<path d="M100 230L492 230" stroke="#821a2c" stroke-width="4" opacity=".6"/>
<path d="M105 251L493 251" stroke="#f7645b" stroke-width="5" opacity=".5"/>
<path d="M185 174L179 230M422 174L423 229" stroke="#a21c30" stroke-width="3" opacity=".35"/>
<rect x="322" y="181" width="27" height="7" rx="3.5" fill="#ffddbd" opacity=".93"/>
<path d="M361 171L385 173L398 180L382 184L360 180Z" fill="#c82935" stroke="#92263a" stroke-width="2"/>
<ellipse cx="376" cy="180" rx="9" ry="3" fill="#f18f76" opacity=".8"/>
<g id="areg-car-front" data-end="front" data-direction="right">
<!-- Large unmistakable white headlight; the front of the car is on the RIGHT -->
<path id="areg-front-headlight" d="M482 183Q504 180 518 193L518 203Q500 210 483 203Q478 193 482 183Z" fill="#fff6c5" stroke="#b77955" stroke-width="3" stroke-linejoin="round"/>
