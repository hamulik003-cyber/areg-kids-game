<path d="M72 179Q82 175 92 183L94 211L75 215Z" fill="#9b2630" stroke="#76212c" stroke-width="2.5"/>
<path d="M76 181L90 185L90 203L76 208Z" fill="#ff654e" stroke="#ffd0a0" stroke-width="2"/>
