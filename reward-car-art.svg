<g class="areg-car-wheel" data-wheel="front" transform="translate(420 249)">
 <circle r="47" fill="url(#tire)" stroke="#1a2430" stroke-width="4"/>
 <circle r="31" fill="#858e93"/><circle r="27" fill="url(#hub)"/>
 <g fill="#5e707d"><rect x="-4" y="-25" width="8" height="19" rx="3"/><rect x="-4" y="6" width="8" height="19" rx="3"/><rect x="-25" y="-4" width="19" height="8" rx="3"/><rect x="6" y="-4" width="19" height="8" rx="3"/></g>
 <circle r="8" fill="#e8eded" stroke="#909faa" stroke-width="2"/>
</g>
</svg>