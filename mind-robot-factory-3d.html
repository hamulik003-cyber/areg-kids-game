<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Փոքրիկ ռոբոտի գործարան 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#1c415d;color:white}#app{height:100dvh;max-width:700px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:8px}#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:900;font-size:13px}#hud span{background:linear-gradient(#fff2ce,#d6a16b);border:3px solid #b47e49;border-radius:13px;padding:9px;color:#744621}#hud b{text-align:center}#stage{position:relative;flex:1;min-height:220px;border:5px solid #ca9863;border-radius:25px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#8cb9c9,#3b718c 72%,#1a425e)}canvas{display:block;width:100%;height:100%;touch-action:none}#tip{position:absolute;top:9px;left:8px;right:8px;text-align:center;text-shadow:0 2px 5px #0008;font-weight:850;font-size:13px;pointer-events:none}#parts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}#parts button,#actions button{border:3px solid #ffe2af;border-bottom:5px solid #99633c;background:linear-gradient(#fff1d0,#d6a16a);color:#714423;border-radius:14px;font:800 12px system-ui;padding:8px 3px;min-height:56px}#parts button.active{background:linear-gradient(#e6ffe1,#81da83);border-color:#d5ffc6;color:#226239}#actions{display:flex;gap:6px}#actions button{flex:1;min-height:44px}#actions #activate{background:linear-gradient(#baff9a,#3bbb61);border-color:#d6ffc0;color:#1a5a32}#overlay{position:absolute;inset:0;background:#102b43d2;display:none;align-items:center;justify-content:center;padding:20px}#overlay.show{display:flex}.panel{width:100%;max-width:340px;text-align:center;background:linear-gradient(#fff1d1,#e5b57b);border:7px solid #a46f3e;border-radius:25px;padding:22px;color:#714421}.panel h2{margin:8px 0 18px}.panel .award{font-size:75px}#next{font:900 18px system-ui;padding:12px 20px;border-radius:14px;border:3px solid #d6ffb9;background:linear-gradient(#b8ff94,#39bd5f);color:#1a5e31}@media(max-height:690px){#app{gap:4px}#parts button{min-height:42px;padding:4px 2px}#actions button{min-height:35px;padding:4px}}
</style></head><body><div id="app"><div id="hud"><span id="phase">Փուլ 1 / 5</span><b>Փոքրիկ ռոբոտի գործարան 3D</b><span id="progress">0 / 5</span></div><div id="stage"><div id="tip">Ընտրիր դետալը, հետո սեղմիր ռոբոտի համապատասխան տեղը</div><div id="overlay"><div class="panel"><div class="award" id="award">⭐</div><h2 id="message">Ռոբոտը պատրաստ է</h2><button id="next">Շարունակել ✓</button></div></div></div><div id="parts"><button data-part="head">🤖 Գլուխ</button><button data-part="leftArm">🦾 Ձեռք 1</button><button data-part="rightArm">🦾 Ձեռք 2</button><button data-part="leftLeg">🦿 Ոտք 1</button><button data-part="rightLeg">🦿 Ոտք 2</button></div><div id="actions"><button id="undo">↶ Հետ</button><button id="hint">💡 Հուշում</button><button id="activate">▶ Կենդանացնել</button><button id="reset">⟳ Նորից</button></div></div><script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),host=$('#stage'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.domElement.style.position='absolute';renderer.domElement.style.inset=0;host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8faff,0x29465b,2.7));const key=new THREE.DirectionalLight(0xffe5b9,3.4);key.position.set(-5,8,9);scene.add(key);const rim=new THREE.DirectionalLight(0x83dbff,1.8);rim.position.set(5,4,-6);scene.add(rim);
const root=new THREE.Group();scene.add(root);const palette=[0x55c9dc,0xf2a05f,0x9b8bea,0x80d899,0xee819d],gold=new THREE.MeshStandardMaterial({color:0xf6c77e,metalness:.6,roughness:.27}),dark=new THREE.MeshStandardMaterial({color:0x344e67,metalness:.45,roughness:.32}),floorMat=new THREE.MeshStandardMaterial({color:0xa4754e,roughness:.64});
const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.45,3.7,.38,64),floorMat);floor.position.y=-2.85;root.add(floor);const platform=new THREE.Mesh(new THREE.CylinderGeometry(2.85,2.95,.12,64),gold);platform.position.y=-2.59;root.add(platform);
function box(parent,w,h,d,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
function ball(parent,r,mat,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat);m.position.set(x,y,z);parent.add(m);return m}
const robot=new THREE.Group();root.add(robot);const bodyMat=new THREE.MeshStandardMaterial({color:palette[0],metalness:.27,roughness:.32}),body=box(robot,1.6,1.55,.95,bodyMat,0,.0,0);box(robot,1.04,.65,.06,dark,0,.16,.51);for(const x of [-.32,0,.32])ball(robot,.12,gold,x,.18,.57);const antenna=box(robot,.09,.42,.09,gold,0,2.15,0);ball(robot,.17,gold,0,2.43,0);
const sockets={},pieces={},positions={head:[0,1.47,0],leftArm:[-1.17,.13,0],rightArm:[1.17,.13,0],leftLeg:[-.46,-1.47,0],rightLeg:[.46,-1.47,0]};
for(const [name,[x,y,z]] of Object.entries(positions)){const socket=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),new THREE.MeshStandardMaterial({color:0xfee2a5,emissive:0x745b21,emissiveIntensity:.3}));socket.position.set(x,y,z);robot.add(socket);socket.userData.part=name;sockets[name]=socket}
const partsOrder=Object.keys(positions);let stage=0,selected='head',installed=[],animating=false,celebrating=false,animTime=0,wrong=0;
function partMesh(name){const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color:palette[stage],metalness:.25,roughness:.3});if(name==='head'){box(g,1.35,1.08,.91,m,0,0,0);const face=box(g,1.02,.59,.07,dark,0,-.03,.5);for(const x of [-.28,.28])ball(g,.13,new THREE.MeshStandardMaterial({color:0x7df6fa,emissive:0x32a8ca,emissiveIntensity:.9}),x,.02,.56);box(g,.33,.05,.08,gold,0,-.27,.56)}else if(name.includes('Arm')){box(g,.47,1.17,.53,m,0,-.3,0);ball(g,.27,gold,0,-.92,0);ball(g,.27,gold,0,.33,0)}else{box(g,.53,1.18,.64,m,0,-.35,0);box(g,.72,.26,.88,dark,0,-1,.14);ball(g,.26,gold,0,.34,0)}return g}
function setSelected(name){selected=name;document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('active',b.dataset.part===name));$('#tip').textContent='Սեղմիր ռոբոտի '+({head:'գլխի',leftArm:'ձախ ձեռքի',rightArm:'աջ ձեռքի',leftLeg:'ձախ ոտքի',rightLeg:'աջ ոտքի'})[name]+' տեղը'}
function start(){for(const p of Object.values(pieces))robot.remove(p);for(const k of Object.keys(pieces))delete pieces[k];installed=[];animating=false;celebrating=false;animTime=0;wrong=0;robot.rotation.set(0,0,0);robot.position.y=0;bodyMat.color.setHex(palette[stage]);$('#overlay').classList.remove('show');$('#phase').textContent='Փուլ '+(stage+1)+' / 5';$('#progress').textContent='0 / 5';for(const s of Object.values(sockets))s.visible=true;setSelected('head')}
function install(name){if(celebrating||installed.includes(name))return;const group=partMesh(name);group.position.set(...positions[name]);robot.add(group);pieces[name]=group;installed.push(name);sockets[name].visible=false;$('#progress').textContent=installed.length+' / 5';const next=partsOrder.find(p=>!installed.includes(p));if(next)setSelected(next);else $('#tip').textContent='Ռոբոտը հավաքված է․ սեղմիր «Կենդանացնել»'}
document.querySelectorAll('#parts button').forEach(b=>b.onclick=()=>setSelected(b.dataset.part));
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(celebrating)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(Object.values(sockets).filter(s=>s.visible),false)[0];if(hit){const name=hit.object.userData.part;if(name===selected)install(name);else{$('#tip').textContent='Ընտրված դետալի համապատասխան տեղը գտիր';wrong++}}});
$('#undo').onclick=()=>{if(celebrating||!installed.length)return;const name=installed.pop();robot.remove(pieces[name]);delete pieces[name];sockets[name].visible=true;$('#progress').textContent=installed.length+' / 5';setSelected(name)};$('#hint').onclick=()=>{if(celebrating)return;const socket=sockets[selected];if(!socket.visible)return;socket.scale.setScalar(1.8);setTimeout(()=>socket.scale.setScalar(1),850)};$('#reset').onclick=start;$('#next').onclick=()=>{stage=(stage+1)%5;start()};
$('#activate').onclick=()=>{if(celebrating)return;if(installed.length!==5){$('#tip').textContent='Նախ հավաքիր բոլոր 5 դետալները';return}celebrating=true;animTime=0;$('#tip').textContent='Ռոբոտը կենդանանում է և պարում է'};
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const t=Math.tan(THREE.MathUtils.degToRad(35/2));camera.position.set(0,1.15,Math.max(9.6,4.5/(t*Math.min(1,camera.aspect))));camera.lookAt(0,-.05,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
let last=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(.045,(t-last||16)/1000);last=t;if(celebrating){animTime+=dt;robot.rotation.y=Math.sin(animTime*3)*.55;robot.rotation.z=Math.sin(animTime*7)*.13;robot.position.y=.18+Math.abs(Math.sin(animTime*5))*.25;for(const name of ['leftArm','rightArm'])if(pieces[name])pieces[name].rotation.z=Math.sin(animTime*7+(name==='leftArm'?0:Math.PI))*.55;if(animTime>4.1&&!$('#overlay').classList.contains('show')){$('#award').textContent=stage===4?'🏆':'⭐';$('#message').textContent=stage===4?'Բոլոր ռոբոտները պատրաստ են':'Ռոբոտը կենդանացավ';$('#next').textContent=stage===4?'Կրկին խաղալ':'Շարունակել ✓';$('#overlay').classList.add('show')}}else robot.rotation.y=Math.sin(t*.0003)*.1;renderer.render(scene,camera)}start();requestAnimationFrame(tick);
</script></body></html>
